<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선수 스탯 · 픽다운</title>
<link rel="stylesheet" href="/site.css">
<style>
.bxov{position:fixed;inset:0;z-index:230;background:rgba(4,7,14,.74);display:none;
 align-items:center;justify-content:center;padding:16px}
.bxov.on{display:flex}
.bxpnl{position:relative;background:#111726;border:1px solid #243049;border-radius:12px;
 width:min(1600px,96vw);max-height:94vh;overflow:auto;container-type:inline-size;
 color:#f1f4fa;font-family:inherit;--tc:#2b5fd9}
/* 패널은 크게 — 2026-11-21 사용자 "패스맵이 작아서 좀더 크게" · "다른 팝업들도 다 사이즈를 키워도".
   QB 는 패스맵이 넓어 더 넓게 씁니다. */
.bxpnl.k-qb{width:min(1780px,97vw)}
.bxpnl .x{position:absolute;top:16px;right:20px;background:none;border:0;color:#7d8ca8;
 font:inherit;font-size:30px;line-height:1;cursor:pointer;z-index:2}
.bxpnl .x:hover{color:#f1f4fa}
.bxin{display:flex;gap:28px;align-items:flex-start;padding:28px 30px 30px}
.bxload{padding:40px;color:#7d8ca8;font-weight:700}
.bxpnl .pf{width:240px;flex:none}
.bxpnl .pshot{position:relative;width:100%;aspect-ratio:4/5;border:1px solid #243049;border-radius:10px;
 overflow:hidden;background:#0e1422;display:grid;place-items:center}
.bxpnl .pshot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;
 display:block;background:#0e1422}
.bxpnl .pshot .gh{font-size:64px;font-weight:800;color:#2a3550}
.bxpnl .pname{margin-top:14px;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.bxpnl .psmp{display:inline-block;margin-left:8px;padding:2px 7px;border:1px solid #6b5a1e;
 border-radius:6px;font-size:12px;font-weight:800;color:#e3c45a;vertical-align:4px;letter-spacing:.04em}
.bxpnl .ppos{margin-top:7px;font-size:16px;font-weight:700;color:var(--tc);letter-spacing:.06em}
.bxpnl .pline{margin-top:6px;font-size:15px;font-weight:600;color:#7d8ca8;line-height:1.45}
.bxpnl .pgame{margin-top:14px;padding:8px 11px;border:1px solid #243049;border-radius:8px;
 font-size:14px;color:#7d8ca8;font-weight:700}
.bxpnl .pgame b{color:#f1f4fa}
.bxpnl .pmain{flex:1;min-width:0}
/* 종류 단추 — 보드 로스터에서 연 시즌 패널. 보드 탭(.cbtn)과 같은 모양, 오른쪽 끝은 예전 패널. */
.bxpnl .pkb{display:flex;align-items:center;gap:6px;margin:0 44px 14px 0;flex-wrap:wrap}
.bxpnl .pk{background:#182135;border:1px solid #243049;color:#7d8ca8;font:inherit;font-size:15px;
 font-weight:800;padding:7px 20px;border-radius:7px;cursor:pointer;letter-spacing:-.01em}
.bxpnl .pk:hover{color:#f1f4fa}
.bxpnl .pk[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#fff}
.bxpnl .pk.pkalt{margin-left:auto;background:none;font-size:13.5px;font-weight:700;padding:6px 14px;
 border-radius:999px}
.bxpnl .pk.pkalt:hover{border-color:var(--tc)}
.bxpnl .pfil{display:flex;flex-wrap:wrap;gap:8px 10px;padding:0 40px 12px 0;margin-bottom:14px;
 border-bottom:2px solid var(--tc)}
.bxpnl .pkb+.pfil{padding-right:0}
/* 필터 묶음 — 옅은 상자 하나에 묶음 이름(흰 굵은 글씨 · 세로 구분선)과 칩. 이름이 칩처럼 보이지 않게
   (2026-11-21 사용자 "구분 섹션이 … 옵션 중 하나로 보여 구분 제목을 좀 구분"). */
.bxpnl .pfg{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:#0d1322;border:1px solid #222d45;
 border-radius:10px;padding:4px 5px 4px 11px}
.bxpnl .pfg>span{font-size:13px;color:#f1f4fa;font-weight:800;margin-right:5px;padding-right:10px;
 border-right:1px solid #2c3858;line-height:1.3;white-space:nowrap}
.bxpnl .chip{background:#182135;border:1px solid #243049;color:#7d8ca8;font:inherit;font-size:13.5px;
 font-weight:700;padding:5px 11px;border-radius:999px;cursor:pointer}
.bxpnl .chip[aria-pressed="true"]{color:#f1f4fa;border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}
.bxpnl .pbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,520px);gap:28px;
 align-items:start}
.bxpnl .pbody.k-rush{grid-template-columns:minmax(300px,.6fr) minmax(0,1.4fr)}
.bxpnl .pbody.k-qb{grid-template-columns:minmax(340px,.8fr) minmax(0,1.55fr)}
.bxpnl table.pst{width:100%;border-collapse:collapse}
.bxpnl .pst th,.bxpnl .pst td{padding:10px 12px;border-bottom:1px solid #243049;font-size:17px;
 line-height:1.3;text-align:right;white-space:nowrap}
.bxpnl .pst thead th{font-size:13px;color:#7d8ca8;font-weight:700;letter-spacing:.06em;padding-top:0}
.bxpnl .pst thead th b{display:block;color:#f1f4fa;font-size:16px;letter-spacing:0}
.bxpnl .pst th:first-child{text-align:left;color:#7d8ca8;font-weight:600}
.bxpnl .pst td{font-variant-numeric:tabular-nums;font-weight:700}
.bxpnl .pst td small{font-size:12.5px;color:#7d8ca8;font-weight:600;margin-left:4px}
.bxpnl .pst td.hot{color:#ff4d4f}
.bxpnl .pst td.na{color:#3c4761}
.bxpnl .pst .rk{font-size:13px;color:#7d8ca8;font-weight:600;margin-left:5px}
.bxpnl .pst tr.gh th{padding:16px 10px 6px;font-size:16.5px;font-weight:800;color:#f1f4fa;
 border-bottom:1px solid rgba(255,255,255,.13)}
.bxpnl .pst tr.gh th small{font-size:12.5px;color:#7d8ca8;font-weight:600;margin-left:6px}
.bxpnl .pst tr.gh td{border-bottom:0}
.bxpnl .pst tbody tr.gh:first-child th{padding-top:4px}
.bxpnl .pscope{display:flex;gap:6px;margin-bottom:8px}
.bxpnl .pmapbox{position:relative}
.bxpnl svg.pfld{display:block;width:100%;height:auto;border-radius:10px;border:1px solid #243049;
 background:#0c1220}
/* 맵의 가지 — 올리면 그 가지만 밝게, 누르면 고정(.pin) · 고정한 동안 나머지는 옅게. */
.bxpnl svg.pfld .hb{cursor:pointer;transition:opacity .15s}
.bxpnl svg.pfld .hb:focus{outline:none}
.bxpnl svg.pfld.pinned .hb:not(.pin){opacity:.34}
.bxpnl svg.pfld.hov .hb:not(.on):not(.pin){opacity:.14}
.bxpnl svg.pfld .hb.on,.bxpnl svg.pfld .hb.pin{opacity:1}
.bxpnl svg.pfld .hb .pl rect{transition:stroke .15s}
.bxpnl svg.pfld .hb.on .pl rect,.bxpnl svg.pfld .hb.pin .pl rect,
.bxpnl svg.pfld .hb:focus-visible .pl rect{stroke:var(--tc);stroke-opacity:1}
.bxpnl .ptip{position:absolute;pointer-events:none;z-index:5;background:#0b1120;border:1px solid #33415f;
 border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;min-width:190px;
 box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
.bxpnl .ptip .tt,.bxpnl .ppin .tt{font-weight:800;font-size:14.5px;margin-bottom:6px}
.bxpnl .ptip .tt i,.bxpnl .ppin .tt i{font-style:normal;color:#7d8ca8;font-weight:700;font-size:12.5px;
 margin-left:6px}
.bxpnl .ptip table{border-collapse:collapse;width:100%}
.bxpnl .ptip td{padding:2px 0;font-variant-numeric:tabular-nums}
.bxpnl .ptip td:first-child{color:#7d8ca8;font-weight:600;padding-right:16px}
.bxpnl .ptip td:last-child{text-align:right;font-weight:800}
/* 고정한 가지의 기록 — 누른 자리에 그대로 남는 카드(× 또는 그 가지를 다시 누르면 풀림). */
.bxpnl .ppin{position:absolute;z-index:4;background:#0b1120;border:1px solid var(--tc);border-radius:10px;
 padding:10px 12px 11px;font-size:13.5px;line-height:1.5;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.bxpnl .ppin .tt{padding-right:24px}
.bxpnl .ppin table{border-collapse:collapse;width:100%}
.bxpnl .ppin td{padding:2px 0;font-variant-numeric:tabular-nums}
.bxpnl .ppin td:first-child{color:#7d8ca8;font-weight:600;padding-right:16px}
.bxpnl .ppin td:last-child{text-align:right;font-weight:800}
.bxpnl .pinx{position:absolute;top:6px;right:9px;background:none;border:0;color:#7d8ca8;font:inherit;
 font-size:22px;line-height:1;cursor:pointer;padding:2px}
.bxpnl .pinx:hover{color:#f1f4fa}
/* 패스 차트 — 비스듬히 내려다본 필드, 다섯 칸 × 깊이 셋, 칸 위에 숫자만(음영 없음). 올리면 테두리. */
.bxpnl svg.pch{background:#0b1019}
.bxpnl svg.pch .pzq{fill:rgba(0,0,0,0);stroke:transparent;stroke-width:2.5;transition:stroke .12s,fill .12s}
.bxpnl svg.pch .hb.on .pzq,.bxpnl svg.pch .hb.pin .pzq,.bxpnl svg.pch .hb:focus-visible .pzq{
 stroke:var(--tc);fill:rgba(255,255,255,.045)}
.bxpnl svg.pch.hov .hb:not(.on):not(.pin),.bxpnl svg.pch.pinned .hb:not(.pin){opacity:1}
.bxpnl svg.pch .pn1{font-size:28px;font-weight:800;fill:#f1f4fa;font-variant-numeric:tabular-nums}
.bxpnl svg.pch .pn2{font-size:13px;font-weight:700;fill:#9aa6bf}
.bxpnl svg.pch .pcm{font-size:14px;font-weight:800;fill:rgba(255,255,255,.5)}
.bxpnl svg.pch .pcz{font-size:13px;font-weight:700;fill:#5d6b85}
.bxpnl svg.pch .pclos{font-size:14px;font-weight:800;letter-spacing:.06em}
/* 칸을 누르면 뜨는 받은 선수 창 — 얼굴 · 이름 · 캐치/타깃 · 야드. */
.bxpnl .ppin.prp{min-width:250px;max-width:340px;padding:10px 12px 10px;border-color:#33415f}
.bxpnl .ppin.prp .tt{margin-bottom:9px}
.bxpnl .prp-l{display:grid;gap:8px;max-height:330px;overflow:auto}
.bxpnl .prp-r{display:flex;align-items:center;gap:10px}
.bxpnl .prp-r img,.bxpnl .prp-r .gh{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:50% 15%;
 flex:none;background:#1b2438;display:grid;place-items:center;font-size:12px;color:#7d8ca8;font-weight:800}
.bxpnl .prp-r b{display:block;font-size:13.5px;font-weight:800;color:#f1f4fa;line-height:1.25}
.bxpnl .prp-r span{display:block;font-size:12.5px;color:#9aa6bf;font-weight:700;font-variant-numeric:tabular-nums}
.bxpnl .ptag{display:inline-block;margin-top:8px;font-size:12px;color:#5d6b85;font-weight:700}
/* 창 폭에 따라 — 패널 자신의 폭(container)을 봅니다. 좁아지면 맵이 표 밑으로, 더 좁으면
   프로필이 위로 올라가 한 줄 머리가 됩니다. */
@container (max-width:1180px){
  .bxpnl .pbody.k-qb{grid-template-columns:minmax(0,1fr)}
}
@container (max-width:1040px){
  .bxpnl .pbody{grid-template-columns:minmax(0,1fr)}
  .bxpnl .pbody:not(.k-qb) .pmap{max-width:520px}
  .bxpnl .pf{width:200px}
}
@container (max-width:700px){
  .bxin{flex-direction:column;gap:14px;padding:22px 16px 24px}
  .bxpnl .pf{width:100%;display:grid;grid-template-columns:92px minmax(0,1fr);gap:0 14px;
   align-items:start;padding-right:36px}
  .bxpnl .pshot{grid-row:1/span 6}
  .bxpnl .pname{margin-top:0;font-size:22px}
  .bxpnl .pgame{margin-top:8px}
  .bxpnl .pfil,.bxpnl .pkb{padding-right:0;margin-right:0}
  .bxpnl .pst th,.bxpnl .pst td{padding:8px 6px;font-size:14.5px}
  .bxpnl svg.pch .pn1{font-size:46px}
  .bxpnl svg.pch .pn2{display:none}
  .bxpnl svg.pch .pcz,.bxpnl svg.pch .pcm,.bxpnl svg.pch .pclos{font-size:24px}
}

#out th.rn,#out td.rn{width:40px;padding-right:2px;font-size:13px;color:var(--dim);font-weight:700;

#qfil{margin-top:-8px}
#qfil[hidden]{display:none}
#qfil .snote{align-self:center;margin-left:auto}
/* 조건 묶음 — 선수 패널 필터와 같은 모양: 옅은 상자에 묶음 이름(굵은 글씨 · 세로 구분선)과 단추. */

</style></head>

<script>
(function(){
  var t=document.getElementById('navtog'),
      n=document.getElementById('sidenav'),
      o=document.getElementById('navov');
  if(!t||!n||!o) return;
  function set(open){
    t.setAttribute('aria-expanded',String(open));
    t.setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기');
    n.classList.toggle('on',open);
    o.classList.toggle('on',open);
    if(open){ var a=n.querySelector('a'); if(a) a.focus(); } else { t.focus(); }
  }
  t.addEventListener('click',function(){
    set(t.getAttribute('aria-expanded')!=='true');
  });
  o.addEventListener('click',function(){ set(false); });
  addEventListener('keydown',function(e){
    if(e.key==='Escape'&&t.getAttribute('aria-expanded')==='true') set(false);
  });
})();
</script>

<script>
// ── 선수 패널 ── 자료는 누를 때 받습니다(선수 한 명 = 파일 하나).
// 한 덩이로 감쌉니다 — 보드는 스크립트 하나라 같은 이름(RT·f1 등)이 있으면 보드 전체가
// 멈춥니다. 밖으로는 panelOpen·boxPanels·panelIndex 세 이름만 냅니다.
(()=>{
const PJC=new Map();
function pjson(url){
  if(!PJC.has(url)) PJC.set(url,fetch(url).then(r=>r.ok?r.json():null).catch(()=>null));
  return PJC.get(url);
}
// 필터 칸 — content_render.PANEL_FILTERS 를 빌드가 그대로 넣습니다(순위 조합 열쇠와 한 벌).
const PFIL={"rec":[["al","정렬",[["","전체"],["WIDE","와이드"],["SLOT","슬롯"],["TIGHT","타이트"],["BACKFIELD","백필드"]]],["pr","압박",[["","전체"],["1","받음"],["0","안 받음"]]]],"rush":[["qa","대형",[["","전체"],["UNDER_CENTER","언더센터"],["SHOTGUN|PISTOL","샷건"]]],["bx","박스",[["","전체"],["LIGHT","라이트"],["NEUTRAL","보통"],["STACKED","헤비"]]]],"qb":[["qa","대형",[["","전체"],["SHOTGUN","샷건"],["UNDER_CENTER","언더센터"],["PISTOL","피스톨"]]],["pa","플레이액션",[["","전체"],["1","있음"],["0","없음"]]],["pr","압박",[["","전체"],["1","받음"],["0","안 받음"]]],["bl","블리츠",[["","전체"],["1","있음"],["0","없음"]]],["tt","타이밍",[["","전체"],["QUICK","퀵 패스"],["LONG","레이트 패스"]]],["ad","패스 거리",[["","전체"],["S","10야드 미만"],["I","10~19"],["D","20+"]]]]};
const panelIndex=()=>pjson("/panels/index.json");
// 그 경기 박스의 선수 줄 — 패널 목록에 있는 선수(그 종류)만 누를 수 있게 하고,
// 수비 확장 열(압박·미스드 태클)이 있으면 예전 표와 바꿔 끼웁니다.
function boxPanels(root){
  const bx=root&&root.querySelector(".bxroot");
  if(!bx||!bx.dataset.gid||!bx.dataset.season) return;
  const yr=bx.dataset.season, gid=bx.dataset.gid;
  // 목록(/panels/index.json = {시즌:[경기 id…]})에 있는 경기만 받습니다 — 패널이 없는
  // 경기(2025·워크북에 아직 없는 주)에 404 요청을 내지 않게.
  panelIndex().then(all=>{
    if(!all||!(all[yr]||[]).includes(gid)) return null;
    return pjson(`/panels/${encodeURIComponent(yr)}/g_${encodeURIComponent(gid)}.json`);
  }).then(ix=>{
    if(!ix||!bx.isConnected) return;
    bx.querySelectorAll(".pteam[data-pt]").forEach(tm=>{
      const ab=tm.dataset.pt, who=(ix.t||{})[ab]||{}, xs=(ix.x||{})[ab];
      tm.querySelectorAll(".ptr[data-pk]").forEach(r=>{
        const e=who[r.dataset.pn];
        if(!e||!String(e[1]||"").split(" ").includes(r.dataset.pk)) return;
        r.classList.add("clk"); r.dataset.id=e[0];
        r.setAttribute("role","button"); r.tabIndex=0;
      });
      const alt=xs&&tm.querySelector(".ptbl.pxalt");
      if(alt){
        alt.querySelectorAll("[data-x]").forEach(c=>{
          const v=(xs[c.dataset.n]||{})[c.dataset.x];
          c.textContent=v==null?"—":String(v);
        });
        tm.querySelectorAll(".ptbl.pxbase").forEach(b=>b.hidden=true);
        alt.hidden=false;
      }
    });
  });
}

let PS=null, PSH=null, PTOK=0, GID=0;
function pnlShell(){
  if(PSH) return PSH;
  const ov=document.createElement("div");
  ov.className="bxov";
  ov.innerHTML=`<div class="bxpnl" role="dialog" aria-modal="true" aria-label="선수 기록"></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{ if(e.target===ov) pnlClose(); });
  addEventListener("keydown",e=>{ if(e.key==="Escape"&&ov.classList.contains("on")) pnlClose(); });
  const el=ov.firstElementChild;
  el.addEventListener("click",pnlClick);
  el.addEventListener("keydown",e=>{          // 맵 가지 — Enter·Space 로도 고정(가지 옆에)
    const hb=(e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest(".hb");
    if(!hb) return;
    e.preventDefault();
    const box=el.querySelector(".pmapbox"), b=box&&box.getBoundingClientRect(), r=hb.getBoundingClientRect();
    pnlPin(hb.dataset.h,b?r.right-b.left+8:8,b?r.top-b.top:8);
  });
  el.addEventListener("mousemove",pnlHover);
  el.addEventListener("mouseleave",()=>pnlTip(null));
  PSH={ov,el};
  return PSH;
}
function pnlClose(){ if(PSH) PSH.ov.classList.remove("on"); PS=null; PTOK++; }
// 자료 줄은 [값…] 배열로 옵니다. 한 번 열 때 cols 이름으로 객체로 바꿔 둡니다.
function pnlRows(K){
  const cs=(K&&K.cols)||[];
  return ((K&&K.rows)||[]).map(r=>{ const o={}; cs.forEach((c,i)=>o[c]=r[i]); return o; });
}
const KLB={qb:"패스",rush:"러싱",rec:"리시빙"};
// gid 가 있으면 그 경기 패널(박스스코어), opt.season 이면 시즌 패널(보드 로스터 — 그 경기 없이
// 시즌 한 열 · 맵도 시즌). opt.alt = {label, fn}: 다른 패널(보드의 시즌 비교)로 넘어가는 단추.
// opt.f = {열: 값}: 처음부터 걸어 둘 조건.
async function panelOpen(id,kind,gid,yr,opt){
  opt=opt||{};
  const sh=pnlShell(), tok=++PTOK;
  sh.ov.classList.add("on");
  sh.el.classList.remove("k-qb");
  sh.el.innerHTML=`<div class="bxin"><div class="bxload">불러오는 중…</div></div>`;
  const P=await pjson(`/panels/${encodeURIComponent(yr)}/${encodeURIComponent(id)}.json`);
  if(tok!==PTOK) return;                  // 그사이 닫았거나 다른 선수를 눌렀습니다
  if(!P||!P[kind]){
    sh.el.innerHTML=`<button class="x" aria-label="닫기">&times;</button>
      <div class="bxin"><div class="bxload">자료 없음</div></div>`;
    return;
  }
  PS={P,yr,gid:String(gid||""),season:!!opt.season,alt:opt.alt||null};
  pnlKind(kind);
  if(opt.f) for(const [k,,opts] of PFIL[kind]||[]){      // 처음 걸어 둘 조건(선수 스탯의 패스 조건)
    const v=opt.f[k]; if(v&&opts.some(o=>o[0]===v)) PS.f[k]=v; }
  sh.el.style.setProperty("--tc",P.c1||"#2b5fd9");
  pnlDraw();
}
function pnlKind(kind){
  Object.assign(PS,{kind,f:{},pin:null,scope:PS.season?"season":"game",
    R:pnlRows(PS.P[kind]),RR:kind==="qb"?pnlRows(PS.P.qb.rush):[]});
}

const pnlFilt=()=>Object.values(PS.f).some(v=>v);
// 필터 열이 그 줄에 없으면(예: 디자인된 QB 런의 압박) 그 필터에서는 빠집니다.
function pnlOK(r){
  for(const k in PS.f){
    const v=PS.f[k]; if(!v) continue;
    if(!v.split("|").includes(String(r[k]??""))) return false;
  }
  return true;
}
// 순위 — 필터가 없으면 rk, 걸면 그 조합의 rkf(필터마다 고른 칸 번호를 이은 열쇠).
const rkKey=()=>PFIL[PS.kind].map(([k,,opts])=>Math.max(0,opts.findIndex(o=>o[0]===(PS.f[k]||"")))).join("");
function rkOf(K,k){
  if(!pnlFilt()) return (K.rk||{})[k]||null;
  const i=(K.rkk||[]).indexOf(k), v=i<0?0:(((K.rkf||{})[rkKey()]||[])[i]||0);
  return v?[Math.abs(v),v<0?1:0]:null;
}
const ALN={WIDE:"와이드",SLOT:"슬롯",TIGHT:"타이트",BACKFIELD:"백필드"};
function rating(c,a,y,t,i){
  if(!a) return null;
  const cl=v=>Math.max(0,Math.min(2.375,v));
  return (cl((c/a-.3)*5)+cl((y/a-3)*.25)+cl(t/a*20)+cl(2.375-i/a*25))/6*100;
}
// 집계 — 표와 맵이 같은 함수를 씁니다(nflmaster.season_totals · _part 와 같은 셈).
const PAGG={
  rec(L){
    const t=L.filter(p=>+p.tgt), c=t.filter(p=>+p.cmp), air=t.filter(p=>p.air!=null&&p.air!==""),
          sep=t.filter(p=>p.sep);
    const al={}; for(const k in ALN) al[k]=L.filter(p=>p.al===k).length;
    return {tgt:t.length, cmp:c.length, yds:c.reduce((a,p)=>a+(+p.yds||0),0),
      adot:air.length?air.reduce((a,p)=>a+(+p.air),0)/air.length:null,
      td:c.filter(p=>+p.td).length, open:sep.filter(p=>p.sep==="OPEN").length, sepN:sep.length, al};
  },
  rush(L){
    const sc=L.filter(p=>p.sc!==""&&p.sc!=null), yds=L.reduce((a,p)=>a+(+p.yds||0),0);
    return {att:L.length, yds, ypc:L.length?yds/L.length:null,
      succ:sc.length?sc.filter(p=>+p.sc).length/sc.length*100:null, td:L.filter(p=>+p.td).length};
  },
  qb(L,RL){
    const pa=L.filter(p=>p.k==="P"), c=pa.filter(p=>+p.cmp);
    const yds=c.reduce((a,p)=>a+(+p.yds||0),0), td=pa.filter(p=>+p.td).length, it=pa.filter(p=>+p.int).length;
    return {att:pa.length, cmp:c.length, yds, pct:pa.length?c.length/pa.length*100:null, td, int:it,
      rat:rating(c.length,pa.length,yds,td,it), prs:L.filter(p=>+p.pr).length, sk:L.filter(p=>p.k==="S").length,
      ratt:RL.length, ryds:RL.reduce((a,p)=>a+(+p.yds||0),0), rtd:RL.filter(p=>+p.td).length,
      fum:RL.filter(p=>+p.fum).length};
  },
};
// 표 — [머리] 또는 [이름, 키, 소수, 꼬리] · 꼬리 "%" 는 단위, "pfr" 은 경기 단위 PFR 값(필터 무관).
const PROW={
  rec:[["리시빙"],["타겟","tgt"],["캐치","cmp"],["리시빙 야드","yds"],["타겟당 에어야드","adot",1],
       ["리시빙 TD","td"],["세퍼레이션 OPEN","open",0,"sep"],["브레이크 태클","btk",0,"pfr"],
       ["정렬별 스냅","패스 플레이"],["와이드","al.WIDE"],["슬롯","al.SLOT"],["타이트","al.TIGHT"],["백필드","al.BACKFIELD"]],
  rush:[["러싱"],["러닝 시도","att"],["러닝 야드","yds"],["시도당 야드","ypc",1],["성공률","succ",1,"%"],
        ["브레이크 태클","btk",0,"pfr"]],
  qb:[["패스"],["패싱 시도","att"],["패싱 야드","yds"],["성공률","pct",1,"%"],["패스 TD","td"],["인터셉션","int"],
      ["패서 레이팅","rat",1],["압박 받은 횟수","prs"],["쌕","sk"],
      ["러싱"],["러싱 시도","ratt"],["러싱 야드","ryds"],["러싱 TD","rtd"],["펌블","fum"]],
};
const rkTx=([r,t])=>`(${t?"공동 ":""}${r}위)`;
function pnlAgg(rows,rrows){ return PS.kind==="qb"?PAGG.qb(rows,rrows):PAGG[PS.kind](rows); }
function pnlTable(){
  const {P,kind,gid}=PS, K=P[kind], filt=pnlFilt(), one=PS.season;
  const all=PS.R.filter(pnlOK), rr=PS.RR.filter(pnlOK);
  const ss=pnlAgg(all,rr),
        gm=one?null:pnlAgg(all.filter(r=>String(r.g)===gid), rr.filter(r=>String(r.g)===gid));
  const get=(a,k)=>k.startsWith("al.")?a.al[k.slice(3)]:a[k];
  const fmt=(v,d)=>v==null?null:(d?Number(v).toFixed(d):String(v));
  const cell=(v,d,u,rk,ex)=>{
    if(v==null) return `<td class="na">—</td>`;
    return `<td class="${rk&&rk[0]<=5?"hot":""}">${fmt(v,d)}${u==="%"?"%":""}${ex||""}${
      rk?`<span class="rk">${rkTx(rk)}</span>`:""}</td>`;
  };
  const g=(P.games||{})[gid]||{}, ng=Object.keys(P.games||{}).length, gap=one?"":"<td></td>";
  let body="";
  for(const r of PROW[kind]){
    if(r.length<=2&&(r.length===1||!/^[a-z]/.test(r[1]))){
      body+=`<tr class="gh"><th>${r[0]}${r[1]?`<small>${r[1]}</small>`:""}</th>${gap}<td></td></tr>`; continue;
    }
    const [lb,k,d,u]=r;
    if(u==="pfr"){            // 경기 단위 자료 — 필터를 걸면 낼 수 없습니다
      const b=K.btk||{};
      body+=`<tr><th>${lb}</th>${one?"":cell(filt?null:b[gid],0)}${cell(filt?null:b.season,0)}</tr>`; continue;
    }
    const sx=u==="sep"?(a=>a.sepN?`<small>(태그 ${a.sepN})</small>`:""):null;
    body+=`<tr><th>${lb}</th>${one?"":cell(get(gm,k),d,u,null,sx&&sx(gm))}${
      cell(get(ss,k),d,u,rkOf(K,k),sx&&sx(ss))}</tr>`;
  }
  const gh=one?"":`<th>그 경기<b>${g.home?"vs":"@"} ${esc(g.opp||"")} · ${esc(String(g.w||""))}주</b></th>`;
  return `<table class="pst"><thead><tr><th></th>${gh}
      <th>시즌<b>${esc(PS.yr)} · ${ng}경기</b></th></tr></thead><tbody>${body}</tbody></table>`;
}
function pnlChips(){
  return PFIL[PS.kind].map(([k,lb,opts])=>`<div class="pfg"><span>${lb}</span>${opts.map(([v,t])=>
    `<button class="chip" data-fk="${k}" data-fv="${v}" aria-pressed="${(PS.f[k]||"")===v}">${t}</button>`).join("")}</div>`).join("");
}
// 시즌 패널의 종류 단추 — 그 선수가 가진 것만. 하나뿐이면 단추 없이 예전 패널 단추만.
function pnlKinds(){
  if(!PS.season) return "";
  const ks=["qb","rush","rec"].filter(k=>PS.P[k]);
  const tabs=ks.length>1?ks.map(k=>`<button class="pk" data-kind="${k}" aria-pressed="${k===PS.kind}">${KLB[k]}</button>`).join(""):"";
  const alt=PS.alt?`<button class="pk pkalt" data-alt="1">${esc(PS.alt.label||"")}</button>`:"";
  return tabs||alt?`<div class="pkb">${tabs}${alt}</div>`:"";
}
function pnlScope(){
  if(PS.season) return "";
  return `<div class="pscope">
    <button class="chip" data-sc="game" aria-pressed="${PS.scope==="game"}">그 경기</button>
    <button class="chip" data-sc="season" aria-pressed="${PS.scope==="season"}">시즌</button></div>`;
}
function pnlDraw(){
  const {P,kind,gid,yr}=PS, g=(P.games||{})[gid]||{}, ng=Object.keys(P.games||{}).length;
  // 등번호 자리표시를 밑에 깔고 사진을 위에 덮습니다 — 사진이 없거나 못 받으면 번호가 보입니다.
  const shot=`<div class="gh">${esc(P.num||"?")}</div>`+(P.img?`<img src="/photos/${
    encodeURIComponent(P.img)}" alt="" onerror="this.remove()">`:"");
  const map=kind==="rec"?pnlScope()+pnlRoute():kind==="rush"?pnlScope()+pnlGaps():pnlPassMap();
  const where=PS.season?`<b>${esc(P.team||"")}</b> · ${esc(yr)} 시즌 · ${ng}경기`
    :`<b>${esc(P.team||"")} ${g.home?"vs":"@"} ${esc(g.opp||"")}</b> · ${esc(yr)} ${esc(String(g.w||""))}주`;
  PSH.el.classList.toggle("k-qb",kind==="qb");
  PSH.el.innerHTML=`<button class="x" aria-label="닫기">&times;</button><div class="bxin">
    <div class="pf"><div class="pshot">${shot}</div>
      <div class="pname">${esc(P.name)}${P.sample?`<span class="psmp">샘플</span>`:""}</div>
      <div class="ppos">${esc(P.pos||"")}${P.num?" · #"+esc(P.num):""}</div>
      ${P.draft?`<div class="pline">${esc(P.draft)}</div>`:""}${P.college?`<div class="pline">${esc(P.college)}</div>`:""}
      <div class="pgame">${where}</div></div>
    <div class="pmain">${pnlKinds()}<div class="pfil">${pnlChips()}</div>
      <div class="pbody k-${kind}"><div class="ptab">${pnlTable()}</div><div class="pmap">${map}</div></div></div></div>`;
  pnlPills();
  pnlPinFit();
}
// 고정 — {h: 가지 열쇠, x, y: 맵 상자 안 자리(px)}. 같은 가지를 다시 누르면 풉니다. 필터·범위를
// 바꿔도 남아서, 같은 루트를 조건마다 견줘 볼 수 있습니다.
const pinH=()=>PS.pin&&PS.pin.h;
function pnlPin(h,x,y){ PS.pin=pinH()===h?null:{h,x,y}; pnlDraw(); }
function pnlClick(e){
  const t=e.target;
  if(t.closest(".x")){ pnlClose(); return; }
  if(t.closest(".pinx")){ PS.pin=null; pnlDraw(); return; }
  // 맵 안 빈 곳을 누르면 떠 있던 작은 창을 닫고 전체 그림으로(2026-11-21 사용자 "차트맵안에서 다른 공간을
  // 누르면 자연히 팝업이 취소되고 전체로"). 창 위를 누른 것은 그대로 둡니다.
  if(PS.pin&&t.closest(".pmapbox")&&!t.closest(".ppin")&&!t.closest(".hb")){ PS.pin=null; pnlDraw(); return; }
  const pk=t.closest(".pk");
  if(pk){
    if(pk.dataset.alt){ const a=PS.alt, k=PS.kind; pnlClose(); if(a&&a.fn) a.fn(k); return; }
    if(pk.dataset.kind&&pk.dataset.kind!==PS.kind){ pnlKind(pk.dataset.kind); pnlDraw(); }
    return;
  }
  const hb=t.closest(".hb");
  if(hb){
    // 던진 공이 없는 칸은 창을 열지 않고, 떠 있던 창만 닫습니다(빈 곳을 누른 것과 같게).
    if(PS.kind==="qb"&&!passRows().some(r=>zoneOf(r)+"|"+r.ad===hb.dataset.h)){
      if(PS.pin){ PS.pin=null; pnlDraw(); }
      return;
    }
    // 떠 있던 말풍선 자리에 그대로 고정합니다(없으면 누른 자리 옆).
    const box=PSH.el.querySelector(".pmapbox"), b=box.getBoundingClientRect(), tip=box.querySelector(".ptip");
    const on=tip&&tip.style.display==="block";
    pnlPin(hb.dataset.h,on?parseFloat(tip.style.left):e.clientX-b.left+14,on?parseFloat(tip.style.top):e.clientY-b.top+12);
    return;
  }
  const c=t.closest(".chip"); if(!c) return;
  if(c.dataset.sc) PS.scope=c.dataset.sc;
  else if(c.dataset.fk) PS.f[c.dataset.fk]=c.dataset.fv;
  pnlDraw();
}

// ── 맵 공용 — 가지에 올리면 그 묶음의 기록이 뜨고, 누르면 맵 밑에 고정됩니다 ──
const pnlIn=r=>PS.scope==="game"?String(r.g)===PS.gid:true;
const f1=n=>n.toFixed(1);
function pnlTip(e){
  const box=PSH&&PSH.el.querySelector(".pmapbox"), tip=box&&box.querySelector(".ptip");
  const svg=box&&box.querySelector("svg.pfld");
  if(!tip) return;
  const g=e&&e.target.closest&&e.target.closest(".hb");
  if(svg) svg.querySelectorAll(".hb.on").forEach(x=>{ if(x!==g) x.classList.remove("on"); });
  if(!g){ tip.style.display="none"; if(svg) svg.classList.remove("hov"); return; }
  g.classList.add("on"); if(svg) svg.classList.add("hov");
  // 고정한 가지 위에서는 띄우지 않습니다 — 같은 기록이 고정 카드에 있습니다.
  if(g.dataset.h===pinH()){ tip.style.display="none"; return; }
  tip.innerHTML=tipT(tipInfo(g.dataset.h));
  tip.style.display="block";
  const b=box.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  let x=e.clientX-b.left+14, y=e.clientY-b.top+12;
  if(x+tw>b.width) x=e.clientX-b.left-14-tw;
  if(y+th>b.height) y=b.height-th-4;
  tip.style.left=Math.max(4,x)+"px"; tip.style.top=Math.max(4,y)+"px";
}
function pnlHover(e){ if(PS) pnlTip(e); }
const tipInfo=h=>PS.kind==="rec"?routeInfo(h):PS.kind==="rush"?gapInfo(h):passInfo(h);
const tipCtx=()=>{
  const out=[];
  for(const [k,lb,opts] of PFIL[PS.kind]){ const v=PS.f[k]; if(!v) continue;
    const o=opts.find(x=>x[0]===v); if(o) out.push(lb+" "+o[1]); }
  return out.join(" · ");
};
const tipHead=title=>`<div class="tt">${esc(title)}${tipCtx()?`<i>${esc(tipCtx())}</i>`:""}</div>`;
const tipT=({title,rows,more})=>tipHead(title)+`<table>${rows.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join("")}</table>`
  +(more?`<div class="prl">${more}</div>`:"");
function pnlPinCard(){
  if(!PS.pin) return "";
  const p=PS.pin, qb=PS.kind==="qb";
  return `<div class="ppin${qb?" prp":""}" style="left:${Math.round(p.x)}px;top:${Math.round(p.y)}px">
    <button class="pinx" aria-label="닫기">&times;</button>${qb?passRecv(p.h):tipT(tipInfo(p.h))}</div>`;
}
// 고정 카드가 맵 상자 밖으로 나가지 않게 — 그린 뒤 크기를 재서 안쪽으로 당깁니다.
function pnlPinFit(){
  const box=PSH&&PSH.el.querySelector(".pmapbox"), c=box&&box.querySelector(".ppin");
  if(!c) return;
  const W=box.clientWidth, H=box.clientHeight;
  c.style.left=Math.max(4,Math.min(parseFloat(c.style.left)||4,W-c.offsetWidth-4))+"px";
  c.style.top=Math.max(4,Math.min(parseFloat(c.style.top)||4,H-c.offsetHeight-4))+"px";
}

// ── 맵 그림 공용 — 둥글게 꺾이는 선 · 갈라지는 곳에서 옅게 시작해 끝에서 진해지는 팀 색 ·
// 끝점 동그라미 · 알약 이름표. 굵기는 뛴(시도한) 횟수입니다.
function rpath(P,r){
  let d=`M${f1(P[0][0])},${f1(P[0][1])}`;
  for(let i=1;i<P.length-1;i++){
    const [ax,ay]=P[i-1], [bx,by]=P[i], [cx,cy]=P[i+1];
    const l1=Math.hypot(bx-ax,by-ay)||1, l2=Math.hypot(cx-bx,cy-by)||1, k=Math.min(r,l1/2,l2/2);
    d+=` L${f1(bx-(bx-ax)/l1*k)},${f1(by-(by-ay)/l1*k)} Q${f1(bx)},${f1(by)} ${
      f1(bx+(cx-bx)/l2*k)},${f1(by+(cy-by)/l2*k)}`;
  }
  const z=P[P.length-1];
  return d+` L${f1(z[0])},${f1(z[1])}`;
}
// pts 는 px. d 를 주면 그 경로를 씁니다(러닝 맵의 곡선). lab = [글자, 숫자, 앵커, dx, dy].
function branch(key,pts,n,mx,lab,d,o0){
  const c=PS.P.c1||"#2b5fd9", w=3.5+8.5*Math.sqrt(n/mx), id=`pg${++GID}`;
  const [x0,y0]=pts[0], [x1,y1]=pts[pts.length-1], path=d||rpath(pts,24);
  const [txt,anc,dx,dy]=lab, ty=y1+dy, s0=o0==null?0:o0;
  // 색은 갈라지는 곳에서 비어 있다가(o0, 러닝은 옅게 보임) 끝으로 갈수록 진해집니다 — 줄기와 겹치는 머리는
  // 보이지 않아 줄기에서 가지가 돋아나는 모양이 됩니다. 번짐도 같은 그러데이션.
  return `<g class="hb${pinH()===key?" pin":""}" data-h="${esc(key)}" tabindex="0" role="button">
    <linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x1)}" y2="${f1(y1)}">
      <stop offset="0" stop-color="${c}" stop-opacity="${s0}"/><stop offset=".2" stop-color="${c}" stop-opacity="${Math.max(s0,.55)}"/>
      <stop offset="1" stop-color="${c}"/></linearGradient>
    <path d="${path}" fill="none" stroke="url(#${id})" stroke-opacity=".14" stroke-width="${f1(w+9)}" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="url(#${id})" stroke-width="${f1(w)}" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${f1(x1)}" cy="${f1(y1)}" r="${f1(w/2+4)}" fill="${c}"/>
    <circle cx="${f1(x1)}" cy="${f1(y1)}" r="${f1(Math.max(2.2,w/2-.5))}" fill="#0c1220"/>
    <path d="${path}" fill="none" stroke="transparent" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="pl"><rect rx="11" height="22" fill="#0f1729" stroke="#33415f" stroke-opacity=".9"/>
      <text x="${f1(x1+dx)}" y="${f1(ty+4.6)}" font-size="13" text-anchor="${anc}">${txt}</text></g></g>`;
}
// 이름표 알약 — 그린 뒤 글자 폭을 재서 바탕을 맞춥니다(글꼴마다 폭이 달라 어림하지 않습니다).
function pnlPills(){
  const svg=PSH&&PSH.el.querySelector("svg.pfld"); if(!svg) return;
  svg.querySelectorAll(".pl").forEach(g=>{
    const t=g.querySelector("text"), r=g.querySelector("rect"); if(!t||!r) return;
    let b; try{ b=t.getBBox(); }catch(_){ return; }
    if(!b||!b.width) return;
    r.setAttribute("x",f1(b.x-9)); r.setAttribute("y",f1(b.y+b.height/2-11));
    r.setAttribute("width",f1(b.width+18));
  });
}
// 필드 바탕 — 5야드마다 옅은 줄, LOS 는 팀 색(번짐 한 겹).
function fieldBase(W,H,ly,step){
  const c=PS.P.c1||"#2b5fd9";
  let o=`<rect x="0" y="0" width="${W}" height="${H}" fill="url(#pfg${GID})"/>`;
  for(let y=ly-step;y>0;y-=step) o+=`<line x1="0" x2="${W}" y1="${f1(y)}" y2="${f1(y)}" stroke="rgba(255,255,255,.045)"/>`;
  for(let y=ly+step;y<H;y+=step) o+=`<line x1="0" x2="${W}" y1="${f1(y)}" y2="${f1(y)}" stroke="rgba(255,255,255,.03)"/>`;
  o+=`<line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="${c}" stroke-opacity=".22" stroke-width="7"/>`;
  o+=`<line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="${c}" stroke-width="2"/>`;
  o+=`<text x="10" y="${ly-8}" font-size="11.5" fill="${c}" font-weight="800" letter-spacing=".08em">LOS</text>`;
  return o;
}
function fieldDefs(){
  const c=PS.P.c1||"#2b5fd9";
  return `<defs><radialGradient id="pfg${GID}" cx="50%" cy="78%" r="75%"><stop offset="0" stop-color="${c}" stop-opacity=".09"/>
    <stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs>`;
}
function origin(x,y,label){
  const c=PS.P.c1||"#2b5fd9";
  return `<circle cx="${x}" cy="${y}" r="21" fill="${c}" opacity=".16"/>
    <circle cx="${x}" cy="${y}" r="13.5" fill="${c}" stroke="#0c1220" stroke-width="3"/>
    <text x="${x}" y="${y+4.6}" font-size="12.5" font-weight="800" fill="#fff" text-anchor="middle">${esc(label||"")}</text>`;
}

// ── 리시버 — 루트 트리(정렬을 합친 트리 하나). 기록에 필드 좌우와 실제 경로가 없어 NFL Pro 의
// 방향 분류를 정형화했고, 안쪽(필드 가운데 쪽)을 왼쪽, 바깥쪽을 오른쪽에 그립니다.
const RT={IN:"인 (안쪽)",OUT:"아웃 (바깥)",VERTICAL:"버티컬","IN|VERTICAL":"인 + 버티컬",
  "OUT|VERTICAL":"아웃 + 버티컬",WR_SCREEN:"WR 스크린",RB_SCREEN:"RB 스크린"};
const RTS={IN:"인",OUT:"아웃",VERTICAL:"버티컬","IN|VERTICAL":"인+버티컬","OUT|VERTICAL":"아웃+버티컬",
  WR_SCREEN:"WR스크린",RB_SCREEN:"RB스크린"};
const TS_=15, TXL=-15, TYT=31, TW=30*TS_, TH=37*TS_;
const tpx=x=>(x-TXL)*TS_, tpy=y=>(TYT-y)*TS_;
// 가지(야드) — 줄기에서 조금 아래부터 시작해 둥글게 꺾입니다. 줄기는 회색 하나를 같이 씁니다.
const RSH={"VERTICAL":[[0,12],[0,28]],"IN|VERTICAL":[[0,11.8],[0,13.5],[-7.5,25.5]],
  "OUT|VERTICAL":[[0,11.8],[0,13.5],[7.5,24]],"IN":[[0,7.3],[0,9],[-10,10]],"OUT":[[0,4.8],[0,6.5],[9.5,6.5]],
  "WR_SCREEN":[[0,0],[-1.3,-2.3],[-7,-2.7]],"RB_SCREEN":[[0,0],[2.2,-3.5],[8.5,-3.1]]};
// 이름표 — [앵커, dx, dy](끝점 기준 px).
const RLB={"VERTICAL":["middle",0,-26],"IN|VERTICAL":["middle",0,-26],"OUT|VERTICAL":["middle",0,-26],
  "IN":["end",-16,0],"OUT":["start",16,0],"WR_SCREEN":["end",-16,0],"RB_SCREEN":["start",16,0]};
const STEM={"VERTICAL":13.5,"IN|VERTICAL":13.5,"OUT|VERTICAL":13.5,"IN":9,"OUT":6.5};
function pnlRoute(){
  const L=PS.R.filter(r=>pnlIn(r)&&pnlOK(r)), list=L.filter(r=>r.rt), none=L.filter(r=>!r.rt);
  GID++;
  let o=`<svg class="pfld${PS.pin?" pinned":""}" viewBox="0 0 ${TW} ${TH}" role="img" aria-label="루트 트리">${fieldDefs()}${
    fieldBase(TW,TH,tpy(0),5*TS_)}`;
  o+=`<text x="10" y="${TH-12}" font-size="12.5" fill="#56637f" font-weight="700">← 안쪽</text>`;
  o+=`<text x="${TW-10}" y="${TH-12}" font-size="12.5" fill="#56637f" font-weight="700" text-anchor="end">바깥 →</text>`;
  if(!list.length&&!none.length) return `<div class="pmapbox">${o}<text x="${TW/2}" y="${tpy(14)}" font-size="15"
    fill="#7d8ca8" font-weight="700" text-anchor="middle">루트 없음</text></svg></div>`;
  const by={}; list.forEach(r=>(by[r.rt]=by[r.rt]||[]).push(r));
  const mx=Math.max(1,...Object.values(by).map(a=>a.length));
  const top=Math.max(0,...Object.keys(by).map(k=>STEM[k]||0));
  if(top) o+=`<line x1="${tpx(0)}" x2="${tpx(0)}" y1="${tpy(0)}" y2="${tpy(top)}" stroke="#3a4766" stroke-width="6" stroke-linecap="round"/>`;
  Object.entries(by).sort((a,b)=>a[1].length-b[1].length).forEach(([rt,arr])=>{
    const sh=RSH[rt]; if(!sh) return;
    const [anc,dx,dy]=RLB[rt];
    o+=branch(rt,sh.map(([x,y])=>[tpx(x),tpy(y)]),arr.length,mx,[`<tspan fill="#9aa6bf" font-weight="700">${
      RTS[rt]||esc(rt)}</tspan><tspan fill="#f1f4fa" font-weight="800"> ${arr.length}</tspan>`,anc,dx,dy]);
  });
  o+=origin(tpx(0),tpy(0),PS.P.num);
  o+=`<text x="${tpx(0)-26}" y="${tpy(0)-10}" font-size="12.5" fill="#8f9bb5" font-weight="700" text-anchor="end">루트 ${list.length}</text>`;
  if(none.length){            // 루트 분류가 빈 스냅 — 방향을 모르니 가지 대신 LOS 옆 알약
    const x=tpx(0)+30, y=tpy(0)-24;
    o+=`<g class="hb${pinH()==="__none"?" pin":""}" data-h="__none" tabindex="0" role="button"><g class="pl">
      <rect rx="11" height="22" fill="#0c1220" stroke="#4a5878" stroke-dasharray="3 3"/>
      <text x="${x}" y="${y+4.6}" font-size="12.5"><tspan fill="#8f9bb5" font-weight="700">분류 없음</tspan><tspan
        fill="#e6ebf5" font-weight="800"> ${none.length}</tspan></text></g></g>`;
  }
  return `<div class="pmapbox">${o}</svg><div class="ptip"></div>${pnlPinCard()}</div>`;
}
function routeInfo(h){
  const nn=h==="__none", L=PS.R.filter(r=>pnlIn(r)&&pnlOK(r)&&(nn?!r.rt:r.rt===h)), a=PAGG.rec(L);
  return {title:nn?"루트 분류 없음":(RT[h]||h), rows:[[nn?"스냅":"뛴 횟수",L.length],["타겟",a.tgt],["캐치",a.cmp],
    ["리시빙 야드",a.yds],["리시빙 TD",a.td],["타겟당 에어야드",a.adot==null?"—":a.adot.toFixed(1)],
    ["세퍼레이션 OPEN",a.sepN?`${a.open} / ${a.sepN}`:"—"]]};
}

// ── 러너 — 러닝 방향 맵. 기록지 설명의 일곱 방향(왼쪽 끝 … 오른쪽 끝)으로 갈래를 냅니다.
// 2026-11-21 사용자: "러닝 차트를 더 길게 · 오라인을 더 확대하고 큰 원형의 바둑알 아이콘 스타일로 · 각각의 러닝
// 레인간의 간격을 좀 더". 그림을 가로로 넓히고(760), 오라인 다섯을 큰 바둑알로, 갈래 사이를 벌렸습니다.
// [키, 이름, LOS 를 지나는 x, 끝점 x, 끝점 y] (px) — 끝점은 이름표가 겹치지 않게 높낮이를 엇갈립니다.
// 가운데(up the middle)는 센터 바둑알 위로, 가드·태클 방향은 바둑알 사이로 지납니다.
const GAPS=[["LE","왼쪽 끝",150,66,128],["LT","왼쪽 태클",251,182,70],["LG","왼쪽 가드",337,292,116],
  ["M","가운데",380,380,54],["RG","오른쪽 가드",423,468,116],["RT","오른쪽 태클",509,578,70],
  ["RE","오른쪽 끝",610,694,128]];
const RW=760, RH=450, RLY=262, ROY=404, OLX=[208,294,380,466,552];
// 바둑알 — 둥근 돌에 위쪽 왼편 반사광 한 점.
function stone(x,y,r){
  return `<circle cx="${x}" cy="${y+3}" r="${r}" fill="rgba(0,0,0,.45)"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="url(#pstn${GID})" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
    <ellipse cx="${f1(x-r*.32)}" cy="${f1(y-r*.36)}" rx="${f1(r*.34)}" ry="${f1(r*.2)}" fill="rgba(255,255,255,.22)"
      transform="rotate(-28 ${f1(x-r*.32)} ${f1(y-r*.36)})"/>`;
}
function pnlGaps(){
  const L=PS.R.filter(r=>pnlIn(r)&&pnlOK(r));
  GID++;
  let o=`<svg class="pfld${PS.pin?" pinned":""}" viewBox="0 0 ${RW} ${RH}" role="img" aria-label="러닝 방향">${fieldDefs()}
    <defs><radialGradient id="pstn${GID}" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="#55627f"/>
      <stop offset=".55" stop-color="#2a3349"/><stop offset="1" stop-color="#151b29"/></radialGradient></defs>${
    fieldBase(RW,RH,RLY,72)}`;
  const by_={}; L.forEach(r=>{ const k=r.gap||""; (by_[k]=by_[k]||[]).push(r); });
  const mx=Math.max(1,...GAPS.map(([k])=>(by_[k]||[]).length));
  if(!L.length) o+=`<text x="${RW/2}" y="${RLY*0.5}" font-size="16" fill="#7d8ca8" font-weight="700" text-anchor="middle">러닝 없음</text>`;
  const ox=RW/2;
  GAPS.slice().sort((a,b)=>(by_[a[0]]||[]).length-(by_[b[0]]||[]).length).forEach(([k,lb,lx,ex,ey])=>{
    const arr=by_[k]||[]; if(!arr.length) return;
    const a=PAGG.rush(arr);
    // 러너 → LOS(그 방향 구멍) → 끝점: 부드러운 곡선 두 마디.
    const d=`M${f1(ox)},${ROY-18} C${f1(ox)},${f1(ROY-70)} ${f1(lx)},${f1(RLY+78)} ${f1(lx)},${RLY+2}`
      +` C${f1(lx)},${f1(RLY-52)} ${f1(ex)},${f1(ey+62)} ${f1(ex)},${f1(ey)}`;
    // 이름표 — 시도(굵게) · 시도당 야드
    const [anc,dx]=k==="LE"?["start",-14]:k==="RE"?["end",14]:["middle",0];
    o+=branch(k,[[lx,RLY+30],[ex,ey]],arr.length,mx,[`<tspan fill="#f1f4fa" font-weight="800">${arr.length}회</tspan>${
      a.ypc==null?"":`<tspan fill="#9aa6bf" font-weight="700"> ${a.ypc.toFixed(1)}</tspan>`}`,anc,dx,-28],d,.3);
  });
  // 오라인 다섯 — 갈래 위에 얹어, 갈래가 바둑알 사이로 빠져나가게 보입니다.
  OLX.forEach(x=>o+=stone(x,RLY+30,24));
  o+=origin(ox,ROY,PS.P.num);
  const miss=(by_[""]||[]).length;
  return `<div class="pmapbox">${o}</svg><div class="ptip"></div>${pnlPinCard()}</div>`
    + (miss?`<span class="ptag">방향 미기록 ${miss}</span>`:"");
}
function gapInfo(h){
  const G=GAPS.find(x=>x[0]===h), L=PS.R.filter(r=>pnlIn(r)&&pnlOK(r)&&(r.gap||"")===h), a=PAGG.rush(L);
  return {title:G?G[1]:h, rows:[["시도",a.att],["야드",a.yds],["시도당",a.ypc==null?"—":a.ypc.toFixed(1)],
    ["성공률",a.succ==null?"—":a.succ.toFixed(1)+"%"],["TD",a.td]]};
}

// ── 쿼터백 — 패스 차트. 박스스코어는 그 경기, 시즌 패널은 시즌 전체. 비스듬히 내려다본 필드를 가로 다섯 칸 ×
// 깊이 셋으로 나누고 칸 위에 숫자만(성공/시도 · 야드) 올립니다 — 음영 없이(2026-11-21 사용자 "점들을 제외한
// 필드를 구성하고 … 각 구역 위에 숫자만 뜨게 · 음영 말고"). 칸에 올리면 그 칸 기록과 받은 선수, 누르면 고정.
// 가로 = NFL Pro 구역(해시 사이 · 심 · 넘버 바깥)에 기록지 문장의 좌우(공격 쪽에서 본 왼쪽 · 오른쪽)를
// 붙인 것. 심인데 문장이 middle(좌우 없음)이면 해시 사이로 넣습니다 — 사용자 "미들이 되어있는건 그냥 비트윈더
// 해쉬로". 넘버 바깥인데 좌우가 없는 것과 구역·깊이 태그가 없는 것은 미분류.
function zoneOf(r){
  if(r.band==="H") return "H";
  if(r.band==="M") return r.sd==="L"?"ML":r.sd==="R"?"MR":r.sd==="M"?"H":"";
  if(r.band==="O") return r.sd==="L"?"OL":r.sd==="R"?"OR":"";
  return "";
}
// 필드 — 야드 좌표(가운데 0 · 사이드라인 ±26.65 · LOS 0, 위가 +). 해시 칸은 글자가 들어가게 실제(±3.08)보다
// 조금 넓은 ±4.6, 넘버 안쪽 끝 ±13.5.
const PZX=[["OL",-26.65,-13.5],["ML",-13.5,-4.6],["H",-4.6,4.6],["MR",4.6,13.5],["OR",13.5,26.65]];
const PZY=[["S",0,10],["I",10,20],["D",20,35]];
const PZS={OL:"넘버 바깥",ML:"심",H:"해시 사이",MR:"심",OR:"넘버 바깥"};
const PZN={OL:"넘버 바깥 (왼쪽)",ML:"심 (왼쪽)",H:"해시 사이",MR:"심 (오른쪽)",OR:"넘버 바깥 (오른쪽)"};
const PZD={S:"10야드 미만",I:"10~19야드",D:"20야드 이상"};
const CW=900, CH=480, CY0=-5, CY1=35;
// 투영 — 아래(LOS 뒤)는 넓고 위(+35)는 좁게, 비스듬히 내려다본 필드.
function cpt(x,y){
  const t=(y-CY0)/(CY1-CY0), half=CW*0.43*(1-0.34*t);
  return [CW/2+x/26.65*half, CH-34-t*(CH-74)];
}
const cP=(x,y)=>{ const [a,b]=cpt(x,y); return `${f1(a)},${f1(b)}`; };
const cQuad=(x0,x1,y0,y1)=>`${cP(x0,y0)} ${cP(x1,y0)} ${cP(x1,y1)} ${cP(x0,y1)}`;
const cLine=(x0,y0,x1,y1,st)=>{ const [a,b]=cpt(x0,y0), [c,d]=cpt(x1,y1);
  return `<line x1="${f1(a)}" y1="${f1(b)}" x2="${f1(c)}" y2="${f1(d)}" ${st}/>`; };
function passRows(){ return PS.R.filter(r=>(PS.season||String(r.g)===PS.gid)&&pnlOK(r)&&r.k==="P"); }
function pnlPassMap(){
  const L=passRows(), cells={}, unk=[], c=PS.P.c1||"#2b5fd9";
  L.forEach(r=>{ const z=zoneOf(r), k=z+"|"+r.ad; if(!z||!r.ad) unk.push(r); else (cells[k]=cells[k]||[]).push(r); });
  let o=`<svg class="pfld pch${PS.pin?" pinned":""}" viewBox="0 0 ${CW} ${CH}" role="img" aria-label="패스 차트">
    <defs><linearGradient id="pchg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#121826"/></linearGradient></defs>`;
  // 바탕 — 사이드라인 밖, 필드, 5야드 줄(10야드마다 조금 밝게), 1야드 눈금(사이드라인 안쪽 · 해시).
  o+=`<polygon points="${cQuad(-29.6,29.6,CY0,CY1)}" fill="#0e131e"/>`;
  o+=`<polygon points="${cQuad(-26.65,26.65,CY0,CY1)}" fill="url(#pchg)" stroke="rgba(255,255,255,.32)" stroke-width="1.5"/>`;
  for(let y=CY0;y<=CY1;y+=5) if(y) o+=cLine(-26.65,y,26.65,y,`stroke="rgba(255,255,255,${y%10?.07:.15})" stroke-width="1.2"`);
  for(let y=CY0+1;y<CY1;y++){
    if(y%5===0) continue;
    for(const x of [-25.9,-4.6,4.6,25.9]) o+=cLine(x-.45,y,x+.45,y,`stroke="rgba(255,255,255,.16)" stroke-width="1"`);
  }
  // 칸 경계 — LOS 위로만, 점선(해시 · 넘버 줄).
  for(const x of [-13.5,-4.6,4.6,13.5]) o+=cLine(x,0,x,CY1,`stroke="rgba(255,255,255,.2)" stroke-width="1.2" stroke-dasharray="5 7"`);
  // 깊이 +10 · +20 · +30 — 양쪽 사이드라인 바깥(칸 숫자와 겹치지 않게).
  for(const y of [10,20,30]){
    const [xl,yl]=cpt(-27.4,y), [xr,yr]=cpt(27.4,y);
    o+=`<text x="${f1(xl)}" y="${f1(yl+5)}" class="pcm" text-anchor="end">+${y}</text>
      <text x="${f1(xr)}" y="${f1(yr+5)}" class="pcm">+${y}</text>`;
  }
  // LOS — 팀 색 굵은 선, 양 끝에 글자.
  o+=cLine(-29.6,0,29.6,0,`stroke="${c}" stroke-width="3.5"`);
  { const [xl,yl]=cpt(-27,0), [xr,yr]=cpt(27,0);
    o+=`<text x="${f1(xl)}" y="${f1(yl-8)}" class="pclos" fill="${c}" text-anchor="end">LOS</text>
      <text x="${f1(xr)}" y="${f1(yr-8)}" class="pclos" fill="${c}">LOS</text>`; }
  // 열 이름 — LOS 뒤에 옅게.
  PZX.forEach(([k,x0,x1])=>{ const [tx,ty]=cpt((x0+x1)/2,-2.7);
    o+=`<text x="${f1(tx)}" y="${f1(ty)}" class="pcz" text-anchor="middle">${PZS[k]}</text>`; });
  // 칸 — 숫자만. 올리면 테두리와 기록, 누르면 고정.
  PZY.forEach(([d,y0,y1])=>PZX.forEach(([z,x0,x1])=>{
    const k=z+"|"+d, arr=cells[k]||[], [cx,cy]=cpt((x0+x1)/2,(y0+y1)/2);
    // 성공/시도 · 그 밑에 야드 · TD·INT 가 있으면 한 줄 더(작고 옅게 — 2026-11-21 사용자 "그 밑에 TD-INT 도").
    const cm=arr.filter(r=>+r.cmp), yds=cm.reduce((a,r)=>a+(+r.yds||0),0),
          td=arr.filter(r=>+r.td).length, it=arr.filter(r=>+r.int).length,
          ti=[td?`TD ${td}`:"",it?`INT ${it}`:""].filter(Boolean).join(" · "), dy=ti?-9:0;
    o+=`<g class="hb${pinH()===k?" pin":""}" data-h="${k}" tabindex="0" role="button">
      <polygon class="pzq" points="${cQuad(x0,x1,y0,y1)}"/>`
      +(arr.length?`<text x="${f1(cx)}" y="${f1(cy+3+dy)}" class="pn1" text-anchor="middle">${cm.length}/${arr.length}</text>
        <text x="${f1(cx)}" y="${f1(cy+23+dy)}" class="pn2" text-anchor="middle">${yds}야드</text>${
        ti?`<text x="${f1(cx)}" y="${f1(cy+40+dy)}" class="pn2" text-anchor="middle">${ti}</text>`:""}`:"")
      +`</g>`;
  }));
  o+=`</svg>`;
  return `<div class="pmapbox">${o}<div class="ptip"></div>${pnlPinCard()}</div>`
    +(unk.length?`<span class="ptag">미분류 ${unk.length}</span>`:"");
}
// 칸 기록 — 시도·성공·야드·TD·INT·레이팅과 받은 선수(많은 순, 작은 얼굴 · 성공/타깃 · 야드).
function passInfo(h){
  const [z,d]=String(h).split("|"), L=passRows().filter(r=>zoneOf(r)===z&&r.ad===d);
  const c=L.filter(r=>+r.cmp), yds=c.reduce((a,r)=>a+(+r.yds||0),0),
        td=L.filter(r=>+r.td).length, it=L.filter(r=>+r.int).length, rt=rating(c.length,L.length,yds,td,it);
  return {title:`${PZN[z]||z} · ${PZD[d]||d}`,
    rows:[["시도",L.length],["성공",c.length],["성공률",L.length?(c.length/L.length*100).toFixed(1)+"%":"—"],
      ["야드",yds],["TD",td],["INT",it],["패서 레이팅",rt==null?"—":rt.toFixed(1)]]};
}
// 칸을 누르면 — 그 칸에서 타깃된 선수를 얼굴과 함께(캐치/타깃 · 야드 · TD · INT), 많이 받은 순.
// 2026-11-21 사용자 "그 구역 성적만 보이게 하고, 그 구역을 클릭하면 초상화로 그 구역에서 타겟된 선수들의
// 성적이 작은 팝업으로".
function passRecv(h){
  const [z,d]=String(h).split("|"), RV=PS.P.qb.recv||{};
  const L=passRows().filter(r=>zoneOf(r)===z&&r.ad===d);
  const who={}; L.forEach(r=>{ const k=r.to||""; (who[k]=who[k]||[]).push(r); });
  const rows=Object.entries(who).sort((a,b)=>b[1].length-a[1].length).map(([id,rs])=>{
    const [nm,img,num]=id?(RV[id]||["?","",""]):["받는 선수 없음","",""];
    const cc=rs.filter(r=>+r.cmp), yy=cc.reduce((a,r)=>a+(+r.yds||0),0),
          td=rs.filter(r=>+r.td).length, it=rs.filter(r=>+r.int).length;
    const face=img?`<img src="/photos/${encodeURIComponent(img)}" alt="" onerror="this.style.visibility='hidden'">`
      :`<span class="gh">${esc(num||"")}</span>`;
    return `<div class="prp-r">${face}<div><b>${esc(nm)}</b><span>${cc.length}/${rs.length} · ${yy}야드${
      td?` · TD ${td}`:""}${it?` · INT ${it}`:""}</span></div></div>`;
  }).join("");
  return `<div class="tt">${esc(`${PZN[z]||z} · ${PZD[d]||d}`)}<i>${L.length}시도</i></div>`
    +(rows?`<div class="prp-l">${rows}</div>`:"");
}
window.panelOpen=panelOpen;
window.boxPanels=boxPanels;
window.panelIndex=panelIndex;
})();
</script>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sel=document.getElementById("season"), out=document.getElementById("out"),
      cnt=document.getElementById("cnt"), tabs=document.getElementById("tabs"),
      qfil=document.getElementById("qfil");
const KEYS=Object.keys(CATS);
let tab=KEYS[0];                       // 패스가 기본
const sort={};                         // 부문마다 정렬 상태를 따로 둡니다

sel.innerHTML=SEASONS.map(y=>`<option value="${y}">${y}</option>`).join("");
const withData=SEASONS.filter(y=>P&&P.seasons[String(y)]);
sel.value=String(withData.length?withData[withData.length-1]:SEASONS[SEASONS.length-1]);
tabs.innerHTML=KEYS.map((k,i)=>`<button role="tab" data-k="${k}"
  aria-selected="${i===0}">${esc(CATS[k][0])}</button>`).join("");

// ── 선수 패널 · 패스 조건 — 선수 패널(content_render.PANEL_JS)이 굽는 자료를 씁니다. 패널 목록
// (/panels/index.json 의 players)에 있는 시즌만: 이름을 누르면 보드 로스터와 같은 시즌 패널이 뜨고,
// 패스 탭에는 QB 패널과 같은 조건(QFIL)이 붙습니다. 조건을 걸면 그 시즌 자격 선수는 그대로 두고 값만
// 워크북(NFLMASTER) 플레이 중 조건에 맞는 것으로 다시 셉니다(qb_pass.json).
let PIX=null;
const QF={}, QD={};                    // 고른 조건 · 시즌별 패스 줄(받은 뒤)
(typeof panelIndex==="function"?panelIndex():Promise.resolve(null)).then(x=>{ PIX=x; draw(); });
const nmOK=y=>!!(PIX&&PIX.players&&PIX.players[y]);
const qOn=()=>Object.values(QF).some(v=>v);
function qload(y){
  if(!(y in QD)) QD[y]=fetch(`/panels/${encodeURIComponent(y)}/qb_pass.json`)
    .then(r=>r.ok?r.json():null).catch(()=>null).then(d=>(QD[y]=d));
  return Promise.resolve(QD[y]);
}
const qReady=y=>QD[y]!==undefined&&!(QD[y] instanceof Promise);
async function ensureQ(y){ if(qOn()&&nmOK(y)&&!qReady(y)){ cnt.textContent="불러오는 중…"; await qload(y); } }
function rating(c,a,y,t,i){
  if(!a) return null;
  const cl=v=>Math.max(0,Math.min(2.375,v));
  return (cl((c/a-.3)*5)+cl((y/a-3)*.25)+cl(t/a*20)+cl(2.375-i/a*25))/6*100;
}
// n / d 를 소수 첫째 자리에서 사사오입 — 서버의 _ratio1 과 같은 값(정수끼리 나눠 오차 없이).
function r1(n,d){
  if(!d) return null;
  const s=(n<0)!==(d<0)?-1:1, a=Math.abs(n), b=Math.abs(d);
  return s*Math.floor((20*a+b)/(2*b))/10;
}
// 조건을 건 패스 줄 — 자격 선수 줄(base)마다 워크북 값으로 바꿉니다. 그 선수가 워크북에 없으면 —.
function qRows(base,D){
  const ci={}; D.cols.forEach((c,i)=>ci[c]=i);
  const act=Object.entries(QF).filter(([,v])=>v), agg=new Map(), have=new Set(D.ids);
  for(const r of D.rows){
    if(r[ci.k]!=="P") continue;
    let ok=true;
    for(const [k,v] of act) if(!v.split("|").includes(String(r[ci[k]]??""))){ ok=false; break; }
    if(!ok) continue;
    const id=D.ids[r[0]];
    let a=agg.get(id); if(!a) agg.set(id,a={att:0,cmp:0,yds:0,td:0,int:0});
    a.att++;
    if(+r[ci.cmp]){ a.cmp++; a.yds+=(+r[ci.yds]||0); }
    a.td+=(+r[ci.td]||0); a.int+=(+r[ci.int]||0);
  }
  return base.map(r=>{
    if(!have.has(r.id)) return {...r,att:null,cmp:null,pct:null,ypa:null,yds:null,td:null,int:null,rat:null};
    const a=agg.get(r.id)||{att:0,cmp:0,yds:0,td:0,int:0}, rt=rating(a.cmp,a.att,a.yds,a.td,a.int);
    return {...r,att:a.att,cmp:a.cmp,yds:a.yds,td:a.td,int:a.int,pct:r1(a.cmp*100,a.att),
      ypa:r1(a.yds,a.att),rat:rt==null?null:Math.round(rt*10)/10};
  });
}
function drawQ(){
  const y=sel.value, on=tab==="pass"&&nmOK(y);
  qfil.hidden=!on;
  if(!on){ qfil.innerHTML=""; return; }
  const d=QD[y], wk=qOn()&&d&&d.wk?`<span class="snote">${d.wk[0]}–${d.wk[1]}주</span>`:"";
  qfil.innerHTML=QFIL.map(([k,lb,opts])=>`<div class="sgrp"><i>${esc(lb)}</i>${opts.map(([v,t])=>
    `<button data-fk="${k}" data-fv="${esc(v)}" aria-pressed="${(QF[k]||"")===v}">${esc(t)}</button>`).join("")}</div>`).join("")+wk;
}

// 열을 처음 누를 때의 방향. "좋은 값"이 위로 오게 합니다 — 패스의 INT 는
// 적을수록 좋고(오름차순), 수비의 INT 는 많을수록 좋습니다(내림차순).
function firstDir(k){
  if(k==="n"||k==="p"||k==="t") return 1;
  const c=(CATS[tab][2]||[]).find(x=>x[0]===k);
  return (c && c[2]==="LOW") ? 1 : -1;
}
function state(){ return sort[tab] || {k:CATS[tab][1], dir:firstDir(CATS[tab][1])}; }
// 이름 앞 순위 — 지금 정렬한 칸 기준. 같은 값은 같은 등수(1, 2, 2, 4), 값이 없으면 빈칸,
// 글자 칸(이름·POS·팀)으로 정렬하면 줄 번호.
function ranks(rows,k){
  let prev, pr=0;
  return rows.map((r,i)=>{
    const v=r[k];
    if(v==null) return "";
    if(typeof v==="string") return String(i+1);
    if(i===0||v!==prev){ pr=i+1; prev=v; }
    return String(pr);
  });
}

function draw(){
  const y=sel.value, s=P&&P.seasons[y];
  const [lb,,cols]=CATS[tab];
  drawQ();
  // 진행 중인 시즌은 자격 기준을 치른 경기 수에 비례해 줄인 값(qual_by)을 씁니다.
  // 표 밑 안내 줄은 걷어냈고(줄글 없음), 기준은 머리의 인원 옆 꼬리표로만 남깁니다.
  const qb=(P.qual_by||{})[y];
  if(!s){
    cnt.textContent="";
    out.innerHTML=`<div class="pending">${esc(y)} 개막 전</div>`;
    return;
  }
  let rows=(s[tab]||[]).slice();
  // 조건을 건 패스 표 — 자료를 못 받았으면(실패) 값은 전부 — (조건 없는 값을 조건 값처럼 보이지 않게).
  if(tab==="pass"&&qOn()&&nmOK(y)) rows=qRows(rows,(qReady(y)&&QD[y])||{cols:[],ids:[],rows:[]});
  const st=state();
  rows.sort((a,b)=>{
    const A=a[st.k], B=b[st.k];
    // 그 시즌 원본에 없는 칸은 방향과 무관하게 늘 아래로 보냅니다.
    if(A==null&&B==null) return 0;
    if(A==null) return 1;
    if(B==null) return -1;
    if(typeof A==="string"||typeof B==="string")
      return st.dir*String(A).localeCompare(String(B));
    return st.dir*((A||0)-(B||0));
  });
  const rk=ranks(rows,st.k), pix=nmOK(y)?PIX.players[y]:null;
  const arrow=k=>st.k===k?`<span class="ar">${st.dir>0?"▲":"▼"}</span>`:"";
  const sa=k=>st.k===k?` aria-sort="${st.dir>0?"ascending":"descending"}"`:"";
  // 그 시즌 전부 비어 있는 칸 = 원본에 자료가 없는 칸.
  const dead=new Set(cols.filter(([k])=>rows.length&&rows.every(r=>r[k]==null)).map(c=>c[0]));
  const nm=r=>pix&&r.id&&pix[r.id]&&tab!=="def"
    ? `<span class="pnm" role="button" tabindex="0" data-id="${esc(r.id)}">${esc(r.n)}</span>` : esc(r.n);
  out.innerHTML=`<div class="tw"><table><thead><tr>`
    +`<th class="rn" aria-label="순위"></th>`
    +`<th class="tm" data-k="n"${sa("n")}>선수${arrow("n")}</th>`
    +`<th data-k="p"${sa("p")}>POS${arrow("p")}</th>`
    +`<th data-k="t"${sa("t")}>팀${arrow("t")}</th>`
    +`<th data-k="g"${sa("g")}>G${arrow("g")}</th>`
    +cols.map(([k,cl])=>`<th data-k="${k}"${sa(k)}${dead.has(k)?' class="off"':""}`
        +`>${esc(cl)}${arrow(k)}</th>`).join("")
    +`</tr></thead><tbody>`
    +rows.map((r,i)=>`<tr><td class="rn">${rk[i]}</td><td class="tm">${nm(r)}</td>`
      +`<td class="pos">${esc(r.p)}</td><td class="pos">${esc(r.t)}</td>`
      +`<td>${r.g}</td>`
      +cols.map(([k,,,dec])=>`<td>${r[k]==null ? "—" : (typeof r[k]==="number"
          ? (dec!=null ? r[k].toFixed(dec)
             : r[k].toLocaleString(undefined,{maximumFractionDigits:2})) : esc(r[k]))}</td>`).join("")
      +`</tr>`).join("")
    +`</tbody></table></div>`;
  const q={...P.qual[tab], ...(qb&&qb[tab]!=null?{min:qb[tab]}:{})}, u=UNIT[tab]||"";
  cnt.textContent=`${rows.length}명 · 자격 ${q.min}${u}+`;
}

// 이름 → 시즌 패널(부문에 맞는 종류). 패스 조건을 걸어 둔 채 QB 를 열면 패널에도 같은 조건이 걸립니다.
function openP(id){
  const y=sel.value, ks=String(((PIX&&PIX.players||{})[y]||{})[id]||"").split(" ").filter(Boolean);
  if(!ks.length||typeof panelOpen!=="function") return;
  const want={pass:"qb",rush:"rush",rec:"rec"}[tab], k=ks.includes(want)?want:ks[0];
  panelOpen(id,k,"",y,{season:true,f:k==="qb"?{...QF}:null});
}
tabs.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("button[data-k]");
  if(!b) return;
  tab=b.dataset.k;
  [...tabs.children].forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  draw();
});
qfil.addEventListener("click",async e=>{
  const b=e.target.closest&&e.target.closest("button[data-fk]");
  if(!b) return;
  QF[b.dataset.fk]=b.dataset.fv;
  await ensureQ(sel.value);
  draw();
});
out.addEventListener("click",e=>{
  const n=e.target.closest&&e.target.closest(".pnm");
  if(n){ openP(n.dataset.id); return; }
  const th=e.target.closest&&e.target.closest("th[data-k]");
  if(!th) return;
  const k=th.dataset.k, st=state();
  sort[tab]= st.k===k ? {k,dir:-st.dir} : {k,dir:firstDir(k)};
  draw();
});
out.addEventListener("keydown",e=>{
  const n=(e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest(".pnm");
  if(n){ e.preventDefault(); openP(n.dataset.id); }
});
sel.onchange=async()=>{ await ensureQ(sel.value); draw(); };
draw();
</script>
