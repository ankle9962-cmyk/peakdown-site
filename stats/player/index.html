<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선수 스탯 · 픽다운</title>
<link rel="stylesheet" href="/site.css">
</head>
<body>
<button class="navtog" id="navtog" type="button" aria-label="메뉴 열기"
        aria-expanded="false" aria-controls="sidenav"><span></span><span></span><span></span></button>
<div class="navov" id="navov"></div>
<nav class="sidenav" id="sidenav" aria-label="사이트 메뉴">
  <a href="/">홈</a><a href="/weekly/">주차별 자료</a><a href="/news/">주요 뉴스</a><a href="/columns/">칼럼/분석</a><a href="/standings/">26시즌 팀 순위</a><a href="/stats/team/">팀 스탯</a><a href="/stats/player/" aria-current="page">선수 스탯</a><a href="/teams/">팀별 자료</a>
</nav>
<div class="wrap">
<div class="phd"><h1>선수 스탯</h1>
  <span class="sub">정규시즌 · 부문별 리더</span><span class="cnt" id="cnt"></span></div>
<div class="pickrow">
  <div class="pick"><label for="season">시즌</label><select id="season"></select></div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div>
<div id="out"></div>
<p class="note" id="qual" style="margin-top:18px"></p>
<p class="note" id="gap"></p>
<p class="note dfn" id="defnote" style="display:none">수비 기록은 nflverse 선수 스탯
  릴리스에서 그대로 옵니다. 이 릴리스는 경기의 플레이별 자료(pbp)를 집계해 만든
  것이라 태클·색 수가 NFL 공식 게임북 집계와 다를 수 있습니다 — 2003년 마이클
  스트레이핸의 색이 여기서는 18.0, 공식 기록은 18.5인 식입니다. TFL 은 그 시즌
  플레이에 잡힌 태클 손실야드 기준이고, PD 는 패스 디펜스입니다.</p>
</div>
<script>
(function(){
  var t=document.getElementById('navtog'),
      n=document.getElementById('sidenav'),
      o=document.getElementById('navov');
  if(!t||!n||!o) return;
  function set(open){
    t.setAttribute('aria-expanded',String(open));
    t.setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기');
    n.classList.toggle('on',open);
    o.classList.toggle('on',open);
    if(open){ var a=n.querySelector('a'); if(a) a.focus(); } else { t.focus(); }
  }
  t.addEventListener('click',function(){
    set(t.getAttribute('aria-expanded')!=='true');
  });
  o.addEventListener('click',function(){ set(false); });
  addEventListener('keydown',function(e){
    if(e.key==='Escape'&&t.getAttribute('aria-expanded')==='true') set(false);
  });
})();
</script>
<script src="/player_season_stats.js"></script>
<script>
const SEASONS=[1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];
const CATS={"pass": ["패스", "yds", [["cmp", "성공", "HIGH"], ["att", "시도", "HIGH"], ["yds", "야드", "HIGH"], ["td", "TD", "HIGH"], ["int", "INT", "LOW"], ["rat", "레이팅", "HIGH"]]], "rush": ["러닝", "yds", [["att", "시도", "HIGH"], ["yds", "야드", "HIGH"], ["td", "TD", "HIGH"], ["ypc", "시도당", "HIGH"]]], "rec": ["리시빙", "yds", [["tgt", "타깃", "HIGH"], ["rec", "리셉션", "HIGH"], ["yds", "야드", "HIGH"], ["td", "TD", "HIGH"], ["ypr", "리셉션당", "HIGH"]]], "def": ["수비", "tkl", [["tkl", "솔로", "HIGH"], ["ast", "어시스트", "HIGH"], ["sck", "색", "HIGH"], ["tfl", "TFL", "HIGH"], ["qbh", "QB히트", "HIGH"], ["int", "INT", "HIGH"], ["pd", "PD", "HIGH"], ["ff", "강제펌블", "HIGH"], ["fr", "펌블회수", "HIGH"]]]};
const UNIT={"pass": "시도", "rush": "시도", "rec": "리셉션", "def": "경기"};
const P=(typeof window.PLAYER_SEASON!=="undefined")?window.PLAYER_SEASON:null;
</script>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sel=document.getElementById("season"), out=document.getElementById("out"),
      cnt=document.getElementById("cnt"), qual=document.getElementById("qual"),
      tabs=document.getElementById("tabs"), gap=document.getElementById("gap"),
      note=document.getElementById("defnote");
const KEYS=Object.keys(CATS);
let tab=KEYS[0];                       // 패스가 기본
const sort={};                         // 부문마다 정렬 상태를 따로 둡니다

sel.innerHTML=SEASONS.map(y=>`<option value="${y}">${y}</option>`).join("");
const withData=SEASONS.filter(y=>P&&P.seasons[String(y)]);
sel.value=String(withData.length?withData[withData.length-1]:SEASONS[SEASONS.length-1]);
tabs.innerHTML=KEYS.map((k,i)=>`<button role="tab" data-k="${k}"
  aria-selected="${i===0}">${esc(CATS[k][0])}</button>`).join("");

// 열을 처음 누를 때의 방향. "좋은 값"이 위로 오게 합니다 — 패스의 INT 는
// 적을수록 좋고(오름차순), 수비의 INT 는 많을수록 좋습니다(내림차순).
function firstDir(k){
  if(k==="n"||k==="p"||k==="t") return 1;
  const c=(CATS[tab][2]||[]).find(x=>x[0]===k);
  return (c && c[2]==="LOW") ? 1 : -1;
}
function state(){ return sort[tab] || {k:CATS[tab][1], dir:firstDir(CATS[tab][1])}; }

function draw(){
  const y=sel.value, s=P&&P.seasons[y];
  const [lb,,cols]=CATS[tab];
  note.style.display = (tab==="def") ? "block" : "none";
  if(!s){
    cnt.textContent=""; qual.textContent=""; gap.textContent="";
    out.innerHTML=`<div class="pending">${esc(y)} 시즌 개막 후 집계됩니다</div>`;
    return;
  }
  let rows=(s[tab]||[]).slice();
  const st=state();
  rows.sort((a,b)=>{
    const A=a[st.k], B=b[st.k];
    // 그 시즌 원본에 없는 칸은 방향과 무관하게 늘 아래로 보냅니다.
    if(A==null&&B==null) return 0;
    if(A==null) return 1;
    if(B==null) return -1;
    if(typeof A==="string"||typeof B==="string")
      return st.dir*String(A).localeCompare(String(B));
    return st.dir*((A||0)-(B||0));
  });
  const arrow=k=>st.k===k?`<span class="ar">${st.dir>0?"▲":"▼"}</span>`:"";
  const sa=k=>st.k===k?` aria-sort="${st.dir>0?"ascending":"descending"}"`:"";
  // 그 시즌 전부 비어 있는 칸 = 원본에 자료가 없는 칸.
  const dead=new Set(cols.filter(([k])=>rows.length&&rows.every(r=>r[k]==null)).map(c=>c[0]));
  out.innerHTML=`<div class="tw"><table><thead><tr>`
    +`<th class="tm" data-k="n"${sa("n")}>선수${arrow("n")}</th>`
    +`<th data-k="p"${sa("p")}>POS${arrow("p")}</th>`
    +`<th data-k="t"${sa("t")}>팀${arrow("t")}</th>`
    +`<th data-k="g"${sa("g")}>G${arrow("g")}</th>`
    +cols.map(([k,cl])=>`<th data-k="${k}"${sa(k)}${dead.has(k)?' class="off"':""}`
        +`>${esc(cl)}${arrow(k)}</th>`).join("")
    +`</tr></thead><tbody>`
    +rows.map(r=>`<tr><td class="tm">${esc(r.n)}</td>`
      +`<td class="pos">${esc(r.p)}</td><td class="pos">${esc(r.t)}</td>`
      +`<td>${r.g}</td>`
      +cols.map(([k])=>`<td>${r[k]==null ? "—" : (typeof r[k]==="number"
          ? r[k].toLocaleString(undefined,{maximumFractionDigits:2}) : esc(r[k]))}</td>`).join("")
      +`</tr>`).join("")
    +`</tbody></table></div>`;
  cnt.textContent=`${rows.length}명`;
  const q=P.qual[tab], u=UNIT[tab]||"";
  qual.textContent = (tab==="def")
    ? `자격 ${q.min}${u} 이상 · 칸마다 상위 ${P.deftop}명을 모아 싣습니다`
      +` — 어느 칸으로 정렬해도 그 칸 1위가 표 안에 있습니다.`
      +` 열 제목을 누르면 정렬합니다.`
    : `자격 ${q.min}${u} 이상 · 야드 상위 ${P.top}명까지 싣습니다.`
      +` 열 제목을 누르면 정렬합니다.`;
  const miss=cols.filter(([k])=>dead.has(k)).map(([,cl])=>cl);
  gap.textContent = miss.length
    ? `이 시즌에는 ${miss.join("·")} 원본 자료가 없어 —로 두고 정렬에서도 뺍니다.` : "";
}

tabs.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("button[data-k]");
  if(!b) return;
  tab=b.dataset.k;
  [...tabs.children].forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  draw();
});
out.addEventListener("click",e=>{
  const th=e.target.closest&&e.target.closest("th[data-k]");
  if(!th) return;
  const k=th.dataset.k, st=state();
  sort[tab]= st.k===k ? {k,dir:-st.dir} : {k,dir:firstDir(k)};
  draw();
});
sel.onchange=draw;
draw();
</script>
</body>
</html>
