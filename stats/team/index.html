<script>
(function(){
  var t=document.getElementById('navtog'),
      n=document.getElementById('sidenav'),
      o=document.getElementById('navov');
  if(!t||!n||!o) return;
  function set(open){
    t.setAttribute('aria-expanded',String(open));
    t.setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기');
    n.classList.toggle('on',open);
    o.classList.toggle('on',open);
    if(open){ var a=n.querySelector('a'); if(a) a.focus(); } else { t.focus(); }
  }
  t.addEventListener('click',function(){
    set(t.getAttribute('aria-expanded')!=='true');
  });
  o.addEventListener('click',function(){ set(false); });
  addEventListener('keydown',function(e){
    if(e.key==='Escape'&&t.getAttribute('aria-expanded')==='true') set(false);
  });
})();
</script>
<script src="/team_season_ranks.js"></script>
<script>
const TEAMS={"ARI": "Arizona Cardinals", "ATL": "Atlanta Falcons", "BAL": "Baltimore Ravens", "BUF": "Buffalo Bills", "CAR": "Carolina Panthers", "CHI": "Chicago Bears", "CIN": "Cincinnati Bengals", "CLE": "Cleveland Browns", "DAL": "Dallas Cowboys", "DEN": "Denver Broncos", "DET": "Detroit Lions", "GB": "Green Bay Packers", "HOU": "Houston Texans", "IND": "Indianapolis Colts", "JAX": "Jacksonville Jaguars", "KC": "Kansas City Chiefs", "LA": "Los Angeles Rams", "LAC": "Los Angeles Chargers", "LV": "Las Vegas Raiders", "MIA": "Miami Dolphins", "MIN": "Minnesota Vikings", "NE": "New England Patriots", "NO": "New Orleans Saints", "NYG": "New York Giants", "NYJ": "New York Jets", "PHI": "Philadelphia Eagles", "PIT": "Pittsburgh Steelers", "SEA": "Seattle Seahawks", "SF": "San Francisco 49ers", "TB": "Tampa Bay Buccaneers", "TEN": "Tennessee Titans", "WAS": "Washington Commanders"};
const SEASONS=[1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];
const TABS=[{"n": "기본", "c": [["rec", "승-패"], ["pf", "득점"], ["off_yds", "총야드"], ["off_pass", "패싱야드"], ["off_rush", "러싱야드"], ["pa", "실점"], ["def_yds", "허용야드"], ["def_pass", "허용패싱"], ["def_rush", "허용러싱"]], "d": "rec"}, {"n": "공격", "c": [["pf", "득점"], ["off_yds", "총야드"], ["off_epa", "플레이당 EPA"], ["off_third", "서드다운 갱신율"], ["off_rz", "레드존 TD 성공률"], ["off_giveaway", "턴오버"]], "d": "pf"}, {"n": "패스", "c": [["off_pass", "패싱야드"], ["off_pass_att", "패스시도"], ["off_cmp_pct", "패스 성공률"], ["off_pass_td", "패싱 TD"], ["off_int", "인터셉션"], ["off_rating", "패서레이팅"], ["off_adot", "ADOT"]], "d": "off_pass"}, {"n": "러닝", "c": [["off_rush", "러싱야드"], ["off_rush_att", "러싱시도"], ["off_rush_ypc", "시도당 러싱야드"], ["off_rush_td", "러싱 TD"], ["off_bp_run", "빅플레이 러싱 10+"]], "d": "off_rush"}, {"n": "수비", "c": [["pa", "실점"], ["def_yds", "허용야드"], ["def_epa", "허용 플레이당 EPA"], ["def_third", "서드다운 방어율"], ["def_rz", "레드존 방어율"], ["def_takeaway", "테이크어웨이"]], "d": "pa"}, {"n": "패스(수비)", "c": [["def_pass", "허용 패싱야드"], ["def_cmp_pct", "허용 패스 성공률"], ["def_pass_td", "허용 패싱 TD"], ["def_ints", "인터셉션"], ["def_sk", "색"]], "d": "def_pass"}, {"n": "러닝(수비)", "c": [["def_rush", "허용 러싱야드"], ["def_rush_ypc", "허용 시도당 러싱야드"], ["def_rush_td", "허용 러싱 TD"]], "d": "def_rush"}, {"n": "효율", "reg": true, "g": "효율"}, {"n": "플레이콜", "reg": true, "g": "플레이콜"}, {"n": "드라이브", "reg": true, "g": "드라이브"}, {"n": "수비 차팅", "reg": true, "g": "수비 차팅"}, {"n": "스페셜팀", "reg": true, "g": "스페셜팀"}];
const UNIT={"off_third": "%", "off_rz": "%", "off_cmp_pct": "%", "def_third": "%", "def_rz": "%", "def_cmp_pct": "%"};
const R=(typeof window.TEAM_SEASON_RANKS!=="undefined")?window.TEAM_SEASON_RANKS:null;

// ── 주 범위 ──────────────────────────────────────────────────────────────
// 성분(분자·분모가 될 합계)을 고른 주만큼 더한 다음 마지막에 한 번 나눕니다.
// 주별 비율을 평균 내면 플레이 수가 다른 주가 같은 무게를 가져 시즌 값과
// 어긋납니다 — 그래서 값이 아니라 성분을 저장합니다.
let wkFrom=null, wkTo=null, perGame=false;
function wkClamp(file){
  const ws=(file&&file.weeks)||[];
  if(!ws.length){ wkFrom=wkTo=null; return ws; }
  const lo=ws[0], hi=ws[ws.length-1];
  if(wkFrom==null||ws.indexOf(wkFrom)<0) wkFrom=lo;
  if(wkTo==null||ws.indexOf(wkTo)<0) wkTo=hi;
  if(wkTo<wkFrom) wkTo=wkFrom;
  return ws;
}
// 고른 주의 성분을 더합니다. box 는 {주: [성분…]}.
function wkSum(box, ci){
  const out=new Array(ci.length).fill(0);
  if(!box) return out;
  for(const w in box){
    const n=+w;
    if(n<wkFrom||n>wkTo) continue;
    const v=box[w];
    for(let i=0;i<out.length;i++) out[i]+=(v[i]||0);
  }
  return out;
}
function wkLabel(){
  if(wkFrom==null) return "";
  return wkFrom===wkTo?`${wkFrom}주`:`${wkFrom}–${wkTo}주`;
}
// 빠른 고르기 — 시즌 전체 · 최근 4주 · 고정 구간.
function wkPresets(ws){
  if(!ws.length) return [];
  const hi=ws[ws.length-1], lo=ws[0];
  const out=[["all",`시즌 전체`,lo,hi],["last4","최근 4주",Math.max(lo,hi-3),hi]];
  [[1,4],[5,8],[9,12],[13,18]].forEach(([a,b])=>{
    if(ws.some(w=>w>=a&&w<=b)) out.push([`b${a}`,`${a}–${b}`,Math.max(a,lo),Math.min(b,hi)]);
  });
  return out;
}
let wkHasCount=false;
function paintWeeks(file){
  const box=document.getElementById("weeks");
  if(!box) return;
  const ws=wkClamp(file);
  if(!ws.length){ box.hidden=true; return; }
  box.hidden=false;
  const opt=(v,sel)=>`<option value="${v}"${v===sel?" selected":""}>${v}주</option>`;
  box.innerHTML=`<span class="sgrp"><i>주차</i>`
    +`<select id="wfrom">${ws.map(w=>opt(w,wkFrom)).join("")}</select>`
    +`<span class="wtil">~</span>`
    // "to" 는 "from" 보다 앞설 수 없습니다 — 앞 주는 아예 목록에 안 넣습니다.
    +`<select id="wto">${ws.filter(w=>w>=wkFrom).map(w=>opt(w,wkTo)).join("")}</select>`
    +`</span><span class="sgrp"><i>빠른 고르기</i>`
    +wkPresets(ws).map(([k,lb,a,b])=>`<button data-wk="${a}:${b}"
        aria-pressed="${String(a===wkFrom&&b===wkTo)}">${esc(lb)}</button>`).join("")
    +`</span>`
    +(wkHasCount?`<span class="sgrp"><i>보기</i>`
      +`<button data-pg="0" aria-pressed="${String(!perGame)}">합계</button>`
      +`<button data-pg="1" aria-pressed="${String(perGame)}">경기당</button></span>`
      :`<span class="sgrp"><i>보기</i><span class="snote">이 묶음은 전부 비율·평균이라
        합계/경기당 구분이 없습니다.</span></span>`);
}
document.getElementById("weeks").addEventListener("change",e=>{
  if(e.target.id==="wfrom"){ wkFrom=+e.target.value; if(wkTo<wkFrom) wkTo=wkFrom; draw(); }
  else if(e.target.id==="wto"){ wkTo=+e.target.value; draw(); }
});
document.getElementById("weeks").addEventListener("click",e=>{
  const w=e.target.closest&&e.target.closest("button[data-wk]");
  if(w){ const [a,b]=w.dataset.wk.split(":").map(Number); wkFrom=a; wkTo=b; draw(); return; }
  const p=e.target.closest&&e.target.closest("button[data-pg]");
  if(p){ perGame=p.dataset.pg==="1"; draw(); }
});

// 받아 온 것은 두 번 받지 않습니다.
const REGC={reg:null, files:{}};
function getJSON(url){
  return fetch(url,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
}
function regLoad(){
  if(REGC.reg) return Promise.resolve(REGC.reg);
  // 실패는 캐시하지 않습니다 — 한 번 못 받았다고 그 뒤로 영영 "자료 없음"이
  // 되면, 잠깐 끊긴 것과 진짜로 없는 것을 구별할 수 없습니다.
  return getJSON("/splits/registry.json").then(j=>{ if(j) REGC.reg=j; return j; });
}
function splitLoad(y,sp){
  const k=y+"|"+sp;
  if(REGC.files[k]) return Promise.resolve(REGC.files[k]);
  return getJSON(`/splits/team_${y}_${sp}.json`).then(j=>{ if(j) REGC.files[k]=j; return j; });
}
const regBox=(rows,t,stat)=>((rows[t]||{})[stat.sd==="def"?"def":(stat.k.slice(0,3)==="st_"?"st":"off")])||null;
// 고른 주의 성분 합. 한 팀·한 쪽마다 한 번만 더하고 캐시합니다.
let SUMC={};
function regSum(file,rows,t,stat){
  const st=stat.k.slice(0,3)==="st_";
  const side=st?"st":(stat.sd==="def"?"def":"off");
  const key=t+"|"+side;
  if(SUMC[key]) return SUMC[key];
  const ci=st?(file.stcomp||[]):(file.comp||[]);
  const idx=st?(file._six||(file._six=Object.fromEntries(ci.map((c,i)=>[c,i]))))
              :(file._cix||(file._cix=Object.fromEntries(ci.map((c,i)=>[c,i]))));
  const v=wkSum(regBox(rows,t,stat),ci);
  const o={v,idx};
  SUMC[key]=o; return o;
}
// 비율은 여기서 딱 한 번 만들어집니다 — 분자 합 ÷ 분모 합.
function regVal(file,rows,t,stat){
  const s=regSum(file,rows,t,stat);
  const ni=s.idx[stat.num], di=s.idx[stat.den];
  if(ni===undefined||di===undefined) return null;
  const den=s.v[di];
  if(!den) return null;
  let out=s.v[ni]/den*(stat.sc||1);
  // PROE 는 "패스율 − 기대 패스율" 이라 두 비율의 차입니다.
  if(stat.k==="pc_proe"){
    const dbi=s.idx["db"], ni2=s.idx["xpass_sum"];
    out=(s.v[dbi]/den - s.v[ni2]/den)*100;
  }
  return out;
}
// 최소 표본 — 등록부의 (세는 대상, 개수). 세는 대상은 파일이 같이 실어 보낸
// _n(센 플레이) · _db(드롭백) 같은 칸입니다.
// 등록부의 min_n 이 세는 대상 → 성분 이름. 성분 이름이 바뀌면 여기도 같이
// 고쳐야 합니다(안 맞으면 표본 수가 0 으로 읽혀 표가 통째로 비어 버립니다).
const REG_NKEY={plays:"n",dropbacks:"db",rushes:"ru",drives:"dr",games:"g",
  pa_plays:"pa",rpo_plays:"rpo",blitz:"blitz",light:"light",heavy:"heavy",
  fg_u30:"fg_u30",fg_30:"fg_30",fg_40:"fg_40",fg_50:"fg_50",xp:"xp",
  punts:"punts",kr:"kr",pr:"pr"};
function regN(file,rows,t,stat){
  const s=regSum(file,rows,t,stat);
  const i=s.idx[REG_NKEY[stat.min[0]]||"n"];
  return i===undefined?0:(s.v[i]||0);
}
const regOK=(file,rows,t,stat)=>regN(file,rows,t,stat)>=stat.min[1];
// 경기 수 — 고른 주 안에서 그 팀이 치른 경기 수입니다.
function regG(file,rows,t){
  const s=regSum(file,rows,t,{k:"g",sd:"off",num:"g",den:"g",min:["plays",0]});
  const i=s.idx["g"];
  return i===undefined?0:(s.v[i]||0);
}

function drawReg(){
  const y=sel.value, g=TABS[tab].g;
  // 스플릿을 걸 수 없는 묶음(스페셜팀)은 늘 전체로 봅니다 — 조건이 안 붙는
  // 플레이라서, 다운·쿼터를 고른 채로 두면 빈 칸만 나옵니다.
  const noSp=((REGC.reg||{}).nosplit||[]).indexOf(g)>=0;
  const sp=noSp?"all":curSplit;
  out.innerHTML=`<div class="pending">불러오는 중…</div>`;
  Promise.all([regLoad(), splitLoad(y,sp)]).then(([reg,file])=>{
    if(!reg){ out.innerHTML=`<div class="pending">스탯 등록부(/splits/registry.json)를
      못 받았습니다 — 새로고침해 보세요.</div>`; cnt.textContent=""; return; }
    paintSplits(reg, y, noSp2(reg,g));
    // 굽지 않은 시즌 — 받기 실패와 구별해서 말합니다.
    const have=(reg.seasons||[]);
    if(have.length && have.indexOf(Number(y))<0){
      out.innerHTML=`<div class="pending">${esc(y)} 시즌은 이 묶음의 자료를 굽지
        않았습니다 — 지금은 ${esc(have.join(" · "))} 시즌만 있습니다.</div>`;
      cnt.textContent=""; return;
    }
    if(!file){
      out.innerHTML=`<div class="pending">${esc(y)} 시즌 · ${esc(splitLabel(reg,sp))} 자료를
        못 받았습니다 (/splits/team_${esc(y)}_${esc(sp)}.json).</div>`;
      cnt.textContent=""; return; }
    const rows=file.teams, teams=Object.keys(rows).sort();
    SUMC={};                      // 주 범위가 바뀌면 합을 다시 냅니다
    wkHasCount=reg.stats.some(x=>x.g===g && x.pg);
    paintWeeks(file);
    // 이 스플릿에 플레이가 아예 없으면 빈 표 대신 그렇게 말합니다 —
    // 옛 표를 그대로 두면 다른 조건의 숫자를 이 조건의 숫자로 읽게 됩니다.
    const NST={k:"n",sd:"off",num:"n",den:"n",min:["plays",0]};
    const DST={k:"n",sd:"def",num:"n",den:"n",min:["plays",0]};
    const tot=teams.reduce((a,t)=>a+regN(file,rows,t,NST),0);
    const dtot=teams.reduce((a,t)=>a+regN(file,rows,t,DST),0);
    if(!tot&&!dtot){
      out.innerHTML=`<div class="pending">${esc(splitLabel(reg,sp))} — ${esc(y)} 시즌에는
        이 조건에 해당하는 플레이가 없습니다.</div>`;
      cnt.textContent=""; return;
    }
    const stats=reg.stats.filter(s=>s.g===g && Number(y)>=s.first);
    const hidden=reg.stats.filter(s=>s.g===g && Number(y)<s.first);
    if(!stats.length){
      out.innerHTML=`<div class="pending">${esc(y)} 시즌에는 이 묶음의 자료가 없습니다 —`
        +` ${esc(hidden.map(s=>s.lb).join(" · "))} 는 ${esc(String((hidden[0]||{}).first||""))} 시즌부터입니다.</div>`;
      cnt.textContent=""; return;
    }
    const sk=sort.k, ss=stats.find(s=>(s.k+"|"+s.sd)===sk)||stats[0];
    const list=teams.slice().sort((a,b)=>{
      const va=regVal(file,rows,a,ss), vb=regVal(file,rows,b,ss);
      if(va==null&&vb==null) return a.localeCompare(b);
      if(va==null) return 1;
      if(vb==null) return -1;
      return sort.dir*(ss.dir==="LOW"?(va-vb):(vb-va));
    });
    const arrow=k=>sort.k===k?`<span class="ar">${sort.dir>0?"▲":"▼"}</span>`:"";
    cnt.textContent=`${list.length}팀 · ${esc(splitLabel(reg,sp))}`
      +(wkLabel()?` · ${wkLabel()}`:"")+` · 플레이 ${tot.toLocaleString()}`;
    const ftn=stats.some(s=>s.src==="ftn");
    const head=`<tr><th class="tm" data-k="t">팀</th><th class="rn" title="고른 주 안에서 치른 경기 수">G</th><th class="rn">n</th>`
      +stats.map(s=>`<th data-k="${esc(s.k+"|"+s.sd)}" title="${esc(s.f+(s.model?" · nflverse 모델값":""))}"
          >${esc(s.lb)}${arrow(s.k+"|"+s.sd)}</th>`).join("")+`</tr>`;
    const body=list.map(t=>{
      const n=regN(file,rows,t,NST), dn=regN(file,rows,t,DST), gms=regG(file,rows,t);
      return `<tr><td class="tm">${esc(TEAMS[t]||t)}</td>`
        +`<td class="rn">${gms}</td>`
        +`<td class="rn" title="센 플레이 수(공격/수비)">${n}/${dn}</td>`
        +stats.map(s=>{
          let v=regVal(file,rows,t,s);
          if(v==null) return `<td>—</td>`;
          // "경기당" 은 누적값에만 걸립니다 — 비율 칸은 그대로입니다.
          let u=s.u||"";
          if(perGame&&s.pg){ if(!gms) return `<td>—</td>`; v=v/gms; u=u+"/G"; }
          const thin=!regOK(file,rows,t,s);
          const txt=(s.dec?Number(v).toFixed(s.dec):Math.round(v).toLocaleString())+u;
          return `<td class="${thin?"thin":""}" title="${esc("n="+regN(file,rows,t,s))}">${esc(txt)}</td>`;
        }).join("")+`</tr>`;
    }).join("");
    out.innerHTML=`<div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`
      +(ftn?`<p class="lic">이 표에는 FTN 차팅(2022~)에서 온 값이 들어 있습니다 —
          이 표는 <b>CC BY-SA 4.0</b> 으로 제공됩니다. 차팅: FTN Data via nflverse.</p>`:"")
      +(hidden.length?`<p class="lic">${esc(hidden.map(s=>s.lb).join(" · "))} 는
          ${esc(String((hidden[0]||{}).first||""))} 시즌부터라 이 시즌에는 칸이 없습니다.</p>`:"");
    gap.textContent="";
  });
}
// 스플릿 막대 — 등록부가 준 목록 그대로. FTN 스플릿은 그 시즌에 FTN 이 있을 때만.
let curSplit="all";
const noSp2=(reg,g)=>((reg||{}).nosplit||[]).indexOf(g)>=0;
function splitLabel(reg,k){
  if(k&&k.slice(0,4)==="opp_") return "상대 "+(TEAMS[k.slice(4)]||k.slice(4));
  const s=((reg||{}).splits||[]).find(x=>x.k===k);
  return s?s.lb:k;
}
function paintSplits(reg,y,noSp){
  const box=document.getElementById("splits");
  if(!box) return;
  if(noSp){
    box.hidden=false;
    box.innerHTML=`<span class="sgrp"><i>스플릿</i><span class="snote">이 묶음은
      스크리미지 플레이가 아니라서 상황별로 나누지 않습니다 — 전체만 냅니다.</span></span>`;
    return;
  }
  box.hidden=false;
  const FTN_FIRST=2022;
  const grp=[];
  reg.splits.forEach(s=>{ const g=grp.find(x=>x[0]===s.g); (g?g[1]:(grp.push([s.g,[]]),grp[grp.length-1][1])).push(s); });
  box.innerHTML=grp.map(([g,ss])=>`<span class="sgrp"><i>${esc(g)}</i>`
    +ss.map(s=>{
      const off=s.ftn&&Number(y)<FTN_FIRST;
      const why=off?` — FTN 차팅은 ${FTN_FIRST} 시즌부터입니다`:"";
      return `<button data-sp="${esc(s.k)}" aria-pressed="${String(s.k===curSplit)}"
        ${off?"disabled":""} title="${esc(s.lb+why)}">${esc(s.lb)}</button>`;
    }).join("")+`</span>`).join("")
    +`<span class="sgrp"><i>상대 팀</i><select id="oppsel"><option value="">상대 팀…</option>`
    +Object.keys(TEAMS).sort().map(t=>`<option value="opp_${esc(t)}"${("opp_"+t)===curSplit?" selected":""}
        >${esc(TEAMS[t]||t)}</option>`).join("")+`</select></span>`;
}
document.getElementById("splits").addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("button[data-sp]");
  if(!b||b.disabled) return;
  curSplit=b.dataset.sp; draw();
});
document.getElementById("splits").addEventListener("change",e=>{
  if(e.target.id!=="oppsel") return;
  curSplit=e.target.value||"all"; draw();
});

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sel=document.getElementById("season"), out=document.getElementById("out"),
      cnt=document.getElementById("cnt"), tabs=document.getElementById("tabs"),
      gap=document.getElementById("gap"), early=document.getElementById("early");
let tab=0, sort={k:TABS[0].d,dir:1};
sel.innerHTML=SEASONS.map(y=>`<option value="${y}">${y}</option>`).join("");
const withData=SEASONS.filter(y=>R&&R.seasons[String(y)]);
sel.value=String(withData.length?withData[withData.length-1]:SEASONS[SEASONS.length-1]);
tabs.innerHTML=TABS.map((t,i)=>`<button role="tab" data-i="${i}"
  aria-selected="${i===0}">${esc(t.n)}</button>`).join("");
const idx=k=>R.keys.indexOf(k);
// 승-패 칸은 전적 문자열을 보여 주고 순위·정렬은 승률(wpct)로 합니다.
const dataKey=k=>k==="rec"?"wpct":k;
function cell(rows,t,k){
  if(k==="rec") return (R.rec&&R.rec[sel.value]&&R.rec[sel.value][t])||"—";
  const i=idx(k); if(i<0) return "—";
  const v=rows[t][2*i];
  if(v==null) return "—";
  // 표시 자릿수는 자료 파일이 정합니다 — 보드 왼쪽 열과 같은 자릿수입니다.
  const dc=(R.dec&&R.dec[k]!=null)?R.dec[k]:0;
  return (dc ? v.toFixed(dc) : Math.round(v).toLocaleString()) + (UNIT[k]||"");
}
function rankOf(rows,t,k){ const i=idx(dataKey(k)); return i<0?null:rows[t][2*i+1]; }
function valOf(rows,t,k){ const i=idx(dataKey(k)); return i<0?null:rows[t][2*i]; }
function draw(){
  // 등록부 탭은 스플릿 파일에서 그립니다 — 기존 탭은 예전 그대로입니다.
  if(TABS[tab]&&TABS[tab].reg){ early.hidden=true; drawReg(); return; }
  document.getElementById("splits").hidden=true;
  document.getElementById("weeks").hidden=true;
  const y=sel.value, rows=R&&R.seasons[y];
  // 순위를 보류한 시즌(시즌 초) — {팀: 치른 경기 수}. 없으면 순위가 있는 시즌.
  const un=R&&R.unranked&&R.unranked[y];
  early.hidden=!(rows&&un);
  if(rows&&un){
    const g=Object.values(un), n=g.filter(x=>x>0).length;
    early.innerHTML=`<b>${esc(y)} 시즌 진행 중 — 경기를 치른 팀 ${n}곳 · 팀당 최다 `
      +`${Math.max(...g)}경기.</b> 한두 경기로 매긴 순위는 순위가 아니라서, 모든 팀이 `
      +`${esc(R.min_gp)}경기를 치를 때까지 순위 표시를 달지 않습니다. 줄 순서는 값 `
      +`순서일 뿐 순위가 아닙니다. 0-0 팀은 아직 경기를 치르지 않은 팀이라 기록이 —입니다.`;
  }
  if(!rows){
    cnt.textContent=""; gap.textContent="";
    out.innerHTML=`<div class="pending">${esc(y)} 시즌 개막 후 집계됩니다</div>`;
    return;
  }
  const cols=TABS[tab].c;
  const list=Object.keys(rows).slice();
  list.sort((a,b)=>{
    if(sort.k==="t") return sort.dir*a.localeCompare(b);
    const ra=rankOf(rows,a,sort.k), rb=rankOf(rows,b,sort.k);
    // 순위를 보류한 시즌은 값 순서로만 세웁니다 — 좋은 쪽이 위(방향은 자료 파일).
    // 순위가 있는 시즌에는 값만 있고 순위가 없는 칸이 없어서 이 길을 안 탑니다.
    if(ra==null&&rb==null){
      const va=valOf(rows,a,sort.k), vb=valOf(rows,b,sort.k);
      if(va!=null&&vb!=null&&va!==vb){
        const hi=((R.dir||{})[dataKey(sort.k)]||"HIGH")==="HIGH";
        return sort.dir*(hi?vb-va:va-vb);
      }
      if(va!=null&&vb==null) return -1;
      if(va==null&&vb!=null) return 1;
    }
    // 자료가 없는 칸은 방향과 무관하게 항상 아래로 보냅니다.
    if(ra==null&&rb==null) return a.localeCompare(b);
    if(ra==null) return 1;
    if(rb==null) return -1;
    return sort.dir*(ra-rb);
  });
  const arrow=k=>sort.k===k?`<span class="ar">${sort.dir>0?"▲":"▼"}</span>`:"";
  const sa=k=>sort.k===k?` aria-sort="${sort.dir>0?"ascending":"descending"}"`:"";
  cnt.textContent=`${list.length}팀`;
  const missing=cols.filter(([k])=>k!=="rec"&&list.every(t=>valOf(rows,t,k)==null))
                    .map(([,lb])=>lb);
  gap.textContent=missing.length
    ? `이 시즌에는 ${missing.join("·")} 원본 자료가 없어 —로 둡니다.` : "";
  out.innerHTML=`<div class="tw"><table><thead><tr>`
    +`<th class="tm" data-k="t"${sa("t")}>팀${arrow("t")}</th>`
    +cols.map(([k,lb])=>`<th data-k="${k}"${sa(k)}>${esc(lb)}${arrow(k)}</th>`).join("")
    +`</tr></thead><tbody>`
    +list.map(t=>`<tr><td class="tm">${esc(TEAMS[t]||t)}</td>`
      +cols.map(([k])=>{
        // 이 페이지에는 등수 뱃지를 달지 않습니다 — 표가 정렬되므로 순서가
        // 곧 등수이고, 칸마다 "1위" 를 덧붙이면 숫자를 읽기 어려워집니다.
        // 보드 왼쪽 열과 코치 패널의 등수는 그대로 둡니다.
        const txt=cell(rows,t,k);
        return `<td>${esc(txt)}</td>`;
      }).join("")+`</tr>`).join("")
    +`</tbody></table></div>`;
}
tabs.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("button[data-i]");
  if(!b) return;
  tab=+b.dataset.i;
  [...tabs.children].forEach((x,i)=>x.setAttribute("aria-selected",String(i===tab)));
  sort={k:TABS[tab].reg?"":TABS[tab].d,dir:1};
  draw();
});
out.addEventListener("click",e=>{
  const th=e.target.closest&&e.target.closest("th[data-k]");
  if(!th) return;
  const k=th.dataset.k;
  sort = sort.k===k ? {k,dir:-sort.dir} : {k,dir:1};
  draw();
});
sel.onchange=draw;
draw();
</script>
