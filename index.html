<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>픽다운 — NFL 뎁스차트와 시즌 기록</title>
<link rel="stylesheet" href="/site.css">
<style>
/* ── 첫 화면 ─────────────────────────────────────────────────────────────
   보드와 같은 팔레트, 같은 왼쪽 정렬 리듬입니다. 다른 건 활자뿐입니다.
   글꼴 두 벌은 이 페이지에서만 부릅니다 — site.css 에 넣으면 표가 빽빽한
   보드·스탯 페이지의 글자 폭이 같이 바뀌어 배치가 흔들립니다. */
@font-face{font-family:"Archivo Expanded";font-style:normal;
 font-weight:900;font-display:swap;
 src:url("/assets/fonts/archivo-expanded-black.woff2") format("woff2")}
@font-face{font-family:"Peakdown Sans KR";font-style:normal;font-weight:400;
 font-display:swap;
 src:url("/assets/fonts/peakdown-sans-kr-400.woff2") format("woff2")}
@font-face{font-family:"Peakdown Sans KR";font-style:normal;font-weight:600;
 font-display:swap;
 src:url("/assets/fonts/peakdown-sans-kr-600.woff2") format("woff2")}
/* --mark 는 새 색이 아니라 보드가 원정 팀에 쓰는 --team-b 와 같은 값입니다.
   첫 화면에서만 쓰므로 전역 토큰이 아니라 이 페이지 body 에 답니다. */
body.hm{--mark:#c60c30;background:var(--bg)}
/* 로고는 화면 오른쪽에서 잘려 나갑니다. 가운데에 옅게 깐 "도장"이 아니라
   의도한 그래픽 요소로 읽히게 하려는 배치입니다. position:fixed 라 본문
   흐름을 한 픽셀도 밀지 않고, z-index 0 이라 사이드바(200) 아래입니다. */
.hmbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* 화면 한가운데. 상자는 정사각이고 contain 이라 공이 잘리지 않고 통째로
   들어옵니다. 원본 PNG 는 공 둘레에 투명 여백이 있어서(가로 72%·세로 62%만
   차지) 그 여백이 곧 사방 여백이 됩니다.
   폭을 55vw 로 묶은 이유: 960px 위에서는 사이드바가 264px 를 덮고 있는데,
   더 키우면 좁은 데스크톱(약 960~1100px)에서 공 왼쪽이 사이드바 뒤로
   들어가 잘려 보입니다. 55vw 면 어느 폭에서도 공이 사이드바를 넘지 않습니다. */
.hmlogo{position:absolute;top:50%;left:50%;translate:-50% -50%;
 width:min(88vh,55vw);aspect-ratio:1;
 background-repeat:no-repeat;background-size:contain;
 background-position:center;
 /* 흐리게 빼는 건 취향이 아니라 필요입니다 — 로고 안에 "픽다운" 글자가
    들어 있어서, 또렷하게 두면 워드마크 옆에 두 번째 제목처럼 읽힙니다. */
 filter:grayscale(1) brightness(1.25) contrast(.6) blur(6px);opacity:.06}
.wrap.home{position:relative;z-index:1;max-width:1180px;
 padding:clamp(48px,9vh,104px) clamp(20px,4vw,56px) 72px}

/* 워드마크. 폭은 자간이 아니라 얼굴이 만듭니다 — Archivo 를 wdth 125 로
   고정해 구웠고, 그래서 자간은 오히려 조입니다. */
/* 글자 수가 고정(PEAKDOWN 8자)이라 폭은 글자 크기에 정비례합니다. 본문 칸을
   넘지 않는 선에서 가장 크게 잡았습니다 — 넘기면 1920 에서는 칸 밖으로 흘러
   나가고 390 에서는 페이지가 통째로 가로로 굴렀습니다. */
.wm{font-family:"Archivo Expanded",var(--font);font-weight:900;
 font-size:min(8.4vw,140px);line-height:.92;letter-spacing:-.025em;
 color:var(--ink);margin:0}
.wmrule{width:clamp(64px,7vw,124px);height:5px;background:var(--mark);
 margin:clamp(14px,1.8vh,26px) 0 clamp(18px,2.4vh,30px);border-radius:1px}
.tag{font-family:"Peakdown Sans KR",var(--font);font-size:clamp(15px,1.15vw,19px);
 font-weight:400;color:var(--dim);letter-spacing:-.005em;max-width:34em;margin:0}

/* 진입점 — 카드가 아니라 실선으로 나뉜 줄입니다. hover 는 배경이 아니라
   왼쪽에 들어오는 빨간 선으로. */
.ent{margin:clamp(40px,6vh,72px) 0 0;border-top:1px solid var(--line);
 max-width:46em}
.ent a{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr);
 gap:6px 28px;align-items:baseline;padding:18px 4px 18px 0;
 border-bottom:1px solid var(--line);text-decoration:none;color:inherit;
 position:relative}
.ent a::before{content:"";position:absolute;left:-16px;top:50%;translate:0 -50%;
 width:3px;height:0;background:var(--mark);transition:height .14s ease}
.ent a:hover::before,.ent a:focus-visible::before{height:calc(100% - 22px)}
.ent .k{font-family:"Peakdown Sans KR",var(--font);font-size:clamp(17px,1.4vw,21px);
 font-weight:600;color:var(--ink);letter-spacing:-.015em}
.ent .d{font-family:"Peakdown Sans KR",var(--font);font-size:14.5px;color:var(--dim)}
.ent a:hover .k,.ent a:focus-visible .k{color:#fff}
.ent a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}

/* 최근 경기 — 이 페이지에서 유일하게 떠 있는 면입니다. 표가 아니라 활자로
   짭니다. 주 이름을 반드시 같이 적습니다(프리시즌 결과를 정규시즌으로
   읽으면 안 되니까). */
.lw{margin:clamp(36px,5vh,60px) 0 0;background:var(--board);
 border:1px solid var(--line);border-radius:10px;padding:20px 22px;
 max-width:34em}
.lw h2{font-family:"Peakdown Sans KR",var(--font);font-size:13px;font-weight:600;
 color:var(--dim);letter-spacing:.02em;margin:0 0 14px}
.lw h2 b{color:var(--ink);font-weight:600}
.lwg{display:grid;gap:9px;font-variant-numeric:tabular-nums}
.lwr{display:grid;grid-template-columns:3.4em 2.6em 3.4em 2.6em;gap:0 10px;
 align-items:baseline;font-family:"Peakdown Sans KR",var(--font);font-size:15px}
.lwr .t{font-weight:600;color:var(--dim);letter-spacing:.01em}
.lwr .s{color:var(--dim)}
.lwr .win{color:var(--ink)}
.lw a{display:inline-block;margin-top:16px;font-family:"Peakdown Sans KR",var(--font);
 font-size:13.5px;font-weight:600;color:var(--dim);text-decoration:none;
 border-bottom:1px solid var(--line);padding-bottom:2px}
.lw a:hover,.lw a:focus-visible{color:var(--ink);border-bottom-color:var(--mark)}

@media(max-width:960px){
  /* 사이드바가 서랍으로 빠져 화면을 다 쓰므로 폭 제한을 풉니다. */
  .hmlogo{width:min(80vh,88vw);opacity:.05}
  /* 사이드바가 빠져 본문이 화면 전체를 쓰므로 비율을 다시 잡습니다. */
  .wm{font-size:min(11.2vw,120px)}
  .wrap.home{padding-top:74px}
}
@media(max-width:640px){
  .ent a{grid-template-columns:1fr;gap:3px;padding:15px 4px 15px 0}
  .ent a::before{left:-10px}
  .ent .d{font-size:13.5px}
  .lw{padding:16px 15px}
  .wmrule{height:4px}
}
@media(prefers-reduced-motion:reduce){
  .ent a::before{transition:none}
}
</style>
</head>
<body class="hm">
<button class="navtog" id="navtog" type="button" aria-label="메뉴 열기"
        aria-expanded="false" aria-controls="sidenav"><span></span><span></span><span></span></button>
<div class="navov" id="navov"></div>
<nav class="sidenav" id="sidenav" aria-label="사이트 메뉴">
  <a href="/" aria-current="page">홈</a><a href="/weekly/">주차별 자료</a><a href="/news/">주요 뉴스</a><a href="/columns/">칼럼/분석</a><a href="/standings/">26시즌 팀 순위</a><a href="/stats/team/">팀 스탯</a><a href="/stats/player/">선수 스탯</a><a href="/teams/">팀별 자료</a>
</nav>
<div class="wrap home">
<div class="hmbg" aria-hidden="true"><div class="hmlogo" style="background-image:url('/assets/logo.png')"></div></div>
<h1 class="wm">PEAKDOWN</h1>
<div class="wmrule"></div>
<p class="tag">NFL 뎁스차트와 시즌 기록을 한국어로 정리합니다.</p>
<nav class="ent" aria-label="바로 가기"><a href="/teams/"><span class="k">팀별 자료</span><span class="d">32팀 뎁스차트와 로스터</span></a><a href="/weekly/"><span class="k">주차별 자료</span><span class="d">주별 경기 결과와 박스스코어</span></a><a href="/stats/team/"><span class="k">팀 스탯</span><span class="d">시즌별 32팀 기록 순위</span></a><a href="/stats/player/"><span class="k">선수 스탯</span><span class="d">부문별 시즌 리더</span></a></nav>
<section class="lw"><h2>최근 경기 <b>프리시즌 4주</b></h2><div class="lwg"><div class="lwr"><span class="t win">CHI</span><span class="s win">24</span><span class="t">TEN</span><span class="s">15</span></div><div class="lwr"><span class="t win">DET</span><span class="s win">25</span><span class="t">IND</span><span class="s">16</span></div><div class="lwr"><span class="t">MIN</span><span class="s">6</span><span class="t win">DEN</span><span class="s win">34</span></div></div><a href="/weekly/">주차별 자료에서 전체 보기</a></section>
</div>
<script>
(function(){
  var t=document.getElementById('navtog'),
      n=document.getElementById('sidenav'),
      o=document.getElementById('navov');
  if(!t||!n||!o) return;
  function set(open){
    t.setAttribute('aria-expanded',String(open));
    t.setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기');
    n.classList.toggle('on',open);
    o.classList.toggle('on',open);
    if(open){ var a=n.querySelector('a'); if(a) a.focus(); } else { t.focus(); }
  }
  t.addEventListener('click',function(){
    set(t.getAttribute('aria-expanded')!=='true');
  });
  o.addEventListener('click',function(){ set(false); });
  addEventListener('keydown',function(e){
    if(e.key==='Escape'&&t.getAttribute('aria-expanded')==='true') set(false);
  });
})();
</script>
</body>
</html>
