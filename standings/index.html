  if(!rows){
    cnt.textContent=""; note.textContent=NOTE_PENDING;
    out.innerHTML=`<div class="pending">${esc(y)} 시즌 개막 후 집계됩니다</div>`;
    return;
  }
  // 컨퍼런스는 편성이 준 차례 그대로 묶습니다(AFC 먼저, 그 안은 이름순).
  const confs=[];
  align.forEach(d=>{
    let c=confs.find(x=>x.c===d.c);
    if(!c){ c={c:d.c,cn:d.cn,divs:[]}; confs.push(c); }
    c.divs.push(d);
  });
  cnt.textContent=`${Object.keys(rows).length}팀 · ${align.length}디비전`;
  note.textContent=NOTE;
  out.innerHTML=confs.map(c=>`<h2 class="sec">${esc(c.cn)}</h2>`
    +`<div class="divgrid">`+c.divs.map(d=>divTable(d,rows)).join("")+`</div>`).join("");
}
sel.onchange=draw;
draw();
</script>
</body>
</html>
