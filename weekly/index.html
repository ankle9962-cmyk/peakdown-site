 그의 쪽으로 던지다가, 트레베스 헌터가 있는 쪽은 포기해버렸다. 그의 반대쪽에 위치한 자리안 존스는 이번 게임에서 18번의 패스타겟이 되었는데, 이는 트레비스 헌터의 이번 시즌 타겟인 17회보다도 많은 타겟이었다. 그리고 이번 경기 그의 플레이들을 보면 왜 그를 피해서 패스를 했는지 느끼게 해주는데, 조 버로우가 압박을 받는 상황에서 패스를 살짝 던졌는데 그걸 놓치지 않고 인터셉션을 하는 플레이 (물론 반칙으로 무산되긴 함)나 리시버가 짧게 바깥으로 빠졌다가 앞으로 쭉 달리는 루트에서 밖으로 나가는 루트에 몸이 실렸는데 순간적으로 방향을 전환하고는 악셀을 밟아서 공을 쳐내는 플레이나, 리시버가 쿼터백을 위해 자신의 위치를 조금 앞쪽으로 조정하는걸 귀신같이 캐치해서 순간적으로 달려나가서 리시버의 손 사이에 공을 쳐내는 모습들은 정말 인상적이었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/cWSf3PnVxhY\" title=\"YouTube\"><\/iframe><\/div><p>공격쪽에서는 여전히 강력했다. 팀의 1번 리시버인 파커 워싱턴이 단 하나의 캐치로 게임을 끝냈다고 하면, 잭슨빌 재규어스의 공격이 오늘 부진했구나 싶을텐데 전혀 아니었다. 이번 게임의 주인공은 타이트엔드 브랜든 스트레인지였다. 브랜튼 스트레인지는 이번 게임 1ST 다운을 5개 만들었는데, 이날 잭슨빌 재규어스가 패스로 만든 1ST 다운 (11개)의 거의 반에 가까운 수치이다. 그는 총 7번의 캐치로 95야드를 만들어냈는데, YAC 즉 공을 잡은 다음에 달린야드가 무려 56야드에 달할정도로 이번 잭슨빌 재규어스의 승리의 주역이 되었다. 뱅갈스의 수비진이 라인배커진에서 약하다는 걸 알고 있기에 나온 경기 컨셉이 아닐까 싶었는데 정말 주효했다. 실제로 라인배커들이 있는 해쉬마크 안쪽 즉 중앙 지역쪽에서 트레버로렌스는 이날 18번의 패스시도를 했고 그중에 16개가 성공하고 통합 188야드 1터치다운을 만들어냈다. 최근에 트레버 로렌스의 기세가 MVP 3순위 안에 들텐데, 이번에도 그 기세를 이어나갔다. 정교하고 과감한 패스와 플레이의 설계속에 수비의 위치를 묶어두는 시선처리까지 엄청나다. 이번 게임 터치다운에서도 라인배커들이 골라인 바로 앞에 서있는걸 알고 그 앞으로 가는 루트의 선수에게 시선을 주면서 수비를 묶어놓다가 그 뒤로 파고드는 리시버인 브라이언 토마스 주니어에게 빨랫줄같은 패스는 어마어마했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/JoBsPIwuEf4\" title=\"YouTube\"><\/iframe><\/div><p>여기에 이번 게임에서도 러닝을 100야드 넘게 하면서 시도당 4.7야드를 기록했는데(반칙으로 무위가 돌아간 러닝 터치다운까지하면 시도당 7야드에 다다른다) 러닝이 이렇게 먹히게 되면 라인배커들은 그 러닝에 속을 수 밖에 없고, 안 그래도 역량이 좀 부족한 뱅갈스의 라인배커진은 속수무책으로 당했다. 아래 영상의 첫번째 플레이는 다수의 타이트엔드를 넣고 진형까지 좁게 잡아서 러닝인척 포지션을 짠다. 그러고는 브랜튼을 풀백 자리로 옮겨놓는다. 오라인은 이 타이트엔드 앞을 비우는 형태로 블로킹을 열고, 브랜튼은 그 방향으로 블로킹하듯 움직인다. 여기에 러닝백조차 그를 따라가는 움직임을 취하니까 라인배커들은 꼼짝 없이 속을 수 밖에 없었는데, 정작 브랜튼은 블로킹하는척 액션만 취하고는 유유하게 밖으로 빠져나가서 완전 오픈이 된다. 트레버 로렌스의 이번게임 몇안되는 빅패스 실패라 무위로 돌아가긴 했지만, 그야말로 기가막힌 플레이 설계라고 볼 수 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/Tg9SeiIwK4c\" title=\"YouTube\"><\/iframe><\/div><p>뱅갈스의 입장에서는 고민이 많이 되는 경기결과일 것이다. 공격측에서 보면 뱅갈스의 러닝은 여전히 아무것도 보여주지 못했다. 이번 게임에 극악의 러닝 시도당 1.38야드라는 졸전을 벌였는데, 이번 시즌 전반적으로 봤을 때도 경기당 러싱야드는 31위, 성공률은 20위로 리그 최약체 중 하나의 러닝을 보여주고 있다. 이는 뱅갈스의 전술과 구조적으로도 연결되는데, 뱅갈스는 리그에서 가장 언더센 (러닝친화적인 쿼터백이 센터 바로 뒤에 있는 전술)을 안하는 팀 중 하나이다. 이번 시즌 벵갈스는 언더센터 비율을 17%에서 27%까지 거의 2배가까이 올렸는데, 이 비율도 대 언더센터의 시대가 되어가고 있는 현대 NFL에서는 너무나 빈약한 숫자이다. 그렇다고 이게 안 좋기만 한것이냐? 그렇지는 않다. 조 버로우가 인터뷰에서도 패스를 너무 많이 하는거 아니냐? 에 대한 질문에 더했어야했다 라고 대답했던 것처럼, 지난 몇 년간 뱅갈스의 정체성은 샷건에서 리시버들을 펼치고 거기서 나오는 패스 게임이었다. 그것으로 몇 년간 리그의 탑 10 대부분 탑5권 공격력을 보였기에 흠잡기는 어렵다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">언더센터 비율<\/th><th class=\"r\">순위<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">25시즌<\/td><td class=\"r\">17.3%<\/td><td class=\"r\">31위<\/td><\/tr><tr><td class=\"l\">26시즌<\/td><td class=\"r\">26.7%<\/td><td class=\"r\">31위<\/td><\/tr><\/tbody><\/table><\/div><p>문제는, 이 전술이 성공하기 위해서는 조버로우 - 자말체이스 - 티히긴스라는 엘리트급 쿼터백과 리그 최강의 리시버 듀오 조합이 있어야 하는데 이번 게임에서처럼 자말체이스가 부상으로 빠지고 티 히긴스까지 빠지면 이걸 이대로 유지하는게 맞나에 대한 큰 고민이 생긴다. 그렇다고 갑자기 언더센터로 바꾸자니, 이번 오프시즌에 뱅갈스는 꾸준히 언더센터를 해보려는 시도 하면서 공격을 다변화하려 했는데 큰 성과를 거두지 못했다는 보도들을 보면 갑작스러운 변화도 그렇게 좋은 의사결정은 아닐 수 있다. 이러지도 저러지도 못하는 상황에서 조 버로우의 엄청난 수비 정보 분석 능력과 의사결정 능력에 기대야하는데, 이번 게임처럼 안그래도 1차원적인 공격(패스일변도)이 그 공격을 불태워줄 스타플레이어들 마저 빠지면 수비 입장에서 공략이 너무 쉬워지고 그 실수 안하는 조 버로우도 수비를 보지 못하고 인터셉션 패스를 던지는 참사가 일어나게 될 수 있다는 점이다.<\/p><p>수비쪽에서도 중요한 포인트 중 하나는 덱스터 로렌스의 유무가 팀의 수비 성과에 너무 큰 영향을 끼치고 있다는 점이다. 그가 있고 없을 때 특히나 차이가 나는 것은 러닝 수비인데, 로렌스가 있을 때 1/4분기 뱅갈스는 리그에서 가장 러닝 수비를 잘하는 팀 중 하나이지만, 그가 없을 때는 리그에서 가장 러닝을 못막는 팀들 중 하나이다. 그리고 러닝을 못막기 시작하면 이번 게임에서처럼 그들의 약한 라인배커진형이 더욱더 노출이 되면서 총체적 난국이 된다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">러닝 EPA<\/th><th class=\"r\">시도 당 야드<\/th><th class=\"r\">패스 EPA<\/th><th class=\"r\">시도당 야드<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">4주차 덱스터 로렌스 참여<\/td><td class=\"r\">-0.08<\/td><td class=\"r\">3.47야드<\/td><td class=\"r\">+0.28<\/td><td class=\"r\">6.86야드<\/td><\/tr><tr><td class=\"l\">4주차 덱스터 로렌스 미참여<\/td><td class=\"r\">+0.41<\/td><td class=\"r\">7.83야드<\/td><td class=\"r\">+0.82<\/td><td class=\"r\">12.20야드<\/td><\/tr><tr><td class=\"l\"><\/td><td class=\"r\"><\/td><td class=\"r\"><\/td><td class=\"r\"><\/td><td class=\"r\"><\/td><\/tr><tr><td class=\"l\">26시즌 덱스터 로렌스 스냅 참여<\/td><td class=\"r\">-0.25 (1위)<\/td><td class=\"r\">3.44야드 (7위)<\/td><td class=\"r\">+0.00 (11위)<\/td><td class=\"r\">6.84야드 (24위)<\/td><\/tr><tr><td class=\"l\">26시즌 덱스터 로렌스 스냅 미참여<\/td><td class=\"r\">+0.25 (32위)<\/td><td class=\"r\">6.61야드 (32위)<\/td><td class=\"r\">+0.02 (12위)<\/td><td class=\"r\">6.17야드 (14위)<\/td><\/tr><\/tbody><\/table><\/div>","401872972":"<p>베어스의 압도적인 경기력이 무엇인지 체감할 수 있는 경기였다. 베어스는 이날 러닝으로 250야드 가까이 공중으로 250야드 가까이를 내는 무시무시한 성적을 거뒀는데, 베어스가 34개의 퍼스트다운을 기록할 동안 제츠는 단 32개의 플레이를 펼쳤을 정도로 압도적인 경기력이었다.<\/p><p>베어스 팬들 입장에서는 지난 주 이글스전에서 베어스가 승리한다면 이런 그림이었겠다 하고 생각한대로 경기가 풀렸다. 러닝이 그야말로 무자비했다. 1번 러닝백인 디안드레 스위프트가 폼이 안좋아서(2번의 골라인 러닝 시도 실패, 1번의 펌블) 벤치로 내려간 때에 2번 러닝 백인 카일 모낭가이로 제츠의 수비진을 짓밟고 지나갔다. 모낭가이는 이날 145러싱야드에 2TD으로 자기 커리어 최고의 날 중 하나를 보냈는데, 이게 반영된게 이 게임 시간 점유율이 베어스는 42분 45초인데, 제츠는 17분 15초에 불과했다. 베어스의 러닝게임 대성공은 다넬라이트, 조나 스미스, 조 튜니를 중심으로 한 성공적인 오라인의 인원 개편, 디안드레스위프트, 카일 모낭가이라는 좋은 러닝백들, 다수의 타이트엔드로 구성된 선수진, 그리고 리시버들의 블로킹을 유도하는 강력한 팀문화 등의 요소가 너무 잘 섞여서 일어나고 있고, 이 모든걸 가능하게 한 사람은 벤 존슨이다. 이번 게임에서도 3번째 터치다운에서는 몇몇 디테일한 모션으로 제츠의 엣지러셔가 엣지에 있지 않고 미들라인배커에 위치하게끔 유도해 터치다운을 만들어냈는데, 이런 세심한 움직임이 굉장히 유의미한 차이를 불러일으키고 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/tHw4N0QrSFU\" title=\"YouTube\"><\/iframe><\/div><p>4주차가 지난 지금 첫번째 성적표가 나올 때인데 공격은 예상한 그대로인데, 무엇보다 수비가 눈에 띈다. 베어스의 수비가 특히 강한 것은 써드다운이다. 이 경기의 중요순간마다 나오는 데니스 알렌 수비코치의 블리츠는 아직까지 대단히 성공률이 높다(블리츠성적).<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/hsUKimlrL4M\" title=\"YouTube\"><\/iframe><\/div><p>이번 경기에서 7번의 써드다운에서 단하나의 갱신도 내주지 않았고(팀의 라인배커  데빈 부시는 이번 경기 끝나고 몸이 아픈 느낌도 없다라고 까지했다...) 1주차 팬서스 전 이후로 3팀을 상도로 총 29번의 써드다운 중에 단 5번만을 갱신 허용해주면서 중요한 순간에 강한 모습을 보여주고 있다. 물론 이 턱없이 높은 수치가 실제 그들의 수비 실력을 나타낸다고 생각치는 않는다. 시즌이 지나며 강팀들을 만나면(그전까지 베어스는 주전 쿼터백이 빠진 바이킹스, 아무 공격도 안되는 듯한 이글스, 개중 강해보이던 제츠를 만났을 뿐이다) 이 성적이 꽤나 하락할 수 있지만, 그래도, 베어스의 수비는 강력할 필요가 없고 그야말로 상대와의 화력전에서 살짝만 늦추는 속도방지턱정도의 역할만 하면 되는거라, 시즌 초반 주전 쿼터백이 있거나 없거나 엄청난 화력을 뿜어대는 공격을 보고 시카고 베어스 팬들의 기대감은 한없이 높을 것이다.<\/p><p>제츠의 입장에서는 지워버리고 싶은 게임일 것이다. 공-수 양면으로 아무것도 보여주지 못했는데, 최근의 제츠가 기세가 조금씩 오르고 있었다는 걸 생각하면 더욱이나 기운이 팍 빠질 것이다. 이번 게임 들어가기전까지 제츠의 패스 시도당 EPA (굥격 효율)은 TOP 10 급이었다. 지노스미스의 화력전이 나쁘지 않은 것이었는데, 이번 게임 제츠는 총 156야드를 전진했을 뿐이고 심지어 그중에 73야드가 단 하나의 플레이에서 나온것이다. 그 플레이를 빼면 경기 내내 100야드도 가지 못한 것이다. 아무래도 주전 러닝백인 브리스홀의 부재가 느껴질 것이라고는 생각했는데 이정도로 뼈아플지는 몰랐다.<\/p><p>수비쪽에서도 아쉬움이 클 것인데... 이번 게임 베어스의 후보 쿼터백 타일러 베이전트는 무려 4번이나 인터셉션을 허용했다. 하지만, 그 중에 3번이 반칙으로 취소 처리 되었다. 상대 입장에서 게임을 비등하게 가져갈 기회, 기세를 탈 기회를 주는데도 본인들이 내다버린 꼴이 된게 너무나 아쉬울 것이다.<\/p>","401872975":"<p>현재 NFL에서 가장 강한 팀 두 팀이 맞붙었는데, 의외로 수비전으로 게임이 치닫으면서 49ERS가 승리를 거뒀다. 이로써 49ERS는 리그의 1/4가 끝난 지금 리그에서 가장 강한팀 중 하나로써 자신들의 자리를 지켰고, 브롱코스는 걱정스러운 점들이 하나 둘 씩 보이기 시작했는데 하나하나 봐보자.<\/p><p>우선 49ERS측면에서 가장 좋았던 점은 공격이 여전하다는 것이다. 덴버 브롱코스의 수비가 강한 수비였기에, 이전 경기들에서 보여주었던 미친 폼을 보여주지는 못했지만,  그래도 결국 방법을 찾아냈다. 이번에 49ERS의 공격력을 공격권 즉 드라이브 별로 비교하면 처음 7번에서는 매 플레이 시도당 4.6야드에 득점 3점에 불과했는데 마지막 3개의 공격권에서는 시도당 7.4야드에 21점을 득점하는 공격력을 보여줬다. 그리고 이번 게임에서 변수가 되었던 것은 바로 디보 새뮤얼이다. 리시버/러닝백이 모두 되는 와이드백이라고 자신을 부르던 디보 새뮤얼은 친정팀인 49ERS로 올해 돌어왔는데, 그 값을 이번 경기에서 톡톡히 했다. 백필드와 리시버 양쪽에서 활약을 하면서 정밀한 맨투맨으로 나선 브롱코스의 수비 상대로 혼선을 유지했고, 결국 터치다운을 기록하기도 했다. 실제 터치다운 플레이에서 보면 그에게 얼마나 많은 무게감이 실렸는지 확인할 수 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/7j3Ar2Xdqzc\" title=\"YouTube\"><\/iframe><\/div><p>그 외에도 전술적으로도 뛰어난게 조지키틀의 마지막 터치다운이었다. 49ERS에서 가장 위험한 선수이자 수비가 가장 신경쓰는 선수인 크리스챤 맥캐프리를 반대쪽으로 빼서 수비의 시선을 분산 시키고, 거기다가 수비의 블리츠를 예측이라도 했다는듯이(개인적으로는 지난 4개의 쿼터동안 경향성을 통해 카일 새너핸은 이 블리츠를 예측했다고 본다) 스크린플레이를 걸어버렸고, 역시나 49ERS의 어벤저스 중 하나인 조지 키틀이 짧은 스크린을 그대로 필드를 가로지르면서 경기의 쐐기를 박은 터치다운으로 만들어버렸다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/t9BR6pj4_7Q\" title=\"YouTube\"><\/iframe><\/div><p>수비적으로도 닉보사가 빠진 상황에서 굉장히 좋은 수비 퍼포먼스를 보였다. 후술하겠지만, 덴버 브롱코스의 공격쪽 부진이 굉장히 눈에 띄긴 했는데, 그와 관계없이 러닝게임은 잘막았고 무엇보다 디아모도어 레노어의 훌륭한 수비는 아주 인상적이었다. 많은 경우에 그는 덴버의 코틀랜드 서튼과 1:1을 했었는데 아주 훌륭하게 그를 잠구면서 49ERS의 승리에 수비쪽에서 가장 크게 기여한 인물 중 하나였다.<\/p><p>반면 브롱코스 측에서는 아쉬움이 큰 게임이다. 우선 수비측에서는 부상과 결장이 계속 팀에 쌓이고 있다는게 가장 부정적인 뉴스이다. 브롱코스의 수비는 강력한 쇄도 능력과 함께 양측 코너백들의 강력한 맨마킹 능력이 톱니바퀴처럼 맞물리면서 상승 기류를 만드는 전술이었는데, 조나단 쿠퍼의 결장으로 닉 보니토의 반대쪽에서 쇄도를 같이 만들던 한 측이 무너졌고, 이번 경기에서는 양쪽 코너백들 패트릭 서테인과 라일리 모스 모두 부상으로 경기 중간에 나가게 되었다. 물론 그렇다고 수비가 약한 것은 아니다. 이번 게임에서도 경기 초중반까지 수비전으로 끌고 갔고, 게임이 마지막까지 비등비등했던 이유는 수비의 공이 크다. 하지만, 공격이 극도로 부진한 상황에서 수비에 기대야하는 팀이기에, 4쿼터에서 수비가 부러지면 안되었는데... 그리되었고, 장기적으로 보았을 때도 양쪽 코너백인 서테인과 모스가(부상정도가 정확하진 않지만) 장기간 결장하게 된다면, 브롱코스의 수비 정체성자체를 바꿔야할 수도 있는 위기에 놓이게 된다.<\/p><p>공격쪽은 수비보다 훨신 고민이 크다. 문제가 여러 개가 있다고 볼수 있는데, 우선 4쿼터에만 몰린 득점이다. 브롱코스의 득점은 극히 4쿼터에만 몰려있는데, 이 것 자체가 좋게 보면 상대의 경향을 초중반에 잘 파악해서 중요할 때 결정력이 좋은거고, 나쁘게 보면 전반적으로 감을 못 잡다가 막판에만 터지는 변동성 높은 현상이라 볼 수 있는데, 그 변동성이 안터지면 이번 경기처럼 되는 거라고 볼 수 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">구분<\/th><th class=\"r\">1Q<\/th><th class=\"r\">2Q<\/th><th class=\"r\">3Q<\/th><th class=\"r\">4Q<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">득점<\/td><td class=\"r\">10 (26위)<\/td><td class=\"r\">3 (31위)<\/td><td class=\"r\">22 (13위)<\/td><td class=\"r\">39 (3위)<\/td><\/tr><tr><td class=\"l\">리그평균<\/td><td class=\"r\">17.1<\/td><td class=\"r\">27.6<\/td><td class=\"r\">20.0<\/td><td class=\"r\">27.0<\/td><\/tr><\/tbody><\/table><\/div><p>우선 가장 걱정되는 것은 러닝이 전혀 풀리지 않고 있다. 브롱코스의 경기당 러싱야드는 29위이고, 캐리당 야드는 25위, 성공률은 21위에 불과할정도로 하위권에서 놀고 있고, 팀의 1번 러닝백 JK 다빈스는 시도당 3.5야드 성공률 26%에 불과하고, 10야드 이상의 러닝도 단 2번에 불과할정도로 극심한 슬럼프를 겪고 있다. 문제는 러닝이 안된다면 패스라도 되어야하는데, 패스도 풀리지 않고있다. 특히 이번 게임에서는 보 닉스의 부진이 극심하게 드러났다. 그의 이번 경기 에어야드 즉 패스 비거리는 시도당 4.6야드에 불과했다. 브롱코스의 경기 플랜 자체가 빠른 횡패스(스크린 플레이)를 많이 쓰는 것에서 원인을 찾을 수도 있다. 실제로, 숀 페이튼으로부터 플레이 콜링 임무를 부여받은 웹의 콜링 가능한 시간도 시한부 아니냐는 말도 나오고 있다. 특히 이번 게임에 3RD &amp; 롱 상황에서 짧은 횡패스로 필드를 조금 전진한 후 킥을 차는 의사결정들은 의문이 가득했다. 만약에 4TH 다운을 시도하려는 마음이 있다면 3RD 다운에서 짧은 횡패스로 거리를 조금 전진한뒤에 4TH다운의 부담을 줄이는게 이해가 된다. 하지만, 4TH다운에 킥을 찰 계획인데 3RD다운에 횡패스를 하는 것은... 아 우리팀은 중장거리패스는 아예 안되니까...안정적으로 짧은 패스해서 러닝백이 공을 들고 갱신해주면 땡큐 아니면 다음 공격권으로 가지 라는 극단적으로 소극적인 경기운영이기 때문이다. 물론 보닉스의 플레이를 보면 그를 탓하기만도 애매하다. 이번 게임에서 그의 시야처리를 보면 분명히 필드의 한가운데 10야드 이상의 패스들이 열려있는데 이를 보지 못하는 경우들이 꽤나 있었다. 특히나 아래 영상 플레이는 대거 컨셉(한명이 쭉 깊게 들어가고 그 옆에서 다른한명이 같이 달리다가 안으로 짜르는 컨셉) ㅣ이라 분명히 리시버가 열릴게 확실한 상황에서도 이를 보지 못했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ZlnjP6JOIUQ\" title=\"YouTube\"><\/iframe><\/div><p>러닝이 안된다면, 이런 기본적인 중장거리 패스들이 풀리기 시작해야지만 녹슨 톱니바퀴가 삐걱삐걱하면서 첫 회전을 시작하는데, 이마저도 안되고 있으니 공격이 주저앉아버리는 경향이 있다. 이렇게 필드 중앙을 보지 않는 것을 보여주는 또다른 지표는 타겟에서 리시버의 비중이다. 이번 게임 러닝백인 RJ 하비의 타겟 비중은 무려 34%에 달했는데, 이럴거면 왜 그 큰돈을 들여서 제일런 와들이라는 걸출한 리시버를 데리고 오는 의사결정을 했는지 의아하다. 공중장악능력이 좋은 리시버 코틀랜드 서튼 - 폭발적인 스피드의 제일런 와들 - 캐치 관련 밸런스가 좋은 타이트엔드 에반 잉그램의 조합에 대한 시즌 전 기대감은 모두 사라져가고 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">4주차 타겟 비중<\/th><th class=\"r\">시즌 타겟 비중<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">RJ 하비 (러닝백)<\/td><td class=\"r\">34%<\/td><td class=\"r\">16.5%<\/td><\/tr><tr><td class=\"l\">제일런 와들 (리시버)<\/td><td class=\"r\">13%<\/td><td class=\"r\">21.3%<\/td><\/tr><tr><td class=\"l\">코틀랜드 서튼 (리시버)<\/td><td class=\"r\">13%<\/td><td class=\"r\">17.3%<\/td><\/tr><tr><td class=\"l\">에반 잉그램 (타이트엔드)<\/td><td class=\"r\">11%<\/td><td class=\"r\">10.2%<\/td><\/tr><\/tbody><\/table><\/div><p>4주가 끝났으니 49ERS를 종합해서 이야기해보자면, 무엇보다 인상적인 것은 공격이다. 그리고 거기에는 3가지의 요소가 함께 잘 어우러지고 있다고 본다. 가장 첫번째는 카일 섀너핸의 훌륭한 전략 전술이다. 전년도 다들 부상당한 와중에 좋은 성적을 낸 25시즌이 그의 최고점이지 않을까 싶었는데, 이번 시즌 그 기세를 몰아서 선수들이 돌아왔을 때 어떻게 되는지를 보여주고 있다. 매 경기마다 공을 받는 선수가 활짝 열리는 경우가 꽤나 있고, 이게 드러나는 포인트 중 하나는 역시나 공의 고른 분배이다. 지난 해 모든 공격의 51.1%를 맥캐프리에게 의지한채 나머지 선수들은 10%도 안되는 상황이었다면 올해도 역시 맥캐프리가 주공이지만 상당히 고르게 분포가 되어있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">25시즌 터치 비중<\/th><th class=\"r\">26시즌 터치 비중<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">1번 러닝백 - 크리스챤 맥캐프리<\/td><td class=\"r\">51.1%<\/td><td class=\"r\">38.4%<\/td><\/tr><tr><td class=\"l\">2번 러닝백 (브라이언 로빈슨 / 케일론 블랙)<\/td><td class=\"r\">12.4%<\/td><td class=\"r\">18.6%<\/td><\/tr><tr><td class=\"l\">1번 타이트엔드 - 조지 키틀<\/td><td class=\"r\">7.2%<\/td><td class=\"r\">9.3%<\/td><\/tr><tr><td class=\"l\">1번 리시버 (주완 제닝스 / 디보 새뮤얼)<\/td><td class=\"r\">6.8%<\/td><td class=\"r\">12.2%<\/td><\/tr><tr><td class=\"l\">2번 리시버 (리키 피어살 / 마이크 에반스)<\/td><td class=\"r\">4.7%<\/td><td class=\"r\">9.9%<\/td><\/tr><\/tbody><\/table><\/div><p>거기다가 코칭 전체가 굉장히 잘되고 있다는게 하나 더 드러나는것이 반칙의 숫자이다. 49ERS는 이번 시즌 반칙 순위에서 뒤에서 2번째로 리그에서 가장 반칙을 안하는 팀 중 하나이고, 이번 4주차 경기에서도 단 1개의 반칙만을 저지르면서 자신들이 기강이 꽉 잡힌 팀이라는걸 보여주었다. 하지만 무엇보다 놀라운건 바로 브락퍼디의 놀라운 성장이다. 지금 현재 리그 MVP가 아깝지 않은 활약을 연거푸 보여주고 있는데, 아까 반칙을 포함해서 마이너스 플레이가 극도로 적다. 이번 시즌 122번의 패스플레이에서 브락 퍼디가 허용한 쌕은 0회이다. 즉 이번 시즌까지 단 한번도 쌕을 당한적이 없다는 말인데, 이는 카일 섀너핸의 놀라운 전술 및 플레이 콜링 능력 / 그걸 빠르게 이행하고 압박이 있을 때 본인의 다리로 상황을 타개하는 민첩함과 침착함의 브락퍼디 / 패스블로킹 승률에서 탑10에 드는 오라인의 저력 이 3개가 모두 합쳐진 놀라운 결과이다. NFL의 게임이라는게 특별한 플레이로 게임을 승리하는 것도 중요하지만 스스로 패배로 이끌지 않는게 제일 중요하다는 빌 벨라칙의 말을 떠올리게 하는 부분이다.<\/p>"};

function ytActivate(root){
  const rm=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
  (root||document).querySelectorAll(".yt-loop[data-yt-src]:not([data-yt-on])").forEach(el=>{
    el.setAttribute("data-yt-on","");
    const play=()=>{
      const f=document.createElement("iframe");
      f.src=el.getAttribute("data-yt-src");f.title="YouTube";
      f.setAttribute("allow","autoplay; encrypted-media; picture-in-picture");
      f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
      el.replaceChildren(f);
    };
    if(!rm){play();return;}
    const a=el.querySelector(".yt-poster");
    if(a) a.addEventListener("click",e=>{e.preventDefault();play();});
  });
}

// "4-11"·"1-3" 은 성공/시도 비율로, "2-17"·"9-84" 는 뒤 숫자(잃은 야드)로
// 견줍니다. 시도가 0 이면 견줄 게 없으니 양쪽 다 색을 안 넣습니다.
const GEFF=new Set(["thirdDownEff","fourthDownEff","redZoneAttempts"]);
const GPAIR=new Set(["sacksYardsLost","totalPenaltiesYards"]);
function gnum(n,v){
  if(v==null) return null;
  const s=String(v).trim(), m=s.match(/^(-?\d+)\s*-\s*(-?\d+)$/);
  if(GEFF.has(n)) return (m&&+m[2]>0)?+m[1]/+m[2]:null;
  if(GPAIR.has(n)) return m?+m[2]:null;
  const x=Number(s.replace(/,/g,""));
  return Number.isFinite(x)?x:null;
}
// ESPN 약어 두 개가 nflverse 와 다릅니다. 로고 파일도 nflverse 이름입니다.
const ESPN2NFL={LAR:"LA",WSH:"WAS"};
const boxLogo=ab=>`/photos/logo_${esc(ESPN2NFL[ab]||ab)}.png`;

// 팀 패싱(net)과 선수 패싱(gross)이 안 맞는 이유. 예전에는 팀 표 밑에만
// 있었는데, 이제 두 값이 한 화면에 같이 보이므로 선수 패싱 표 밑에도 답니다.
const BOX_NPN=`<div class="pnote"><b>패싱</b>은 ESPN 의 <b>net</b> 패싱야드입니다 — 색으로 잃은
  야드가 이미 빠져 있습니다. 같은 응답의 선수별 패싱야드는 gross 라
  (프로브에서 잰 예: BUF @ MIA 팀 289 · 선수 306) 선수 기록을 더해서
  이 줄과 맞춰 볼 수 없습니다.</div>`;

// 선수 소표 — [이름, 쓰는 그룹, [열 이름, ESPN key]…, 정렬 기준 key(앞의 것 우선)]
// 수비는 그룹 둘을 선수 이름으로 합칩니다: 태클·색은 defensive 에, INT 는
// interceptions 에 따로 옵니다. 킥/펀트도 같은 이유로 둘을 합칩니다.
// 어시스트 태클(TOT-SOLO)과 FF(forced fumble)는 ESPN 이 주지 않아 열이 없습니다.
const PSECS=[
  ["패싱",["passing"],
   [["C/ATT","completions/passingAttempts"],["야드","passingYards"],
    ["TD","passingTouchdowns"],["INT","interceptions"],["색","sacks-sackYardsLost"]],
   ["passingYards"]],
  ["러싱",["rushing"],
   [["시도","rushingAttempts"],["야드","rushingYards"],["평균","yardsPerRushAttempt"],
    ["TD","rushingTouchdowns"],["최장","longRushing"]],
   ["rushingYards"]],
  ["리시빙",["receiving"],
   [["타겟","receivingTargets"],["캐치","receptions"],["야드","receivingYards"],
    ["TD","receivingTouchdowns"],["최장","longReception"]],
   ["receivingYards"]],
  ["수비",["defensive","interceptions"],
   [["태클","totalTackles"],["솔로","soloTackles"],["색","sacks"],
    ["TFL","tacklesForLoss"],["PD","passesDefended"],["INT","interceptions"]],
   ["totalTackles"]],
  ["킥/펀트",["kicking","punting"],
   [["FG","fieldGoalsMade/fieldGoalAttempts"],["최장","longFieldGoalMade"],
    ["XP","extraPointsMade/extraPointAttempts"],["펀트","punts"],
    ["평균","grossAvgPuntYards"]],
   ["totalKickingPoints","punts"]],
];
// 구울 때 담는 그룹 = 위 표가 쓰는 그룹. 한곳에서 나오므로 갈라지지 않습니다.
const PWANT=new Set([].concat(...PSECS.map(s=>s[1])));

// ESPN 이 안 준 값은 "—" 입니다. 0 과 "없음" 은 다른 것이라 0 은 0 으로 둡니다.
function pval(v){
  const s=(v==null?"":String(v)).trim();
  return (s===""||s==="--"||s==="-")?"—":s;
}
function pnum(v){
  const x=Number(String(v==null?"":v).replace(/,/g,""));
  return Number.isFinite(x)?x:null;
}
// 한 팀의 선수 기록을 {이름: {key: 값}} 으로 모읍니다. 그룹마다 keys 가 같이
// 오므로 열 위치를 세지 않고 key 로 찾습니다. 한 선수가 여러 그룹에 나오면
// (러싱+리시빙, 수비+INT) 한 줄로 합쳐집니다.
function pIndex(pl){
  const by=new Map();
  for(const grp of pl||[]){
    const keys=grp.k||[];
    for(const a of grp.a||[]){
      const nm=(a.n||"").trim();
      if(!nm) continue;
      let row=by.get(nm);
      if(!row){ row={n:nm,v:{},g:new Set()}; by.set(nm,row); }
      row.g.add(grp.g);
      (a.s||[]).forEach((val,i)=>{
        const k=keys[i];
        if(k!=null&&!(k in row.v)) row.v[k]=val;
      });
    }
  }
  return by;
}
let BOXN=0;
const boxUid=()=>"bx"+(++BOXN);
// 접이식 칸 하나. 여는 상태는 여기서 정하고, 게임을 바꾸면 부르는 쪽이
// innerHTML 을 새로 그리므로 접힘은 저절로 처음 상태로 돌아갑니다 —
// 코치 경력 표와 같은 방식이라 따로 기억해 둘 것이 없습니다.
// lbl 을 주면 제목 대신 그 HTML 을 씁니다(팀 로고·약어처럼 이미 만든 조각).
// 부르는 쪽이 esc 를 끝낸 문자열만 넘깁니다.
function boxSec(title,body,open,cnt,lbl){
  const id=boxUid();
  return `<div class="bsec"><div class="bsh" role="button" tabindex="0"
      aria-expanded="${open?"true":"false"}" aria-controls="${id}">
      <span class="bchev" aria-hidden="true">▸</span><span class="blb">${lbl||esc(title)}</span>
      ${cnt?`<span class="bcnt">${esc(cnt)}</span>`:""}</div>
    <div class="bsb${open?"":" off"}" id="${id}">${body}</div></div>`;
}
function boxToggle(h){
  const open=h.getAttribute("aria-expanded")==="true";
  h.setAttribute("aria-expanded",String(!open));
  const b=document.getElementById(h.getAttribute("aria-controls"));
  if(b) b.classList.toggle("off",open);
}
// 리스너는 담는 칸에 한 번만 답니다 — 그릴 때마다 달면 쌓입니다.
function boxBind(root){
  if(!root||root.getAttribute("data-boxbound")) return;
  root.setAttribute("data-boxbound","1");
  const hit=e=>e.target.closest&&e.target.closest(".bsh");
  root.addEventListener("click",e=>{ const h=hit(e); if(h) boxToggle(h); });
  root.addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ") return;
    const h=hit(e);
    if(h){ e.preventDefault(); boxToggle(h); }
  });
}
function pTable(idx,sec){
  const cols=sec[2], gs=new Set(sec[1]);
  const rows=[...idx.values()].filter(r=>{
    for(const g of r.g) if(gs.has(g)) return true;
    return false;
  });
  if(!rows.length) return "";
  // 그 표의 주된 야드·횟수 열 내림차순. 그 값이 없는 선수는 뒤로 보내고,
  // 같으면 이름순 — 다시 그려도 순서가 흔들리지 않게 합니다.
  const sv=r=>{
    for(const k of sec[3]){ const n=pnum(r.v[k]); if(n!=null) return n; }
    return -Infinity;
  };
  rows.sort((a,b)=>sv(b)-sv(a)||a.n.localeCompare(b.n));
  const tpl=`minmax(0,1fr) repeat(${cols.length},2.7em)`;
  const head=`<div class="ptr pthr"><span class="pnm"></span>`
    + cols.map(c=>`<span class="ptd">${esc(c[0])}</span>`).join("")+`</div>`;
  const body=rows.map(r=>`<div class="ptr"><span class="pnm">${esc(r.n)}</span>`
    + cols.map(c=>`<span class="ptd">${esc(pval(r.v[c[1]]))}</span>`).join("")
    + `</div>`).join("");
  return `<div class="ptbl" style="--ptpl:${tpl}">${head}${body}</div>`
    + (gs.has("passing")?BOX_NPN:"");
}
// 선수 스탯 칸 — 원정 먼저, 그다음 홈. 접는 단위는 팀 하나입니다: 팀을 펴면
// 그 팀의 표(패싱·러싱·리시빙·수비·킥/펀트)가 제목과 함께 한꺼번에 나옵니다.
// 표마다 따로 접던 한 단계는 없앴습니다 — 한 팀을 보려고 다섯 번 누르게
// 되기 때문입니다. 기록이 아예 없으면 빈 문자열을 주고, 부르는 쪽은 그때 칸
// 자체를 만들지 않습니다(빈 표를 두지 않습니다).
function boxPlayers(teams){
  let out="";
  for(const t of teams){
    if(!t) continue;
    const idx=pIndex(t.pl);
    if(!idx.size) continue;
    let grps="";
    for(const sec of PSECS){
      const tbl=pTable(idx,sec);
      if(tbl) grps+=`<div class="pgrp"><div class="pgh">${esc(sec[0])}</div>${tbl}</div>`;
    }
    if(!grps) continue;
    const lbl=`<img src="${boxLogo(t.ab)}" alt="" onerror="this.style.visibility='hidden'">`
      + `<b>${esc(t.ab)}</b><small>${t.ha==="home"?"HOME":"AWAY"}</small>`;
    out+=`<div class="pteam">${boxSec(t.ab,grps,false,null,lbl)}</div>`;
  }
  return out;
}
// 팀 머리. gthr 를 주면 한 겹 더 감쌉니다 — 주차별 자료는 그 선으로 라벨과
// 머리를 맞추고, 편집 화면은 감싸지 않습니다.
function boxHead(g,abA,abH,gthr){
  const th=(sd,ab,who)=>`<span class="gth${sd&&sd.w?" w":""}">
    <img src="${boxLogo(ab)}" alt="" onerror="this.style.visibility='hidden'">
    <b>${esc(ab)}</b><i>${g&&g.done?esc((sd||{}).sc||"–"):"–"}</i>
    <small>${who}</small></span>`;
  const inner=th(g&&g.away,abA,"AWAY")+th(g&&g.home,abH,"HOME");
  return `<div class="ghead">${gthr?`<span class="gthr">${inner}</span>`:inner}</div>`;
}
// 팀 기록 표. 줄과 순서는 GROWS 가 정하고 숫자는 응답이 정합니다 — name 으로
// 항목을 찾아 그 항목의 displayValue 를 그대로 찍습니다. "4-11"·"26:31" 처럼
// 이미 서식이 잡혀 오는 값을 value 로 다시 만들면 서식이 깨지고, 애초에
// value 는 totalYards·turnovers 에서 "-" 로 오는 일이 잦아 못 믿습니다.
function boxTeamTab(A,H){
  const mk=t=>{const m=new Map();((t||{}).stats||[]).forEach(s=>{if(!m.has(s.n))m.set(s.n,s)});return m};
  const ma=mk(A), mh=mk(H), used=new Set();
  let rows="";
  for(const [lv,lb,n,dir] of GROWS){
    const a=ma.get(n), h=mh.get(n);
    if(!a&&!h) continue;                 // 응답에 아예 없는 줄은 접습니다
    used.add(n);
    const va=gnum(n,a&&a.v), vh=gnum(n,h&&h.v);
    let ca="",ch="";
    if(dir&&va!=null&&vh!=null&&va!==vh){ if((va>vh)===(dir>0)) ca="on"; else ch="on"; }
    rows+=`<div class="gr lv-${lv}"><span class="gl">${esc(lb)}</span>
      <span class="gv ${ca}">${esc(a?a.v:"—")}</span>
      <span class="gv ${ch}">${esc(h?h.v:"—")}</span></div>`;
  }
  // 표가 못 받아 준 항목은 label 그대로 아래에 붙입니다. 목록은 엔드포인트가
  // 문서화돼 있지 않아 언제든 늘어날 수 있다는 전제로 만듭니다.
  const ex=[];
  for(const s of [...((A||{}).stats||[]),...((H||{}).stats||[])])
    if(!used.has(s.n)&&!ex.some(e=>e.n===s.n)) ex.push(s);
  if(ex.length) rows+=`<div class="gr xhd"><span class="gl">
      표에 없는 항목 — ESPN 이 새로 넣었거나 이름이 바뀐 것</span><span></span><span></span></div>`
    + ex.map(s=>`<div class="gr lv-m"><span class="gl">${esc(s.lb||s.n)}</span>
        <span class="gv">${esc((ma.get(s.n)||{}).v??"—")}</span>
        <span class="gv">${esc((mh.get(s.n)||{}).v??"—")}</span></div>`).join("");
  return `<div class="gtab">${rows}</div>`;
}
// 박스스코어 한 장 = 팀 머리 + 접이식 두 칸(팀 스탯 펴짐 · 선수 스탯 접힘).
// box 가 비었는지는 부르는 쪽이 먼저 봅니다 — 빈 상태 문구가 화면마다 다릅니다.
function boxHTML(g,box,opt){
  opt=opt||{};
  const A=box.find(t=>t.ha==="away")||box[0], H=box.find(t=>t.ha==="home")||box[1];
  const abA=(A&&A.ab)||((g&&g.away&&g.away.ab)||""), abH=(H&&H.ab)||((g&&g.home&&g.home.ab)||"");
  const players=boxPlayers([A,H]);
  const secs=boxSec("팀 스탯",boxTeamTab(A,H)+BOX_NPN,true,null)
    + (players?boxSec("선수 스탯",players,false,"원정 · 홈"):"");
  return boxHead(g,abA,abH,!!opt.gthr)+`<div class="bsecs">${secs}</div>`;
}
// 실시간 응답 → 구운 자료와 같은 모양. boxscore.players[] 는 teams[] 와 따로
// 오고 homeAway 가 비어 있어서(확인: null) 팀 약어로 맞춥니다 — 순서를 믿고
// 자리로 짝지으면 ESPN 이 순서를 바꾸는 날 원정·홈이 뒤집힙니다.
function boxNorm(x){
  const bs=(x||{}).boxscore, ts=bs&&bs.teams;
  if(ts){
    const pm=new Map();
    for(const p of (bs.players||[])){
      const ab=((p.team||{}).abbreviation)||"";
      const gl=[];
      for(const grp of p.statistics||[]){
        if(!PWANT.has(grp.name)) continue;
        const ath=[];
        for(const a of grp.athletes||[]){
          const nm=((a.athlete||{}).displayName||"").trim();
          if(nm) ath.push({n:nm,s:a.stats});
        }
        if(ath.length) gl.push({g:grp.name,k:grp.keys,a:ath});
      }
      if(ab) pm.set(ab,gl);
    }
    return ts.map(t=>({ab:t.team.abbreviation,ha:t.homeAway,
      stats:(t.statistics||[]).map(s=>({n:s.name,v:s.displayValue,lb:s.label})),
      pl:pm.get(t.team.abbreviation)||[]}));
  }
  return Array.isArray(x)?x:null;
}

// 리뷰 칸 — 빌드 때 박아 둔 HTML 만 씁니다. 없으면 조용히 빈 상태를 둡니다.
// 여기서 글을 지어내거나 어디선가 받아 오는 일은 없습니다.
function paneReview(box,hd,label,html){
  if(!box) return;
  if(hd) hd.textContent=label||"";
  box.innerHTML=html||`<div class="rvnone">이 경기의 리뷰는 아직 없습니다.</div>`;
  if(html&&typeof ytActivate==="function") ytActivate(box);   // 반복 클립 켜기
}
// 박스스코어 칸. 표가 있으면 boxHTML, 없으면 그 이유를 적은 빈 상태입니다.
// 접기 배선(boxBind)은 표를 새로 그릴 때마다 한 번만 답니다.
function paneBox(box,g,bx,opt){
  if(!box) return;
  opt=opt||{};
  if(bx&&bx.length){ box.innerHTML=boxHTML(g,bx,opt); boxBind(box); return; }
  const head=(g&&opt.head!==false)?boxHead(g,(g.away||{}).ab||"",(g.home||{}).ab||"",true):"";
  box.innerHTML=head+`<div class="gnote">${esc(opt.note||"이 경기의 박스스코어가 없습니다.")}</div>`;
}

// ── 경기 결과 ─────────────────────────────────────────────────────────────
// 표를 그리는 일은 BOX_JS 가 맡습니다(boxHTML·boxHead·boxNorm·boxBind).
// 여기 남은 것은 이 페이지에만 있는 것들 — 주 고르기, 경기 목록, 리뷰입니다.
const GAPI="https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const G=(typeof window.NFL_GAMES!=="undefined")?window.NFL_GAMES:null;
const WEEKS=(G&&Array.isArray(G.weeks))?G.weeks:[];

// 실시간 응답과 구운 자료를 한 모양으로 맞추는 일(boxNorm)도 BOX_JS 에 있습니다.
function gRow(ev){
  const c=ev.competitions[0], st=ev.status.type, sd={};
  c.competitors.forEach(x=>sd[x.homeAway]=x);
  if(!sd.home||!sd.away) return null;
  const one=x=>({ab:x.team.abbreviation,sc:x.score,w:!!x.winner});
  const r={id:ev.id,date:ev.date,wk:(ev.week||{}).number,st:st.state,
    done:!!st.completed,lb:st.shortDetail||st.detail,
    away:one(sd.away),home:one(sd.home)};
  // 대진이 아직 안 정해진 포스트시즌 자리는 목록에서 뺍니다.
  return (r.away.ab==="TBD"||r.home.ab==="TBD")?null:r;
}

// 세션 캐시. 한 번 받은 주·경기는 다시 안 부릅니다.
// sessionStorage 는 file:// 에서 막히는 브라우저가 있어 되면 쓰고 아니면 맙니다.
const GMEM=new Map();
function gStore(k,v){ try{sessionStorage.setItem("nflg:"+k,JSON.stringify(v))}catch(e){} }
function gLoad(k){ try{return JSON.parse(sessionStorage.getItem("nflg:"+k)||"null")}catch(e){return null} }

// 실시간이 먼저, 구운 자료는 예비입니다 — 그 반대가 아닙니다.
// 다만 2026-08 현재 ESPN 앞단(Akamai)이 브라우저에서 온 요청을 403 으로
// 끊습니다. curl·python 은 200 인데 브라우저만 막혀서, 실제로는 구운 자료가
// 늘 쓰입니다. 그래서 한 번 막히면 그 세션에서는 더 두드리지 않습니다 —
// 주나 경기를 누를 때마다 실패할 요청을 보내 봐야 콘솔만 더럽히고 느려집니다.
let gLive=true;
async function gFetch(url,key){
  const hit=GMEM.get(key)||gLoad(key);
  if(hit){ GMEM.set(key,hit); return hit; }
  if(!gLive) return null;
  try{
    const r=await fetch(url,{cache:"no-store"});
    if(r.ok){ const j=await r.json(); GMEM.set(key,j); gStore(key,j); return j; }
  }catch(e){}
  gLive=false;                          // 차단은 경기별이 아니라 출처 전체입니다
  return null;
}

let widx=-1, GLIST=[], GSRC="", gSel=null;
// 킥오프는 UTC 로 오는데 그대로 잘라 쓰거나 보는 사람 시간대로 바꾸면 날짜가
// 하루 밀립니다 (11/09 18:00Z 경기가 한국에서는 11/10). NFL 경기 날짜는 미국
// 동부 기준이라 거기에 맞춥니다.
// 목록의 날짜는 M/D 로 줄입니다. 보드에서 쓰던 en-CA 는 같은 옵션으로
// "08-27" 을 내놓는데, 좁아진 목록 칸에서는 그 8px 이 줄바꿈을 만듭니다.
// 시간대와 값은 그대로고 표기만 짧아집니다.
function gWhen(iso){
  const d=new Date(iso);
  if(isNaN(d)) return "";
  try{ return d.toLocaleDateString("en-US",{timeZone:"America/New_York",
    month:"numeric",day:"numeric"}); }
  catch(e){ return String(iso).slice(5,10); }
}
// 아직 안 한 경기는 킥오프 시각을 답니다. ESPN 의 shortDetail("9/13 - 1:00 PM
// EDT")은 목록 칸에 안 들어가서, 같은 값을 같은 시간대로 줄여 적습니다.
// 원문은 title 로 남겨 마우스를 올리면 그대로 보입니다.
function gKick(iso){
  const d=new Date(iso);
  if(isNaN(d)) return "";
  try{ return d.toLocaleString("en-US",{timeZone:"America/New_York",
    month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit",hour12:false})
    .replace(",",""); }
  catch(e){ return gWhen(iso); }
}

function gListHTML(){
  if(!GLIST||!GLIST.length) return `<div class="gnote">이 주의 경기 목록이 없습니다.</div>`;
  return GLIST.map(g=>{
    const sd=t=>`<span class="gs${t.w?" w":""}"><img src="${boxLogo(t.ab)}" alt=""
        onerror="this.style.visibility='hidden'"><b>${esc(t.ab)}</b>
        <i>${g.done?esc(t.sc):"–"}</i></span>`;
    const meta=g.done?gWhen(g.date):gKick(g.date);
    return `<div class="grow" role="button" tabindex="0" data-g="${esc(g.id)}"
        aria-pressed="${g.id===gSel}">${sd(g.away)}<span class="gat">@</span>${sd(g.home)}
      <span class="gw" title="${esc(g.lb||"")}">${esc(meta)}</span></div>`;
  }).join("");
}

// 팀 머리(boxHead)와 표 두 칸(boxHTML)은 BOX_JS 에 있습니다.

// 리뷰는 빌드 때 박아 둔 HTML 입니다. 없으면 조용히 비웁니다 — 여기서 문장을
// 지어내거나 어디선가 받아 오는 일은 없습니다.
// 칸을 채우는 일은 PANE_JS(content_render.py)가 맡습니다 — 보드의 주차별
// 성적 탭도 같은 함수를 부릅니다. 여기 남은 것은 이 페이지의 요소 이름뿐입니다.
function gReview(g){
  paneReview(document.getElementById("rvw"),document.getElementById("rvhd"),
             g?`${g.away.ab} @ ${g.home.ab}`:"",g?REVIEWS[g.id]:null);
}

async function gShow(id){
  gSel=id;
  syncHash(id);
  const g=(GLIST||[]).find(x=>x.id===id);
  const main=document.getElementById("gbox");
  if(!main) return;
  document.querySelectorAll(".grow").forEach(b=>
    b.setAttribute("aria-pressed",String(b.dataset.g===id)));
  gReview(g);
  if(!g){ main.innerHTML=`<div class="gnote">경기를 고르세요.</div>`; return; }
  if(!g.done){
    main.innerHTML=boxHead(g,g.away.ab,g.home.ab,true)
      + `<div class="gnote">${esc(g.lb||"")} · 아직 하지 않은 경기라
        기록이 없습니다.</div>`;
    return;
  }
  main.innerHTML=`<div class="gnote">불러오는 중…</div>`;
  // 실시간이 먼저, 구워 둔 자료가 예비입니다 — 순서는 보드에 있던 그대로입니다.
  let box=boxNorm(await gFetch(`${GAPI}/summary?event=${encodeURIComponent(id)}`,"box:"+id));
  if(!box && G && G.box && G.box[id]) box=boxNorm(G.box[id]);
  if(gSel!==id) return;                  // 그 사이 다른 경기를 눌렀으면 버립니다
  main.innerHTML = box ? boxHTML(g,box,{gthr:true})
    : `<div class="gnote">기록을 받지 못했습니다 — ESPN 에 닿지 않고
        games.js 에도 이 경기가 없습니다.</div>`;
  // 접기 배선은 칸에 한 번만 답니다. 경기를 바꾸면 위에서 innerHTML 을 새로
  // 그리므로 접힘은 저절로 처음 상태(팀 스탯 펴짐·선수 스탯 접힘)로 돌아갑니다.
  boxBind(main);
}

// 한 주를 엽니다. 실시간 스코어보드가 그 주를 주면 그걸 쓰고, 아니면 구워 둔
// 목록을 씁니다 — 보드에 있던 순서 그대로입니다.
async function gWeek(i){
  widx=i;
  const w=WEEKS[i];
  if(!w) return;
  const ls=document.getElementById("glist"), hd=document.getElementById("ghd");
  GLIST=(w.games||[]).slice(); GSRC="baked";
  const live=await gFetch(
    `${GAPI}/scoreboard?dates=${encodeURIComponent(G.season)}`
    +`&seasontype=${w.st}&week=${w.wk}`,`sb:${w.st}:${w.wk}`);
  if(widx!==i) return;                   // 그 사이 다른 주를 골랐으면 버립니다
  const rows=((live||{}).events||[]).map(gRow).filter(Boolean);
  if(rows.length){ GLIST=rows; GSRC="live"; }
  GLIST.sort((a,b)=>String(a.date).localeCompare(String(b.date))||
                    String(a.id).localeCompare(String(b.id)));
  // 그 주에서 마지막으로 끝난 경기를 먼저 엽니다. 하나도 안 끝났으면 첫 경기.
  const done=GLIST.filter(g=>g.done);
  gSel=(done.length?done[done.length-1]:GLIST[0]||{}).id||null;
  if(hd) hd.innerHTML=`경기<em>${esc(w.lb)} · ${GLIST.length}경기</em>`;
  if(ls) ls.innerHTML=gListHTML();
  gShow(gSel);
}

// ── 딥링크 (/weekly/#g=<경기 id>) ────────────────────────────────────────
// 정적 사이트라 질의 문자열 대신 해시를 씁니다. 해시는 기본 선택을 이깁니다 —
// 기본 주를 먼저 열고 나중에 해시를 적용하면 그 사이에 기본 경기가 한 번
// 그려졌다가 바뀌어, 눌러서 들어온 사람이 엉뚱한 경기를 먼저 보게 됩니다.
// 그래서 어느 주를 열지 정하는 단계에서 해시를 먼저 봅니다.
function hashGid(){
  const m=/[#&]g=([A-Za-z0-9_-]+)/.exec(location.hash||"");
  return m?m[1]:null;
}
function weekOfGame(gid){
  for(let i=0;i<WEEKS.length;i++)
    if((WEEKS[i].games||[]).some(g=>String(g.id)===String(gid))) return i;
  return -1;
}
function hashNote(msg){
  const box=document.getElementById("wcols");
  if(!box||!msg) return;
  const d=document.createElement("div");
  d.className="hashnote";
  d.textContent=msg;
  box.parentNode.insertBefore(d,box);
}
// 화면에 보이는 경기를 주소에 적습니다. 누를 때마다 방문 기록을 남기면
// 뒤로 가기가 한 경기씩 되짚게 되므로 replaceState 를 씁니다.
function syncHash(gid){
  if(!gid) return;
  try{ history.replaceState(null,"",`${location.pathname}#g=${gid}`); }catch(e){}
}

const wsel=document.getElementById("week"), wsub=document.getElementById("wsub");
if(!WEEKS.length){
  document.getElementById("wcols").innerHTML=
    `<div class="pending">경기 자료가 아직 없습니다 —
      build_depthcharts.py --games 로 games.js 를 구우면 채워집니다.</div>`;
}else{
  wsel.innerHTML=WEEKS.map((w,i)=>`<option value="${i}">${esc(w.lb)}</option>`).join("");
  // 기본 = 결과가 있는 마지막 주. games.js 가 구울 때 정해 둔 값을 먼저 보고,
  // 없으면 여기서 다시 찾습니다.
  let def=-1;
  if(G.cur) def=WEEKS.findIndex(w=>w.st===G.cur.st&&w.wk===G.cur.wk);
  if(def<0) for(let i=0;i<WEEKS.length;i++)
    if((WEEKS[i].games||[]).some(g=>g.done)) def=i;
  if(def<0) def=0;
  // 해시가 있으면 그 경기가 든 주로 시작합니다(기본값을 덮어씁니다).
  const want=hashGid();
  let wantIdx=-1;
  if(want){
    wantIdx=weekOfGame(want);
    if(wantIdx>=0) def=wantIdx;
    else hashNote(`주소가 가리킨 경기(${want})를 찾지 못해 기본 화면을 엽니다.`);
  }
  wsel.value=String(def);
  if(wsub) wsub.textContent=`${G.season} 시즌`+(G.stamp?` · 자료 ${G.stamp}`:"");
  wsel.onchange=()=>gWeek(+wsel.value);
  // 주를 연 뒤 해시가 가리킨 경기를 고릅니다 — gWeek 이 정한 기본 경기를
  // 이깁니다. gWeek 은 비동기라 반드시 그 뒤에 걸어야 합니다.
  gWeek(def).then(()=>{ if(wantIdx>=0) gShow(want); });
  // 이미 열려 있는 페이지에서 해시만 바뀌는 경우(뒤로/앞으로, 같은 페이지를
  // 가리키는 링크)는 문서를 새로 읽지 않으므로 위 초기화가 다시 돌지 않습니다.
  // 그래서 해시 변화를 따로 듣습니다. 우리가 syncHash 로 바꾼 것은 이미 그
  // 경기를 보고 있는 상태라 아무 일도 하지 않습니다.
  addEventListener("hashchange",()=>{
    const gid=hashGid();
    if(!gid||String(gid)===String(gSel)) return;
    const i=weekOfGame(gid);
    if(i<0){ hashNote(`주소가 가리킨 경기(${gid})를 찾지 못했습니다.`); return; }
    if(+wsel.value===i){ gShow(gid); return; }
    wsel.value=String(i);
    gWeek(i).then(()=>gShow(gid));
  });
}

// 목록 클릭은 칸에 위임합니다 — 목록을 다시 그려도 배선이 안 끊깁니다.
const wcols=document.getElementById("wcols");
wcols.addEventListener("click",e=>{
  const r=e.target.closest&&e.target.closest(".grow");
  if(r) gShow(r.dataset.g);
});
wcols.addEventListener("keydown",e=>{
  const r=e.target.closest&&e.target.closest(".grow");
  if(r&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); gShow(r.dataset.g); }
});
</script>
