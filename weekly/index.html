어스가 부상으로 빠지면서 생긴 결과라고 생각한다. 물론, 타일러 워렌, 조쉬 다운스가 꽤 괜찮았지만 그 만으로는 부족함이 느껴졌고, 앞으로도 이 점은 집중해서 봐야할 필요가 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/60eJdBted_s\" title=\"YouTube\"><\/iframe><\/div>","401872946":"<p>피츠버그 스틸러스는 마이크 톰린이라는 명감독을 팀에서 떠나보내고 새로운 감독으로 마이크 맥카시를 선임하였다. 마이크 맥카시의 시스템, 특히나 공격은 최악의 모습인데, 이대로라면 전통의 명가 스틸러스의 자랑인 '잦지 않은 감독교체 지침'이 크게 흔들리지 않을까 싶다. 반면 뉴잉글랜드 페이트리어츠는 지난 게임은 자신들이 몸이 안풀렸을 뿐이라는 듯 피츠버그 스틸러스를 두들겨 팼다.<\/p><p>피츠버그 스틸러스의 공격은 리그 최약체인가 하는 생각이 들정도로 끔찍했다. 전년도 아서 스미스 공격코치 체재하에서 폭발적이진 않았지만 나쁘지 않은 오라인, 러싱 그리고 짧은 패스들을 중심으로 펼쳐나갔던 안정적인 공격이 선녀로 생각될 정도로 아무것도 하지 못했는데, 통합 235야드에 0터치다운 2번의 턴오버라는 성적표를 거뒀다. 오라인의 패스 프로텍션은 이번 게임 완전히 터져버렸다. 특히나, 블리츠 상대로는 극악의 방어율을 보였는데, 애런로저스는 '이번 시즌 끝나고 은퇴를 한다는 멘트'를 '지금 당장할 걸' 하고 후회했을지 모른다. 페이트리어츠는 디펜시브 태클 둘을 왼쪽으로 놓고 거기에 라인배커까지 위치했는데, 위기를 감지한 스틸러스는 블로킹을 바꾼다. 왼쪽의 오라인 네명이 왼쪽으로 가고 우측에는 러닝백이 라인배커를 막게 되는데, 문제는 뒤쪽의 라인배커가 블리츠할 것이라고는 꿈에도 생각치 못한 전술로 응대를 해 라인배커가 공짜로 쇄도했을 뿐만 아니라, 우측에서도 라인배커가 쿼터백이 아니라 태클을 향해 돌진하고 엣지러셔가 엇박으로 안으로 들어오는 움직임에 속수무책으로 블로킹이 꼬이면서 노령의 쿼터백을 위험에 맞딱드리게 했다. 그러다보니 그 뒤로 애런 로저스의 패스 타이밍이 과하게 앞으로 당겨졌고 공격이 전반적으로 멈췄다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/s3bZSjgScwI\" title=\"YouTube\"><\/iframe><\/div><p>페이트리어츠의 공격을 살펴보면 나쁘지 않았다. 러닝 93야드에 시도당 4야드였는데, 러닝백 라몬드레 스티븐슨이 펌블을 하고는 곧바로 그 자리로 들어간 트레비욘 핸더슨이 터치다운을 기록하는 그림은 작년과 너무 똑같아서 기시감이 느껴졌다. 전반적으로 러닝이 나쁘다 좋다 하기엔 어려운 괜찮은 성적이었는데, 이는 스틸러스의 라인배커들이 러닝 대응을 잘 하지 못한 부분도 꽤나 큰 영향이 있는 것 같다. 패스 측면에서 드레이크 메이는 조금씩 플레이를 회복하고 있는 느낌이 든다. 3가지의 플레이를 언급하고 싶은데, 첫번째 플레이에서는 왼쪽에 빅패스를 분명 노릴 만한 찬스가 있었고, 이전이라면 아무 고민도 없이 던졌을건데 차분히 자신의 다리로 전진을 하는 의사결정을 하고, 동시에 우측으로 빠지다가 로미오 돕스에게 엄청난 빅패스를 뿌리는 모습은 왜 그가 탑급 쿼터백 재능인지를 느끼게 해주었다. 반면에 인터셉션 플레이에서는 여전히 의사결정이 좀 흔들리는 모습이 보였다. 플레이가 전개되며 풀백이 아랫공간으로 가고 그 뒤로 타이트엔드가 가면서 수비수인 패트릭 퀸에게 위아래 양자택일을 강요하게 되는데, 수비의 쇄도가 들어오며 드레이크 메이가 의사결정을 더 빠르게 하도록 강요되었고, 드레이크메이는 지레 짐작으로 라인배커가 앞을 지킬 것이라 생각해 패스를 던졌다가 인터셉션을 당했다. 아직 작년처럼 MVP급 활약을 하고 있다고 하기는 힘들지만 저점과 고점들이 조금씩 섞여나오면서 자신의 클래스를 차분히 상승시키는 중이지 않을까 싶다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/O79DLUbN0Ac\" title=\"YouTube\"><\/iframe><\/div>","401872947":"<p>애런 도널드의 복귀와 함께 오프시즌 최강팀으로 평가받았음에도 1주차에 실망스러운 경기력을 보이고 설욕을 하려는 램즈와 지난 주에 굉장히 임팩트 있는 모습을 보였던 뉴욕 자이언츠간의 대결이었는데 램즈의 완승으로 끝났다. 자이언츠는 지난 주 대비 가장 암울한 팀 중 하나가 되었고, 램즈는 오프시즌에 희망하던 바들을 꽤나 보여주면서 자신들이 왜 강팀인지 보여주었다.<\/p><p>2주차에 자이언츠 팬들 만큼 들떴다가 모든 희망이 사라진 팀이 있을까. 지난주 팀의 두뇌를 담당할거라고 했던 잭슨 다트가 무릎 부상으로 경기 초반에 교체되었고, 큰 부상이 아니라는 초반의 보도가 뒤집어지며 시즌 아웃 선언이 되었다. 팬들에게는 잭슨 다트가 지난 주 전년도의 그답지 않은 침착한 경기운영능력으로 크게 성장한 모습을 보였기 때문에 너무나 큰 충격일텐데, 여기에 팀의 에이스 엣지러셔인 브라이언 번스도 발목 부상으로 다수의 게임을 결장할 것으로 보이고, 정상급 레프트 태클인 앤드류 토마스 역시나 부상(다행히 곧 출장을 할 수 있을 것으로 예상된다)으로 경기장에서 나갔다. 이게 단 한 주만에 벌어진 일이다. 결국 짐 하버 시스템에서 엄청난 희망을 보았던 자이언츠 팬들에게는 억장이 무너질 한 주였다.<\/p><p>반면에 램즈는 굉장히 희망적이었다. 이번 게임에 481야드를 전진했고, 그나마 공격쪽에서 약점으로 뽑히던 써드다운도 9번중에 5번을 갱신했다. 램즈가 푸카 나쿠아라는 리그 최고의 리시버가 없는 상황에서 위와 같은 공격기록을 만들어냈다는 것이 가장 고무적이다. 그리고 그 핵심 역할을 한 것은 바로 리시버 드반테 아담스이다. 이번 게임에서 10번의 타겟 8캐치 195야드 2터치다운이라는 정신나간 기록을 만들었느넫, 14년도에 드래프트된 그가 만약 이런 활약을 이번 시즌이 끝날 때까지 계속한다면, 이 시대의 가장 대표적인 리시버로 그를 기억할 수 있을 것으로 보인다. 그의 가장 큰 가치는 역시나 레드존에서의 압도적인 터치다운 능력이다. 수비수와 1대1 상황에서 좌,우 페이크를 주고 수비의 움직임에 따라 순간적으로 수비를 제끼는 능력은 진짜 그린베이 패커스 시절부터 어마어마했는데 지난해부터 램즈의 레드존에서 가장 주요한 무기가 되어주고 있다. 이번 게임에서도 그런 능력 보여줬을 뿐만 아니라, 레드존이 아닌 필드의 한가운데 지역에서 푸카 나쿠아가 해주던 필드를 전진하는 역할까지 수행하면서 자신의 가치를 제대로 보여주었다.<\/p><p>또 하나, 중요한 포인트는 러닝게임의 대 성공이다. 션 멕베이 감독의 경우, 러닝 게임의 대가라는 명성과 다르게 러닝 성적이 시종일관 탑을 기록하지는 않고 어느정도 등락이 있었는데, 재밌는 점은 러닝 성적이 좋을 때, 이게 팀의 전체적인 공격력과 굉장히 직접적으로 연결이 되었다는 것이다. 이번 게임에서 1러닝백 카이렌 윌리엄스는 시도당 7.1야드, 2러닝백인 블레이크 코럼은 시도당 6.6야드라는 어마어마한 러닝 성적을 기록했다. 그리고 이런 러닝의 힘이 되는 것은 오프시즌에 다뤘던 13 퍼스널(1명의 러닝백 - 3명의 타이트엔드가 출전하는 전술)의 사용이다. 3명의 타이트엔드를 길게 펼쳐서 갭 (러닝할 공간 - 블로커 사이의 공간)을 여러개로 늘린 다음에 블로킹 라인을 형성하는 전술은 그자체만으로 러닝 위협이 된다. 램즈는 전년도 시즌 중간부터 본격적으로 13 퍼스널을 사용하더니, 이번 시즌에 더욱 더 집중적으로 사용하는 것으로 보인다. 2주차 램즈의 13 퍼스널 사용비중은 무려 51.8%로 리그의 2위에 2배에 육박하는 수준이었고, 이번 시즌 전체로 봐도 45%에 달한다.  이 13퍼스널에서 패스게임에서까지도 상대에게 위협적이려면 타이트엔드가 패스게임을 잘해줘야 한다. 그 역할을 수행해줄 선수는 테런스 퍼거슨으로 보인다. 이번 게임에 드반테 아담스 다음으로 9번의 타겟을 받았다. 아직까지 폼이 올라오지는 않은것으로 보이지만, 그가 캐치를 잡아가기 시작한다면 램즈의 공격 잠재력이 진정으로 만개(풀포텐)할 것으로 생각된다.<\/p><p>수비쪽에서는 애런 도널드의 복귀전에서, 애런 도널드는 애런 도널드인 모습을 보여주었다. 2년동안 필드를 떠났으면서 돌아와서도 꾸준히 2:1 블로킹을 당한 선수는 애런도널드 뿐이지 않을까 생각이 든다. 특히나 러닝 게임에서 중요한 태클을 만들기도 했고, 만약 패스러쉬에서의 순간적인 민첩함마저 경기를 치룰수록 오르는 것이 가능하다면.. '공백이 있었나?' 라는 생각이 들 정도였다. 하지만 오히려 더 기쁜 포인트는 2선 수비의 약진이다. 지난 시즌 램즈 수비에서 가장 약했던 부분은 바로 2선 수비였는데, 오프시즌, 트렌트 맥더피를 트레이드 해오는 등, 그쪽에 굉장히 많은 투자를 했고 그 효과가 제대로 발휘되었다. 맨투맨의 수비를 꽤나 펼쳤고 그럴 때마다 맥더피가 아주 중요한 패스차단을 수차례 보여주었다.<\/p>","401872948":"<p>목요일 밤의 대학살이라고 불릴 만한 게임이었다. 특히나, 팰컨스가 지난 주에 보여준 졸전을 생각하면 아무리 패커스의 폼이 조금 떨어졌다고 해도, 무난히 승리할 경기였는데 짓밟혀버렸다. 경기 초반은 패커스가 인터셉션도 기록하면서 그래 역시 그렇지하는 추세였는데, 팰컨스의 러닝이 감을 잡기 시작하다니 그 뒤로는 몽골기병이 밟고 지나간것 마냥 패커스가 초토화되었다.<\/p><p>패커스의 입장에서는 굴욕적인 홈 개막전이었다. 어쩌면 리그에서 가장 충성도 높은 램보 필드의 홈 관중들이 야유를 퍼부을 정도였는데, 최악의 경기력이었다. 수비에서 러닝을 못막는 것은 가장 기본 중의 기본도 못한다라고 봐도 될 정도로 수비에서 가장 우선시하는 부분인데, 팰컨스의 아웃사이드 존 러싱에 정말 영혼까지 털려버렸다. 이는 하단 비쟌 로빈슨 내용에서 좀 더 본격적으로 다루기로 하고, 러닝이 털리자 1선에 수비를 더 넣게 되었고, 자연히 2선이 얇아지면서 드레이크 런던을 1대1로 놓아둘 수 밖에 없게 되면서 패스와 러닝 양쪽으로 다 무너졌다. 수비쪽의 이슈는, 안좋은 날이라고 치부를 한다고 쳐도, 공격쪽에서의 부진은 걱정이 된다. 특히나, 오라인의 약세는 계속되고 있다. 안 그래도 리그 중하위권 정도로 전망되었던 오라인에 부상들이 계속 쌓이면서 시즌 전망이 크게 흔들릴 지경이다. 저세상 블리츠를 시전하고 있는 바이킹스를 상대한 경기가 적은 표본에 껴 있어서 어느정도 감안은 필요하지만, 패커스의 쿼터백 조던 러브는 평균 패스까지 공을 잡고 있는 시간이 2.48초로 리그에서 가장 빠르다. 그런데도 불구하고 압박은 42.1%를 받았는데 이는 리그 5위의 수준이다. 즉 공을 엄청 빠르게 뿌리고 있음에도 불구하고 압박을 계속 느끼고 있다는 상황인데, 러싱쪽으로 가면 상황은 더욱 심각하다. 3게임동안 패커스의 러싱야드는 146야드인데, 목요일 경기로 남들은 2게임만 치르고 패커스는 3게임을 한 상황에서도 통합 러싱야드 순위가 30위다.<\/p><p>반면 애틀랜타 팰컨스는 지난주 치욕스러운 패배를 당하고, 이제 더이상 볼 필요조차 없다고 생각했는데, 이는 또 한번 내가 내린 섣부른 결론이었다. 이번 게임의 주인공인 러닝백 비쟌 로빈슨의 경기 후 인터뷰에 따르면 지난 주 팬서스 상대로 34-3 패배 이후에 경기종료 라커룸대화에서 마틴루터 킹의 연설이 연상되는 연설을 했고, 그게 팀을 하나로 뭉치게 했다고 표현했다. 팀이 하나로 뭉쳤다고는 하지만, '비쟌 로빈슨은 미쳤다'라는 생각만 드는 게임이었다. 팰컨스의 주특기이자, 케빈 스테판스키 감독의 주특기는 바로 아웃사이드 존 러싱인데, 케빈스테판스키 특유의 터치를 더했다. 오라인 옆으로 복수의 선수들을 배치하면서 라인의 전선을 길게 늘리고 모든 선수들을 한쪽 방향으로 러닝을 시킨다. 그리되면 수비들도 그에 맞게 횡으로 계속해서 움직일 수 밖에 없을 것이고, 여기서 몇몇 수비는 무리하게 안으로 잘라 들어가려 하고, 어떤 수비들은 아군 블로커들에게 과하게 밀리면서 구멍이 생긴다. 러닝백은 횡으로 움직이면서 보이는 구멍들 중 자기가 어디로 갈지 선택을 해서 파고 드는데, 오라인 옆으로 선수들이 많으니 선택할 수 있는 구멍이 늘어난다. 거기다 비쟌 로빈슨의 스피드를 활용하기 위한 횡적인 움직임도 가능하다는 점에서 아웃사이드 존 러싱이 팰컨스와 굉장히 잘 어울렸고 이번 게임에서 굉장히 주효했다.<\/p><p>1쿼터부터 팰컨스는 오라인 쪽으로 선수를 늘리고 아웃사이드 존 러싱을 했다. 패커스는 라인맨 중에 가장 외곽에 있는 선수가 안쪽으로 파고 드는 움직임을 취해서 오히려 팰컨스의 아웃사이드 존을 도와주는 치명적인 실수를 저지르게 되는데, 이렇게 되면 아웃사이드존에서 취하려는 블로킹이 너무 쉬워진다는 점에서 굉장히 치명적이고, 거기다가 코너백이 외곽을 지키는 역할을 하게 되면서(이 자체가 수비 측면에서 마음에 드는 상황은 아닌데), 스피드 러닝백들이 가장 위협적인 최외곽을 막기 위해 코너백이 안쪽 경로보다는 바깥쪽을 차단하는 것을 우선시하게 되고, 러닝백들은 그 경향을 읽고 너무 쉽게 뛰는 그림이 나오게 된다. 1쿼터 초반, 브라이언 로빈슨(비잔 로빈슨이 아니다)이 달린 러닝 플레이에서 이에 대한 힌트를 얻은 팰컨스는 바로 다음 1ST다운에서 비잔 로빈슨을 기용해 똑같은 전술로 나오는데, 수비는 이전과 같은 움직임을 취했고 비잔 로빈슨은 55야드 러싱을 기록했다. 이때 게임의 분위기가 완전히 넘어갔다. 그렇게 계속해서 아웃사이드존에서 외곽을 공략당한 패커스는 후반전에 엣지러셔를 내곽으로 움직이게 하는게 아니라 오히려 외곽 쪽 경로를 더 차단하게 하는데, 비잔 로빈슨 정도의 러닝백에 이날 팰컨스의 오라인 폼이라면, 아웃사이드 존 러싱을 상대할 정답같은건 없다. 상대가 밖을 막는 움직임을 보자마자 차분히 상대를 유도하고서는 내곽으로 파고드는데 바로 31야드 또 하나의 빅플레이를 만들어버렸다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/UYO1VMfL1gk\" title=\"YouTube\"><\/iframe><\/div>","401872949":"<p>브라운스가 최근에 기세를 타고 있는 캐롤라이나 팬서스를 상대로 한 게임에서 깜짝 승리를 거두며, 어? 왜? 브라운스가? 라는 서프라이즈를 한 주 더 이어가게 되었다<\/p><p>브라운스의 팬이라면 가장 기쁠만한 것은 토드몽켄의 뚝심이 유효하다는 점일 것이다. 정말 어렵게 처음 감독의 기회를 얻은 66년생의 토드 몽켄은 굉장히 혼란스러운 브라운스의 쿼터백 룸에서 드숀 왓슨을 쿼터백으로 지명했다. 대다수가 도데체 왜? 라는 의문을 표했다. 쿼터백은 작년 브라운스 몰락의 주요 이유중 하나였기 때문이다. 그런데 이번 시즌에는 2주 연속 좋은 의사결정으로 보이는 점이 인상적이다.<\/p><p>드숀 왓슨은 확실히 그가 브라운스로 와서 보여주었던 경기들 중에서는 가장 좋은 경기력을 2주연속 보여주고 있다. 게다가 이번 주는 저번 주보다도 더 나아진 모습이라고 할 수도 있을 것 같다. 여전히 좋은 포켓 인지능력을 기반으로 조금씩 플레이를 연장하면서 팀의 승리에 필요한 플레이들을 해주고 있다. 하지만 그렇다고 전성기의 폼이 돌아왔다, 혹은 이 팀의 미래라고 하기에는 섣부른 것으로 보인다. 무엇보다 빅패스가 너무 없다. 패스 평균 비거리는 이번 경기 그래도 6야드 수준으로 올라오긴 했지만, 여전히 쿼터백에게 중요한 수치 중 하나인 빅패스부문에서 전성기에 비교해서 한참은 모자란 것을 확인할 수 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>ADOT (평균 패스 비거리)<\/th><th>15+야드 패스 비중<\/th><th>성공률<\/th><th>EPA (효율성)<\/th><\/tr><\/thead><tbody><tr><td>2주차<\/td><td>3.6<\/td><td>6.7%<\/td><td>50%<\/td><td>+0.282<\/td><\/tr><tr><td>3주차<\/td><td>5.9<\/td><td>10%<\/td><td>33%<\/td><td>+0.178<\/td><\/tr><tr><td>19시즌<\/td><td>8.93<\/td><td>21.6%<\/td><td>46.7%<\/td><td>+0.703<\/td><\/tr><tr><td>20시즌<\/td><td>8.90<\/td><td>22.2%<\/td><td>57%<\/td><td>+0.851<\/td><\/tr><\/tbody><\/table><\/div><p>오히려 긍정적으로 보아야할 것은 젊은 선수들의 약진이 아닐까 싶다. 러닝백 저드스킨스, 타이트엔드 패닌은 2년차, 양 리시버는 모두 올해 드래프트 한 신인들인데 이들 모두 NFL에서 능히 뛸만한 퍼포먼스를 보여주고 있다(아직 스타라고 하기엔 이르다). 거기에 전년도 1라운드 픽인 수비수 메이슨 그래햄이 이번 경기의 주인공이 되었다. 내곽 수비라인맨으로 오라인을 순간적으로 파고 들어 안으로 들어가는 움직임이 매우 고평가를 받았던 선수로, 이번 게임에서 2개의 쌕에 3개의 백필드 태클을 기록하면서 브라이스 영과 캐롤라이나 팬서스의 공격에 굉장히 큰 지장을 주었다. 아울러서, 브라운스의 코너백 덴젤 워드는 약한 팀 덕분에 조명을 덜 받지만 왜 자신이 특급 코너백의 대열에 들어가야하는지 팬서스의 에이스인 티맥을 피지컬하게 제압하면서 보여주었다.<\/p><p>팬서스 입장에서는 아쉬운 패배가 되었다. 경기의 전술준비나, 선수들의 퍼포먼스 측에서 누군가를 특징해서 꼽기는 어려운 패배였는데, 브라이스 영이 컨디션이 떨어졌다 라는 부분이 가장 아쉬울 것으로 보인다. 특히 지난해부터 꾸준히 성장을 해온 20야드 + 패스 플레이들, 지난주에는 무려 83.3%의 성공률(6번 시도중 5번 성공)을 보였던 빅패스 플레이가 이번주에는 제대로 긁히지 않은점(28.6% 성공률, 7번 시도 2번 성공)이 아쉽다. 그러나 장기적인 관점에서 더 걱정되는 점은 부상이 계속 쌓이고 있다는 점이다. 팀의 시즌 초반 에이스로 올라서는 코커가 부상으로 빠졌고, 오라인에서도 부상이 쌓이고, 수비쪽에서도 조금씩 부상이 쌓이고 있다.<\/p>","401872950":"<p>NFL에서 가장 격렬한 디비전 라이벌 들 중 하나인 피츠버그 스틸러스와 신시내티 뱅갈스의 게임은 스틸러스가 27-30의 막판 신승을 거두면서 경기가 끝났다.<\/p><p>스틸러스 입장에서는 이렇게 시원시원한 공격력을 본게 몇년만일까 싶을 정도였다. 애런 로저스는 스틸러스에서 온 뒤로 가장 좋은 경기를 펼쳤다고 해도 무방한데 우리가 기억하던 애런 로저스의 모습으로 회춘한듯했다. 지난해부터 애런 로저스가 스틸러스에서 보였던 중장거리 패스들은 DK 맷캐프가 밖으로 빠지면 그쪽에 1대1 공을 던지는 것 뿐이라고 해도 과언이 아니었다, 하지만 이번 게임에서는 가운데 지역에서 12/19에 196야드 성공률은 무려 64.3%로 이전 추세와는 정반대의 성적을 보여주었다. 필드의 중앙 공략이 효율적인 패싱게임에서 굉장히 중요한 부분이기에 아주 긍정적으로 볼 수 있고, 몇몇 패스의 정확도들은 (로만 윌슨 3RD &amp; LONG 캐치, DK 맷캐프 경기 후반 패스) 오 전성기 로저스가 떠오를만한 플레이들이었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/tE7P1l4C3pc\" title=\"YouTube\"><\/iframe><\/div><p>이럴 수 있었던 가장 큰 이유중 하나는 오라인이 그를 잘 지켜주었기 때문이다. 지난 경기 페이트리어츠한테 영혼까지 털린 오라인을 재정비하고 온 스틸러스는 그 효과를 바로 보았다. 우측 오라인을 바꿨고, 나초라는 별명이 있는 올해 드래프트 된 신인을 기용했는데, 36번의 패스 블로킹 스냅에서 75%를 1대1로 엣지러셔를 막았고 개중에 단 3개만의 압박을 허용하면서 아주 단단한 모습을 보였다. 역시 1라운드 오라인은 든든한걸까에 대한 생각이 들게 했고, 반대쪽에 있는 1라운드 픽 오라인맨 트로이 파타누 역시나 아주 인상적이었다. 특히나 러닝게임에서 대단했는데, 이번 게임 스틸러스의 러닝게임 초점은 굉장히 명확했다. 덱스터 로렌스를 2대1로 사력을 다해서 막고 (하단 영상 중에 2대1로 싱글레그를 거는 반칙을 감수해서라도 막는 장면은 백미), 로렌스가 없는 바깥쪽 러닝으로 초점을 맞춘다 이었고 이게 굉장히 주효했다. 앞서 말한 트로이 파타누는 이번게임에서 자신의 장기인 운동능력을 활용해서 기가막힌 블로킹들을 계속해서 성공을 했고, 결과적으로 러닝백 제일런 워랜은 왼쪽으로 가는 11번의 러닝에서 108야드라는 어마어마한 수치를 기록하였다. 그리고 러닝이 먹히다보니까 뱅갈스는 계속해서 최후방에 한명만을 놓을 수 밖에 없었고, 이는 계속해서 뒷공간에 빈자리를 만들었고, 터치다운 플레이에서는 러닝플레이를 너무 신경쓴나머지 벤 스크로닉의 블로킹을 과하게 의식해 터치다운을 허용했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/kl9JLkbAq2Q\" title=\"YouTube\"><\/iframe><\/div><p>뱅갈스 입장에서는 디비전 라이벌과의 패배가 뼈아프다. 덱스터 로렌스의 합류에 따른 수비의 상승 영상을 만들자마자 이런꼴이 난 내 처지가 제일 당황스럽긴한데. 수비는 쉽지 않았다. 스틸러스가 전주 차 게임을 잘 분석해서 덱스터 로렌스를 피해서 플레이하기만 하면 되네 라는 가정을 세우고 그걸 실천했는데, 그에 대한 어떠한 해답도 내놓지 못했다. 터치다운을 당하는 플레이에서는 수비끼리 부딪히고, 라인배커들은 잘못된 의사결정으로 공간을 뻥뻥 내주고 태클을 실패하는등 쉽지 않았고, 스페셜팀에서조차 1번의 머프트 펀트 (펀트를 잡으려다가 실패하는것), 그리고 러핑더 키커로 상대의 4TH다운 을 갱신으로 바꿔주는 치명적인 실수들이 나왔다. 공격은 경기초반 조 버로우가 이제 몸이 풀렸다는 듯 신내린 패스 실력을 선보였는데, 원래부터 장기인 수비분석 -&gt; 의사결정 스피드는 역대급에도 언급되어야하지 않을까싶은 생각을 또 들게 하였고, 넘어지는 티 히긴스의 품에 똑 떨어지는 초장거리 패스는 와... 팔 정확도가 무슨 하는 생각마저 들게 했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/30UvYo8sbV0\" title=\"YouTube\"><\/iframe><\/div><p>거기다가 오라인의 안정성도 오 이게 진짜 뱅갈스의 오라인인가 싶을 정도로 조 버로우에 대한 보호가 좋았다. 다만, 경기 극후반에 승리를 확정지을 수 있는 상황에 스틸러스의 수비에 제대로 당하면서 패배를 확정지었는데, 단 한번의 공격권에서 참패를 당했다 라고 볼 수도 있지만, 뱅갈스의 수비와 (덱스터 로렌스 외에) 스페셜팀이 이런 퍼포먼스라면 뱅갈스의 공격은 또한번 지난해, 지지난해처럼 완벽해야지만 승리를 할 수 있을 것이다.<\/p>","401872951":"<p>이번 시즌 플레이오프 진출이 기대되었는데, 시즌 초반이 뜻대로만 풀리지 않고 있는 두 팀, 거기다가 같은 디비전에까지 속한 인디애나폴리스 콜츠와 휴스턴 텍산스간의 대결이었는데, 콜츠가 막강한 수비의 휴스턴을 물리치고 1승을 챙겼다.<\/p><p>텍산스는 공격에서의 부진이 이번 시즌까지도 이어질 것으로 보인다. 오라인을 새로 정비하고 러닝백 몽고메리까지 데리고 오면서 공격의 쇄신을 꿈꿨는데, 이번 경기도 쿼터백 스크램블을 제외한 러닝은 시도당 3.1야드라는 비참한 성적을 거뒀다. 시즌 전체로 놓고봐도 3경기동안 시도당 3.06야드이다. 이런 현상을 더욱 부추기는 것은 리시버진에서의 경쟁력 상실이다. 리시버가 공을 잡을 때 수비가 가까이 있냐 없냐 여부를 보여주는 컨테스티드 캐치 스탯을 보면 휴스턴은 32.8%(1위)로 리시버들이 수비와 거리를 벌리지 못하고있다. 물론 해당 스탯은 리시버의 스타일상 문제(티히긴스처럼 경합상황에서 우위가 있는 유형)라고 해석할 수도 있는데, 휴스턴의 컨테스티드, 즉 경합상황에서의 캐치 성공률은 45%로 리그 24위에 불과하다. 이마저도 니코 콜린스의 수치를 빼면 더 처참해지는데, 이번시즌 5개의 컨테스티드 캐치 중에 5개를 잡아낸 니코콜린스를 제외하면, 휴스턴 텍산스 리시버들의 경합상황에서의 캐치는 26.7%로 순위는 리그 최하위급인 30위까지 떨어직게 된다. 그러다보니, 휴스턴을 상대하는 팀들이 박스에 8인 이상을 두는 극단적인 러닝 수비 전술을 취하는 경우(어차피 휴스턴 리시버가 못하니까..)가 24.2%로 리그의 압도적 1위고 이게 러닝 전술의 부진으로 자연스레 이어진다.<\/p><p>그리고 드미코 라이언스의 4TH다운이나 경기 막판 타임아웃에 관해 미숙한 부분이 또 나왔다(공격쪽에서 부진하던 영향인지는 알 수 없다). 지난 경기에서도 덱스터 로렌스에게 겁을 먹고 4TH 다운 상황에서 고포잇을 하지 않았던 것을 말했었는데, 이번 경기도 막판에 의아한 포인트들이 있었다. 2분 안쪽 텍산스가 이기고 있으나 필드골 하나에 역전될 수 있는 상대의 마지막 공격권에서 킥오프를 35야드에 시작하게 킥을 찬것부터 시작해서, 그 뒤에 트레드웰에게 20야드 패스 플레이를 내주고, 타임아웃을 부르지 않는데 왜 안불렀는지 의아하다(콜츠의 공격이 시간을 많이 잡아먹으면, 이후 텍산스의 공격 시간이 줄어든다). 타임아웃이 3개가 모두 있는 상황이었는데도 말이다. 그렇게 1:43초 남았던 게임은 1:11초가 될때까지 30초가 또 지나는데... 백번 양보해서 부르지 않아도 된다고 판단해서 부르지 않았다고 해도, 그 다음 플레이에서 콜츠가 러닝을 하고 5야드 정도를 갔는데, 이때도 바로 타임아웃을 부르지 않는다. 그리고 더 당혹스러운 것은 그 다음에 시간을 42초나 흘려보내고 나서 다음 플레이가 있기 전인 29초 남은 시점에 타임아웃을 불렀다. 결국 그렇게 콜츠의 전진은 전진대로 허용하고 필드골을 내주고는 소중한 시간과 타임아웃을 의미없이 날려버리고 16초가 남은 상태로 공을 받은 텍산스 공격이 할 수 있는 것은 없었다.<\/p><p>콜츠측에서는 비록 4번의 쌕을 당하고 조나단 테일러가 단 70야드 밖에 기록하지 못했지만 승리했다. 이는 리그 최고의 수비 중 하나인 텍산스를 상대했기 때문이라고 보인다. 특히나 알렉 피어스가 부상으로 빠져서 공격의 한계가 분명해보이는 상황에서 팀의 2번 무기이자 이제는 1번 무기 역할을 할거라고 기대한 타일러 워렌의 활용이 눈에 띄었다. 타일러 워렌은 타이트엔드이기 때문에 필드의 중앙부분에서 활약을 하는데, 이리 되면 워렌, 키넌 앨런, 조쉬 다운스 모두 중앙부분에서 재미를 보는 역할이라 수비 입장에서 공격이 단조로워질 수 있었다. 그래서 타일러 워렌은 왼쪽 바깥으로 빼는 플레이가 굉장히 많았다. 이로 인해 중앙의 키넌 앨런에게 공간이 열리게 되고, 기동력이 좋은 조쉬 다운스는 중앙보다 좀 더 깊은 쪽을 공략하게 하면서 단조로울 수 있는 패싱게임을 타파했다. 2번 무기인 워렌을 일종의 미끼로 사용한건데 그 덕분에 앨런과 조쉬다운스가 아주 큰 활약을 펼쳤다. 특히 조쉬다운스는 jsn이 연상되는 유려한 움직임으로 게임에 가장 큰 변수가 되었고, 휴스턴 텍산스 수비진의 유일한 상대적 약점이라 할 수 있는 라인배커진을 잘 괴롭혔다. 특히 전술적으로 굉장히 재밌게 봤던 플레이는 RPO(런 패스 옵션 플레이)였다. 보통 RPO 플레이에서는 쿼터백이 러닝백에게 공을 내주는 모션을 취하고 수비 한 명을 읽고 그 수비의 움직임에 따라 공을 주던지 아니면 그 뒷공간으로 패스하는지를 정하는데, 콜츠는 센터를 가드의 뒤로 풀링하는 액션을 하나 더 추가하면서 라인배커들을 완벽히 속였고, 그 뒷공간에 조쉬다운스를 침투시켰다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/gsLNPq-KASY\" title=\"YouTube\"><\/iframe><\/div>","401872952":"<p>이번 시즌 폼을 굉장히 끌어올리면서 리그 최강의 자리를 다시 되찾겠다는 포부를 보이는 치프스와 누가봐도 탱킹시즌이지만 의외로 분전하고 있는 마이애미의 대결인데, 마이애미가 열심히 싸웠지만 결국 치프스를 꺽지 못하고 24-10으로 패배를 하였다.<\/p><p>돌핀스 팬들입장에서 가장 비통한 뉴스는 이번 경기의 패배보다도 그들의 스타 러닝백 데본 에이첸의 부상 소식이다. 무릎부상으로 보도가 되던데 높은 확률로 꽤나 오래 자리를 비울거라, 돌핀스의 로스터에서 유일하게 스타라고 할 수 있는 에이첸의 부재는 이번 시즌에 대한 그나마 있던 작은 희망도 꺼뜨릴 수 있다. 거기다가, 스피드에 워낙 기대는 선수라 부상 이후 폼이 어떨지에 대해서도 걱정이 된다.<\/p><p>반면에 재밌는 점은, 경기력이 화끈하다는 점이다. 패커스에서 수비코치를 하다가 감독이 된 제프하플리는 패커스에서 백업 쿼터백이었던 말릭 윌리스를 데리고 왔는데, 월리스는 일반 백업 쿼터백과는 좀 다른 경향이 있다. 일반적으로 백업 쿼터백이라하면 경기내용이 소극적이라 안정적인 패스를 우선으로 하고 빅패스 비중이 낮은데, 지난해 말릭윌리스는 딥패스 (20야드이상) 비중이 리그 1위였고 그 경향은 올해도, 그리고 이번 경기에서도 이어가고 있다. 다만, 지난해 성공률이 80%에 육박했던 20야드 이상 패스가 올해는 57%로 떨어졌고, 이번 게임에서는 10번의 시도중 1번만 성공한게 아쉬운점이긴 하다. 돌핀스는 올해 누가봐도 안될 약팀임에도 소극적으로 플레이하는 것이 아니라 공격적으로 플레이한다는 것이 팬들에게 그나마 위안이 되지 않을까싶다.<\/p><p>치프스에게 가장 깔끔하고 완벽한 경기는 아니었지만, 올해 그들의 장점이 무엇이고 그들이 무엇을 하고 싶은지 분명하게 보여주었다. 치프스에서 마홈즈 다음의 에이스, 특히나 팀의 폭발력을 담당하는 에이스는 러닝백 케네스 워커이다. 워커는 현재, 러싱야드 리그 1위, 시도당야드 리그 4위, 터치다운 리그 6위, 10야드 이상 리그 3위 등 그야말로 탑5급 러닝백의 퍼포먼스를 보이고 있는데, 이번 경기에서는 18캐리 70야드 1터치다운으로 이전 주들에 비해 그 활약은 좀 덜했다. 하지만, 그의 존재감 자체가 게임에 굉장히 큰 영향을 주고 있는데, 수비들이 그를 무시할 수 없다보니 1선에 붙게되고 자연히 뒷공간 특히나 라인배커들이 있던 곳에 공간이 생기게 된다. 즉, 러닝인 척 패스하는 플레이 액션 패스의 가능성이 열리게 되는데, 올해 치프스는 이를 기본으로 전혀 다른 아이덴티티의 모습을 보여주고 있다.<\/p><p>아직 시즌이 이르긴하지만, 플레이 액션 비중은 40%에 달할정도로 이전 시즌 대비 2~3배 뛰어버려렸고(순위로 보면 리그 꼴지에서 현재 리그 1위), 이런 플레이 액션의 성적 또한 말도 안되게 올랐다. 성공률은 10%넘게 뛰고 EPA도 2배 가까이 뛰었는데, 이번 게임에서는 특히나 이 쪽에 더 힘을 실었다. 24번의 패스 중에 12개가 플레이 액션이었고, 12개의 플레이 액션 패스는 모두 다성공했고 무려 194야드나 갔다. 마홈즈가 플레이 액션 쿼터백으로 또 한번 더 변신을 하고있다는 생각이 드는 무서운 순간인데, 이번 경기에서도 플레이 액션 패스에서 나온 마홈즈와 켈시의 호흡이 비등했던 게임의 호흡을 완전히 끝내버렸다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>플레이 액션 비중<\/th><th>플레이 액션 시도당 EPA<\/th><th>성공률<\/th><\/tr><\/thead><tbody><tr><td>25시즌<\/td><td>14.3% (32위)<\/td><td>+0.16 (23위)<\/td><td>47.6% (25위)<\/td><\/tr><tr><td>26시즌<\/td><td>38.8% (1위)<\/td><td>+0.479 (8위)<\/td><td>71.1% (3위)<\/td><\/tr><tr><td>26시즌 3주차<\/td><td>50%<\/td><td>+1.280<\/td><td>91.7%<\/td><\/tr><\/tbody><\/table><\/div>","401872953":"<p>차저스와 빌스의 게임이었는데, 차저스가 정말로 드디어 승리의 단맛을 처음 느껴볼 수 있겠다 싶을 정도로 상이 차려지더니.. 결국 상을 걷어차면서 패배를 당한 경기였다. 빌스는 이날 폼이 정말 안좋았다. 차저스는 턴오버를 5개나 만들면서 상대와 턴오버가 4개너 차이가 났음에도 패배했는데, 기록을 찾아보니 2013년부터 단 2팀만이 이런 상황에서 패배를 당했다고 한다. 그리고 차저스가 3번재 팀이 되었다.<\/p><p>시즌 전까지만해도 가장 기대를 받던 팀 중 하나인 차저스였는데, 지금은 기대를 받았던 것들 모두가 안풀리고 있다고 봐도 무방하다. 저스틴 허버트는 커리어 최악의 해를 보내고 있는데, 이번 경기에서는 대학 쿼터백조차 안할 이해가 안되는 패스 실수로 인터셉션을 당하며 패배에 기여했다(물론 포켓 내 움직임 같은건 확실히 좋긴했다. 그런데, 경기가 이지경인데도 승리하지 못하면 그게 무슨 의미일까).<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th class=\"r\">2026년<\/th><th class=\"r\">비고<\/th><th class=\"r\">순위/전체수<\/th><\/tr><\/thead><tbody><tr><td>CPOE (기대 대비 플레이 성공률)<\/td><td class=\"r\">-4.22%<\/td><td class=\"r\">커리어 최저<\/td><td class=\"r\">24/26<\/td><\/tr><tr><td>패스 성공률<\/td><td class=\"r\">60.5%<\/td><td class=\"r\">커리어 최저<\/td><td class=\"r\">24/26<\/td><\/tr><tr><td>패스당 EPA<\/td><td class=\"r\">-0.131<\/td><td class=\"r\">마이너스가 커리어 최초<\/td><td class=\"r\">21/26<\/td><\/tr><tr><td>20야드 이상 CPOE<\/td><td class=\"r\">-19.23%<\/td><td class=\"r\">커리어 최저<\/td><td class=\"r\">21/22<\/td><\/tr><tr><td>20야드 이상 패스당 EPA<\/td><td class=\"r\">-0.738<\/td><td class=\"r\">-<\/td><td class=\"r\">22/22<\/td><\/tr><\/tbody><\/table><\/div><p>더 큰 문제는 감독 - 코치진 쪽에서 찾을 수 있다. 일단, 24년에 새로이 감독이 된 짐 하버에게 팬들이 가장 기대했던 것은 단단함이었다. 전술적으로 화려하고 창의적이지 않지만, 팀의 규율과 기강을 잡고 실수들을 줄여나가면서 절대 지지 않는 딴딴한 팀이 될 것이라고 기대했고, 실제로 짐 하버도 그런 부분에서 큰 성과를 냈었던 감독이었다. 하지만, 지금 형국은 정반대이다. 이번 경기에서 나온 4TH 다운 상황의 의사결정들이 그러했는데, 개인적으로 4TH다운의 고포잇 시도나 필드골 시도 같은 걸로 평을 남기는 건 너무 결과론적이라 좋아하지 않는데, 이번 경기 3쿼터까지 상대진형의 4TH &amp; 3상황에서는 모두 필드골을 차면서(개중에 1개는 실패) 4쿼터에 가서 4TH &amp;10, 그것도 자기 진형에서 갑자기 고포잇을 하는 장면은 아... 우리가 기대한 짐하버 감독의 뚝심과는 전혀 상반되는 우왕좌왕하는 모습인것 같아서 아쉬움이 컸다.<\/p><p>거기에 오라인의 반칙은 훨씬 더 큰 문제다. 절대 지지않는 미식축구 팀의 가장 중요한 점은 바로 반칙이 없는 것이다. 미식축구에서 반칙하나의 피해정도는 상당히 커서 반칙을 하지 않는 강력한 오라인의 힘으로 묵직한 공격을 펼치는 팀의 파괴력은 상당하고, 이런 점이 짐 하버 감독의 장기였는데... 24시즌 그가 왔을 때 차저그는 리그에서 오라인 반칙 31위로 역시! 했었는데, 25시즌은 오라인 반칙이 2위였다. 작년은 오라인에 부상이 워낙 많았어서 준비 안된 인원들이 뛴경기도 많았기에 그래 그럴 수 있지 라고 생각했는데, 올해는 작년을 넘어서 리그 1위의 오라인 반칙을 기록하고 있다. 여기다가 팀의 미래 명전자이자, 든든한 버팀목이 되어줄거라고 기대한 1라운드 픽 태클 조 알트가 부상에서 돌아온 후 폼이 영 떨어졌는데, 폼만 떨어진게 아니라 부상까지도 리그 1위 수준이다.<\/p><p>경기결과가 더더욱이나 안타까운점은 차저스의 수비가 간만에 날이 제대로 선 모습을 보인 상황에서 나온 패배라는 점이다. 조쉬알렌이 오늘 폼이 좀 크게 흔들리면서 과거 주사위가 안떴을 때의 모습이 나오기도 했지만, 전반적으로 1선의 압박부터 최후방의 지역수비까지 차저스가 굉장히 기본에 충실한 형태로 좋은 수비를 펼쳤다. 특히나 조쉬알렌의 인터셉션은 쿼터스, 혹은 커버 4 즉 4명의 최후방 수비를 두고 그 안쪽 4분면을 커버하는 세이프티가 코너백처럼 지역수비를 하다가 앞을 잘라먹는 플레이에서 나왔는데 교과서에 실려도 무방할정도로 깔끔한 쿼터스 수비였다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/yQoHzzbr4hI\" title=\"YouTube\"><\/iframe><\/div><p>빌스의 입장에서는 조쉬알렌의 퍼포먼스가 크게 흔들리던 와중에서 승리를 거둔 점이 무척이나 고무적일텐데, 가장 큰 공신 중 하나는 러닝 공격력이다. 이번 경기에 제임스쿡은 15번의 러닝에서 듀오 전술로 달렸는데, 거기서 108야드에 터치다운, 시도당 7.2야드라는 아름다운 수치를 기록했다. 듀오 전술은 맨블로킹 전술로 오라인을 중심으로 한 1선이 수비와 2대1을 최대한 많이 만들어내서 힘으로 밀어 붙이면서 러닝백이 그 뒤를 따라 뛰다가 라인배커를 어느 한쪽 구멍으로 유도하고는 순간적으로 다른 구멍으로 돌파하는 플레이를 의미한다. 제임스 쿡의 함정파기와 순간적인 움직임, 그리고 급발진 스피드도 환상적이었고, 2대1로 상대를 무자비하게 짓밟아버린 빌스의 오라인도 강력했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/2wHf88KcP3A\" title=\"YouTube\"><\/iframe><\/div><p>여기에 빌스의 1선 수비진도 대단했다. 지난 몇 경기동안 계속 꾸준하게 잘하고 있었는데, 이번 주에도 역시나 임팩트를 냈다. 특히, 빌스의 엣지러셔인 그렉 루쏘는 지금 시즌이 끝난다면 올해의 수비수를 타야할 정도의 활약을 보이고 있다. 그는 3경기 연속 2개의 쌕을 기록하였고 거기다가 펌블을 3개나 만들어냈다. 안쪽에서 엄청난 존재감을 보이며 러닝을 막고 패스에서도 간간히 도움을 주는 2년차 내곽 수비라인맨 디온 워커의 성장이, 그가 좀 더 순수하게 패스러쉬에 집중할 수 있게 해준듯한데 둘을 함께 기용할 때 빌스의 1선 수비는 상당히 강력하다. 이번 경기 둘이 함께 한 스냅은 41개의 스냅이었는데, 그 때 차저스의 허용 EPA는 -0.206이였고 색 2개와 턴오버를 만들어냈다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/YMDKgoDNlVU\" title=\"YouTube\"><\/iframe><\/div>","401872954":"<p>디트로이트 라이언스의 수비코치였던 애런 글렌이 제츠의 감독이 되면서 사제 대결 매치업인 라이온스대 제츠의 게임은, 전반전까지 0-0으로 조용하다가 후반전에 갑자기 양팀의 공격이 불붙기 시작하면서 24-31이라는 생각보다 박빙의 승부가 펼쳐졌다.<\/p><p>매주 게임마다, 여러 포인트들 그리고 앞으로 그 요인들이 팀의 미래에 어떤 영향을 끼칠까를 써야하기에 그런 점들을 집중해서 보는데, 이번 게임은 슈퍼스타들의 하이라이트 만으로도 '미식축구가 그래 탈인간들의 스포츠지' 라고 느끼게 해주었다. 특히 라이언스의 자미어 깁스를 보면 감탄 밖에 안 나왔다. 현재 리그의 1황 러닝백을 놓고 비쟌 로빈슨과 정말 치열하게 다투고 있다고 생각되는데(공교롭게 둘은 드래프트 동기다) 첫 터치다운 플레이에서 달리다가 방향을 순간적으로 바꿔서 그걸 엔드존까지 가져가는 장면은, 현지 중계에서도 언급되었지만, 내가 NFL을 처음 보기시작할 때의 라이언스 러닝백(배리 센더스 - 역대 최고의 러닝백 중 1인으로 언급됨)를 연상케 할 정도의 폭발력이었다. 제츠 측에서도 가만히 있지 않았던게, 그들의 어린 스타 리시버 개럿 윌슨은 왜 자신의 이름이 탑 리시버급에 올라야하는지 보여주었다. 수차례 인상적인 플레이들을 경기내내 보여주었는데 특히, 3쿼터즘에 나온 온 몸을 쭉 뻗어 날아올라서 공을 하늘에서 낚아채오는 플레이는 그 중 백미였다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/bI98Vqo5so4\" title=\"YouTube\"><\/iframe><\/div><p>앞으로를 생각 했을 때 양 팀에서 다 긍정적인 포인트를 찾을 수 있을 것이다. 우선 패배는 했지만 제츠 입장에서 가장 좋은 것은 역시나 공격이 좀 나아졌다는 것이다. 전년도 리그 최하위를 넘어 근래 NFL에서 본 것중에 가장 답없는 공격을 보이던 제츠가 이번시즌에는 그래도 공을 좀 잘 전진시키고 있고, 그 주인공은 쿼터백인 지노 스미스다. 커리어 자체가 롤러코스터라고 할 수 있는데, 제츠에 드래프트 되었다, 버스트라는 평가를 들으면서 이팀 저팀 떠돌다가 시애틀 시호크스에서 귀신같은 재기를 하며 프로볼에 2회선정되었다가 팀에서 그 대신 샘다놀드를 선택하고, 레이더스로 향했는데 거기서 또 졸전을 보였다가 올해 자신의 친정팀인 제츠로 돌아온 꼴인데. 이번 게임에서는 왜 자신이 프로볼에 2번이나 뽑혔는지 보여주었다(사실 그전부터도 나쁘지 않았다). 이번 경기에서는 37개의 패스시도 중에 31개를 성공시키며 321야드 3개의 터치다운을 기록했는데 시원시원하게 빅패스들을 연결하는 걸 보면 그래! 저거지! 하는 순간들이 있었다. 물론, 러닝백인 브리스 홀이 부상을 당했다는 점은 앞으로를 생각했을 때 치명적일 수 있다. 지노스미스에게만 의존하기에는 불안정성이 높기에 이 팀의 안정적인 공격 즉 기본 옵션을 제공하던게 브리스홀의 러닝인데 그게 빠지다보니 앞으로 제츠의 앞날은 더더욱 지노 스미스에게 걸려있다고 할 것이다.<\/p><p>라이언스 입장에서도 좋은 소식이 있었다. 공격이야 스타플레이어에게만 집중을 한다는 비판이 있긴 하지만, 스타들이 오늘 경기처럼 하면 그건 비판이 아니라 좋은 전술적 접근인데, 사실 이번 시즌 내내 이런 퍼포먼스를 보이고 있어서 '어 이제는 비판 포인트를 칭찬으로 바꿔야하는가?' 라는 생각이 들고 있다. 좋은 소식은 수비쪽에서 나왔다. 이번 게임에서 라이언스는 5개의 쌕을 기록했고, 마지막 쌕은 특히나 경기를 끝내버리는 쌕이었다. 라이언스의 2선 수비진에서 부상이 쌓이고 퍼포먼스가 상당히 안나오고 있기 때문에 앞에서 압박을 무조건 만들어 줘야 한다고 해도 과언이 아닌데, 늘 허친슨을 제외하면 아무도 압박을 만들어내지 못한다는 약점이 있었다. 하지만 이번 게임에서 5개의 쌕 중 허친슨이 1개 밖에 없고 다른 엣지러셔인 워넘이 2개를 기록했다는건 고무적이다. 거기다가 제츠의 오라인이 약하다고 하기에는 어려운 최소 중위권 정도는 되는 수준이라는 걸 생각하면 라이언스 수비가 시즌이 지날 수록 살아날 수도 있지 않을까? 라는 생각을 들게 한다.<\/p>","401872955":"<p>이번 주를 넘어서 어쩌면 올해 가장 반전의 게임일지 모른다. 슈퍼볼 챔피언이자 시즌초에도 막강한 포스를 보이던 시호크스가 주전 쿼터백이 돌아온 게임에서 주전 쿼터백과 오라인 다수가 부상으로 나간 커맨더스에게 깜짝 패배를 당했다.<\/p><p>시호크스 입장에서는 이런 날도 있는 거지 하고 넘어가는게 가장 나을 것으로 보인다. 공격쪽에서 패스를 고집한 점은 좀 이례적이긴 하지만, 초반에 펌블도 나왔고 오랜만에 복귀한 팀의 에이스 쿼터백 샘다놀드를 좀 더 믿어보고싶은 마음, 거기다가 커맨더스의 2선 수비진이 꽤나 약하다는 요인들이 다같이 작용한게 아닐까 싶다. 러닝공격의 효율성이 이번시즌 들어서 크게 떨어진다라는 현지의 이야기도 꽤 있긴하지만, 개인적으로 지난해 초에도 이와 크게 다르지 않았다는걸 생각하면 시즌이 풀리면서 조금씩 나아질 포인트가 아닐까 싶다. 오히려 선발 세이프티(최후방을 지키는 2선수비수)가 둘다 부상으로 결장인게 좀 걸리긴한데, 이는 마이크 맥도널드의 매직에 기대야할 것으로 보인다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>러닝 비중<\/th><th>러닝 시도당 야드<\/th><th>플레이 성공률<\/th><th>플레이 당 EPA<\/th><\/tr><\/thead><tbody><tr><td>'25시즌 전반기<\/td><td>49.1%<\/td><td>3.82야드<\/td><td>38.2%<\/td><td>-0.125<\/td><\/tr><tr><td>'25시즌 후반기<\/td><td>49.4%<\/td><td>4.73야드<\/td><td>43.2%<\/td><td>+0.013<\/td><\/tr><tr><td>'26시즌<\/td><td>44.4%<\/td><td>3.7야드<\/td><td>37.7%<\/td><td>-0.256<\/td><\/tr><tr><td>'26시즌 3주차<\/td><td>28.1%<\/td><td>2.44야드<\/td><td>38.9%<\/td><td>-0.443<\/td><\/tr><\/tbody><\/table><\/div><p>커맨더스 측에서는 베테랑 마커스 마리오타가 큰걸 하나 해줬다. 테리 맥로린과의 환상적인 호흡, 중간중간 나오는 정교한 패스들도 아주 좋았고, 무엇보다 시애틀 시호크스를 상대하면 짧은 패스를 참을성 있게 욕심 내지 않고 가져가야하는데 거기서 베테랑의 인내력이 돋보였다. 특히 리시버 3명을 바깥쪽으로 뭉치고 그 선수들의 움직임을 섞으면서(예를 들어 뭉친 3명 중 가장 왼쪽은 오른쪽으로 루트를 타고, 오른쪽은 왼쪽으로 루트를 타는 류) 거기서 나온 순간적인 수비의 혼란 그리고 그에 따른  단거리 구역의 공략이 생각보다 잘 먹혔다. 시애틀 시호크스는 이런 식으로 혼선을 줘도 큰 플레이를 할 공간을 내주지 않는 팀인데, 이번 게임에서는 좀 특이하게도 그쪽에 공간을 많이 내줬고 아 공간을 차분하게 잘 전진해갔다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/UTLkFeXYXSM\" title=\"YouTube\"><\/iframe><\/div><p>특히 오라인에서 에이스라고 할 수 있는 레러미 턴실과, 샘 코스미가 부상당한 와중에 시호크스의 막강한 1선수비를 상대로 아주 잘 버텨준게 놀라왔고, 오라인 크리스 폴은 지난 경기에 이어서 이번 경기에서도 꽤나 좋은 모습을 보여서 '호오 뭐지? 지켜봐야하나' 라는 생각이 들게 한다.<\/p><p>하지만 역시 커맨더스 팬 입장에서 가장 인상적이었을 부분은 바로 올해 드래프트 한 신인 라인배커 소니 스타일스이다. 이번 경기 5개의 태클 2개의 패스 차단, 1개의 인터셉션을 기록하며 맹활약했다. 워낙 신체적인 능력이 압도적인 인물이었기에 기대를 받았는데, 이번 시즌 아직 이르지만, 그 압도적 피지컬에 이어서 게임IQ 마저 높다는걸 보여주고 있다. 이전에 세이콴 바클리의 블로킹을 덤프트럭처럼 밀고 지나가서 쌕을 만드는것부터 워~ 싶었는데 이번 경기에서도 펌블을 만들어낼 뿐만 아니라, 시호크스의 러닝백 자다리안 프라이스가 깊게 패스루트를 밟는 플레이에서는 그걸 따라가면서 패스 차단 부문에서도 자신의 피지컬을 활용할 수 있다는 걸 보여주었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/LzZuYZwPuCg\" title=\"YouTube\"><\/iframe><\/div><p>허나 무엇보다 놀라운것은 역시 높은 풋볼 IQ인데, 커맨더스는 그린닷이라고 해서 수비코치로부터 전술을 듣고 그걸 선수들에게 전달하는 수비쪽 쿼터백 포지션을 이제 3경기를 뛴 신인인 쏘니 스타일스에게 맡겼다. 그리고 이번경기 게임의 승패를 확정지은 케인 메드라노의 픽식스도, 경기 후 그의 인터뷰에 따르면 쏘니가 여기 있으라고 했고, 여기 있으니 인터셉션이 왔다 라고 한다. 플레이를 분석해보면 러닝인듯 시호크스가 페이크를 주는 플레이 액션인데, 이런 상황에서 샘다놀드가 돌아 나가면 그쪽으로 리시버들을 대거 흐르게 해서 패스 옵션을 열어주는 플레이이다. 시호크스만의 변주가 살짝 들어간 부분은 밀어주는 쪽의 가장 반대에 있는 타이트엔드가 블로킹을 하는 척하다가 살짝 멈춰서 돌아와서 쿼터백의 안전망 역할을 해준다는 것인데,, 재밌는건 시호크스가 이 플레이를 하는걸 쏘니는 알고 있었고, 충분히 예측하고 있었다는 점이다. 플레이를 보면 러닝인척하다가 플레이액션이 아닌걸 확인하자마자 커맨더스 플레이어들 중 그 누구보다도 빠르게 고개가 샘다놀드를 향해 돌아가는 쏘니를 볼수 있고, 그에 따라 메드라노도 바로 따라붙는걸 보면 그가 풋볼 IQ에서도 어린나이에 상당한 수준에 올라와있는 것을 느낄 수 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ZEqqtcElE14\" title=\"YouTube\"><\/iframe><\/div>","401872956":"<p>비가 오는 경기속에서 약팀 간의 대결인 자이언츠와 타이탄스의 대결은 자이언츠의 승리로 끝나면서, 한때 리그 최고의 유망주였으나 그 실력만큼 성장하지 못한 15년 1번픽 제이미스 윈스턴은 자이언츠에서, 2번픽 마커스 마리오타는 커맨더스에서 1승씩 챙긴 한주가 되었다.<\/p><p>타이탄스 입장에서는 쉽지 않은 한 해가 될 것으로 보인다. 로버트 살라를 감독으로 데리고 올때 가장 걱정이 되었던 점은 수비코치 출신으로서 공격쪽 역량이 부재하지 않을까였다. 심지어 이팀에 베테랑 쿼터백이 아니라 어린 1번픽 캠워드가 있어서 이 선수의 발전이 무엇보다 중요한 부분이라 걱정이 되었던건데, 로버트 살라는 이를 수행하기 위해 자이언츠 감독이었던 브라이언 다볼을 데리고 왔다. 참고로 브라이언 다볼은 원석형이던 조쉬알렌을 지금의 조쉬알렌으로 다듬은 공로자로 뽑히는데, 자이언츠에서의 처참한 실패와 지금 이 추세대로 캠워드의 발전 마저 실패하게 되면, 사실 조쉬알렌의 성장은 조쉬알렌의 스스로 덕분이라는 것에 대한 확신이 생길 것 같다. 물론 날씨가 안좋고 리시버들 쪽에서도 드랍이 꽤 나왔다는 점을 감안해야하지만, 캠 워드는 여전히 루키들이 할 실수들을 저지르고 있고, 정확도에서도 흔들리고 있다. 그렇다고 공격전술이 그를 위해 플레이를 여는 상황에서 나오는 것도 아니고, 그의 단점들을 최대한 감추는 소극적인 상황(9야드 이하의 패스가 무려 83.3%)에서 나오는 결과물들이라 좀 우려 되는 부분들이 있다.<\/p><p>반면 자이언츠 입장에서는, 1주차의 모든 기대감이 사라진 상황에서 터치다운 하나 없이도 꾸역승을 한 것은 기분 좋을 것이다. 어쨋든 승은 승이기 때문인데, 이번 게임에서 확실히 느낄 수 있던 것은 런게임이 없지는 않구나이다. 쿼터백의 부상으로 수비 입장에서 패스게임에 신경을 덜 쓰고(거기다가 비까지 오는) 상황에서 러닝밖에 옵션이 없는걸 뻔히 알텐데 시도당 4야드에 성공률 51.9%의 평균 정도 성적을 거뒀다는 것은 답이 없는 팀은 아니구나 하는 생각이 들었다. 하지만 자이언츠는 이 경기 내용보다는 이번 주중에 바이킹스로부터 JJ 맥카시를 트레이드해 온 사실이 훨씬 더 중요할 수 있다. 바이킹스에서 미래라고 해서 1라운드에 드래프트 했던 JJ 맥카시 (샘다놀드를 버리고 선택...)는 결국 팀에서 버림을 받고 자신이 대학시절 우승할 때 모셨던 감독(현재 차저스의 감독 짐하버)의 형인 존 하버가 이끄는 뉴욕 자이언츠로 오게 된건데, 스타일 상 잭슨 다트와 상당히 유사하다(민첩함과 움직임이 좋은 기동력 있는 쿼터백) 뿐만 아니라 나이도, 키도 체중도 동일한데, 잭슨 다트의 빈자리를 크게 느끼는 자이언츠 입장에서 이번 시즌을 살리기 위해서 좋은 선택일 수 있다. 다만, 쿼터백이 2명인 팀은 쿼터백이 없는것과 같다 라는 명언이 있는데... 애매모호한 동갑의 쿼터백 2명을 들이는 결과가 장기적으로 좋을지는 두고 봐야할듯하다.<\/p>","401872957":"<p>올해 AFC의 가장 강한 다크호스중 하나로 뽑혔던 재규어스와 전년도 슈퍼볼에 진출한 뉴잉글랜드 페이트리어츠 간의 대결이었는데, 슈퍼볼 패배 이후에 계속해서 졸전을 거듭하며 폼이 안좋던 페이트리어를 재규어스가 그야말로 두들겨 패며 승리를 거뒀다.<\/p><p>페이트리어츠 팬 입장에서 가장 걱정이 되고 속상한 것은 드레이크 메이의 졸전일 것이다. 계속해서 강팀들을 만나면 폼이 급격하게 떨어지는 모습을 보인 메이가 이번 게임에서는 최악의 모습을 보이면서 경기 극 후반부에는 교체 되는 지경까지 이르렀다. 왜 이렇게까지 폼이 떨어진걸까가 궁금해서 보는데, 몇가지 문제들이 종합적으로 영향을 끼치는 것으로 보인다. 우선 가장 큰 것은 팀 자체의 로스터 즉 선수진의 재능 부족이다. AJ 브라운이 부상 당한 시점에 페이트리어츠의 리시버진보다 부족한 리시버진을 가지고 있는 팀은 한손에 꼽힐 것이다. 로미오 돕스 정도를 제외하면 이름을 댈 수 있는 사람도 많이 없을것인데 그 로미오 돕스 조차도 중거리지역의 안과 밖으로 꺽는 루트에 굉장히 큰 장점을 가진 인물이지, AJ 브라운이 부상을 당한 상황에서 필드를 종으로 벌리는 역할을 수행할 때는 부족함이 많은 선수이다. 거기다가 오라인도 최약체 중 하나이다. 이번 게임에서 주전 라이트 태클인 모세스는 상대에게 그야말로 영혼까지 털렸는데, 얼마나 털렸으면 게임을 끝까지 마치지도 못하고 교체가 되서 나와야했다.<\/p><p>여기에 메이의 이슈가 있다. 메이를 보다보면 대부분의 플레이들은 괜찮다. 그러나 문제가 되는 몇몇 플레이들에서 경기의 승패를 바꿔버릴 정도의 어처구니 없는 실수들을 하는 것이 문제가 되는데, 좀 더 깊이 파보니 대부분 패스하기까지 시간이 좀 있는 플레이들에서 실수가 굉장히 커진다(실제로 찾아보니 패스까지 2.5초 이하로 걸리는 패스들은 TOP10 안에 들어가는 성적을 거두고 있다.) 그 말인 즉슨, 선수들의 정렬과 포메이션을 보고 정답을 미리 예상할 수 있는 패스들에서는 확실한 의사결정을 보이고 있는데, 그렇지 않고 수비가 예상과 다르게 움직이거나 좁은 공간으로 패스를 찔러넣어야하는 순간들이 오면 폼이 급격하게 떨어진다는 것인데, 전년도에 상대적으로 전력이 떨어지는 팀들을 상대로는 이런 상황에서도 성공할 수 있었지만, 최근처럼 강팀들을 연속으로 상대할 때는 이 부분에서 필승을 장담하기 어려운것이다. 안타까운 점은 이게 갈 수록 심해진다고 체감이 되는 것인데, 자신의 판단과 의사결정에 대해서 스스로도 의구심이 생기는게 아닐까 하는 걱정이 된다.<\/p><p>그리고 이에 큰 도움이 안되는 것이 바로 조쉬 맥다니엘스 공격코치의 전술이다. 조쉬 맥다니엘스의 공격 전술 스타일은 섀너핸 계열과는 사뭇 다르다. 다른 팟캐스트에 나가서도 설명을 했었지만, 산을 오른다 라는 목표가 있다고 치면 섀너핸 계열은 그 산에 있을 위험성들을 최대한 예측하고 그 위험성들을 파훼할 등산로를 설계해서 쿼터백에게 주는 느낌이라면, 조쉬 맥다니엘스의 공격 코칭 방법은 산에서 마주할 모든 위험성들을 예측해서 그 위험성들을 타개할 전술적 툴들을 제공해서 쿼터백이 산을 오르면서 그 툴을 활용해 위험들을 타개하게 하는 형태에 가깝다. 각각의 전술은 장단이 분명한데, 전자가 쿼터백 친화적인 좀더 분명한 길을 제공해주지만, 예상치 못한 장애물(수비의 전술 변화 등등)이 나왔을 때 대응이 어렵고, 후자는 쿼터백이 배우기는 굉장히 어렵지만 툴박스에 파훼법들이 차곡차곡 쌓일 수록 어떤 수비가 와도 대응이 가능해진다. 문제는, 어린 쿼터백 드레이크 메이(메이는 애초에 드래프트 될 때부터 완성형 혹은 프로 준비완료 라고 보기보단 원석형으로 분류되었다.)는 성장이 더 필요하기 때문에 툴박스에 파훼법들이 한참 부족하다. 그렇다보니 여러 복합적인 수비의 움직임에 대해 아 이게 맞나? 이건가? 이거였나? 하고 주저함이 더 증폭되는 경향이 있는것 아닐까 싶다. 특히나, 전년도에는 답을 다 잘 찾았던것 같은데 올해는 왜 하나도 안맞지?  전년도 나의 성장이 잘못되었나? 에 대한 우려도 겹치지 않을까 싶다.<\/p><p>반면 과거에 방황하던 역대급 재능의 쿼터백 트레버 로렌스는 엄청난 퍼포먼스를 보이고 있다. 현재 리그의 탑급 쿼터백 퍼포먼스를 보이고 있는데, 순간적인 포켓의 움직임, 본인이 발로 해결할 수 있는 능력, 거기다가 찰나의 빈공간에 빨랫줄처럼 꽂아들어가는 패스들을 보면 입이 쩍벌어진다. 트레버 로렌스가 한창 헤맬 때 그에 대한 비판 중 하나는 드래프트 전의 인터뷰를 참조하면서 풋볼에 대한 열정이 부족한거 아냐? 라는의문이 있었는데 지금 기세를 보면 전혀 다른사람이었거나 아니면 인터뷰가 거짓이었다라는 생각이 든다. 지금은 거의 사자의 심장으로 수비가 쇄도해 들어올 때도, 수비 3명이 있어도 그 사이 틈새로 찔러넣는 등 어마무시한데, 아니 내가 1라운드 1번픽에 역대급 재능으로 평가받았는데, 너희들이 나를 개무시해? 라는 분노를 표출하는 듯한 과감함 밖에 없다(물론 이런 과감한 플레이가 외줄타기라 무섭긴한데, 뭐 쿼터백 자체가 다 그런 것...) 작년에 훌륭한 공격코치라고 평가받던 리암 코엔 감독이 와서 리암코엔이 사이드라인에서 뭘 막 지시했는데 아 됐어 저리가 하고 손사래를 치고는 빅플레이를 만든 장면이 생각나는데... 어쩌면 그때 그의 안에서 뭔가 깨어나서 이 대분노에 따른 폼 상승의 시작이었나 하는 생각이 든다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/7PoU5LDrIjc\" title=\"YouTube\"><\/iframe><\/div><p>그리고 이렇게 날아오르게 되는 데 가장 중요한 역할을 하는 사람을 2명 뽑을 수 있는데 첫째는 바로 파커 워싱턴이다. 자코비 마이어스, 브라이언 토마스 주니어 등등 호시탐탐 팀의 1번리시버를 노리는 인물들이 많았던 재규어스에서 갑자기 나타나면서 1번자리를 꿰찬 인물인데, 25시즌 전까지 500야드도 못넘겨본 인물이 전년도 900야드 가까이 기록하더니 지금은 팀의 에이스라 해도 무방하다 (현재 야드 15위 터치다운 12위). 특히나 그가 필드의 내곽 중장거리에서 보이는 루트 러닝은 이팀의 밥줄이라고 해도 될 정도인데, 이번 경기에서도 주요한 순간에 캐치를 해줬고 (본인이 터치다운도 기록), 팀원의 터치다운에서는 수비들이 대놓고 그에게 2:1을 붙이느라 그 밑공간이 비는 미끼역할 까지 수행했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/lhbsZbdRyCE\" title=\"YouTube\"><\/iframe><\/div><p>그리고 또 하나의 인물은 역시나 리암 코엔 감독이다. 카일 섀너핸 - 션 멕베이 - 케빈 오코넬 - 벤존슨 을 잇는 리그의 대표적인 공격코치 출신 스타 감독의 반열에 오르기 직전이라고 해도 무방하다. 이번 게임에서도 전술로서 수비를 농락했는데, 타이트엔드를 풀백의 자리에 놓는 변수를 줘놓고 그를 오라인 가운데를 갈라서 밖으로 빠지게 한다. 그 다음에 그 뒤로 리시버 한명을 빈자리를 파고 들게 해서 수비를 양각에 빠지는 플레이를 연출하는데, 이런 세세한 디테일이 참으로 훌륭하다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/q18bc6Td_LE\" title=\"YouTube\"><\/iframe><\/div><p>하지만 특히나 인상적인 것은 러닝의 성적이다. 카일 섀너핸 - 벤존슨 급의 레벨에서 0.5단계 정도 리암코엔을 낮게 봤던 이유 중 하나는 전년도 후반기에 러닝 성적이 급감했기 때문이다. 하지만 이번 시즌에는 전년도 전반기보다 더 폭발적인 러닝성적을 보여주고 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>러닝 시도당 야드<\/th><th>러닝플레이 성공률<\/th><th>러닝 플레이당 EPA<\/th><th>빅플레이 비율<\/th><\/tr><\/thead><tbody><tr><td>25시즌 전반기<\/td><td>4.52 (12위)<\/td><td>48.5% (2위)<\/td><td>+0.097 (3위)<\/td><td>8.2% (26위)<\/td><\/tr><tr><td>25시즌 후반기<\/td><td>3.39 (31위)<\/td><td>33.6% (31위)<\/td><td>-0.170 (30위)<\/td><td>7.8% (23위)<\/td><\/tr><tr><td>26시즌<\/td><td>4.36 (10위)<\/td><td>50.6% (2위)<\/td><td>+0.088 (2위)<\/td><td>11.1% (11위)<\/td><\/tr><\/tbody><\/table><\/div><p>심지어 지금 잭슨빌 재규어스의 오라인과 러닝백 진영에서는 스타라고 할 수 있는 선수도 없는데 이러고 있다는 것은 더욱 더 인상적이다. 메인 러닝백인 투튼은 4라운드에 뽑힌 인물이고, 오라인도 6라운드, 3라운드, 3라운드, 2라운드, 1라운드 드래프트로스타가 아니다. 그 중에 로버트 헤인지는 리암 코엔이 버커니어스에서 재규어스로 팀을 옮길 때 데리고 온 센터 포지션의 오라인인데, 중심을 잘잡아주면서 훌륭한 러닝을 견인하고 있다. 개인적으로 재규어스의 왼쪽 오라인이 이번 시즌 러닝게임에서 상당히 잘하고 있으니 다음에 볼 기회가 있으면 이쪽을 보는것도 재밌을 것이다.<\/p>","401872958":"<p>디비전 라이벌인 49ERS와 카디널스의 게임이었는데, 49ERS가 승리를 추가하면서 디비전 1위로 올라서게 되었다.<\/p><p>카디널스 입장에서는 신임 감독과 함께 어느정도 리빌딩 단계에 있는거라고 여겨지고 있는 본인들의 팀이 현재 리그 최고의 강팀 중 하나로 보이는 49ERS와 대등한 게임을 펼쳤다는 것에서 꽤나 기쁘지 않을까 싶다. 특히나, 르푸어 감독(패커스의 맷르푸어 감독의 형제)이 공격을 안정적으로 잘 운영하네 라는 생각이 드는 아주 단단한 공격력이었다. 러닝을 기반으로 하되, 실수를 최소한으로 줄여서 이번 게임 시간 점유율이 무려 40분에 이를 정도로, 아주 기본기에 충실한 공격이었다. 수비 입장에서 49ERS, 브락퍼디를 막지 못한것이 패배의 가장 큰 원인이지만 공격이 제 기능을 하는 것은 꽤나 긍정적이게 볼만하다. 번외로, 마빈 해리슨 주니어(대학에서 프로 올때 10년에 한번 나올 리시버라는 평가까지 듣던 재능)의 활용도는 아직까지도 찾지 못한듯하다.<\/p><p>49ERS는 리그 최고의 공격력을 또 한번 보여주었다. 특히 브락퍼디 - 카일 섀너핸 조합은 현시점 가장 강력한 파괴력을 가진 조합이다. 브락퍼디는 현재 리그가 끝난다면 이번 시즌 리그 MVP를 넘어 NFL 역사에서 손꼽히는 3주를 보내고 있다. 시도당 EPA 1위, 패스 성공률 72.3% 2위, 시도당 야드 9.51야드 2위, 인터셉션 1개, 터치다운 9개 1위 야드 789 6위, 100점 만점의 QBR은 93.8점 등등 현재 가장 압도적인 모습을 보이는 쿼터백인데, 경기를 보다보면, 카일 섀너핸과 정말 완벽하게 싱크가 맞은채로 필드를 바라보고 수비를 공략하고 있다라는 생각을 느끼게 한다. 리그에서 가장 빠른 타이밍에 공을 던지는 쿼터백 중하나이면서도 2.5초이하의 패스들이 시도 당 11야드라는 정신나간 스탯이 이를 반영하는데, 전성기의 투아 - 마이크 맥다니엘에게서 느끼는 향기와 비슷하다. 코치가 전술을 기가막히게 짜주고, 쿼터백이 그 전술의 의중과 주요포인트를 잘 읽어서 우리 동료가 공을 받은 뒤에 달리기 좋게끔하는 정확도까지 3박자가 모두 갖춰져야지만 나오는 결과물인데, 현재 브락퍼디는 여기다가 본인의 기동력까지도 갖추고 있는게 투아와의 가장 큰 차이이다. 포켓안에서의 기민한 움직임부터 카일 섀너핸이 짜준 플레이가 어그려졌을 때 자신의 다리로 게임을 해결하는 그야말로 섀너핸이 꿈에 그리던 쿼터백이 그이다. 이번 경기에서도 반칙으로 무마되긴 했지만 자기혼자 필드를 질주해서 터치다운을 기록하기도 했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/03J-RILqgV4\" title=\"YouTube\"><\/iframe><\/div><p>섀너핸도 최근에 션 맥배이, 벤존슨, 리암코엔등 여러 공격코치들이 공격 전술 중 1황인 그에게 도전장을 내밀고 있는 상황에서 이번 시즌 왜 자신이 여전히 1황인지 보여주고 있다. 카일 유스첵, 크리스챤 맥캐프리 같은 리시빙도 되는 러닝백들을 백필드에서 조금씩 벌리면서 중앙에 공간을 창출하는 걸 보면 와... 하고 입이 벌어질 정도이다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/XAxGtH87DlI\" title=\"YouTube\"><\/iframe><\/div><p>다만, 49ERS의 입장에서 가장 걱정스러운 점은 역시나 부상이다. 지난 몇년간 자신들의 발목을 꾸준히 잡아오던 이슈인데, 그들의 스타들은 거기서 한해 더 늙은채로 올해를 맞이했고 벌써부터 팀에 부상들이 쌓이고 있다. 닉 보사는 부상으로 이번 경기 결장하였고 이를 수비쪽에서 분명하게 느낄 수 있었다. 1 주차에 올해 49ERS에서 닉 보사의 가장 큰 가치는 패스 쇄도가 아닌 러닝 수비라고 했었는데, 그가 빠진 상황에서 카디널스의 러닝을 상대로 49ERS는 아무것도 할 수 없었다. 거기다가 공격쪽에서도 부상이 쌓이고 있다. 마이크 에반스, 트렌트 윌리엄스 등 팀의 핵심 선수들이 줄줄이 이번 경기중에 부상으로 나갔고, 특히나 오라인 (레프트 태클) 트렌트 윌리엄스 있고 없고가 브락퍼디의 성적에 굉장히 큰 영향을 끼쳤기 때문에 이 부분은 집중적으로 봐둘 필요가 있다.<\/p>","401872959":"<p>공격을 좋아하는 팬들에게는 굉장히 보기 힘든 경기 였을 것이다. 양 팀은 둘이 합산해서 32개의 써드다운이 있었는데 각각 2개씩 해서 단 4개의 갱신만을 성공했다. 미네소타 바이킹스는 13.3%, 템파베이 버커니어스는 11.7%에 불과한 수치였다. 심지어 맑은 날씨에서 이 정도의 극악의 공격 효율을 본지는 진짜 오랜만인데,두 팀의 쿼터백이 1라운드 1번픽에 같은 대학 출신으로 연년생, 2년 연속 교대로 하이즈먼 상(대학 최우수선수상)을 수상한 선수라는 것이 그 아이러니함을 더한다.<\/p><p>버커니어스 입장에서는 안 그래도 팀의 폼이 떨어지고 있던 와중에 브라이언 플로레스라는 트럭을 만나서 치였다 정도로 볼 수 있다. 베이커 메이필드는 이번 경기 최선을 다했지만, 아무것도 할 수 없었다. 이번 경기 6개의 쌕에 12번이 넘는 쿼터백 히트를 내줬는데, 이전 경기에들에서도 7개의 쌕을 내준 걸 생각하면 팀의 가장 큰 강점 중 하나여야할 오라인에서 제대로 된 역할을 수행하지 못하고 있다고 볼 수 있다. 거기다가 공을 받는 선수들측, 즉 무기들의 퍼포먼스도 하향세다. 팀에서 가장 폭발력이 좋은 선수는 러닝백 버키 어빙인데, 그는 펌블부터 단순한 패스 실수라던가 기본적인 실수들이 좀 있는 편이라 팀의 안정성을 떨어뜨리고 있다. 거기에 베이커 메이필드가 경기 막판 손 부상으로 빠지면서(다행히 골절은 아니라고한다) 2~4주결장 예상인데, 앞으로 베이커 메이필드는 리암코엔이 있던 영광의 시절보다는 브라운스시절의 메이필드에 더 가까운 모습을 보게 되지 않을까 싶다.<\/p><p>버커니어스가 이렇게까지 졸전을 펼친데는 바이킹스의 수비코치 브라이언 플로렌스의 공이 가장 크다. 수비코치중에 가장 압도적인 퍼포먼스를 벌이고 있는 인물 중 하나인데, 바이킹스 감독 케빈 오코넬이 명감독이고 쿼터백 위스퍼러 라는데.. 아 그건 모르겠고 바이킹스 본체는 브라이언 플로레스의 미친 수비 아니냐? 라는 생각이 들 정도다. 에릭 윌슨, 제일런 레드먼드, 아이번 페이스 등등 다른 곳에서 큰 두각을 드러내지 못한 선수들이 그의 밑에서 맹활약하고 있다. 팀 스탯을 보면 각종 지표에서 압도적인 성적을 거두고 있는데, 이번 경기에서 역시 그 포스를 보여주었다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>실점<\/th><th>허용야드<\/th><th>플레이당 허용 EPA<\/th><th>써드다운 방어율<\/th><th>레드존 방어율<\/th><th>턴오버<\/th><\/tr><\/thead><tbody><tr><td>미네소타 바이킹스<\/td><td>2위<\/td><td>12위<\/td><td>1위<\/td><td>1위<\/td><td>1위<\/td><td>공동 3위<\/td><\/tr><\/tbody><\/table><\/div><p>브라이언 플로레스의 바이킹스 수비는 현재 다른 팀들의 수비와는 좀 다르다. 통상적으로 최근 수비 전술가들의 특징은 상대 공격의 1옵션을 지우고, 차근차근 2옵션 3옵션씩 지워나가면서 상대가 결국 아무것도 못하게 만든다는 것이다. 특히나 작년에 슈퍼볼을 우승시킨 리그 제일의 수비 전략가 중 하나인 마이크 맥도널드를 보면 우선 최후방에 선수들을 배치하면서 상대의 빅패스를 차단하고는 뒤에서부터 차근차근 상대의 공격 옵션들을 없애나가면서 상대가 결국은 아무것도 못하게 한다. 그런데 브라이언 플로레스는 '해봐 해보던가' 하고 상대를 시작부터 KO시키겠다는 마음으로 강펀치를 휘두르고 있다. 그게 가장 드러나는 부분이 바로 블리츠율이다. 1선 수비 4명외에 패스를 차단하는 역할을 수행해야할 7명 중 한명을 패스차단을 시키기보다는 패스쇄도를 시키는 걸 블리츠라고 하는데, 공간을 열어주는 대신에 쇄도를 시키는 리스크가 아주 높은 그야말로 강펀치를 휘두르는 전술이다. 브라이언 플로레스는 원래부터 이 블리츠를 굉장히 적극적으로 사용하는 인물인데, 이번 시즌에는 그의 기준으로도 정도가 과할 정도로 하는 것이다. 블리츠율이 72.9%라는건 강심장이라는 표현도 모자라고 사이코패스가 아닌가 싶을 정도로 어마어마한 공격성이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>미네소타 바이킹스 블리츠율<\/th><th>리그 평균 블리츠율<\/th><\/tr><\/thead><tbody><tr><td>23시즌<\/td><td>50.6% (1위)<\/td><td>25.3%<\/td><\/tr><tr><td>24시즌<\/td><td>39.0% (1위)<\/td><td>26.8%<\/td><\/tr><tr><td>25시즌<\/td><td>46.1% (1위)<\/td><td>26.8%<\/td><\/tr><tr><td>26시즌<\/td><td>72.9% (1위)<\/td><td>31.2%<\/td><\/tr><\/tbody><\/table><\/div><p>그러면 어떻게 하는 것일까? 바이킹스가 가장 많이 쓰는 전술 컨셉에 대해 보자. 기본적으로 최후방에 2명을 두고 외곽에 코너백을 한명씩 둔 전술을 짠다, 그리고 앞에 7명의 선수를 두는데 그 중에 4명은 라인배커 혹은 니켈백으로 구성한다. 그리고 이 최후방 2명 중 한명 그리고 코너백, 그리고 앞의 라인배커/니켁백 중 한명이 삼각형을 구성해 리시버들을 공간에 가두면서 패스길을 차단한다. 그리고 그 외의 5인은 패스쇄도를 한다. 문제는 아까 라인배커/니켈백 중에 누가 패스를 차단할지 쇄도를 할지를 끊임없이 바꿔가며 진행한다는 것이다. 그러다보니 영상의 두번째 플레이에서 보듯이 쿼터백 입장에서 저 공간이 비어있다고 생각을 하는데, 실제로는 쇄도하는 척하다가 빠진 선수가 그 공간을 막아 순간적으로 차단을 만들어낸다. 또 이 전술의 진짜 강점 중 하나는 블리츠를 하는 와중에도 최후방에 2명을 계속 유지한다는 것이다. 그러다보니 깊게 파고드는 선수를 2선 수비 두명이 좌우로 막던가, 라인배커/니켈벡 - 세이프티 두명이 앞뒤로 막으면서 빅플레이를 허용하지 않는다는 점이다. 이런 기본적인 컨셉에서 브라이언 플로레스가 인터뷰에서도 밝히듯이 자신이 가장 신경 쓰는 부분은 바로 쇄도의 경향성을 없애는 것이다. 즉, 상대가 러닝백을 우측에 놓으면, 타이트엔드와 러닝백을 반대로 놓는등, 상대의 여러 포메이션에 대해 아군의 대응 앞에 라인배커/니켈백 중에 누가 쇄도를 할 것인가, 쇄도를 하게 되면 선수들이 정방향으로 쇄도를 할 것인가 몇 명은 안으로 파게들게 하고 몇 명은 엇박으로 돌아나가게 할 것인가, 몇 명은 강하게 쇄도할거고 몇 명은 쿼터백의 짧은 패스를 쳐내는 위주로 갈 것인가와 같은 경향성이 있을 것인데, 이 경향성을 상대가 파악하지 못하게 하겠다는 것이다. 전주, 전전주 테이프를 보면서 아 우리가 여기서 이걸 더 했네. 이번엔 반대로 하자 이런식으로 경향성을 지우고, 거기다가 매우 높은 확률로 5명만 쇄도를 시키는게 아니라, 삼각형을 하나 희생한다고 해도 6명을 쇄도 시켜서, 상대 쿼터백의 긴장도를 급증시키는 변화구도 섞어 쓴다. 이러다보니 상대하는 쿼터백 입장에서는 와 도대체 뭐가 올지에 대해 전혀 짐작조차 하지 못하는 상황이 계속 되고, 그러다보니 블로킹을 해줄 선수들을 실제로 쇄도하는 상대 선수들보다 더 넣을 수 밖에 없고, 그러면 패스를 받는 쪽에서는 리시버 - 2선수비쪽에서 수적 열세가 생기고, 그렇다고 쇄도를 또 막지는 못하고.. 쿼터백은 데미지가 계속 쌓이게 되면서 상대방의 게임이 터지게 된다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/B8aR_rqjhF8\" title=\"YouTube\"><\/iframe><\/div><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>3명 이하 쇄도 비중<\/th><th>4명 쇄도 비중<\/th><th>5명 쇄도 비중<\/th><th>6명 쇄도 비중<\/th><th>7명 이상 쇄도 비중<\/th><\/tr><\/thead><tbody><tr><td>미네소타 바이킹스<\/td><td>3.6%<\/td><td>22.4%<\/td><td>47.8%<\/td><td>18.8%<\/td><td>3.6%<\/td><\/tr><\/tbody><\/table><\/div><p>추가적으로 바이킹스의 공격도 이야기를 좀 해야하는데, 폼이 정말 좋지 않았다. 카일러 머리가 이 시스템에서 정식으로 뛴 2번째 경기이자, 컨커션 이후에 첫 경기라는 점도 감안을 해야하지만, 그럼에도 불구하고 좋지 않았다. 카일러 머리는 경기 내내 시스템에 적응을 못했다는 듯 패스에 계속해서 주저주저하면서 던지지 못하는 모습이 지속적으로 나왔고, 그의 치명적인 단점인 작은 키로 인해 수비의 손에 공이 걸리거나, 스크린이 실패하는등 한계가 보였다. 특히나, 바이킹스의 공격이 포켓안에서 상대 수비 공간 중 가운데 (작은 키의 쿼터백의 가장 공략하기 힘든 구역)를 중점으로 공략하는 그 부분이 경기 초반에 막히자, 더욱 더 주저하는게 보였고, 카일러 머리가 편한 포켓 밖으로 빠져나가고 싶어하는 듯한 움직임이 계속 보였다. 여기에 팀의 1번 리시버이자 엔간한 쿼터백은 나쁘지 않은 쿼터백으로 만들어주는 리시버 저스틴 저퍼슨이 부상으로 경기 초반에 빠진 것도 이러한 점에 크게 영향을 끼쳤을 것이다.<\/p>","401872960":"<p>경기에 대한 감상을 말하기전에 필드골 직전에 갔던 레이븐스의 슈퍼플레이에 대해 이야기를 해야한다. 킥오프를 받고 7초만에 필드를 전진하고는 필드골을 만들면서 승리를 해냈는데 페이튼 매닝이 예전에 이러한 상황에 대해 설명했던 걸 본 기억이 있다. 이른바 8초룰이라고 설명했는데 플레이가 시작하면 리시버는 세로로 25야드를 전진해야하고, 그 리시버는 필드골 언저리에서 공을 잡아야하고 쿼터백은 그에 맞게 굉장히 빠른 탄도의 공을 던져야한다. 그리고 공을 잡자마자 리시버는 전진을 포기해야하고 나머지 모든 선수들이 타임아웃을 불러야한다. 이 모든것의 최소 시간으로 잡은게 페이튼 매닝은 8초걸린다고 했는데 라마잭슨과 레이븐스는 순식간에 26야드를 7초만에 전진 했고, 타일러 룹은 56야드 필드골을 성공시키면서 승리를 거뒀다. 경기 끝나고 삼바 축구의 중심인 리우에서 시우~~~~ 하고 세레모니를 레이븐스 선수들이 다같이 하는건 굉장히 감동적이었다. 특히나, 키커인 타일러 룹은 지난 시즌 마지막 경기에서 필드골을 실패해서 감독이 해고되게 되는 계기가 되었는데, 중요한 순간에 정말 빅 플레이를 해줬다. 특히나, 레이븐스가 4쿼터의 역전패를 계속당한다, 마무리를 못짓는다식의 비판이 차곡차곡 쌓이던 상황에서 그걸 끊는 굉장히 큰 플레이였다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/TzrzB4z1w-A\" title=\"YouTube\"><\/iframe><\/div><p>수비 입장에서는 아쉬움이 컸다. 수비가 이상황에서 부른 전술은 4명을 쇄도시키고 최후방에 1명을 두고 그 중거리 지역에 ROBBER라고 짤라먹는 지역수비 한 명을두고 나머지는 맨투맨으로 하는 것이었다. 다만 한명이 안쪽으로 꺾어 들어가는 루트를 타자 수비끼리 자신들의 임무를 바꾸는데, 이 급박한 상황에 임무 바꾸는 플레이를 넣다보니 임무를 새로이어받은 선수가 뒷공간으로 더 빠졌어야하는데 이걸 놓치고 중요한 패스를 허용했다. 근데 애초에 이 상황에서 커버 1이 맞는지도 모르겠다. 늘 생각하는건데 이렇게 짧은 시간에 30야드 가까이 가야하는 상황에서는 블리츠를 더 들어가서 패스할 시간을 뺏어가는게 제일 좋다고 생각하는데... 거기다가 맨투맨도 잘못된 대응이라고 생각한다. 만약에 여기서 리시버를 수비가 터치하지 않는다면 리시버가 일어났다가 스스로 다운이 되어야하기에 1초의 시간을 더 소모할 수도 있었을 것이다. 하지만 맨투맨은 수비의 관습상 자기가 맡은 선수가 캐치를 하면 터치, 다운을 시켜야하기에 더욱 더 큰 실수가 되었다. 물론 카우보이스의 2선 수비진에 부상이 너무 많아서, 이런 상황에 준비가 된 선수들을 넣을 수 없다는 점도 감안은 해야겠지만, 그것또한 사실 경기 준비의 일부이다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/MBXBvKIoijU\" title=\"YouTube\"><\/iframe><\/div><p>근데 이 수비미스를 제외하고도 실수가 꽤 많았다. 일단 이전 공격권에서 엔드존까지 갔음에도 불구하고 필드골만으로 만족한 것도 굉장히 뼈 아프다. 이 팀은 공격이 팀을 캐리해야하는 상황인데, 수비가 비록 패스에서는 라마잭슨을 막지 못했지만, 그 데릭헨리를 시도당 3.4야드로 막았다. 물론 터치다운을 2개 허용했지만, 그 누구의 런도 막지 못했던 카우보이스의 런 디펜스가 리그 최고의 러닝백 중 하나를 꽤나 막았다고 할 수 있다. 특히나 그 카우보이스가 4TH &amp; SHORT에서 두번이나 데릭헨리의 러닝을 막았다면 (심지어 그중 하나는 골라인이었다) 수비는 자신의 역할을 할만큼 했다고 보인다. 특히나 백업으로 들어간 라인배커 바햄의 활약은 정말 눈부셨다. 근데, 공격 쪽에서 이에 부응해주지 못했다. 마지막 공격권에서는 운좋은 오심으로 골라인에 붙었는데도, 폴스스타트 반칙, 쌕 당하는것 등등 나오지말아야할 순간에 나오지 말아야할 부분에서 실수가 나왔다. 또 하나 카우보이스가 믿던 포인트에서 실수가 나온것은 키커 브랜든 오브리 였다. 리그 제일의 키커로 최고 연봉자임에도 불구하고 이번 게임에서는 필드골 하나를 블록킹 당하고, 킥오프에서 두번이나 아웃을 하면서 상대를 좋은 위치에서 시작하게 하는 큰 실수를 저질렀다. 특히 마지막 킥오프는 왜 아웃을 했는지 의문이다. 현재 룰 상 공이 랜딩 구역 안에 떨어지면 무조건 공을 받는측에서 공을 들고 나와야하는데, 이 자체가 시간을 소진하기 때문이다.<\/p><p>자 그럼 게임의 다른 부분을 좀 보자. 레이븐스의 데릭헨리를 위시로 한 러닝은 뜻대로 풀리지 않았다. 이는 오라인에 계속해서 쌓이는 부상때문일 가능성도 배제할 수 없다. 현재 레이븐스는 3번재 후보 센터를 기용하고 있는데 그마저도 부상으로 빠졌다. 하지만 이에 반해 패스는 굉장히 잘 풀렸다. 특히나 데클란 도일 공격코치가 제이 플라워스를 활용하는 전술적 움직임은 굉장히 인상적인데  모션과 포지션 배치를 통해 지속해서 라인배커와 1대1이 되게 한다. 전통적인 맨투맨은 자기가 맡은 선수가 있고, 전통적인 지역수비는 자기가 맡은 지역이 있다. 최근에 NFL에 대세가 되는 매치-존 이라고 해서 맨투맨과 지역수비가 섞인 전술은 내가 밖에서 1번째 리시버를 맡는다, 나는 2번째를 맡는다, 나는 3번째를 맡는다 식으로 선수가 미리 정해진게 아니라, 상대 선수들이 어느 지역에 배치 되느냐에 따라 유기적으로 맨투맨을 하는건데, 이런 전술의 맹점을 기가막히게 파고든다.<\/p><p>카우보이스는 이번 게임에서 나쁘지 않았다. 특히나 러닝에서의 발전이 굉장한 호재이다. 1주차 시도당 3.44야드, 2주차 시도당 2.39야드이던 러싱야드가 이번 게임에서는 시도당 4.96야드까지 올랐고 통합 129러싱야드를 이번 게임에 기록했다. 자본테 윌리엄스는 터치다운을 기록하며 98야드를 찍었는데 이는 그래 이제 몸이 좀 풀리기 시작했구나에 대한 기대감을 갖게 했다. 다만 개인적으로 아직도 이해가 안되는 점은 이 팀이 빅패스(+15야드) 를 시도하지 않는다는 점이다. 이번게임에도 후반전에는 좀 빅패스를 시도하긴 했는데, 많은 부분 짧은 패스만으로 게임을 이어갔다. 양쪽에 씨디램, 조지 피켄스라는 리그에서 둘째가면 서러울 폭발적인 리시버 듀오를 갖고 있고, 정규시즌 패스야드라면 리그에서 5손가락안에 드는 닥 프레스캇이라는 베테랑을 가지고 있음에도 불구하고, 루키 쿼터백에 리시버도 특별한 선수들이 없는 팀이랑 똑같이 경기를 운영하는 것은 이해할 수 없다. 물론, 조금 시동이 걸리는데 시간이 걸리는 걸 수도 있지만 아쉬움은 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th class=\"r\">ADOT (평균 패스 비거리)<\/th><th class=\"r\">15야드 이상 패스 플레이 비중<\/th><\/tr><\/thead><tbody><tr><td>26시즌 3주차<\/td><td class=\"r\">6.80야드 (20위)<\/td><td class=\"r\">12.5% (19위)<\/td><\/tr><tr><td>26시즌 누적<\/td><td class=\"r\">7.86야드 (17위)<\/td><td class=\"r\">12.4% (27위)<\/td><\/tr><\/tbody><\/table><\/div>","401872961":"<p>NFL 에서 득점 외에 가장 중요한 스탯을 하나만 뽑으라하면 바로 턴오버 (상대로부터 공을 뺏어서 공격권을 전환하는것)라고들 하는데 이번 게임만큼 그게 주효했던 적이 없다. 세인츠는 4쿼터에만 4개의 턴오버를 저지르면서 85%였던 4쿼터 시작 승리확률을 내던져버리고 패배를 했다.<\/p><p>사실 세인츠의 경기내용이 나빴다고 하기엔 어렵다.  4쿼터 전까지만 해도 러닝과 패스 양쪽이 다 나쁘지 않았고 플레이당 성공률은 65%, EPA 는 +0.296 수준으로 수치상으로만 보면 리그의 탑 5를 넘는 수준의 좋은 공격력을 펼치고 있었다. 특히 패스가 인상적이었는데, 크리스 올라베는 여전히 위협적이었고, 타이트엔드 주완 존슨 역시나 패스게임의 2번 옵션으로 굉장히 좋은 모습을 보였다. 거기다가 데본 벨레는 장신의 키를 이용한 2번 리시버로서 어려울때 잡아주는 안전망 역할을 톡톡히 해주었다. 타일러 슉의 성장도 눈에 띄지만, 켈렌 무어 감독이 이글스에서 공격코치로 슈퍼볼을 우승할 때 기본에 충실한 러닝게임에 집중을 해서 러닝게임에 집중을 할 줄 알았는데, 패스에 훨씬 더 치중한 모습을 보이고 있고 그게 아주 유효한 모습이 나오고 있다.<\/p><p>허나 모든것이 무너졌던 것은 4쿼터였다. 레이더스의 수비는 4쿼터부터 본격적으로 시동을 키기 시작했는데, 말콤 쿤스는 거의 혼자 힘을 게임을 찢어버렸다고 할 정도로 승리에 가장 중요한 역할을 했다. 지난주, 세인츠가 패싱게임에 기대는 만큼, 켈빈 뱅크스의 부상에 따른 결장이 걱정된다고 했는데, 그의 부상에 따라 나온 아심 리처즈를 완벽히 농락하면서 게임을 지배해버렸다. 4쿼터 13분즘에 쌕을 하고 그걸 펌블로 이어나갔을 뿐만 아니라, 4쿼터 8분 즘에는 필수적인 압박을 만들면서 인터셉트를 유도했고 그 인터셉션이 터치다운으로 이어졌다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/z6zcZteKlVQ\" title=\"YouTube\"><\/iframe><\/div><p>그야말로 레이더스 수비의 승리라고 할 수 있는데, 맥스 크로스비라는 슈퍼스타 원맨팀에서 나코비 딘이라는 준수한 라인배커가 합류하고 롭 레너드라는 수비코치까지 붙으면서 꽤나 임팩트를 낼만한 수비로 변한게 아닐까 싶다. 위에 말한 마지막 쌕 인터셉션이 일어난 이유도 플레이를 앞두고 수비는 최후에 수비수 한명을 두고 2선 수비수들을 리시버에 바짝 붙인 커버 1의 맨투맨 전술로 도열을 한다. 그리고 스냅이 되고 플레이가 시작하게 되면 중간에 세이프티가 뒤로 물러나면서 최후방에 2명인 커버2에 지역수비로 전환을 하게 된다. 그리고 그러다보니 왼쪽 패스를 하고 싶었던 타일러 슉의 템포를 완전 어그러뜨리고 한번 더 필드를 보게 하다보니 1선 수비가 쇄도할 시간을 줬고 그렇게 크게 당했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/KtsSe3UBVME\" title=\"YouTube\"><\/iframe><\/div><p>공격쪽에서도, 이번 게임이야말로 클린트 큐비악이 시애틀에서 하던걸 그대로 가동한 첫게임이 아닐까 싶다. 그 시작은 바로 브락바워스이다. 브락 바워스는 이번 부상복귀전에서 10개의 캐치, 116야드, 1터치다운이라는 엄청난 맹활약을 하면서 왜 본인이 리그 최고의 타이트엔드 대열에 이름이 들어가야하는가를 보여줬는데, 재밌는 것은 브락바워스의 이 폭발적인 패스게임에서의 활약을 극대화하기 위해 그를 타이트엔드가 아니리 리시버 포지션에서 계속 뛰게 했다는것이다. 실제로 이번 게임에서 그는 필드의 중앙이 아닌 외곽에서 자주 뛰었고, 정식 타이트엔드 역할은 마이클 메이어 (23년 2라운드픽)가 수행했다. 이번 게임 레이더스의 멀티 타이트엔드 비중, 즉 스냅중에 타이트엔드가 2명이상이었던 비중은 무려 81%로  시즌 평균 1위인팀이 56.5% (빌스)인 걸 생각하면 아 그래 브락 바워스는 진짜 리시버로 쓰는구나를 알 수 있다. 그리고 실제 리시버로서의 역량을 보여준다. 아래 플레이는 약간 와 뭐지 싶었는데, 우선 타이트엔드인데 외곽으로 나가서 코너백인 쿨에이드와 1대1을 한다. 처음에 안쪽으로 파고는 움직임 페이크를 주지만 쿨에이드는 꿈쩍을 하지 않는다, 그리고 안되겠다 하고 바깥쪽 어깨를 타겟으로 브락바워스가 갑자기 악셀을 밟는데, 분명히 플레이 시작에 코너백이 더 뒤에 있었고 안쪽 페이크까지 실패했음에도 가속이 얼마나 빠른지 코너백을 상대로 금새 평행하게 위치하고 심지어 외곽으로 거리까지 벌린다. (쿨에이드는 180cm 에 90kg고 브락바워스는 193cm에 107kg이다...) 그리고 나서는 뒤를 돌아서 패스를 보고 달리다가 자신의 속도를 조절해서 몸을 돌려서 넘어지는 와중에 캐치를 해낸다...<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/k4ehd0oh1zw\" title=\"YouTube\"><\/iframe><\/div><p>이번 게임이 시애틀 시절의 큐비악 스러웠다라고 말하고싶은 점은 이런 브락 바워스 + 러닝을 중심으로만 게임을 펼쳤다 해도 무방할정도의 집중도이다. 지난 해 시호크스는 러닝으로 빅플레이를 만들지 않아도 꾸준히 러닝을 하면서 (여기서 멀티타이트엔드를 많이 썼다) 그렇게 수비를 낚아놓고 자신들의 에이스 (JSN)을 중심으로 패스 플레이를 펼쳤다. 많은 팀들이 고르게고르게 공을 뿌려가는 공격, 수비에서 열어주는 옵션을 택할 때, 어쩌면 라이언스 스러운 어 그런거 없어 우리는 에이스가 이겨줄거야 를 쓴건데, 그거와 똑같은 컬러로 게임을 펼쳤다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>러닝 비중<\/th><th>러닝 시도당 야드<\/th><th>러닝 플레이 성공률<\/th><th>JSN 타겟 팀내 비중<\/th><\/tr><\/thead><tbody><tr><td>25시즌 시애틀 시호크스<\/td><td>47.8% (1위)<\/td><td>4.25 (18위)<\/td><td>39.8% (24위)<\/td><td>35% - 2위와 2배 이상<\/td><\/tr><tr><td>26시즌 3주차 레이더스<\/td><td>38.1%<\/td><td>4.58<\/td><td>29.2%<\/td><td>42% - 2위와 3ㅐ비 이상 차이<\/td><\/tr><\/tbody><\/table><\/div><p>자 그러면 가장 진한 고민은 3승 0패의 레이더스는 강팀인가 에 대한 고민이다. 종합해서 봤을 때 강팀이라고 하기엔 어렵다. 스케줄이 리그 최약체 로스터 중 하나라는 마이애미, 모든게 고장나고 있는 차저스, 그리고 뉴올리언스 상대로 4쿼터 신승 의 결과로 3승 0패를 기록하는건데, 이만으로 리그의 패권을 노릴 강팀이라고 하기엔 아직 좀 더 봐야한다. 하지만, 분명히해야할게 좀 더 봐야할만한 팀이 되었다는 것 자체가 시즌 초의 기대감을 생각하면 압도적으로 좋은 포인트다.<\/p>","401872962":"<p>슈퍼볼에서 만날 수도 있을 강팀간의 대결이었는데, 그만큼 생각보다 굉장히 박빙의 경기였다. 램즈가 전반전이 지나고 16-0으로 앞서면서 자신들의 힘을 뽐냈는데, 덴버브롱코스가 두개의 터치다운 그리고 두번의 2포인트 컨버젼을 성공하면서 순식간에 동점을 만들어 게임을 접전으로 끌고 갔고, 결국 마지막에 자신들의 승리를 결정 지었다. 게임에 여러 포인트가 있었는데, 브롱코스의 리시버가 2선 수비에 빙의해서 램즈의 인터셉션을 막은게 오히려 수비측의 반칙으로 불리는 것만 기억에 남을 경기가 되었다. 개인적으로 오심 하나로 패배가 결정되었다면, 애초에 그 경기를 승리할 자격이 없다고 생각한다. 그외 경기내에 수많은 다른 포인트들에서 더 잘할 수 있었으니까. 하지만 그럼에도 역시 경기 극후반부 중요한 승부처에서의 오심은 기억에 오래남는다. 특히나 양팀의 감독인 션 멕베이 - 숀 페이튼은(왜 한명은 션이고 한명은 숀이라 부르고 있지..) 최근 10년 NFL 에서 가장 극악했던 오심의 주인공 들이기 때문이다. 당시에 리그 최고 팀 중 하나이던 세인츠(숀 페이튼 감독)은 플레이오프에서 상대팀인 램즈(션 멕베이 감독)측에서 명백한 수비 반칙이었음에도 불리지 않아서 슈퍼볼 진출이 좌절 되었는데, 이번에는 그 반대의 상황이 나왔다.<\/p><p>반칙은 이제 잊고, 램즈 측에서 중요하게 볼 포인트는 몇 개 있다. 긍정적인 부분은 러닝 게임이 여전히 강하다는 것이다. 13 퍼스널을(러닝백 1명 타이트엔드 3명, 리시버 1명) 38.8%(리그 1위)나 사용하며 러닝 친화적인 전술을 쓰는 상황에서 램즈의 내곽 오라인맨 러닝 블로킹은 리그에서 손꼽히지 않을까 싶다. 내곽 러닝은 정말 강력하다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>야드<\/th><th>시도당야드<\/th><th>성공률<\/th><th>EPA/시도<\/th><\/tr><\/thead><tbody><tr><td>26시즌 3주차 중앙 러싱 성적<\/td><td>57야드<\/td><td>11.4야드<\/td><td>80.0%<\/td><td>+0.696<\/td><\/tr><tr><td>26시즌 중앙 러싱 성적<\/td><td>170야드<\/td><td>6.3야드 (2위)<\/td><td>59.3% (5위)<\/td><td>+0.054 (10위)<\/td><\/tr><\/tbody><\/table><\/div><p>거기다가 드반테 아담스는 여전히 리그의 탑리시버에 이름을 올려야할 퍼포먼스를 보이고 있다. 현재 리시빙 리그 3위를 기록하고 있는데, 매튜 스태포드와 백숄더 페이드라고 하는 1대1 상황에서 수비를 순간적으로 안쪽으로 속이고 바깥으로 움직여서 던지는 패스 플레이는, 애런로저스와 뛰던 전성기 때의 포스를 보이며 이번 경기에 7캐치 137야드라는 성적을 기록했다. 특히나 인상적이었던 것은 이게 리그 최고의 코너백인 패트릭 서테인을 상대로 나온 경기력이라는 점이다. 패트릭 서테인은 과거 인터뷰에서 자신의 WELCOME TO THE NFL 순간이 드반테 아담스에게 당했던 순간이라고 회고를 하던데, 아직까지 극복을 못했나 싶을 정도로 서테인이 당했다. 패트릭 서테인이 게임 중에 이토록 답답해하는걸 정말 오랜만에 보았는데, 궁금해서 좀 더 찾아보니, 패트릭 서테인은 빅패스를 두고 경합한 경우에 20개 중에 단 3개만을 상대에게 내줬는데 이번 게임에서는 드반테 아담스에게 6번의 경우에서 4번을 내줬다.<\/p><p>반면에 우려되는 부분도 있다. 우선, 부상이 계속 쌓이고 있다는 점이다. 수비쪽에서는 이미 마일스 개릿이 부상으로 빠져있고, 2선 수비쪽에서도 이번 시즌에 데리고 온 치프스의 코너백 듀오 중 하나인 제일런 왓슨이 부상을 당했다. 공격쪽에서도 멑티 타이트엔드 전술에서 리시버 역할을 해 테렌스 퍼거슨가 이번 경기에 부상으로 빠졌다. 거기다가 어쩌면 더 큰 포인트는 매튜 스태포드가 압박을 받는 상황, 즉 반드시 패스를 해야만 하는 상황에서 '나이'가 드러난다는 점이다. 이번 게임에서 매튜 스태포드가 압박을 받았던 패스는 18번인데 개중에 5개만을 성공시키고 인터셉션도 나왔다. 이와 연동을 해서 또 램즈를 상대할 때 주의깊게 봐야할 포인트 중 하나는 플레이액션 상황에서 수비가 블리츠를 보내면 이 혼란이 좀 더 가중되는 경우가 있다. 아직 확실히 경향이라고까지 하기는 어렵지만, 지난 해 플레이오프에서 베어스가 굉장히 자주 썼던 전술인데, 플레이 액션(러닝인척 패스)를 하려면 쿼터백이 러닝인척 연기를 하기 위해 수비에게 등을 돌렸다가 다시 필드를 봐야하는데, 이때 수비가 깜짝 나타나면 매튜 스태포드의 압박 민감도가 더 커지는게 아닐까 싶다. 램즈가 의 게임을 볼 때 좀 주의깊게 봐야할 포인트가 될 수도 있다.<\/p><p>물론 그렇다고 램즈가 약팀이라는 것은 아니다. 리그 강팀 중 하나인 것은 여전하다. 에이스인 푸카 나쿠아도 돌아오고, 러닝이 강력해지면 스태포드가 3RD &amp; LONG 즉 반드시 패스해야할만한 상황에 위치할 경우도 훨씬 줄어들 것이다. 다만, 시즌 전의 기대감이 너무 컸다보니 그거에 대한 조정이 조금 필요해보인다.<\/p><p>반면에 브롱코스는 아직 잘 모르겠다. 브롱코스는 수비가 강력한것은 확실하다. 특히나, 엣지려서들에 이어 내곽에서도 압박을 만들기 시작하면 게임을 지배해버릴 수준으로 수비가 강해진다. 이번 경기에서도 말콤 로치와 잭 앨런이 내곽 오라인맨을 제끼고 압박을 만드는 그 순간부터 오라인이 당황하기 시작하고 여기에 브롱코스의 블리츠가 들어오기 시작하면 게임 자체가 찢어진다. 이번 게임에서 그 역할을 한 것은 탈라노아 후팡가였다. 램즈의 모든 오라인을 속이고 외곽에서 깜짝 블리츠를 했을 뿐만 아니라, 인터셉션을 2개나 기록하면서 게임을 터뜨려버렸다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/awwietMxzoc\" title=\"YouTube\"><\/iframe><\/div><p>다만, 공격쪽에서는 잘 모르겠다. 좋은 점들은 분명 있다. 보 닉스는 4쿼터에 또 한번 역전을 해내면서 12번째 4쿼터 역전승을 거뒀다... 그의 커리어가 이제 3년차라는 걸 생각하면 그야말로 이 시대의 컴백키드 라고 불러도 손색이 없는 정도인데, 이렇게 되는 가장 큰 이유는 중요한 순간에 나오는 결정력이다. 이번 게임에서도 마지막 공격권에서 두 번의 빅플레이(39야드, 21야드 전진)로 필드를 한 순간에 전진하였는데, 상대팀의 에이스인 맥더피를 제대로 공략하였다. 첫번째 플레이에서는 맥더피가 자신의 매치 수비를 옆에 있는 선수에게 넘기는 줄 알았는데 이 부분에서 소통 실수가 있었고, 그 틈을 공략했다. 바로 다음 플레이에서는 맥더피가 자기 쪽으로 뛰는 수비를 따라 뛸걸 알았다는 듯이 그 앞 공간으로 패스를 해서 빅플레이를 만들었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/nmzh9dwZnjM\" title=\"YouTube\"><\/iframe><\/div><p>왜 그렇게 경기의 막판에 강한데 시종일관 압도적인 모습은 나오지 않는걸까? 여러 이유를 생각해볼 수 있다. 우선 가장 큰 이유는 상대했던 팀들이 강팀이었다는 것이다. 이번시즌 브롱코스의 상대는 치프스, 재규어스, 램즈 세 팀 다 플레이오프에서 꽤나 강력한 활약이 기대되는 팀들이다. 두 번째로는 가장 긍정적으로 봤을 때 낼 수 있는 가정인데, 보 닉스가 초중반을 상대의 경향성을 체크하는 무대로 활용을 하며 보수적인 접근을 하고 있다는 것이다. 지난시즌 부터 해서 보 닉스의 플레이가 후반전부터 확 피는 것은 이를 반영한 수치일 수 있다. 실제로 26시즌 그의 ADOT와 빅패스가 수치들을 봐보면 좀 더 분명해진다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>ADOT (패스 평균 비거리)<\/th><th>시도당 야드<\/th><th>15+야드 비중<\/th><th>20+야드<\/th><\/tr><\/thead><tbody><tr><td>1~3쿼터<\/td><td>5.69<\/td><td>6.12<\/td><td>11.9%<\/td><td>6.0%<\/td><\/tr><tr><td>4쿼터<\/td><td>6.31<\/td><td>7.50<\/td><td>19.2%<\/td><td>15.4%<\/td><\/tr><\/tbody><\/table><\/div><p>반면 부정적인 점은 러닝의 부진이다. JK 다빈스의 이번게임 러싱 성적은 17번 러닝을 시도해서 49야드 시도당 2.9야드라는 비참한 성적이었고, 가장 길었던 러닝도 6야드에 불과했다. 이번 경기 1st, 2nd 다운에서(즉 러닝을 할 가능성이 높은 다운) 러닝게임의 성공률은 13%에 불과했다. 브롱코스의 오라인이 리그에서 손에 꼽힐정도로 강했다는 걸 생각하면 이해가 안되는 상황이고, 공격의 저점을 높이는데 러닝이 굉장히 큰 역할을 하기에 브롱코스가 플레이오프에서 더 높게 가기 위해서는 반드시 개선해야하는 부분이다. 그리고 소극적인 경기 운영과 다르게 보닉스의 불안정성도 걱정은 된다. 이번 게임에서도 인터셉션이 나와도 이상하지 않을 패스가 몇개는 있었는데, 이 패스들이 인터셉션이 되었다면 경기 결과는 전혀 달랐을 것이다.<\/p>","401872963":"<p>시카고의 감독 벤 존슨 커리어가 어떻게 될지 모르겠지만, 그가 훗날 명전급 감독이 된다면 이번 게임이 그위대한 감독 여정의 시작으로 소개될 것이다. 게임이 들어가기전에 시카고 베어스는 주전 쿼터백, 2번 후보 쿼터백이 부상을 당했고 3번째 쿼터백 케이스 키넘이 선발이었다. 케이스 키넘은 미네소타 미라클을 과거에 했던 인물이지만 커리어 내내 후보를 전전하고 NFL 경기를 뛴지 1000일 가까이 되었었고, 이글스는 리그 최고의 수비코치 중 하나인 빅 팬지오에 전년도 탑5안에 드는 전력의 수비팀이었기에 베어스의 승리를 예상하는 사람은 많이 없었는데, 벤 존슨의 시카고 베어스가 완승을 거뒀다. 그것도 전미가 보는 먼데이나잇 게임에서 27-7, 러닝이 아닌 베테랑 케이스 키넘의 팔을 활용한 승리였다.<\/p><p>베어스의 이번 게임 러닝은 크게 뛰어나지 않았다. 경기결과를 안 듣고, 케이스키넘이 선발인 게임에서 베어스가 러닝을 시도당 3.7야드에 러닝백들이 아무도 터치다운을 하지 못했다는 말만 듣는다면, 베어스가 이겼겠네~ 라고 할 사람은 아무도 없을 것이다. 그럼에도 승리할 수 있었던 것은 베어스의 감독인 벤 존슨의 전술 덕분이다. 물론 러닝이 먹히길 원했겠지만 러닝이 먹히지 않는다고 게임이 터지게 두지 않았다. 오히려 수비가 러닝을 과도하게 신경쓸 것을 파악해서 모션과 플레이액션을 섞으면서 이글스의 라인배커와 세이프티진을 그야말로 농락했는데, 진짜 중요 플레이마다 기가막혔다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>야드<\/th><th>시도당야드<\/th><th>성공률<\/th><th>시도당 EPA<\/th><th>완성률<\/th><\/tr><\/thead><tbody><tr><td>모션<\/td><td>210<\/td><td>10.0<\/td><td>66.7%<\/td><td>+0.541<\/td><td>17/20<\/td><\/tr><tr><td>플레이액션<\/td><td>75<\/td><td>7.50<\/td><td>70.0%<\/td><td>+0.135<\/td><td>9/10<\/td><\/tr><tr><td>모션 X 플레이액션<\/td><td>65<\/td><td>9.29<\/td><td>85.7%<\/td><td>+0.545<\/td><td>7/7<\/td><\/tr><\/tbody><\/table><\/div><p>모션이 있는 패스 플레이에서 베어스는 시도당 10야드씩 전진했고 20번의 패스 시도 중에 17번이 성공하면서 완성률 (패스가 성공한 경우)은 85%에 다다랐다. 거기다가 성공률 (EPA가 양수인 플레이 비율)도 66.7%에 달했고 플레이 액션까지 달했을 때는 7번의 플레이에서 7번을 성공했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/EyUT3RDO5ow\" title=\"YouTube\"><\/iframe><\/div><p>하지만 그렇다고 케이스 키넘이 벤 존슨이 풀어주는 게임을 그대로 받아서 쉬운 게임을 펼쳤던 것은 아니다. 이글스의 수비가 패스 차단 쪽에서는 정교하지 못했지만, 1선에서 러닝을 막고 쿼터백을 압박하는 부분에서는 꽤나 성과가 있었다. 그런 상황에서 케이스 키넘은 와 키넘이 이정도인가 하는 생각이 들 정도로 훌륭한 모습을 보였다. 130kg 되는 수비를 달고 페이드어웨이 패스를 하는 플레이들을 보고 '와? 이게 키넘이라고?' 생각하며 계속해서 플레이를 돌려보았다. 개인적으로 케일럽 윌리엄스가 수없이 돌려봐야할 게임이라고 생각이 든다. 케이스 키넘의 코치와 같은 그림으로 필드를 보는 눈, 그에 따라 수비를 사전에 분석하는 능력, 의사결정을 하고 정확하게 던지는 능력, 그리고 수비가 올때 자신의 다리로 해결을 한다기보다는 침착하게 필드를 계속 보고 패스를 이어가는 이번 경기의 모습을 보고 배우게 된다면 윌리엄스의 수준이 곱절은 올라갈 거라고 본다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/NthU3wKHYfc\" title=\"YouTube\"><\/iframe><\/div><p>베어스의 수비에 대해서도 잠깐은 다루고 싶은데, 수비코치 데니스 알렌은 세인츠의 코치와 감독시절 꽤나 강한 수비를 구축했는데, 당시 그의 수비에서 가장 중요한 부분은 1선의 4명으로 확실히 이기는 것이다. 거기서 시작해서 라인배커들은 좌우로 날라다니고 코너백들은 강한 맨마킹이 되는 굉장히 정석적인 수비 전술을 굉장히 선호했는데, 현재 베어스에서 그런 수비를 이룰 수는 없다. 자신의 강력한 1선이 되어줄거라고 기대하고 데리고 왔던 선수들은 잘해봐야 리그 평균인 상황이라 전술에 대한 접근의 변화가 필요했는데, 그 답을 블리츠에서 찾은 듯하다. 지난 해 램즈와의 플레이오프 게임이 그 시작이 되지 않았을까 싶은데, 현재 그들은 리그에서 가장 블리츠를 많이 하는 팀 중 하나이다. 이는 러닝과 패스 양쪽에서 마찬가지인데 러닝에서도 1선에 선수를 많이 넣고, 수비시에도 선수들을 닥돌시키고 있다. 지금 베어스의 수비에게 상대를 틀어막는 85 BEARS 와 같은 수비를 바라는 사람은 아무도 없을 것이다. 상대의 공격이 살짝만 멈추게 하는 방지턱 정도의 역할만 하길 바랄텐데, 마치 과거에 마홈즈가 첫 슈퍼볼을 우승할 때처럼 수비의 올인 전술은 굉장히 좋은 접근이라고 본다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>평균 박스 인원<\/th><th>박스 8명 이상인 비율<\/th><th>블리츠비율<\/th><\/tr><\/thead><tbody><tr><td>베어스의 26시즌 수비<\/td><td>6.98 명 (1위)<\/td><td>22.6% (1위)<\/td><td>42.9% (4위)<\/td><\/tr><\/tbody><\/table><\/div><p>다음은 이글스를 보자. 이글스의 최근 퍼포먼스가 그리 훌륭하지 않은 가운데, 이글스의 가장 믿을만한 부분인 수비가 이번 게임 3후보 쿼터백에게 탈탈 털려서 수비도 무너진걸까에 대한 걱정을 하겠지만 그정도까지 걱정할 것은 아니라고 본다. 이번 게임 여러 패스차단 부분에서 역할 배분이 잘 안되는 장면들이 나오고, 모션에 전혀 대응을 하지 못했지만, 이번 시즌 들어서면서 라인배커/세이프티 진에서 선수 교체가 있었고 이들이 빅 팬지오의 수비시스템에 적응해가는 시기라고 생각이 들고, 무엇보다 이 게임에서는 너무 안일하게 러닝만을 신경써서 나온 결과라고 본다. 물론 그렇다고 슈퍼볼을 우승할 때처럼 리그의 압도적인 1황 수비라고 하기엔 어렵지만 시즌이 끝날때즘에는 탑10권에는 들지 않을까 싶고 이번 게임은 그냥 잘못 걸렸다라고 생각하는게 나아보인다.<\/p><p>공격쪽에서 가장 긍정적으로 볼 부분은 바로 러닝 공격이 살아나고 있다는 것이다. 이번 게임에서 세이콴 바클리는 15러싱 82야드로 정말 오랜만에 시도당 5.5야드를 기록했는데, 이글스 오라인 중에 강한 부분인 태클들 쪽으로 러닝이 주효하면서 전성기의 세이콴과 이글스의 러닝 게임이 떠오르게 했다. 최근 NFL의 대세인 타이트엔드를 3명씩 넣으면서 블로킹 할 인원을 늘린 러닝 친화적 전술을 쓰는게 아니라 공간을 확보하는 쪽에 초점을 맞춘다. 선수를 넓게 펼쳐서 오히려 스피드가 좋은 러닝백이 들고 뛸 공간을 잡아주고 우리의 우월한 오라인 블로킹의 1대1을 살릴 수 있는 전술에 초점을 맞춘건데 그 시절 느낌이 난다. 다만 아쉬운 점은 그 시절의 이글스와 같은 단점도 똑같이 나오고 있다. 무슨 말이냐면, 점수가 앞서고 있는 상황에서는 차분하게 러닝을 펼칠 수 있다. 그리고 그에 따라 수비가 내려오면 리시버가 바깥에서 1대1에 노출되고 제일런 허츠는 이 1대1을 공략할 그림같은 공을 던질 수 있는 선수이다. 이번 경기 드본타 스미스와의 패스가 가장 대표적 예시이다. 다만, 게임이 크게 뒤쳐지기 시작하면, 러닝게임을 하기 부담스러워지고, 차분하게 수비를 분석해서 필드의 중앙 부분을 공략하면서 필드를 성큼성큼 전진해가야하는데 이런 그림은 허츠의 장점을 살리는 플레이가 아니다. 물론 공격코치가 어린 공격코치라 언더센터도 도입하는 등 여러모로 색깔의 변화를 추구하고 있어서 이제 슬슬 자신이 생각한 정체성을 보여주고 그에 맞게 게임을 발전시키는 것을 기대해야 할 것이다.<\/p>","401872964":"<p>이번주 NFL에서 가장 깜짝 놀랄 만한 결과이자 묘하게 짜릿했던 게임 중 하나가 바로 클리브랜드 브라운스와 피츠버그 스틸러스간의 디비절 라이벌 게임이었는데, 마지막 간발의 필드골 차로 클리브랜드 브라운스가 승리하게 되었다.<\/p><p>브라운스 입장에서는 현재 3승 1패의 상황으로 3연승을 거두고 있는 와중에, 디비전 1위까지 차지하고 있는 상황이다. 많은 팬들이 토드 몽켄 감독이 선임되고, 그가 개막전을 패배할 때까지만해도, 역시 토드 몽켄 같은 차선책 감독을 뽑다니! 패배뿐이야! 라고 생각했을건데, 그런 그가 깜짝 놀랄 반전을 기록하고 있다. 굉장히 오랜기간 NFL과 풋볼 판에서 코치로 든든한 베테랑 역할을 하던 인물이 감독의 기회를 작년에 처음으로 부여받았는데, 획기적인 전술을 선보이며 리그에 두각을 드러낸 젊은 신성같은 감독들이나, 하나의 팀을 슈퍼볼 우승까지 이끈 베테랑 감독들을 두고, 감독으로서 검증받지 못한 노장을 선임했다는 것에 브라운스 팬들 실망감이 컸다. 하지만 1/4분기가 지난 지금 토드 몽켄 특유의 묵직한 노장의 경험이 팀에 굉장히 좋은 변화를 끼치고 있다. 살짝, 전체적 그림 말고 이번 4주차 게임 몽켄의 활약에 대해 말하자면, 4쿼터 브라운스의 DPI(수비 패스 인터피어런스)로 불린 40야드 짜리 빅플레이를, 자신의 1선 수비가 공이 날라갈때 아주 살짝 스친걸 캐치해서 챌린지했고, 이 반칙 플레이를 무위로 돌린 것이라고 본다.<\/p><p>가장 인상적인 것은 지난 2년간 브라운스의 드래프트픽이다. 작년부터 보자면,, 메이슨 그레이햄은 이번 시즌 쌕이 4개로 내곽에서 확실히 임팩트를 내고 있고, 2라운드에 뽑은 카슨 슈웨징거는 전년도 신인상 수상자이다. 거기에 퀸슨 저드스킨스와 해럴드 패닌은 각각 러닝백과 리시버에서 현재 팀의 주전으로 올라섰는데. 여기에 26년도 1라운드 픽인 스펜서 파노는 팀의 주전 오라인으로, KC 콘셉시옹과 덴젤 보스턴은 팀의 가장 중요한 주전 리시버로 올라섰다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">메이선 그래햄<\/th><th class=\"r\">카슨 슈웨징거<\/th><th class=\"r\">퀸숀 저드스킨스<\/th><th class=\"r\">해럴드 패닌<\/th><th class=\"r\">스팬서 파노<\/th><th class=\"r\">KC콘셉시옹<\/th><th class=\"r\">덴젤 보스턴<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">드래프트<\/td><td class=\"r\">25년도 1라운드<\/td><td class=\"r\">25년도 2라운드<\/td><td class=\"r\">25년도 2라운드<\/td><td class=\"r\">25년도 3라운드<\/td><td class=\"r\">26년도 1라운드<\/td><td class=\"r\">26년도 1라운드<\/td><td class=\"r\">26년 2라운드<\/td><\/tr><tr><td class=\"l\">포지션<\/td><td class=\"r\">내곽디라인맨<\/td><td class=\"r\">라인배커<\/td><td class=\"r\">러닝백<\/td><td class=\"r\">타이트엔드<\/td><td class=\"r\">오라인맨<\/td><td class=\"r\">리시버<\/td><td class=\"r\">리시버<\/td><\/tr><tr><td class=\"l\">동포지션 주요 스탯<\/td><td class=\"r\">쌕 1위<\/td><td class=\"r\">25년 수비신인상<\/td><td class=\"r\">20위권 러닝백<\/td><td class=\"r\">터치다운 2위<\/td><td class=\"r\">주전 오라인맨<\/td><td class=\"r\">리시빙야드 11위<\/td><td class=\"r\">리시빙야드 24위<\/td><\/tr><\/tbody><\/table><\/div><p>하지만 역시 가장 화두에 오를 것은 드숀 왓슨일 것이다. 승리라는 스탯에 쿼터백의 영향력이 얼마나 크냐에 대한 점은 논의의 여지가 있으나, &quot;승리&quot;쿼터백의 가치는 절대 낮지 않다. 그것도 디비전 라이벌인 스틸러스 상대로 드숀 왓슨이 그 마홈즈와 비교되던 전성기의 70~80%정도 수준으로 돌아온것인가?! 에 대한 긍정 섞인 평가들에도 분명히 근거는 있다. 내 개인적인 평가는 그렇지는 않다. 좋게 봐야 아주 평균 수준의 쿼터백 정도 역할을 하고 있다는 것이 나의 평가다. 이번 게임 역시 승리로 이끌었지만, 사실 지난 게임에 비해 경기의 완성도는 훨씬 떨어졌다. 전반에는 확실히 3주차의 폼 좋던 모습을 이어나가면서 좋은 경기운영을 보았고, 거기다가 지난 몇 주 나오지 않던 빅패스들까지 나오면서 '오 정말로 전성기의 70~80%수준 혹은 그 이상으로 돌아온건가?'라는 생각도 들었다. 특히, 3번째 터치다운에서 TJ 왓이 반칙을 저지르면서 반템포 빠르게 쇄도를 해들어왔는데 그보다 빠르게 수비를 순식간에 읽고 터치다운 패스를 뿌리는 것은 아주 인상적이었다. 하지만, 후반전에 폼이 급격하게 떨어졌다. 후반에 펌블 2번에 인터셉션까지 저지르면서 경기력이 급격히 떨어지는 모습을 보였고, 특히나 마지막 공격권에서 제리 쥬디에게 빅플레이를 연결해서 필드골 사거리에 성큼 다가간 뒤에 반칙 - 쌕까지 당하면서 필드골 사거리밖으로 쫓겨날 뻔한 것은 필드골을 성공해서 다행이지... 만약에 실패했다면, 전반의 모든 좋은 활약을 잊게 해줄 안좋은 퍼포먼스였다.<\/p><p>그렇다면 전반의 활약만으로 승리한걸까? 그렇지 않다. 브라운스의 게임에서 가장 &quot;진짜&quot;는 수비이다. 특히나 코너백 덴젤 워드를 중심으로 한 강력한 맨투맨 수비는 몇 해동안 브라운스의 수비가 탑급으로 분류되었던 것이 마일스 개릿 덕만은 아니라는걸 보여주고 있다. 덴젤 워드는 사실 언제나 리그에서 탑 5안에 드는 코너백이었는데, 팀의 부진과 코너백 포지션 자체의 덜한 스포트라이트 등이 합쳐져서 늘 주목을 못 받았다. 물론, 이 팀의 수비 스타는 늘 그리고 마땅히 마일스 게릿이었기 때문이기도 할 것이다. 하지만 게릿이 떠난 후 그의 맨투맨 능력은 더욱 더 빛나고 있다. 지난주에도 팬서스의 에이스인 티맥을 꽁꽁 묶어버렸는데, 이번 주 게임에서 티맥이 디트로이트 라이언스 수비를 상대로 192야드를 기록한걸 생각하면 지난주에 그를 단 17야드로 묶은 걸 생각하면 덴젤 워드가 얼마나 수준높은 코너백인지 더 느끼게 해준다. 이번 게임에서도 자신이 맡은 리시버들을 계속 묶다가 중요한 순간에 자신의 엄청난 피지컬을 활용한 인터셉션을 보여주면서 경기의 분위기를 뒤집어버렸다.<\/p><p>피츠버그 스틸러스의 입장에서는 첫 공격권이 나쁘지 않았지만 그 뒤로 공격 자체가 멈춰버렸다. 특히나, 브라운스의 강력한 맨마킹에 적절한 대응책을 전혀 내놓지 못했고, 오라인 쪽에서는 우측 태클인 신인 나초가 정말 혹독한 신고식을 치뤘다. 이번 경기 애런 로저스는 5개의 쌕을 당하면서, 노장에게는 가혹한 한 경기가 되었다. 그나마 좋았던 점은 스틸러스의 러닝게임이 굉장히 잘 통했다는 것이다. 특히나, 러닝백 제일런 워렌은 리그에서 가장 과소평가 받는 러닝백 중 하나가 될 것으로 보인다. 그 특유의 구멍을 찾아내는 후각이나 구멍을 통해 달려나갈때의 순발력과 폭발력은 나지 해리스의 백업일때부터 굉장히 눈에 띄었다고 생각했는데, 러닝 짝궁인 리코 다우들이 부상을 당하면서 이번 경기 내내 기회를 받았고, 그 기회를 100% 살리고 있다. 스틸러스의 이번 시즌 1/4분기에서 가장 크게 건질만한 것은 바로 제일런 워렌을 위시로 한 러닝 게임일 것이고 이 러닝게임을 중심으로 팀의 공격을 펼쳐야 할 것이다. JJ 매카시 감독은 그의 과거 전우이자 같이 슈퍼볼 우승을 이뤘던 애런 로저스를 살리기 위해서 리시버들을 펼친 샷건 게임을 중간중간 도입하려고 했는데, 이제는 제일런 워렌의 러닝을 중심으로 한 강력한 러닝 공격과 그에 따른 플레이 액션을 중심으로 삼아야할 것이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">언더센터<\/th><th class=\"r\">샷건<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">플레이당 야드<\/td><td class=\"r\">6.62야드<\/td><td class=\"r\">4.37야드<\/td><\/tr><tr><td class=\"l\">성공률<\/td><td class=\"r\">45.7%<\/td><td class=\"r\">38.9%<\/td><\/tr><tr><td class=\"l\">EPA/플레이<\/td><td class=\"r\">+0.17<\/td><td class=\"r\">-0.23<\/td><\/tr><tr><td class=\"l\">러닝 시도당야드<\/td><td class=\"r\">5.06야드<\/td><td class=\"r\">3.97야드<\/td><\/tr><tr><td class=\"l\">러닝 EPA/플레이<\/td><td class=\"r\">+0.03<\/td><td class=\"r\">-0.09<\/td><\/tr><tr><td class=\"l\">패스 시도당야드<\/td><td class=\"r\">8.88야드<\/td><td class=\"r\">4.46야드<\/td><\/tr><tr><td class=\"l\">패스 EPA/플레이<\/td><td class=\"r\">+0.37<\/td><td class=\"r\">-0.26<\/td><\/tr><\/tbody><\/table><\/div><p>특히나 이 게임에서 후반에 공격이 터지기 시작하면서 나온 DK 맷케프 빅패스는 러닝인척 플레이 액션 패스 게임에서 나왔다. 개인적으로 맥카시 감독이 아직 감이 그래도 있다는걸 느낀게, 이번 게임에서 가장 빅플레이였던 DK 멧케프의 플레이였다.이 플레이는 그 전 쿼터에서 스틸러스가 했던 것인데, 그 때 브라운스의 수비에서 구멍을 발견하고 이를 똑같이 가동하면서 빅플레이를 만들어 냈다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/VIMNT2Tt4z8\" title=\"YouTube\"><\/iframe><\/div><p>개인적으로 다넬 워싱턴에 대한 이야기를 꼭 하고 싶은데 201cm에 120kg인 불곰에 떠오르는 어마어마한 체격의 타이트엔드인데, 기존에 블로킹에만 활용되던 이 인물이 갈수록 패스게임에 적극적으로 활용되고 있다. 지난 게임에서는 게임을 결정짓는 빅플레이를 한데 이어, 이번 게임에서 그가 캐치를 한 뒤에 스틸러스의 수비들이 다 달려드는데도 넘어지지 않는걸 보면서... 명견 실버가 떠올랐다.... 로저스가 이 선수를 얼마나 마음에 들어하냐면, 마지막 공격권 레드존에서 3번의 패스를 모두 다넬 워싱턴 쪽으로 던져주었고, 기어코 터치다운을 만들어냈다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/SwSdNiM-oqw\" title=\"YouTube\"><\/iframe><\/div>","401872965":"<p>영국에서 펼쳐진 콜츠와 커맨더스의 게임은 많은 사람들의 예상대로 콜츠의 승리로 끝났다. 커맨더스는 백업 쿼터백인 마커스 마리오타가 부상으로 빠지면서 희망이 거의 사라져버린 와중에도 꽤나 견실한 수비로 분전을 했으나, 콜츠의 러닝백 조나단 테일러가 터지면서 패배를 당했다. 조나단 테일러는 국제 경기에서만 6개의 터치다운을 거두면서, 콜츠의 국제 경기 3전 전승에 크게 일조 하고 있다.<\/p><p>가장 경기 중에 분기점이 된 포인트는 커맨더스의 2쿼터 8:00경에 커맨더스의 46야드 지점에서 4TH &amp; 1 고포잇이었다. 많은 NFL 코치들이 통계전문가들의 말을 빌어 4TH &amp; SHORT 특히나 4TH &amp; 1 같은 상황에서는 무조건 고포잇을 하는 경우가 많은데, 나이 든 코치들이 그런 플레이를 왜 안좋아하는지 보여주는 사례가 이 게임일 것이다. 4TH &amp; 1 갱신을 커맨더스가 하기전까지 커맨더스는 6-0으로 백업의 백업 쿼터백으로 게임을 잘 이끌고 있었다. 그리고 4TH &amp; 1 상황에서 펀트를 차기보다는 고포잇 시도를 해보았고, 콜츠가 이걸 막은 다음부터 바로 기세를 타버렸다. 무조건적인 고포잇을 싫어하는 코치들은 모멘텀, 즉 기세의 게임에서 상대가 수비쪽에서 빅플레이를 하면 분위기가 공격쪽으로도 전염될 수 있기 때문에 왜 상대에게 기세를 탈 기회를 주느냐 제발 펀트/필드골 좀 차라!라는 마인드가 있는 것 같다. 콜츠는 이 공격권 이후로 완벽히 각성하면서 기세를 타버렸다. 그 뒤로 콜츠는 터치다운 - 필드골 - 터치다운 - 필드골 - 펀트 - 터치다운 - 필드골을 기록하며 30점을 때려박아버렸다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">공격군 (Drive) 회수<\/th><th class=\"r\">총 전진야드<\/th><th class=\"r\">득점<\/th><th class=\"r\">1st다운 개수<\/th><th class=\"r\">턴오버 개수<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">4th&amp;1 시도 이전<\/td><td class=\"r\">4회<\/td><td class=\"r\">30야드<\/td><td class=\"r\">0점<\/td><td class=\"r\">2회<\/td><td class=\"r\">2회<\/td><\/tr><tr><td class=\"l\">4th&amp;1 시도 이후<\/td><td class=\"r\">7회<\/td><td class=\"r\">219야드<\/td><td class=\"r\">30점<\/td><td class=\"r\">15회<\/td><td class=\"r\">0회<\/td><\/tr><\/tbody><\/table><\/div><p>자 그러면 팀별로 디테일하게 보자. 우선 커맨더스부터 보자. 공격쪽에서는 제이던 다니엘스의 부상 - 마커스 마리오타의 부상까지 이어지면서 패스게임 쪽에서는 크게 기대하기 어려운 상황이고, 러닝쪽에서도 오라인의 핵심인 샘 코스미가 부상을 당하면서 기대하기 어려운 상황이 되었다. 그나마 다행이라하면 수비쪽에서 꽤나 유의미한 성과들이 나오고 있지 않나 싶다. 그 시작은 수비코치안 다론테 존스이다. 바이킹스에서 수비 쪽 코치로 활약을 하다가 커맨더스의 수비코치가 되었는데, 브라이언 플로레스 계보의 거의 첫 주자라고 봐도 무방하지 않을까 싶다. 그리고 그 계보 답게 블리츠를 엄청나게 하고 있다. 이번 게임 50%에 달하는 스냅에서 블리츠를 보냈고 그에 따라 다니엘 존스에게 초반에 지옥(1쌕펌블, 1인터셉션)을 보여주었다. 이를 위해서는 다재다능한 라인배커진이 굉장히 중요한데, 올해 드래프트한 써니 스타일스가 그 역할을 톡톡히 하고 있다.<\/p><p>콜츠의 입장에서는 두 선수의 부진이 좀 마음이 아플 것이다. 첫째는 다니엘 존스이다. 다니엘 존스는 전반에 거의 최악의 모습을 보여주면서 브라이언 플로레스 계보의 닥공 블리츠 전술에 정신을 못차렸는데, 후반에 콜츠는 그의 손에서 이뤄진 공격보다는 러닝으로 가자 하고 완전 방향을 전환해서야 팀을 승리로 이끌 수 있었다. 또 하나, 코너백인 소스 가드너도 영 부상전의 폼을 찾지 못하고 있다. 한때는 연구소에서 만들었다는 평가까지 들으며 그 패트릭 서테인보다도 우위의 선수라는 이야기를 들었었는데, 수비과정 중의 스킨십/터치/접촉들을 심판들이 잡아내기 시작하면서 폼이 떨어졌고, 이번 경기에서는 결정적인 터치다운을 허용하기 까지 하면서 팀의 1번 코너백 역할도 하기 어렵지 않을까라는 걱정을 들게 한다. 두 선수 다 각각 콜츠입장에서 막대한 자원을 쏟아 넣은 인물들이기에 콜츠 팬들의 마음이 더 아프지 않을까 싶다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/X5Wv500fnqM\" title=\"YouTube\"><\/iframe><\/div><p>반면에 좋은점도 있다. 우선 조나단 테일러는 여전히 자신의 클래스를 보여주고 있다. 비쟌 로빈슨, 자미어 깁스라는 폭발력이 가득한 탑 2 러닝백들의 자리를 위협하는 가장 큰 후보 중 하나 아닐까 싶다. 사실, 그는 이미 러닝 1위를 차지한 적이 있는 베테랑이라 아직 넘겨줄때가 아니다! 라고 외치고 있다는게 더 맞는 표현일 수도 있다. 여튼 조나단 테일러는 러닝을 할 때 공을 한손에 잡고 자신의 앞의 오라인을 한손으로 살짝 짚으면서 블로킹이 형성될 때까지 차분하게 기다리다가 공간이 열리는 순간 팡하고 튀어나가는 플레이를 하는데, 굉장히 전통적인 의미의 러닝백에 대한 향수를 불러일으키게 한다. 뿐만 아니라 1선 수비진인 드포레스트 버크너 역시나 자신의 어마무시한 클래스를 보여주면서 상대의 오라인이 누구든간에 헤집으면서 압박과 러닝 차단을 이루어내고 있다. 개인적으로 어느 시대에나 그 시대에 분명히 엄청난 선수였고 최고 티어로도 간혹 퍙가받는 등 팀을 바꿀만한 임팩트를 냈지만, 팀의 약세, 인기없는 팀에 속한 점 등등으로 기억에 남지 못하는 인물들이 있는데.... 이 두 선수가 올해는 뭔가 일을 내서 그런 인물들이 안되길 바란다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/H4nqtU6o6Pw\" title=\"YouTube\"><\/iframe><\/div>","401872966":"<p>36 대 24의 점수만 놓고보면 꽤나 원사이드한 게임으로 비춰질 수 있지만 생각보다 두 팀이 호각으로 다퉜으며, 30대 24로 뒤쳐지던 카디널스가 경기 종료 직전에 골라인 앞까지 가서 끝내기 역전 터치다운을 눈앞에 둔 상황에서 인터셉션을 당했고 그 인터셉션이 그대로 상대의 터치다운으로 연결이 되면서 게임이 원사이드 한것처럼 끝나버렸다.<\/p><p>경기가 끝나고 자이언츠의 입장에서는 그래... 이게 제이미스 윈스턴인가 라는 생각을 들게 한다. NFL의 유일한 30-30 클럽, 즉 30 터치다운 30 인터셉션이라는 불명예이지만 정말 불명예일까에 대한 생각이 드는 기록을 가진 인물인 제이미스 윈스턴인데, 이번 게임에서도 역시나 그 답게 빅패스를 뻥뻥 터뜨리면서 동시에 인터셉션을 2개나 기록하는 상반된 모습을 보였다. 고무적인 것은 러닝이 크게 풀리지 않았는데도 득점을 해냈다는 거고, 그 주인공은 팀의 1번 리시버 말릭 네이버스이다. 굉장한 리시버 재능들이 가득 모였었다는 평가를 들었던 24년 드래프트 중에 거의 유일하게 밥값(물론 부상의 이슈가 크다...)을 하고 있는 인물이라고 봐도 되는데 그가 필드에 있을 때 얼마나 강력한지 보여주었다. 경기 초반에는 공중에서 몸을 역방향으로 꺾으면서 빅패스를 잡아내는 피지컬을 보여주더니, 터치다운 플레이에서는 자이언츠의 전술을 온벽히 이행하는 모습을 보였다. 상대 수비가 최후방이 2명인 커버2로 나왔는데, 이에 대응해서 러닝백을 밖으로 빼고 에이스인 말릭 네이버스를 내곽 3번째 리시버로 두고 커버2의 빈공간을 공략하게끔 했다. 커버2의 수비수가 마음놓고 자기 수비위치인 최후방으로 빠져야 이 빈공간이 열리는것이기에, 말릭 네이버스는 스냅이 이뤄지고 난 뒤 아주 침착하게 멈칫멈칫하면서 자신이 짧은 루트를 밟는 척 연기를 해놓고 수비가 물러난걸 보자마자 풀악셀을 밟았다. 아주 인상적이었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/CPP0ggPhLqg\" title=\"YouTube\"><\/iframe><\/div><p>더 인상적이었던 것은 수비였다. 마이크 맥도널드 계보의 가장 촉망받던 인재였고, 타이탄스에서 수비코치로 지난 몇 년간 날개를 펼친 드나드 윌슨이 자신의 포스를 마음껏 선보이고 있는 것으로 볼 수 있는데 그의 밑에서 여러 선수들이 자신의 최고 퍼포먼스를 선보이며 스타로 발돋움하고 있다. 커리어가 끝나서 곧 팀에서 잘릴거라는 이야기를 듣던 코너백 디온테 뱅크스는 아주 준수한 수비수로서 성장을 해서 이번 게임 끝내기 픽식스를 만들어내기도 했고, 가장 인상적인 두 명은 바로 올해 신인 1라운드 5번픽 라인배커 아벨리스와 전년도 1라운드 3번픽인 엣지러셔 압둘카터이다. 아벨리스는 2쿼터에 카디널스의 공격을 혼자 끝냈다 라는 생각이 들정도로 공격권마다 엄청난 빅플레이들을 연거푸 해냈는데, 인터셉션에서는 아벨 리스의 쇄도에 따른 압박의 영향이 컸고, 그 다음 공격권에서는 써드다운에 빅플레이를 해내면서 카디널스의 공격을 끊었고, 그 다음에는 또 쇄도하면서 공을 쳐내서 공격을 무위로 돌렸고 그다음에는 인터셉션, 그다음에는 러닝을 차단하는 태클, 이어지는 스크린 차단까지 '와.. 뭐지' 하는 생각이 들정도로 맹활약햇다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/65cE0HxxeEU\" title=\"YouTube\"><\/iframe><\/div><p>그리고 후반에 들어서면서는 압둘 카터가 경기를 지배했다. 마이카 파슨스와 같이 원래는 미들라인배커였던 인물이었는데 대학때 패스러셔로서의 재능이 깨어나면서 미들라인배커에서 엣지러셔로 포지션을 변경한 인물인데, 순간적인 민첩함과 그에 따른 쇄도능력이 굉장히 고평가를 받았던 인물이다. 지난해 압박은 정말 많이 만들었지만, 쌕은 만들어내지 못한 아쉬운 모습이 있었는데, 이번 경기에서도 쌕은 만들지 못했지만 시종일관 오라인맨을 제끼고 상대의 백필드에 살면서 브라이언 번스라는 에이스 엣지러셔가 빠진 상황에서도 그 빈자리를 느끼지 않게 했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/b87YbtVwzTE\" title=\"YouTube\"><\/iframe><\/div><p>애리조나 카디널스의 경우 신임 감독과 함께 굉장히 단단한 공격력을 구축하고 있다. 반칙도 적고, 공격의 기본이라고 볼 수 있는 러닝도 아주 갖춰졌다. 특히나, 제레마이아 러브는 블로킹이 형성되기 시작하는 것을 기다리는 침착함이나 순간적인 스피드 등을 보면, 확실히 그에게 기대되던 1라운드 3번픽에 맞는 존재일 수도 있겠다. 물론 아직까지 엄청난 폭발력이 나오진 않았고, 신임감독의 새로운 체계이기에 오라인이 좀 더 형성되어야 날아오를 것이란 생각이 든다. 개인적으로 경기의 마지막 픽식스 당한 플레이에서 왜 그가 아니라 알지어를 출장시켰는지는 의문이 들긴하다... 더 큰 문제는 패싱게임인데, 쿼터백 자코비 브리셋은 나쁘지 않다. 하지만, 나쁘지 않은 정도가 한계인게 이 팀의 전체적인 공격에서의 한계를 정하는게 아닌가 싶다. 마빈 해리슨 주니어에게의 터치다운은 기가 막혔고, 몇몇 안정적인 선택들이나 전체적인 경기 운영은 분명 베테랑 쿼터백 답지만, 역시나 의문스럽고, 아쉬운 부분들도 존재한다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ypPim4oIwe0\" title=\"YouTube\"><\/iframe><\/div><p>더 큰 문제는 수비 쪽에서다. 부다 베이커 외에는 마땅한 선수가 없고 그나마 기대하던 조쉬스웻이나, 월터 놀란 같은 선수들이 부상으로 빠진 상황에서 갈수록 더 그림이 안좋아지고 있다.<\/p>","401872967":"<p>카우보이스의 공격은 미쳤었다. 이번 경기처럼 플레이를 하면, 그 누구도 그들을 막을 수 없을 것인데, 경기 준비, 전술의 이행, 스타 선수들의 활약 3박자가 기가 막히게 맞아 떨어졌다. 카우보이스는 텍산스의 수비를 사전에 분석해서 그들이 쿼터스 - 즉 4명의 수비를 최후방에 두는 전술을 선호하는 것을 파악했고, 그 전술의 약점인 단거리 지역 특히나 단거리 외곽 지역을 주 공략 포인트로 삼았다. 이 공간은 라인배커들이 막게 되는데, 텍산스의 주전 라인배커들이 부상이기에 이 약점이 더 잘 드러났고, 이를 위해 자신들의 1번 리시버인 씨디 램을 슬롯 리시버 자리에 위치시켰다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/WBe9QxQ5tNE\" title=\"YouTube\"><\/iframe><\/div><p>자신들의 스타 플레이어들을 200% 활용한 움직임이었는데, 이번 게임의 주인공인 씨디 램은 슬롯에서 22개의 플레이를 펼쳤다. 이는 브라이언 쇼튼하이머 감독이 된 후로 씨디 램이 가장 많이 슬롯에서 뛴 경기였다. 씨디 램은 이번 게임에 21번의 타겟을 받으면서 189야드라는 정신나간 스탯을 기록했는데, 대부분의 캐치들이 짧은 단거리 지역으로 쉽게 쉽게 가는 플레이였다. 거기에 이 전술을 더 극대화하기 위해 2번 리시버인 조지 피켄스는 경기 내내 깊게 깊게 뛰게하면서 상대가 최후방에 사람을 계속해서 두게 만들었고, 이를 보여주듯 많은 패스는 잡지 못했지만 2번의 캐치로 75야드를 기록하며 자신이 왜 딥패스 타겟인지 보여주었다. 특히나 경기 중에 나왔던 1:1 공중볼 경합에서 보여준 능력은 입이 벌어질 정도였다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/mrS0FrdXc7I\" title=\"YouTube\"><\/iframe><\/div><p>여기에 닥 프레스캇은 베테랑 쿼터백으로서 침착하고 차분하게 경기를 운영하면서 자신의 동료들에게 기회를 주는 현장 지휘관으로서의 모습을 여지없이 보여주며 자신의 클래스를 증명하였다. 텍산스가 주로 쓰는 전술인 쿼터스는 상대에게 빅플레이를 내주지 않고 짧게 짧게 차분하게 필드를 전진하게 강요를 하는 것이다. 이리되면, 공격은 실수를 하지 않은채 플레이의 횟수를 늘리면서 필드를 전진해야하는데, 괴물들이 살고 있는 텍산스의 1선 수비진에게 기회 (플레이 횟수)를 많이 주는 것 자체가 엄청난 부담이다. 하지만, 닥 프레스캇은 이걸 굉장히 훌륭하게 해냈다. 침착하게 수비가 내주는 짧은 공간에 패스를 차분하게 성공해나갔고, 수비가 기회를 주면 빅 플레이를 용기있게 성공하기도 했다. 아마 가장 중요한 움직임은 포켓 안에서의 움직임이다. 플레이가 시작되면 5~7걸음 물러났다가, 엣지러셔들이 자신의 옆으로 쇄도해 들어가면 밖으로 피하는게 아니라 포켓 안으로 움직이면서 엣지러셔들의 쇄도를 등 뒤로 흘려버리는 기민한 움직임이 아주 좋았고, 거기에 오라인의 블로킹이 굉장히 좋아서 텍산스의 강력한 1선쇄도를 모두 무위로 만들었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/Cc3wseG9EHk\" title=\"YouTube\"><\/iframe><\/div><p>그리고 이 모든게 합쳐진게 바로 카우보이스의 마지막 공격권이었다. 게임을 패배할 수 있었던 4th다운에서 침착하게 리시버들을 다 한쪽에 몰아넣고 거기서 나오는 움직임으로 단거리에 빈 공간을 만들어서 성공적 갱신을 만들어냈고, 그 다음에 2nd 다운에서 이번 게임 닥 프레스캇의 가장 좋은 패스가 나왔다. 씨디 램이 밖으로 나가는데 2선 수비가 앞뒤로 있는 상황에서, 리시버가 돌기도 전에 한타임 빠른 타이밍에 빅패스를 만들면서 전진을 해서 진짜 게임을 승리로 끝낼 가능성을 높였고, 그 다음에는 이번 게임 계속 나오던 승리공식 - 씨디램 (#88)을 슬롯에 넣고 단거리 외곽을 공략했다. 그리고 그 다음에는 조지 피켄스를 밖으로 빼서 이번 게임에 계속 나온 단거리 외곽을 공략하는 듯 움직임을 취하면서 페이크를 주고는 깊이 들어가서 빅패스를 만들어냈고, 터치다운에서는 #88을 슬롯에 넣고 1대1을 활용해 터치다운을 만들었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/kqIN1XDhZGQ\" title=\"YouTube\"><\/iframe><\/div><p>텍산스 입장에서는 0승 4패로 시즌을 시작하게 되었다. 지난해 리그 최강의 수비를 보여주며 이번 시즌에도 그 모습을 보여줄거라 기대했는데 스탯은 전혀 다른 모습을 보이고 있다. 전반적으로 모든 스탯에서 탑 3안에 드는 압도적 강함을 보였던 25시즌과 다르게 중위권은 커녕 중하위권의 스탯을 기록하고 있다. 이게 더욱이나 속이 터지는 이유 중 하나는 윌 앤더슨 주니어는 지금 당장 시즌이 종료되었다고 치면 압도적으로 올해의 수비수 상을 탈 퍼포먼스를 보이고 있기 때문이다. 이번 경기에서도 지속해서 압박을 만들어냈을 뿐아니라 필드골을 쳐내는등 어마어마한 경기력을 보이고 있다. 그렇다면 문제는 뭘까. 우선 구조적으로 이슈가 몇 개 있는데, 텍산스는 앞서 언급했듯 코너백들의 1대1능력을 극대화하기 위해서 코너백들을 살짝 물러나게 해서 중장거리를 차단하는 구조로 수비를 운영하고 있다. 그러면 상대의 공격은 지속해서 짧은 거리를 차근차근 나아가는 답밖에 없고, 그리되면 늘어난 플레이 횟수속에서 윌 앤더슨 주니어나 드닐 헌터와 같은 괴물들이 쌕펌블을 만들어내거나 압박을 만들어서 코너백들이 공을 따내는 턴오버를 만들어내거나 아니면 최소 압박을 통해서 플레이 의지를 꺾어버리는게 그들의 수비공식이자 승리공식인데 이 빅플레이들이 아직 발생하지 않았다. 거기다 라인배커진과 세이프티진의 부상 및 교체에 따라 중간중간 구멍이 생기고 있다(이게 빅플레이 허용률에서 보인다). 다만 그러면 수비가 별로인가? 라고 하면 아직 그렇다고 보긴 힘들다. 애초에 빅플레이 자체가 변동성이 있는 사항이라 아직 안터졌다고 볼수도 있고, 새로이 교체된 라인배커와 세이프티진형도 계속 성장을 하고 호흡을 맞춰나가면 시즌 중후반부터 충분히 몰아칠수도 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">실점<\/th><th class=\"r\">허용 플레이당 야드<\/th><th class=\"r\">플레이당 EPA<\/th><th class=\"r\">패스 EPA<\/th><th class=\"r\">러닝 EPA<\/th><th class=\"r\">턴오버<\/th><th class=\"r\">빅플레이 허용<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">25시즌<\/td><td class=\"r\">2위<\/td><td class=\"r\">4위<\/td><td class=\"r\">1위<\/td><td class=\"r\">1위<\/td><td class=\"r\">2위<\/td><td class=\"r\">3위<\/td><td class=\"r\">4위<\/td><\/tr><tr><td class=\"l\">26시즌<\/td><td class=\"r\">26위<\/td><td class=\"r\">14위<\/td><td class=\"r\">21위<\/td><td class=\"r\">25위<\/td><td class=\"r\">11위<\/td><td class=\"r\">22위<\/td><td class=\"r\">25위<\/td><\/tr><\/tbody><\/table><\/div><p>다만 시즌 전체를 놓고 보았을 때, 텍산스의 팬이라면 걱정이 되는 것은 이미 패배가 너무 많다. 아무리 플레이오프 자리가 하나 늘었다고 해도 0승 4패의 굴레는 쉽게 벗어나기 어렵고, 강력한 수비와 가장 궁합이 좋은 러닝이 전혀 풀리지 않는 것 또한 걱정이 되는 부분이다. 다만 이번 경기 다행이었던 것은 니코 콜린스가 돌아오면서 공격 쪽 경기력 자체가 크게 향상된게 분명히 느껴졌고 CJ 스트라우드도 데뷔시즌 만큼은 아니지만 리그의 빛나는 샛별 중 하나로서의 폼(니코 콜린스만 있다면)은 분명히 회복한듯하다.<\/p>","401872968":"<p>개인적으로 이번 주 전체적으로 경기들이 반칙이 너무 많이 불려서 좀 재미가 덜 했는데 개중에서도 반칙이 덜 불렸던 게임에도 불구하고, 덜 익사이팅한 게임이었다. 버커니어스는 베이커 메이필드의 부상, 수비에서 핵심선수들의 부진 등등으로 폼이 너무나 크게 떨어져 있었는데 그 추세를 이어나갔고, 그런 버커니어스를 상대로 압도적인 경기력을 보여주지 못한 패커스가 정말 간신히 승리를 한 경기였다.<\/p><p>버커니어스 입장에서보면 루키 쿼터백이자 언드래프티드, 즉 아무데서도 뽑아주지 않은 루키 제일런 대니얼스가 부상당한 베이커 메이필드의 빈자리를 채우러 나왔다. 전반적으로 나쁘지는 않았다. 의사결정도 꽤나 깔끔했고, 무엇보다 중간중간 발로 만드는 플레이들(8번의 러싱시도 55러싱야드)들은 패커스의 빈틈을 찌르면서 꽤나 좋았는데, 두번의 중요한 의사결정 실수들이 있었고, 그것들이 모두 인터셉션으로 이어지면서 패배를 기록했다. 꽤나 열화된 1년차 드레이크 메이의 모습들이 언뜻언뜻 보이긴 했는데, 이 역시나 언드래프티드 루키라 기대감이 낮은걸 감안한 평가라는것도 감안해야할듯하다.<\/p><p>그외의 부분에서 버커니어스는 이제 더이상 강팀이자 NFC 남부지구의 맹주라고 부르긴 어려워 보인다. 한때 이글스와 함께 리그에서 탑 2 급 평가를 받던 오라인은 시간이 좀 지났는지, 이글스와 함께 동반 추락하고 있고, 이를 반영하듯 러닝게임에서 영 아무런 족적도 내지 못하고 있다. 이번 게임에서도 쿼터백의 러싱과 리시버의 러싱을 제외하면 시도당 3야드를 간신히 넘는 성적을 거뒀다. 거기에 수퍼볼 우승의 가장 큰 힘 중 하나였던 타드 보울스 감독의 수비진도 힘이 크게 빠졌다. 물론 0승 4패라는 현재 성적만큼이나 최악인 것은 아니지만, 팀의 허리를 잡아주던 라인배커진형에서의 폼이 정말 급격하게 떨어졌고, 이번 게임에서도 그러한 모습이 여실히 드러났다. 패커스는 이번 게임에서 13퍼스널 - 1명의 러닝백 3명의 타이트엔드 전술 - 을 16번이나 쓰면서 버커니어스가 라인배커를 반드시 써야만 하는 전술을 강요했는데, 그 포메이션에서 128야드를 기록하면서 버커니어스의 수비에 약점을 크게 노출 시켰다. 아마 올해 감독직이 가장 위태로운 대표적 팀이 될 것이다.<\/p><p>패커스의 사정도 크게 다르진 않다... 맷 르푸어 감독은 굉장히 클래스가 있는 감독이라고 생각한다. 전년도 디비전 라이벌인 베어스에게 충격적이고 극적인 역전패를 2번이나 당했는데, 그정도의 충격이라면 그 트라우마로 팀의 모든 기세가 고꾸라지는건 프로스포츠에서 굉장히 흔한 일이다. 하지만 맷 르푸어 정도 되는 인물이기에 이 온 사방에서 구멍이나고 팀의 멘탈이 꺽인 상황에서 간신히 중심을 잡고 있는 것으로 보인다.<\/p><p>패커스의 오라인은 온갖 부상으로 인해 현재 리그에서 최하위권이라고 봐도 무방하다. 안그래도 패커스는 네임드 오라인 없이, 오라인 포지션을 자유롭게 변경해가며 게임을 운영하는 독특한 팀이었는데, 부상이 쌓여서 이제는 정말 누가 오라인인지도 모를 지경이고, 거기에 러닝백 조쉬 제이콥스가 폼이 들쭉날쭉하다 하지만, 그가 없으니 러닝은 리그에서 경기당 러싱야드가 최하위로 떨어져버렸다. 거기에 수비에서도 부상이 차곡차곡 쌓이고 있는데, 팀에서 중심 역할을 해주던 에저린 쿠퍼까지 이번 게임에서 부상을 당하면서 아.. 하고 암담해졌다.<\/p><p>물론, 안좋은것만 있는 점은 아니다. 위에 말했듯이 맷 르푸어 감독은 상대를 분석해서 그에 맞는 전술(이번 게임 13퍼스널의 기용은 근 10년 패커스의 역사에서 최다)을 고안해내고 있고, 수비쪽에서도 마이카 파슨스가 돌아온다. 마이카 파슨스는 어느 팀에 가더라도 그 팀이 차이를 내게 만들 수 있는 인물이기에 기대가 되고, 더욱 긍정적으로 볼 만한 부분은 그의 짝궁이자 반대쪽에서 쇄도할 선수인 루카스 반네스가 이번 경기도 포함해서 최근에 폼이 쭉 오르고 있다는 점이다.<\/p><p>허나 그럼에도 불구하고 최근 패커스의 공격 쪽 특히 오라인의 보호와 러닝게임의 붕괴를 보고 있으면 왠만한 수비로는 이를 커버하기 어렵다. 쿼터백인 조던 러브가 정말 특출나게 잘해야지만 맷 르푸어 시대의 가장 큰 위기인 지금을 극복 할 수 있을 것으로 보인다. 실제로 조던 러브는 상대의 압박과 블리츠에 대해서 나름 나쁘지 않은 성적을 보이고 있다. 이번 게임에서도 8번의 블리츠에서 6번의 패스를 성공하였고 시도당 7야드에 터치다운을 하나 기록했다. 하지만 문제가 되는 것은 한번씩 나오는 실수들이다. 이번 경기에서도 블리츠에서 인터셉션이 나오면서 경기에 치명적인 영향을 끼칠 뻔했다. 오라인의 압박이 계속되는 와중에 이런 요구사항이 과할수도 있지만, 지금 패커스가 위치한 상황은 이를 해내야하는 상황이고, 개인적으로 조던 러브가 이를 해낼 수 있을지의 여부에서 가장 큰변수가 될 인물은 타이트엔드인 터커 크래프트일 것이다. 블로킹에 대응도 되고 블리츠에 대한 대응에서 가장 먼저 찾게 되는 타겟에, 짧은 러닝플레이도 대응할 수 있는 포지션이 타이트엔드이기도 하고, 터커 크래프트(물론 전시즌 부상전)는 이런 짧은 패스를 빅플레이로 연결도 했었기 때문에 그가 살아나기 시작하면 패커스가 이 위기를 이겨내는데 가장 키 플레이어가 되지 않을까 싶다.<\/p>","401872969":"<p>이번 주 전반적으로 반칙이 많았는데 그 중에서도 유독 반칙이 많았던 게임이다. 재규어스는 13개, 뱅갈스는 11개의 반칙으로 양팀 도합해서 24개의 반칙이 나왔다. 그냥 평시의 반칙이 아니라 경기의 방향을 뒤집을만한 중요한 순간에서 반칙이 많았다. 뱅갈스는 터치다운 1개, 잭슨빌 재규어스는 2개의 터치다운과 인터셉션을 반칙으로 잃어버리는 그야말로 안풀리는 경기에서도 잭슨빌 재규어스가 후반에 몰아치면서 꾸역꾸역 승리를 거두었고 자신들이 강팀이라는걸 증명했다고 본다.<\/p><p>반칙을 제외하면, 왜 재규어스가 자신들이 강팀인가를 여러모로 보여준 게임이었다. 우선 수비쪽에서부터 보면 지난시즌부터 재규어스 수비의 강점 중 하나이던 강력한 러닝 수비가 나왔다. 전년도 핵심 미들라인배커인 데빈 로이드가 팀을 떠난 상황에서도 이 기세는 여전하다. 이번 게임 그야말로 뱅갈스의 러닝을 틀어막아버렸는데, 시즌 초반기에 보여주던 강세를 이어갔다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">러닝시도 당 야드<\/th><th class=\"r\">터치다운<\/th><th class=\"r\">성공률<\/th><th class=\"r\">10+야드<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">VS 뱅갈스<\/td><td class=\"r\">1.38야드<\/td><td class=\"r\">1개<\/td><td class=\"r\">23.1%<\/td><td class=\"r\">0개<\/td><\/tr><tr><td class=\"l\">26시즌<\/td><td class=\"r\">3.20야드 (2위)<\/td><td class=\"r\">2개 (6위)<\/td><td class=\"r\">35.0% (7위)<\/td><td class=\"r\">5개 (3위)<\/td><\/tr><\/tbody><\/table><\/div><p>그리고 여기에 전년도 1라운드 2번픽이자 리시버와 코너백 둘다 뛰던 인재인 트레비스 헌터는 팀의 1번 코너백으로서 자신의 클라스를 보이고 있다. 리시버를 따라가는 순간적인 움직임, 공의 포착순간에 나가는 팔, 기회가 생겼을 때는 인터셉션까지 팀의 1번을 넘어서 리그의 탑티어 코너백까지도 올라갈 수 있지 않을까 하는 드래프트 전의 기대감을 한층 살리고 있다. 이번 게임에서 뱅갈스는 몇 번
