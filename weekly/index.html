 그의 쪽으로 던지다가, 트레베스 헌터가 있는 쪽은 포기해버렸다. 그의 반대쪽에 위치한 자리안 존스는 이번 게임에서 18번의 패스타겟이 되었는데, 이는 트레비스 헌터의 이번 시즌 타겟인 17회보다도 많은 타겟이었다. 그리고 이번 경기 그의 플레이들을 보면 왜 그를 피해서 패스를 했는지 느끼게 해주는데, 조 버로우가 압박을 받는 상황에서 패스를 살짝 던졌는데 그걸 놓치지 않고 인터셉션을 하는 플레이 (물론 반칙으로 무산되긴 함)나 리시버가 짧게 바깥으로 빠졌다가 앞으로 쭉 달리는 루트에서 밖으로 나가는 루트에 몸이 실렸는데 순간적으로 방향을 전환하고는 악셀을 밟아서 공을 쳐내는 플레이나, 리시버가 쿼터백을 위해 자신의 위치를 조금 앞쪽으로 조정하는걸 귀신같이 캐치해서 순간적으로 달려나가서 리시버의 손 사이에 공을 쳐내는 모습들은 정말 인상적이었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/cWSf3PnVxhY\" title=\"YouTube\"><\/iframe><\/div><p>공격쪽에서는 여전히 강력했다. 팀의 1번 리시버인 파커 워싱턴이 단 하나의 캐치로 게임을 끝냈다고 하면, 잭슨빌 재규어스의 공격이 오늘 부진했구나 싶을텐데 전혀 아니었다. 이번 게임의 주인공은 타이트엔드 브랜든 스트레인지였다. 브랜튼 스트레인지는 이번 게임 1ST 다운을 5개 만들었는데, 이날 잭슨빌 재규어스가 패스로 만든 1ST 다운 (11개)의 거의 반에 가까운 수치이다. 그는 총 7번의 캐치로 95야드를 만들어냈는데, YAC 즉 공을 잡은 다음에 달린야드가 무려 56야드에 달할정도로 이번 잭슨빌 재규어스의 승리의 주역이 되었다. 뱅갈스의 수비진이 라인배커진에서 약하다는 걸 알고 있기에 나온 경기 컨셉이 아닐까 싶었는데 정말 주효했다. 실제로 라인배커들이 있는 해쉬마크 안쪽 즉 중앙 지역쪽에서 트레버로렌스는 이날 18번의 패스시도를 했고 그중에 16개가 성공하고 통합 188야드 1터치다운을 만들어냈다. 최근에 트레버 로렌스의 기세가 MVP 3순위 안에 들텐데, 이번에도 그 기세를 이어나갔다. 정교하고 과감한 패스와 플레이의 설계속에 수비의 위치를 묶어두는 시선처리까지 엄청나다. 이번 게임 터치다운에서도 라인배커들이 골라인 바로 앞에 서있는걸 알고 그 앞으로 가는 루트의 선수에게 시선을 주면서 수비를 묶어놓다가 그 뒤로 파고드는 리시버인 브라이언 토마스 주니어에게 빨랫줄같은 패스는 어마어마했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/JoBsPIwuEf4\" title=\"YouTube\"><\/iframe><\/div><p>여기에 이번 게임에서도 러닝을 100야드 넘게 하면서 시도당 4.7야드를 기록했는데(반칙으로 무위가 돌아간 러닝 터치다운까지하면 시도당 7야드에 다다른다) 러닝이 이렇게 먹히게 되면 라인배커들은 그 러닝에 속을 수 밖에 없고, 안 그래도 역량이 좀 부족한 뱅갈스의 라인배커진은 속수무책으로 당했다. 아래 영상의 첫번째 플레이는 다수의 타이트엔드를 넣고 진형까지 좁게 잡아서 러닝인척 포지션을 짠다. 그러고는 브랜튼을 풀백 자리로 옮겨놓는다. 오라인은 이 타이트엔드 앞을 비우는 형태로 블로킹을 열고, 브랜튼은 그 방향으로 블로킹하듯 움직인다. 여기에 러닝백조차 그를 따라가는 움직임을 취하니까 라인배커들은 꼼짝 없이 속을 수 밖에 없었는데, 정작 브랜튼은 블로킹하는척 액션만 취하고는 유유하게 밖으로 빠져나가서 완전 오픈이 된다. 트레버 로렌스의 이번게임 몇안되는 빅패스 실패라 무위로 돌아가긴 했지만, 그야말로 기가막힌 플레이 설계라고 볼 수 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/Tg9SeiIwK4c\" title=\"YouTube\"><\/iframe><\/div><p>뱅갈스의 입장에서는 고민이 많이 되는 경기결과일 것이다. 공격측에서 보면 뱅갈스의 러닝은 여전히 아무것도 보여주지 못했다. 이번 게임에 극악의 러닝 시도당 1.38야드라는 졸전을 벌였는데, 이번 시즌 전반적으로 봤을 때도 경기당 러싱야드는 31위, 성공률은 20위로 리그 최약체 중 하나의 러닝을 보여주고 있다. 이는 뱅갈스의 전술과 구조적으로도 연결되는데, 뱅갈스는 리그에서 가장 언더센 (러닝친화적인 쿼터백이 센터 바로 뒤에 있는 전술)을 안하는 팀 중 하나이다. 이번 시즌 벵갈스는 언더센터 비율을 17%에서 27%까지 거의 2배가까이 올렸는데, 이 비율도 대 언더센터의 시대가 되어가고 있는 현대 NFL에서는 너무나 빈약한 숫자이다. 그렇다고 이게 안 좋기만 한것이냐? 그렇지는 않다. 조 버로우가 인터뷰에서도 패스를 너무 많이 하는거 아니냐? 에 대한 질문에 더했어야했다 라고 대답했던 것처럼, 지난 몇 년간 뱅갈스의 정체성은 샷건에서 리시버들을 펼치고 거기서 나오는 패스 게임이었다. 그것으로 몇 년간 리그의 탑 10 대부분 탑5권 공격력을 보였기에 흠잡기는 어렵다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">언더센터 비율<\/th><th class=\"r\">순위<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">25시즌<\/td><td class=\"r\">17.3%<\/td><td class=\"r\">31위<\/td><\/tr><tr><td class=\"l\">26시즌<\/td><td class=\"r\">26.7%<\/td><td class=\"r\">31위<\/td><\/tr><\/tbody><\/table><\/div><p>문제는, 이 전술이 성공하기 위해서는 조버로우 - 자말체이스 - 티히긴스라는 엘리트급 쿼터백과 리그 최강의 리시버 듀오 조합이 있어야 하는데 이번 게임에서처럼 자말체이스가 부상으로 빠지고 티 히긴스까지 빠지면 이걸 이대로 유지하는게 맞나에 대한 큰 고민이 생긴다. 그렇다고 갑자기 언더센터로 바꾸자니, 이번 오프시즌에 뱅갈스는 꾸준히 언더센터를 해보려는 시도 하면서 공격을 다변화하려 했는데 큰 성과를 거두지 못했다는 보도들을 보면 갑작스러운 변화도 그렇게 좋은 의사결정은 아닐 수 있다. 이러지도 저러지도 못하는 상황에서 조 버로우의 엄청난 수비 정보 분석 능력과 의사결정 능력에 기대야하는데, 이번 게임처럼 안그래도 1차원적인 공격(패스일변도)이 그 공격을 불태워줄 스타플레이어들 마저 빠지면 수비 입장에서 공략이 너무 쉬워지고 그 실수 안하는 조 버로우도 수비를 보지 못하고 인터셉션 패스를 던지는 참사가 일어나게 될 수 있다는 점이다.<\/p><p>수비쪽에서도 중요한 포인트 중 하나는 덱스터 로렌스의 유무가 팀의 수비 성과에 너무 큰 영향을 끼치고 있다는 점이다. 그가 있고 없을 때 특히나 차이가 나는 것은 러닝 수비인데, 로렌스가 있을 때 1/4분기 뱅갈스는 리그에서 가장 러닝 수비를 잘하는 팀 중 하나이지만, 그가 없을 때는 리그에서 가장 러닝을 못막는 팀들 중 하나이다. 그리고 러닝을 못막기 시작하면 이번 게임에서처럼 그들의 약한 라인배커진형이 더욱더 노출이 되면서 총체적 난국이 된다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">러닝 EPA<\/th><th class=\"r\">시도 당 야드<\/th><th class=\"r\">패스 EPA<\/th><th class=\"r\">시도당 야드<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">4주차 덱스터 로렌스 참여<\/td><td class=\"r\">-0.08<\/td><td class=\"r\">3.47야드<\/td><td class=\"r\">+0.28<\/td><td class=\"r\">6.86야드<\/td><\/tr><tr><td class=\"l\">4주차 덱스터 로렌스 미참여<\/td><td class=\"r\">+0.41<\/td><td class=\"r\">7.83야드<\/td><td class=\"r\">+0.82<\/td><td class=\"r\">12.20야드<\/td><\/tr><tr><td class=\"l\"><\/td><td class=\"r\"><\/td><td class=\"r\"><\/td><td class=\"r\"><\/td><td class=\"r\"><\/td><\/tr><tr><td class=\"l\">26시즌 덱스터 로렌스 스냅 참여<\/td><td class=\"r\">-0.25 (1위)<\/td><td class=\"r\">3.44야드 (7위)<\/td><td class=\"r\">+0.00 (11위)<\/td><td class=\"r\">6.84야드 (24위)<\/td><\/tr><tr><td class=\"l\">26시즌 덱스터 로렌스 스냅 미참여<\/td><td class=\"r\">+0.25 (32위)<\/td><td class=\"r\">6.61야드 (32위)<\/td><td class=\"r\">+0.02 (12위)<\/td><td class=\"r\">6.17야드 (14위)<\/td><\/tr><\/tbody><\/table><\/div>","401872970":"<p>시즌 전에 가장 강한 팀 중 하나라 평가받던 두 팀, 하지만 동시에 이번 시즌 시작이 뜻대로 펼쳐지며 애매모호한, 상황의 두 팀 간의 대결이었다. 이 경기에서 패배를 하는 팀은 애매모호를 넘어서 어 이제는 좀... 위험한거 아니야? 로 넘어가는 굉장히 중요한 게임이었는데, 램즈가 전반전 20-10으로 뒤쳐지던 게임을 뒤집어 엎는 승리를 하면서 한시름 놓을 수 있게 되었고 이글스의 경우에는 좀 큰 경고음이 어울리게 되었다.<\/p><p>이글스 입장에서는 탄식이 나오는 경기일 것이다. 20-10 전반전으로 승리하고 있었던걸 역전패당한것도 속상한데, 사실 그 점수까지 가는데도 이글스의 공격이 크게 잘했다기엔 램즈 쪽에서 실수가 잇따라 난 덕이었기 때문이다. 램즈가 인터셉션을 2개나 하면서 이글스는 전반전 내내 좋은 위치에서 공격권을 시작했다. 전반전 7번의 공격권 중에 3번이 램즈 진영 28야드, 17야드 35야드 에서 이뤄졌고, 자신들의 진영에서 만들어낸 4번의 공격권은 모두 펀트이거나 장거리 필드골일 뿐일 정도로 필드를 잘 전진 할 수 없었다. 전반전에 7개의 써드다운에서 한번도 갱신하지 못했는데, 이 기세는 후반전까지 이어져서 경기 내내 12번의 써드다운에서 단 하나의 갱신도 하지 못했다. 특히나, 이글스 팬 입장에서 가장 속이 터졌을 순간은 4Q 08:17 골라인 코앞의 써드다운을 갱신 성공시키지 못했던 순간일 것이다. 당시 경기는 20 - 10으로 이글스가 아직 앞서고 있던 상황이라 여기서 터치다운을 만들어내면 27-10으로 이글스가 크게 앞섰을건데, 여기서 스냅실수가 나오면서 갱신에 실패했다. 플레이를 다시보면 스냅의 순간에 레프트가드인 캠 저긴스가 사실 조금 빨리 움직이면서 불리지 않은 폴스스타트 반칙이 있었다. 이 때 움직임에서 손이 뻗어있느라 스냅 과정을 방해했고, 허츠가 어렵게 공을 가다듬고 자기가 뛰었지만 부족했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ngYDPHZiVMo\" title=\"YouTube\"><\/iframe><\/div><p>팬 입장에서 이 플레이가 아쉬운건 이글스의 3인 블로킹이 정말 좋은각으로 잘 풀렸었는데, 이 실수 하나로 플레이를 넘어 게임까지 그르쳤기 때문이다(팬들 속이 터졌을 것이다). 이 3rd다운 시도 이후에 4th다운에서도 이글스는 한번 더 시도를 했는데 이마저 실패하면서 잠들어있던 램즈의 공격이 깨어나는 계기가 되었다. 이 플레이에서 왜 필드골을 안차고 고포잇을 했는가에 대한 의문도 있지만, 개인적으로 이 결정은 그럴 수 있다고 본다. 20-10인 상황에서 킥을 차건, 고포잇을 실패를 하건 상대에게 2개의 터치다운을 내주면 역전이 당하는건 동일하기 때문이다. 오히려 더 큰 문제는 꼭 이렇게 짧은 거리에서 러닝이 배제된 샷건 포메이션으로 나갔어야했을까? 에 대한 의문은 든다.<\/p><p>수비쪽에서는 지난 경기보다 나아진 모습을 보인 긍정적 포인트도 있지만, 앞으로를 생각했을 때 공격쪽의 부진은 큰 고민이 들게한다. 제일런 허츠를 위시로 한 이글스의 쿼터백과 공격코치진은 이번 경기 내내 램즈의 블리츠에 아무런 대답도 내놓지 못하고 계속해서 당했다. 세이콴 바클리가 부상당해서 빠지고, 팀의 에이스 역할을 해줄 드본타 스미스도 부상으로 빠진 상황, 오라인쪽에서도 부상이 계속 쌓인 상황에 허츠의 가장 든든한 방패가 되어주었던 라이트 태클 레인존슨마저 은퇴를 선언하면서, 이글스의 앞날에는 정말 지독한 먹구름이 껴있다고 해도 과언이 아니다.<\/p><p>램즈의 입장에서도 보면, 불안불안한 경기에서 다행히 승리를 거둬서 최악의 상황은 피하게 되었다고 볼 수있다. 스탯적으로 보면 나쁠 것은 없다. 문제라고 평가받던 써드다운에서도 7/16, 43%의 갱신율을 보이면서 선전했고, 이번 게임에서도 상대에 비해 200야드 가까이 더 전진을 하면서 좋은데? 라고 생각하는 면들이 있었다. 하지만 경기를 보고나서 이런 스탯들을 들으면 음 그래? 그정도는 아닌것 같던데 라는 의문이 생길 것이다. 그만큼 램즈의 공격은 우리가 기대하던 수준, 전년도 리그의 최정상급이어던 포스와는 차이가 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">득점<\/th><th class=\"r\">야드<\/th><th class=\"r\">EPA/플레이<\/th><th class=\"r\">턴오버<\/th><th class=\"r\">빅플레이<\/th><th class=\"r\">써드다운 전환율<\/th><th class=\"r\">레드존 성공률<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">26시즌<\/td><td class=\"r\">19위<\/td><td class=\"r\">2위<\/td><td class=\"r\">11위<\/td><td class=\"r\">26위<\/td><td class=\"r\">10위<\/td><td class=\"r\">10위<\/td><td class=\"r\">27위<\/td><\/tr><tr><td class=\"l\">25시즌<\/td><td class=\"r\">1위<\/td><td class=\"r\">1위<\/td><td class=\"r\">2위<\/td><td class=\"r\">6위<\/td><td class=\"r\">1위<\/td><td class=\"r\">14위<\/td><td class=\"r\">6위<\/td><\/tr><\/tbody><\/table><\/div><p>왜 그런 것일까? 에 대해서는 크게 걱정하지 않아도 될 요인들과 걱정이 되는 요인으로 나눌수 있을 것인데, 전자에 해당하는 것은 부상이다. 램즈에서는 팀의 초특급 에이스인 푸카 나쿠아가 계속해서 부상으로 빠져있었고, 이번 게임에서도 돌아왔지만 본인이 인터뷰에서도 밝히듯이 아직 풀 컨디션은 아니라고 했다. 물론 그런 와중에도 미친 캐치를 해내는건 소름이었다. 또 하나, 멀티 타이트엔드 전술 - 현재 램즈의 가장 큰 전술적 정체성 - 에서 캐치 역할을 해주던 테런스 퍼거슨도 부상인 부분도 고려를 해야한다. 걱정할만한 포인트 중 가장 큰 것은 쿼터백 매튜 스태포드이다. 88년생, 2009년도 1라운드 픽인 매튜 스태포드는 전년도 MVP를 수상하며 엄청난 포스를 작년에 보여주었는데, 이번 시즌에는 꽤나 크게 흔들리고 있다. 나이든 쿼터백들에게서 보이는 가장 큰 현상 중에 하나인 히트 즉 수비로부터의 쌕을 극도로 피하는 모습들이 경기중에도 꽤나 나오고 있는데, 압박을 받을 때와 아닐 때의 간극이 굉장히 심하다. 물론, 스태포드는 늘 기동력이 없는 쿼터백이었다보니, 압박을 받는 상황에서 성적이 급감하는 것은 커리어 내내 있어왔던 일이라고 치부할 수도 있지만, 이번 시즌 그의 나이를 생각했을 때, 시즌 초반에 보여주는 압박이 있었을 때, 극도로 부진한 모습이 그냥 무시하고 넘어갈만한 일은 아닐 것으로 보인다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">패스 성공률<\/th><th class=\"r\">시도당 야드<\/th><th class=\"r\">인터셉션<\/th><th class=\"r\">턴오버 워디 플레이 비중<\/th><th class=\"r\">패서레이팅<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">26시즌 - 포켓이 클린할 때<\/td><td class=\"r\">72.1%<\/td><td class=\"r\">8.5야드<\/td><td class=\"r\">3회<\/td><td class=\"r\">2.4%<\/td><td class=\"r\">104.1<\/td><\/tr><tr><td class=\"l\">26시즌 - 압박이 있을 때<\/td><td class=\"r\">37.3% (30위)<\/td><td class=\"r\">4.9야드 (24위)<\/td><td class=\"r\">3회<\/td><td class=\"r\">8.1% (27위)<\/td><td class=\"r\">29.1 (21위)<\/td><\/tr><tr><td class=\"l\"><\/td><td class=\"r\"><\/td><td class=\"r\"><\/td><td class=\"r\"><\/td><td class=\"r\"><\/td><td class=\"r\"><\/td><\/tr><tr><td class=\"l\">25시즌 - 포켓이 클린할 때<\/td><td class=\"r\">70.0%<\/td><td class=\"r\">8.5야드<\/td><td class=\"r\">8회<\/td><td class=\"r\">2.0%<\/td><td class=\"r\">118.0<\/td><\/tr><tr><td class=\"l\">25시즌 - 압박이 있을 때<\/td><td class=\"r\">47.1%<\/td><td class=\"r\">6.4야드<\/td><td class=\"r\">1회<\/td><td class=\"r\">5.8%<\/td><td class=\"r\">78.8<\/td><\/tr><\/tbody><\/table><\/div><p>그런면에서 이번 게임 러닝백 카이렌 윌리엄스의 대활약과 푸카나쿠아의 복귀는 굉장히 고무적이다. 실제로 이 둘이 이번 게임을 살려냈다고 해도 과언이 아닐정도로 잘했는데, 카이렌 윌리엄스는 이글스의 4TH다운 시도 실패 뒤에 두번의 공격권에서 모두 터치다운을 기록하면서 이번 게임 가장 대활약한 인물이 되었다. 그러면 왜 이 둘이 중요하느냐, 스태포드가 압박에 취약한 모습이 뚜렷이 나타나고 있으니, 그가 압박을 안받게끔 하는게 가장 중요한데, 쿼터백이 가장 큰 압박을 받는 상황은 3RD &amp; LONG 즉 써드다운에 갱신할 거리가 많이 남아서 반드시 패스를 해야하는 상황이다. 이런 경우에 1선 수비는 러닝을 의식할 필요가 전혀 없다보니 마음놓고 쇄도에만 집중을 할 수 있고, 이는 추가적인 블리츠 없이도(블리츠가 있다면 더더욱) 쿼터백이 압박받을 가능성이 늘어나게 되는 것이다. 그렇다면 3RD &amp; LONG에 처하지 않게 되는 것이 램즈 입장에서 가장 큰 성공의 길이라고도 할 수 있는 것인데, 이를 가능하게 만들어주는 것이 바로 러닝 게임이다. 러닝이 살아나면 초반 2번의 다운에서 3~4야드씩 간다면 3RD &amp; SHORT에 위치할 수 있게 되기 때문이다. 카이렌 윌리엄스의 러닝은 굉장히 종적인 즉 내곽 오라인맨 뒤로 따라가면서 파고드는 러닝이고 푸카나쿠아는 외곽에서 스냅하자마자 공이 던져지는 짧은 스크린 패스(오라인이 쇄도를 당해주는 척하고는 튀어나가서 전진블로킹을 하는 전술)을 주력으로 삼는데, 이는 카이렌 윌리엄스에게 없는 횡적인 러닝 요소를 보완해준다.<\/p>","401872971":"<p>디비전 라이벌들과의 대결, 경기가 엎치락 뒤치락 하는 와중에 최종적으로 조쉬알렌의 인터셉션으로 경기가 페이트리어츠의 승리로 마무리 되었다. 3승 0패로 강력한 포스를 보여주던 버팔로 빌스에게, 곤욕에 처해있던 뉴잉글랜드 페이트리어츠가 한방 크게 먹인 셈이 되었는데, 페이트리어츠 팬들 입장에서는 전년도 자신들이 슈퍼볼까지 갔던 랠리의 시작이 빌스전이었다는 점에서 좀 더 의미부여를 할 수 있지 않을까 싶다.<\/p><p>이번 경기의 가장 중요한 포인트에 대해 이야기하자. 드레이크 메이가 이번 시즌 초에 끔찍한 모습을 보이더니, 이번 게임에서는 전년도에 보여주었던 모습과 더 비슷한 모습을 보였다. 포켓 안에서의 움직임이 훨씬 더 명료했다. 주저하는 움직임들이 확연히 줄었고, 답이 안나올때는 과감하게 자신의 다리로 게임을 풀어갔다. 메이는 이번 게임 러싱시도가 8번, 러싱야드는 54야드를 기록했다. 개인적으로 메이가 폼이 돌아오기 위해서는 다리를 더 활용하게 하고 쉽게 성공할 간단한 패스들을 중심으로 게임을 풀어내는게 중요하지 싶었다. 근데, 페이트리어츠가 선택한 방법은 다리로 게임을 푸는건 맞는데, 짧고 간단한 패스보다는 리시버와 수비가 1대1이 되는 딥패스들을 중심으로 플레이하는 것이었다. 그리고 3개의 요소들이 전반적으로 잘 맞아떨어지면서 이 접근이 성공을 거뒀다. 첫번째는 전술적으로도 이전 경기들에 비해 응축된 전술(리시버들이 가로로 넓게 포진한게 아니라 좁게 포진한 전술)을 훨씬 많이 쓰고, 모션과 플레이 액션 패스의 비중도 확 늘린 것이다. 이게 주는 가치는 상대가 우선적으로 러닝을 의식하다보니, 리시버가 2선수비와 1대1로 포진하게 되는 경우가 많아지고, 모션을 통해서 드레이크 메이에게 지금 수비가 맨투맨인지 지역수비인지에 대한 힌트가 훨씬 더 많이 간다는 것이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">모션 사용 비중<\/th><th class=\"r\">플레이 액션 비중<\/th><th class=\"r\">응축된 포메이션 비중<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">1~3주차<\/td><td class=\"r\">32%<\/td><td class=\"r\">13%<\/td><td class=\"r\">23%<\/td><\/tr><tr><td class=\"l\">4주차<\/td><td class=\"r\">52%<\/td><td class=\"r\">20%<\/td><td class=\"r\">38%<\/td><\/tr><\/tbody><\/table><\/div><p>둘째로는 메이의 성장이다. 위에서 말한 포켓 안에서 패스각이 안나오면 바로 러닝으로 전환하는것도 아주 좋았는데, 그 외에도 차분하게 수비의 움직임을 분석하는 게 굉장히 좋았다. 차분하게 고개를 돌려가며 자신이 읽어야할 곳들을 차례차례 읽는 걸 보면 이전 경기들에서 있던 다급함이 확연히 준듯한 모습이 보였고, 그렇게 필드를 바라보다가 나가는 과감한 딥패스들이 정말 정확했다. 특히나 아래 영상에서 두번째 플레이를 보면 플레이는 오른쪽으로 짧게 스크린을 거는듯 하게 움직이고는 반대쪽으로 깊게 달리는 1대1의 리시버에게 빅패스를 연결하는 플레이인데, 오른쪽으로 페이크를 줘서 수비를 끌었다가 왼쪽으로 고개를 돌려서 패스를 던지는 타이밍까지 숙련된 쿼터백의 모습이었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/eWZ_7wgjC3I\" title=\"YouTube\"><\/iframe><\/div><p>마지막 요소는 페이트리어츠 다른 선수들의 분전이다. 우선, 오라인이 생각보다 굉장히 잘 버텨주었다. 게임이 끝나고 수치상으로 메이는 이번 경기에 패스들의 43% 가까이 압박을 받으면서 지난 몇주간 계속 나오던 오라인의 자동문 이슈가 지속되었다고 생각할 수 있지만 실상은 그렇지 않다. 메이가 포켓안에서 생각보다 굉장히 차분하게 필드를 읽은 느낌이었는데, 데이터를 더 찾아보니 이번 게임에서 나온 대부분의 압박은 스냅 3초 이후에 이루어진 압박이었다. 그말인즉슨, 메이에게 유효한 압박은 극히 적었다는 것이다. 거기에, 리시버들 또한 굉장히 잘해주었다. 메이는 지속적으로 1대1의 상황에서 패스들을 던져줬는데 리시버들이 이 경합상황에서 캐치를 계속해서 잡아주었다. 로미오 돕스는 자신이 왜 이 팀에 들어오게 되었는지를 드디어 보여주었고, 후보에서 깜짝 등장한 리시버 치즘은 기가막힌 한손 캐치 터치다운을 기록하기도 했다.<\/p><p>그렇다면 메이가 앞으로도 폼을 회복하면서 전년도 MVP에 거론되는 모습을 유지할 수 있을 것인가? 물음에 대해서 아직 답을 하기엔 이르다. 왜냐하면 전술도 조금 바뀌었고, 본인도 의사결정을 좀 더 명료하게 한건 맞지만, 메이 자체도 펌블을 3개나 하면서 그의 약점인 손이 작다는 부분이 드러나기도 했고, 상대적으로 약한 빌스의 수비에 대해 페이트리어츠 팀 동료들이 잘 대응한 부분도 적지 않을 거라고 생각이 들기 때문이다. 상대하는 팀이 강팀이라면 이 매치업들에서 메이에게 제공했던 편의들을 제공할 수 있을까에 대한 걱정은 있다. 그나마 다행인 점은 AJ 브라운이 곧 돌아온 다는 점이다. AJ 브라운은 2선수비가 누구든간에 1대1에서 승리를 할 수 있는 인물이라 리시버 - 코너백 매치업에서는 큰 어드밴티지를 줄 것이다. 오라인 쪽에서의 열세는 쇄도가 강한팀을 만나면 어떻게 될지 걱정이 되지만, 이 부분에서도 AJ 브라운이 도움이 되지 싶다.<\/p><p>수비쪽은 공격보다 좀 더 긍정적인데, 이번 게임에서 수비코치 잭 커는 크리스챤 바모어와 크리스챤 곤잘레스가 없는 상황에서 빌스의 공격을 굉장히 잘막았다. 특히나 패스게임에서 아주 주효했는데, 지역수비와 맨투맨 수비를 골고루 섞어가면서 조쉬 알렌에게 계속 혼란을 주었고, 조 브래디와의 수싸움에서 계속해서 승리했다. 타겟으로 삼는 리시버를 먼저 막기도 하고, 최후방을 1명만 뒀다가 딥패스를 노리는 타이밍에는 2명을 놓기도 하고, 상대가 스크린을 할 타이밍을 귀신같이 캐치해서 미리 차단하는 플레이들이 아주 인상적이었다. 이를 가장 드러낸 포인트 중 하나가 상대의 에이스인 달튼 킨케이드와 DJ무어를 각각 2개의 캐치로만 제한한 점이다. 거기다가 올해 2라운드에 뽑은 게이브 제이커스가 패스러쉬에서 아주 인상적인 모습을 보인건 굉장히 고무적이다. 지난해 수준급이던 페이트리어츠 수비의 가장 큰 약점이 바로 패스러쉬였기에 게이브 활약이 좋아져서 이 부분이 보완되면, 수비가 생각보다 더 강해질 수 있을 것으로 보인다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/BPz2-_OBDms\" title=\"YouTube\"><\/iframe><\/div><p>빌스 입장에서는 걱정되던 부분들이 드러났다. 가장 큰 걱정 포인트는 조쉬 알렌 플레이의 높은 변동성이다. 이번 시즌 조브래디 공격코치가 감독으로 올라서면서, 공격코치일때보다 가장 큰 변화를 준 것 중 하나는 조쉬 알렌에게 좀 더 자유를 준 것이다. 이전 시즌들에는 아주 제한적인 상황에서만 조쉬알렌이 슈퍼맨 망토를 매게 했는데, 이제는 더 깊은 패스를 노리게 전술을 짜면서 조쉬-여포-알렌이 더 날뛸 수 있게 해준 것이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">26시즌<\/th><th class=\"r\">25시즌<\/th><th class=\"r\">24시즌<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">ADOT (평균 패스 비거리)<\/td><td class=\"r\">9.78<\/td><td class=\"r\">7.32<\/td><td class=\"r\">8.34<\/td><\/tr><\/tbody><\/table><\/div><p>문제는 이런 리스크 높은 플레이 자체가 변동성이 높다는 것이다. 특히나 경기의 마지막을 승부지은 인터셉션은 상대의 쇄도를 스핀무브로 기가막히게 피하고 난 다음에 나왔는데, 이 스핀무브로 쇄도를 피하는 것 자체를 알렌말고 누가 할 수 있을까 싶은 경이로운 움직임이었는데... 그 다음에 상대의 수비가 여러명 있는곳에 던지며 패배에 가장 결정직인 실수를 하게 되었다. 플레이를 돌려보면, 바깥쪽 짧게 오픈인 선수에게 던지지 않고 한번 더 욕심을 낸걸 확인할 수 있다. 경기시간이 남아 있어서 급할게 없었을텐데 욕심을 부리다가 실수가 나온 것 같은데, 그 전 플레이에서도 자신의 엔드존 근처에서 압박을 받는 상황에서 이해할 수 없고 영웅심리만 보이는 패스를 했었다. 물론 그냥 패스실패로 끝날 수 있었지만, 대부분 최소 인텐셔널 그라운딩으로 끝나거나 인터셉션 - 픽식스로 끝날 가능성도 굉장히 높은 플레이였다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/T84PMulV4x8\" title=\"YouTube\"><\/iframe><\/div><p>이번 경기 러닝을 상대로 페이트리어츠는 아무런 답도 내놓지 못하고 있었는데, 왜 그걸 더 안했나 이해가 잘 되지는 않는다. 타이트엔드 둘에 리시버 한 명을 오라인의 한쪽에 놓고 거기서 나오는 블로킹을 이용해서 러닝을 하는게 지난 몇 주간 빌스의 필승 러닝 전술 중 하나였는데, 이번 게임에서는 이 플레이를 잘 쓰지 않았다. 하지만 러닝 자체가 워낙 강하다보니 제임스쿡은 이번 게임에도 75러싱야드에 시도당 6.3야드를 기록하긴했다. 조쉬 알렌이 무리하는 느낌이 들었다 싶었을 때는 쿡에게 공을 20번씩 주며 러닝을 할 수도 있었는데 그리 하지 않은게 의아하다.<\/p><p>하지만 더 걱정되는 것은 빌스의 수비다. 엣지러셔 그렉 루쏘는 올해의 수비수에 언급될 정도의 활약을 보이고 있고, 내곽 수비라인맨인 디온 워커도 좋은 수비 퍼포먼스를 보이고 있지만, 정말 그 뿐이다. 쌕을 제외하고는 평균에 위치한 수치가 없을 정도로 빌스의 수비는 각종 지표에서 현재 최하위권에 위치해 있다. 신임 감독이 들어올 때 아직 자기의 선수들이 많이 없다보니 자주나타나는 현상이긴한데, 그럼에도 불구하고 이 팀의 부족한 수비 능력은 빌스의 시즌을 그르칠 정도의 암울한 1/4분기를 보내고 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"l\">빌스의 26시즌<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">경기 당 실점<\/td><td class=\"l\">25위<\/td><\/tr><tr><td class=\"l\">플레이당 EPA<\/td><td class=\"l\">29위<\/td><\/tr><tr><td class=\"l\">경기당 야드<\/td><td class=\"l\">27위<\/td><\/tr><tr><td class=\"l\"><\/td><td class=\"l\"><\/td><\/tr><tr><td class=\"l\">패스 EPA<\/td><td class=\"l\">26위<\/td><\/tr><tr><td class=\"l\">경기당 패스야드<\/td><td class=\"l\">29위<\/td><\/tr><tr><td class=\"l\"><\/td><td class=\"l\"><\/td><\/tr><tr><td class=\"l\">러닝 EPA<\/td><td class=\"l\">22위<\/td><\/tr><tr><td class=\"l\">경기당 러닝 야드<\/td><td class=\"l\">19위<\/td><\/tr><tr><td class=\"l\"><\/td><td class=\"l\"><\/td><\/tr><tr><td class=\"l\">쌕<\/td><td class=\"l\">8위<\/td><\/tr><tr><td class=\"l\">턴오버<\/td><td class=\"l\">12위<\/td><\/tr><tr><td class=\"l\"><\/td><td class=\"l\"><\/td><\/tr><tr><td class=\"l\">써드다운 방어율<\/td><td class=\"l\">19위<\/td><\/tr><tr><td class=\"l\">레드존 방어율<\/td><td class=\"l\">23위<\/td><\/tr><\/tbody><\/table><\/div>","401872972":"<p>베어스의 압도적인 경기력이 무엇인지 체감할 수 있는 경기였다. 베어스는 이날 러닝으로 250야드 가까이 공중으로 250야드 가까이를 내는 무시무시한 성적을 거뒀는데, 베어스가 34개의 퍼스트다운을 기록할 동안 제츠는 단 32개의 플레이를 펼쳤을 정도로 압도적인 경기력이었다.<\/p><p>베어스 팬들 입장에서는 지난 주 이글스전에서 베어스가 승리한다면 이런 그림이었겠다 하고 생각한대로 경기가 풀렸다. 러닝이 그야말로 무자비했다. 1번 러닝백인 디안드레 스위프트가 폼이 안좋아서(2번의 골라인 러닝 시도 실패, 1번의 펌블) 벤치로 내려간 때에 2번 러닝 백인 카일 모낭가이로 제츠의 수비진을 짓밟고 지나갔다. 모낭가이는 이날 145러싱야드에 2TD으로 자기 커리어 최고의 날 중 하나를 보냈는데, 이게 반영된게 이 게임 시간 점유율이 베어스는 42분 45초인데, 제츠는 17분 15초에 불과했다. 베어스의 러닝게임 대성공은 다넬라이트, 조나 스미스, 조 튜니를 중심으로 한 성공적인 오라인의 인원 개편, 디안드레스위프트, 카일 모낭가이라는 좋은 러닝백들, 다수의 타이트엔드로 구성된 선수진, 그리고 리시버들의 블로킹을 유도하는 강력한 팀문화 등의 요소가 너무 잘 섞여서 일어나고 있고, 이 모든걸 가능하게 한 사람은 벤 존슨이다. 이번 게임에서도 3번째 터치다운에서는 몇몇 디테일한 모션으로 제츠의 엣지러셔가 엣지에 있지 않고 미들라인배커에 위치하게끔 유도해 터치다운을 만들어냈는데, 이런 세심한 움직임이 굉장히 유의미한 차이를 불러일으키고 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/tHw4N0QrSFU\" title=\"YouTube\"><\/iframe><\/div><p>4주차가 지난 지금 첫번째 성적표가 나올 때인데 공격은 예상한 그대로인데, 무엇보다 수비가 눈에 띈다. 베어스의 수비가 특히 강한 것은 써드다운이다. 이 경기의 중요순간마다 나오는 데니스 알렌 수비코치의 블리츠는 아직까지 대단히 성공률이 높다(블리츠성적).<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/hsUKimlrL4M\" title=\"YouTube\"><\/iframe><\/div><p>이번 경기에서 7번의 써드다운에서 단하나의 갱신도 내주지 않았고(팀의 라인배커  데빈 부시는 이번 경기 끝나고 몸이 아픈 느낌도 없다라고 까지했다...) 1주차 팬서스 전 이후로 3팀을 상도로 총 29번의 써드다운 중에 단 5번만을 갱신 허용해주면서 중요한 순간에 강한 모습을 보여주고 있다. 물론 이 턱없이 높은 수치가 실제 그들의 수비 실력을 나타낸다고 생각치는 않는다. 시즌이 지나며 강팀들을 만나면(그전까지 베어스는 주전 쿼터백이 빠진 바이킹스, 아무 공격도 안되는 듯한 이글스, 개중 강해보이던 제츠를 만났을 뿐이다) 이 성적이 꽤나 하락할 수 있지만, 그래도, 베어스의 수비는 강력할 필요가 없고 그야말로 상대와의 화력전에서 살짝만 늦추는 속도방지턱정도의 역할만 하면 되는거라, 시즌 초반 주전 쿼터백이 있거나 없거나 엄청난 화력을 뿜어대는 공격을 보고 시카고 베어스 팬들의 기대감은 한없이 높을 것이다.<\/p><p>제츠의 입장에서는 지워버리고 싶은 게임일 것이다. 공-수 양면으로 아무것도 보여주지 못했는데, 최근의 제츠가 기세가 조금씩 오르고 있었다는 걸 생각하면 더욱이나 기운이 팍 빠질 것이다. 이번 게임 들어가기전까지 제츠의 패스 시도당 EPA (굥격 효율)은 TOP 10 급이었다. 지노스미스의 화력전이 나쁘지 않은 것이었는데, 이번 게임 제츠는 총 156야드를 전진했을 뿐이고 심지어 그중에 73야드가 단 하나의 플레이에서 나온것이다. 그 플레이를 빼면 경기 내내 100야드도 가지 못한 것이다. 아무래도 주전 러닝백인 브리스홀의 부재가 느껴질 것이라고는 생각했는데 이정도로 뼈아플지는 몰랐다.<\/p><p>수비쪽에서도 아쉬움이 클 것인데... 이번 게임 베어스의 후보 쿼터백 타일러 베이전트는 무려 4번이나 인터셉션을 허용했다. 하지만, 그 중에 3번이 반칙으로 취소 처리 되었다. 상대 입장에서 게임을 비등하게 가져갈 기회, 기세를 탈 기회를 주는데도 본인들이 내다버린 꼴이 된게 너무나 아쉬울 것이다.<\/p>","401872973":"<p>리그에서 가장 강한 팀으로 꼽히는 볼티모어 레이븐스와 신인 감독 체제하에서 어느정도 리빌딩을 하는 타이탄스와의 대결이었는데, 볼티모어 레이븐스가 압도적인 경기력을 선보이면서 전반전에 게임의 승부를 꽤나 결정지었는데, 후반 라마잭슨이 부상으로 결장하고 타이탄스가 열심히 따라왔으나 역부족이었던 경기이다.<\/p><p>레이븐스가 이렇게까지 강할 수 있는 이유는 라마 잭슨 덕분이다. 라마 잭슨은 MVP를 두 번이나 딴 선수임에도 불구하고, 이번 시즌이 그의 커리어에서 최고의 경기력을 펼치고 있다고 본다. 현시점 MVP를 꼽자면 1순위에 뽑힐 인물 중 하나이다. 포켓안에서의 순간적인 움직임, 수비를 분석하는 능력, 팔의 여러 각도에서 나오는 패스, 그리고 엄청난 구속, 거기다가 아직까지 본인의 발을 활용한 스크램블링도 살아있어서 쿼터백으로서 부족한게 무엇일까 라는 생각을 들게한다. 이번 경기에서도 20번의 패스시도 중에 15번을 성공시키고 222야드 2터치다운, 20러싱야드를 기록했는데, 부상을 당하지 않고 후반까지 뛰었으면 얼마나 더 무시무시한 기록을 세웠을지 무서울 정도의 퍼포먼스였다. 다행히 부상이 큰 건 아니고, 한경기만 쉬면 된다고 하니 레이븐스의 팬들은 마음을 놓을 수 있을 것이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">완성률<\/th><th class=\"r\">시도당 야드<\/th><th class=\"r\">패스 EPA<\/th><th class=\"r\">패서레이팅<\/th><th class=\"r\">빅플레이 비중<\/th><th class=\"r\">비고<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">19시즌<\/td><td class=\"r\">66.4%<\/td><td class=\"r\">7.84<\/td><td class=\"r\">+0.37<\/td><td class=\"r\">113.9<\/td><td class=\"r\">10.5%<\/td><td class=\"r\">MVP 수상<\/td><\/tr><tr><td class=\"l\">20시즌<\/td><td class=\"r\">64.9%<\/td><td class=\"r\">7.39<\/td><td class=\"r\">+0.17<\/td><td class=\"r\">100.1<\/td><td class=\"r\">9.9%<\/td><td class=\"r\"><\/td><\/tr><tr><td class=\"l\">21시즌<\/td><td class=\"r\">65.1%<\/td><td class=\"r\">7.62<\/td><td class=\"r\">+0.06<\/td><td class=\"r\">87.9<\/td><td class=\"r\">10.9%<\/td><td class=\"r\"><\/td><\/tr><tr><td class=\"l\">22시즌<\/td><td class=\"r\">62.5%<\/td><td class=\"r\">6.90<\/td><td class=\"r\">+0.05<\/td><td class=\"r\">91.3<\/td><td class=\"r\">7.4%<\/td><td class=\"r\"><\/td><\/tr><tr><td class=\"l\">23시즌<\/td><td class=\"r\">67.3%<\/td><td class=\"r\">8.07<\/td><td class=\"r\">+0.10<\/td><td class=\"r\">102.9<\/td><td class=\"r\">11.2%<\/td><td class=\"r\">MVP 수상<\/td><\/tr><tr><td class=\"l\">24시즌<\/td><td class=\"r\">67.4%<\/td><td class=\"r\">8.90<\/td><td class=\"r\">+0.36<\/td><td class=\"r\">120.9<\/td><td class=\"r\">11.9%<\/td><td class=\"r\"><\/td><\/tr><tr><td class=\"l\">25시즌<\/td><td class=\"r\">64.0%<\/td><td class=\"r\">8.50<\/td><td class=\"r\">+0.06<\/td><td class=\"r\">104.4<\/td><td class=\"r\">12.7%<\/td><td class=\"r\"><\/td><\/tr><tr><td class=\"l\">26시즌<\/td><td class=\"r\">72.3%<\/td><td class=\"r\">10.29<\/td><td class=\"r\">+0.38<\/td><td class=\"r\">122.1<\/td><td class=\"r\">14.9%<\/td><td class=\"r\"><\/td><\/tr><\/tbody><\/table><\/div><p>라마 잭슨이 이정도 엄청난 활약을 하는 것도 놀랍지만, 그보다 더 놀라운 것은 리시버인 제이 플라워스의 성장이다. 리시버를 평가하는 2차 스탯 중에 가장 정밀하다는 YPRR (야드 퍼 라우트 런)이 6.3 인데, 리그 최상위권이 4근처를 오가고, 3만 넘어도 리그를 대표할 정도의 스탯이다. 이번 경기에서도 전반전에만 10개의 패스 중에 8개의 캐치를 잡으며 118야드 1터치다운을 만들어냈는데, 레이븐스의 신임 공격코치 데클란 도일은 시즌 전 인터뷰에서 &quot;제이 플라워스는 슈퍼스타다. 그걸 모르는 사람이 있다면 이번 시즌 우리가 모두에게 그걸 알려주겠다&quot; 라고 했는데, 이번 시즌 한 경기를 출장하지 못했음에도 불구하고 리시빙 8위에 올라있고 캐치당 야드는 19.56으로 리그 3위 수준이다.<\/p><p>그가 이번 시즌 이렇게까지 확 두각을 드러내게 된 이유는 2개라고 생각한다. 가장 우선적으로 말할 것은 신임 공격코치 데클란 도일의 전술이다. 이번 시즌 제이 플라워스가 이 기세를 유지하게 되면, 데클란 도일은 순수하게 이 부분 하나만으로도 좋은 선임이었다고 말할 수 있다. 가장 중요한 부분은 그를 슬롯리시버로 본격적으로 활용하기 시작했다는 것이다. 작년에 그의 슬롯 활용도는 31% 였는데 이번 시즌 57%까지 뛰어오르면서, 라인배커들과 지속적으로 매치업이 이루어지게 된다. 그리고 제이 플라워스의 민첩함과 순간적인 스피드는 라인배커로서는 아예 막을 수 없다. 두 번째로는 그의 향상된 실력이다. 언제나 순간적인 민첩함은 좋은 선수였고, 라마 잭슨이 포켓을 벗어날때 그의 바이브에 맞춰서 빈 공간으로 가는 움직임은 늘 발군이었는데, 그가 슬롯으로서 대성할 수 없는 이유 중 하나는 딥 패스에서의 역량 부족이다. 최근 NFL에서는 슬롯 포지션에서 본격적으로 활약하기 위해서는 자신의 뒤에서 날라오는 딥패스를 잡으면서 최후방까지도 필드를 늘릴 수 있었어야했는데, 제이 플라워가 전진하다가 안이나 밖으로 꺽는 움직임은 늘 좋았는데 순수 딥패스는 좀 왔다갔다하더니, 이번 시즌 이 부분이 굉장히 크게 향상되었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/Yb12es8Wlc0\" title=\"YouTube\"><\/iframe><\/div><p>라마 잭슨이 부상을 당한 이후에 레이븐스는 극한으로 소극적인 경기 운영을 펼쳤다. 이에 대해 답답하다고 생각하는 사람들도 있겠지만 나는 나쁘지 않은 결정이라고 생각한다. 항상 레이븐스가 역전을 당할 때 아쉬웠던 것은 러닝을 하지 않는것, 거기다가 데릭헨리를 쓰지 않는 것이라고 이야기를 해왔는데, 드디어 그런 전략을 실행했다. 전반전 30%에 달하던 러닝 비중은 후반전 2배 이상으로 뛰었다. 중요한 점은 후반전의 러닝 성적이 급격히 떨어졌음에도 불구하고, 이걸 꾸준히 했다는 점이 기존의 큰 그림에서 벗어나지 않았다는 걸 뜻해서 좋았다. 특히나, 레이븐스의 수비가 아직까지 폼이 안올라와서 중위권 정도밖에 안되는 형국에서는 이런식의 굳히기는 나쁘지 않은 접근으로 보인다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">러닝 비중<\/th><th class=\"r\">러닝 시도 당 야드<\/th><th class=\"r\">성공율<\/th><th class=\"r\">데릭 헨리 터치<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">전반<\/td><td class=\"r\">30.3%<\/td><td class=\"r\">4.2<\/td><td class=\"r\">40%<\/td><td class=\"r\">10<\/td><\/tr><tr><td class=\"l\">후반<\/td><td class=\"r\">61.5%<\/td><td class=\"r\">2.88<\/td><td class=\"r\">18.8%<\/td><td class=\"r\">15<\/td><\/tr><\/tbody><\/table><\/div><p>타이탄스는 이번 게임에도 패배를 하면서 0승 4패를 기록하게 되었다. 신임 감독인 로버트 살라가 들어온 걸 감안하면, 그럴 수도 있겠다 싶긴한데... 그래도 아 역시는 역시인가 하는 안타까움이 생긴다. 그나마 이번 경기에서 다행인 점은 자신들이 올해 1라운드 4번픽에 뽑은 리시버 카넬 테이트가 본인의 커리어 최고의 경기(12 타겟 9캐 145야드)를 펼쳤다는 점인데 그 점 외에는 그리 긍정적인 뉴스가 없다. 자신들의 미래라고 여겨진 25년도 1라운드 1번픽 출신 캠워드는 여전히 모르겠다... 라는 생각이 든다. 어떤 순간에는 잘하는 것 같은데 어떨 때는 아닌것 같기도 하고 계속해서 기복이 높은 모습을 보여주고 있어서 미래를 맡겨도 되는지 아닌지 확신이 안든다. 수비의 중심인 제프리 시몬스는 역시나 리그 최고 티어 내곽 수비라인맨 인 모습을 보이고 있는데, 그게 팀의 승패를 뒤집을 정도의 영향력은 끼치지 못하고 있다.<\/p>","401872974":"<p>공격쪽에서는 다소 졸전이었던 게임에서, 리그에서 가장 약한 전력을 갖고 있다는 마이애미 돌핀스를 상대로 미네소타 바이킹스가 막강한 수비를 바탕으로 또 한번 승리를 거두면서 이번 시즌 전승으로 1/4분기를 마쳤다.<\/p><p>우선 한국인들에게 가장 관심이 갈만한 부분인 미네소타 바이킹스의 공격부터 보자. 카일러 머리는 바이킹스의 쿼터백으로 들어왔는데, 케빈 오코넬 감독의 부진한 쿼터백을 살리는 능력과 시너지를 일으키며 꽤나 강력할 줄 알았는데, 아직까지 그런 모습은 나오고 있지 않다. 케빈 오코넬 감독은 섀너핸-맥베이 계열로 그들의 공격 전술 스타일은 수비의 움직임에 대응하면서 쿼터백이 열린 곳을 만들어내는 전술이라기보다는 사전에 정해둔 움직임으로 전술상으로 열린 곳을 만들어서 쿼터백이 그런 사인을 읽고 전술을 믿고 거기에 패스를 꽂아 넣는 유형이다. 그만큼 타이밍에 맞게 공이 쿼터백의 손에서 나가야하고 그렇게 차곡차곡 플레이를 쌓으면서 리듬을 살리는게 굉장히 중요한데, 아쉽게 카일러 머리는 그 리듬을 잘 못타고 있다. 포켓 안에서 던지지 못하고 멈칫멈칫하는게 눈에 보이고, 수비가 쇄도해들어올 것 같으니까 자신의 기동력을 살려서 포켓을 벗어나고 싶은 마음과 사전에 구성한 전술대로 조금만 더 포켓에서 버티면 열린다고 했는데 버텨야지 하는 마음이 서로 충돌하면서 의사결정 자체가 지연되고, 결국 멈칫멈칫하다가 러닝백이나 타이트엔드에게 짧게 던지고 마는 김빠지는 플레이가 계속 나왔다. 이를 반영하는 것이 이 경기 카일러 머리의 패스 비거리는 4.81야드에 불과했고, 카일러 머리가 평생 펼쳐온 플레이 스타일과 다른 유형의 스타일이라서 케빈 오코넬 체제에 적응을 하는데 생각보다 시간이 좀 더 걸릴 수도 있겠다 라는 걱정을 들게 했다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">성공률<\/th><th class=\"r\">시도당야드<\/th><th class=\"r\">터치다운 - 인터셉션<\/th><th class=\"r\">드롭백당 EPA<\/th><th class=\"r\">ADOT (평균 패스 비거리)<\/th><th class=\"r\">러싱 야드<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">4주차<\/td><td class=\"r\">73.0%<\/td><td class=\"r\">6.68<\/td><td class=\"r\">0 - 0<\/td><td class=\"r\">-0.02<\/td><td class=\"r\">4.81<\/td><td class=\"r\">15<\/td><\/tr><tr><td class=\"l\">26시즌<\/td><td class=\"r\">63.4% (18위)<\/td><td class=\"r\">6.1 (27위)<\/td><td class=\"r\">1 - 2<\/td><td class=\"r\">-0.16 (28위)<\/td><td class=\"r\">6.55 (28위)<\/td><td class=\"r\">41<\/td><\/tr><\/tbody><\/table><\/div><p>혹자는 카일러 머리를 빼고 카슨 웬츠를 넣는게 낫다고 하는데, 개인적으로 그건 맞지 않다고 본다. 우선, 바이킹스의 공격진은 생각보다 부상이 더 많다. 팀의 에이스 리시버이자 리그의 대표적 리시버인 저스틴 제퍼슨은 결장 중이라, 그의 부재만으로 바이킹스의 패싱 전력은 절반으로 깎였다고 과언이 아니다. 거기다가, 팀에서 가장 강한 오라인인 크리스챤 도리소우 역시 이번 경기 중에 빠졌다. 내곽 오라인맨은 몇 년간 팀의 약점이라고 평가 받아왔기에 결국 좋은 전력의 오라인이라고 할 만한 선수는 라이트 태클 브라이언 오닐 밖에 없는 상황이다. 물론 엘리트 베테랑 쿼터백이라면 이런 상황에서도 강력한 퍼포먼스로 승리를 거머쥐어야했지만, 카일러 머리는 부상 때문에 이 시스템에서 본격적인 주전으로 뛴 두번째 경기였을 뿐이라는걸 감안해야한다. 강력한 수비를 가진 팀의 입장에서 굳이 그에게 무리한 플레이를 하라고 했을리 없고, 게임의 매니징을 하면서 시스템을 익히라고 했을 것이다. 그리고 카일리 머리는 그에 맞는 퍼포먼스로 팀을 승리로 이끌었다. 거기다가 경기 후반부로 가면서 빅패스들이 조금씩 나오기 시작했다는게 긍정적인 기대감을 갖게 해준다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/e7xNh_7TNas\" title=\"YouTube\"><\/iframe><\/div><p>수비쪽에서는 여전했다. 브라이언 플로레스는 이번 게임에서도 70% 가까이 블리츠를 하면서 본인이 이 구역 가장 미친사람임을 다시 증명했고, 거기다가 엣지러셔 달라스 터너가 본격적으로 꽃을 피우기 시작했다. 다만 몇몇 취약점이 드러나기도 했는데 빅플레이가 터지면 그걸 막을 최후의 보루가 없는데, 이번 게임에서도 반칙으로 무산되기도 했지만 한번의 빅플레이 터치다운을 내주기도 했다. 실제로 이게 먹혔다면, 게임은 생각보다 더 위태로웠을 수 있다. 하지만, 이런 빅플레이 허용은 어쩔 수 없는 전술의 한계라고 본다. 애초에 동 포지션 탑 10에 들어가는 선수 한명도 없이 리그의 최고 티어 수비를 구축하고 있는데 이런 리스크를 안지 않고 가는것 자체가 말이 안된다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">허용야드<\/th><th class=\"r\">실점<\/th><th class=\"r\">EPA<\/th><th class=\"r\">블리츠율<\/th><th class=\"r\">빅플레이 허용률<\/th><th class=\"r\">써드다운 방어율<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">26시즌<\/td><td class=\"r\">289.3 (5위)<\/td><td class=\"r\">12.75 (1위)<\/td><td class=\"r\">-0.18 (1위)<\/td><td class=\"r\">72.5% (1위)<\/td><td class=\"r\">8.9%<\/td><td class=\"r\">24.5% (2위)<\/td><\/tr><\/tbody><\/table><\/div><p>돌핀스의 경우에는 명백한 리빌딩의 과정에 있고 리그에서 가장 전력이 낮은 팀이다. 그래도 나름 볼만한 게임들을 펼치고 있지만, 패배를 막기에는 영 부족해보인다.<\/p>","401872975":"<p>현재 NFL에서 가장 강한 팀 두 팀이 맞붙었는데, 의외로 수비전으로 게임이 치닫으면서 49ERS가 승리를 거뒀다. 이로써 49ERS는 리그의 1/4가 끝난 지금 리그에서 가장 강한팀 중 하나로써 자신들의 자리를 지켰고, 브롱코스는 걱정스러운 점들이 하나 둘 씩 보이기 시작했는데 하나하나 봐보자.<\/p><p>우선 49ERS측면에서 가장 좋았던 점은 공격이 여전하다는 것이다. 덴버 브롱코스의 수비가 강한 수비였기에, 이전 경기들에서 보여주었던 미친 폼을 보여주지는 못했지만,  그래도 결국 방법을 찾아냈다. 이번에 49ERS의 공격력을 공격권 즉 드라이브 별로 비교하면 처음 7번에서는 매 플레이 시도당 4.6야드에 득점 3점에 불과했는데 마지막 3개의 공격권에서는 시도당 7.4야드에 21점을 득점하는 공격력을 보여줬다. 그리고 이번 게임에서 변수가 되었던 것은 바로 디보 새뮤얼이다. 리시버/러닝백이 모두 되는 와이드백이라고 자신을 부르던 디보 새뮤얼은 친정팀인 49ERS로 올해 돌어왔는데, 그 값을 이번 경기에서 톡톡히 했다. 백필드와 리시버 양쪽에서 활약을 하면서 정밀한 맨투맨으로 나선 브롱코스의 수비 상대로 혼선을 유지했고, 결국 터치다운을 기록하기도 했다. 실제 터치다운 플레이에서 보면 그에게 얼마나 많은 무게감이 실렸는지 확인할 수 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/7j3Ar2Xdqzc\" title=\"YouTube\"><\/iframe><\/div><p>그 외에도 전술적으로도 뛰어난게 조지키틀의 마지막 터치다운이었다. 49ERS에서 가장 위험한 선수이자 수비가 가장 신경쓰는 선수인 크리스챤 맥캐프리를 반대쪽으로 빼서 수비의 시선을 분산 시키고, 거기다가 수비의 블리츠를 예측이라도 했다는듯이(개인적으로는 지난 4개의 쿼터동안 경향성을 통해 카일 새너핸은 이 블리츠를 예측했다고 본다) 스크린플레이를 걸어버렸고, 역시나 49ERS의 어벤저스 중 하나인 조지 키틀이 짧은 스크린을 그대로 필드를 가로지르면서 경기의 쐐기를 박은 터치다운으로 만들어버렸다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/t9BR6pj4_7Q\" title=\"YouTube\"><\/iframe><\/div><p>수비적으로도 닉보사가 빠진 상황에서 굉장히 좋은 수비 퍼포먼스를 보였다. 후술하겠지만, 덴버 브롱코스의 공격쪽 부진이 굉장히 눈에 띄긴 했는데, 그와 관계없이 러닝게임은 잘막았고 무엇보다 디아모도어 레노어의 훌륭한 수비는 아주 인상적이었다. 많은 경우에 그는 덴버의 코틀랜드 서튼과 1:1을 했었는데 아주 훌륭하게 그를 잠구면서 49ERS의 승리에 수비쪽에서 가장 크게 기여한 인물 중 하나였다.<\/p><p>반면 브롱코스 측에서는 아쉬움이 큰 게임이다. 우선 수비측에서는 부상과 결장이 계속 팀에 쌓이고 있다는게 가장 부정적인 뉴스이다. 브롱코스의 수비는 강력한 쇄도 능력과 함께 양측 코너백들의 강력한 맨마킹 능력이 톱니바퀴처럼 맞물리면서 상승 기류를 만드는 전술이었는데, 조나단 쿠퍼의 결장으로 닉 보니토의 반대쪽에서 쇄도를 같이 만들던 한 측이 무너졌고, 이번 경기에서는 양쪽 코너백들 패트릭 서테인과 라일리 모스 모두 부상으로 경기 중간에 나가게 되었다. 물론 그렇다고 수비가 약한 것은 아니다. 이번 게임에서도 경기 초중반까지 수비전으로 끌고 갔고, 게임이 마지막까지 비등비등했던 이유는 수비의 공이 크다. 하지만, 공격이 극도로 부진한 상황에서 수비에 기대야하는 팀이기에, 4쿼터에서 수비가 부러지면 안되었는데... 그리되었고, 장기적으로 보았을 때도 양쪽 코너백인 서테인과 모스가(부상정도가 정확하진 않지만) 장기간 결장하게 된다면, 브롱코스의 수비 정체성자체를 바꿔야할 수도 있는 위기에 놓이게 된다.<\/p><p>공격쪽은 수비보다 훨신 고민이 크다. 문제가 여러 개가 있다고 볼수 있는데, 우선 4쿼터에만 몰린 득점이다. 브롱코스의 득점은 극히 4쿼터에만 몰려있는데, 이 것 자체가 좋게 보면 상대의 경향을 초중반에 잘 파악해서 중요할 때 결정력이 좋은거고, 나쁘게 보면 전반적으로 감을 못 잡다가 막판에만 터지는 변동성 높은 현상이라 볼 수 있는데, 그 변동성이 안터지면 이번 경기처럼 되는 거라고 볼 수 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">구분<\/th><th class=\"r\">1Q<\/th><th class=\"r\">2Q<\/th><th class=\"r\">3Q<\/th><th class=\"r\">4Q<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">득점<\/td><td class=\"r\">10 (26위)<\/td><td class=\"r\">3 (31위)<\/td><td class=\"r\">22 (13위)<\/td><td class=\"r\">39 (3위)<\/td><\/tr><tr><td class=\"l\">리그평균<\/td><td class=\"r\">17.1<\/td><td class=\"r\">27.6<\/td><td class=\"r\">20.0<\/td><td class=\"r\">27.0<\/td><\/tr><\/tbody><\/table><\/div><p>우선 가장 걱정되는 것은 러닝이 전혀 풀리지 않고 있다. 브롱코스의 경기당 러싱야드는 29위이고, 캐리당 야드는 25위, 성공률은 21위에 불과할정도로 하위권에서 놀고 있고, 팀의 1번 러닝백 JK 다빈스는 시도당 3.5야드 성공률 26%에 불과하고, 10야드 이상의 러닝도 단 2번에 불과할정도로 극심한 슬럼프를 겪고 있다. 문제는 러닝이 안된다면 패스라도 되어야하는데, 패스도 풀리지 않고있다. 특히 이번 게임에서는 보 닉스의 부진이 극심하게 드러났다. 그의 이번 경기 에어야드 즉 패스 비거리는 시도당 4.6야드에 불과했다. 브롱코스의 경기 플랜 자체가 빠른 횡패스(스크린 플레이)를 많이 쓰는 것에서 원인을 찾을 수도 있다. 실제로, 숀 페이튼으로부터 플레이 콜링 임무를 부여받은 웹의 콜링 가능한 시간도 시한부 아니냐는 말도 나오고 있다. 특히 이번 게임에 3RD &amp; 롱 상황에서 짧은 횡패스로 필드를 조금 전진한 후 킥을 차는 의사결정들은 의문이 가득했다. 만약에 4TH 다운을 시도하려는 마음이 있다면 3RD 다운에서 짧은 횡패스로 거리를 조금 전진한뒤에 4TH다운의 부담을 줄이는게 이해가 된다. 하지만, 4TH다운에 킥을 찰 계획인데 3RD다운에 횡패스를 하는 것은... 아 우리팀은 중장거리패스는 아예 안되니까...안정적으로 짧은 패스해서 러닝백이 공을 들고 갱신해주면 땡큐 아니면 다음 공격권으로 가지 라는 극단적으로 소극적인 경기운영이기 때문이다. 물론 보닉스의 플레이를 보면 그를 탓하기만도 애매하다. 이번 게임에서 그의 시야처리를 보면 분명히 필드의 한가운데 10야드 이상의 패스들이 열려있는데 이를 보지 못하는 경우들이 꽤나 있었다. 특히나 아래 영상 플레이는 대거 컨셉(한명이 쭉 깊게 들어가고 그 옆에서 다른한명이 같이 달리다가 안으로 짜르는 컨셉) ㅣ이라 분명히 리시버가 열릴게 확실한 상황에서도 이를 보지 못했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ZlnjP6JOIUQ\" title=\"YouTube\"><\/iframe><\/div><p>러닝이 안된다면, 이런 기본적인 중장거리 패스들이 풀리기 시작해야지만 녹슨 톱니바퀴가 삐걱삐걱하면서 첫 회전을 시작하는데, 이마저도 안되고 있으니 공격이 주저앉아버리는 경향이 있다. 이렇게 필드 중앙을 보지 않는 것을 보여주는 또다른 지표는 타겟에서 리시버의 비중이다. 이번 게임 러닝백인 RJ 하비의 타겟 비중은 무려 34%에 달했는데, 이럴거면 왜 그 큰돈을 들여서 제일런 와들이라는 걸출한 리시버를 데리고 오는 의사결정을 했는지 의아하다. 공중장악능력이 좋은 리시버 코틀랜드 서튼 - 폭발적인 스피드의 제일런 와들 - 캐치 관련 밸런스가 좋은 타이트엔드 에반 잉그램의 조합에 대한 시즌 전 기대감은 모두 사라져가고 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">4주차 타겟 비중<\/th><th class=\"r\">시즌 타겟 비중<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">RJ 하비 (러닝백)<\/td><td class=\"r\">34%<\/td><td class=\"r\">16.5%<\/td><\/tr><tr><td class=\"l\">제일런 와들 (리시버)<\/td><td class=\"r\">13%<\/td><td class=\"r\">21.3%<\/td><\/tr><tr><td class=\"l\">코틀랜드 서튼 (리시버)<\/td><td class=\"r\">13%<\/td><td class=\"r\">17.3%<\/td><\/tr><tr><td class=\"l\">에반 잉그램 (타이트엔드)<\/td><td class=\"r\">11%<\/td><td class=\"r\">10.2%<\/td><\/tr><\/tbody><\/table><\/div><p>4주가 끝났으니 49ERS를 종합해서 이야기해보자면, 무엇보다 인상적인 것은 공격이다. 그리고 거기에는 3가지의 요소가 함께 잘 어우러지고 있다고 본다. 가장 첫번째는 카일 섀너핸의 훌륭한 전략 전술이다. 전년도 다들 부상당한 와중에 좋은 성적을 낸 25시즌이 그의 최고점이지 않을까 싶었는데, 이번 시즌 그 기세를 몰아서 선수들이 돌아왔을 때 어떻게 되는지를 보여주고 있다. 매 경기마다 공을 받는 선수가 활짝 열리는 경우가 꽤나 있고, 이게 드러나는 포인트 중 하나는 역시나 공의 고른 분배이다. 지난 해 모든 공격의 51.1%를 맥캐프리에게 의지한채 나머지 선수들은 10%도 안되는 상황이었다면 올해도 역시 맥캐프리가 주공이지만 상당히 고르게 분포가 되어있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">25시즌 터치 비중<\/th><th class=\"r\">26시즌 터치 비중<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">1번 러닝백 - 크리스챤 맥캐프리<\/td><td class=\"r\">51.1%<\/td><td class=\"r\">38.4%<\/td><\/tr><tr><td class=\"l\">2번 러닝백 (브라이언 로빈슨 / 케일론 블랙)<\/td><td class=\"r\">12.4%<\/td><td class=\"r\">18.6%<\/td><\/tr><tr><td class=\"l\">1번 타이트엔드 - 조지 키틀<\/td><td class=\"r\">7.2%<\/td><td class=\"r\">9.3%<\/td><\/tr><tr><td class=\"l\">1번 리시버 (주완 제닝스 / 디보 새뮤얼)<\/td><td class=\"r\">6.8%<\/td><td class=\"r\">12.2%<\/td><\/tr><tr><td class=\"l\">2번 리시버 (리키 피어살 / 마이크 에반스)<\/td><td class=\"r\">4.7%<\/td><td class=\"r\">9.9%<\/td><\/tr><\/tbody><\/table><\/div><p>거기다가 코칭 전체가 굉장히 잘되고 있다는게 하나 더 드러나는것이 반칙의 숫자이다. 49ERS는 이번 시즌 반칙 순위에서 뒤에서 2번째로 리그에서 가장 반칙을 안하는 팀 중 하나이고, 이번 4주차 경기에서도 단 1개의 반칙만을 저지르면서 자신들이 기강이 꽉 잡힌 팀이라는걸 보여주었다. 하지만 무엇보다 놀라운건 바로 브락퍼디의 놀라운 성장이다. 지금 현재 리그 MVP가 아깝지 않은 활약을 연거푸 보여주고 있는데, 아까 반칙을 포함해서 마이너스 플레이가 극도로 적다. 이번 시즌 122번의 패스플레이에서 브락 퍼디가 허용한 쌕은 0회이다. 즉 이번 시즌까지 단 한번도 쌕을 당한적이 없다는 말인데, 이는 카일 섀너핸의 놀라운 전술 및 플레이 콜링 능력 / 그걸 빠르게 이행하고 압박이 있을 때 본인의 다리로 상황을 타개하는 민첩함과 침착함의 브락퍼디 / 패스블로킹 승률에서 탑10에 드는 오라인의 저력 이 3개가 모두 합쳐진 놀라운 결과이다. NFL의 게임이라는게 특별한 플레이로 게임을 승리하는 것도 중요하지만 스스로 패배로 이끌지 않는게 제일 중요하다는 빌 벨라칙의 말을 떠올리게 하는 부분이다.<\/p>","401872976":"<p>3승 0패인 두 팀이자 같은 디비전에 속한 라이벌 간의 대결이었는데, 마지막까지 승부가 결정되지 않다가 결국 치프스의 승리로 끝났다. 치프스는 이로써 리그에 몇 안 되는 4전 전승 팀으로 군림하게 됐고, 레이더스는 비록 패했지만 손쉬운 일정과 운이 만들어 낸 3승 0패가 아니라 진짜 NFL 팀으로서의 가치를 증명한 경기였다.<\/p><p>가장 중요하게 볼 것은 치프스의 공격, 그중에서도 케네쓰 워커가 중심이 되는 러싱 공격이다. 지난해 슈퍼볼 MVP였던 케네쓰 워커는 치프스에 와서 어마무시한 활약을 하고 있는데, 단연코 올해 오프시즌 가장 성공적인 이적이다. 케네쓰 워커는 지금 4경기 537야드, 시도당 6.17야드라는 정신 나간 성적을 거두고 있다. 비쟌 로빈슨, 자미어 깁스, 제임스 쿡, 데릭 헨리 같은 리그 대표 러닝백들보다도 좋은 성적이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">야드<\/th><th class=\"r\">시도당 야드<\/th><th class=\"r\">EPA<\/th><th class=\"r\">10+야드<\/th><th class=\"r\">20+야드<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">케네쓰 워커<\/td><td class=\"r\">537<\/td><td class=\"r\">6.17<\/td><td class=\"r\">+0.11<\/td><td class=\"r\">14개<\/td><td class=\"r\">6개<\/td><\/tr><tr><td class=\"l\">비쟌 로빈슨<\/td><td class=\"r\">494<\/td><td class=\"r\">5.81<\/td><td class=\"r\">+0.13<\/td><td class=\"r\">11개<\/td><td class=\"r\">4개<\/td><\/tr><tr><td class=\"l\">제임스 쿡<\/td><td class=\"r\">421<\/td><td class=\"r\">6.01<\/td><td class=\"r\">+0.13<\/td><td class=\"r\">15개<\/td><td class=\"r\">4개<\/td><\/tr><tr><td class=\"l\">데릭 헨리<\/td><td class=\"r\">374<\/td><td class=\"r\">4.20<\/td><td class=\"r\">-0.05<\/td><td class=\"r\">9개<\/td><td class=\"r\">3개<\/td><\/tr><tr><td class=\"l\">자미어 깁스<\/td><td class=\"r\">353<\/td><td class=\"r\">4.41<\/td><td class=\"r\">-0.02<\/td><td class=\"r\">12개<\/td><td class=\"r\">1개<\/td><\/tr><\/tbody><\/table><\/div><p>치프스 오라인은 리그에서 블로킹 수준이 가장 높은 팀 중 하나였지만, 그동안 러싱은 나쁘지는 않아도 강력하지는 않았다. 오라인이 길을 열어 줘도 NFL에서는 그 길이 순식간에 닫히는데, 기존 러닝백들로는 작은 틈을 뚫더라도 그 순간 열린 공간을 빅플레이로 연결할 폭발력이 부족했다. 케네쓰 워커가 바로 이 부분을 채워 주고 있다. 이번 경기에서 흐름을 바꾼 3쿼터 76야드 러싱도 이런 결이었다. 치프스 우측 오라인이 레이더스 수비 라인을 압도하며 공간을 만들었고, 그 틈으로 달려 나간 케네쓰 워커는 수비가 손을 대기도 전에 순식간에 수비진을 모두 지나쳐 엄청난 빅플레이를 만들었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/YpW5nQ7SFgI\" title=\"YouTube\"><\/iframe><\/div><p>그렇다고 그가 오라인이 열어 준 공간만 질주하는, 스피드만 좋은 러닝백은 절대 아니다. 케네쓰 워커는 리그에서 가장 태클하기 어려운 러닝백 중 하나다. 수비와 첫 접촉, 즉 컨택트 이후 전진 거리가 267야드로 리그 2위보다 50야드 이상 많은 1위이고, 브로큰 태클, 즉 벗겨 낸 태클도 12개로 리그 2위(7개)보다 5개나 많은 1위다. 참고로 지난 몇 년간 브로큰 태클은 한 시즌 30개만 넘어도 1위였으니, 시즌의 4분의 1이 지난 시점에 12개인 케네쓰 워커의 추세는 무시무시하다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/GFryIUkwysk\" title=\"YouTube\"><\/iframe><\/div><p>전술적으로도 그가 주는 가치는 어마어마하다. 케네쓰 워커가 합류하면서 그를 살리기 위해 치프스의 언더센터(쿼터백이 센터 바로 뒤에 서는 형태) 비중은 전년도보다 두 배 가까이 늘었다. 그리고 러싱이 먹히기 시작하면서, 이른바 '박스'라고 부르는 러싱 수비 인원이 6명 이하인 비중이 크게 떨어졌다. 즉 상대 수비가 러싱을 막으려고 마홈즈 커리어 그 어느 때보다 많은 인원을 박스에 투입하고 있다는 뜻이고, 이는 동시에 바깥쪽과 깊은 쪽, 즉 패스할 지역의 수비 숫자가 줄어든다는 뜻이기도 하다. 여기에 러싱인 척하며 패스하는 플레이액션의 비중과 효율도 말도 안 되게 올라갔다.<\/p><p>실제로 마홈즈는 인터뷰에서 이렇게 말했다. 지난해에는 필드 중앙에 자리 잡은 라인배커들이 어떤 러싱 페이크에도 속지 않아서, 이들을 움직이기 위해 연습 중에 펌프 페이크, 즉 패스하는 척하는 동작에 공을 많이 들였다. 그런데 이번 시즌에는 케네쓰 워커 덕분에 라인배커들이 알아서 움직여 주니 그런 수고 없이 마음 놓고 패스를 뿌릴 수 있다는 것이다. 이런 변화는 플레이액션 패스의 평균 비거리에서도 드러난다. 그리고 이렇게 생긴 빈 공간을 트레비스 켈시가 중거리에서, 타이콴 쏜튼이 장거리에서 공략하고 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">언더센터 비중<\/th><th class=\"r\">박스 6명 이하 비중<\/th><th class=\"r\">플레이액션 비중<\/th><th class=\"r\">플레이액션 EPA<\/th><th class=\"r\">플레이액션 패스 평균 비거리<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">26시즌<\/td><td class=\"r\">39.1%<\/td><td class=\"r\">59.3%<\/td><td class=\"r\">36.6%<\/td><td class=\"r\">+0.32<\/td><td class=\"r\">6.7야드<\/td><\/tr><tr><td class=\"l\">25시즌<\/td><td class=\"r\">18.8%<\/td><td class=\"r\">78.0%<\/td><td class=\"r\">15.3%<\/td><td class=\"r\">+0.08<\/td><td class=\"r\">10.8야드<\/td><\/tr><\/tbody><\/table><\/div><p>치프스 수비는 리그 최상위권만큼 강력하지는 않지만 톱10급 수비력을 보여 주고 있다. 스티브 스패그놀로 수비 코치는 괴물인가 싶을 정도다. 분명 이번 오프시즌에 1번, 2번 코너백을 다른 팀에 보냈는데도 그 빈자리가 전혀 느껴지지 않는다. 수준급 코너백은 리그 모든 포지션 중 구하기 가장 어려운 포지션 톱3 안에 들 텐데도 말이다. 물론 스패그놀로의 전술도 있을 것이고, 올해 1라운드에 지명한 만술 드레인이 아주 인상적인 경기력을 보이고 있으며, 크리스 존스를 중심으로 한 다양한 블리츠에서 나오는 압박도 나쁘지 않다.<\/p><p>레이더스 입장에서는 3승 0패 끝에 첫 패를 당했지만, 레이더스 팬이라면 대부분 기쁨만 남았을 것이다. 많은 사람이 리빌딩의 해라고 예상했던 시점에 3승 0패를 거뒀고, 1라운드 1순위로 뽑은 멘도자 없이도 경쟁력 있는 풋볼을 보여 주고 있기 때문이다. 1라운드 1순위라 할지라도 신인 쿼터백의 데뷔는 늦출수록 좋다고 생각하는데(최근 타이탄스의 캠 워드를 보자), 커크 커즌스를 비롯한 선수들이 멘도자에게 그 시간을 벌어 주고 있다.<\/p><p>신임 감독은 전년도 슈퍼볼 우승팀 시애틀 시호크스에서 공격 코치를 맡았던 클린트 큐비악인데, 아주 잘해 주고 있다. 특출한 리시버 없이 브락 바워스를 중심으로 한 다수의 타이트엔드 전술을 기반으로 묵직한 컨셉을 유지하고 있다. 리스크도 적고 얻는 것도 적은 안정형 플레이를 계속 이어 가다가, 승부처에서 갑자기 하이리스크 플레이를 꺼내 빅플레이를 만들어 내는 특유의 능력은 레이더스에 와서도 여전하다. 이번 경기 터치다운에서도 러싱인 척 페이크를 준 뒤 브락 바워스를 미끼로 보내 수비를 끌어들이고, 세 번째 타이트엔드에게 터치다운 패스를 보낸 플레이가 아주 기억에 남는다. 물론 아직 리그 상위권 팀이라고 하기엔 무리가 있지만, 자신들의 에이스를 꾸준히 활용하고 있고 새로 영입한 타일러 린더밤도 아주 좋은 모습을 보이고 있어 미래는 밝아 보인다.<\/p><p>하지만 어쩌면 더 놀라운 쪽은 수비다. 수비 코치 롭 레너드는 클린트 큐비악 감독이 오기 전부터 레이더스에 있던 인물인데, 큐비악과 꽤 결이 맞는 부분이 있다. 그가 본격적으로 두각을 드러낸 것이 지금은 시애틀 시호크스 감독인 마이크 맥도널드가 레이븐스에 있던 시절, 레이븐스 라인배커 코치로 일할 때였기 때문이다. 그리고 수비 전권을 넘겨받은 26시즌, 로스터 대비 정말 인상적인 성과를 내고 있다. 레이더스 수비진은 맥스 크로스비 말고는 아무도 없다고 해도 될 정도의 로스터였는데, 크로스비는 여전히 잘하고 있고 새로 영입한 나코비 딘은 올해 수비 쪽 최고의 영입으로 꼽힐 만한 활약을 이어 가고 있다. 개인적으로 롭 레너드는 애틀랜타 팰컨스와 함께, 현재 리그에서 부족한 로스터로 가장 의미 있는 성적을 내고 있는 사례라고 본다.<\/p>","401872977":"<p>시즌 전을 기준으로 봤을 때 많은 팬들이 4주차 가장 빅매치 중 하나라고 동그라미를 쳐놨을 게임이었을텐데... 슈퍼볼 챔피언인 시호크스는 여전히 강세를 유지하고 있지만, 차저스는 모든게 무너져가고 있다. 이번 경기에서도 차저스는 중요한 임팩트를 내지 못하면서 패배를 하였고, 결국 차저스는 0승 4패로, 시호크스는 3승 1패로 시즌 1/4분기를 마치게 되었다.<\/p><p>가장 화두가 될 이야기부터 하자. 바로 차저스의 쿼터백 저스틴 허버트의 붕괴인데, 드레이크 메이와 함께 가장 기대 대비 이번 시즌 폼이 급격히 떨어진 대표적 인물이라고 할 수 있다. 그런데 메이보다 훨씬 상황이 심각하다. 저스틴 허버트는 조 버로우와 같은 2020년도 1라운드에 드래프트 된 쿼터백인데 많은 이들에게 엘리트 급이지만 주변에서 아무도 안 도와줘서 엘리트의 대화에서 살짝 밀리는, 주변에서 조금만 도와주면 바로 엘리트가 될 인물로 평가 받았다. 그렇게 평가 받는데 가장 큰 이유는 압도적인 피지컬이다. 이 선수 덩치가 조쉬 알렌 보다도 크다. 조쉬 알렌만큼 달리기도 가능하고, 팔도 조쉬 알렌에 비해 밀리지 않는 수준인데, 거기다가 커리어 초기에 이 피지컬을 활용해서 4300야드, 5000야드, 4700야드를 기록하면서 그 피지컬이 스탯으로까지 연결이 되는구나! 에 대한 확신을 팬들에게 주기도 했다. 팬들은 이 인물이 리그 최고의 사파 공격코치인 마이크 맥다니엘과 호흡을 맞추게 되면서 드디어! 라고 기대감이 하늘로 올랐을텐데... 아쉽지만 두 인물들간의 호흡 그리고 기질이 잘 맞지 않아 보인다. 저스틴 허버트는 커리어 초기에는 4000야드 이상씩 뿌려대면서 엄청난 강견의 모습을 보였지만, 그 뒤로 다양한 공격코치들을 거치고, 팀원들에게도 큰 지원을 받지 못하면서 플레이스타일이 굉장히 변했다. 과감한 패스보다는 극히 안정 지향적인 플레이스타일로 변했다. 팔에서 나오는 힘이 워낙좋아서 구속이 빠르고, 정확도가 좋다보니 리시버가 열릴 것 같은 장면을 눈으로 본 다음에 던져도 수비가 반응하기 전에 공이 도착을 했고, 이게 그의 낮은 턴오버 비율의 플레이스타일에 굉장히 큰 기여를 했다. 반면에 이번에 공격코치가 된 마이크 맥다니엘이 운영하는 스타일은 전술상으로 플레이를 열리게 설계를 하는데, 그 열리는 순간이 공을 잡고 3초 뒤라면 쿼터백의 손에서 공이 1초는 전에 떠나기를 원한다. 즉, 리시버가 열린걸 보고 던지는게 아니라, 수비도 반응을 하지 못하게 열리기는 커녕 리시버가 근처에 있기도 전에 쿼터백이 미리 던지길 주문하는 구도이다. 이 둘이 워낙 클래스가 있는 인물들이라 비록 스타일이 다를지라도 시간이 지나면 어떻게든 호흡을 맞춰나가지 않을까라고 생각했는데, 이게 완전히 무너진 것 같다.<\/p><p>이번 게임에서 나온 인터셉션 2개는 이를 완벽히 보여준다. 두 번의 플레이 모두 그가 던질 곳을 계속해서 쳐다보다가 수비가 있건말건 던지는 모습이 나오고 있는데, 설계상 &quot;여기가 이 타이밍에 열릴거야 믿고 던져라&quot;고 주문이 들어왔는데, '아 열릴지말지 어떻게 안보고 알아.. 봐야지..' 하고 보고 있다가, '아 던지면 안될 것같은데 일단 코치 말을 믿고 던지는게 시작이라했으니 에라이 던지자' 하고 던져서 인터셉션이 나온 구도였다... 어쩌다가 이렇게 까지 저스틴 허버트의 폼이 급격하게 떨어진지 의아할정도인 상황이다. 안타깝게도 이 두 명의 인물(맥다니엘과 허버트)이 공생을 하기 위해서 시간이 좀 걸릴 거라고 이야기한 적이 있었는데, 주변에서 아무도 이들을 도와주지 않으면서 그 부조화가 훨신 격렬하게 드러난 느낌이다. 오라인은 또다시 작년 후반부처럼 쑥대밭이 되어서 쇄도해 들어오는 수비를 아무도 막지 못하고 있고(저스턴 허버트는 커리어 내내 동기간 동안 조기 은퇴한 앤드류 럭보다 더 많은 쿼터백 히트를 당하고 있다...), 리시버 쪽에서도 맥콩키 외에는 무기가 없다. 심지어 맥콩키도 마치 전년도 빌스의 샤키어나, 이번시즌 콜츠의 조쉬다운스처럼 제한된 상황에서만 쓸 수 있는 카드라 적응기간에 모든게 무너지면서 자신감이 다 깨져버릴까 걱정이 된다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/jWH-89aiyjw\" title=\"YouTube\"><\/iframe><\/div><p>이게 더욱 아쉬운 점은 이제야 조금씩 차저스의 러닝과 수비쪽에서 정신을 차리고 있기 때문이다. 오마리온 햄튼이란 러닝백에 키튼 미첼이라는 스피드가 주력인 러닝백간의 조화를 만들면서 러닝게임이 조금 풀리기 시작했다. 전 주에 빌스 게임부터 러닝이 조금씩 먹히기 시작했는데, 이는 빌스의 수비가 못해서 그런거라고 넘어갈 수 있지만, 이번 상대인 시호크스 상대로도 러닝이 막 엄청 나쁜 수준은 아니었다. 거기다가 수비쪽에서도 폼이 조금씩 올라오고 있다. 특히나 투이 툴리포토와 칼릴 맥이 지켜주는 엣지 쪽이 상대의 러닝을 계속해서 틀어막는 모습이 나오고 있다는 것은 분명 지옥속에서 희망이라고 할만하긴하다...<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">러닝 EPA<\/th><th class=\"r\">러닝 성공률<\/th><th class=\"r\">수비 플레이당 EPA<\/th><th class=\"r\">허용야드<\/th><th class=\"r\">실점<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">1주차<\/td><td class=\"r\">-0.36 (30위)<\/td><td class=\"r\">37.5% (22위)<\/td><td class=\"r\">+0.14 (22위)<\/td><td class=\"r\">396 (24위)<\/td><td class=\"r\">26 (17위)<\/td><\/tr><tr><td class=\"l\">2주차<\/td><td class=\"r\">-0.50 (29위)<\/td><td class=\"r\">32.3% (22위)<\/td><td class=\"r\">-0.10 (11위)<\/td><td class=\"r\">308 (15위)<\/td><td class=\"r\">26 (23위)<\/td><\/tr><tr><td class=\"l\">3주차<\/td><td class=\"r\">+0.07 (7위)<\/td><td class=\"r\">61.5% (2위)<\/td><td class=\"r\">-0.02 (17위)<\/td><td class=\"r\">351 (19위)<\/td><td class=\"r\">24 (14위)<\/td><\/tr><tr><td class=\"l\">4주차<\/td><td class=\"r\">+0.09 (8위)<\/td><td class=\"r\">44.4% (12위)<\/td><td class=\"r\">-0.09 (7위)<\/td><td class=\"r\">288 (7위)<\/td><td class=\"r\">30 (25위)<\/td><\/tr><\/tbody><\/table><\/div><p>시애틀 시호크스는 여전히 수비쪽에서 강력한 모습을 보여주었다. 재밌는 장면이 많았는데, 내곽 수비라인맨인 바이런 머피를 바닥에 손을 짚은 상황에서 쇄도를 시키는게 아니라 몸을 일으킨 상태에서 쇄도를 시켰다. 바닥에 손을 짚으면 팡하고 튀어나기 더 좋으니 자신의 체중을 이용한 파워 러시에 좀 더 유리한거고 몸을 일으키면 민첩한 좌우 스탭을 통해서 상대의 중심을 무너뜨리면서 쇄도를 하는 유형에게 더 유리한건데, 139kg인 바이런 머피에게 너의 민첩함을 보여줘라 라고 하는 그림이라... 자신감보소... 라는 생각이 들었고, 오히려 에먼워리라고 세이프티, 즉 2선 수비를 엣지러셔 자리에 바닥에 손을 짚고 쇄도를 시키는 그림이 나왔는데, 마이크 맥도널드 감독이 정말 자기마음대로 하고 있구나를 느끼게 했다. 이번 경기 시호크스의 수비는 차저스의 쿼터백 저스틴 허버트에게 지옥을 선사했는데, 32번의 패스 중에 12번이 쿼터백 히트로 기록되었다. 단순히 압박이 아니라 실제로 물리적으로 12번이 닿은 것이다. 이번 게임에서는 그냥 닿은것도 아니고 쿼터백에게 거친 태클이 엄청 들어갔었다. 그리고 그 뒤에 2선 수비들도 역시나 강력했다. 닉 에먼워리를 엣지러셔로 쓰고, 데본 위더스푼을 니켈 코너백으로 쓰고 프리쳇을 외곽 코너백으로 돌렸는데 프리쳇이 생각보다 좋은 모습을 보이면서 패스 차단쪽도 단단하고 여전히 태클도 거의 안 놓치는 정밀함을 보이면서 슈퍼볼 챔피언에 어울리는 수비의 모습을 계속 보여주었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/N2kv7R3GVnA\" title=\"YouTube\"><\/iframe><\/div><p>시호크스의 팬들이라면 공격쪽은 걱정이 될 것이다. 케네쓰 워커를 떠나보냈는데, 그의 빈자리를 위해 1라운드에서 뽑은 러닝백 자다리안 프라이스 마저 부상으로 빠진 상황에서 러닝이 막히게 되면, 샘 다놀드의 불안정성이 더 드러나는게 아닐까에 대한 걱정이 있을 것이다. 실제로 이번 게임에서도 그런 부분들이 나오긴 했다. 경기 시작을 인터셉션으로 시작하면서 그 불안감을 크게 만들었는데, 결국에는 무난하고 안정적이게 플레이를 전개하면서 경기를 승리로 이끌었다. 시호크스 자체가 수비가 워낙 강력하기에 공격쪽에서 늘 스페셜할필요는 없다. 실수를 최소화한채 몇몇 중요한 순간에 터뜨려주기만 하면되는데, 이번 게임에서 샤히드를 러닝백으로 넣은 변칙 플레이도 아주 좋았고, 특히 2쿼터 08:55 7:3, 3rd &amp; 16 상황에서 나온 플레이가 좋았는데 에이스인 JSN을 한쪽에 두고 나머지 무기들을 모두 반대쪽에 몰아넣는다. 그리고 JSN을 퍼스트다운 선까지 달리게 하는데 수비는 그를 앞 뒤 그리고 외곽으로 해서 감싼채로 수비를 한다. 근데, 시호크스가 쿠퍼컵을 그의 앞쪽으로 보내면서 수비를 살짝 한발 더 앞으로 땡기고, 최후방 수비수는 JSN의 빅플레이 능력이 무서워서 한발 정도 더 뒤로 물러서는데 그렇게 생긴 작은 틈을 샘 다놀드는 기가막히게 파고 들었고, 이 플레이 이후에 경기의 승세가 완전히 넘어가버렸다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/GODDI63wy3c\" title=\"YouTube\"><\/iframe><\/div>","401872978":"<p>대학 미식축구 경기인가? 하는 생각이 들 정도로 두 팀이 수비는 내다 버리고 공격만 하는 경기였다. 점수는 그리 많이 나지 않았지만 양 팀 합쳐 1,000야드 가까이 오간 대난투였고, 그 난투 속에서 캐롤라이나 팬서스가 32-26으로 승리했다.<\/p><p>가장 인상적인 것은 쿼터백 브라이스 영이다. 역대 최악의 1순위 지명 후보로 거론될 정도로 형편없는 데뷔 시즌을 보냈던 선수가 맞나 싶을 만큼 완전히 달라진 모습을 보여 주고 있다. 판단력과 침착함이 몰라보게 좋아졌는데, 2.5초 안에 던진 패스의 EPA가 리그 전체 4위에 달하고, 블리츠를 받을 때 오히려 더 잘하고 있다. 이번 경기에서도 블리츠를 7번 받아 그중 5번을 성공시키며 72야드 1터치다운을 기록했다. 환골탈태라는 게 이런 걸까 싶다.<\/p><p>플레이를 직접 보면, 포켓 안에서 조금씩 움직이며 시간을 벌거나 패스 각을 여는 모습이 거듭 나왔고, 판단력과 정확도가 뛰어나다는 것이 여러 번 느껴졌다. 데뷔 때부터 돋보였던 빠른 릴리스는 더욱 빛을 발하고 있다. 대학 최고의 선수이자 그해 1순위 지명자였지만, 주전은커녕 벤치로 밀려나며 모든 게 무너졌던 선수다. (심지어 같은 해 그보다 늦게 뽑힌 C.J. 스트라우드는 NFL 역사에 손꼽히는 신인 시즌을 보내며 가혹한 비교 대상이 됐다.) 그런 선수에게서 지금은 빠른 판단력과 침착함, 그리고 자기 결정에 대한 자신감이 느껴진다.<\/p><p>플레이 스타일에서도 흥미로운 변화가 있는데, 필드 중앙을 공략하는 모습이 아주 좋았다. 23~24시즌만 해도 중앙은 아예 외면하고 경기하는 느낌까지 주던 선수였지만, 이번 시즌에는 트레버 로렌스 다음으로 중앙에 정밀한 패스를 보내는 선수다. 이게 특히 잘 드러난 장면이 3쿼터 5분경, 22-19로 앞선 상황에서 승부를 굳힌 공격권이다. 아래 영상을 보면, 브라이스 영은 샷건도 플레이액션도 아닌 순수 언더센터 패스 플레이에서 필드 왼쪽을 읽었다가 곧바로 중앙으로 시선을 돌려 중거리 패스를 성공시킨다. 그다음다음 플레이는 언더센터 플레이액션 패스인데, 라인배커들 뒤, 세이프티 바로 앞 공간에 공을 정확히 떨어뜨리는 빅플레이를 만든다. 이어서 화면 아래쪽의 1선 수비수가 쇄도하는 듯하다가 뒤로 빠지는데, 그 페이크를 읽고 그 선수 옆으로 빨랫줄 같은 패스를 연결한 장면은 감탄을 자아냈다. 올해 여러 쿼터백이 전년도보다 폼이 떨어지며 많은 팬의 마음을 아프게 하고 있는데, 브라이스 영은 이번 경기에서 어쩌면 커리어 최고의 경기를 펼쳤고, 확실히 계속 우상향하고 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/9bmrLIibjLM\" title=\"YouTube\"><\/iframe><\/div><p>그리고 이렇게 된 데에는 공격 코치 브래드 이드직의 공이 아주 크다. 브래드 이드직은 이번 경기 전반전에 대학에서 쓸 법한 RPO를 들고 나왔는데, 라이언스 라인배커진은 여기에 아무런 해답을 내놓지 못하고 영혼까지 털렸다. 특히 올해 드래프트된 신인 라인배커 지미 롤더가 RPO(쿼터백이 수비를 읽고 러닝과 패스 중 하나를 선택하는, 대학에서 많이 나오는 플레이)에 전혀 대응하지 못하는 것을 포착하고 그 부분만 집요하게 공략했는데, 잔인하다 싶을 정도였다. 결국 그 라인배커는 경기를 끝까지 마치지 못하고 벤치로 내려갔다.<\/p><p>팬서스 경기를 보면서 느끼는 또 하나의 포인트는 리시버들의 수준이 크게 올라가고 있다는 점이다. 단순히 캐치 능력이 좋아졌다기보다, 수비 진형을 보고 쿼터백이 던지기 편하게 움직이는 장면이 눈에 띄게 늘었다. 이드직 공격 코치가 리시버 코치 출신이라 훈련에서 이 부분을 강조한 게 아닐까 추정만 하고 있긴 한데, 이번 경기의 주인공 테타이로아 맥밀란이 이런 플레이를 여러 차례 보여 주었다. 전년도 공격 부문 신인상을 받은 맥밀란은 팀의 1번 리시버를 넘어, 고작 2년 차에 리그에서 두 손가락 안에 꼽히는 리시버 대열에 들어설 기세로 뛰고 있다. 그리고 방금 언급한 그의 쿼터백 친화적인 움직임이 이번 경기에서 많이 나왔다.<\/p><p>그가 슬랜트로 터치다운을 기록한 플레이에서 수비는 커버 0, 즉 리시버들을 코너백과 1대1로 붙이고 나머지는 모두 쇄도시키는 전술을 들고 나왔다. 맥밀란은 수비 움직임을 보자마자 이를 파악하고, '우리 쿼터백이 압박을 받으니 더 빨리 꺾어야겠다'고 판단해 원래 루트보다 한 템포 빠르게 꺾으며 터치다운을 만들어 낸다. 그다음 RPO 장면에서도, 라인에서 출발하는 순간 바깥쪽으로는 코너백, 안쪽으로는 세이프티의 더블팀을 받고 있다는 걸 바로 알아차린다. 그리고 몸을 살짝 더 쿼터백 쪽으로 꺾어서 세이프티보다 공이 먼저 도착할 공간으로 움직인다. 이런 작은 움직임들이 쿼터백의 삶을 편하게 해 준다.<\/p><p>이게 놀라운 이유는, 맥밀란의 장점이자 플레이 스타일이 외곽에서 코너백을 상대로 압도적인 1대1 능력을 앞세워 경기를 지배하는 쪽이기 때문이다. 즉 늘 외곽에서 뛰며 피지컬을 활용한 1대1 능력으로 승부하던 선수가, 거의 뛰지 않던 안쪽, 일종의 새로운 포지션에서 수비를 읽는 능력까지 키우고 있다는 뜻이다. 그가 어디까지 성장할지 궁금하다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/_W35LSQfSGw\" title=\"YouTube\"><\/iframe><\/div><p>수비 쪽에서는 딱히 할 말이 없다. 라이언스 러닝백 자미어 깁스를 막는 데 총력을 기울였고, 그게 꽤 통했다. 대신 패스 수비에서 많은 걸 희생해야 했지만, 자신들의 공격력도 나쁘지 않았기에 감수하기로 한 듯하다. 여기에 가끔 나온 유의미한 압박이 통한 것 정도를 위안으로 삼아야 하지 싶다.<\/p><p>반면 라이언스 쪽에서 보면, 공격은 폭발적이었다. 상대의 노골적인 러싱 수비 전략에 자미어 깁스가 시도당 3.1야드로 봉쇄당한 상황에서도 400야드 가까이 패스를 하며 왜 자신들이 강력한 공격을 가졌는지 보여 주었다. 물론 조금씩 흔들리며 터치다운까지 이어지지 못한 순간들은 아쉬울 수 있지만, 그럼에도 팬서스 수비를 상대로 강한 모습을 보였다. 다만 수비가 자동문 수준이라, 마치 전년도 뱅갈스처럼 공격이 완벽해야만 이길 수 있는 팀이 되었다. 그리고 공격이 계속 큰 짐을 지게 되면서 몇 가지 경향이 조금씩 나타나기 시작한 게 아닐까 하는 걱정이 든다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">언더센터 비중<\/th><th class=\"r\">샷건 비중<\/th><th class=\"r\">샷건에서 패스 비중<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">26시즌 4주차<\/td><td class=\"r\">26%<\/td><td class=\"r\">74%<\/td><td class=\"r\">96%<\/td><\/tr><tr><td class=\"l\">26시즌<\/td><td class=\"r\">47%<\/td><td class=\"r\">53%<\/td><td class=\"r\">91%<\/td><\/tr><tr><td class=\"l\">25시즌<\/td><td class=\"r\">49%<\/td><td class=\"r\">51%<\/td><td class=\"r\">84%<\/td><\/tr><tr><td class=\"l\">24시즌<\/td><td class=\"r\">55%<\/td><td class=\"r\">45%<\/td><td class=\"r\">74%<\/td><\/tr><\/tbody><\/table><\/div><p>라이언스는 벤 존슨이 24시즌을 마치고 떠난 뒤로 스타 선수들에게 경기를 맡기려는 경향이 강하다. 물론 이게 나쁜 것은 아니다. 자미어 깁스와 아몬라 세인트 브라운은 같은 포지션에서 리그 둘째가라면 서러울 선수들이고, 공을 줄 때마다 확실한 빅플레이가 나온다고 해도 과언이 아닐 만큼 기대에 부응하는 선수들이다. 다만 이런 '믿음의 미식축구' 경향이 쿼터백 재러드 고프에게도 적용된다. 경기가 화력전 양상으로 흘러가고 수비가 다양한 블리츠를 걸어오기 시작하면, 경기 운영 자체를 재러드 고프에게 맡기는 느낌이 있다. 물론 아닐 수도 있지만, 벤 존슨 시절의 균형 잡힌 공격이 무너지는 순간들이 몇 번 있었고, 그런 장면이 이번 경기에서도 드러났다고 생각한다.<\/p>","401872979":"<p>슈퍼돔은 허리케인 카트리나로 뉴올리언스가 초토화됐을 때 이재민들의 임시 거처 역할을 했고, 도시가 겨우 정비된 뒤 세인츠의 홈구장으로 다시 문을 열었다. 이번 경기는 그 재개장 20주년 홈경기였는데, 홈 관중의 기대와 달리 애틀랜타 팰컨스가 뉴올리언스 세인츠를 45-24로 그야말로 짓밟고 간 경기였다. 1, 2주차에 시즌이 끝났다 싶을 정도로 졸전을 펼치는 걸 보며 &quot;왜 이런 팀을 3주 연속 프라임타임에 잡아 놓은 거야&quot; 하고 불만을 터뜨렸던 나로서는 꿀 먹은 벙어리가 되는 경기였다.<\/p><p>승리한 팰컨스 입장에서 짚어 볼 중요한 포인트가 몇 가지 있는데, 그중 가장 중요한 것은 역시 러싱 게임이다. 팰컨스는 이번 경기에서도 200야드 넘게 러싱하며 2경기 연속 상대를 그야말로 짓밟았다. 러싱 기록을 보면 어처구니가 없을 지경인데, 특히 인상적인 부분은 오라인에 부상자가 나온 와중에도 이런 성적이 나왔다는 점, 그리고 브라이언 로빈슨과 비쟌 로빈슨을 가리지 않고 러싱 성공률이 상당히 높다는 점이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">팀 러싱 야드<\/th><th class=\"r\">시도당 러싱 야드<\/th><th class=\"r\">러싱 성공률<\/th><th class=\"r\">EPA<\/th><th class=\"r\">비쟌 로빈슨 시도당 야드<\/th><th class=\"r\">브라이언 로빈슨 시도당 야드<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">4주차<\/td><td class=\"r\">207야드<\/td><td class=\"r\">6.27<\/td><td class=\"r\">61%<\/td><td class=\"r\">+0.37<\/td><td class=\"r\">7.63<\/td><td class=\"r\">4.43<\/td><\/tr><tr><td class=\"l\">3주차<\/td><td class=\"r\">244야드<\/td><td class=\"r\">6.26<\/td><td class=\"r\">64%<\/td><td class=\"r\">+0.31<\/td><td class=\"r\">6.69<\/td><td class=\"r\">5.0<\/td><\/tr><tr><td class=\"l\">2주차<\/td><td class=\"r\">121야드<\/td><td class=\"r\">4.32<\/td><td class=\"r\">36%<\/td><td class=\"r\">-0.18<\/td><td class=\"r\">4.50<\/td><td class=\"r\">4.64<\/td><\/tr><tr><td class=\"l\">1주차<\/td><td class=\"r\">120야드<\/td><td class=\"r\">3.87<\/td><td class=\"r\">45%<\/td><td class=\"r\">-0.08<\/td><td class=\"r\">3.95<\/td><td class=\"r\">3.44<\/td><\/tr><\/tbody><\/table><\/div><p>하지만 이 러싱이 이렇게까지 폭발적일 수 있는 건 러닝백 비쟌 로빈슨 덕분이다. 순간 스피드와 민첩함, 터프함을 모두 갖췄고 다양한 러싱 스킴에서 활약할 수 있는 선수지만, 팰컨스 오라인과 스테판스키 감독이 가장 아끼는 전술인 아웃사이드 존에서 특히 대단했다. 이번 경기에서도 세 번째 플레이에서 미친 러싱이 나오며 기선을 제대로 제압했는데, 역시 아웃사이드 존이었고, 이 선수가 얼마나 위대한지 느끼게 해 준다.<\/p><p>좋은 러닝백은 블로킹을 따라 빅플레이를 만들고, 훌륭한 러닝백은 블로킹이 열릴 때까지 침착하게 기다릴 줄 알며, 특별한 러닝백은 잘못된 블로킹마저 좋은 블로킹으로 바꿔 놓는다. 이 플레이에서도 수비수가 바깥으로 넓게 돌아 들어오며 블로킹을 순식간에 제쳐 버려 태클을 당할 상황이었다. 그런데 비쟌은 순간적으로 안쪽으로 움직여 태클을 피해 버린다. 이것만으로도 뭐지 싶을 정도로 말도 안 되게 민첩한데, 수비 입장에서는 동료가 바깥으로 돌아 들어가며 블로킹을 무력화했으니 바깥보다 안쪽을 신경 쓸 수밖에 없었다. 그 순간 비쟌이 갑자기 바깥으로 튀어 나가 버린다. 결국 오라인이 상대를 놓친 것이 오히려 엣지 러셔를 뒤로 흘려보내고 라인배커들은 안쪽에 묶어 두는 결과가 되어 길이 열렸고, 열린 공간에서 이 선수를 잡을 수 있는 수비수는 없었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/xyZMqbqYFO0\" title=\"YouTube\"><\/iframe><\/div><p>경기를 보다 보면 '팰컨스가 공격을 너무 쉽게 하는데?' 하는 생각이 들 수 있는데, 이게 러싱이 먹힐 때 공격 팀에 생기는 여유다. 그리고 쿼터백 마이클 페닉스는 여기서 생기는 이점을 한껏 활용하고 있다. 케빈 스테판스키 감독은 패싱 게임을 순수 패스보다는 러싱에서 파생되는, 러싱인 척 패스하는 플레이액션 위주로 구성했는데, 이게 페닉스의 장점과 아주 잘 맞아떨어진다. 마이클 페닉스는 어린 쿼터백으로 아직 장단점이 뚜렷한 편이다. 브락 퍼디 같은 정밀한 수비 분석 능력이나 압박을 피하는 능력보다는, 장거리 패스의 정확도가 큰 장점인 선수다. 상대 수비는 러싱을 신경 쓰느라 적극적으로 쇄도할 수 없고, 라인배커들이 1선 쪽으로 끌려 나오면 페닉스는 그 뒷공간을 정말 과감하게 노린다. 플레이액션 상황에서 마이클 페닉스 주니어의 시도당 야드는 11야드로 리그 3위이고, 패스의 50% 이상이 15야드 이상으로 이 부문에서는 리그 1위다.<\/p><p>케빈 스테판스키 감독이 페닉스를 정말 잘 쓰고 있다고 생각하는 이유는, 팰컨스 패싱 게임에서 가장 주력으로 쓰는 플레이가 플레이액션-플러드 컨셉이기 때문이다. 러싱인 척 패스하며 라인배커들을 앞으로 끌어당기고, 한쪽에 있는 무기들이 각각 단거리, 중거리, 장거리 루트를 탄다(한쪽 공간을 홍수처럼 채운다고 해서 FLOOD 컨셉이라고 부른다). 이렇게 하면 마이클 페닉스 주니어는 필드의 절반만 보면 되니 단점이 상쇄되고, 동시에 장거리 패스 루트가 두 개나 있어 장점까지 살릴 수 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/vp9XjrJLLrw\" title=\"YouTube\"><\/iframe><\/div><p>최근 팰컨스의 상승세에서 또 하나 인상적인 것은 수비 코치 제프 울브리치의 압박 생성 능력이다. 울브리치는 전년도에도 이름난 수비수 없이 리그에서 꽤 압박을 잘 만들어 내는 코치였다. 그래도 그때는 1라운드 신인이 두 명 있었으니 '그 선수들이 성장했네'라고 볼 여지도 있었고, 블리츠를 적극적으로 썼으니 그 덕분이라는 비판도 어느 정도 있었다. 그럼에도 압박을 만들어 내는 것 자체가 귀한 능력이기에, 감독이 바뀌고 새 감독이 자기 사람들로 코칭스태프를 채우는 와중에도 수비 코치 자리를 지켰다.<\/p><p>그리고 이번 시즌에는 그런 비판마저 사라지게 하는 엄청난 활약을 보여 주고 있다. 전년도에 맹활약한 1라운더들이 모두 결장 중이고, 블리츠 비율이 리그에서 뒤에서 다섯 번째인 팀인데도 압박을 계속 만들어 내고 있다. 이번 경기에서는 압박을 총 11번 만들어 내며 상대 쿼터백에게 지옥을 선사했는데, 그중 50% 정도가 블리츠 없이 만든 것이었다. 이번 시즌 쿼터백 히트 비율은 무려 리그 7위다. 2라운드 지명권을 주고 데려온 선수조차 없을 정도로 무명 선수들로 꾸린 라인인데, 저번 덱스터는 압박률 17.1%, 브랜든 돌러스는 15%로 현재 같은 포지션에서 리그 1, 2위다. 자다리우스 스미스도 마찬가지로 저렴하게 데려온 선수다.<\/p><p>물론 팰컨스가 앞으로도 이 기세를 유지할지는 확답하기 어렵다. 지난 2주 동안 팰컨스가 만난 수비 코치가 패커스의 조나단 개넌, 세인츠의 브랜든 스테일리였기 때문이다. 이 둘은 적은 인원으로 러싱을 막겠다는 고집이 좀 있는 코치들이라 러싱에 무너지는 경우가 종종 있었다. 그래서 다른 팀을 상대로도 이 정도로 강력한 러싱을 얼마나 유지할 수 있을지는 조금 의문이다. 그렇다 해도 리그에서 다섯 손가락 안에 드는 러싱일 거라는 생각은 든다. 오히려 앞으로 변동성이 더 클 쪽은 패스 압박이다. 패커스와 세인츠 모두 오라인 부상으로 고생하는 팀이라, 오라인 상태가 더 좋은 공격을 상대로는 어떨지 지켜봐야 한다.<\/p><p>세인츠 입장에서는 시즌이 지날수록 미래가 점점 암담해지고 있다. 지난해 세인츠에 기대를 걸게 된 이유는 타일러 슉의 패싱 게임이 생각보다 괜찮았고, 이번 오프시즌에 오라인을 본격적으로 보강하고 러닝백까지 데려와 패스와 러싱의 균형이 잡히면 더 파괴력이 생기지 않을까 하는 기대가 있었기 때문이다. 그런데 전혀 뜻대로 풀리지 않고 있다. 야심 차게 데려온 트레비스 에이첸은 부상으로 결장했고, 부상 전에도 리그 최하위권 러싱 성적을 보이고 있었다. 게다가 오라인에도 부상이 계속 쌓이면서 러싱 게임은 더 처참해지고 있다.<\/p><p>이글스가 슈퍼볼을 우승할 때 공격 코치였던 켈렌 무어가 세인츠 감독으로 오면서 러싱 게임 코치도 함께 데려왔는데, 아마 '이글스의 막강한 오라인 없이는 그때처럼 안 되네?' 하고 느끼고 있을 것이다. 이번 경기에서는 러싱 19번 시도에 단 50야드에 그쳤다. 러싱이 사라지니 패스 일변도의 경기가 됐고, 상대 입장에서 그만큼 공략하기 쉬운 공격도 없다. 쿼터백 타일러 슉은 최선을 다하고 있지만, 러싱 걱정 없이 마음 놓고 쇄도하는 상대 1선 수비진을 부상당한 오라인으로 막아 낼 수는 없는 형국이다.<\/p>","401872980":"<p>템파베이 버커니어스가 저번주 절정의 경기력을 선보인 달라스 카우보이스 상대로 승리를 거두면서 0승 4패의 구렁에서 간신히 1승을 추가하게 되었고, 달라스 카우보이스는 반면에 지난주 기대감을 엄청나게 높이더니 한순간에 고꾸라지게 되었다.<\/p><p>NFL에서는 언제나, 그리고 모든 팀들에게 예상외의 패배라는게 있는 법인데, 이번 경기가 카우보이스에게 그랬다. 달라스 카우보이스의 수비는 정말 이번 게임 형편없었는데, 루키 쿼터백을 상대로 패스 압박률은 20%에 불과했고, 오픈 컴플리션, 즉 리시버와 수비수가 3야드 이상 벌어진 캐치는 무려 13회나 허용했다. 3야드면 카메라에 그 선수 혼자 잡혔다라고 할 정도의 거리다. 시즌 초반에 계속해서 나오던 오프 커버리지 쿠션, 즉 처음에 스냅전에 도열을 할 때 리시버에게 거리를 뜬 채로 수비를 하면서 공격적인 수비보다는 소극적인 수비 즉 최후방을 경계하는 수비로 진행했는데, 상대에게 내준 패스 중에 12개가 이런 공간에 패스가 들어갔었다. 소극적인 수비도 그 장점이 있지만, 베이커 메이필드도 아니고 신인 그것도 언드래프티드, 자신의 커리어 2경기를 치루는 신인에게 이렇게까지 소극적으로 수비가 할 이유가 있을까 에 대한 의문이 있다. 역시나 몇 주전에 말했던 빅팬지오 계보의 수비코치들에게 나오는 소극적 수비의 고집이 또 발현된 결과물이지 않을까 싶다.<\/p><p>물론, 그렇다해도 수비에 큰 책임을 돌리고 싶진 않다. 개인적으로 공격이 강한팀 일수록 더욱 더 공격적인 수비를 해서 화력전으로 가도 오케이 해보자 이런 마인드로 가야한다고 보지만, 공격이 워낙 강하니까 수비는 보수적으로 한다 라는 접근도 근거가 없는 것은 아니다. 그런 의미에서 이번 게임 가장 큰 책임은 공격쪽이다. 지난주 리그 최고의 수비를 상대로 절정의 침착함과 판단력에 따른 경기력을 보여준 닥 프레스캇은 이번 게임에서 50%를 간신히 넘는 패스 성공률에 1터치다운 2인터셉션이라는 졸전을 거뒀다. 씨디램은 지난 경기에 너무 많이 뛰어서인건지 이번 경기 완전히 사라졌고, 조지 피켄스가 분전을 했지만 승리를 하기엔 부족했고, 언제나 조력자 역할을 하던 제이크 퍼거슨은 경기 전체에 굉장히 큰 영향을 끼친 연속적인 실책을 거두면서 전체적으로 공격이 아무런 답도 내놓지 못했다.<\/p><p>버커니어스에서 볼때는 정말 가뭄의 단비와 같은 승리였다. 특히나 감독 토드 보울스의 입장에서는 팬들이 모두 다 해고를 외치기 직전인 상황에서 그래도 몇 명의 마음을 돌리는데는 성공했을 것이다. 특히나 자신의 장기인 수비에서 이런 성과를 거둬서 더욱 더 유의미할 것이다. 토드 보울스는 자신의 주특기인 과감한 블리츠를 꺼내들었는데, 닥 프레스캇은 원래 블리츠에 굉장히 강한 쿼터백 중 하나인데, 이번 경기에서는 블리츠에 대해 아무런 답도 내놓지 못했다. 블리츠를 9번 당했는데 개중에 단 1개의 패스만을 성공했다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">블리츠시 성공률<\/th><th class=\"r\">패서레이팅<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">1~4주차<\/td><td class=\"r\">68.1%<\/td><td class=\"r\">91.0<\/td><\/tr><tr><td class=\"l\">5주차<\/td><td class=\"r\">11.1%<\/td><td class=\"r\">69.5<\/td><\/tr><\/tbody><\/table><\/div><p>거기다가, 블리츠에 따른 부가효과도 좋았는데, 특히나 엣지러셔들을 쇄도하는 듯 액션을 취하다가 뒤로 빠지는 블리츠 페이크가 굉장히 주효했었다. 블리츠가 올줄 알고 빠르게 뒷공간에 패스하려다가 엣지러셔가 물러나면서 패스길을 차단하는 플레이가 여러번 나왔고, 이번 경기의 분수령이 되었던 인터셉션도 이런 페이크에 패스를 던졌다가 공을 수비가 쳐내면서 나왔다. 그외에도 그전까지 별 활약이 없던 수비수들이 굉장히 좋은 모습을 보였는데, 코너백 패리시는 조지피켄스를 상대로 상당히 좋은 수비의 모습을 보였고 (패스 차단 4회), 시즌 내내 전혀 새로운 팀에 적응하지 못하던 라인배커 알렉스 안젤로니가 끝내기 인터셉션을 기록했다.<\/p>","401872981":"<p>런던에서 펼쳐진 미친게임이었다. 이 게임의 마무리는 와.. 정말 말이 안나올 정도였는데, 경기내내 어려움을 겪던 재규어스가 4쿼터 4th 다운에서 파커 워싱턴에게 미친 패스를 연결하면서 터치다운을 만들어낸다. 하지만 재규어스에서 엑스트라포인트 킥을 실패하면서 17-14로 3점차일 수 있던 게임이 16-14로 굳게 되었다. 재규어스는 경기 중간에 롱스내퍼, 필드골이나 펀트 같은 상황에서 스냅을 뒤로 멀리 던지는 포지션의 선수가 부상을 당해서 롱스냅을 고등학교때 해봤다는 수비가 들어와서 스냅을 했는데 이게 발목을 잡고 만 것이다. 여튼 이글스는 이제 필드골 하나면 게임을 승리할 수 있었다. 3분도 안남은 시점에 양팀이 득점 없는 공방을 한번씩 주고받고, 1:35초 남은 상황에서 이글스가 마지막 공격을 받는다. 그리고 제일런 허츠가 갑자기 미치면서 필드를 쭉쭉 전진해서 재규어서의 34야드 지점까지 가게 되는데, 이때 재규어스의 타임아웃은 하나밖에 없고 경기는 25초밖에 남지 않은 상황이었다. 필드골을 차면 51야드, 멀지만 현대 NFL의 키커들 사거리로 불가능한 상황은 아니었다. 이글스 입장에서는 앞으로 3번의 다운에서 플레이의 배분이 중요했다. 상대의 타임아웃을 모두 소진하면서 시간을 최대한 태우고, 필드를 전진해야했다. 재규어스가 타임아웃이 있었고 그걸 무조건 쓸거니까 한번 러닝을 할 수 있고, 우리도 타임아웃이 하나 있으니 한번 러닝을 할 수 있고, 결국 패스를 시도할 수 있는 회수는 1회였다. 그리고 플레이가 시작되는데 첫 플레이에서 패스를 했다 실패한다. 하지만 두번째 플레이에서 또 패스를 한다. 여기서 패스를 실패하면, 재규어스는 타임아웃을 이번 다운에서 아끼고 써드다운에서 타임아웃을 쓰면서 마지막 공격권을 받을 수 있게 된다. 다행히 패스는 성공하는데 루키 마카이 레몬이 아웃으로 나가는 치명적인 실수(경기시간의 진행이 멈춘다)를 저지르게 된다. 그러면서 시간관리 측면에서 패스를 실패한것과 동일하게 되었고, 이후 이글스가 러닝을 하지만 재규어스가 아꼈던 타임아웃을 사용하며 경기시간의 진행을 멈췄다. 이글스는 재규어스 30야드에서 12초남기고 47야드 필드골을 시도해 성공하고, 경기시간이 8초가 남은 상황에서 타임아웃이 하나도 없는 재규어스가 마지막 공격기회를 받는다. 이글스는 아웃라인으로 차는 옵션 대신 재규어스가 반드시 리턴을 해야하는 지역에 공을 찼고, 경기 개막 킥오프에서 터치다운을 했던 재규어스 스패셜팀이 7초안에 53야드를 리턴하고... 1초 남은 시점에 재규어스의 키커가 57야드 필드골을 성공하면서 게임이 극적으로 마무리 되었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/gUiIcxWXISA\" title=\"YouTube\"><\/iframe><\/div><p>경기 끝나고 너무 어안이 벙벙해서 경기의 마지막 부분을 몇번을 돌려보았다. 이글스가 잘못을 했을까? 감독진에서 의사 결정의 잘못이 있었을까? 계속해서 생각을 해봤는데, 내가 내린 결론은 '더 나은 의사결정들이 있었을 수도 있지만, 꽤나 결과론적이고 이번 게임 의사결정들에도 근거는 충분했었다'는 것이다. 마지막 공격권 마카이 레몬 패스에서 아웃을 나갔는데, 아웃라인으로 나간건 루키의 판단실수라고 치고, 꼭 패스를 했어야했나?에 대해서도 러닝을 하면서 타임아웃을 강요하는 옵션이 더 좋았을건데 라고 생각할 수 있다. 하지만, 이글스의 러닝은 이번 게임 끔찍(이번 게임 이글스의 러닝백들은 16번의 시도에 단 20야드, 시도당 1.2야드를 갔을 뿐이다)했고, 51야드 필드골은 좀 부담스러웠을것이라 전진하고 싶었을 것이고, 설령 패스를 실패한다고 해도 재규어스에게는 10몇초만 주어질테니 괜찮다고 생각했을수도 있다. 그리고 킥오프에서 왜 아웃으로 안차고 인필드로 찼는가에 대한 현지의 비판도 거세다. 몇 주전 카우보이스 - 레이븐스 게임에서는 유사한 상황에서 아웃으로 안차고 인으로 찬것에 대해 비판했는데, 왜 이번은 거꾸로 인으로 찬 걱을 비판하나? 생각이 들 수 있는데 가장 큰 차이는 당시 레이븐스는 타임아웃이 1개 있었고, 재규어스는 타임아웃이 없었다는 점이다. 즉, 아웃라인으로 공을 차고 재규어스가 공격권을 8초 남긴 상황에서 35야드에서 공격을 시작해도, 타임아웃이 없기 때문에 아웃라인쪽으로 가는 패스들만 막고 있으면 되었다는 논리이다. 지나고 보면 틀린 말은 아니다. 하지만 아무리 생각해도, 당시에 리턴을 하게 하는 킥오프 의사결정이 잘못되었다고 생각하진 않는다. 아무리 우리팀이 수비를 잘하고 있었다고 해도, 트레버 로렌스보다는 재규어스의 스페셜팀이 덜 부담스럽고 여기서 2초라도 소진시키면 승리 확률이 어마어마하게 올랐을 것이기 때문이다. 감독-코치진의 의사결정은 나쁘지 않았는데 그게 필드위에서 잘 발현되지 않았던 것일 뿐이라고(마카이 레몬의 아웃, 킥오프에서 수비를 전혀 못함) 보는 것이 맞을 것 같다.<\/p><p>오히려 경기내내 보면서 느낀 것은 제일런 허츠에 대한 아쉬움이다. 제일런 허츠는 필드 내곽을 정말 노리지 않는다. 외곽에 AJ 브라운, 드본타 스미스와 같이 상대 수비와 1대1에서 압도할 수 있는 리그에서 수준급에 드는 리시버들이 있고, 강력한 러닝이 있을 때는 이런 단점이 드러나지 않는다. 하지만 지금과 같이 리시버들이 1대1을 압도하지 못하고 러닝도 안되어서, 전술과 쿼터백의 필드를 보는 의사결정으로 이겨야 할 때, 이 부분이 안되고 외곽만 노리면서 경기가 극히 단조로워진다. 실제로 NGS 에서 나온 데이터에 따르면, 작년 패스의 41% 에는 리시버 중 하나가 내곽 쪽으로 파고드는 루트가 포함되어있다(이는 리그에서 28위로 매우 낮은 수치긴하다). 하지만, 내곽 루트가 있는 플레이에서 단 17%만 그쪽으로 던졌는데, 이는 내곽 루트가 있는 플레이에서 내곽을 노리는 비율이 전체 팀중 22위인 수치이다. 이번 시즌을 보면 더하다. 그의 플레이들에는 49% 내곽 루트가 포함되어있다(리그 17위 - 평균수준) 근데 이 플레이들 중에 내곽 선수를 노리는 비율은 16%에 불과하고 이는 리그 24위다. 이러한 허츠의 외곽 선호는 사실 커리어 내내 있던 일이다. 2020년부터 1000회 이상 던진 43명의 쿼터백 중 중앙을 노리는 비율이 뒤에서 두번째인 쿼터백이다(그 밑에는 보닉스 뿐이다). 이번 게임에서도 경기 막판 마카이 레몬에게 갔던 패스 위 영상)를 보면 필드 중앙에 달라스 고더트가 완전 오픈인데 허츠가 전혀 보지 않는것을 볼 수 있다.<\/p><p>반면 이글스의 수비는 명불허전이었다. 이번 게임 이글스의 온갖 안좋은 소식과 공격의 난조 속에서 게임이 비등했던 것은 수비 덕분이다. 특히나 내곽 수비수인 제일런 카터의 경기력은 말도 안되는 수준이었다. 내곽 수비 라인맨이 이렇게 경기를 혼자 찢어버리는건 정말 오랜만에 보았다. 그의 상징과도 같은 스냅 순간의 민첩한 움직임으로 순식간에 오라인을 벗겨버리고 파고드는 움직은 경이로운 수준이었다. 물론 재규어스의 오라인 선수진의 재능이 그리 높은 수준은 아니다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/LwNFhIyRYu0\" title=\"YouTube\"><\/iframe><\/div><p>재규어스 쪽으로 넘어가보자. 재규어스에게 이상적인 게임이 아니었다. 빈사상태의 이글스 상대로도 그들이 자랑하던 공격은 꽤나 막혔었는데, 전시즌 후반부 특히나 플레이오프급 팀들을 상대할 때 보이던 약점들이 다시금 나타났다. 가장 중요한 포인트는 오라인의 붕괴이다. 러닝은 시도당 3.3야드에 불과했고, 패스에서도 압박을 지속적으로 받으면서 오라인이 아주 긴 하루를 보냈다. 이게 더욱 걱정이 되는 몇가지 이유들이 있는데 가장 큰 것은 이런 오라인붕괴가 브롱코스전에서도 나온 반복적이라는 점이다. 이번 시즌 들어오면서 재규어스는, 25시즌 후반기 무너진 오라인을 정비하기 위해 팀의 오라인 중 에이스인 안톤 해리슨을 오른쪽에서 왼쪽으로 옮겨야했고, 콜 반 라넨은 왼쪽에서 오른쪽으로 옮겼는데, 이게 이번 시즌까지 나쁘지 않았다. 특히나 안톤 해리슨은 생각보다 많이 잘해주고 있다고 봤는데, 그렇다고 오라인 자체의 성능이 탑급으로 올라간 것은 아녔다. 지난주 리뷰에서, 재규어스의 러닝이 폼이 엄청 올라왔다 라고도 했었는데, 물론 오라인의 덕도 있지만, 전술적인 측면도 굉장히 크다. 이를 보여주는 것이 러닝게임에서 오라인의 강력함을 보여주는 지표 중 하나인 야드 비포 컨택트에서, 재규어스는 지난 시즌 27위, 이번 시즌 역시나 28위를 하고 있다는 것이다. 그리고 이러한 오라인의 한계가 1선수비의 전력이 플레이오프급 이상인 팀을 만날때(지난 브롱코스에 이어 이번 이글스) 반복되며 드러났다는게 걱정이 된다. 거기다가 오라인 에이스인 안톤 해리슨이 부상으로 꽤나 결장을 할 것으로 보이는 점 역시 이 걱정을 더 키운다.<\/p><p>둘째로는 반칙이다. 재규어스는 지난 해 공격측 반칙이 가장 많은 팀 (4위) 중 하나였다. 공격쪽의 반칙은 플레이가 시작되기 전 반칙인 프리스냅 페널티와 플레이 중에 일어나는 페널티로 나눌 수 있는데, 이 프리스냅 페널티가 통상적으로 감독의 경기준비, 기강과 같은 부분에 연동이 된다. 하지만 작년에는 리암 코엔 감독이 새로 왔었고, 새로운 시스템을 선수들이 배우다보니 일어날 수 있는 해프닝이라고 봤는데, 문제는 이번 시즌에도 그런 경향이 이어지고 있다. 오히려 전년대비 반칙이 늘어났고, 이번 게임에서는 공격쪽의 반칙을 무려 11개(프리스냅은 6개)나 저질렀었다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">경기당 공격 반칙<\/th><th class=\"r\">프리스냅 반칙<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">25시즌<\/td><td class=\"r\">4.12개 (4위)<\/td><td class=\"r\">2.12개<\/td><\/tr><tr><td class=\"l\">26시즌<\/td><td class=\"r\">6.0개 (3위)<\/td><td class=\"r\">2.6개<\/td><\/tr><tr><td class=\"l\">26시즌 vs 이글스<\/td><td class=\"r\">11개<\/td><td class=\"r\">6개<\/td><\/tr><\/tbody><\/table><\/div><p>이와 더불어 리암코엔의 묘한 고집이 보이기도 했던 게임이다. 전술천재형 감독을 기용한다면 어쩔 수 없는 비용인걸까. 한번씩 이런 감독들은 상대의 허를 찌르려는데 너무 초점을 맞추머 이상한 전술을 펼치는 경우들이 있는데, 이번 게임에서는 그게 레드존 그것도 골라인 코앞에서 굉장히 많이 일어났다. 골라인에서는수비할 공간이 워낙 좁아지다보니, 순수 매치업에서 힘 승부로 이기거나 한 번 정도의 페이크로 순식간에 승리를 해야하는데, 머리를 너무 쓴 듯했다. 전반 종료 직전의 플레이가 그 대표적인 예시인데, 골라인을 앞에두고 러닝백을 리시버 쪽으로 뺀다. 골라인에서 때려박을 수 있는 러닝백이 빠지는 것부터 의문이 들긴한다. 트레버 로렌스의 QB스닉만으로 종적인 플레이에 대한 위협이 충분히 될거라고 생각한 것 같은데... 그렇다고 러닝백을 밖으로 빼면서 아예 옵션을 없앨 필요가 있을까 싶긴하다. 특히나 러닝백을 밖으로 뺄 때 따라간 선수는 이글스의 대표 라인배커이자, 리그에서 손꼽히는 라인배커 잭 본이다. 내곽으로 러닝을 한다면 내곽에서 잭 본이 빠진건 좋은 뉴스인데, 재규어스가 준비한 플레이는 리시버가 밖에서 빙 돌아 뛰는 젯스윕이다. 그렇다면, 잭본의 블로킹을 외곽에 나간 러닝백이 해야하는건데... 잭본은 라인맨들도 블로킹을 힘들어하는 선수인데도 이런 전술을 실행했고, 역시나 필드의 뒤에서 게임이 터진다. 그외에도 4쿼터 골라인 앞에서 갑자기 트레버 로렌스를 밖으로 빼고 러닝백인 로드리게즈가 샷건 포메이션에서 스냅을 받는 와일드캣을 들고 나온다. 공격이 뜻대로 안풀리면서 비장의 수를 꺼내야겠다는 마음은 이해가 간다. 그런데 러닝백 샷건 포메이션에서 플레이를 정기적으로 성공시키는 선수는 데릭헨리밖에 못본 것 같은데... 역시나 이 플레이는 실행도 안되고 반칙이 불리게 된다. 어쩌면 이번 경기 프리스냅 페널티가 이렇게 많았던것도, 이런 비정형적인 전술을 하느라 선수들끼리 소통이 늦어져서 아닐까? 하는 생각도 든다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/idnsXq80gOo\" title=\"YouTube\"><\/iframe><\/div><p>그렇다면 이렇게 오라인도 쉽지않고, 반칙도 많고 레드존에서도 실수 뿐이었는데 어떻게 승리를 할 수 있었을까? 공격쪽에서는 플레이메이커들이 대활약을 했다. 특히나 파커 워싱턴의 활약은 어마어마했다. 23년도 6라운드로 뽑혀서 리시버인데도 블로킹, 짧은 패스 등의 궂은일을 하던 선수인 그는 지난해 말부터 팀의 1번리시버로 올라섰는데, 이번 시즌에는 팀의 1번을 넘어서 리그에서도 수준급 리시버로 본인이 언급되어야한다는 걸 증명하고 있다. 이번 경기에서도 6번의 캐치 124야드 2터치다운이란 어마어마한 활약을 했고, 특히나 4th 다운 상황에서 보여준 터치다운 캐치는 이 드라마틱한 게임에서도 가장 기억에 남는 순간 중 하나일 것이다(첫 터치다운 끝나고 나온 루니 터치다운도 향수를 불러일으켰다...)<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/kvVHmTXHxDc\" title=\"YouTube\"><\/iframe><\/div>","401872982":"<p>경기는 31대 24로 신시내티 뱅갈스가 마이애미 돌핀스 상대로 하나의 터치다운 차이로 승리한 경기였지만, 실제 경기는 최종 결과보다 훨신 원사이드 했다. NGS 승리확률 기준으로는 뱅갈스의 승리 가능성이 75%아래로 내려간 적이 한번도 없기도 했다. 공수 양면에서 뱅갈스는 리빌딩 모드에 들어간 돌핀스 상대로 압도적인 게임을 보여주었다.<\/p><p>경기 내용에서 뱅갈스가 워낙 좋았으니, 기준을 조금 높여서 플레이오프에 임팩트를 낼 만한 팀 기준으로 봤을 때 인상적인것과 아쉬운것을 이야기하려 한다. 가장 인상적인것은 오라인과 수비였다. 슈퍼볼을 진출할 때도 조 버로우가 끊임없이 당하면서 오라인의 리빌딩을 희망했던 뱅갈스 입장에서는, 드디어 그의 커리어에서 상당히 괜찮은 오라인을 구성했다. 특히나 오른쪽 태클인 24년도 1라운드 픽 아마리우 밈스는 엄청난 성장을 보여서 이 기세라면 이번 시즌 끝나고 탑10안에 드는 라이트태클이 될 수도 있다. 거기다가 수비도 인상적이다. 덱스터 로렌스가 이끄는 수비진은 확실히 지난해와는 너무나도 다른 모습을 보이고 있다. 물론 이번 게임은 리그 최약체 중 하나인 마이애미 돌핀스이긴 했지만, 엣지러셔인 보예 마패도 좋은 모습을 보였다. 그리고 2선 수비쪽도 나쁘지 않다. 특히나 이번 경기 아주 재밌던 부분은 세이프티 조던 배틀은 이번 게임 전에 인터뷰에서 돌핀스의 쿼터백 말릭 윌리스는 Tell, 즉 습관이 있다 그에 따라 뻔히 보인다는 식의 인터뷰를 했었는데 그 인터뷰 이후에 이번 경기에서 인터셉션을 2번이나 하면서 자신의 말이 틀리지 않았다는 것을 보여줬다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/4CEPZGH2dNM\" title=\"YouTube\"><\/iframe><\/div><p>그렇다면 아쉬운 점을 보자. 아쉬운 점은 역시나 공격이다. 공격이 못했다는 게 아니다. 이번 게임 조 버로우는 72%의 패스 성공률에 터치다운 패스를 4개나 했고, 써드다운 갱신도 13번 중에 9번 69%에 달할정도로 좋은 모습이었다. 문제는, 공격의 양태가 이전 몇 년전과 똑같다는 점이다. 뱅갈스의 공격 전술은 몇 가지 특징으로 요약될 수 있다. 우선 가장 특징적인 것은 굉장히 높은 샷건 비중과 거기서 나오는 패스에 대한 강한 선호도이다. 문제는 샷건은 그 구조적인 전술의 한계 때문에 빅플레이 러닝이 너무나 어렵다. 수비쪽에서 실수가 나오지 않는한 내곽 러닝이나 RPO 정도가 샷건에서 나올 수 있는 그나마 효율이 좋은 러닝인데 이들의 기대값은 턱없이 낮다. 그렇기에 수비가 최후방을 2명 이상을 안심하고 넣을 수 있고, 그리 되면 패스를 할 곳이 너무 제한적이게 된다. 특히나 깊은 곳의 패스는 너무할 것이 적어서, 짧은 패스 (혹은 짧은 러닝)로 게임을 차분하게 전진하다가 한번씩 우리 리시버의 우월한 운동능력을 활용해서 빅플레이를 하는 것으로 제한된다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ozycDUxR7KQ\" title=\"YouTube\"><\/iframe><\/div><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">샷건 비중<\/th><th class=\"r\">10야드 이하 패스<\/th><th class=\"r\">15+야드 러닝<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">1주차<\/td><td class=\"r\">71.0% (7위)<\/td><td class=\"r\">74.3% (9위)<\/td><td class=\"r\">0회<\/td><\/tr><tr><td class=\"l\">2주차<\/td><td class=\"r\">62.1% (13위)<\/td><td class=\"r\">80.6% (5위)<\/td><td class=\"r\">0회<\/td><\/tr><tr><td class=\"l\">3주차<\/td><td class=\"r\">73.2% (5위)<\/td><td class=\"r\">78.4% (7위)<\/td><td class=\"r\">0회<\/td><\/tr><tr><td class=\"l\">4주차<\/td><td class=\"r\">83.1% (2위)<\/td><td class=\"r\">61.1% (27위)<\/td><td class=\"r\">0회<\/td><\/tr><tr><td class=\"l\">5주차<\/td><td class=\"r\">82.0% (2위)<\/td><td class=\"r\">87.5% (1위)<\/td><td class=\"r\">0회<\/td><\/tr><\/tbody><\/table><\/div><p>물론 조 버로우와 자말 체이스 티 히긴스로 구성된 공격진은 초특급이다. 조 버로우는 게임이 인내력 싸움에서 둘째라면 서운할 정도라 끝날때까지 차분하게 패스를 전진해가며 터치다운을 만들 수 있는 인물이고, 자말 체이스와 티 히긴스 리시버 듀오는 애초에 1대 1로 이길 수 있는 선수 자체가 리그에 극히 적다. 그로 인해 뱅갈스의 공격은 이 3명이 건강할 때면 늘 탑 10 ~ 탑 5정도의 성적을 보여주었다. 하지만 문제는 이들이 플레이오프에서 강팀을 상대로 했을 때도 이 1차원적인 공격스타일이, 그리고 어찌보면 현재 리그의 추세에서 좀 올드한 전술 스타일이 먹힐 수 있을지 걱정이 드는 것이다. 성적을 보면 지난 해까지 뱅갈스와 조 버로우는 레드존에서 탑 5급의 모습을 보여왔어서 기우라고 볼 수도 있지만, 동시에 이번 시즌은 탑 10급 수비의 팀인 잭슨빌, 텍산스 상대로 레드존 성공률이 12위권으로 떨어진 부분이 있어서, 이걸 뱅갈스의 공격진에게 늘 있었던 초반의 부진으로 봐야할지, 아니면 단조로운 공격스타일에 대한 파훼가 나온건지는 좀더 두고 봐야할 것이다.<\/p>","401872983":"<p>경기 초반에는 공격적으로 게임이 전개 되는 듯했는데, 폭우가 심해지면서 수비전과 턴오버로 게임의 양상이 전환되었고, 결국 제츠가 끝내기 쌕으로 승리를 거뒀다.<\/p><p>제츠의 입장에서는 지난 주 졸전 이후에 긍정적으로 삼을 포인트가 몇가지 있었다. 공격쪽에서 가장 긍정적인 것은 러닝이 먹혔다는 것이다. 주전 러닝백이 빠지고 브레일런 알렌이 그 빈자리를 채우게 되었는데 이번 게임에서 116야드를 던지면서 빗속에서 안정적으로 공을 전진할 수단이 되어주었고, 쿼터백 지노 스미스도 압박을 계속 받는 상황에서 끝끝내 턴오버를 안하면서 우중 수비전에서 할 몫을 다 해주었다.<\/p><p>하지만 가장 긍정적인것은 수비다. 특히 올해 1라운드에서 뽑은 엣지러셔 데이비드 베일리가 쌕 3개에 총 압박 9회(총 28회 패스쇄도)를 기록하면서 자신의 짧은 커리어에서 가장 인상적인 게임을 펼쳤다. 좀더 딥하게 보면, 프로에서도 먹힐만한 요소를 발전시켰다 라는게 제츠 팬들 입장에서 가장 기쁠 것이다. 원래 대학시절부터 퍼스트스탭과 스피드하나는 정말 좋은 선수였다. 하지만, 프로레벨에서 통하려면 스피드만으로는 부족하고 이 폭발적인 퍼스트스탭이 파워로 연결되는 움직임이 필요한데, 이 부분에서 보여준게 없기 때문에, 드래프트에서 그에 대한 평가가 꽤나 갈렸었다. 하지만 이번 경기에서 파워, 즉 힘으로 몇 번 이긴것에 의미부여를 할 수 있다.<\/p><p>큰 그림에서 제츠를 보았을 때 나쁘지 않다. 공격쪽에서는 어린 재능들이 조금씩 자신들의 가치를 보여주고 있고(특히 개럿 윌슨은 슈퍼스타던데.. 영원히 조명을 받지 못지하지 않을까...), 수비쪽에서도 어린 선수들이 뭔가를 보여주고 있다. 내년에 쿼터백만 들어오면! 이라고 희망회로를 돌릴 수도 있긴하지만... 개인적으로는 잘 모르겠다. 이런 징후들이 애런 글랜 감독의 첫해인 작년에 이뤄졌으면 모르겠는데, 올해는 벌써 2년차이다. 과정으로 보기엔 한박자가 늦고, 이런 경우 보통 팀의 리빌딩과 감독의 재임기간이 엇박이 나는 경우가 꽤 있기에 조금 걱정은 든다.<\/p><p>브라운스 입장에서는 마법의 묘약이 이번 게임에서는 발동되지 않았다. 쿼터백 드숀 왓슨은 지난 몇 경기 동안 자신의 발로 플레이를 연장하면서(어쩌면 지금 시점 그에게 남은 최고의 무기)  게임을 풀어나갔는데, 이번 경기에서는 그게 오히려 발목을 잡았다. 발을 너무 의지하다가 패스타이밍이 늦어지면서 쌕을 계속 당하는 장면이 나오면서 이전까지의 상승세를 이어가지 못했다.<\/p>","401872984":"<p>0승 4패 팀 중 가장 강한 전력의 텍산스가 같은 0승 4패의 텍산스를 맞이해서 압도적인 경기역을 선보이면서 승리를 했다. 타이탄스가 현재 경쟁력있는 NFL 팀이라고 하기에는 다소 어려움이 있기 때문에, 텍산스의 정확한 실력을 가늠하기는 어려움이 있지만, 적어도 이번 경기에서 보여준 텍산스는 정말 강력했다.<\/p><p>가장 먼저 언급하고 싶은 부분은 역시 쿼터백 CJ 스트라우드이다. 지난 오프시즌에 재계약을 맺을 수 있는 상황이었는데, 플레이오프에서의 졸전 때문인지 구단과 재계약에 대한 합의를 보지 못했고, 그 분풀이를 하는건지 아니면 자신의 가치를 보여줘야한다는 명분이 생긴건지 이번 시즌 정말 잘해주고 있다. 오라인이 여전히 부실하고, 러닝게임은 또한 리그 최하위권인 상황에서 그는 팀의 공격을 하드캐리하고 있고, 그가 가장 빛났던 루키시절 보다도 훨신 잘하고 있는 것으로 보인다. 특히 자신의 1번 무기인 니코 콜린스가 필드에 올라와있을 때 공격력은 텍산스가 가진것 대비 상당하고, 경쟁력이 있는데 (참고로 텍산스는 수비가 강력하기에 공격이 특급일 필요는 없고, 특급이기 위해 자원을 많이 쏟지도 않았다), 이는 다 쿼터백으로서의 CJ 스트라우드 덕이라고 할 수 있다. 3개의 플레이를 꼭 말하고 싶은데, CJ 스트라우드가 신인시절 정말 잘하는 것 중 하나는 시선처리였다. 필드 중앙이나 외곽을 보면서 수비를 묶으면서 반대쪽을 1대1 혹은 열린 형태로 만들고 거기에 패스를 연결하는 건데 그게 이번 게임에서 굉장히 많이 나왔다. 아래 영상의 첫번째 플레이에서도 중앙 쪽에 라인배커와 세이프티를 묶어놓고 그 옆공간으로 빠르게 패스를 연결했다. 두번째 플레이 역시나 그가 신인시절 정말 잘하던 것이다. 자신의 패스 정확도는 패스 성공률이라는 스탯으로는 정확한 구별이 불가능하고, 볼 플레이스먼트 (Ball Placement), 즉 그냥 성공이 아니라 공을 리시버가 딱 잡기 좋게, 혹은 잡은 다음에 뛰기 좋게 패스를 하는 것이라고 했었는데 이번 게임 슐츠에게 한 패스는 이 높은 정확도를 보여주는 장면 중 하나다. 마지막은 종합적으로 그가 얼마나 쿼터백으로서 날이 서있는가를 보여주는 플레이인데, 이번 게임에서 가장 멋진 플레이였다. 플레이액션 패스로 우선은 러닝인 척 페이크를 준다. 그리고는 팀의 1번이자 에이스인 니코 콜린스 쪽을 보는데 그 뒤에 수비가 이를 노리고 있고 세이프티까지도 콜린스 쪽으로 치우친 걸 확인한다. 그렇기에 반대쪽에서 내 리시버가 수비랑 1대1이라는걸 이미 알았을 것이고, 순간적으로 방향을 바꾸면서 동시에 미묘하게 반스텝 정도 뒤로 물러선다. 아마 자신의 오라인이 약한걸 인지한 반박자 백스텝이었을 것이다. 그리고 동시에 우리 리시버가 1대1인걸 확인하고 그 리시버가 몸을 꺽는걸 보자마자 바로 패스가 나가는 기가막힌 장면이다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/8ZmbJxKxi4k\" title=\"YouTube\"><\/iframe><\/div><p>수비쪽에서는 감독인 드미코 라이언스가 다시 플레이콜링을 다시 맡게 된 첫번째 경기고, 몇 주동안 수비쪽의 약점으로 지적된 라인배커 포지션에서 주전인 아지즈 알샤이어가 돌아왔던 게임이었다. 이 둘 중에 어느 것이 원인인지, 아니면 그냥 타이탄스가 약한건지 알 수 없지만 텍산스의 수비가 오랜만에 우리가 아는 호전적인 플레이스타일로 상대의 숨통을 끊어버리는 수비의 모습을 보여주었다. 아지즈 알샤이어가 돌아오면서 허리쪽에서의 안정감이 굉장히 좋아졌고, 허리쪽에서 안정감이 생기다보니 안그래도 리그 최강이라고 할만한 1선 수비에서 테네시 타이탄스에게 지옥을 선사했다. 윌 앤더슨은(쌕 3회, QB 히트 3회, 태클 포 로스 3회)을 하면서 여전히 올해의 수비수 급 퍼포먼스를 보여주고 있고, 몇 주동안 조용하던 그의 단짝 드닐 헌터(쌕 1회, QB히트 2회, 태클 포 로스 1회, 패스 차단 1회)도 날뛰었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/IrGhNFk8ZXI\" title=\"YouTube\"><\/iframe><\/div>","401872985":"<p>이번 게임은 제일런 워렌의 경기로 기억이 될 것이다. 언드래프티드에 서브 플레이에 불과한 선수에게 갑자기 팀의 중책이 맡겨지면서 이렇게 날아오르는 스토리는 늘 흥미롭고, 멋지다고 생각한다. 나지해리스라는 상위라운드 러닝백에 가려져서 그보다 더 좋은 러닝 시야를 갖고 있음에도 피지컬이 부족하다고 가려졌고, 나지해리스가 떠났음에도 팀은 그만으로 안정이 안되어서 리코 다우들이라는 러닝백을 데리고 왔었는데, 리코 다우들이 부상으로 빠진 상황에서 주전롤을 부여받았고, 몇 경기 연속 날라다니고 있다. 이번 경기에서도 빅플레이를 두번이나 만들면서 승리의 주역이 되었는데, 폭발력과 꾸준함을 둘다 갖춘 현재 스틸러스의 유일한 무기라고 봐도 무방하다. DK 맷케프는 폭발력이 있지만 꾸준함이 현재 부족하고 다른 타이트엔들은 꾸준함은 있지만 폭발력이 부족하다. 현재 워렌의 2차스탯은 어마어마한 수준인데, 기대이상 야드 런 비율(Rushing Yards Over Expected, RYOE)은, 강제 미스 태클 비율(Forced Missed Tackle Rate) 모두 다 리그 2위에, 퍼스트 다운 런 비율, 컨택 후 야드 모두 비잔과 케네스 워커 다음 3위인 상황이다. 그야말로, 비쟌 로비슨, 케네쓰 워커, 제임스 쿡, 조나단 테일러와 같은 스타 러닝백들과 어깨를 나란히 두고 팀을 끌고 있는 상황인데, 플레이스타일을 보면 애런 로저스가 경기 후 인터뷰에서 표현한 슬리퍼리 즉 미끌미끌한 이라는 표현이 정말 적절하다. 순간적인 방향전환을 통해서 상대의 정면 태클 각을 교묘하게 벗겨내는데, 팔로만 하는 태클은 미꾸라지 빠져나가듯이 쑤욱 하고 빠져나가는 플레이가 이번 게임도 그렇고 계속해서 나오고 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/KhOUAfcDbUs\" title=\"YouTube\"><\/iframe><\/div><p>제일런 워렌 외에도 긍정적인 포인트가 많다. 지난 몇 년간 계속해서 꾸준히 드래프트 픽을 투자하던 오라인이 드디어 자신들의 가치를 보여주었다. 이번 게임 내내 콜츠의 디라인을 압도하면서 좋은 블로킹을 보여주었는데, 특히나 경기 중간에 스틸러스의 오라인이 손쉽게 라인맨을 지나 라인배커로 간 뒤에 라인배커를 땅에다 꽂아놓고는 호호호호호 하고 웃는 장면은 이야... 오늘 아주 날이구나 싶었다. 여기에 워렌의 빅플레이에서는 DK 맷캐프의 블록이 있었고, 타이트엔드이자 인간 불곰 다넬 워싱턴의 라인배커를 애다루듯 다루는 블로킹도 인상적이었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ihKCEJQYSso\" title=\"YouTube\"><\/iframe><\/div><p>그리고 러닝이 풀리다보니 패스게임도 같이 풀렸다. 애런 로저스는 폼이 아주 좋은 모습을 계속해서 보이고 있는데, 전성기처럼 혼자 게임을 지배하며 모든 것을 해결해주지는 않고 있지만 2번의 4TH다운 갱신, 2번의 레드존 방문도 모두 터치다운으로 성공하는 등 베테랑 답게 중요한순간에 필요한 패스들을 해주고 있다.<\/p><p>콜츠 입장에서는 답답한 경기가 지속되고 있다. 조나단 테일러는 여전히 수준급의 러닝을 보여주고 있지만, 이번 경기에서처럼 수비가 작정하고 그것만 막으러 나오면 결국 패스에서 조금이라도 풀어줘야하는데, 이게 이뤄지지 않고 있다. 이번 게임 다니엘 존스는 이번 시즌 처음으로 인터셉션이 없는 게임을 기록했는데, 이거를 발전이라고 말해야하는 상황이 참담하다. 리시버진에서 알렉 피어스의 빈자리는 계속해서 느껴지고 있어서, 리시버진에서도 부상에서 돌아온 다니엘 존스를 도와주지 못하고 있다.<\/p>","401872986":"<p>전년도 슈퍼볼에 진출하고 엄청난 퍼포먼스를 보여준 쿼터백 드레이크 메이가 다시한번 전년도의 MVP에 어울리는 퍼포먼스를 2경기 연속 선보이면서 45-17로 지난해 치프스를 궁지로 몰았던 레이더스를 압도하면서 완승을 거뒀다.<\/p><p>이번 게임의 주인공은 바로 쿼터백 드레이크 메이다. 희대의 거품 소리를 들으면서 이제 망가졌다, 부상이 있는거 아니냐 라는 말까지 듣던 드레이크 메이는 76% 성공률에 374야드 4터치다운 본인의 다리로도 7번 25야드를 기록하면서 완벽에 가까운 경기력을 선보였다. 왜 그런걸까? 가장 쉬운 설명은 이제 드디어 리그 탑급 수비들을 벗어나서 약한 수비들을 상대하면서 폼이 올라온것이다 라는 말일것이다. 실제로 이번 시즌 그가 안좋았던 모습을 보인 3주차까지의 수비는 시애틀 시호크스, 잭슨빌 재규어스, 피츠버그 스틸러스였다. 스틸러스 정도만 중상위, 나머지는 리그 탑급이었고, 그가 좋은 모습을 보인 게임들은 하위권의 수비를 가진 빌스와 레이더스이다. 하지만 좀 더 딥하게 보면, 페이트리어츠의 대응이 좀 더 날카로워졌다는 생각이 든다. 시즌 초기의 전술적 움직임들은 시즌 전에 자신들이 세웠던 두가지의 가정 (1 - 드레이크 메이가 MVP 시즌 후에 이 시스템에서 베테랑급으로 성장했다, 2 - AJ 브라운이 팀에 있다)을 좀 더 믿어본 느낌이었다. 하지만, 지난 경기부터 이 가정은 잘못되었다라는 걸 인정하고 그에 맞게 전술을 좀 더 디테일하게 변경하고, 지침을 더 자세하게 설정한 것으로 보인다. 발을 좀 더 본격적으로 사용하되, 너의 장기인 맨투맨 수비에서의 빅패스를 노려라 라는 지침을 유지한채 타 팀원들도 조금 전술을 변경했다.<\/p><p>이번 경기에서 이런 가장 주요한 지침 중 하나는 바로 블로킹이었다. 메이는 지난 게임에 이어서 이번 게임에서도 굉장히 좋은 패스 프로텍션, 패스 보호를 받았다. 이번 게임 내내 맥스 크로스비에게 끝없이 타이트엔드를 한명 붙이거나 오라인 2명을 붙이는등 거의 매 스냅마다 최소 2명의 선수가 일시적으로라도 붙게 만들었고, 나머지 쪽에서는 1대1 블로킹을 했고, 이에 따라서 오라인의 레프트 태클 윌 캠벨이 부상으로 빠진 상황에서도 메이를 굉장히 잘 지켜주었다. 데이터적으로 보았을 때는 레이더스의 압박이 적지는 않았는데, 지난 경기와 동일하게 대부분의 압박이 3초 이상이었어서 드레이크 메이의 패스 의사결정과 패스 그자체에는 아무런 영향을 주지 못하는 제로 칼로리 압박이었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/fgbiwhPHQSE\" title=\"YouTube\"><\/iframe><\/div><p>거기에 플레이콜링이 기가 막혔다. 조쉬 맥다니엘스는 이번 시즌 가장 멋진 플레이콜링을 이번 경기에 보여줬는데, 러닝백을 밖으로 빼면서 수비의 시선을 끌고, 경기 내내 맥스 크로스비에게 2명의 선수를 붙이다가 간만에 한번 타이트엔드와 1대1을 붙인다. 이에 신난 크로스비가 본격적으로 쇄도를 하는데, 이게 함정이었다. 메이는 그대로 타이트엔드에게 스크린패스를 던졌고, 오라인들이 튀어나가면서 러닝백의 모션으로 만들어낸 빈공간을 질주하며 엄청난 빅플레이를 만들어낸다. 이후 플레이에서도 전반과 후반에 각각 똑같은 컨셉의 플레이를 들고 나와서 수비 한명의 움직임을 주시하면서 이러지도 저러지도 못하게 기가막힌 패스들을 연결했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/oAhTJpl8tf8\" title=\"YouTube\"><\/iframe><\/div><p>수비적인 측면에서도 아주 좋았다. 가장 중요한 포인트는 이 팀의 수비는 코너백이 없다고 해도 될정도로 부상을 심하게 겪고 있는 상황(무려 4명의 코너백들이 부상이다), 백업의 백업이 나왔음에도  꽤나 경쟁력있는 레이더스의 패스에 잘 대응했고(- 물론 바워스를 완전히 막을 수는 없었다) 레이더스의 공격 전체를 효과적으로 막았다. 가장 큰 비결은 1선 수비였다. 지난 경기에는 게이브 에이커스가 두각을 드러내더니 이번 경기에서는 일라이자 폰더가 두각을 드러냈다. 이들은 경기 내내 레이더스의 오라인을 가지고 놀았는데, 러닝과 수비 양쪽에서 상대를 완벽히 압도했다.<\/p><p>레이더스의 입장에서는 여러모로 공격과 수비의 한계가 좀 보인 것 같다. 공격쪽에서는 러닝이 계속해서 안먹히고 있다. 1라운드 6번픽으로 데리고 왔던 애쉬튼 젠티는 러닝 시도는 많이 하고있지만 효율은 전혀 나오지 않고 있다. 이번 경기에서도 시도당 2.7야드라는 비참한 성적을 냈다(물론 패스게임에서는 꽤 두각을 드러냈다). 브락 바워스 또한, 110야드를 기록하며 엄청 잘했는데, 이는 사실 감독인 클린트 큐비악이 지난 해 시호크스에서 보여준 공격과 유사하다. 효과가 있든 없든 러닝을 계속하면서 계속해서 어떻게든 수비를 앞선으로 끌고 내려오고 그 뒤에서 자신들의 1번 리시버 (당시에는 JSN)을 활용하는건데, 문제는 이런 공격스타일이 시호크스와 같은 압도적인 수비와 연결이 될 때는 효과적이었는데, 지금의 레이더스 수비로는 그 시너지를 만들어낼 수 없다는 것이다. 레이더스의 수비도 시즌전까지 나쁘지 않았는데, 턴오버라는 변칙성이 높은 것에 기댄 경향이 있었고, 이 변칙성 높은 턴오버가 나오지 않으면서 한계를 드러냈다.<\/p>","401872987":"<p>바이킹스가 삐걱거리는 뉴올리언스 세인츠를 상대로 23-13을 거두면서 5승 0패의 팀이 되었고, 실제 종료되는 23-13의 점수차보다 훨씬 더 원사이드한 게임이었다.<\/p><p>바이킹스 팬들 입장에서 가장 긍정적인 포인트는 드디어 공격이 좀 풀리기 시작했다는 것이다. 이번 시즌 들어서 가장 완성도가 높은 공격이었다는 생각이 든다. 물론, 상대 세인츠가 수비가 리그에서 상당히 약한 편이기에 이걸 감안해야하지만, 동시에 바이킹스 측에서도 왼쪽 오라인 2명이 모두 부상으로 결장했고, 2명의 주전 타이트엔드까지 부상 당하면서 결장했기에 두 부분이 서로 상쇄한다고 보면, 이번 경기 내용이 꽤나 긍정적일 것이고, 바이킹스 공격의 핵심 포인트라고 할 수 있는 3가지 포인트 카일러 머리, 저스틴 제퍼슨, 러닝 모두 잘 풀렸다. 카일러 머리는 이번 게임에서 첫 12개의 패스를 성공하면서 결과적으로 80%에 달하는 성공률을 기록했는데, 지난주 50%를 간신히 넘었던 성공률에 비하면 카일러 머리가 팀에 확실히 더 적응을 하고, 케빈 오코넬 공격코치가 의도하는 타이밍에 정교한 패스를 던지는 것으로 보인다. 거기다가 카일러 머리의 운동능력도 확연히 드러났던 경기였다. 이번에 10번의 러싱에서 51야드를 기록했을 정도로 상대의 압박이 들어올 때 플레이를 기가막히게 연장했고, 경기 중간에 세인츠의 수비는 카일러 머리의 스크램블링 능력을 경계해 적극적인 쇄도를 아예 포기하면서 카일러 머리가 포켓에서 무려 6초나 있었던 플레이도 있었다... (통상 3~4초면 충분히 오래 있었다고 본다). 아쉬운 것은 여전히 케빈 오코넬 감독이 샘 다놀드와 있었을 때 보이던 타이밍 롱패스들이 아직까지 나오고 있지 않다는 점이다. 이번 경기 카일러 머리의 패스 비거리는 5.86야드에 불과할 정도로 짧은 패스만 해서, 아직 조금 더 적응이 필요하다는 생각은 들게 했다. 다만 그나마 나은점은 저스틴 제퍼슨에게의 패스는 잘 연결되고 있다는 점이다. 어쩌면 억지로라도 저스틴 제퍼슨 쪽으로 패스를 던지고 있다는 느낌이 들정도로 수비가 꽤나 있는 상황에서도 제퍼슨에게 패스를 던졌는데, JJ 맥카시가 있을 때는 잘 보이지 않던 모습이었다. 그리고 공을 잡는 인물이 저스틴 제퍼슨이기에 누가 몇 명이 있어도 좋은 승부수가 되는것을 증명했다. 러닝에서도 러닝백 애런 존스가 회춘급 경기력을 보였고, 실제로 어느정도 정체되는 경기양상에서 불을 붙였던게 애런존스의 러닝이 이번 게임에서 굉장히 중요한 역할을 했는데 그럼에도 불구하고 앞으로 남아있는 경기들에서도 잘할지는 좀 더 두고 봐야할 것 같다. (상대 수비가 러닝을 너무 못막는 팀이었다)<\/p><p>공격에 긍정적인 포인트가 많았지만, 사실 바이킹스의 본체는 수비이고, 그 점이 이번 게임에서도 드러났다. 어린 쿼터백을 상대로 브라이언 플로레스의 정신나간 블리츠는 가혹하다 싶을 정도로 너무했다. 타일러 슉은 25번의 패스중에 단 16개만 성공으로 64% 성공률에 100야드도 기록 못했고 0 터치다운에 2개의 인터셉션을 기록하면서 최악의 하루를 보냈다. 그런데, 그런게 이해될 정도로 바이킹스의 수비, 브라이언 플로레스는 어처구니가 없는 플레이들을 펼쳤다. 게임의 첫번째 플레이부터 블리츠를 가동하면서 아무도 제지하지 않은 패스러셔가 쿼너백 타일러 슉의 눈 앞으로 날아들면서 시작한다. 그리고 그 첫 써드다운 상황에서, 블리츠가 또 들어오는데 남아있는 2선 수비가 맨투맨으로 대응을 하게 된다. 브라이언 플로레스 수비의 가장 큰 특징은 블리츠를 보내놓고 맨투맨이 아니라 지역수비로 대응을 한다는 점인데, 세인츠도 이를 모를리 없고 타일러 슉은 한 주 내내 이 부분에 대해서 준비했을 것이다. 근데 그게 시작부터 어긋난거다. 한주 내내 블리츠를 준비했는데, 첫 플레이부터 우리 팀은 블리츠를 아예 막지 못했고, 첫 써드다운에서도 한주내내 준비한 지역수비가 아니라 전혀 다른 수비로 변형을 건거라... 브라이언 플로레스 수비가 그토록 강조한 경향성을 없애는 데 초점을 맞춘다라는게 얼마나 주효한지 느끼게 해준다. 그리고 전에 말했듯 브라이언 플로레스는 정도가 없는 사람이다. 애초에 상식을 벗어난 선에서 블리츠를 하고 있는데, 블리츠의 방식도 상식을 초월한다. 게임 중간에 7명의 블리츠를 가동하는데
