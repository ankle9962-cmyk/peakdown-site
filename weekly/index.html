const REVIEWS={"401872656":"<p>NFL 26시즌의 개막전이 드디어 시작되었고, 그 첫 매치업은 지난해 슈퍼볼에서 맞붙었던 시애틀 시호크스와 뉴잉글랜드 페이트리어츠의 게임이었다. 경기 중에 시애틀 시호크스의 쿼터백 샘 다놀드가 부상당하고, 페이트리어츠에서는 팀의 에이스역할을 해줄거라는 기대감으로 영입한 와이드리시버 AJ 브라운이 부상을 당해 경기를 떠나면서 어느정도 김이 빠진채로 시작한 게임은, 마지막 순간 드레이크 메이의 실수로 페이트리어츠의 패배로 끝이 났다(시애틀 13-10 뉴잉글랜드).<\/p><p>시애틀 시호크스의 수비는 여전히 압도적인 모습을 보여주며 승리의 1등 공신이 되었다. 마이크 맥도널드는 슈퍼볼을 우승하였음에도 자신이 최고라는 것을 증명하는 걸 멈출 생각이 없어보인다. 시애틀 시호크스 수비는 올해도 작년과 동일하게 1) 다수의 2선 수비 기용 2) 최후방을 두껍게 3) 강력한 1선 수비선수들의 로테이션으로 '러닝을 막는다'라는 원칙을 들고 나와서 상대의 공격에게 오로지 짧은 패스만을 하게 만들었다. 이런 플레이는 상대방 쿼터백에게 굉장히 큰 인내력을 요구한다. 비유가 적합할지 모르겠지만 절대 큰 스윙을 못 휘두르게 하고 경기 내내 번트만 대게끔 강요하는 모양새인데, 결국 상대 쿼터백이 참지못하고 모험을 시도할 때 마이크 맥도날드의 수비수들은 그 플레이를 낚아채 버렸다. 이런 수비 시스템에서 2선 수비의 다재다능함이 중요하다. 최후방도 지키면서, 러닝수비도 지원해야 하고, 태클도 잘해야 한다. 개막전이라는 어수선한 상황과 시애틀 시호크스 2선 수비 선수진이 꽤 바뀌었음에도 퍼포먼스가 유지되었다는 점이 인상적이다. 마이크 맥도날드의 클래스가 느껴진다.<\/p><p>반면 페이트리어츠의 입장에서는 드레이크 메이가 0커리어 최악의 경기를 펼쳤다는 것이 아쉽다. 지난해 플레이오프에서 강한 수비들과 맞설때 성적이 급감하는 모습을 보였는데, 이번 경기에서 또 한번 그런 모습을 보이면서, 작년의 호성적은 쉬웠던 스케줄의 영향이 컸다는 혹평을 부정하기 힘들어졌다. 지난해 플레이오프와 비교해 이번 경기의 패배가 더욱 아쉬운 점은, 페이트리어츠의 오라인이 패스 블로킹 측면에서 지난해처럼 끔찍하지는 않았다는 것이다. 경기가 끝날 때까지 참을성이 부족했고 체크다운(짧은 패스)만 하는 것에 질려버려서 욕심을 낸것이 두고두고 아쉬울 것이다(드레이크 메이도 인터부에서 언급했다). 모든 인터셉션이 4쿼터에 있었는데 승부가 아슬아슬해지자 '내가 해줘야 한다'라는 조급함에 일을 그르친 것 아닐까. 인터셉션이 된 플레이를 보면 체크다운 옵션(러닝백) 와이드오픈이었음에도 불구하고 모험수를 뒀고, 그게 처절한 실패가 된다.<\/p><div class=\"yt yt-loop\" data-yt-src=\"https://www.youtube-nocookie.com/embed/c7GJROAeY8Y?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=c7GJROAeY8Y&amp;controls=0&amp;modestbranding=1&amp;rel=0&amp;playsinline=1\"><a class=\"yt-poster\" href=\"https://www.youtube.com/watch?v=c7GJROAeY8Y\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"클립 재생\"><img src=\"https://i.ytimg.com/vi/c7GJROAeY8Y/hqdefault.jpg\" alt=\"\" loading=\"lazy\"><span class=\"yt-play\" aria-hidden=\"true\"><\/span><\/a><\/div><p>작년에 드레이크 메이가 엄청난 성장을 했을 때, 성장의 요인으로 침착한 체크다운 플레이, 조급함 없이 자기의 다리로 차근차근 게임을 풀어나갈 수 있다는 점, 상대가 기회를 주면 확실히 받아먹어버리는 노련함이 꼽혔다는 것을 생각하면, 개막전에서 보여준 모습은 상당히 아쉽다.<\/p><p>이번 게임 MOM은 시애틀 시호크스의 1선 수비 #7 느워수이다. 이 팀의 수비가 먹히기 위해서는 강력한 1선의 힘, 특히나 소수의 1선 수비만으로 러닝을 막는게 중요한데 느워수는 그 핵심적인 역할을 했다. 이번 게임에서 러닝이 시작하기도 전에 터뜨려버린 플레이만 3~4개가 된다. 특히나 2ND드라이브에서 신인 타이트엔드를 그냥 박살내버리고는 러닝백까지 태클해버리는 플레이나, 3쿼터에 스크린을 미리 읽고 러닝백을 낚아채버리는 어마어마한 퍼포먼스를 보면, 올해도 시호크스의 수비가 정말 강할 것이라는 확신을 갖게 해준다.<\/p><div class=\"yt yt-loop\" data-yt-src=\"https://www.youtube-nocookie.com/embed/xPzTwLZkDrA?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=xPzTwLZkDrA&amp;controls=0&amp;modestbranding=1&amp;rel=0&amp;playsinline=1\"><a class=\"yt-poster\" href=\"https://www.youtube.com/watch?v=xPzTwLZkDrA\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"클립 재생\"><img src=\"https://i.ytimg.com/vi/xPzTwLZkDrA/hqdefault.jpg\" alt=\"\" loading=\"lazy\"><span class=\"yt-play\" aria-hidden=\"true\"><\/span><\/a><\/div>","401872657":"<p>이번 주 최고의 매치업이라고 할 수 있는 두 팀간의 매치업이었습니다. 마일스 개릿에 트렌트 맥더피라는 어마어마한 거물들을 데리고 오면서 올해 오프시즌 최고의 기대감을 갖게한 램즈와 지난해 부상에도 불구하고 엄청난 선전을 하고 오프시즌에서 마이크 에반스라는 명전이 유력한 베테랑 리시버를 데리고 오면서 기대감을 모아온 두 디비전 라이벌 간의 매치업이었는데, 49ERS가 램즈를 그야말로 두들겨 패버렸습니다.<\/p><p>27-7이라는 다소 충격적인 결과가 나왔고 49ERS가 부상만 없다면 얼마나 강한팀인지 증명을 해냈습니다.<\/p><p>우선 팀에 새로이 합류한 마이크 에반스의 존재감은 대단했습니다. 감독 카일 섀너핸의 가장 큰 특기는 타이밍에 맞게 공격수들을 필드에 넓게 고루 펼쳐서 (특히나 횡으로 필드를 넓게 쓰면서) 수비들에게 어려움을 선사하는건데, 마이크 에반스라는 선수가 마치 중력이 무거운 물건처럼 수비의 이목을 더 끌 수 있게 되면서 다른 쪽에 공간이 더 극대화될거라는 기대를 했는데 기대대로였던 것 같습니다. 뿐만 아니라 중요한 상황에서, 그의 압도적인 공중볼 싸움능력에도 기대가 컸는데,13년차 베테랑은 팀의 개막전에서 이 능력을 유감없이 보여주었습니다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th class=\"r\">시도<\/th><th class=\"r\">캐치<\/th><th class=\"r\">결과<\/th><\/tr><\/thead><tbody><tr><td>써드다운상황<\/td><td class=\"r\">6<\/td><td class=\"r\">5<\/td><td class=\"r\">퍼스트다운 갱신 4회, 터치다운 1회<\/td><\/tr><tr><td>그 외<\/td><td class=\"r\">1<\/td><td class=\"r\">1<\/td><td class=\"r\">퍼스다운 갱신<\/td><\/tr><tr><td>턴오버<\/td><td class=\"r\">3<\/td><td class=\"r\">0<\/td><td class=\"r\">156<\/td><\/tr><\/tbody><\/table><\/div><p>특히나, 터치다운은 순수 5대5(리시버와 코너백 간 1대1 매치업 누가 더 유리하지 않은 상황)의 공중볼 상황에서 나왔습니다. 마이크 에반스는 수비의 머리속에서 공을 끄집어내며 터치다운을 했고, 경기내내 49ERS는 중요순간에 퀸튼 레이크와의 매치업된 마이크에반스에게 공을 던지는 걸 주저하지 않았습니다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/VlB1JRCr7ic\" title=\"YouTube\"><\/iframe><\/div><p>그 외에 수비쪽에서도 닉 보사와 프레드 워너는 부상이 있었나? 하는 생각이 들 정도로 완벽하게 전성기 폼으로 돌아왔습니다. 프레드 워너는 부상이 있었음에도 중원의 지배자로서 자신이 리그의 모든 미들라인배커보다 적어도 2~3티어는 높은 위치에 있다는걸 증명해주는 업청난 존재감을 보여줬습니다. 그리고, 닉 보사 역시 어마어마했습니다. 현대 NFL 수비에서 엣지러셔의 가치에 대해 확연히 보여줬는데, 경기 시작부터 패스러쉬에서 상대 태클을 던져버리고는 매튜 스태포드를 압박했고, 그 뒤로 러닝게임에서 엄청난 존재감을 드러냈습니다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ThHuKqM5J-0\" title=\"YouTube\"><\/iframe><\/div><p>개인적으로 닉 보사와 프레드 워너의 러닝게임에서의 존재감이 이 팀의 전체적인 성공에서 정말 중요한 부분이라고 생각합니다. 작년의 49ERS 수비를 떠올려보면 이 팀의 장기는 패스 수비였습니다. 그래서 초반 다운에서 상대의 러닝을 차단하고 패스를 해야만하는 상황 (3RD &amp; LONG)에 위치할 수 있게 한다면, 자신들의 장기를 살린채 수비에 임할 수 있기 때문에 굉장히 유리해지죠.<\/p><p>하지만 이 49ERS측에서 가장 인상적이었던 것은 역시나 카일 섀너핸이 새로이 도입한 카일 유스첵 혹은 조지키틀의 치트 모션 블로킹 이었습니다. 이에 대해서는 영상을 별도로 만들었으니 그를 참고하시는게 더 좋으실겁니다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/b_GXDniQaRg\" title=\"YouTube\"><\/iframe><\/div><p>램즈의 입장에서 생각을 해보자면, 매도 미리 맞는게 낫다 라는 생각을 들게 합니다. 시즌 시작전에 램즈의 기대감은 어마어마한 수준이었습니다. 트렌트 맥더피의 합류로 전년도 이 팀의 유일한 약점이라 생각한 2선수비를 보강하면서 기대감이 상당히 올랐는데, 마일스 개릿이라는 현시점 리그 최강의 선수 중 하나가 합류를 하고, 거기다가 역대 최고의 선수 중하나인 애런 도널드가 은퇴에서 돌아왔다는 것으로, 사람들이 램즈의 슈퍼볼 진출은 따놓은 당상이라는 취급을 하는 지경에까지 이르렀죠. 그런데 시즌 첫 경기에서 호되게 맞으면서 오히려 정신을 바짝 차리게 되는 계기가 될 것이라고 생각합니다. 마일스 개릿의 폼 저하나, 여러 다른 걱정거리들은 기우일 것 같습니다(시즌 첫경기이기도 합니다). 저는 램즈가 진짜 주의깊게 보아야 할 점이 '3RD &amp; LONG 즉 순수 패스만을 해야하는 상황에서의 대응'인 것 같습니다.<\/p><p>이는 사실 지난시즌부터 음? 하고 의문점이 생기게 하는 부분이었습니다. 워낙 1ST 다운과 2ND다운상황에서 효율적인 팀이라 3RD &amp; LONG 즉 패스를 해야하는 상황에 위치하는 경우가 굉장히 적은데, 이 상황에 위치할 때 여러 성적들이 뚝 떨어지는 경향이 있습니다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th class=\"r\">시도<\/th><th class=\"r\">갱신율<\/th><\/tr><\/thead><tbody><tr><td>써드&amp;LONG 상황<\/td><td class=\"r\">70 (1위-최소)<\/td><td class=\"r\">27.1% (16위)<\/td><\/tr><\/tbody><\/table><\/div><p>그리고 이번 게임에서도 이런 결과들이 유사하게 벌어졌습니다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th class=\"r\">시도<\/th><th class=\"r\">갱신회수<\/th><th class=\"r\">특이사항<\/th><\/tr><\/thead><tbody><tr><td>써드&amp;LONG 상황<\/td><td class=\"r\">4회<\/td><td class=\"r\">1회<\/td><td class=\"r\">인터셉션 1회, 패스실패 2회<\/td><\/tr><\/tbody><\/table><\/div><p>아무래도 팀의 컨셉 자체가 러닝과 거기서 나오는 플레이액션을 기반으로 설계가 되다보니까 나오는 결과물일 수 있습니다. 이런 경우에 팀의 에이스 쿼터백인 매튜 스태포드에게 강하게 기대야하는데, 과연 88년생의 매튜 스태포드가 그런 상황을 잘 해결하는 모습을 보여줄 수 있을지, 시즌동안 주의깊게 지켜보시죠.<\/p>","401872658":"<p>애틀랜타 팰컨스는 쿼터백들이 연거푸 부상을 당하면서 팀의 3번재 쿼터백인 쿠퍼 러쉬를 내보냈다. 스틸러스도 노장인 애런 로저스가 새로운 감독 아래에서 뛰기에, 양 팀다 1주차에 화끈한 공격력을 보여줄 거라 예상되지는 않았고, 그 기대에 맞게 공격쪽에서의 큰 임팩트는 없는 경기였다. 공격에서 임팩트가 없는 것뿐만이 아니었다. 양팀 합쳐서 16개의 반칙을 냈을 정도로 경기력 자체가 날이 서있지 않았다. 경기 초반 팰컨스의 러닝백 비잔 로빈슨이 짧은 패스를 터치다운으로 연결하면서 팰컨스가 순항하는 듯했지만, 피츠버그 스틸러스의 베테랑들이 어마어마한 경기력을 보여주면서 게임을 뒤집어 엎어버리고 끝내버렸다.<\/p><p>팰컨스 입장에서 가장 인상적이었던 것은 두말할 것 없이 러닝백 비잔 로빈슨이었다. 팰컨스의 팬들은 쿼터백을 아예 믿을 수 없는 상황에서 '그래 이번시즌 믿을건 비잔 로빈슨 밖에 없다' 라고 생각했을 것인데, 그 생각대로의 모습을 보여주었다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>러닝시도<\/th><th class=\"r\">러닝야드<\/th><th class=\"r\">시도당 러싱야드<\/th><th class=\"r\">캐치<\/th><th class=\"r\">리시빙야드<\/th><th class=\"r\">리시빙터치다운<\/th><\/tr><\/thead><tbody><tr><td>21<\/td><td class=\"r\">83<\/td><td class=\"r\">4.0<\/td><td class=\"r\">8<\/td><td class=\"r\">90<\/td><td class=\"r\">1<\/td><\/tr><\/tbody><\/table><\/div><p>특히나, 어린 크리스챤 맥캐프리 라는 비유가 있듯이 패스게임에서 강점이 워낙 있는 선수라는 분석에 맞게 이번 게임 패싱게임에서도 어마어마한 모습을 보여주었다. 순간적으로 열린 공간에서 공을 받은 다음, 비쟌 로빈슨이 보여주는 스피드와 가속능력은 경이로울 정도인데, 어쩌면 짧은 공간에서 이뤄지는 패스를 빅플레이로 연결하는 능력이 비쟌 로빈슨의 가장 강한 점일수도 있겠다는 생각도 든다.<\/p><p>다만, 이런 열린 공간에서의 움직임이 그의 진정한 장기라는데서 걱정 아닌 걱정도 든다. 러닝백이 그팀의 가장 중요한 공격 옵션이라 한다면 내곽을 통한 러닝으로 상대 수비에게 알고도 못막는 무력함을 반드시 선사해야하는데, 비쟌 로빈슨은 이러한 점이 확실히 덜하다. 물론 아래 리그의 다른 특급 러닝백들과 비교표에서 볼 수 있듯 그런 플레이를 효과적으로 못하는 것은 아니나, 내곽을 노리는 경향성 자체는 훨씬 덜하다. 이는 앞서 걱정 아닌 걱정이라 말했듯, 비쟌 로빈슨이라는 특급 러닝백의 기준에 맞춰서 살펴보는 다소 엄격한 기준을 들이댄 것이고, 이미 걱정할 것 투성이인 팰컨스의 팬들이 비쟌 로빈슨을 걱정하지는 않을 것이다.<\/p><p>&lt;25시즌 러닝 성적 비교&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>선수이름<\/th><th class=\"r\">내곽 러닝 시도 비중<\/th><th class=\"r\">내곽 러닝 시도당 야드<\/th><th class=\"r\">실패한 시도 비중<\/th><\/tr><\/thead><tbody><tr><td>비쟌 로빈슨<\/td><td class=\"r\">32%<\/td><td class=\"r\">5.14<\/td><td class=\"r\">13%<\/td><\/tr><tr><td>조나단 테일러<\/td><td class=\"r\">64%<\/td><td class=\"r\">4.39<\/td><td class=\"r\">14%<\/td><\/tr><tr><td>데릭 헨리<\/td><td class=\"r\">46%<\/td><td class=\"r\">4.52<\/td><td class=\"r\">15%<\/td><\/tr><tr><td>크리스챤 맥캐프리<\/td><td class=\"r\">53%<\/td><td class=\"r\">4.31<\/td><td class=\"r\">13%<\/td><\/tr><tr><td>자미어 깁스<\/td><td class=\"r\">42%<\/td><td class=\"r\">5.03<\/td><td class=\"r\">15%<\/td><\/tr><\/tbody><\/table><\/div><p>반면 스틸러스의 경우에는 수비에서 베테랑 듀오가 회춘하였다. 내곽 수비 라인맨인 89년생 캠 헤이워드는 어떻게 된게 30대 후반이 될수록 더 잘해지나? 하는 생각이 들 정도의 모습을 보여주었다. 한 가운데에서 러닝을 막는 걸 넘어서서 베테랑의 영리한 판단력을 보여주었는데, 쇄도를 하는 와중에 쿼터백의 움직임을 살피다가 패스 타이밍에 맞춰 손을 뻗어서 공을 쳐내는 능력은 가히 발군이다(전년도 공동 3위). 이번 경기에서도 그러한 모습을 3번이나 보여주면서 자신의 클라스를 보여주었다.<\/p><p>그리고 스틸러스 팬들 입장에서 가장 기쁠만한 소식은 역시나 TJ 왓의 부활이었다. 부상과 노화로 인해 이제 0티어 엣지러셔에서는 다소 내려왔다는 평가를 듣기 시작한 TJ 왓이었는데, 이번 경기에서 쌕을 2번, 태클 포어 로스 (시작선 뒤에서 태클) 3회, QB 히트 2회를 기록하면서 전성기 폼을 회복하는 모습을 보였다. 상대가 스크린하려는 패스를 날아서 손으로 낚아채어 인터셉션을 만들고 그걸 터치다운으로 연결하는 플레이를 보니, 왓 가문의 혈통인자가 있구나 라는 생각이 든다.<\/p><p>수비에서 굉장히 특이하고 앞으로도 주목할만한 포인트는 바로 닉 헐빅을 미들라인배커로 기용했다는 것이다. 닉 헐빅은 알렉스 하이스미스 - TJ 왓의 백업역할을 해줬던 선수로 왓이 부상으로 결장했을 때 한번씩 나와서 꽤나 인상적인 모습을 많이 보였는데, 새로운 스틸러스의 감독과 코치진은 그를 전혀 다른 포지션으로 기용하였다. 물론 스틸러스의 미들라인배커진형이 굉장히 단단해지긴 했는데, 그의 강력한 쇄도 능력을 너무 희생하는건 아닐까 하는 걱정도 있다. 이 부분이 어떤식으로 풀어나가게 될지 굉장히 궁금하다.<\/p>","401872659":"<p>올해 AFC에서 가장 강한 팀 중 하나로 예상되는 볼티모어 레이븐스와 전년도 부상으로 꿈과 희망이 무너졌던 인디애나폴리스 콜츠의 1주차 경기는, 레이븐스가 왜 자신들이 리그의 가장 강한 팀 중 하나로 불리는지를 보여주며 압도적으로 승리한 게임이 되었다.<\/p><p>경기를 보고 느낀 것은 와... 레이븐스의 공격이 진짜 터지면 답이 없구나 하는 감상이었다. 첫 5번의 공격권에서 레이븐스는 4개의 터치다운을 만들었고, 터치다운을 하지 못한 공격권조차 59야드를 전진하면서 엄청난 공격력을 보여주었다. 전반이 종료하기 전까지 레이븐스는 모든 플레이의 시도당 전진야드가 9.3야드에 달할정도로 어마어마했는데... 즉 거의 모든 퍼스트다운마다 퍼스트다운을 또 갱신하고 있는 셈이다. 더욱이나 무서운 건, 이런 엄청난 공격력이 패스와 러닝 양쪽에서 모두 발휘되고 있다는 것이다.<\/p><p>&lt;전반 종료전까지 레이븐스의 공격 스탯&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>구분<\/th><th class=\"r\">플레이회수<\/th><th class=\"r\">야드<\/th><th class=\"r\">플레이당<\/th><th class=\"r\">EPA/플레이<\/th><\/tr><\/thead><tbody><tr><td>패스<\/td><td class=\"r\">18<\/td><td class=\"r\">214<\/td><td class=\"r\">11.89<\/td><td class=\"r\">+0.344<\/td><\/tr><tr><td>러닝<\/td><td class=\"r\">17<\/td><td class=\"r\">112<\/td><td class=\"r\">6.59<\/td><td class=\"r\">+0.420<\/td><\/tr><tr><td>총합<\/td><td class=\"r\">35<\/td><td class=\"r\">326<\/td><td class=\"r\">9.31<\/td><td class=\"r\">+0.381<\/td><\/tr><\/tbody><\/table><\/div><p>우리 모두 최근 몇년 NFL 판에서 가장 큰 성장을 보인 선수로 조쉬 알렌을 뽑는데, 라마 잭슨도 이에 못지 않다. 데뷔시즌에 러닝 능력을 필두로 MVP를 수상했고, 그가 러닝능력의 반만큼만 패스 능력을 키울 수 있다면 리그에 본적도 없는 어마어마한 선수가 될거라고 했었다. 쿼터백의 패스능력을 키우는 것 자체가 워낙 어려운일이라 다소 비관적으로 보는 사람이 많았는데 라마잭슨은 몇 해전에 MVP를 또 한번 타면서 그 성장을 해냈다.<\/p><p>그리고 이번 시즌 개막전부터 그 기세를 이어나가고 있다. 특히나 팀의 1번 리시버인 제이 플라워스가 있을 때, 레이븐스의 패싱게임 폭발력은 어마어마했다. 제이 플라워스는 사실 175cm의 작은 키를 가지고 있어 팀의 1번 리시버 역할을 수행하기에는 어려움이 있다. 외곽에서 1대1을 이겨준다기보다는 내곽에서 민첩함을 활용한 슬롯 리시버로서의 한계가 있는 선수인데, 최근 NFL의 대세는 이런 슬롯 리시버들이 팀의 1번 리시버역할을 수행하고 있다는 것이다. 대표적으로 라이언스의 아몬라 세인트 브라운이나, 시호크스의 JSN이 있다. 그리고 이번 게임에서 제이 플라워스는 올해는 나의 차례다 라고 외치듯이 5번의 캐치만으로 150야드를 만들어내면서 절정의 폼을 보여주었다. 특히나 경기 중간에 햄스트링 부상으로 경기에서 빠졌음에도 기록한 성적이라는 점에서 더욱 이번 시즌이 기대가 된다.<\/p><p>또 하나, 이번 게임 레이븐스 공격에서 재밌는 것은 바로 언더센터의 활용이다. 레이븐스의 신임 공격코치는 데클란 도일이다. 데클란 도일은 브롱코스의 숀 페이튼 밑에서 수학하고, 작년에는 시카고 베어스의 벤 존슨 공격코치로 있던 사람이다. 그리고 벤 존슨의 시카고 베어스는 러닝에 굉장히 큰 강세를 준, 특히나 언더센터에 굉장히 큰 강세를 준 팀이었고, 이런 데클란 도일의 경향성은 이번시즌 개막전에서 여실히 드러났다. 언더센터의 비중이 55% 이상으로 거의 20%가까이 올라갔고, 물론 한경기일 뿐이지만 언더센터에서의 생산성 또한 크게 상승을 한것이 굉장히 고무적이다. 어쩌면 라마 잭슨이 자신의 프로 커리어에서 3번째 변신을 시행하는 시즌이 올해가 될 수 있지 않을까 생각이 든다. (첫번재가 러닝 쿼터백으로서의 대두 -&gt; 두번째가 패서로서의 역량 장착 -&gt; 언더센터로 조연으로서의 역할도 수행가능).<\/p><p>&lt;언더센터 성적&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>구분<\/th><th class=\"r\">플레이 비중<\/th><th class=\"r\">플레이당 야드<\/th><th class=\"r\">EPA/플레이<\/th><\/tr><\/thead><tbody><tr><td>26시즌<\/td><td class=\"r\">55%<\/td><td class=\"r\">7.27<\/td><td class=\"r\">+0.236<\/td><\/tr><tr><td>25시즌<\/td><td class=\"r\">35%<\/td><td class=\"r\">5.82<\/td><td class=\"r\">+0.126<\/td><\/tr><\/tbody><\/table><\/div><p>실제로 25시즌의 35% 언더센터 비중 조차도 커리어 초창기에 10% 미만이었던 것에 비하면 엄청난 상승인데, 이번시즌 50%언저리까지 올라가게되면 레이븐스의 공격력은 더더욱더 무서워질 것이다. 왜냐하면 데릭헨리가 언더센터에서 나오는 아웃사이드 존 러싱을 NFL 역사상 가장 잘하는 선수이기 때문이다.<\/p><p>콜츠의 측면에서 보자면 아쉬움이 좀 생길 수 있다. 첫 공격권을 터치다운으로 결정지으면서 기세를 타는 듯했는데 그 뒤로 인터셉션으로 흐름이 뚝 끊기고는 이후로 공격이 꽉막히고 결정적으로 팀의 믿을맨 역할을 하던 조나단 테일러까지 펌블을 기록하면서, 홈팬들에게 야유를 받는 지경에 이르렀다. 물론 후반전에 조금 폼을 회복하는 듯 했지만, 경기를 뒤집기에는 무리였다.<\/p><p>좋게 볼만한 포인트는 러닝백인 조나단 테일러이다. 리그의 특급 러닝백 중 하나인 조나단 테일러는 이번 게임에도 100야드 가까이 기록하고 시도당 5.2야드를 할 정도로 준수한 모습을 보여줬는데, 그 중에서도 그의 가장 큰 장기는 결정력이다. 이 선수가 터치다운을 만드는 능력은 어마어마한데, 전년도에 18개의 터치다운을 기록하면서, 리그의 모든 선수들 중에 가장 많은 득점을 얻어냈고, 이런 결정력은 이번 경기에서도 그대로 발현되어 2개의 터치다운을 기록하면서 콜츠의 공격을 책임져줬다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>러닝시도<\/th><th class=\"r\">러싱야드<\/th><th class=\"r\">시도당 러싱야드<\/th><th class=\"r\">러싱터치다운<\/th><th class=\"r\">캐치<\/th><th class=\"r\">리시빙야드<\/th><\/tr><\/thead><tbody><tr><td>19<\/td><td class=\"r\">98<\/td><td class=\"r\">5.2<\/td><td class=\"r\">2<\/td><td class=\"r\">3<\/td><td class=\"r\">23<\/td><\/tr><\/tbody><\/table><\/div><p>하지만 그의 가장 아쉬운 점은 묘하게 중요한 순간에 실수가 나온다는 점이다. 이번 경기에서도 게임의 기세가 왔다갔다하는 시점에 펌블이 나오면서 승리의 기세가 훅하고 넘어 가버렸는데, 이게 더 크게 아쉽게 다가오는 이유는 콜츠의 패싱게임이 전년도 고점과는 거리가 먼 퍼포먼스라 테일러에 대한 의존도가 더 크기 때문이다. 어쩌면, 이 패싱게임의 부진이 콜츠 팬들 입장에서 가장 큰 걱정거리일 수 있다. 다니엘 존스, 알렉 피어스 (4캐치, 61야드)라는 어쩌면 확실히 검증되었다고 하기에는 어려운 2명의 선수들에게 굉장히 큰 기대를 걸며 대형계약을 안겨주었는데, 이들이 오늘과 같은 활약을 보이게 된다면 굉장히 시즌이 어려울 수 있다.<\/p><p>&lt;다니엘 존스 성적&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>패스성공<\/th><th class=\"r\">패스시도<\/th><th class=\"r\">성공률<\/th><th class=\"r\">패싱야드<\/th><th class=\"r\">터치다운<\/th><th class=\"r\">인터셉션<\/th><\/tr><\/thead><tbody><tr><td>19<\/td><td class=\"r\">31<\/td><td class=\"r\">61.3%<\/td><td class=\"r\">166<\/td><td class=\"r\">1<\/td><td class=\"r\">1<\/td><\/tr><\/tbody><\/table><\/div>","401872660":"<p>전년도 플레이오프 진출을 한 강팀간의 대결인 만큼 마지막의 마지막까지 승부를 알수 없는 짜릿한 승부였다. 특히나 2쿼터 종료 직전, 양팀이 엄청나게 빠른 속도로 치고 받은 득점전도 멋졌고, 양 팀의 공수에서 많은 슈퍼플레이가 나오면서 매우 재밌는 경기가 되었다. 텍산스의 마지막 공격권, 터치다운을 하면 게임을 승리할 수 있는 상황에서 빌스 수비의 슈퍼플레이가 나오면서 빌스의 승리로 마무리 되었다.<\/p><p>이번 게임은 빌스의 팬들이 바라는 모든 것이 나온 경기였다. 러닝 게임이 중요한 순간에 충분히 강력한 모습을 보여주었고(압도적이 아니라 하더라도), 패스게임에서도 맨투맨으로는 리그에서 가장 강한 팀일 수 있는 휴스턴 텍산스를 상대로 패싱야드만 300야드 이상 때려박았다. 지난 몇 년간 빌스의 가장 큰 고민거리는 패스게임에서 상대 수비가 맨투맨으로 나오면 조쉬알렌의 다리에만 의존한다는 것이었고, 수비가 강한 팀을 만날수록 이런 경향이 더 심해졌다는 것이다. 이번 게임에서  보여준 모습대로라면 빌스는 그 약점을 극복한 한 것으로 보인다.<\/p><p>300야드 이상 패스게임의 주역은 새로이 영입한 DJ 무어와 부상에서 회복한 타이트엔드 달튼 킨케이드였다(조쉬 알렌의 압도적 경기력은 이제 상수와 같아서 따로 언급하지 않겠다).<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>선수<\/th><th class=\"r\">캐치수<\/th><th class=\"r\">리시빙야드<\/th><th class=\"r\">리시빙 터치다운<\/th><\/tr><\/thead><tbody><tr><td>DJ 무어<\/td><td class=\"r\">5<\/td><td class=\"r\">100<\/td><td class=\"r\">1<\/td><\/tr><tr><td>달튼 킨케이드<\/td><td class=\"r\">5<\/td><td class=\"r\">130<\/td><td class=\"r\">0<\/td><\/tr><\/tbody><\/table><\/div><p>DJ 무어는 이번 시즌에 그를 데리고 오면서 기대한 모든 것을 그대로 보여주었다. 전성기 때처럼 외곽에서 매번 1대1로 이겨주는 선수는 아니지만, 중요한 순간 그리고 기회가 생길 때 외곽에서 이겨줄 수 있을만한 선수에, 러닝게임에서도 블로킹역할을 정말 충실히 잘해주었다. 하지만 빌스팬들이 더욱 기대하는 선수는 타이트엔드 달튼 킨케이드일 것 같다. 부상 때문에 기대만큼 성장하지 못했던 지난 3년인데, 이번 게임에서 자신이 왜 1라운드 픽인지를 보여주었다. 193cm에 111kg라는 압도적인 체격과 함께 엄청난 운동능력과 기술적인 루트러닝 능력을 활용해 상대가 누가 오든간에 미스매치를 만들어버렸는데, 데릭 스팅리, 리드 블랭킨십, 카마리 래써털라는 수준급의 텍산스 2선수비수들을 1대1 상황에서 돌아가면서 털어버리면서, 이 3명과 1대1 상황에서만 113야드를 기록하는 기염을 토해냈다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/3JjxQXXHaY4\" title=\"YouTube\"><\/iframe><\/div><p>단순히 개인의 퍼포먼스를 넘어서 팀의 전술적으로도 달튼 킨케이드의 약진은 굉장히 의미하는 바가 크다. 바로 빌스가 13 퍼스널 전술을 부담없이 펼칠 수 있게 되었다는 것이다. 13퍼스널은 1명의 러닝백 3명의 타이트엔드 1명의 리시버가 필드에 올라가는 공격전술인데, 선수 구성에서 보면 바로 알 수 있듯이 러닝에 극단적으로 치우친 전술이고 이는 빌스의 '강력한 오라인', '조쉬 알렌', '제임스 쿡'과 궁합이 굉장히 좋은 전술구성이다. 다만 리시버가 1명일 뿐이기 때문에, 패스게임이 취약한 것이 약점이라, 리시버가 특급이거나 타이트엔드쪽에서 패스게임에서 리시버만큼이나 존재감을 낼 선수가 필요하다. 그리고 달튼 킨케이드가 이 역할을 수행할 수 있게 되면서 실제 이번 게임에서 버팔로 빌스가 13퍼스널을 선택하는 비중이 지난시즌 대비 훨씬 증가했고 시즌 내내 유지될 가능성이 높다.<\/p><p>&lt;13퍼스널의 성적&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>전체 스냅대비 비중<\/th><\/tr><\/thead><tbody><tr><td>25시즌<\/td><td>5.1%<\/td><\/tr><tr><td>26시즌<\/td><td>40.4%<\/td><\/tr><\/tbody><\/table><\/div><p>그리고 경기 극후반 터치다운 플레이에서는 킨케이드의 존재감에 더욱 더 느낄 수 있다(아래 영상 참고). 경기내내 필드를 가로지르며 빅플레이를 만들던 달튼 킨케이드를 최후방 수비는 이를 의식할 수 밖에 없었고, 외곽의 리시버가 수비를 제껴버리는 순간을 조쉬알렌은 놓치지 않았다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/NTcOydZK5vw\" title=\"YouTube\"><\/iframe><\/div><p>텍산스 측면에서는 아쉬울 경기였다. 자신들의 장기였던 수비에서 36점이나 내주면서 자존심을 상당히 구겼을 테지만, 이는 빌스라는 팀의 퍼포먼스를 생각할 때 시즌이 지날수록 재평가를 받을 가능성이 높다. 선수들의 클래스는 여전히 높았기에 일희일비할 것은 없어보인다. 공격쪽에서도 긍정적으로 볼만한 포인트들이 많았다. CJ 스트라우드가 마지막 순간에 해내지 못해서 속이 상할 팬들도 있겠지만, 그래도 경기 전반적으로 보았을 때 지난해 플레이오프에서 보여줬던 끔찍한 모습은 아니었다. 러닝게임도 데이비드 몽고메리가 합류해서 강해졌다라고 하기에는 어려움이 있지만, 그래도 '우겨넣으면 되긴 된다' 는 수준으로 올라섰다. 무엇보다 니코 콜린스가 그 기대감에 걸맞는 선수로 다시 돌아온듯한 퍼포먼스를 보였다는 점이 매우 긍정적이다.<\/p>","401872661":"<p>다이내믹함만 놓고 보면 이번 주 최고의 경기였다. 양 팀 합쳐 96점이 나온 경기였는데, 이게 대학 게임인가… 싶을 정도로 양 팀의 수비가 부재하고 강력한 공격이 펼쳐진 경기에서 시카고 베어스의 승리로 끝났다.<\/p><p>캐롤라이나 팬서스 입장에서 가장 좋게 볼 만한 점은 바로 아주 효율적이고 정확한 공격이었다. 특히나 가장 고무적이었던 것은 바로 쿼터백 브라이스 영의 성장이었다. 인터셉션을 기록하긴 했지만, 62% 성공률, 360야드 3터치다운이라는 엄청난 호성적을 기록했다. 데뷔하기 전부터 그의 가장 큰 장점으로 여겨졌던 부분은 포인트 가드로서 공을 잘 배분하는 것이라고 했는데, 그런 점이 느껴졌다. 언더 센터에서도 좋은 플레이를 펼치는 모습이나, 수월하게 수비를 읽고 빈틈을 찾아 공략하는 걸 보면서 이제 NFL의 스피드에 좀 적응이 되었구나 하는 생각이 들게 해줬다. 특히 터치다운 이후 리시버가 공을 잡기도 전에 뒤돌아서서 세리머니를 하는 장면은 '얼씨구, 이제 즐기는구나' 싶었다. 팬서스 팀적으로도 러닝의 비중이 25시즌에 45%에 육박했었는데 이번 경기에서는 35%로 떨어졌을 정도로, 그의 패스에 의지해도 괜찮다는 판단(물론 이는 엄청난 득점전의 영향도 감안해야 한다)을 한 것으로 보인다. 개인적으로 또 유의 깊게 보아야 할 것은 제일런 코커의 등장이다. 지난해부터 꽤나 블루칩 리시버가 아닐까 하는 말이 솔솔 돌던 선수였는데, 이번 경기에서 베어스의 수비를 농락하면서 자신의 가능성을 유감없이 보여주었다.<\/p><p>반면 수비 쪽에서는 걱정이 많다. 수비 코치 에지로 에베로는 굉장히 기대되고 존경받는 수비 코치로서 많은 사람들이 차세대 빅 네임이 될 거라고 기대하는 인물이다. 그에 대한 방증으로 팬서스의 감독이 교체되는 와중에도 자기 자리를 지켰는데, 그 기대에 걸맞지 못한 모습을 계속해서 보여주고 있고, 올해마저 이런 식으로 무너지면 '아, 이제는 좀 떠나보내야 할 때인가' 하는 생각이 들게 한다. 특히나 더욱 아쉬운 점은, 캐롤라이나 팬서스의 가장 큰 강점 중 하나는 바로 데릭 브라운으로 대표되는 내곽 수비라인맨 진형인데 이들을 데리고 러닝으로 짓밟혔다는 점은 두고두고 아쉬울 것이다. 이와 별개로 결정적인 순간에 계속되는 반칙들 또한 분명히 짚고 넘어가야 할 이슈이다.<\/p><p>베어스의 이야기도 팬서스와 크게 다르지 않다. 공격 쪽에서는 베어스의 팬들이 이번 오프시즌에 꿈꾸던 것들이 모두 이뤄졌다. 우선 전년도 후반기부터 보여줬던 케일럽 윌리엄스의 성장이 이어지길 바랐는데, 가장 첫째로 정확도의 상승을 희망했다. 가장 부족한 것은 10야드 이내의 짧은 패스들에서의 집중력, 그리고 스크램블링(특히 우측) 중에 나오는 패스였는데, 이 두 부분이 이번 경기에서 베어스 팬들의 희망대로 크게 개선되었다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>구분<\/th><th>10야드 이내 패스 성공률<\/th><\/tr><\/thead><tbody><tr><td>25시즌<\/td><td>68.4%<\/td><\/tr><tr><td>26시즌<\/td><td>88.2%<\/td><\/tr><\/tbody><\/table><\/div><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/B_E4fy8uYGM\" title=\"YouTube\"><\/iframe><\/div><p>결과적으로 경기 전체적으로 72%에 달하는 패스 성공률을 기록하였고, 빠른 의사결정 패스, 위기의 순간에 자기가 직접 발로 해결하는 모습들까지 나오면서 써드다운 성공률은 69%에 달했고, 왜 그가 리그의 차세대 슈퍼스타인지 한번 더 증명하였다.<\/p><p>그 외에 베어스 공격의 러닝은 여전히 무자비했다. 감독 벤 존슨은 전략적으로 가장 큰 강조점이 러닝이라는 걸 수없이 이야기했는데, 이번 시즌에도 그 모습이 그대로 유지되었다. 디안드레 스위프트, 카일 모낭가이 두 명의 러닝백 모두 100야드를 기록하는 엄청난 퍼포먼스를 보여주면서 통합 291 러싱야드를 기록했고, 팬서스의 강점이라는 내곽 수비라인맨을 짓밟고 지나갔다. 특히나 전년도에도 강력했던 우측의 오라인은 이번 경기에서도 대단했다. 다넬 라이트는 오프시즌에 재계약을 했는데, 왜 자신이 리그 최고의 라이트 태클 연봉에 적합한지 또 증명했다. 다넬 라이트가 한 명의 선수를 돌려세우고, 라이트 가드인 조나 잭슨과 센터가 2대1로 수비를 밀어 제껴버리는 플레이는 계속해서 나왔고, 나올 때마다 강력했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ee-rrApIX3s\" title=\"YouTube\"><\/iframe><\/div><p>그리고 빅플레이 러닝 게임이 성사되려면 가장 중요한 것은 리시버, 타이트엔드의 블로킹인데, 이들 포지션은 워낙 블로킹에 생소한 포지션이기도 하고 부상 위험이 높은 블로킹을 선호하지 않는다. 그런데 베어스의 감독 벤 존슨은 &quot;No Block, No Rock&quot;, 즉 블로킹을 하지 않으면 공(rock이라 불림)을 받을 리도 없다는 멘탈리티를 팀에 이식하는 데 성공하였고, 라이언스와 같은 팀과 함께 리그에서 가장 리시버가 블로킹을 적극적으로 하는 팀 중 하나가 되었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/xPxnHTDZS3o\" title=\"YouTube\"><\/iframe><\/div>","401872922":"<p>전년도에 훌륭한 감독의 밑에서 깜짝 반란을 일으키며 2년차에는 더 날아오를거라고 기대가 되는 재규어스와, 에이스인 마일스개릿을 보내고 팀의 감독까지 교체한 클리브랜드 브라운스의 맞대결이었는데 경기전의 기대와 동일하게 잭슨빌 재규어스의 대승으로 경기가 끝났다.<\/p><p>브라운스는 신임감독 토드 몽켄의 체제에서 누가 쿼터백일까에 대한 논쟁이 프리시즌에 있었는데, 드숀 왓슨과 섀도어 샌더스 간의 대결에서 우선은 드숀 왓슨이 승리하였고 그가 선발출장을 하게 되었다. 개인적으로 NFL 역사에서 이만큼이나 스타 쿼터백이 추락과 몰락을 한 사례가 있을까 싶을 정도의 인물이 바로 드숀 왓슨이다. 커리어 초기에는 프로볼을 3회나 타면서 그 마홈즈와 견줘지는 인물이었는데, 경기장 밖에서의 추문 -&gt; 그런 와중에 체결된 타팀과의 대형 계약 -&gt; 경기장 안에서까지의 실력 추락은 역대급이라는 생각이 든다. 그래도 클래스가 있는데 경기장에서는 나쁘지 않진 않을까? 폼만 찾으면? 이라는 극소수의 기대자들도 있었겠지만(이는 브라운스가 주전 쿼터백이 될만한 대체자를 전혀 찾지 못한 이유도 있다), 이제는 놓아줘야할 때로 보인다. 그에게 남은 것은 한때 그를 특급 쿼터백으로 만들었던 우월한 포켓인지능력뿐이다. 압박이 들어오는걸 직감으로 느끼며 순간적으로 움직여야할 때라는 반응 측면에서는 여전히 클래스가 있는게 느껴지지만, 그 반응을 실제로 수행하는 운동능력, 그 외 수비 분석 능력, 빠른 판단, 정확한 패스 능력은 너무 떨어져버렸다. 이제 드숀 왓슨은 주전 쿼터백이라기에는 너무나도 거리가 먼 선수가 되었다.<\/p><p>반면, 재규어스의 쿼터백 트레버 로렌스는 역대급 유망주 (존 엘웨이 - 페이튼 매닝 - 앤드류 럭으로 이어지는 황금 1번계보)로 뽑히던 선수였는데, 프로에 와서 여러 이슈(팀원의 부진, 감독의 부진 등)들로 인해서 경기력이 굉장히 들쭉날쭉했었다. 그러다 작년에 리암 코엔이라는 수준급 감독을 만나면서 날아 올랐고, 이번 시즌에도 그 성장세를 전혀 멈출 생각이 없어보인다. 경기내내 어마어마한 패스들을 계속해서 꽂았는데 입이 정말 쩍쩍 벌어질 정도였다. 트레버 로렌스의 플레이를 살펴보자<\/p><p>2번째 터치다운을 시작으로 광오할정도로 자신의 재능을 뽐내기 시작하는데, 아군의 진형은 타이트엔드를 잔뜩 넣어서 상대가 러닝을 의식하게 하고는, 리시버 두명을 양쪽 밖에 빼놓는 구도로 간다. 그리고 플레이가 시작하면 러닝 페이크를 하고는 우리 리시버가 수비를 제끼고 안으로 들어가는 움직임을 취하자마자 바로 손이 나가서 수비 4명이 있는 한가운데로 공을 찔러넣는다. 이 플레이를 다른 각도로 보면 4명의 수비가 손을 뻗는 와중에 딱 우리 리시버에게만 들어가는 구도는 정말 폭력적일 정도로 그의 재능을 보여준다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/2-ErTG7-j9M\" title=\"YouTube\"><\/iframe><\/div><p>다음 살펴볼 플레이는 트레버 로렌스의 영특한 시선처리와 패스 정확도가 빛나고, 리암코엔의 우월한 플레이설계가 돋보이는 3번째 터치다운이다. 시작하고 우측에 짧은 스크린 옵션이 있어서 그리로 시야를 주고 수비수들을 짧은 쪽으로 끌고 내려가게 한다. 그렇게 우측 뒷공간이 열려버리는데 이쪽에 시야를 좀 더 두면서 최후방 가운데 지역을 지켜주는 수비를 우측으로 오히려 더 쏠리게 한다. 그리고 동시에 좌측에서는 선수 한 명이 밖으로 돌면서 최후방 수비를 끌고 나가고 가운데 공간을 하나의 선수가 파고든다. 그리고 아까 우측의 시선처리 때문에 우측으로 움직였던 수비가 뒤늦게 이 공간을 다시 수비하려 물러서지만 역스텝에 걸려버리면서 터치다운을 내주게된다. 역시나 정확도가 어마어마하다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/9e3gYN09aZw\" title=\"YouTube\"><\/iframe><\/div><p>마지막 플레이는 그가 왜 1번픽인지 보여주는 종합패키지다. 왼쪽에서 포켓이 완전히 무너지면서 쇄도를 피하기 위해 우측으로 살짝 움직이는데 그쪽에서도 수비가 들이닥치자 그걸 피해 다시 순간적으로 왼쪽으로 빠르게 움직이면서 포켓을 빠져나간다. 그리고 수비가 쫓아오는 상황에서 왼쪽으로 달리는 상황에서 40야드 가 넘는 기가막힌 정확도의 패스를 던지면서 터치다운을 기록해버린다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/tUEnEMz7mEY\" title=\"YouTube\"><\/iframe><\/div>","401872923":"<p>이 경기는 많은 사람들의 예측과 다르게 굉장히 박빙의 경기였다. 21-0으로 뒤쳐져있던 세인츠가 엄청난 스퍼트를 보이며 연장까지 가는 와중에 마지막에 세인츠가 터치다운을 하면서 엑스트라 포인트를 차면 게임을 무승부로 이끌고 갈 수 있던 상황에서 2포인터 컨버전을 시도했다가 그게 실패하면서 패배를 하게 되었는데, 물론 1주차였지만, 여러모로 인상적이고 양팀의 팬들에게 시사하는 바가 꽤 있는 게임이었다고 생각한다.<\/p><p>일단 패배한 세인츠 측을 보자면 예상하던것과는 굉장히 다른 공격을 펼쳤다. 이번 시즌을 들어서면서 세인츠의 오라인은 꽤나 강하다고 생각했다. 1라운드픽이 무려 3명이나 있는 오라인에 2라운드픽인 센터 에릭 멕코이는 지난 몇년동안 기량이 놀라울정도로 향상되고 있어서 감독인 켈렌 무어가 이글스의 공격코치시절 보여줬던 강력한 러닝 공격을 재현하지 않을까 하는 기대감이 있었다. 허나, 막상 뚜껑을 열어보니 거의 정반대의 게임을 펼쳤다. 템포(세인츠의 노허들 비율은 1주차 기준 리그의 1위)를 최고치로 올려서 패스게임 위주로 게임을 펼치는게 이게 의외로 먹혔다. 특히나 경기 초반에 짧은 체크다운 패스로 운영하려고 했던 듯한데, 이게 잘 안풀리면서 오히려 더 호전적으로 롱패스로 게임을 전환했고 팀의 에이스 리시버가 공을 찰떡같이 잡아주면서(10개의 캐치 182야드) 엄청난 추격의 주역이 되었다. 아쉽게도 연장에서 승리를 거두진 못했지만 호전적인 플레이콜링이 팬들에게 상당히 좋게 보이지 않았을까 생각이 들고, 이런 스타일을 얼마나 유지할지도 좀 궁금하다. 왜냐하면 오라인의 강력함이 이리 되면 상당히 희석되고, 패스게임 위주를 펼치기엔 쌕 허용이 높기 때문이다. 수비쪽에서도 쌕펌블 터치다운이 무효화되는 게 있는게 아쉽겠지만 그럼에도 라이언스의 폭발적인 공격을 후반부에 굉장히 잘 막았다.<\/p><p>반면 라이언스는 극단적인 기쁨으로 시작하다가 간담이 서늘했을 것이다. 초반에는 굉장히 좋았다. 특히나 공격쪽에서 자미르 깁스, 아몬라 세인트 브라운 듀오의 존재감은 어마어마하다. 아몬라 세인트 브라운의 장점 중 잘 알려져 있지 않지만 정말 의미가 있는 것이 그의 힘이라는게 보여진 경기였다. 수비와의 손싸움에서 수비를 아예 압도하면서 첫 터치다운을 만들었고, 중간에는 수비와의 경합속에서도 공을 놓치 않는 강력한 터프함을 통해 또 한번 터치다운을 만들기도 했다. 자미르 깁스 역시나 자신의 폭발력을 보여주면서 몽고메리의 빈자리는 느껴지지 않을정도였다. 하지만 가장 큰 아쉬움은 이둘과 함께 삼지창 역할을 해줄 딥쓰레트 (장거리 패스 특화) 제이미슨 윌리엄스이다. 기억이나는 것만 세어도 공을 4번이나 떨구면서 극도로 불안한 모습을 보였다. 작년 후반기부터 라이언스의 컨셉은 판타지 풋볼을 하는가? 라는 생각이 들 정도로 자신들이 생각하는 에이스 선수들에게 기대를 하고 있는 모양새이기 때문에 제이미슨의 성장은 이 팀의 성적에 미치는 영향이 대단히 클 것이다.<\/p><p>팬의 입장에서 가장 걱정이 되는 것은 역시 수비일 것이다. 에이단 허친슨이 놀라운 압박능력을 보여주면서 압박 10회 쌕 2개를 만들어내는 기염을 토했지만, 수비에는 그 뿐이었다. 에이단 허친슨 외에 임팩트를 낼 엣지러셔는 없어서 그가 있는 쪽에만 선수를 하나 더 붙이면 되고, 2선 수비에서는 세인츠의 크리스 올라베 급의 선수를 막을 선수가 전혀 없었다. 라이언스가 목표하는 바는 굉장히 높은 곳이기에 이 부분에 대한 고민이 분명히 해결되어야할 것이다.<\/p>","401872924":"<p>지난해 드래프트에서 2번픽 (제츠), 4번픽(타이탄스)를 가졌던 약팀간의 대결이었는데, 그만큼 경기력이 아쉬운 게임이었다. 특히나 타이탄스 팬들 입장에서는 하늘이 무너질만한 경기력이었다. 이번 게임 10번의 공격권이 있었는데 타이탄스는 7번의 공격권을 5플레이 이하로 끝냈다. 즉 그 공격권에서 단 한번의 퍼스트다운만 만들어냈던 공격권이 7번이었다. 첫번째 공격권과 승패가 무의미해진 마지막 공격권을 빼면 타이탄스는 8번의 공격권동안 84야드만을 전진했을 뿐이고 퍼스트다운도 단 4개만을 만드는데 그쳤을 정도로 공격쪽에서 아무것도 하지 못했다. 러닝과 패스 양면에서 완벽히 틀어막히는 모습을 보면, 타이탄스의 암흑기는 길고도 깊을것으로 보인다.<\/p><p>제츠의 입장에서는 나쁘지 않은 수준이었다. 전년과 비교하면 하늘과 땅 정도로 차이가 컸고, 객관적으로 스탯만 놓고 보면 괜찮았다 라고 충분히 할만하다. 특히나, 러닝을 기반으로 해서 꾸준하고 차분하게 계속해서 전진을 해나가는 역량은 상당히 좋았다, 이게 가장 극명하게 보이는 것은 시간 점유율인데, 39분대 21분일정도로 제츠가 압도적이었다. 거기다가 팀의 에이스 리시버인 개럿 윌슨과 쿼터백 지노 스미스의 호흡이 좋았던것도 긍정적으로 볼만한 부분이다. 하지만, 상대가 타이탄스였다는 점, 그리고 3RD 다운에서의 갱신율이 2/12 였다는 점을 고려하면 이 팀이 좀 더 수비가 강한 팀을 만나서 초반 다운에서의 러닝이나 짧은 패스가 막히기 시작하면 공격이 꽉 막힐 수도 있다. 물론 추측일 뿐이며, 추후 일정에서 확인할 수 있을것이다. 일단 제츠는 전년도 최악의 모습(팀의 리시빙야드 1위였던 개럿 윌슨의 리시빙야드가 400야드도 안되는...)보다 확실히 나아진 모습을 보였다.<\/p>","401872925":"<p>지난 몇 년간 시즌 개막전에서 늘 패배를 당하던 신시내티 뱅갈스와 늘 승리를 하던 탬파베이 버커니어스 간의 상반된 결과가 나왔는데, 이번 시즌 본격적으로 수비를 보강한 뱅갈스가 지난 몇 년간 줄기차게 플레이오프에 진출했던 탬파베이 버커니어스를 상대로 턴오버를 4개나 만들어내면서 승리를 거뒀다.<\/p><p>탬파베이 버커니어스 입장에서는 공격 코치 잭 로빈슨 체제에서 첫 시작을 했는데, 아쉬움이 꽤나 남을 것이다. 러닝도 나쁘지는 않았고(시도당 4.5야드), 베이커 메이필드도 자신의 장기를 보여주었다. 82%에 달하는 높은 성공률, 위기의 순간에 나오는 스크램블링은 50%의 서드다운 성공률로 이어지며 플레이를 계속하게 만들었지만, 결과적으로 결정적인 순간에 턴오버가 연거푸 나오면서 그 좋은 플레이들이 모두 무의미하게 되어버렸다. 다수의 턴오버라는 게 한 경기에 나오는 특수한 케이스일 수 있어 아직 이번 시즌이 무너졌다고 보기에는 다소 이르다.<\/p><p>반면 뱅갈스 측에서는 너무 기분이 좋은 경기였을 것이다. 우선 조 버로우 체제에서 거의 늘 있던 0승 1패의 시작을 안 겪어도 되었다는 것만으로도 기쁠 텐데, 수비 쪽에서의 분전이 굉장히 기쁠 것이다. 지난해 리그 최약체 수비였던 뱅갈스는 이번 시즌 굉장히 많은 자원을 수비 쪽에 투자했는데, 새로이 팀에 합류한 선수들이 대활약을 했다. 팀의 에이스로 기대된 덱스터 로렌스는 특별한 스탯 라인을 찍지는 못했지만, 한가운데서 오라인들의 이목을 끌어내면서 자기 주변의 다른 선수들에게 기회를 제공하는 역할을 잘해주었고, 역시 올해 합류한 엣지 러셔 보예 마페가 덱스터 로렌스가 제공해주는 기회를 경기 내내 살리면서 펌블까지 만들어냈다. 이와 더불어 전년도 팀 수비에서 가장 큰 약점으로 지목되던 라인배커진, 그중에서도 배럿 카터가 이번 경기 굉장히 좋은 활약을 펼친 게 아주 좋은 소식이다.<\/p><p>공격 쪽에서는 오히려 지난 몇 년간 보아왔던 모습과 유사한, 만족스럽지 못한 경기가 이뤄졌다. 조 버로우는 인터셉션을 한 번 기록했고, 자말 체이스조차 4번의 타깃, 2캐치 12야드라는 그에게 전혀 어울리지 않는 스탯 라인을 찍으면서 매 시즌 반복되는 시즌 초 헤매는 경기 양태가 또 나타났다. 그나마 마이크 게시키가 퍼포먼스를 올리면서 '아, 뱅갈스의 공격이 역시 자원이 굉장히 많구나' 하는 점을 한 번 더 느끼게 해주었다. 뱅갈스의 경기를 보고 공격이 헤매는 와중에 수비가 다 해줬다는 평을, 그것도 시즌 초에 하게 될 줄은 몰랐는데 이번 경기는 그런 형국이었다.<\/p>","401872926":"<p>이번 시즌 가장 약팀 중 하나로 뽑히는 애리조나 카디널스와 가장 기대되는 팀 중 하나로 꼽히는 LA 차저스 간의 맞대결이었는데 경기 결과는 많은 사람들이 예상하는 것과 정반대로 나왔다. 카디널스가 펀트블락으로 기세를 뺏어오더니 누구도 예상치 못한 승리를 일궈냈는데, 경기내용 또한 굉장히 알찼다.<\/p><p>우선 공격이 너무나 스무스한게 인상적이었다. 베테랑 쿼터백 자코비 브리셋은 카일러 머리와 같이 번뜩이는 슈퍼플레이는 못하지만 차곡차곡 안정적이게 플레이는 가능했고, 이게 굉장히 큰 도움이 되었다. 공격진을 넓게 펼쳐서 차저스가 필드의 구석구석을 수비하게 만들었고 이로 인해 생기는 중앙의 빈틈을 집요하게 공략하면서 공격을 굉장히 잘 전개했다. 차저스의 전년도 수비는 굉장히 촘촘하고 잘 짜여진 지역수비를 기반으로 운영되었는데, 이 공헌자가 떠나간 수비코치 제시민터라고 판단을 하고 이리 넓은 포메이션을 짜온 것 같은데 아주 즉효였다. 거기다가 필드의 중앙에는 타이트엔드 맥브라이드가 있다. 그롱카우스키 - 켈시 시대를 지나 켈시 - 조지키틀 시대의 타이트엔드들을 봤었다면, 이제는 맥브라이드의 시대라고 단언할 수 있을 정도로 그의 존재감은 대단했다. 더윈 제임스라는 리그의 손꼽히는 세이프티(전성기 켈시와도 맞붙었던)가 붙어있는 상황에서 9캐치 95야드 1터치다운이라는 굉장한 성적을 거두면서 카디널스의 공격을 견인하였다. 아쉬운점이라하면 팀의 미래라고 불리며 NFL 10년만에 나오는 역대급 리시버 재능이라고 불리우던 마빈해리슨 주니어가 아직까지도 조용하다는건데... 그나마 다행인 점은 올해 또다른 미래라고 뽑은 러닝백 제레마이아 러브는 신인치고 나쁘지 않은 모습을 보여주며 기대감을 갖게 했다.<\/p><p>반면에 차저스의 경우에는 전년도의 이슈가 여전히 해결되지 않은게 느껴진다. 바로 내곽 오라인맨의 퍼포먼스이다. 전년도 모든 오라인맨이 부상을 당하면서, LA 한인 타운에도 100kg 넘는 벽보가 붙었다고 농담을 했었는데, 양측의 태클을 그렇다쳐도 내곽 오라인맨의 부진은 올해도 차저스의 모든 기대감을 꺾는게 아닌가 하는 걱정이 들게 했다. 저스틴 허버트의 포켓은 꾸준하게 무너졌고, 러닝도 허버트의 스크램블링을 제외하면 시도당 3.5야드에도 미치지 못할정도로 부진하게 만드는 가장 큰 요인이 되었다. 마이크 맥다니엘 공격코치의 신묘하고 본적없는 전술이 이 포지션에서의 부족한 선수진을 보완해줄거라고 기대했는데 1주차에 바로 이런 효과를 바라는거 자체가 욕심이었을수도 있겠다는 생각은 든다. 차저스 팬들 입장에서 더욱 이 게임이 안타까운 점 중 하나는 팀의 1번 리시버 역할을 해줘야할 래드 맥컹키가 경기 중 부상으로 빠졌다는 점이다. 실제 그가 게임을 떠나기전까지 중요한순간에 빅패스들을 계속 잡아가면서 허버트와의 호흡 게임 전술에 대한 이해도에 있어서 굉장히 높은 수준을 보여줬다는 점에서 더욱더 안타까움이 커진다.<\/p>","401872927":"<p>올해 NFC 서부만큼이나 엄청나게 어려운 디비전인 NFC 북부 (베어스, 라이언스, 패커스, 바이킹스)에서 두 디비전 라이벌간의 대결로 시작된 개막주였는데, 경기 내용도 다이나믹하기 그지 없었다. 게임의 시작부터 바이킹스측에서 가장 기대를 받던 카일러 머리가 뇌진탕으로 빠지고, 그 뒤로 패커스가 22-10 까지 앞서나가기 시작했는데, 갑자기 바이킹스가 기어를 올리더니 2:40이라는 짧은 시간동안 터치다운을 3개나 만들어내면서 대역전극에 성공을 했다. 이로써 바이킹스는 팀의 주전 쿼터백이 빠진 상황에서도 디비전 라이벌을 상대로 귀중한 1승을 거뒀고, 패커스는 마이카 파슨스를 부상으로 잃은 이후로 6연패를 기록하게 되었다.<\/p><p>우선 패커스의 입장에서 보면, 가장 긍정적인 점은 크리스챤 왓슨의 존재감이다. 패커스의 지난 몇년간 가장 큰 고민 중 하나는 좋은 2번 리시버는 많은데 1번 리시버로 올라설만한 선수가 뚜렷하게 보이지 않았다는 점인데, 크리스챤 왓슨이 바야흐로 그 역할을 수행해줄 수 있을만한 역량이 보인다. 엄청난 스피드를 기반으로, 1대1 상황에서 상대를 제끼는 능력이나, 짧은 패스를 빅플레이로 연결하는 능력까지 1번 리시버에게 요구하는 모든걸 다 수행해줄 수 있다는걸 또 증명했다. 거기에 터커 크래프트, 매튜 골든 두 명의 선수들은 왓슨을 보좌할만한 역량이 충분해보인다.<\/p><p>반면에 단점은 러닝에서의 비효율성이다. 팀의 주전 러닝백인 조쉬 제이콥스가 필드 밖 이슈로 인해 결장을 하게 된 상황에서 러닝의 성적이 굉장히 크게 떨어졌다. 21번의 러싱을 했는데 시도당 3.1야드에 불과할정도로 러닝이 성적이 부족했다.(물론 조쉬제이콥스가 있던 작년도 그가 그 전시즌에 비해 부진하면서 팀의 공격력이 후퇴했다.) 물론, 쿼터백 조던 러브의 순수 패스를 해야하는 상황에서의 능력은 상당히 뛰어난 편이고, 감독인 맷 르푸어의 빅플레이 설계능력은 발군이다. 3RD &amp; LONG이라고 할 수 있는 상황에서 그린베이 패커스가 작년에 2위를 한게 그 증거인데, 문제는 이번 경기에서는 반칙까지 12개가 나오면서 그 둘의 능력만으로도 헤어나올 수 없는 상황에 더 위치하게 되었고 그대로 경기를 내줬다. 여기에 부족한 러닝은 패커스의 시간 점유율을 극도로 줄여버렸고 이는 결과적으로 경기 후반 체력 부족에 따른 오라인의 붕괴로 이어졌다. 그리고 피 냄새를 맡은 바이킹스의 수비진에 그대로 궤멸 되어버렸다.<\/p><p>바이킹스 입장에서는 기적같은 역전승이었다. 경기 시작은 바이킹스가 상상하기 가장 끔찍한 출발이었다. 카일러 머리는 여러모로 바이킹스에 적응하지 못하는 듯하게 포켓을 너무 손쉽게 벗어나면서, 불편한 모습을 보였고, 결국에는 인터셉션을 당했다. 그리고 더 안타깝게도 컨커션 부상을 당하면서 필드에서 내려가버렸다. 그리고 그의 대체로 들어간 카슨 웬츠조차도 처음에는 쌕을 내주면서 헤매는 듯한 모습을 보였는데, 바이킹스에는 저스틴 제퍼슨이 있었다. 전년도 그의 커리어 최악의 해 (물론 이래도 1000야드를 넘겼다)에 대한 설욕을 작정했다는 듯 중요한 순간에 빅 캐치를 계속 해주면서 바이킹스의 희망을 이어나갔다.<\/p><p>그러다가 수비쪽에서 불을 확 당겼다. 패커스가 필드골을 성공했으나 상대의 반칙이 나왔고, 필드골 성공을 수용하는 대신 반칙을 받아들여서 4TH &amp; 1 에서 QB 스닉을 시도했고, 이게 실패하면서 게임의 흐름자체가 완전히 바뀌어버렸다. (개인적으로 QB 스닉은 말그대로 SNEAK 인데 TUSH PUSH 이후에 너무 흔해졌고, 누구나 성공할 수 있다고 착각하는 것 같다). 그리고 이 이후로는 게임의 흐름이 완전히 바이킹스 쪽으로 바뀌었다. 바이킹스의 왼쪽 러닝이 뚫리기 시작했고, 이를 기반으로 왼쪽의 러닝을 페이크로 준 제퍼슨에게의 패스로 터치다운을 만들면서 공격쪽에서 터졌고, 수비쪽에서도 바이킹스의 수비코치 브라이언플로레스가 대단하다고 느껴지는 게임이었다. 경기 초중반까지만 해도 라인배커들을 어느정도 뒤로 물리면서 정상적인 수비를 하는 듯했는데, 위에 말한 4TH &amp; 1 실패로 모멘텀이 넘어왔다고 느끼자마자 바로 라인배커를 모두 1선 수비에 붙여버리고는 닥공 올 블리츠(이번 경기 블리츠율은... 80%에 달했다...)를 연거푸 해대는데 와 진짜 강심장이다 하는 말만 나왔다. 조던 러브도 상대의 의도를 알아채고 짧은 패스로 블리츠를 파훼하기도 했지만, 바이킹스의 줄기찬 블리츠가 한번씩은 러브에게 닿았고, 그럴때마다 그 다음 플레이에서 러브의 경기력이 쭉쭉 떨어지는게 보였다. 전술적으로 아쉬운 것은 이렇게 블리츠가 계속 되는 와중에 단 하나의 스크린패스도 없었다는 점인데 (물론 바이킹스의 라인배커들은 스크린을 잡아내는데 귀신이라는 점을 생각하면 이해가 안되는 건 아니다)허나 결국 압박이 지속되면서 결국 턴오버까지 만들어내버렸다. 물론 이러한 양태의 승리가 앞으로 쭉 반복될거라고 기대하기는 어렵지만, 그럼에도 불구하고 이 힘든 디비전에서 디비전 팀을 상대로 1승을 따내고 상대에게 1패를 안겼다는거는 시즌 최후반부에도 분명히 임팩트를 줄만한 승리다.<\/p>","401872928":"<p>1번픽을 가지고 있던 라스베가스 레이더스와 많은사람들이 올해 최약체 팀으로 뽑은 마이애미 돌핀스와의 경기였는데, 돌핀스가 시즌 전 평가에 맞게 패배를 기록했다.<\/p><p>신임 감독에 팀의 에이스이자 기둥이었던 선수들을 거의 다 팔면서 완벽한 리셋 버튼을 누른 돌핀스인데 그런 점들이 어느정도 티가 났다. 경기력이 끔찍하다고 할 수는 없었다. 매해 비슷한 상황이었던 다른팀들과 비교하면 그래도 공격을 하기는 했다는 점에서 그런데, 계속해서 발목을 잡았던 것은 쌕 허용이었다. 쿼터백 말릭 윌리스는 이번 경기에서 5개의 쌕을 허용하였는데, 오라인의 부진 영향도 있겠지만, 아무래도 검증되지 않은 쿼터백이고 아직 성장중인 쿼터백이기에 의사결정을 하는데 조금 주저주저하는게 분명히 보였다. 특히나 경기가 후반으로 갈수록 마음이 급해지는 지 이런 조급함이 더욱더 드러났다. 안타까운점은 이런 어린 쿼터백의 성장을 도와줄 슈퍼스타가 없다는 점이다.<\/p><p>반면에 레이더스는 이번 경기에서 꽤나 기분이 좋을 것으로 보인다. 커크 커즌스는 올해 1번픽인 멘도자가 벤치에서 배우면서 프로에 연착륙 할 수 있게 베테랑 역할을 하게끔 데리고 왔는데, 딱 그정도에 맞게 보여줬다. 초반에 10개의 패스를 연거푸 성공하면서 게임의 흐름을 확잡는데 성공했지만, 동시에 인터셉션을 2개나 내주면서 음... 다른 팀이었다면 하는 걱정도 분명히 들게 해주었다. 좋게 볼만한 포인트는 역시 러닝백 애쉬튼 젠티이다. 25년 1라운드 6번픽이라는 러닝백치고 대단히 높은 순위로 지명을 받으면서 패스와 러닝 양쪽에서 활약해줄 수 있는 자원으로 평가를 받았는데, 데뷔해였던 작년에는 매 러닝마다 시작선 뒤에서 수비를 만나기 시작하니 뭐 아무것도 보여줄 수 없었다. 올해 전년도 시애틀 시호크스 공격코치 큐비악이 팀의 감독으로 오면서 젠티의 포텐을 터뜨려줄거라고 기대를 했는데 이번 게임에서 그의 가능성을 분명히 보여주었다.<\/p><p>&lt;애쉬튼 젠티 성적&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>러닝시도<\/th><th class=\"r\">러싱야드<\/th><th class=\"r\">캐치<\/th><th class=\"r\">리시빙야드<\/th><th class=\"r\">리시빙 터치다운<\/th><\/tr><\/thead><tbody><tr><td>23<\/td><td class=\"r\">102<\/td><td class=\"r\">6<\/td><td class=\"r\">45<\/td><td class=\"r\">2<\/td><\/tr><\/tbody><\/table><\/div><p>수비쪽에서도 아까 언급했듯 쌕을 5개나 기록하는 좋은 모습을 보였지만, 이건 다른 팀과 경기를 좀 더 봐야 정확한 평가가 가능할것으로 보인다. 개인적으로 이번 게임에서 가장 인상적이었던 것은 레이더스의 펀터였다. 어디의 하이라이트에도 안나오겠지만 정신나간 비거리와 정확도는 와 뭐지? 하는 생각이 들었다.<\/p>","401872929":"<p>디비전 라이벌 간의 대결인 만큼 1주차에 치뤄진 굉장히 중요한 게임이었는데, 경기의 마지막 순간 커맨더스가 터치다운을 하면서 2포인트 컨버전으로 연장으로 끌고 갈 수 있는 상황에서 플레이를 실패하면서 이글스의 승리로 끝나버린 게임이었다.<\/p><p>커맨더스 측부터 보면 긍정적으로 볼만한 포인트가 적지 않다. 전년도 리그 최약체 수비 중 하나였던 커맨더스는 이번 오프시즌에 엄청난 자원을 투자하면서 자신들의 수비를 업그레이드 시켰는데, 그 효과가 드러나는 모습이었다고 생각이 든다. 수비수들은 뒤에서 성난 개가 쫓아오는 것마냥 엄청난 속도로 공을 향해 돌진해가면서 이글스의 공격을 무력화시켰고, 특히나 올해 드래프트 1라운드에서 뽑은 써니 스타일스가 바클리의 블로킹을 그야말로 박살내고 쌕을 기록하는 장면은 그 백미였다. 그렇다고 수비가 완벽하다는 말은 아니다. 수비가 파이팅과 투지가 넘쳤던 것은 사실이지만 2선 수비에서의 정교함은 여전히 전년도의 약점이 눈에 보였다. 물론 1주차에 불과하기에 이 점은 개선이 될 가능성이 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/lzPpFK9JdPw\" title=\"YouTube\"><\/iframe><\/div><p>공격쪽에서는 나쁘지 않았지만, 훌륭하다고 하기에도 어려움이 있었다. 패스성공률은 간신히 50%를 넘기고 200야드에도 못미친 성적이 나왔다. 테리 멕로린의 노화가 온건지 확실히 폼이 떨어진듯한 모습이 나오기 시작하였고, 새로이 팀에 합류한 스테판 딕스가 상대 코너백 드진 쿠퍼를 여러번 요리하면서 중요한 순간에 플레이를 만들어냈지만, 터치다운을 기록하고는 불필요한 세레모니를 하면서 이후 엑스타포인트 실패의 원인을 제공했다는 점은 아... 역시 딕스는... 하는 생각이 들게도 했다. 마지막 투포인트 컨버전은 사실 더 큰 아쉬움이 든다. 왼쪽에 선수들을 다수 배치하고 수비의 시선이 그리로 가게 한 후에 상대의 허를 찌르며 타이트엔드 존 베이츠에게 셔블 패스를 하는 플레이였는데... 의도자체는 나쁘지 않지만, 이런 중요한 순간에는 스타에게 맡기는게 더 낫지 않았을까 하는 아쉬움이 든다. 상대의 허를 찌르려던 판단이 오히려 독으로 작용할 가능성이 있고, 플레이의 설계 자체도 선수들을 전부 왼쪽으로 두는게 좀 아쉽다. 오른손잡이 쿼터백이기에 선수들을 전부 우측에 두는 페이크를 두고 셔블 패스를 했다면, (왼쪽에 뒀을 때는 그쪽으로 패스를 하기 위해서는 송구 자세가 몸을 가로지르는 움직임을 취해야하기에 정확도가 떨어지고 수행하기 어렵다.)쿼터백이 좀 더 상황에 맞게 아 이건 페이크를 쓸게 아니고 패스를 할 때구나 하고 판단할 수 있지 않았을까 싶다.<\/p><p>이글스의 입장에서도 간신히 뚫어낸 진땀승의 게임이었다. 근데, 이제 이글스 팬들은 이런 승리에 굉장히 익숙할 것 같다. 수비가 강력한 모습을 보이는 와중에 제일런 허츠가 아.. 음..? 하고 의문점이 들듯한 플레이를 하다가 결정적인 순간에 빅플레이를 해내면서 승리를 거두는 행태가 또 반복되었다. 잘한것부터 보자면 수비는 여전히 기가막히다. 이글스의 코치진들 중 이번 오프시즌에 교체가 많았는데 그 중에 빅팬지오를 잡은 것은 가장 잘한일일것이라는 확신이 든다. 라인배커 잭본은 왜 자신이 프레드 워너 바로 밑의 탑티어 라인배커에 자기가 위치해있는지를 보여주며 홍길동마냥 동분서주하며 필드를 지배했고, 제일런 카터 역시나 수비쪽에서도 슈퍼 빅플레이를 하진 않았지만 묵묵하게 자신의 몫을 해주면서, 필드골 상황에서 또 한번 공을 건드리는 기염을 토해냈다.<\/p><p>공격쪽에서도 그래도 작년에 비해서는 훨씬 좋아진 모습을 보여주었다. 제일런 허츠는 50%성공률을 간신히 넘겼고 패싱야드도 200야드를 살짝 넘기는 좋은 성적을 기록하긴 못했지만, 중요한 순간에 플레이들은 기가 막혔다. 드본타 스미스에게 나오는 빅패스부터 4쿼터에 게임이 걸린시간 나온 스크램블링과 가더트의 터치다운 패스까지 기록을 하면서 아 정말 평가하기 어려운 쿼터백이다 라는 생각이 굉장히 많이든다. 어떻게보면 차저스의 저스틴 허버트와 정반대의 위치에 있는 쿼터백이라고 할 수 있을 것 같은데... AJ 브라운의 부재가 그의 전반적인 퍼포먼스에 꽤나 영향을 미친거라고도 볼 수 있기에 이번 시즌을 좀 더 두고 봐야할 것이다. 반면에 긍정적인 면은 세이콴 바클리가 꽤나 폼을 회복했다. 이번 경기 100야드를 기록하진 못했지만, 그에 가깝게 기록하고 시도당 5.5야드를 기록한것은 이글스팬들 입장에서 아 그래도 작년보다는... 하는 희망감을 가지게 할만하다.<\/p>","401872930":"<p>열성적인 팬들 덕에 매해 올해는 다르다 라고 외치는 카우보이스와 신임감독으로 명장 하버를 임명한 뉴욕자이언츠간의 디비전 라이벌이었는데, 많은사람들이 카우보이스의 공격력과 오프시즌 수비에 취한 수많은 보강으로 그들의 강세를 예상했는데 오히려 뉴욕자이언츠가 카우보이스를 압도한 게임이었다.<\/p><p>카우보이스의 공격은 베테랑 닥 프레스캇, 씨디램, 조지피켄스라는 최강 듀오, 거기에 강력한 오라인까지 올해 최고의 공격을 노렸는데 그에 비해 형편없는 모습을 보였다. 175패싱야드에 69러싱야드라는 조촐한 성적인데 씨디램, 조지피켄스 둘다 누구도 50야드 조차도 기록 하지 못했다. 물론 이런 스타 쿼터백 - 리시버진의 불호흡은 1주차에 적게 나오는 일은 아니다. 어느정도 시동이 걸리기까지 시간이 걸리는 경우도 많아서 크게 걱정할일은 아닐 수 있는데 오히려 걱정할 것은 러닝게임이 아닐까 싶다. 특히나 팀의 오라인 에이스인 타일러 스미스가 부상으로 빠졌는데, 그 여파가 너무 크게 작용하는게 아닐까 싶다. 그의 부재가 4~6주 정도로 예상되는 만큼, 앞으로 이 부분은 굉장히 주의깊게 봐야할 필요가 있다.<\/p><p>오히려 더 걱정이 되는 것은 수비다. 오프시즌에 합류한 여러 선수들의 성적표를 이야기하기도 전에 전술적인 부분에서 이번 경기는 아쉬움이 컸다. 자이언츠는 이번 게임 러닝게임에 대한 강력한 의지를 가지고 들어온게 느껴졌다. 러닝시도가 패스시도보다도 많았고, 풀백, 타이트엔드, 추가 오펜시브라인맨의 적극적인 기용을 통해 너희를 짓밟고 가겠어라는 의지를 표명했는데, 카우보이스는 이러한 전술을 상대로 스플릿 세이프티 (최후방에 2명의 수비를 두고 그만큼 1선은 얇게 하는 전술)를 계속해서 들고 나왔다. 뿐만이 아니라, 상대의 패스게임에서도 스플릿 세이프티를 계속해서 고집하면서 짧은 거리를 줄건 줘 라는 마인드로 나왔는데, 이것도 정도것 해야지 자이언츠의 단거리 외곽지역은 경기가 끝난 지금까지도 못막고 있을 것이란 생각이 든다. 이게 왜 이럴까? 새로이 신임된 수비코치 크리스챤 파커의 영향이다. 크리스챤 파커는 빅팬지오 계보의 인물로, 이 빅팬지오 계보의 제자 수비코치들은 사실 지난 몇년간 리그에서 계속해서 이번 경기에서 카우보이스 수비가 보여준 단점들을 똑같이 보여주면서 대실패를 거뒀었는데, 파커 역시나 그 바통을 이어받는게 아닌가 하는 걱정이 된다.<\/p><p>반면에 자이언츠 측에서는 이보다 더 좋은 시작이 있을까 싶다. 현재 NFL에서 가장 존경받는 감독 중 하나인 존 하버 감독의 영향력을 곧바로 느낄 수 있었는데, 선수들의 파이팅 자체가 남달랐다. 공수 양쪽에서 인상적이었는데 우선 가장 인상적이었다는 공격쪽부터 짚어보려한다. 무엇보다 인상적이었던 것은 컨셉이다. 이 팀의 심장은 러닝백 캠 스캐티보이다. 박치기 공룡을 연상시킬정도로 자신의 몸은 전혀 돌보지 않고 풋볼만을 바라보는 그의 태도가 팀의 모든 에너지를 뿜어내는 거라고 할 수 있는데, 이를 굉장히 정확하게 살리는 컨셉을 감독이 도입했다. 존 하버는 자신의 이전 팀인 볼티모어 레이븐스에서 타이트엔드 아이재아 라이클리와 풀백 패트릭 리카드를 데리고 오면서 러닝과 러닝에서 파생되는 패스 컨셉을 강조한 시즌이 될거라는걸 내포했고, 이번 경기 그 청사진 그대로 이어졌다. 포메이션에 1명의 리시버만 있던 스냅의 비중이 23%에 달했는데 이는 1주차 기준 리그 4위에 달하는 비중이었고, 이 덩어리 형님들이 포진된 전술을 상대로 1명의 수비수를 최후방으로 더 뺀 안일한 카우보이스의 대응에 어른이 어린애들 갖고 놀듯 라인을 자이언츠의 뜻대로 완벽히 갖고 놀았다. 거기다가 굉장히 인상적인 포인트 중 하나는 쿼터백 잭슨 다트이다. 잭슨 다트는 드래프트 전부터 광오해보일정도로 오만하고 동시에 캠 스캐티보처럼 자신의 몸을 전혀 아끼지 않는 플레이들을 하면서 그야말로 불같이 뜨거운 플레이스타일을 펼쳤었다. 물론 보는 입장에서는 즐겁지만, 팀의 장기적 성공을 위해서 좋은 것은 아니었다. 존 하버 감독이 이 부분을 정말 확실히 다잡은 것으로 보인다. 캠 스캐티보가 심장이라면, 잭슨 다트는 차가운 두뇌의 역할을 해야하는데, 잭슨 다트가 이 롤을 완벽하게 수행했다. 상대의 수비가 최후방에 계속 비중을 두면 짧은 패스로 실수 없이 차근차근 패스를 펼쳐나가야하는데 이러 차분함을 보이면서 80%에 달하는 높은 패스성공률 230야드 3터치다운 0인터샙션이라는 그야말로 고효율의 성적을 기록했다는게 놀랍다. 물론 앞으로 카우보이즈 만큼의 안일한 수비를 계속해서 만날일은 없겠지만 앞으로가 굉장히 기대가 된다.<\/p><p>수비쪽에서는 원래 재능은 엄청나게 많이 있던 수비진이었다. 특히나 1선 수비진에 엄청난 재능이 몰려있었는데, 이들을 기점으로 라인을 완전히 압도해보렸고 카우보이스의 모든 계획이 물거품이 되게 만들었다. 다만, 2선 수비진에서 자이언츠의 재능 부족은 지난해 큰 문제였고, 이번 게임에서도 완전히 해소된 모습은 아니었다고 생각한다. 파이팅은 이전보다 늘었지만, 아슬아슬한 반칙상황이 굉장히 많았던걸 생각하면 반칙콜링이 자기들 쪽으로 안불게 되면 무기력하게 빅플레이를 계속해서 허용할 가능성도 배제할수 없다.<\/p>","401872931":"<p>올해 AFC 쪽에서 가장 강할거라고 생각한 덴버 브롱코스와 어느정도 하향세가 아닌가 하는 생각이 들기 시작한 치프스의 디비전 맞대결이었는데, 전혀 예상치 못한 결과가 나온 대표적인 경기가 되었다. 치프스가 브롱코스를 두들겨 팼는데, 그 승리하는 방식부터 모든 것이 굉장히 의외였다.<\/p><p>우선 패배한 브롱코스 측부터 보자면, 덴버 입장에서 가장 우려되는 시작일것이다. 오프시즌에 덴버측의 굉장히 큰 의사결정 중 하나는 바로 플레이콜링, 즉 공격측에서 다음에 무슨 플레이가 나올지를 감독 숀 페이튼이 하지 않고 이 권한을 팀의 공격 코치인 데이비스 웹에게 이양한것이었다. 숀 페이튼은 NFL 역사를 두고 봐도 손에 꼽힐 가능성이 있는 굉장한 플레이콜링으로, 상대 수비의 경향성을 빠르게 체크하고는 경기 후반부에 그걸 기가막히게 노리는 인물이다. 실제로 전년도 덴버 브롱코스가 4쿼터부터 공격이 터져나오기 시작한것도 이런 경향이 있었는데, 새로운 인물인 데이비스 웹이 이 역할을 얼마나 수행할 수 있을까 에 대한 걱정이 있었는데, 그 걱정이 현실로 드러났다. 여러 의아스러운 부분들이 있었는데, 스크린플레이를 설계하듯 구상해놓고는 보닉스의 시선처리는 빅 패스를 노리고 있는 플레이가 이도 저도 아니게 된다는 점이나, 리그 제일 수준의 오라인을 가지고, 그 오라인 뒤에서 팀의 최고 러닝백인 JK 다빈스에게 전반전에 공을 단 3번만 주는 포인트나, 팀에 새로이 합류한 제일런 와들을 과하게 노리고 있는게 분명한 상황에서 그 선수를 미끼로 전혀 활용하지 않는 전술적 결정 등등 아쉬움이 굉장히 컸다. 물론 이는 1주차이기 때문에 생긴일일 수 있지만, 만약 이게 계속 지속되면, 데이비스 웹이 플레이콜링을 오래할 것으로 보이지 않는다.<\/p><p>수비측에서도 1주차와 같은 미숙함이 굉장히 많이 나왔다. 가장 크게 드러난 것은 미스태클이다. 이번 경기 덴버 브롱코스의 미스태클은 24개인데 (미스태클율 52%), 이번 주차에서 브롱코스 다음으로 많았던 팀이 베어스로 미스태클 15개에 불과했던걸 생각하면 브롱코스가 얼마나 태클에서 정교함을 보이지 못했나 느껴지게 한다. 하지만, 이 한 게임만으로 앞으로 브롱코스의 수비가 이런 추세로 계속될거라고 생각하지는 않는다. 1주차라 어느정도 프리시즌의 연장선이라는 점, 그리고 후술하겠지만 치프스가 전혀 예상하지 못한 언더센터의 강력한 러닝으로 나가면서 놀랐다는게 더 크게 작용하지 않았을까 싶다.<\/p><p>반면에 치프스의 공격은 정말 새로웠다. 앤디 리드 감독은 오라인 출신으로는 정말 특이하게 (내가 알기로는 유일하다...) 러닝보다 패스를 좋아하는 인물인데, 그것도 선수들을 넓게 펼친 (SPREAD) 형태의 극강의 패스 전술을 선호하는 인물이다. 이 시스템에서 과거 이글스 시절에는 도노반 맥냅이 치프스에는 패트릭 마홈즈가 날아올랐던건데, 문제는 지금의 치프스는 과거와 전혀 다른 선수 구성을 가지고 있다는 점이다. 타이릭 힐이 떠나고 패스의 게임에서 특급 리시버가 부재한 상황에 도달했고, 팀의 가장 강한 구성은 바로 오라인 그것도 내곽 오라인이 되었다. 그리고 이걸 안다는 듯이 이번 오프시즌에 러닝백 케네쓰워크를 데리고 왔는데, 그럼에도 불구하고 앤디리드 감독이 정말 러닝을 할까에 대한 의구심이 있었다. 하지만, 시즌 오프너에서 치프스는 제대로된 러닝게임을 들고 나왔다. 이번 게임에서 치프스의 언더센터 비중은 무려 40.6%에 달하는데 근 치프스의 10년 역사에서 듣도 보도 못한 수치이다. 그리고 그 의도 그대로 어마어마한 성적을 거뒀는데 팀 러싱 성적 220야드에 케네쓰워커는 173러싱야드 시도당 7.5야드라는 정신나간 성적을 거두면서 팀의 승리를 견인했다. 몇몇 플레이들을 보면, 빅플레이 러닝이 나오기 위해서는 리시버들의 블로킹이 굉장히 중요한데, 라쉬라이스는 닉 보니토라는 수준급의 엣지러셔를 상대로 좋은 각도의 우위를 활용해서 완벽한 블로킹을 만들면서 빅플레이를 도왔고, 트레이 스미스 - 크리드 험프리라는 리그 최강의 내곽오라인맨 듀오는 수비 하나를 가지고 거의 9야드 가까이 밀어붙이는 어마어마한 포스를 보였고, 워커 자체도 워낙 폭발력이 높은 선수여서 빅플레이 능력은 의심할 바가 없었는데, 지난 시즌부터 차분하게 블로킹이 형성되는 능력을 기르면서 저점을 크게 향상시켰고 이런 역량이 이번 게임에서도 크게 드러났다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/tj2twJ_eQvY\" title=\"YouTube\"><\/iframe><\/div><p>수비쪽에서도 스패그놀로우 수비코치가 자신의 클래스를 보여주었다. 제일런 와들 (2야드)이라는 상대 팀의 1번 옵션을 완전하게 지워버리면서 덴버 브롱코스가 가져온 게임의 완벽한 카운터를 쳐버렸다. 무엇보다 놀라운 것은 이러한 성과가 팀의 주력 2선 수비수들을 모두 떠나보낸 와중에도 낸 성적이라는 점이다. 그리고 전년도 뭔가 살짝 폼이 떨어진듯했던 크리스 존스의 퍼포먼스가 쭉 올라가게 된것도 치프스팬들 입장에서 굉장한 희소식일 것이다.<\/p>","401872932":"<p>NFC와 AFC의 대표적인 팀이 될 수 있는 버팔로 빌스와 디트로이트 라이언스의 게임이었다. 경기를 보고나면 버팔로 빌스에 대해 무한한 기대감이 생긴다. 공수 양쪽에서 디트로이트 라이언스를 상대로 굉장히 긍정적인 장면들이 많았는데, 특히 공격쪽에서의 퍼포먼스는 압도적이었다. 아이러니하게도 두 팀은 CEO형 감독과 명석한 공격코치의 조합 (라이언스는 댄 캠블 - 벤 존슨 / 빌스는 숀 맥덜못 - 조 브래디)으로 지난 몇년간 리그에서 가장 강한 팀 중 하나였는데, 라이언스는 감독을 지키고 코치를 다른팀으로 보내버렸고, 빌스는 감독을 보내고 코치를 감독으로 승진 시키는 선택을 했었다. (아직 확정적으로 말하긴 어렵지만)적어도 이번 게임에서는 이 의사결정이 꽤나 큰 영향을 끼친 것 같다.<\/p><p>2주차까지의 경기를 보았을 때, 조 브래디가 감독이 되어서 하고 싶었던 것은 '자신이 잘하는 것'과 '조쉬알렌이 잘하는 것'을 합쳐보는 것이 아니었을까 라는 생각이 든다. 기존의 빌스의 공격 패턴을 통해서 보자면, 조쉬알렌이 가장 잘하는 것은 바로 엄청난 팔힘에서 나오는 패스이다(물론, 그의 러닝과 이를 활용한 레드존 역량도 압도적이지만 개인적으로 그가 이리 탑티어 쿼터백이 된 것은 팔힘이라고 본다). 딕스가 있을 때, 이 역량으로 탑티어에 올라섰고, 상대팀 수비는 늘 조쉬 알렌의 빅패스를 의식할 수 밖에 없다. 허나, 너무 빅패스에만 의지하다보니 상대팀이 수비수들을 한껏 뒤로 물린채 인터셉션을 계속 낚아채기 시작했고, 빌스는 이를 보완하기 위해 조브래디(당시 공격코치)를 필두로 러닝게임을 구성했다. 다수의 롤을 수행할 수 있는 타이트엔드, 이 정도로 성장할거라고 아무도 예상치 못했던 제임스 쿡의 성장, 리그 최고수준의 오라인 구축 등 여러 요소들을 활용해서 수비가 알렌의 팔을 의식하면 지체하지 않고 러닝으로 응수했다. 그리고 알렌의 불안정성을 낮추기 위해 그의 롱패스 비율을 크게 줄여버렸다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>시즌<\/th><th>ADOT (패스의 평균 비거리)<\/th><th>+20야드 패스 비중<\/th><th>러닝비중<\/th><th>시도당 야드<\/th><\/tr><\/thead><tbody><tr><td>2026<\/td><td>10.32<\/td><td>20.8%<\/td><td>46.8%<\/td><td>5.50야드<\/td><\/tr><tr><td>2025<\/td><td>7.32<\/td><td>13.6%<\/td><td>47.7%<\/td><td>5.01야드<\/td><\/tr><tr><td>2024<\/td><td>8.34<\/td><td>17.0%<\/td><td>45.4%<\/td><td>4.59야드<\/td><\/tr><tr><td>2023<\/td><td>8.70<\/td><td>15.7%<\/td><td>46.4%<\/td><td>4.43야드<\/td><\/tr><\/tbody><\/table><\/div><p>그런데, 조 브래디는 감독이 되자 '자신이 잘하는 러닝'과 '조쉬 알렌의 특기인 롱패스'를 같이 쓰고 싶은 것 같다. 위의 표에서 보다시피(물론 2주라는 적은 표본이지만)  효과적이고 효율적인 러닝을 유지한 상태에서 조쉬 알렌의 롱 패스 플레이 비중이 꽤나 늘어난걸 확인할 수 있다. 이렇게 되면, 상대하는 입장에서는 시작선 바로 앞에서 승부가 결정지어지는 러닝을 대비하면서, 시작선의 최후방보다 한참 먼 지역에서의 플레이까지 대비해야 한다. 즉 수비하는 범위가 너무 넓어지는 애로사항이 생기게 된다. 이 것이 빌스가 현시점 리그 최강의 공격력을 자랑하는 이유다.<\/p><p>이번시즌 러닝 플레이 중 가장 눈에 띄는 전술은 램즈의 감독 션 멕베이에게서 차용해온 듯한 멀티 타이트엔드이다. 다수의 타이트엔드를 한쪽에 가로로 길게 늘어뜨려서, 러닝백이 지나갈 길 혹은 구멍 (GAP이라고 불리는데)이 늘린다. 오라인만 5명 있을 때는 6명의 구멍(GAP)이 있었다면 3명의 타이트엔드를 붙이는 순간 그 구멍은 9개로 늘어난다. 그러면 수비의 입장에서도 더 많은 선수들을 횡으로 길게 배치해야하고(구멍을 막기 위해), 이 긴 라인의 형성은 스피드가 빠른 러닝백 제임스 쿡에게도 아주 안성맞춤인 상황이 된다. 더 재밌는 점은 빌스가 이 긴 라인을 이용하는 러닝이 아니라 오라인들이 수비들을 한쪽으로 밀고 그 방향대로 러닝을 하는게 아니라 반대쪽 방향으로 러닝을 꺾으면서 빅 플레이를 만들어내고 있다는 점이다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/p6nlP9TEK1Q\" title=\"YouTube\"><\/iframe><\/div><p>그리고 롱패스 플레이를 적극 활용하고 있다고 했는데, 그 주역이 되어주는 선수는 다름 아닌 타이트엔드 달튼 킨케이드다. 지난 주 빌스의 리뷰에서 맨투맨 매치에서 그의 위력에 대해 설명을 했었는데, 이번 게임에서도 95야드를 캐치하면서 자신의 가치를 보여주었다. 지난 주 게임 중 몇몇 플레이들은 그의 빅플레이를 위해 설계되었다는 느낌을 들었는데, 이번 게임에서도 마찬가지였다. 수비를 속이기 위한 여러 개의 함정이 깔아서 킨케이드를 오픈으로 만드는 것 같다. (1) 우선 플레이를 시작하며 리시버를 안쪽에 있다가 바깥으로 뺀다. 그걸 본 수비들이 모두 다 조금씩 우측으로 시프트를 한다. (2) 이 때 중요한킨케이드의 스탠스 즉 자세를 보자(중요하다!). 킨케이드는 블로킹을 할 때 많이 취하는 자세인 몸이 안쪽으로 열린 자세를 취하며 상대 수비를 한 번 더 방심하게 만든다. (3) 그리고 보통 안쪽 리시버가 안쪽으로 짧게 뛰어들어가는 루트를 밟으면 제일 안쪽에 위치한 타이트엔드는 바깥으로 돌아나가는 코너루트를 타곤하는데, 여기서 허를 찌르기 위해 타이트엔드가 안쪽 포스트로 가는 루트를 탔다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/QD3chkg1zTU\" title=\"YouTube\"><\/iframe><\/div><p>이런 자신감 있는 플레이가 가능한 이유는 당연히 조쉬 알렌 덕분이다. 순수 무력과 재능으로 찍어누르는 듯한 느낌의 압도적인 퍼포먼스를 보면 초한지 속 항우가 생각난다. 자신의 다리로 빅플레이를 만들어내기도 하고, 엄청난 비거리의 패스를 너무나 손쉽게 정확하게 던지기도 하고, 자신의 시선으로 수비를 속이기 까지 하는 것을 보면 이젠 정말 리그 최강의 쿼터백으로 올라선 느낌이다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/5SvSa8jqR3M\" title=\"YouTube\"><\/iframe><\/div><p>반면 디트로이트 라이언스 입장에서는 지난 주에 세인츠를 상대로 간신히 승리를 거두면서 '이기긴 이겼는데...' 하고 찝찝한 와중이었는데 그 불안이 현실로 다가와버린 게임이었다. 공격쪽에서는 라이언스의 가장 큰 힘 중 하나인 오펜시브 라인이었는데, 힘이 확 빠진 모습이 보이는게 가장 큰 충격이다(물론 상대의 수비라인인 그렉 루쏘와 디온 워커가 어마무시한 활약세를 이어가고 있는 중이기는 하다). 내곽 오라인맨은 지난 시즌 후반부부터 조금씩 흔들리기 시작했는데, 이제 더 이상 '오라인이 강점인가?' 하는 생각이 들 정도로 평균에서 살짝 강한 정도에 머무는 느낌이고, 페네이 스웰 역시나 레프트 태클로의 전환에 시간이 조금 더 필요한 듯하다(못한다기 보다는 라이트 태클에서의 압도적인 포스가 나오지 않는다). 이런 상황에서 아몬라 세인트 브라운만이 엄청난 꾸준함을 유지한채 공격을 깁스와 함께 이끌어나가고 있는데, 만약 재러드 고프가 지금같은 추세로 수비한테 얻어맞기 시작한다면, 지금 보여주는 공격력이 시즌 내내 유지될 수 있을지 걱정이 된다.<\/p><p>사실, 공격쪽의 걱정은 수비쪽에 비하면 행복한 고민이다. 에이단 허친슨은 분명히 빛난다. 엄청난 쇄도능력과 마무리 능력을 통해서 상대의 오라인을 찢어버리는 0티어 엣지러셔의 모습을 부상 회복 후에도 유지하고 있다는 것은 굉장히 긍정적인데, 문제는 허친슨 밖에 없다는 것이다. 그의 반대편에서 임팩트를 내줄 엣지러셔는 마땅히 없는데, 최후방에서도 커비 조셉과 브라이언 브랜치라는 리그 최고 세이프티 듀오가 빠져버린 빈자리가 너무나도 크게 느껴진다. 2경기 연속 2선 수비의 혼선이 상대방의 터치다운으로 연결되었다. 라이온스 팬들이 시즌 전 '아..팀의 황금기가 지나간 것 아닐까'라는 걱정을 했다면, 이번 경기로 그 걱정이 수십배는 커졌을 것이다.<\/p>","401872933":"<p>팰컨스 팬들에게는 안타깝지만 이제 팰컨스의 경기를 따로 챙겨보는 팀은 많지 않을 것으로 보인다. 팀의 3번째 쿼터백인 쿠퍼 러쉬가 계속 등판을 하고 있고, 뭐라도 해보려고 하는데 계속 풀리지 않고 있다. 그러다보니 상대 수비에서는 비쟌 로빈슨 만을 막고 있고 그려면 팰컨스의 모든 공격이 틀어막히게 된다.<\/p><p>팬서스 입장에서는 긍정적인 포인트들이 좀 있다. 브라이스 영이 지난 경기에 이어서 게임의 포인트 가드로서 적절한 의사결정, 나쁘지 않은 패스, 포켓인지능력을 계속해서 선보인다는 건 굉장히 좋은 소식이다. 물론, 그렇다고 리그의 특급 쿼터백이라던가 1번 픽에 어울리는 인물로까지 성장했다는 말은 아니지만, 그가 데뷔시즌에 겪었던 지옥을 생각하면, 팀을 충분히 플레이오프 정도까지는 이끌만한 선수로 조금씩 성장해나가고 있는 것은 분명하다. 특히나 거대한 리시버/타이트엔드들과의 호흡도 갈수록 좋아지고 있는데, 이번 게임에서 대활약을 한 대런 월러까지 조합되면 버커니어스가 왕좌로 군림한 NFC 남부지구에 가장 강한 도전장을 내미는 팀이 될 수 있다. 아쉬운 점이라면 러닝이 크게 만족스럽지 못했다는 점이다. 상대를 일찌감치부터 압도한 경기라 자신들 팀의 근간이 되는 러닝(오라인이 꽤나 강한팀이다)의 감을 올리는것도 좋은 방법이었을텐데, 팬서스는 그 선택보다는 패스로 계속 나가는 것을 선택했다. 혹시 브라이스 영의 성장을 과신하는 것은 아닐까라는 걱정이 든다.<\/p><p>더 긍정적인 소식은 수비쪽이다. 지난주에 59점이라는 말도 안되는 실점에 절치부심한건지 수비쪽의 파이팅이 대단했는데, 특히나 라인배커 데빈 로이드가 그 중심이었다. 전년도 잭슨빌 재규어스가 다크호스로 깜짝 등장을 했을 때, 데빈 로이드는 수비쪽에서 가장 중요한 역할을 맡았던 선수 중 하나였다. 팬서스는 3년 45백만 달러를 주면서 데빈 로이드를 데리고 왔고, 이번 경기에서 그 값을 톡톡히 해냈다. 2번의 인터셉션을 기록했을 뿐만 아니라 태클도 굉장히 많이했고, 쿼터백을 압박하기 까지 하는등 그야말로 서에 번쩍 동에 번쩍하며 미들라인배커에게 바라는 모든 것을 해주었다.<\/p>","401872934":"<p>뱅갈스의 수비가 또 한번 활약을 하면서 승리를 거뒀다. 높은 확률로 AFC 플레이오프에서 만날 두 팀간의 대결은 의외로 수비 강팀이라고 하는 휴스턴 텍산스가 터치다운을 2개나 허용하고 신시내티 뱅갈스가 하나의 터치다운을 허용하지 않으면서 벵갈스의 승리로 끝났다.<\/p><p>점수차로 봤을 때는 텍산스가 크게 패배를 한것 같지만 생각보다 텍산스 팬들 입장에서는 좀 아쉬울 게임이었다. 결과적으로는 20점을 실점하였지만, 텍산스 수비는 시종일관 꽤 강했다. 패스와 러닝 양쪽으로 267야드만을 허용했다는 것이 이 반증이다. 윌 앤더슨 주니어와 다니엘 헌터는 거의 늘 백필드에서 살고 있었는데, 러닝은 시도당 3.7야드에 불과할정도로 패스와 러닝 양쪽에서 상대를 제압하였다. 하지만, 뱅갈스의 슈퍼스타들인 조 버로우와 자말 체이스가 펼친 어마어마한 슈퍼플레이를 막지 못해서 게임이 터져 버렸다.<\/p><p>첫번째 터치다운은 내가 본 터치다운 캐치 중에 10손가락안에 들 정도로 진짜 엄청난 캐치였다. 데릭 스팅리라는 리그 최고 수준의 코너백을 상대로 다리가 걸려서 밸런스가 무너진 상황에서 공에 대한 집중력을 놓치지 않고, 몸을 돌리는 와중에 아웃라인까지 신경쓰는 그야말로 입이 쩍 벌어지는 캐치였다. 두 번째 터치다운 플레이에서는 수비의 쇄도에서 조 버로우가 얼마나 우월한 포켓인지능력을 가지고 있는지, 자말 체이스는 상대 수비가 어떤 식으로 지역수비를 하는지에 대해 얼마나 정밀한 감각을 가지고 있는지를 알 수있었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/psfEZIGHsS8\" title=\"YouTube\"><\/iframe><\/div><p>하지만 이 게임의 가장 큰 수훈은 역시 수비다. 특히나, 오프시즌에 영입한 덱스터 로렌스는 기대감 그대로의 모습을 보여주었다. 한가운데서 상대의 공격을 틀어막는 어마어마한 존재감을 보여주었는데, 특히나 1야드만 남아 있는 상황에서의 승률은 압도적이었다. 이번 게임에 7번의 &amp;1 상황 (즉 갱신까지 1야드 남은 상황)을 맞이했는데, 5번을 막고 단 2번만을 내줬다. 러닝 수비에서의 존재감이 워낙 강력해서 2대1의 상황에서도 전혀 밀리지 않는 모습을 계속해서 보여주었고, 텍산스가 경기 중반 4TH &amp; 1 상황에서 고포잇을 했다가 실패를 한 기억이, 경기 극후반 고포잇을 안하고 필드골을 시도(결국 실패)하는 결과로 이어졌다고 생각을 한다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/cjpU5Q9w6G0\" title=\"YouTube\"><\/iframe><\/div><p>뱅갈스의 수비가 이런 기세를 유지하는 상황에서 조버로우 - 자말체이스 듀오가 폼이 올라가기 시작하면 뱅갈스는 정말 무서운 팀이 될 수 있다.<\/p>","401872935":"<p>클리브랜드 브라운스라는 약팀을 맞이해서 분위기를 쇄신하고 싶었던 템파베이 버커니어스가 의외의 한방을 얻어맞으면서 0승 2패로 시즌을 시작하게 되었고, 브라운스는 토트 몽켄 감독체제에서 첫승을 거뒀다.<\/p><p>드숀 왓슨은 브라운스에 온 이래로 최고의 게임을 펼쳤다. 80%의 성공률에 238야드 2터치다운 0 인터셉션, 그리고 7번의 러싱 22 러싱야드를 기록했는데, 지난 경기에 비하면 훨신 더 나은 모습이 되었다. 지난주까지만 해도 브라운스는 쿼터백을 바꾼다 만다 이야기가 굉장히 많이 나왔는데, 일단 한 주는 더 드숀 왓슨으로 나아갈 수 있을 것으로 보인다. 허나, 게임을 자세히 들여다보면, 드숀 왓슨이 그의 브라운스 커리어에서 최고의 게임을 펼쳤을 뿐, 리그의 탑급 퍼포먼스를 한 것은 아니다. 한번의 딥패스를 제외하고는 모든 패스들이 짧은 체크다운 패스로 시도당 에어야드, 즉 패스한 공들의 비거리는 3.7야드에 불과할 정도로 그냥 안정적인 모습을 보였다.<\/p><p>오히려 이번 게임은 버커니어스가 예상보다 너무 못하고 있다는 점에 더 초점을 맞춰야한다. 템파베이 버커니어스의 미래라고 평가받은 탕아 베이커 메이필드도 폼이 급격히 떨어진 모습이 나오고 있다. 베이커 메이필드는 포켓을 벗어나서 스크램블링을 하는 경우가 많고 중요한 상황에 스크램블링이 성공을 하는 케이스들도 많다. 그래서 익사이팅한 면이 있지만, 좀 더 자세히 들여보자면 아쉬움이 분명히 크다. 베이커 메이필드는 짧게 2~3걸음 움직여서 순간적인 움직임을 한 이후에 패스를 하는 조 버로우나 톰 브래디식의 안정적인 패스플레이를 위한 포켓 움직임을 하지 않는다. 오히려 쇄도가 들어오면 무조건 포켓을 탈출하려고 하는데, 이게 잘 되면 극적인 플레이지만, 안되면 그대로 쌕인 경우가 너무 많아서 안정성이 크게 떨어진다. 패스의 경향에서도 이점을 볼 수 있는데, 시작선 뒤에서 던지는 스크린패스 비중이 탑 5에, 20야드를 넘어서 던지는 빅패스 비중도 탑 5다. 그 말인 즉슨, 수비를 분석하고 빈틈을 찾으면서 플레이를 펼치는게 아니라 모 아니면 도 형식의 플레이만 하고 있다는 것으로 분석 될 수 있다.<\/p><p>버커니어스의 수비쪽에서의 문제도 굉장히 크다. 러닝을 시도당 1.9야드로 잘 막았다고 할 수 있지만 드숀왓슨에게 이렇게까지 당한점은 버커니어스 수비진의 네임 밸류를 생각하면 도저히 넘어갈 수 없을 경기력이다. 특히나, 올해 트레이드한 미들라인배커 알렉스 안젤로니는 리그에서 최악에 가까운 안타까운 성적을 보이고 있다. 라인배커라하면 모름지기 태클을 잘해야하는데, 지난주에 이어 이번주도 태클을 게속해서 실패하면서 팀 패배의 가장 큰 문제점이 되었다.<\/p><p>이게 더욱 아쉬운 것은 감독인 토드 보울스 때문이다. 토드 보울스는 버커니어스가 슈퍼볼을 우승할 때 수비코치로서 엄청난 수비 퍼포먼스를 보인 것을 바탕으로 감독이 되었는데, 그 후 퍼포먼스는 슈퍼볼 우승 때와는 비교하기 어려울 정도이다. 심지어 더 아쉬운 것은 이 팀이 가장 경쟁력 있던 시기에는 리암 코엔이라는 현재 잭슨빌 재규어스에서 좋은 퍼포먼스를 보이는 공격코치가 있었고, 버커니어스는 그를 감독으로 승진시킬 수 있었다. 하지만, 토드 보울스와의 의리를 지켰고, 그 뒤로 공격은 조금씩 무너지기 시작했다. 이제는 수비까지 무너지면서 버커니어스 팬들에게는 너무 아쉬움이 큰 2주차 게임이 되었다.<\/p>","401872936":"<p>최근에 기억할 수 있는 경기 중 가장 깔끔하지 못한 경기였다. 재미가 없다는 건 아니었고 뭐가 어떻게 되는지 모를 정도로 안 좋은쪽으로 변수가 터져나오는 게임이었는데, 비가 쏟아지는 날씨에, 양팀 합쳐서 반칙을 27개나 저질렀고, 머프트 펀트 (펀트를 잘 받지 못하는 플레이)도 3~4개가 나왔거, 펌블이 5개나 나오는 게임이었다. 그리고 이런 경기 끝에 승자는 그린베이 패커스가 되었다.<\/p><p>패커스가 승리를 하긴 했지만 경기내용이 좋았다고 하기에는 어려움이 있다. 오히려 운좋은 경기라고 해도 되는데 펌블이 5개나 나오는 상황에서 하나만 제츠쪽으로 갔어도 게임이 뒤집혔을 가능성이 높다. 총 전진야드는 200야드도 안될 정도로 고전했는데, 이리된 가장 큰 이유는 역시나 오라인과 러닝게임의 부족이다. 러닝백에서는 조쉬 제이콥스의 빈자리가 굉장히 느껴져서 케일럽 존슨이 시도당 4야드로 반지라를 최대한 채워보려했지만 역부족이었다. 조쉬 제이콥스의 필드 밖 이슈가 장기화되면 트레이드 기한 전에 러닝백을 트레이드해야 할 가장 대표적인 팀이 될 것으로 보인다. 그리고 더 큰 문제는 오라인이다. 안그래도 내곽 오라인 쪽에서 불안점이 한가득인 모습을 보여주었는데, 이번 게임에서 오라인 3명이 부상까지 당하면서 '아 이대로라면 쉽지 않겠는데'라는 생각을 들게 했다. 이는 조던 러브의 경기력에도 영향을 미치고 있는 상황에 이르고 있다. 개인적으로 러브가 탑 10안에 드는 쿼터백이라고 생각하는데, 오라인이 이렇게 무너져버리면 그의 최고 장기인 롱패스를 전혀 살릴 수 없게 된다. 이번 경기 그의 20야드이상 패스 시도는 7%정도였는데 이는 지난해 14%에 비하면 꽤나 떨어진 수치라는 것이 이 점을 보여준다.<\/p><p>좋았던 점은 수비가 이전보다 괜찮았다는 것이다. 특히나 마이카 파슨스와 르샨 게리를 떠나보낸 후에 엣지러셔에 대한 굉장히 큰 고민이 있었을 것인데, 자신들이 그 후임으로 생각하던 루카스 반네스가 이번 경기 인생경기를 펼쳤다. 이번경기 9개의 태클, 2개의 쌕 9개의 압박, 3번의 런 스탑을 만들어내면서 승리의 가장 큰 역할을 견인했고, 심지어 경기를 결정지었던 4TH &amp;1 플레이에서도 핵심적인 러닝 태클을 만들어주었다. 제츠의 오라인이 약하다고는 하기 어려운점을 감안하면 더욱 고무적인 성장이다.<\/p><p>제츠의 입장에서 보면, 그래도 전년도에 비해 희망찬 시작이다. 애런 글랜 감독은 전년도에 바로 해고되어도 무방할정도로 최악의 퍼포먼스를 보여줬는데, 이번 시즌에는 그래도 하위권 정도의 퍼포먼스를 공수 양쪽에서 보이고 있다. 전년도에 비해 이번 시즌 초에 나오는 몇가지 특징들은, 오라인이 생각보다 괜찮다는 점인데 리그 평균 수준은 될것으로 보인다. 콜츠에서 버렸던 아도나이 미첼 리시버를 지속적으로 활용하고자 하는 의지도 드러내고 있는데, 특히나 빅플레이에서 아도나이에 대한 패스는 지난 경기부터 지속적으로 나오고 있다. 수비쪽에서도 퀴년 윌리엄스나 소스 가드너와 같은 에이스 선수들을 팔고 리그 최약체가 되었는데, 이번 시즌 초에는 그때보다는 훨씬 더 나아진 모습을 보여주고 있다.<\/p><p>반면 전년도에 비해 전혀 개선이 안된 포인트는 애런 글랜 감독의 시간 관리와 4쿼터 결정력이다. 4쿼터에 승부를 결정지을 두번의 공격권이 있었는데 아무것도 하지 못했고, 이 때 차분히 시간을 소진하면서 가기보다는 패스만으로 서둘러 가면서 상대에게 공격기회를 오히려 넘겨줬는데, 상대에게 넘긴 공격기회를 좋은 수비로 무위로 돌려놓고 1:00정도 남은 시점에는 타임아웃을 부르지 않고 상대가 아무것도 안하고 50초 가까운 시간을 태울 수 있게 만들면서 게임을 연장으로 끌고 갔다. 애런 글랜은 후에 기자회견에서 타임아웃을 부를 생각도 없었다. 펀트로 우리를 구석에 넣었을 것이기 때문이다 라는 인터뷰로 답을 하긴 했지만, 여전히 승부를 낼 타이밍과 연장으로 넘어갈 때의 타이밍 그리고 둘간의 구분점이 좀 이해가 안되는 구석이 있다.<\/p>","401872937":"<p>지난 경기 미네소타 바이킹스의 수비코치 브라이언 플로레스는 80%를 넘는 블리츠를 선보였는데 이번 게임에서도 70%를 넘는 블리츠율을 보이면서 벤 존슨과 자신 중, 자신이 더 제정신이 아니라는것을 증명하며 59점을 득점했던 베어스를 단 3점으로 묶어버리는 대성공을 거두었다. 결과적으로 미네소타 바이킹스는 디비전 라이벌들을 상대로 백업쿼터백을 가지고 2승을 거두며 엄청나게 좋은 시즌 출발을 보였다.<\/p><p>베어스는 지난 경기가 오프시즌에서 꿈꾸던 공격의 모든 것이 이뤄진 경기였다면, 이번 경기는 그 정 반대에 가까웠다. 아무리 비가 내리는 악천후라고해도 패싱 163야드, 러싱 134야드, 득점 3점이라는 기록은 조촐하디 조촐하다. 베어스의 자랑이라는 러닝게임은 아무런 임팩트도 내지 못했고, 케일럽 윌리엄스의 운동능력에 기댄 플레이 만이 유일했다고 할 정도로무기력했다. 베어스는 레드존에 3번이나 갔는데 터치다운은 커녕 어떤 득점도 만들내지 못했다. 한번은 펌블이 났고, 한번은 필드골 블록, 한번은 고포잇 실패로 끝났었다.<\/p><p>특히, 이번 시즌 베어스의 불안점이자 오프시즌 움직임에서 의문이 있었던 부분들에 대해 걱정이 극대화 된 게임이었다. 케일럽 윌리엄스가 부상을 당해서 나갔는데 다리를 부여잡고 눈물을 흘리며 엄지를 들어올려 모든 시카고인들의 심장을 철렁하게 만들었다. 다행히 부상은 햄스트링 부상이라 1~2주내에 복귀할거라는 엄청나게 긍정적인 소식이 추가적으로 전달 되었지만, 경미한 부상으로 엄살을 부렸다는 사람들의 놀림은 피할 수 없게 되었다(시카고 팬으로서 그런 엄살같은건 아무 상관없다... 큰 부상이 아니라는 것이 기쁠 뿐이다).<\/p><p>오프시즌에 보강했던 선수들의 퍼포먼스도 정말 안 좋았다. 센터 드류 달만의 갑작스런 은퇴에 따라 그 빈자리를 메꾸려고 데리고온 게럿 브레드베리는 이번 게임 러닝과 패스 양쪽에서 실망스러운 경기력을 보여주었다. 많은 사람들이 좀 더 확실한 자원을 뽑아야하는 것 아닐까 라고 생각했고, 베어스의 프론트는 개럿 브레드베리로 괜찮다고 하였으나 이번 경기에서는 프론트가 틀린 것 같다. 그리고 센터나 수비 등 여러 부족한 포지션들이 있는데, 3라운드에 뽑은 타이트엔드(이미 콜스턴 러브랜드와 콜 크맷이라는 준수한 자원들이 있던...) 샘 라우쉬는 이번 경기에서 최악의 퍼포먼스를 보여주었다. 2쿼터 후반에 베어스가 콜스턴 러브랜드에게 간만에 기가막힌 패스를 연결하면서 드디어 게임이 좀 풀리나 했는데 반칙을 통해서 플레이를 무위로 돌려버렸고, 공을 계속해서 떨구면서 공격의 흐름을 뚝뚝 끊어버렸으며, 4쿼터 초반에는 터치다운이 되었어야할 패스를 떨구는 치명적인 실수까지 저질렀다. 거기에 필드골 시도 상황에서 블로킹을 놓쳐버리는 치명적인 실수까지 만들며 그의 생애에서 가장 지워버리고 싶을 경기가 되었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/P7_RoBDbd_8\" title=\"YouTube\"><\/iframe><\/div><p>바이킹스 입장에서는 수비코치 브라이언 플로레스의 엄청난 역량이 느껴지는 게임이었다. 리그의 최고, 폼이 절정이라는 벤존슨의 공격을 두고 정말 단단히 준비를 하고 왔다. 라인배커 진들이 정말 각잡고 나왔다는 생각이 들었는데, 플레이가 시작하면 한 명은 아무런 주저함도 없이 바로 1선에 갖다 박으면서 수비의 라인을 강화하는데 핵심적인 역할을 했다. 베어스의 러닝 성적을 좀 더 딥하게 분석해보면, 베어스는 전반 첫 공격권 그리고 후반 첫 공격권을 제외하고는 끔찍했다. 이 말인 즉슨 라커룸에 들어갔다가 나올 때 준비한 전술이 처음에는 성공을 했지만, 바이킹스의 현장 조치에 따라 바로 제압이 되었다는 것이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th class=\"r\">전반, 후반 첫 공격권<\/th><th class=\"r\">그 외 공격권<\/th><\/tr><\/thead><tbody><tr><td>시도<\/td><td class=\"r\">12<\/td><td class=\"r\">16<\/td><\/tr><tr><td>야드<\/td><td class=\"r\">75<\/td><td class=\"r\">32<\/td><\/tr><tr><td>시도당 야드<\/td><td class=\"r\">6.25<\/td><td class=\"r\">2.0<\/td><\/tr><\/tbody><\/table><\/div><p>거기에서 가장 중요한 역할을 한 인물은 61번 제일런 레드먼드이다. 개인적으로도 팬인데, 언드래프티드 출신으로 2부리그라고 할 수 있는 UFL에 몸을 담았다가 바이킹스로부터 픽을 받은 선수답게 정말 파이팅 넘치는 플레이를 펼쳤다. 191cm 138kg라는 거대한 체구를 활용해 한가운데서 중심역할을 맡았고, 이번 경기에서도 주요 러닝 플레이들을 본인이 틀어막았을 뿐만 아니라 게임의 가장 큰 변수 중 하나였던 골라인 펌블을 만들어내기까지 했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/8tAvCMLya5M\" title=\"YouTube\"><\/iframe><\/div><p>그 외에도 인상적이었던 것은 패스러쉬이이다. 브라이언 플로레스는 지난 게임에 80%를 넘는 정신나간 블리츠율(몇년 전 45% 블리츠율이라고 해서 말도 안되는 수준이라고 했었다...)을 보여줬는데 이번 게임에도 70%를 넘는 상식선에서 이해가 불가능한 패스 러쉬를 보여주었다. 근데, 이 패스러쉬가 전 굉장히 전술적이고 전략적이라고 생각이 드는 포인트가 몇개가 있다. 첫째로 상대방이 블리츠에 대한 대응책을 내놓을 것에 대한 카운터를 준비한다는 점이다. 라인배커들의 블리츠를 당하면, 쿼터백의 입장에서 가장 정석적인 대답은 바로 그 수비가 쇄도한 뒷공간을 노리는 것이다. 브라이언 플로레스는 선수 하나를 쇄도하는 것처럼 하다가, 뒷공간을 막기 위해서 보내는 경우가 많다(더 큰 문제는 누가 쇄도하고 누가 빠질지 모른다는것이다). 인터셉션이 나왔던 플레이도 역시나 무지막지한 블리츠를 보고 케일럽 윌리엄스와 벤존슨이 짧게 들어가는 선수를 블리츠 대비 루트로 짰을텐데, 수비가 쇄도하는 듯하다가 빠지면서 그 틈을 완전히 틀어막았고, 던질 곳이 없는 케일럽이 무리한 플레이를 하게 만들었다. 거기다가 항상 쇄도를 시킬 때, 쿼터백의 시야를 보고 닥치고 패스를 쇄도할 선수와 쿼터백이 블리츠로 인해 생긴 뒷공간에 빠른 패스를 할 경우 그 곳을 막을 선수에 대한 역할 분담이 분명하다. 케일럽은 경기 내내 블리츠를 읽었다 해도 빠르게 던질 수도 없어서(그 공간에 수비선수가 있으니) 자신의 개인 운동능력에 기댈수 밖에 없었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/foslILxLFC0\" title=\"YouTube\"><\/iframe><\/div><p>또 하나 굉장히 중요한 것은 블리츠를 통해 팀의 에이스 패스러셔인 달라스 터너를 오라인이 아닌 러닝백 혹은 타이트엔드랑 매치업시키게 한다는 것이다. 24년도 1라운드 17번 픽으로 바이킹스 수비의 1번무기가 될거라고 기대하던 달라스 터너는 이번 시즌에 압박 20개로 압박 1위를 기록하고 있는데, 드디어 기대한만큼 만개하고 있다. 데뷔 시즌에 비하면 어마어마한 상승세를 보여주고 있는데, 현재 시점에 70번의 패스러쉬 스냅 중에 20개의 압박을 기록하는 28.6%의 정신나간 압박률을 보여주고 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th class=\"r\">압박회수 (순위)<\/th><th class=\"r\">압박률 (순위)<\/th><th class=\"r\">러시 승률 (순위)<\/th><\/tr><\/thead><tbody><tr><td>24시즌<\/td><td class=\"r\">12 (134위)<\/td><td class=\"r\">8.8% (-)<\/td><td class=\"r\">5.8% (124위)<\/td><\/tr><tr><td>25시즌<\/td><td class=\"r\">42 (58위)<\/td><td class=\"r\">15.2% (18위)<\/td><td class=\"r\">12.0% (54위)<\/td><\/tr><tr><td>26시즌<\/td><td class=\"r\">20 (1위)<\/td><td class=\"r\">28.6% (1위)<\/td><td class=\"r\">17.1% (8위)<\/td><\/tr><\/tbody><\/table><\/div><p>*압박률 = 압박회수 / 패스러쉬 스냅<\/p><p>그리고 브라이언 플로레스의 엄청난 전략적 스킴 또한 이에 굉장히 크게 기여하고 있다. 이번 경기에서도 수차례 달라스 터너는 오라인과 맞붙는게 아니라 타이트엔드나 러닝백과 맞대결을 펼치거나 오히려 아무도 제지를 하지 않은채로 백필드로 쇄도를 하였다. 인터셉션이 나왔던 플레이에서 조차 달라스 터너는 오라인이 아닌 러닝백과 매치업이 되었었다. 물론 아직 달라스 터너가 엣지러셔로서 리그의 최강 티어 선수는 아니지만, 타이트엔드나 러닝백들이 막을 만한 선수는 절대 아니다. 브라이언 플로레스의 전술아래 달라스 터너는 바이킹스의 강력한 수비에서 가장 중요한 선수로 성장해 나가고 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/2I-Ud3F-3v0\" title=\"YouTube\"><\/iframe><\/div>","401872938":"<p>이번시즌 최약체 팀 중 하나로 뽑히던 뉴올리언스 세인츠가 지난주에는 강팀 디트로이트 라이언스를 상대로 마지막의 마지막까지 가더니, 이번주에는 기어코 AFC 최고 팀 중 하나로 꼽히는 볼티모어 레이븐스를 잡아냈다.<\/p><p>우선 세인츠 측부터 보자면, 쿼터백 타일러 슉이 인상적인 활약을 펼쳤다. 후반전에는 19개의 패스 중에 15개를 성공하고 150야드를 기록하면서 역전의 주인공이 되었다. 25년도 2라운드에 뽑힌 쿼터백으로서 대학을 졸업생치고는 나이가 좀 많고 (99년생) 그만큼 번뜩이는 재능은 없다는 평이었는데, 전년도에는 음? 당장 대체되어야할 정도는 아닌데? 싶었다면, 올해 보여주는 퍼포먼스는 음 후보는 아니겠는데? 라는 인상을 주고 있다. 새 감독이 된 켈렌 무어는 예전에는 천재소년이라고까지 불렸다가 뭔가 스윽 하고 스포트라이트에서 벗어났는데, 왜 자신이 각광받았던 인물인지를 보여주고 있다. 크리스 올라베에게 반대쪽에서 모션을 시키는데, 외곽의 리시버가 달리다가 밖으로 빠지게 해서 세이프티를 낚고는 모션을 취했던 올라베가 짧은 루트가 아니라 깊게 달리다가 안으로 파고들게 해서 빅플레이를 만들어냈다. 플레이의 설계도 굉장히 적절했고, 이걸 놓치지 않는 크리스 올라베도 굉장히 좋았다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/D-rze8Dj-MM\" title=\"YouTube\"><\/iframe><\/div><p>여기에 타이트엔드 주완 존슨은 짧은 패스를 빅플레이로 계속해서 만들어내면서 자신의 가치를 보여주었고, 벨레 역시나 써드다운 같은 중요한 상황에 왜 자신이 믿을만한 인물인지 계속 상기시켰다. 특히나 인상 깊었던 것은 팀의 에이스 오라인맨 켈빈 뱅크스가 부상으로 게임에서 일찌감치 빠졌는데 그에 적응해 게임을 승리로 이끌었다는 것이다. 아쉬운 점은 역시 러닝이다. 세인츠는 이번 오프시즌에 러닝백 트레비스 에이첸을, 치프스의 케네쓰워커와 큰 차이가 안나는 돈을 주고 데리고 왔다. 하지만 이번 게임에서도 에이첸은 8번의 러싱 25야드 시도당 3.1야드에 두번의 패스를 받는 졸전을 펼쳤다. 물론 시즌 초이기 때문에 켈렌 무어가 아직 자신의 전술을 시험하고 있는 상황일 수 있다(실제로 지난 경기에 높은 비중의 노허들 플레이를 펼쳤다면, 이번 게임에서는 그러지 않았다). 만약에 러닝게임마저 자신들이 의도한대로 터져서 밸런스가 잡힌다면, NFC 남부지구 1위를 향한 강력한 도전자가 생길 것이다.<\/p><p>레이븐스 측에서 보자면 전반까지 공격은 괜찮았다. 하지만 후반전에 가면서부터 퍼포먼스가 급감하면서 레이븐스는 또 한번... 4쿼터에서 역전패를 당했다. 4쿼터에는 다른 팀이었나 싶을 정도로 다른 모습이었는데, 많은 사람들은 데릭 헨리를 활용하지 않았다는 점에 대해 지적하였다. 실제로 이 문제는 이번 경기 외에도 지난 시즌부터 꾸준히 지적 당한 포인트이긴하다. 실제로 4쿼터에 데릭헨리가 공을 만진 경우는 단 한번 뿐이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>전반<\/th><th>후반<\/th><\/tr><\/thead><tbody><tr><td>스냅<\/td><td>31<\/td><td>24<\/td><\/tr><tr><td>야드<\/td><td>228<\/td><td>84<\/td><\/tr><tr><td>성공률<\/td><td>71%<\/td><td>54.2%<\/td><\/tr><tr><td>플레이당 EPA 야드<\/td><td>+0.382<\/td><td>-0.228<\/td><\/tr><tr><td>터치다운<\/td><td>2개<\/td><td>0개<\/td><\/tr><tr><td>데릭헨리 러싱시도<\/td><td>11회<\/td><td>5회<\/td><\/tr><tr><td>데릭헨리 러싱야드<\/td><td>51<\/td><td>17<\/td><\/tr><tr><td>데릭헨리 시도당 러싱야드<\/td><td>4.64<\/td><td>3.4<\/td><\/tr><\/tbody><\/table><\/div><p>하지만 그 보다는, 세인츠의 수비를 더 칭찬하고 싶다. 세인츠의 수비코치 브랜든 스테일리는 빅팬지오 계보의 적장자와 같은 인물인데, 램즈에서 리그 제일의 수비를 구축한 덕에 차저스의 감독직까지 역임하였다. 허나, 거기서 빅팬지오 계보의 특징 중 하나인 소극적인(최후방에 수비수들을 많이 둔) 수비를 고집하다가 경질당하고 세인츠에서 새로운 자리를 잡았다. 이번 게임에서 그의 블리츠율은 44%에 쿼터백을 압박한 비율은 44%에 달했다. 블리츠(경향성)와 압박(스탯)이라는 점이 빅팬지오 계보 특히나 브랜든 스테일리의 수비 철학과 가장 먼 수치라는 걸 생각해보면, 스테일리가 자신의 알을 깨고 나오려고 하는 것 아닐까라는 생각이 든다. 레이븐스의 러닝이 후반부에 실종된 점에는 라인배커들(특히 케이든 앨리스)의 적극 쇄도가 있었고, 패스게임에서조차도 압박을 많이 만든 비결 중 하나는 이제는 확실히 팀의 1번을 넘어서 리그의 평균 이상 엣지러셔로 올라서는듯한 체이스 영이었다.<\/p>","401872939":"<p>필라델피아 이글스는 또 한번의 꾸역승을 거두면서 경기력과는 전혀 다르게 2승 0패를 거둔 팀이 되었고, 타이탄스는 지난주에 비해서는 경기력이 상승했지만 승리를 결정짓지 못하면서 0승 2패로 시즌을 시작하게 되었다.<\/p><p>타이탄스 입장에서는 그래도 지난 주 보다는 나았다. 수비쪽에서도 인터셉션을 2개나 만들어내면서 임팩트를 냈고, 리그 최고 티어 내곽 수비라인맨 중 하나인 제프리 시몬스는 그 이름값에 걸맞게 시종일관 백필드에 살면서 다쳐버린 이글스의 오라인을 마음껏 공략했다. 세이콴 바클리가 부상으로 빠진 이글스의 러싱을 시도당 2.8야드로 막으면서 수비쪽에서 한발 나아갔지만 그럼에도 2선 수비에서 한번씩 나오는 실수가 있었고, 특히나 경기의 마지막 터치다운에서 실수가 나오면서 패배에 굉장히 크게 기여를 해버렸다. 공격쪽에서의 접근도 생각보다 괜찮았다. 이 팀에서 가장 폭발력이 좋은 포지션 그룹은 러닝백진형이라고 생각하는데, 패스보다 높은 러닝시도에서 볼 수 있듯 이 부분에 힘을 주었고 토니폴라드 타이제이 스피어스는 패스와 러닝 양쪽에서 활약을 하면서 게임을 마지막의 마지막까지 끌고 갔다. 하지만 결국 결정을 짓지는 못했다.<\/p><p>이글스의 경우에는 제일런 허츠가 마지막 순간에 또 해주었다고도 할 수 있다. 경기 종료 2분 전에 17:20에서 공격권을 받은 제일런 허츠는 8번의 패스시도 중에 6번의 패스를 성공했고, 본인의 러닝도 하나 만들어내면서 2분만에 65야드를 전진해 터치다운까지 만들어내면서 게임을 승리로 이끌었다. 뿐만 아니라, 13번의 써드다운 패스 중에 9번을 갱신에 성공하는 등 중요한 순간마다 자신이 왜 슈퍼볼을 우승한 쿼터백인지 보여주었다. 하지만 마냥 칭찬을 하기에는 제일런 허츠는 늘 찜찜한 구석이 있다. 일단 이러나 저러나 이번 게임에서 2번의 인터셉션을 기록했고, 숙련된 쿼터백처럼 패스를 고르게 분배하는 게 아니라 특정 선수들을 표적으로만 게임을 풀어내는 경향성 또한 여전했다. 이번 게임 드본타 스미스(타겟 13회)와 돈테비욘 윅스(타겟 6회)를 제외하고는 거의 쳐다도 안본 수준인데. 이게 꼭 나쁜 것만은 아니지만, 수비의 입장에서 공격의 표적 특히나 패스게임에서 표적이 명확해지면 상대하기 훨씬 쉬워서 인터셉션과 같은 빅플레이를 내기 쉽다는 약점도 있다.<\/p><p>이글스의 경기를 보면 사실 허츠를 제외한 부분들은 오히려 더 걱정이 된다. 일단 한때 어벤저스와 같던 이글스의 오라인은 더 이상 그 팀의 강점이 아니다. 랜던 디커슨의 부상이 굉장히 크게 느껴지고 있고, 그 자리를 대체한 캠 저긴스는 이번 게임 내내 패스와 러닝 양쪽에서 제프리 시몬스에게 자동문처럼 뚫려버렸다. 이런 상황에서 세이콴 바클리가 빠지면서 러닝게임은 아예 정지한 수준으로 바뀌어버렸고, 제일런 허츠의 패스를 다변화 시켜주던 타이트엔드 달러스 고더트 마저 부상으로 빠지니 패스가 더 일차원적이게 되었다. 거기다가 수비쪽에서도 불안점들이 계속 나오고 있다. 패스 수비자체는 나쁘지 않지만, 러닝 수비에서 좀 크게 흔들렸다. 몇 번의 3RD &amp; LONG 상황에서 타이탄스의 러닝 혹은 러닝과 유사한 역할을 하는 짧은 스크린 패스를 막지 못해서 갱신을 허용한 플레이들이 크게 기억이 나는데, 이글스가 상대하려는 팀들의 러닝 공격이 타이탄스보다는 수준이 훨신 높을 것이기 때문에 이 부분을 크게 끌어올려야할 것이다. 다음 주 베어스와의 게임에서 이 부분이 굉장히 크게 시험을 받을 것으로 보인다.<\/p>","401872940":"<p>지난 해 두팀이 만났을 때 브롱코스의 감독 숀 페이튼은 스몰마켓인 잭슨빌에서 좋은 성적을 거두고 있는 리암 코엔 감독이 대단하다고 살짝 돌려서 이야기를 했고, 리암 코엔은 맞대결에서 승리를 거둔 후 기자회견에서 스몰 마켓인 우리가 대단하다 식으로 이야기하면서 묘한 신경전을 보였던 두 팀이다. 올해 리그에서 최상위권 팀 중 하나로 분류되는 두 팀간의 대결이기에 높은 경기력을 보였다. 경기 초반에는 재규어스가 골라인에서 브롱코스를 상대로 엄청난 수비력을 보이면서 기세를 제대로 살렸는데, 이후에 브롱코스가 인터셉션을 만들어냈고 그 기세를 확 올리면서 이번에는 브롱코스가 승리하였다.<\/p><p>브롱코스는 실망스러운 경기력을 보낸 1주차 이후에 내부단속을 한번 한건지, 강팀인 재규어스를 상대로 오프시즌에 기대하던 리그 탑급 경기력을 공수 양면에서 제대로 보여주었다. 우선 공격에서 이야기하고 싶은 바는 3가지다. 첫번째는 오라인의 엄청난 퍼포먼스이다. 레프트 태클 개럿 보울스, 라이트가드 퀸 마이너레즈는 많은 사람들이 본인 포지션에서 리그 최고의 선수로 평가하는데, 이들을 중심으로 한 브롱코스의 오라인은 리그 최고 탑티어고, 이번 게임에 잭슨빌 재규어스의 수비라인을 압도하였다. 패스상황에서 개럿 보울스는 하인스 알렌이라는 1티어 엣지려서를 1대1로 정말 잘 막아주었고, 러닝에서도 라인을 한참을 우측으로 날려버리면서 엄청난 공백을 만들어내기도 했다. 퀸 마이너레즈는 수비라인을 팬케이크 시키기까지 했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/5_3vSidZn80\" title=\"YouTube\"><\/iframe><\/div><p>두번째로 중요한 포인트는 쿼터백 보 닉스의 활용이다. 보 닉스가 가장 잘하는 것 중 하나는 포켓 안에서 수비를 분석해서 패스를 하는게 아니라 밖으로 빠져나가면서 빅패스를 하는 것인데, 이번 경기에서 그 점이 제대로 나왔다. 이런 움직임을 롤아웃이라고 부르는데, 지난 경기에 2회밖에 없었던 롤아웃이 이번주에는 6회가 나왔다. 제일런 와들을 향한 엄청난 빅패스는 그렇지! 이게 보닉스지! 하는 생각이 드는 상징적인 패스였는데 뒤에 수비가 쫓아오는 상황에서 우측으로 움직이면서 50야드를 정확하게 뿌리는 기가막힌 패스였다. 거기에 좋은 공격 감독 코치진을 갖고 있는 팀이 보이는 특징으로 뜬금없는 리시버나 타이트엔드가 갑자기 활약을 하는 경우가 있는데, 이번 게임에서는 3번째 타이트엔드인 네이트 애스킨스가 중요한 순간마다 롤아웃 플레이에서 주공이 되고 결국 터치다운까지 기록하는 활약을 했다. 또 하나 아주 중요한 포인트인데, 중앙에서 제일런 와들이 한 플레이도 주의깊게 봐야한다. 와들이 돌핀스에서 참 많이 하던 플레이인 깊이 달리다가 라인배커의 뒷공간으로 파고드는 플레이를 했다. 이 플레이는 쿼터백이 라인배커의 뒤, 세이프티의 앞, 그리고 와들을 쫓아오는 코너백의 반대방향으로 던져야하기 때문에, 그만큼 쿼터백이 우리 리시버와 수비진을 예측해서 미리 던져야만한다. 예측력은 보 닉스의 게임플레이에서 가장 부족한 부분 중 하나였다(물론 이런 역할을 수행할 리시버도 많지 않기도 했다). 이번 시즌 보 닉스가 자신에게 부족했던 부분을 채운 것이라면, 덴버의 공격은 한층 더 무섭게 될 것이다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/se408dEXZLw\" title=\"YouTube\"><\/iframe><\/div><p>마지막 포인트는 수비이다. 지난 경기 미스태클이 정말 많았던 브롱코스는, &quot;1주차는 프리시즌이지&quot; 라고 선언이라고 하듯이 엄청난 퍼포먼스를 보여주었다. 수비라인은 재규어스의 오라인을 그야말로 농락했다. 경기 초반에는 닉 보니토가 재규어스의 레프트 태클을 가지고 놀면서 트레버 로렌스의 패스 타이밍을 완전히 뺏어버렸고, 그 이후로 잭 앨런이 MVP급 활약을 펼치며 잭슨빌 재규어스의 내곽 오라인맨을 좌우 가리지 않고 어린애 가지고 놀듯 가지고 놀아버렸다. 오프시즌에 재규어스의 오라인이 조금 약할 수도 있지만 그리 걱정할 정도는 아니겠지 라고 평가했는데, 지금은 너무 약한데.. 하는 생각이 들정도로 일방적으로 두들겨 맞아버렸다. 둘이 압박을 8회나 만들어냈고, 재규어스는 이번 스냅의 45%가까이 압박을 받으면서 플레이를 해야만 했다. 뿐만 아니라, 2선 수비수 트리오 역시 이번게임 자기들의 클래스를 제대로 보여주었다. 패트릭 서테인 2세, 라일리 모스, 자콴 맥밀런은 이번 게임 내내 중요한순간마다 빅플레이를 만들어냈다. 지난해 리그 최강의 수비 중 하나였던 덴버 브롱코스의 퍼포먼스가 올해도 다르지 않을 것 같다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/mewnImecLIU\" title=\"YouTube\"><\/iframe><\/div><p>잭슨빌 재규어스도 굉장히 좋은 경기력을 보였다. 수비쪽에서 덴버 브롱코스의 오라인에 디라인이 어느정도 압도되긴 했지만, 라인배커 2선수비진은 강력한 모습을 보였다. 가장 중요하다고 할 수 있는 레드존에서의 성적도 상당히 괜찮았다. 특히나, 전반전에는 덴버 브롱코스의 공격이 골라인 앞 1야드까지 갔는데, 그걸 틀어막으면서 터치다운을 내주지 않았고, 두번째 레드존 방문에서는 기가막힌 인터셉션을 기록하였다. 공격쪽에서도 러닝이 나쁘지 않았고, 무엇보다 트레버 로렌스의 클래스가 느껴졌다. 이번 게임에서 재규어스의 오라인은 거의 자동문 수준으로 브롱코스의 1선 수비에 압도되었는데, 경기 초반에는 이에 적응하지 못하고 압박을 내주다가, 상대의 쇄도 강도를 느끼고는 의사결정 타이밍을 한단계 올려서 보다 빠른 타이밍 패스를 하고, 우월한 포켓 움직임으로 시간을 버는 등 어마어마한 퍼포먼스를 보여주었다. 특히나 전반 종료 직전, 자기 진영 20야드에서 시작해서 2분동안 7개의 패스 플레이를 펼치면서 나아간 공격권은 정말 인상 깊었다. 비록 이번 경기에서 라인쪽의 약점이 좀 드러나긴 했지만, 동시에 자신들의 쿼터백 재능을 확인했다는 점에서 재규어스 팬들 입장에서 앞으로를 생각할 때 오히려 더 확신이 생기지 않을까 싶다.<\/p>","401872941":"<p>시즌이 시작하기전에 지난해 1번픽을 가진 레이더스가 2승 0패로 시작하고 온갖 기대를 받은 차저스가 0승 2패로 시작할거라고 예측한 사람은 없었다. 심지어 이번 게임은 디비전 라이벌들간의 대결이었기 때문에, 시즌 후반부까지 그 충격과 영향이 굉장히 클 것이다.<\/p><p>전체적으로 레이더스가 잘한 것도 있지만, 차저스의 붕괴가 더 인상 깊다. 우선 공격쪽에서는 오프시즌에 기대하고 걱정하던 점들이 각각 있었는데 기대하던 것들은 모두 무너졌고, 걱정하지 않던 부분들까지도 걱정하게 생겼다. 기대를 모았던 사파 매드 마이크라는 별명을 가진 마이크 맥다니엘 공격코치와 저스틴 허버트의 호흡은 아직까지도 전혀 이뤄지지 않고 있다. 마이크 맥다니엘이 돌핀스 시절 잘했던 전술의 실행 조건은 투아의 빠른 의사결정과 리시버들의 빠른 발이었다. 이로 인해 리시버들이 전혀 열리지 않은 상황에도 불구하고 투아의 빠른 판단력 그리고 감독의 전술에 대한 믿음으로 패스를 미리 던질 수 있었던 것인데, 차저스에는 이점이 둘다 부재하다. 맥컹키가 빠진 상황에서는 맥다니엘의 기대에 부응할만한 리시버는 없는 수준이고, 저스틴 허버트 역시나 투아만큼 감독의 전술을 신뢰하고 있지 않다보니 커크 커즌스보다도 한참 부족한 스탯을 찍게 되었다. 여기에 오라인과 규율 면에서도 온갖 문제가 발생하고 있다. 리그의 엘리트 태클 듀오라고 불리웠던 조 알트와 르샨 슬레이터는 부상에서 회복이 덜 된건지 굉장히 흔들리고 있으며, 이 둘이 흔들리니 평균 이하의 내곽 오라인은 더더욱 더 크게 무너져가고 있다. 거기에 짐 하버 감독이 전술 전략적으로 천재적이지는 않지만 기본기에 충실한 규율이 강한 감독이라는 장점이 있는 인물인데, 그런 것치고 지금 2주동안 폴스 스타트(오라인이 공이 움직이기전에 먼저 움직이는 반칙)은 7회로 리그 1위에, 이번 경기에서는 펌블이 무려 6회나 일어나는 차저스팬들이 전혀 걱정하지 않던 모습이 나왔다.<\/p><p>수비에서도 만만치 않다. 제시 민터는 쇄도인원을 소수로 제한하고는 지역수비를 굉장히 타이트하게 구성해서 공격입장에서 어디에도 던지기 어렵게 한 다음에 칼릴맥과 주요 에이스들의 쇄도 능력을 극대화시키는 구조를 만들었는데, 현재 수비코치인 크리스 오리어리는 수비의 짜임새가 전혀 없는 상태로 일단 압박을 만들어야한다는 강박이 있는지 블리츠율만을 계속해서 늘리고 있다. 이런 상황에서 지난 몇년간 팀의 에이스였던 더윈 제임스가 폼이 떨어지다보니, 지난주에는 카디널스의 타이트엔드 맥브라이드에게 경기내내 당했고, 이번에는 커크 커즌스와 트레 터커, 심지어 브락바워스도 없는 레이더스의 패싱게임에도 탈탈 털리게 되었다.<\/p><p>레이더스 입장에서는 클린트 큐비악 (지난해 시애틀 시호크스의 공격코치였던 올해 신임감독)의 효과가 아직 완전히 나오기 전임에도 2승을 챙겼다는 것이 고무적이다. 레이더스의 공격이 현재 엄청 효율이 좋고 강력한 것은 아니다. 중요한 순간에 빅패스 플레이를 성공하고 있지만, 클린트 큐비악 시스템의 뼈대라고 할 수 있는 러닝에서는 아직까지 마땅한 답이 나오지 못했다(이번경기도 시도당 2.0야드에 불과했다). 하지만 그럼에도 긍정적이라고 볼 수 있는 점은 오라인의 블로킹 퀄리티가 전년도에 비해 확실히 늘어난게 보이고, 러닝시도가 많다는 점이다. 전년도 시애틀 시호크스도 생각해보면 러닝의 효율성은 리그에서 절대 상위권이라고 할 수 없었지만, 러닝시도가 많다보니 수비입장에서 러닝을 신경쓰고 거기서 나오는 빈틈을 패스로 공략하다가, 시즌 후반부 시스템에 적응이 되면서 러닝게임이 같이 터져나왔다는 걸 생각하면 현재 레이더스의 일종의 적응기라고 할 수 있는 시점에 2승을 챙긴건 다시 말하지만 매우 기쁠것이다.<\/p><p>수비쪽에서도 레이더스의 오프시즌 문제는 두 가지였다. 1)맥스크로스비가 부상에서 돌아오면 혼자 게임을 찢던 포스를 또 보여줄 수 있을까? 2)맥스 크로스비 외의 선수가 필요한데 어떻게하지? 이 두 가지였는데, 물론 아직 시즌이 일러서 단언하기엔 이르지만 아직까지는 두 가지에 대해 나름의 답을 다 내놓았다. 맥스크로스비는 트레이드가 될 뻔하는 여러일들이 있었는데 레이더스에 극적으로 돌아오게되면서 레이더스 네이션에 자신의 충정을 알렸고 그에 맞게 전성기 포스 그대로 경기에 영향력을 주고 있고, 그의 서브 역할을 해줄 선수로 이글스에서 데리고 온 라인배커 나코비 딘이 이번 게임 정말 큰 활약을 했다. 미들라인배커 답게 필드 곳곳에서 허리역할을 해주면서 맹활약을 했는데, 10개의 태클을 하면서 러닝, 패스쇄도, 패스차단 모든 면에서 큰 영향을 끼쳤다.<\/p><p>1라운드 1번픽을 가진 레이더스 입장에서 가장 끔찍한 결론은 멘도자를 빠르게 투입해야지만 성난 민심이 달래질 처참한 성적이었는데, 경기력에 성적까지도 나쁘지 않다보니 어린 쿼터백이 배울 시간을 더 벌 수 있게 되었고, 다음주부터는 팀의 에이스인 브락바워스가 돌아오니 레이더스 입장에서는 조금 더 기대감을 높여도 좋을듯하다. 반면에 차저스는 모든게 정비 되지 않은 상황에서 이후 빌스 - 시호크스 - 브롱코스 - 치프스라 - 램즈 - 텍산스 - 레이븐스라는 지옥의 스케줄을 앞두고 있기에 이대로 특별한 조치 없이 상황이 악화되기만 한다면, 10주차에 0승 9패일 가능성도 충분히 있어보인다.<\/p>","401872942":"<p>49ers가 리그 최약체 팀으로 평가받아왔던 마이애미 돌핀스를 맞이했다. 돌핀스가 계속해서 오프시즌에 예상되었던 최약체보다는 나은 모습을 보이고 있지만 49ers의 압도적 완력앞에서는 무력했다. 49ers가 얼마나 강팀인가를 뼈저리게 느껴지는 경기였다.<\/p><p>아무리 상대가 돌핀스라고 해도, 49ers의 공격은 '예술이다'라는 생각이 들 정도의 경기력이었다. 22번의 패스에서 20번을 성공하는 성공률에 매 패스가 13야드 이상을 갔을 정도로 단거리 패스만 한 것도 아니다. 이 팀이 부상없이 모든 선수들이 있을 때 얼마나 강한지 느낄 수 있었고, 카일 섀너핸 감독은 리그에서 가장 뛰어난 공격코치라는 생각에 더욱 더 확신을 갖게하는 경기였다. 그 위용을 느낄 수 있는 점은 이번 게임에서 49ERS의 20번의 패스 성공 중에 컨테스티드, 즉 수비와 경합한 리시버 혹은 공을 받는 인물 근처에 수비가 있었던 패스가 단 4번 뿐이었다. 그 외에는 와이드 오픈이었는데, 카일 섀너핸이 자기의 무기들을 타이밍에 맞게 수비가 이도 저도 못막게 애매한 거리차이로 벌리는 전술을 사용하는 것을 보면 입이 쩍 벌어진다. 좌우로 선수들을 벌리기도 하고 위 아래로 벌리기도 하는등 다양한 방법으로 선수들을 완벽한 타이밍에 열릴 수 있게 설계하는데, 왜 퍼디가 과거 인터뷰에서 &quot;40%정도의 패스는 오픈인 선수를 보지도 않고 특정 수비의 움직임을 읽고 우리 스킴(전술)을 읽고 이대로 되겠지 라고 생각하고 던진다&quot;라고 한지 이해가 된다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ybvriGT_Zbo\" title=\"YouTube\"><\/iframe><\/div><p>그리고 이렇게 수비수들이 고르게 퍼져나가는 선수들 중 누구를 막아야지 하고 마음을 못먹게 되는 이유에는 카일 섀너핸의 스킴 외에도 49ERS가 모은 어벤저스급의 선수들의 역량도 있다. 디보 새뮤얼, 크리스챤 맥캐프리 (CMC)는 백필드에서도 빅플레이를 만들어낼 수 있는 인물들로 하단 영상에서 CMC 쪽으로 공을 던지는 페이크 모션 하나에 수비들이 다 끌려 들어가서 그 뒷공간이 텅텅비는걸 볼 수 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/BqRlbHz_ofI\" title=\"YouTube\"><\/iframe><\/div><p>거기다가 이번 시즌 새로이 합류한 마이크 에반스 (#5) 역시나 왜 자신이 명전에 들어갈 인물인지 증명하고 있다. 93년생으로 30대 중반에 들어섰는데도 불구하고, 원래부터 알려졌던 경합상황에서의 패스 캐치능력은 여전하고, 아래 플레이에서는 그를 수비들이 얼마나 신경쓰는지 알 수 있다. 최후방의 수비가 그가 있는 쪽을 신경써서 그가 있는 화면상 위쪽 방향으로 움직이다보니 그 반대쪽이 텅텅 비게 되었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/0zsnPz941B8\" title=\"YouTube\"><\/iframe><\/div><p>뿐만 아니라, 49ERS가 드래프트하고 모은 공격쪽 선수들 중 개인적으로 클래스가 가장 높은인물이라고 생각하는 인물은 타이트엔드인 조지 키틀인데, 조지 키틀만큼 49ERS의 전체적인 퍼포먼스에 영향을 끼치는 인물은 트렌트 윌리엄스(LT) 정도밖에 없지 않을까 싶다. 부상에서 돌아온 후인데도 바로 자신의 포스를 보여주고 있다. 아래의 플레이가 특히 그런데, 보통 플레이액션에서 타이트엔드가 패스를 받는 장면은 타이트엔드가 러닝 방향(블로킹이 밀어붙이는 방향) 쪽에 서 있다가 블로킹하는 척해놓고는 스윽 빠져나오는 데서 나온다. 그런데, 이 플레이에서 키틀은 오히려 그 반대에 있다. 그리고 정말 블로킹을 하려는듯 러닝방향쪽으로 한껏 몸을 싣는데, 쿼터백은 붓레그로 러닝방향과 반대방향으로 움직이는데, 키틀은 자신의 운동능력으로 러닝방향으로 한껏 뛰었음에도 달리다가 러닝 방향 반대쪽으로 루트를 꺾어버리고, 수비는 이를 전혀 예측하지 못했다. 그 타이밍이 딱 브락퍼디가 패스각을 잡을 타이밍과 일치하는게 참... 49ERS는 강하구나 하는 생각이 들게한다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/EMho4jvNUZ0\" title=\"YouTube\"><\/iframe><\/div><p>그리고, 49ERS에서 가장 중요한 요소는 바로 쿼터백 브락 퍼디이다. 카일 섀너핸은 자신의 전술에 자신이 있지만, 그 전술이 뜻대로 풀리지 않을때, 그리고 전술적으로 하나의 레이어를 더 하기 위해 기동력 있는 쿼터백을 희망했고, 마이애미 돌핀스에 막대한 드래프트 픽을 내주면서까지 트레이 랜스를 뽑았는데, 오히려 드래프트의 마지막 픽에서 브락 퍼디라는 보물을 발견하게 되었다. 카일 섀너핸이 만난 여러 쿼터백 중에 맷 라이언을 제외하면 최고의 쿼터백이 아닐까 싶은데, 위에 말했듯이 카일 섀너핸의 전술적 시스템을 완벽하게 신뢰하면서 (40%의 공을 리시버를 보지도 않고 던지다니!! 40%를!!!) 동시에 그 플레이가 깨졌을 때 자신의 다리로 순간적으로 풀어내는 능력은 마홈즈가 생각날 정도의 기지가 보인다. 정말 드래프트 마지막 픽이 맞나 생각이 들정도로 스크램블링을 할 때 극도로 침착한데, 스크램블링을 할 때 무리하고 있구나 하는 느낌이 드는 순간이 없는것도 브락퍼디의 엄청난 가치라고 생각하는데, 이번 경기에서도 수비가 카일 유스첵을 따라가는걸 보자마자 자신이 차분하게 공을 들고 터치다운을 직접해버리는 순간이나, 펌프 페이크로 상대 수비를 하늘로 띄워버리고는 차분하게 움직여서 마이크 에반스에게 패스를 성공하는 걸 보면 다른 스포츠지만, 와 래리 버드인가? 하는 생각이 들었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/rQLy2qDCtXU\" title=\"YouTube\"><\/iframe><\/div>","401872943":"<p>전년도 슈퍼볼 우승팀인 시애틀 시호크스와 시즌 시작전 최약체 중 하나로 예상되었지만 의외로 분전중인 애리조나 카디널스, 디비전 라이벌간의 게임이었는데 전반전까지는 서로 7:7로 엇비슷했는데 후반부터 시호크스가 카디널스를 깨부시기 시작했고 결국 31:7로 완승을 거뒀다.<\/p><p>가장 인상적이었던 것은 시애틀 시호크스의 리시버 잭슨 스미스 은직바, 소위 JSN이라 불리는 인물이다. 전년도에 올해의 공격수 상을 수상하고 올해는 그보다 더 성장한듯한 느낌이 든다. 180대 초반의 리시버치고 작은 체격으로 이렇게까지 리그를 압도하고 있는 인물이 있었나 하는 생각이 들정도인데, 전성기 안토니오 브라운 정도가 체격적과 임팩트 측면에서 비슷할 것 같긴한데, 스타일은 좀 다르다. 안토니오 브라운이 좀더 종적인 플레이에 특화되어있었다면, JSN이 직선으로 달리다가 안쪽 혹은 바깥으로 꺾는 플레이에 특화되어있다. NFL을 보면서 본적이 없을 정도로 유려하고 부드럽게 방향전환을 하는데, 스케이트를 타고 다니는 것 같다. 사적으로 가까운 사람들에게는 그를 픽사 영화의 인크레디블에 나오는 프로존 (얼음스케이트로 움직이는 히어로)라고 하는데, 엔드존에서 1대1 상황에서는 왠만한 선수로는 막기 어려운 정도로까지 올라선거로 보인다. 최근에 정말 크게 성장한 부분 중 하나는 공중에 떠서도 마지막 순간에 손이나가서 캐치를 잡아내는 침착함과 팀의 주전 쿼터백 샘다놀드의 부상으로 후보 쿼터백이 들어왔는데, 그를 도와주기 위해 루트를 밟다가 공을 받으러 내려오는 움직임들이 정말 좋았다.<\/p><p>수비쪽에서는 여전히 압도적이었다. 카디널스의 공격이 그래도 조금씩 볼을 전진했는데, 경기가 갈 수록 시호크스의 수비에 압도되면서 플레이의 여유가 사라지는 것을 느낄 수 있었다. 시호크스의 내곽 오라인인 레너드 윌리엄스 - 바이런 머피 조합은 리그의 최고수준이라는 생각이 드는데 러닝게임에서 2대1을 당하면서도 크게 밀리지 않는 장면이 꽤나 나왔고, 그럼에도 불구하고 카디널스가 타이트엔드를 더 집어넣어서 러닝게임으로 재미를 보기 시작하자, 디펜시브 태클을 한명 더 기용해서 아예 상대의 러닝에 대응책을 들고 나왔는데, 더 효율적인 대응은 패스 수비였다. 자코비 브리셋과 카디널스의 오라인은 이 게임 내내 상대의 압박을 심리적으로 느꼈던게 게임에서 보였다. 패스의 템포가 조금씩 빨라졌고, 상대의 줄기찬 스턴트 쇄도 (두 1선 수비가 방향을 엇갈려서 엇박으로 쇄도하는 것)에 갈수록 머뭇머뭇하는게 보였고, 이게 결국 후반전에 인터셉션 - 펀트 - 펀트로 3번의 공격권이 무위로 돌아갔고 그 사이에 시호크스가 달아나버리면서 게임이 터져버렸다. 개인적으로 그렇게 큰 효득이 있지는 않았지만, 써드다운의 상대가 패스를 할 상황에서, 내곽 수비라인맨인 바이런 머피 (#91)를 땅에 손을 짚게 하는게 아니라 일으켜 세워서 쇄도를 시킨점이다. 라인배커도 아니고 그보다 한 40kg는 더 나가는 바이런 머피를 그런식으로 배치하고 운용하는 거 자체가 신기하긴 했는데, 그가 팀내에서 가장 강력한 패스러셔라는 걸 보여주는 장면이 아닐까 싶다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/oQq69Za52tc\" title=\"YouTube\"><\/iframe><\/div>","401872944":"<p>워싱턴 커맨더스 입장에서는 악몽이 또 현실이 되었다. 제이던 대니얼스가 지난 시즌에 이어 또 한번 부상을 당하면서 장기간 결장을 할 것으로 예상이 된다. 불행 중 다행이라면 그의 기동력을 살리는 다리나, 팔을 던지는 오른팔이 아닌 왼팔의 부상이긴 하지만.. 팬들에게는 아쉬움이 너무 클 것이다. 반면, 카우보이스는 37-20의 대승을 거뒀지만, 여전히 의구심이 남는 게임이었다.<\/p><p>커맨더스 입장에서 이번 게임에서 제이던 대니얼스가 폼이 바짝 올라오면서 그 진가가 보여지는 경기였기에 더욱 더 큰 아쉬움이 든다. 시의 적절한 스크램블링과 그를 스타덤에 올려놨던 장거리 패스를 이번 게임에 조금씩 시도하는 모습들이 나오면서 '오오 드디어 우리 제이던'이라고 생각했던 커맨더스 팬들에게는 청천벽력일 것이다. 안그래도 RG3라는 센세이셔널한 듀얼 쓰렛 쿼터백을 부상으로 떠내보낸 경험이 있는 워싱턴 팬들 입장에서는 정말 믿기 힘든 현실일텐데, 장기적으로 그의 커리어에 대해서도 큰 고민이 들게하는 부상이다. 벌써 2년 사이에 2번의 결장 부상이 발생했고, 이런 부상이 계속 될 것이라는 우려가 크다. 우선 제이던 대니얼스의 체격이 너무 얇다. 205 파운드, 약 92kg의 몸으로 뛰고 있다고 등록이 되어있는데 tv 화면으로 보아도 그의 몸이 상당히 얇은게 느껴진다. 프로에 들어올때부터 이 부분이 잦은 부상으로 연결될 수 있다는 우려가 있었는데, 그 현실대로 되고 있다. 물론 그의 퍼포먼스에 영향을 끼치는 부위의 부상은 다행히 아니지만, 이런 잦은 부상이 그의 멘탈 측면에 어떤 영향을 끼칠지 알 수 없다. 근데 필드위에 오르기만 하면 그 퍼포먼스는 어마어마하니, 곧 (27년까지 계약) 그의 재계약을 고민할 커맨더스 입장에서는 굉장히 곤혹 스러울 것이다.<\/p><p>카우보이스 입장에서 우선 다행인점은 오프시즌 기대에 걸맞게 공격이 정말 잘됐다는 점이다. 씨디램, 조지 피켄스라는 쌍두마차 리시버들이 이끄는 패스게임이 이 팀의 가장 큰 무기인데, 씨디램은 이번 게임에서 153야드 2개의 터치다운을 기록하면서 절정의 활약을 보였고, 오케스트라 지휘자인 닥 프레스캇도 84%의 성공률에 279야드 4터치다운이라는 MVP급 활약을 펼치면서 카우보이스의 공격을 견인했다. 물론 러닝게임이 안 풀리긴 했지만 (총 66러싱야드, 시도당 3.1야드) 애초에 카우보이스의 러닝게임은 패스게임을 보좌하기 위한 정도의 위상이었던걸 생각하면, '누구랑 붙어도 공격에서 밀릴 것이 없을 것'이라는 평가를 받은 카우보이스가 그 기대에 걸맞는 경기력을 보인 경기였다고 본다.<\/p><p>하지만 수비쪽에서는 여전히 문제가 있다. 최외곽 짧은 지역의 패스는 지난주에 이어 이번 게임에서도 꾸준히 공략을 당했다. 빅팬지오 계보는 이 지역에 구조적인 약점이 있는데, 이를 한번씩 나오는 변주 + 특급 코너백으로 막는데 카우보이스에는 이 역할을 해줄 선수가 없다. 여기에 러닝 수비쪽에서도 상대를 압도하지 못하면서 계속해서 상대에게 공의 점유율을 높이는 상황이 이어지고 있다. 제이던 대니얼스가 부상을 당하기 전, 즉 전반에 달라스카우보이스의 공으로 시작했음에도 불구하고, 시간점유율은 17분 2초대 12분 58초로 4분가까이 차이가 났다는게 그 반증이다. 물론 1주차에 비하면 카우보이스 2선 수비에서의 실수가 확연히 준 것은 분명 긍정적인 포인트이고 좋게 볼만한 상황이다.<\/p>","401872945":"<p>이번주 가장 재밌는 게임 아닐까 싶었던 경기였다. 양팀 다 공격 수비에서 굉장히 수준 높은 플레이를 보이면서 연장까지 간 승부였는데, 연장까지 간 마홈즈가 패배를 하지 않는다는 공식이 또 한번 성립하면서 승리를 거뒀다. 이제는 해가 저문게 아닌가 하는 의구심을 받던 치프스는 이번 주에 더욱 더 강력해진 모습을 보이면서, 자신들이 리그의 탑티어 팀임을 포효하고 있다.<\/p><p>우선 놀라웠던 것 중 하나는 치프스의 러싱 공격이다. 러닝이 본격적으로 활용되고 있는데, 앤디 리드의 곁을 떠나서 지난해 베어스에서 러닝백 코치를 수행한 공격코치 에릭 비에니미가 굉장한 영향력을 끼치고 있는 것으로 보인다. 케네쓰 워커의 합류 효과는 어마어마한데, 짧은 시즌이지만 이 기세라면 올해 최고의 영입은 따놓은 당상 수준이다. 경기당 150야드 러싱야드를 기록하면 리그 1위 러닝백의 모습을 보이고 있는데, 이번 경기에서도 보여준 폭발력이 어마어마했다. 특히나 러닝을 시작하면, 러닝방향(오라인이 블로킹을 위해 움직이는 방향)으로 차분하게 움직이면서 수비를 몰아넣고 순간적인 움직임으로 반대 방향으로 꺾는 움직임(이를 컷백이라고 한다)이 엄청나게 성장하였는데, 그의 장점인 폭발력이 정말 잘 드러낸다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/PERc_OOvi7k\" title=\"YouTube\"><\/iframe><\/div><p>그리고 강력한 러닝은 수비를 앞선으로 끌어들이게 되고, 뒷공간이 열리면서 치프스에게 플레이 액션의 기회를 열어준다. 지난 주 치프스가 언더센터를 가미한 새로운 공격 시스템을 도입하는 것 같다고 말을 하였는데, 이번주에 언더센터 비중은 떨어졌지만, 언더센터에서 패스 비중은 지난 주 보다 늘어났다. 이는 언더센터에서 플레이 액션, 즉 러닝인척 해 놓고 패스를 하는 플레이가 늘어났기 때문인데, 이번 주 게임에서 마홈즈는 17회의 플레이 액션 플레이를 펼쳤고, 이는 그의 커리어 최대이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>구간<\/th><th class=\"r\">총 플레이 중에 언더센터 비중<\/th><th class=\"r\">언더센터 시도당 야드<\/th><th class=\"r\">언더센터 EPA<\/th><th class=\"r\">패스 플레이 중에 언더센터 비중<\/th><th class=\"r\">언더센터 패스 시도당 야드<\/th><th class=\"r\">언더센터 패스 EPA<\/th><\/tr><\/thead><tbody><tr><td>2024<\/td><td class=\"r\">23.4%<\/td><td class=\"r\">4.64<\/td><td class=\"r\">+0.018<\/td><td class=\"r\">12.9%<\/td><td class=\"r\">5.42<\/td><td class=\"r\">+0.086<\/td><\/tr><tr><td>2025<\/td><td class=\"r\">19.3%<\/td><td class=\"r\">3.90<\/td><td class=\"r\">+0.011<\/td><td class=\"r\">7.1%<\/td><td class=\"r\">5.53<\/td><td class=\"r\">+0.041<\/td><\/tr><tr><td>2026 1주차<\/td><td class=\"r\">40.6%<\/td><td class=\"r\">5.50<\/td><td class=\"r\">+0.022<\/td><td class=\"r\">17.2%<\/td><td class=\"r\">6.66<\/td><td class=\"r\">+0.262<\/td><\/tr><tr><td>2026 2주차<\/td><td class=\"r\">29.5%<\/td><td class=\"r\">6.57<\/td><td class=\"r\">+0.291<\/td><td class=\"r\">24.5%<\/td><td class=\"r\">6.76<\/td><td class=\"r\">+0.203<\/td><\/tr><\/tbody><\/table><\/div><p>전반적으로 패스게임도 400야드 가까이 패스를 하면서 '마홈즈가 정말 부상을 당한게 맞았나?' '우리가 너무 쉽게 마홈즈를 무시했나' 라는 후회가 들정도로 전성기 폼 어쩌면 그 이상의 모습을 보여주었다. 켈시가 회춘한듯한 모습을 보이면서 중단거리 지역을 지배한 부분도 몇 해전의 마홈즈가 떠오르게 했고, 마홈즈의 첫 우승을 했던 WASP 플레이가 재연되는 것도 굉장히 인상적이었다. 샷건상태에서 7걸음을 뒤로 물러난 뒤에 거기서 말도 안되는 비거리의 패스를 뿌리는 걸 보면 와 진짜 어마어마하구나 하는 생각이 들게했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ZToYE7gObqQ\" title=\"YouTube\"><\/iframe><\/div><p>콜츠 입장에서는 좋게 볼 것과 안좋게 볼 것들이 좀 고루고루 퍼져있다고 생각한다. 일단 좋은 것은 콜츠의 러닝백 조나단 테일러다. 러싱야드가 시도당 3.7야드 정도로 전체적인 스탯에서는 가장 좋은 점이 맞냐는 생각이 들 수 있겠지만, 패스게임에서도 40야드를 기록하고 터치다운을 2개나 기록하면서 콜츠 공격의 핵심이 되었다. 특히나 리시버나 타이트엔드를 밖에서 안쪽으로 우월한 블록각을 이용해서 수비 라인맨을 안쪽에 고정 (PIN)시키고 그 뒤로 오라인맨이 밖으로 돌아나가면서 (PULL) 거기서 생기는 우월한 블록 체중차로 공간을 만들고 그 공백을 러닝백이 달리는 핀앤 풀 전술은 컷백을 하기보다는 차분하게 블로킹이 형성되게 기다리다가 빈틈이 생기면 가속을 확 올리는 스타일인 조나단 테일러와 굉장히 잘 맞기도 했고 나올 때마다 성공했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/H4Vy1Rr7YLE\" title=\"YouTube\"><\/iframe><\/div><p>콜츠는 연장전에서 치프스의 공격을 필드골로 성공적으로 막은 다음에 공격권을 넘겨 받았고 터치다운을 하면 경기에 승리하는 상황에서 필드골로 만족을 하고는 공을 마홈즈에게 넘겨주었고 결국 역전을 당했다. 이 콜츠의 공격권이 굉장히 드라마틱했는데 48야드 패스로 한순간에 필드를 전진하고 펌블인지 말지에 대한 논의가 있다가 결국 노펌블로 선언이 되었고, 그 다음 2번을 내리 러닝 플레이를 했는데 둘다 마이너스 야드를 기록했다. 3RD &amp; 13에 처한 상황에서 다니엘 존스가 발로 5야드 갔다가 4TH &amp; 8에서 고포잇 하지 않고 필드골로 만족을 한 흐름이었다. 개인적으로 이 마지막 콜츠의 공격권이 앞으로 콜츠의 큰 고민 거리를 보여주는 장면이라 생각한다. 빅패스 플레이 이후에 2번의 러닝 플레이들을 보면 콜츠는 자신들의 에이스인 조나단 테일러에게 이번 게임에서 가장 잘 먹힌 전술인 핀앤 풀을 가져왔는데, 상대가 이를 예측하고 라인배커들을 다 1선에 내리면서 성공적으로 막아냈고, 두번째 러닝 플레이에서도 크리스 존스와 닉 볼튼이 어마어마한 빅 플레이를 만들어내면서 러닝을 막았다. 두 플레이 모두 상대 입장에서 러닝을 예측한 움직임을 보인 것인데, 팀의 에이스 리시버 역할을 해줄거라고 기대한 알렉 피
