그 뒤에 수비가 지역수비를 하는 듣도보도 못한 수비전술을 들고 나왔다. 이게 말이 얼마나 안되는게 7명이 블리츠면 2선 수비는 4명 밖에 없다. 4명이서 최대 5명일 수 있는 상대 무기진을 막는건데 이걸 맨투맨도 아니고 지역수비로 한다고? 그야말로 상식밖이라 어린 쿼터백에게는 정말 지독하리만큼 가혹한 게임이었을 것이고, 동시에 바이킹스의 강력함을 느낄 수 있는 게임이었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/SGfTWKAZfIE\" title=\"YouTube\"><\/iframe><\/div>","401872988":"<p>이번주 당혹스러운 게임이 정말 많았는데, 그 중에서도 가장 으뜸인 경기 아닐까 싶다. 자이언츠의 쿼터백 제이미슨 윈스턴이 비가오는데 하나의 인터셉션도 없이 후반에 14점 역전을 따라붙으며 연장에 갔는데, 연장에서 양팀이 득점을 하지못하고 턴오버가 나오면서 커맨더스 입장에서 필드골만 차면 되는 상황에서 늦장을 부리다가 시간을 멈추지 않아 필드골을 못차서 무승부로 끝난 다소 황당한 게임이었다.<\/p><p>커맨더스의 마지막 공격은 생각을 할 수록 당황스럽니다. 후반전에 14점을 내리 내주면서 연장에 간 건 그렇다쳐도, 연장에서 자이언츠는 커맨더스에게 기회를 줬는데 그걸 걷어찼다. 연장 동전던지기에서 커맨더스가 이기고 자이언츠에게 선공권을 내준다. 자이언츠는 열심히 전진하려하지만, 시간이 지날수록 짙어지는 폭우에 전진을 하지못하고 46야드 필드골을 차는데, 이게 실패한다. 그리고 커맨더스는 공을 전진하지 못한 채 펀트를 찬다. 그리고 그렇게 내준 공격권에서 자이언츠의 전진을 막지못한다. 필드골만 넣어도 자이언츠는 승리하는 시점, 공을 워싱턴 24야드까지 가는데 성공을 하는데, 여기서 자이언츠는 공을 차지 않는 결정을 한다. 폭우는 더 짙어졌기에 41야드 킥에 대한 자신감이 좀 떨어져서인지, 1ST 다운이라 아직 여유가 있다고 생각한건지 스캐티보로 러닝을 하는데, 커맨더스의 대런 패인이 공을 쳐내면서 펌블을 만든다. 연장에서 이런 극적인 상황(경기가 2분남고 필드골만 차도 승리인 상황)에서의 턴오버가 25년만이라는 ESPN 보도가 있던데... 어찌되었든 이 상황에서 커맨더스가 갑자기 전진을 잘하기 시작한다. 스크램블링과 패스로 쭉쭉 나가는데, 상대 진영의 26야드까지 전진을 한다. 필드골 45야드 정도 지점이다. 이제 전진은 괜찮고 중요한건 시간관리 뿐이다. 시간을 한껏 쓰면서 도열을 하고 19초 남기고 스냅을 한다. 패스플레이를 들고 나오는데 좋았다. 왜냐하면 패스는 실패하면 시간이 멈추니까, 근데 쿼터백 제이던 대니얼스가 감자기 패스를 하지 않고 자기가 공을 들고 뛰려다가 태클을 당한다. 태클을 당하고 빠르게 일어나서 스파이크(스냅을 하고 공을 바닥에 던져서 1번의 다운을 소모하는 대신 경기시간을 멈추는 플레이)를 해야하는데, 누워있다. 그러다가 뒤늦게서야 움직이는데 이미 시간은 계속 흐르고 있고 그렇게 게임이 무승부로 끝나게 된다..<\/p><p>경기가 끝나고 제이던 데니얼스는 자신의 탓이라고 했는데, 물론 그것도 얼추 맞다. 루키도 아니고, 심지어 대학레벨에서 경험도 많은 쿼터백 제이던 대니얼스가 이렇게 상황에 대한 인지가 없는것은 큰 잘못이다. 댄 퀸 감독도 경기 끝날 때 헤드셋을 집어 던지면서 속상함을 표현했다. 하지만, 이건 감독인 댄 퀸 감독의 탓이다. 댄 퀸 감독이 4쿼터에 시간 관리를 못해서 톰 브래디에게 슈퍼볼에서 NFL 역사에 남을  역전패를 당한 인물이라는 점은 차치하고서라도, 그는 수비 코치 출신 감독이다. 수비코치 감독들은 공격 할 때 플레이콜링을 부르지 않는다. 즉 다음 플레이가 뭔지 디테일하게 생각할 필요가 없고 큰 그림에서, 이 상황에서 주의해야할 포인트들에 대해서 곤두세우고 게임을 크게 봐야하는데, 커맨더스의 선수들은 쿼터백을 포함한 그 누구도 급함이 없었다. 심지어 이 플레이가 급박하게 스냅이 이뤄진것도 아니었다. 30초 가까이 소비하면서 스냅이 이뤄졌는데도 이 포인트가 전달이 안된 것이다. 아슬아슬 선을 타는 팀에게, 이런 류의 졸전은 트라우마로 작용해 그 수뇌부를 모두 갈아치우게 하는 극단적인 경우로까지 연결되는 경우가 많다(실제 댄 퀸의 커맨더스는 시카고 베어스에게 역전 헤일메리로 충격을 주었고, 베어스는 그 충격에서 헤어나오지 못하고 수뇌부를 모두 갈아야했다). 이번 게임, 디비전 라이벌들간의 이 게임은 위기의 댄 퀸 체제의 커맨더스에게 그정도의 임팩트를 줄 결과라고 생각한다.<\/p><p>하지만 그래도 경기 리뷰니까, 연장 막판 외의 상황을 보자면 커맨더스는 제이던 대니얼스가 있을 때 확실히 다른 팀이다. 제이던 대니얼스는 이번 게임에서 자신의 다리로만 100야드 2터치다운을 기록하면서, 왜 자신이 NFL 역사상 손에 꼽히는 루키 시즌을 보낸 인물인지 보여주었다.<\/p><p>자이언츠 측면에서도 썩 기분이 좋은 경기결과는 아니었다. 자이언츠의 하버 감독이 경기 끝나고 인터뷰에서 밝혔듯, &quot;좋지도 나쁘지도 않다&quot; 라고 했는데 그 심정이 맞아보인다. 폭우가 오는 상황에서 14점 역전차를 따라잡게 만든 높은 주사위가 뜬 쿼터백 제이미스 윈스턴이 아주 빛났던 경기기도 하고, 수비쪽에서 압둘 카터는 2번 연속 임팩트를 내면서 왜 자신이 탑픽인지 2년차에 계속 증명하고 있다. 하지만, 필드골을 계속해서 놓치는 장면(이번 경기 5번의 필드골 시도 중 50, 57, 46야드의 필드골 3개를 놓쳤다...)은 좀 뼈아플 수 있다. 이 팀은 폭발적인 공격력에 기대는 게 아니기에 =스페셜팀에서도 밥값이상을 해줘야만한다. 이경기의 가장 큰 분수령이 된 스캐티보의 연장 펌블도 사실은 41야드에서 필드골을 못차게 만든 자이언츠의 스페셜팀에 원인이 있다고 봐도 과언이 아니다.<\/p>","401872989":"<p>시즌 전까지만해도 굉장히 기대되는 매치업이었는데, 시즌이 막상 열리니 두 팀다 경기력이 안 좋았고, 그건 이번 경기까지 이어졌다. 이런말 하긴 미안하지만, 승부였기에 누군가는 경기결과가 승리여야해서 덴버 브롱코스가 승리한 게임이었다. 그래서, 두 팀 다 잘한것보다는 아쉬원것 위주로 다뤄보려한다.<\/p><p>차저스의 입장에서는 차저스스러운 경기였다. 브롱코스의 공격이 별다른 임팩트를 보이지 못했고, 차저스의 수비쪽에서도 분전을 하면서 계속 기회를 주었는데 그때마다 집어던졌다. 3쿼터 후반 17-10으로 앞서던 차저스가 펀트를 차고 브롱코스가 그 펀트를 크게 리턴하면서 득점 사거리에 들어가는데 전진을 하나도 못하면서 필드골을 찬다. 하지만 그 필드골마저 실축하게 되는데, 그렇게 기회를 또 부여받은 상황에서 차저스는 4th &amp; 1 에서 QB 스닉 을 실패하면서 공격권을 넘기고 아무것도 못한다. 그리고 팀의 쿼터백이자 리그의 대표적 재능으로 불리던 저스틴 허버트의 졸전은 이번 게임에도 계속되었다. 경기 초중반에는 분명 나쁘지 않았다. 차저스의 오라인과 리시버진은 가히 리그 최약체라고 할 수 있다. 1번 리시버라 할 수 있는 래드 맥컹키 부상에 2번 리시버 존스턴(웬만한 팀에서는 3번 리시버나 할지 모르겠다) 부상에 오라인 5명중에 4명이 루키였고, 그중에 3명은 오늘 첫 선발이었다. 이런 최악의 상황에서 저스틴 허버트는 자신의 다리로 게임을 풀어나가면서 오 그래도 지난 게임에 비해 좀 나아졌나 하는 기대감을 갖게 했다. 하지만 경기 극후반부로 가면서 브롱코스가 스멀 스멀 따라오고 브롱코스의 수비가 허버트를 조금씩 압박(심리적 + 물리적) 하면서 조바심이 일어났고 아예 무너졌다. 특히나 4쿼터에 나온 두번의 공격권은 최악이었는데, 차저스의 오라인이 그 한계를 드러내듯 바로 수비에게 뚫리면서 압박을 당하는데 허버트는 쌕을 당하는 와중에 뭘하려는건지 모르겠는데 갑자기 공을 던지려고 해서 오히려 펌블을 당한다. 그리고 이걸 브롱코스가 잡으면서 공격권이 전환된다. 이어지는 다음 공격권(그렇게 펌블로 만든 공격권을 브롱코스가 3점으로 끝낸것도 어처구니가 없다) 2nd 다운에서 또 한번 압박을 당한다. 그리고 이번에도 압박당하는 와중에 어디로 던지는지 알 수 없는 패스를 던지다가 펌블이 난다. 다행히 공이 자기에게 떨어져서 공격권은 전환되지 않는다. 그리고 써드다운 역시나 뚫리는 오라인을 두고 어떻게든 포켓을 탈출해 접근을 하다가 또 수비로부터 히트를 당한다. 그리고 그냥 이때 모든 사고 프로세스가 멈춘듯하다. 상대가 정말 기본적인 '쇄도하는 듯 서다가 뒤로 물러나는 플레이'를 펼치는데, 너무나 안일하게 수비가 물러갈거라는건 상상하지도 않은채, 수비 눈앞에 인터셉션을 던지면서 게임이 끝나게 된다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/byEc88oEhnM\" title=\"YouTube\"><\/iframe><\/div><p>허버트의 주변환경이 가혹한 것은 맞다. 아까 말했듯 5명의 오라인 중에 4명이 루키인데, NFL 오래 보면서 이정도로 끔찍한 오라인을 본 경우는 손에 꼽힐듯하다. 특히나 풀링이라고 오라인이 자기 앞의 선수가 아닌 순간적으로 자리를 옮겨서 다른 쪽을 블로킹하는 움직임은 재앙일 정도로 형편없다. 자기 앞의 선수도 놓치고, 자리를 옮겨서 막으려는 선수도 놓치고 있는데 이는 러닝과 패스 양쪽에서 동일하게 일어나고 있다. 이 점이 특히나 크리티컬한 이유는, 차저스의 공격코치 마이크 맥다니엘은 이런 오라인의 풀링을 가장 적극적으로 그리고 복잡하게 사용하는 코치이기 때문이다. 하지만, 그렇다고 허버트의 탓이 없다고 할 수 없다. 부상이 많다고 하지만, 이 팀의 주전들이 모두 뛰었던 경기도 이번 시즌에 있었는데 그때도 이와 크게 차이 나지 않는 퍼포먼스를 보였었다. 2주차인가 3주차 끝나고 이 팀의 남은 스케줄을 언급하면서 0승 9패까지 갈 수도 있다고 했었는데, 지금 차저스는 0승 5패에 앞으로 스케줄은 치프스 - 램즈 - 텍산스 - 레이븐스이다... 정말 길고긴 차저스의 시즌이 되지 않을까 싶고, 가진 선수들을 모두 파는 본격적인 리빌딩에 들어갈 지도 모르겠다.<\/p><p>브롱코스의 입장에서도 크게 기쁠 것은 없는 게임이었다. 수비는 나쁘지 않았지만, 이팀의 발목을 붙잡고 있는 공격은 여전히 답답함 그 자체였다. 브롱코스의 공격이 왜 이렇게까지 아무것도 하지못하는지는 이번 시즌 초반 최고의 미스터리 아닐까 싶다. 시즌 전 리그 최상위권이라 여겨졌던 오라인의 멤버들은 거진 다 그대로 있고, 리시버에서도 제일런 와들 - 코틀랜드 서튼 조합은 꿇릴게 크게 없다. 데이비스 웹 공격코치의 플레이콜링이 문제라고 했는데, 오늘 게임에서는 그가 아니라 숀 페이튼(NFL 역대에 뽑힐 플레이콜러 라고도 할 수 있을 것이다.)이 플레이콜링을 다시 받았는데도 뭐가 크게 바뀌지 않았다. 이런 상황에서 왜이렇게까지 공격이 안풀리나... 정말 알기 어렵겠지만 굳이 두가지를 꼽자면, 우선적으로 너무나 소극적이다. 3rd &amp; 9에서 러닝을 한다던가, 3rd &amp; 7에서 4야드만 가는 패스를 던져놓고 4th다운에서 고포잇을 안하고 펀트를 하는 모습 등은 쿼터백에 대한 믿음이 없는건가? 라는 생각으로 까지 뻗치는데, 실제로 보 닉스는 이번 게임에서도 필드의 중앙 깊은 부분을 보지않고 짧은 패스로만 거의 일관하면서 소극적인 경기운영을 한층 더 강화했다.<\/p>","401872990":"<p>어지간히 입털더만 이게 베어스의 결과였다. 경기가 새벽이라 라이브로 보지못하고 아침에 눈뜨자마자 NFL ESPN 스코어보드를 올렸는데 짜증이 확 나면서 니네가 그렇지, 어지간히 오만하더만 이란 말이 저절로 입밖으로 나왔다.<\/p><p>백업 쿼터백을 가지고, 몇번의 승리를 거뒀다고 끝없이 거만해지더만 크게 한코 다쳤다. 이 팀이 그렇게 자신 할 수 있었던 이유는 1) 자신들의 러닝이 잘 먹히고 2)수비가 기대 이상으로 굉장히 좋은 모습을 보여주었기 때문인데, 이번 경기에서 2부분 다 한계가 보였다. 케일럽 윌리엄스가 빠진 순수 러닝만으로는 파괴력이 부족하고, 각종 지표에서 탑 5급 성적을 보여주던 수비는 역시나 극단의 과대평가 된 지표라는걸 보여주면서, 완벽히 무너져 내려버렸다.<\/p><p>패커스 입장에서는 자신들이 NFC 북부지구의 오랜 왕이라는걸 다시 한번 깨워주는, 팀의 사기 측면에서 정말 중요한 게임이었다고 본다. 패커스가 지난 해 플레이오프에서 당한 충격적인 역전패는 팀 전체를 무너뜨릴만했을 정도로 임팩트가 쎘고, 거기서 회복을 못한건지 홈인 램보필드에서 상대는 후보 쿼터백에 마이카파슨스라는 초특급 에이스(결국 안뛰긴했지만)가 돌아오는 게임임에도 원정팀인 베어스가 더 높은 배당을 받았을 정도로 궁지에 몰려있었다. 패커스가 홈에서 원정팀인 베어스보다 더 낮은 배당을 받은것은 2006년 이후 처음있는 일이었다... 하지만 이런 절망적인 평가를 완벽히 깨버리는 압승이었다고 본다. 특히 하늘 모르고 날던 벤 존슨 감독에게 패커스의 맷 르푸어 감독이 넌 NFC 북부지구 팀들을 상대로 2승 7패에 불과해 라는걸 깨우쳐준 게임이라고도 생각한다. 맷 르푸어는 참고로 NFC 북부 같은 지구 팀들 상대로 28승 16패이고 베어스 상대로는 13승 2패이다.<\/p><p>특히나 이번 게임에서 아주 좋았던 부분은 역시나 공격쪽의 패스 블로킹과 딥패스였다. 계속된 부상으로 전력에 큰 어려움을 느끼던 오라인에서도 적절한 조합을 잘 구상했는데, 4주차 이후로 쌕과 큐비 히트가 확연히 줄어들었다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">1주차<\/th><th class=\"r\">2주차<\/th><th class=\"r\">3주차<\/th><th class=\"r\">4주차<\/th><th class=\"r\">5주차<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">쌕<\/td><td class=\"r\">4<\/td><td class=\"r\">3<\/td><td class=\"r\">1<\/td><td class=\"r\">0<\/td><td class=\"r\">2<\/td><\/tr><tr><td class=\"l\">QB 히트<\/td><td class=\"r\">15<\/td><td class=\"r\">3<\/td><td class=\"r\">12<\/td><td class=\"r\">2<\/td><td class=\"r\">5<\/td><\/tr><\/tbody><\/table><\/div><p>이번 게임에서 특히나 인상적인 것은 바로 블리츠 대응이었다. 베어스의 수비는 굉장히 기회주의적인 수비인데, 평시 전력이 강하지 않지만 게임의 승부가 걸린 순간에 과감한 블리츠를 통해 기선을 제압하고 그렇게 생긴 상승세를 계속 이어나가면서 수비를 하는 구도의 팀이다. 하지만 이번 게임에서 베어스의 승부수는 모두 파훼당했다. 첫번재 왓슨의 터치다운에서 베어스는 더블 캣 블리츠라고 양쪽의 코너백들이 블리츠를 들어오는 굉장히 과감한 수를 던진다. 2선수비수인 코너백들의 블리츠는 파워가 약한만큼 스피드가 빠르고, 동시에 그들의 핵심 역할인 패스차단에 굉장히 큰 공백을 만들기 때문에 스냅이 되자마자 압박이 이뤄져야지만 그 가치가 있는 것이고 만약이 이 골든타임을 놓치면 상대 입장에서는 허허벌판에 패스를 하는 손쉬운 상황이 되는데, 패커스는 완벽한 대응으로 양쪽의 코너백들이 쿼터백의 근처에도 가지못하였다.<\/p><p><strong>*코너백 블리츠 플레이 - 423<\/strong>*<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/OKhJTY1Y990\" title=\"YouTube\"><\/iframe><\/div><p>이런 식으로 쿼터백의 보호에 자신감이 있었기에 패커스는 과감한 딥패스 전술로 이번 경기에 나왔다. 그들이 가진 선수진들은 이를 충분히 소화하고도 남을 선수들, 적어도 베어스의 수비상대로는 압도적으로 성공할 수 있는 선수들이라는 걸 보여주었다.<\/p><p>조던러브는 이번 게임에서 31번 던졌는데 그중에 23번이 비거리 10야드 이하의 패스였고, 10~20의 중거리는 1번, 나머지 8번은 모두 20야드 이상 딥패스(심지어 30야드 이상이 6번이었다...)만 던졌다. 즉 중거리 없이, 딥패스 각이 안나오면 체크다운, 스크린 패스 등 짧은 횡패스로 부족한 오라인에게 힘을 실어주었고, 딥패스에서는 환상적이었다. 8번의 딥패스에서 6번을 성공하면서 무려 258야드를 냈는데, 이 딥패스 야드가 이번시즌 전체 패커스의 딥패스 야드보다도 많았다. 분명한 컨셉을 가져온건데 후반 시작하자마자 공격권에서는 3번 내리 43야드, 43야드, 53야드 패스를 뿌려대는걸 보며 와 오늘 작정했구나 하는 생각이 들었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/_-BF1YtaoAY\" title=\"YouTube\"><\/iframe><\/div><p>그리고 오라인이 오늘처럼 버텨만 줄 수 있다면, 이런 전술을 수행하기 위해 최적의 선수들을 가지고 있다는 것 역시 보여주었다. 조던 러브의 장거리 패스 정확도는 리그에서 엘리트라고 부를 수 있는 상황에 부상에서 돌아온 크리스챤 왓슨은 본인이 탑 티어의 딥쓰렛이라는걸 온몸으로 보여주고 있다. 거기다가 작년에 다수의 선수들이 있어서 기회를 크게 부여받지 못한 매튜 골든은 크리스챤 왓슨의 반대편에서 본인도 그만큼 할 수 있는 인물이라는걸 보여주고 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">타겟<\/th><th class=\"r\">캐치<\/th><th class=\"r\">야드<\/th><th class=\"r\">TD<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">크리스챤 왓슨<\/td><td class=\"r\">8<\/td><td class=\"r\">6<\/td><td class=\"r\">143<\/td><td class=\"r\">2<\/td><\/tr><tr><td class=\"l\">매튜 골든<\/td><td class=\"r\">7<\/td><td class=\"r\">6<\/td><td class=\"r\">123<\/td><td class=\"r\">0<\/td><\/tr><\/tbody><\/table><\/div>","401872991":"<p>카디널스와 라이언스가 맞붙었는데 카디널스가 첫 공격권에서 꽤나 성공적이었다. 라이언스도 공격의 감을 못잡으며 대 반란이 나오나 싶었는데, 라이언스가 중간에 감을 잡고 자신들의 막강한 공격력을 선보이면서 카디널스를 상대로 오랜만에 압도적인 승리를 거뒀다.<\/p><p>라이언스의 공격에서 경기 양상의 변화를 가져온것, 즉 스파크를 튀긴 순간은 4TH 다운에서의 고포잇이었는데, 이번 게임 댄 캠블 감독은 4번의 고포잇을 시도해 4번을 다 성공(그 중 3번이 터치다운이었다)시켰고, 그 중에서도 첫 두번의 고포잇은 게임의 판세 자체를 바꿔버렸다. 두 플레이에서 모두 빅플레이를 해낸 것은 타이트엔드인 샘 라포르타 였다. 첫번째 플레이는 4TH &amp; 3 0-7의 상황에서 놓쳤다면 그대로 경기가 한쪽으로 쏠릴 만한 상황이었는데, 거기서 라포르타가 자기에게 수비가 붙은 상태로 기가 막힌 플레이를 보여주면서 기세를 쫙 올렸고, 이후 4TH다운은 7-7동점에, 갱신까지 1야드 남은 상황에서 타이트엔드 한명을 모션을 시켜서 그 선수에게 수비들의 시야가 쏠리게 하고는 그 뒷공간을 노리는 기가막힌 플레이로 갱신에 성공했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/5uGNQ2_3_dI\" title=\"YouTube\"><\/iframe><\/div><p>그리고 이렇게 기세를 탄 라이언스는 어마어마한 공격력을 선보이면서 게임을 끝내버렸다. 특히나 러닝게임은 어마어마한 수준이다. 나에게 지금 라이언스의 슈퍼스타 군단중에 명전자 한명을 뽑으라면 아마 페네이 스웰을 뽑지 싶다, 본인이 원래 뛰던 우측에서 좌측으로 포지션을 변경했는데 이제 슬슬 적응이 되어가는게 아닐까 싶을정도로 이번 게임에 어마어마한 블로킹들을 보여주었다. 그리고 그 뒤를 달리는 자미어 깁스도 괴물이다. 폭발력과 러닝은 이제 두말하면 입이 아픈 수준인데, 그가 프로에 와서 특히나 올해 팀의 1번 러닝백이자 대부분의 러닝을 소화해야하는 벨카우 러닝백이 된 상황에서 가장 눈에 띄는 성장은 파워풀함이다. 드래프트 되기 전인 대학시절만해도 그는 스피드와 제로백이 굉장히 좋은 선수라는 이야기는 많았지만 파워풀함이 부족해서 모든 다운에 쓸 수 있는가에 대해서는 의문이 있는 선수였다. 여기서 말한 파워풀함이란, 오라인 사이의 비좁은 공간에서 130Kg들의 팔태클들을 뿌리치면서 좁은 공간에서 뛸 수 있는가 + 패스 블로킹이 가능한가 두 가지정도로 요약이 될 수 있는데, 어쩌면 이와 유사한 평가 그리고 플레이스타일을 보이는 선수가 현재 페이트리어츠에 있는 트레비욘 헨더슨이다. 하지만 라이언스는 드래프트 픽을 트레이드 업해서 그를 1라운드 12번 픽에 뽑았고, 커리어 초반에는 위와 같은 파워가 필요한 플레이들에서는 데이비드 몽고메리에게 주고, 폭발력이 필요한 플레이에서는 자미어 깁스에게 내줬었는데, 이번 시즌에는 깁스에게 모든 스냅을 다 참여할 수 있는 벨카우 백으로서 입지를 내줬고 이게 대성하고 있다. 이번 시즌 보여주는 폭발력과 스피드는 당연하고, 그의 약점이라 평가받던 파워 부분에서도 굉장히 많은 발전이 있었는데 이제 정면 태클이 아닌 이상 그를 넘어뜨리기가 어렵다. 그것도, 제일런 워렌처럼 순간적인 사이드스탭이나 몸을 반즘 회전시키면서 빗겨내면서 스윽 미끄러지듯 태클을 피하는게 아니라, 그냥 폭발적인 스피드에서 나오는 파워로 기차가 뚫고 지나가듯 쌩하고 지나가버린다. 거기다가 패스 블로킹에서도 쇄도해들어오는 라인배커들을 기가막히게 막는 모습들을 매경기 보여주고 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/0AbaDIXkfpY\" title=\"YouTube\"><\/iframe><\/div><p>하지만 가장 놀라운 것은 수비가 괜찮았다는 것이다. 많은사람들이 벤 존슨이 떠난게 라이언스의 패인이라고 했는데, 정작 벤 존슨이 떠난 이번 시즌 라이언스의 득점은 1위다. 문제가 되는건 사실 그가 라이언스 시절 크게 관여하지 않은 수비다... 그리고 이번 게임 수비가 꽤 괜찮았다. 특히, 1선에서의 압박이 에이든 허친슨 말고 그의 반대편쪽에서 이뤄졌다는것은 매우 긍정적으로 볼만하다. 수비코치 캘빈 섀퍼드는 작년부터, 그 전임자인 애런글랜이 구축한 강력한 맨투맨 수비만 쓰는게 아니라 지역수비도 섞어쓰고 싶은건지, 경기마다 자신의 스킴을 바꾸려는 시도를 한번씩 하는데(자신 수비의 에이스라고 할 수 있는 세이프티 듀오가 부상으로 빠져서 그럴수도), 그게 그리 잘되고 있지 않다. 이번 게임에서는 애런 글랜때부터 써오던 맨투맨으로 바꿨는데 앞쪽에서 압박이 들어가면서 정말 오랜만에 괜찮은 수비를 보여주었다. 물론 상대가 카디널스인지라 안심하긴 이르지만, 그래도 숨구멍 정도는 뚫은 느낌이 난다.<\/p><p>카디널스 입장에서 보면 애매하다. 타이트엔드 맥브라이드는 괴물인것은 확실하다. 이번 게임 그가 보여준 터치다운은 뭐지? 잠깐 저게 타이트엔드라고? 싶을 정도의 슈퍼플레이였는데, 공이 손에 맞아서 튕겨 올라갔고 아웃라인을 등진 상태로 공 아웃이 안되기 위해 까치발을 한 상황에서 튕겨다니는 공을 잡아내는 집중력은 감탄만 나온다. 하지만 문제는 그뿐이라는 것이다. 그 외의 요소가 단단하기는 한데 스페셜하지 않다. 폭발적인 빅플레이가 리그에서 가장 적은 팀 중 하나인데, 이를 신임 감독 하에서 리빌딩인 팀의 어쩔수 없는 한계라고 봐야할지, 아니면 타이트엔드가 에이스인 팀에서 러닝백을 1라운드 상위픽에 뽑은 결과일지는....내년이 되어야 정확히 알 수 있을 것이다. 다행인 것은 프로에 와서 거의 보여준 것이 전무한 마빈 해리슨을 대학시절의 위명을 이용해 2라운드픽으로 트레이드한 것이 아닐까 싶다.<\/p>","401872992":"<p>이번주 최고의 강팀간의 대결이자 명경기가 나올 것으로 기대했는데 정말 재밌는 게임이었다. 하지만 뭔가 우리가 평소에 생각하는 재밌는 게임과는 굉장히 다른 게임이었다. 턴오버가 7개가 나오는 수비전으로 펼쳐지는 게임인데도 양팀의 득점은 60점이 넘게 나오는 묘한 게임이었다. 경기가 끝나고 신기해서 찾아보니 양팀 합쳐서 퍼스트 다운이 28번 뿐이었는데 양팀의 득점은 61점이나 나온 정말 기묘한 경기였다.<\/p><p>우선 승리한 49ERS부터 돌아보자. 사실 공격이 뜻대로 풀리지 않은 게임이었다. 경기 내내 269야드에 플레이당 4.8야드 밖에 안되었을 정도로 공격이 뜻대로 풀리지 않았음에도 불구하고, 결정적인 순간에 아주 좋았다. 3번의 레드존 방문에서 모두 터치다운을 성공했고, 턴오버 4개를 도합 24점으로 만들어내는 등 공격은 할 몫을 다했다. 리그 최고 티어 수비 상대로 이렇게 선전할 수 있었던 이유는 크게 두가지를 뽑을 수 있다. 우선 첫째는 러닝이다. 리그 제일이라고 할 수 있는 시호크스의 내곽 수비라인맨을 상대로 아주 호쾌한 러닝을 보여줬는데, 경기 전체는 총 94야드에 시도당 3.9야드에 불과했지만, 팀의 핵심 러닝백인 크리스챤 맥캐프리는 시도당 6.2야드에 달할정도로 굉장히 강력한 러닝게임을 보여주었다. 카일 섀너핸 감독이 지난 램즈전부터 시작해서 디비전내 왕좌를 노릴만한 강팀들 상대로 정말 칼을 단단히 갈고 왔고, 선수들에게 크게 동기부여를 한 것으로 보인다. 지난해 시호크스와 정규시즌에서 마주쳤을 때, 블로킹을 하는 선수와 수비측에서 박스에 있는 선수의 수가 동률일 때, 49ERS의 러닝 성공률은 17.6%, 25%에 불과했는데 이번 게임에서는 47.8%로 껑충 뛴 것이 그걸 보여주는 스탯 중에 하나이다. 특히나, 크리스챤 맥캐프리의 러닝에서는 11퍼스널로 마이크에반스를 마치 타이트엔드처럼 쓰면서 오라인으로 듀오로 상대를 밀어제끼는데 어... 시호크스가 이리 밀리는 선수들이 아닌데 싶었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/wTs4sYO2bIY\" title=\"YouTube\"><\/iframe><\/div><p>두번째 포인트는 마이크 에반스이다. 이번 시즌 카일 섀너핸은 기존과는 좀 다르다. 기존에는 처음부터 자신의 우월한 플레이 구상능력을 통해 경기 전에 짜온 플랜대로 게임을 쭉쭉 풀어나가면서 초반에 점수를 벌려서 4쿼터에는 승리를 굳히는 구도였는데(그 때문에 4쿼터에 너무 소극적이라는 비판도 있었다), 이번 시즌에는 그와 정반대이다. 이번 경기에서도 49ERS는 경기 초중반 거의 아무것도 못하다가, 마지막 2 공격권에서 기세를 살리면서 승리를 거뒀는데(총 10번의 공격권 중 마지막 2번의 공격권에서 이번 경기 전진야드의 58%가 나왔다), 이렇게 막판에 힘을 낼 수 있는 큰 이유 중 하나는 이번 오프시즌에 영입한 마이크 에반스 덕이라고 본다. 93년생으로 노장의 반열에 들어섰고, 이번 경기에는 심지어 갈비뼈가 골절인 상태로 출전을 했는데도 113야드 1터치다운이라는 어마어마한 활약을 했다. 마이크 에반스의 가장 큰 특징이라 하면 '그 혼자' 만으로 수비를 이길 수 있는 선수라는 점이다, 전술을 통해 오픈이 안 만들어진다고 해도, 그의 압도적인 제공능력은 1대1 상황에서 플레이를 만들 수 있다. 이는 곧 사전에 생각한 전술이 안 먹히기 시작하면 에반스에게 1대1을 만들고 던져준다는 옵션이 가능해진다는 뜻이다. 특히나, 이번 경기에서 가장 큰 분수령이 된 9번째 공격권, 49ERS의 공격이 거의 유일하게 통했던 공격권에서는 마이크 에반스만으로 갔다고 해도 될 정도이다. 49ERS는 16야드에서 시작해서 84야드를 갔는데 그중에 74야드가 에반스의 캐치였고 마지막으로 2포인트 컨버젼자체도 마이크 에반스의 캐치였다. 에반스의 이 강력한 1대1능력은 대 시호크스전을 준비해 데리고 온 것이라 해도 과언이 아니다(아래 영상의 4번째 플레이가 가장 대표적인 1대1 능력이 나온 플레이다). 작년에 49ERS는 시호크스와 맞붙을 때 두 군데서 약점이 있었다. 하나는 숏야디지 즉 갱신까지 얼마 안남은 상황에서의 플레이, 그리고 골라인, 역시나 터치다운 까지 얼마 남지 않은 상황의 플레이가 약점이었다. 이런 플레이에서는 수비의 공간이 확연히 줄어들기 때문에 공격이 이길 수 있는 방법은 선수들의 진로방향을 꼬면서 혼란을 유도해서 빠른 패스로 플레이를 성공하거나, 아니면 힘으로 러닝을 하거나, 1대1로 이길 수 있는 리시버/타이트엔드가 수비 상대로 승리를 하는 것이다. 아쉽게, 시호크스와 같은 수비 강팀에게 앞의 두가지 방법으로 승리하긴 어려워서 마지막 수단으로 그를 데리고 온것이다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/5DMf_RS8r68\" title=\"YouTube\"><\/iframe><\/div><p>하지만 이번 경기 가장 찬사를 많이 받아야할 부분은 49ers의 수비다. 49ers의 공격은 슈퍼스타들이 집결되어 있는데, 수비쪽에서는 프레드 워너 말고는 없다고 해도 과언이 아니다. 그럼에도 턴오버를 계속 만들면서 이번 게임의 가장 큰 공훈자가 되었다고 할 수 있는데, 우선 짚고 넘어갈것부터 짚고 넘어가자. 프레드 워너는 아예 궤가 다른 선수이다. 격투기를 좋아하는 지인이 쟤는 격투기를 했어도 되겠다고 말할정도로 피넛 펀치, 즉 정권을 질러서 펌블을 만드는 능력은 이번 게임에서도 굉장히 중요한 변수 중 하나였고, 경기 전반적으로 시호크스의 러닝을 완전히 끊어버리는데 굉장히 중요한 역할을 했다. 현시점 NFL에서 동포지션 1위인 선수가 2위인 선수와 가장 격차가 큰 선수가 누구냐하면 프레드 워너이고, 그냥 한두티어 차이나는 느낌도 아니고 2위 선수들과 3~4티어는 차이나는 느낌이 든다. 여기에 1선 수비들도 굉장히 잘해주었다. 이번 게임 샘다놀드는 오랜만에 귀신(다놀드는 과거 수비의 압박이 너무 거세져서 수비의 귀신이 보인다고 했었다)들을 다시 보았는데, 그만큼 49ERS의 1선 수비는 아주 거셌다. 재밌는 점은 49ERS의 1선 수비는 지금 루키 2명(그것도 4라운드, 5라운드픽) + 올해 오프시즌에 큰 돈 주지 않고 데리고 온 오사 오디기주와로 구성된 스타가 없는 선수들임에도 불구하고 이런 성적을 거뒀다는 것이다. 드미코 라이언스 수비코치가 감독으로는 좋지 않았지만 수비코치로서는 확실히 재능이 있다는 생각이 들게 하는 순간이었다. 49ERS팬들은 특히나 그레이스 홀튼과 오사 오디기주와를 집중해서 보면 좋을 것 같다. 이번게임 굉장히 좋은 플레이를 보였는데, 이 팀 수비의 가장 큰 약점 중 하나인 닉보사가 없을 때의 1선수비인데, 이제 그들이 그 약점을 책임져야하하기에 이 추세가 계속되는지 볼 필요가 있다.<\/p><p>또 하나 언급해야할 것은 2개의 인터셉션을 기록한 르나르도 그린이다. 이번 오프시즌에 그의 동포지션에 선수를 영입하면서 주전자리가 위협받는게 아닐까 싶었는데, 그게 오히려 자극이 되었는지 이번게임에서 굉장히 좋은 모습을 보여주었다. 특히나, 사전에 경기준비를 정말 열심히한 티가 났고 지능적으로 플레이가 했다. 첫번째 플레이에서는 JSN이 모션을 타고 이 모션의 가속을 이용해서 달리는걸 보고, 이런 경우에 아웃 즉 밖으로 빠져나가는 플레이가 많다는 걸 미리 파악한듯 그쪽으로 몸을 살짝 열어놓고 있는 동시에, 이 플레이가 지금 3RD 다운 상황이라 1ST다운 상황 위치까지 던질 것이라는 걸 정확히 읽고 딱 그 언저리에 위치해 있다. 이러다보니 JSN이 방향을 밖으로 꺾었을 때, 마치 기다렸다는 듯이 튀어나가서 인터셉션을 만들었다. 두 번재 플레이에서도 굉장히 스마트했는데, 쿠퍼컵이 모션으로 반대쪽으로 움직이는데 르나르도 그린은 이걸 따라가지 않는다. 이는 샘다놀드에게 '어 지역수비구나' 라고 생각하게 강력한 힌트를 주는 행동인데, 사실 49ERS는 지역수비가 아니라 맨투맨의 플레이였다. 그리고 샘다놀드는 플레이액션으로 등을 돌려있었기 때문에 수비의 전술이 바뀐걸 파악하는데 조금 더 시간이 걸리게 되는 상황이었고, 타이트엔드와 매치업인걸 알고 있던 르나르도 그린은 일부러 함정을 판다. 타이트엔드가 필드를 가로지르는 루트인걸 확인하고는 타이트엔드와 스피드 대결에서 질 일이 없기 때문에 일부러 반타이밍 정도 늦게 따라간다. 이 플레이는 샘다놀드 입장에서 어어? 지역이 아니라 맨이야? 하는 당혹감에 이어 어 저기 열린 선수있다! 라는 확신을 금방 유도했고, 그린은 바로 부스터를 키면서 인터셉션을 만들어버렸다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/lJkgcsjNkx0\" title=\"YouTube\"><\/iframe><\/div><p>시호크스 입장에서는 아쉬움이 드는 게임일 것이다. 마지막 쿠퍼컵의 플레이가 갱신으로 잡혔다면! 이라는 아쉬움이 남긴 할건데, 그만큼 어떤 순간의 어떤 플레이든 한개만 자기들의 쪽으로 더 갔어도 승리를 했을 만한 박빙의 경기였다. 그만큼 시호크스의 게임은 인상적이었고 특히나 수비가 강력했다. 이번 시즌 적수가 없는 듯한 49ERS의 공격을 마지막 2번 공격권에서 마이크 에반스가 폭주하기 전까지 8번의 공격권에서 단 100야드 정도만을 허용하는 철통같은 수비를 보여서, 앞으로 뭐 크게 걱정할 것은 없어보인다. 걱정되는 점을 뽑으라면 역시 공격이다. 샘다놀드는 원래 변동성이 굉장히 높은 쿼터백이다, 전년도에도 슈퍼볼을 우승할 때도 리그에서 가장 많은 턴오버를 당한 쿼터백이 바로 샘다놀드였을 정도인데, 이를 진정한다고 해야할까 보완하는 포인트는 크게 2개였다. 첫째는 러닝이었다. 특히나 작년 시즌 후반부 케네쓰 워커가 본격적으로 각성하기 시작하면서 시호크스의 공격이 한층 저점이 높아졌었다. 두번째는 폭발적 패싱이다. 수비를 읽는 스타일이나 성취는 다를 수 있으나 순수 패스 비거리 기호로 놓고 보자면 샘 다놀드는 드레이크 메이와 유사하다고 할 정도로 빅패스를 좋아하고 실제로 빅패스를 잘하는 선수다. 다만 이번 시즌에는 이 두가지 요소가 모두 흔들리고 있다. 케네쓰 워커의 빈자리를 메꿔줄거라고 기대한 러닝백들이 모두 부상으로 빠지면서 러닝게임이 아예 실종해버렸고(이번 게임 시도당 3.1야드였다) 패스당 비거리 7.7야드 (2위)는 6.5야드 (16위)로 떨어졌는데, JSN외의 다른 선수가 아직 밥값을 하지 못하고 있다는 점은 이 부분의 위급성을 더 크게 느끼게 한다. 물론 그렇다해도 수비가 워낙 강한팀이라 러닝백들이 돌아오기 시작하면 괜찮지 않을까 싶긴하다. 하지만, 그럼에도 슈퍼볼 챔피언들이기에 그 기준에 맞춰서 이 부분을 좀 더 주의깊게 봐야할 필요는 있다<\/p>","401872993":"<p>최근 강력한 상승세의 애틀랜타 팰컨스와 후보 쿼터백이 나온 볼티모어 레이븐스간의 매치업이었는데 연장까지 가는 승부였는데 꽤나 치열하게 오가던 플레이에서 레이븐스의 백업 쿼터백인 타일러 헌틀리가 분전해주었고, 팰컨스의 후보 쿼터백 투아의 공을 카일 해밀턴이 인터셉션하면서 레이븐스의 승리로 경기가 끝났다.<\/p><p>레이븐스의 공격 측면에서 인상적인 부분이 꽤 있었다. 개인적으로 올해 레이븐스의 공격력은 상당히 인상적이라, 신임 공격코치인 데클란 도일이 굉장히 잘하고 있다고 생각했다. 라마잭슨의 플레이는 MVP 시즌보다 더 좋았고, 그 외의 각 선수들 모두 자신들의 롤이 있는듯이 기가막히게 움직이는걸 볼 수 있었는데, 이게 과연 데클란 도일의 덕인지 아니면 라마잭슨의 효과인지 정확히 구분하지 못하고 있었다. 그리고 이번 게임을 통해서 다음 빅네임 공격코치는 데클란 도일이 되겠구나 라는 생각이 들었다. 백업 쿼터백이 들어갈 때 팀의 공격력이 정상이긴 어렵다. 특히나, 라마 잭슨 급의 쿼터백이 빠지면 더욱 더 그럴리 없다. 하지만 그럼에도 분명한 컨셉이 있었고, 자기들이 갖고 있는 자원에서 최선의 공격을 선보였다고 생각한다.<\/p><p>데릭헨리를 기반으로 공격 전술을 짰는데, 데릭 헨리는 이번 경기에서 24번의 러닝시도 102야드 시도당 4.3야드를 기록했다. 스페셜한 날은 아니었지만, 팀 전체적으로 러닝을 패싱만큼, 꾸준히 러닝을 하면서 상대의 수비를 크게 지치게 했다. 특히나 경기 중간에 3rd &amp; 5에서 상대의 수비가 패스 하겠네 라고 예상해서 1선에 선수를 넓게 펼친 전술로 나오니까 어쭈하고는 투박하기 그지 없는 한가운데 러닝으로 갖다 박는 장면은 그가 작년까지 속했던 시카고 베어스의 벤 존슨이 정말 많이 하던 플레이였는데, 그 영향을 받은게 확실히 느껴졌다. 개인적으로 이런 투박한 자신의 강점에 기댄 러닝 플레이들이 비록 성공을 하지 못한다 하더라도 수비측에 굉장히 강한 인상을 준다고 본다(이 외에도 팀의 에이스 리시버인 제이 플라워스에게 게임 시작하자마자 러닝으로 공을 주는데, 이게 게임의 후반에 잔상을 남기는걸 볼 수 있다). 그리고 이런 플레이들이 밑밥이 되면서 기회가 왔을 때 창의적인 플레이로 승부수 빅플레이를 성사되게 해주는데, 이번 게임에서 레이븐스는 이런 승부수를 몇번 띄웠다. 물론 이 승부수들이 모두 성공한건 아니다. 하지만, 아직 신임 공격코치이고 시즌이 이르다는 점, 그리고 후보들이 필드에서 뛰고 있었다는 걸 감안도 해야한다. 대표적으로 제이플라워스를 쿼터백 삼았던 플레이는 실패했지만 타일러 헌틀리는 완벽히 오픈이었고, 그 다음 스크린 패스에서도 패스가 연결은 안되었지만 연결만 되었다면 엄청난 빅플레이로 이어졌을 것이다. 그리고 성공한 플레이들도 있다. 이번 게임 가장 빅플레이였던 저스티스 힐의 빅플레이는 데릭헨리를 밖으로 빼면서 라인배커들이 모두 그쪽으로 쏠리게 하고는, 빠른 타이밍에 풀백에 있던 저스티스 힐에게 공을 건네주고 무주공산을 저스티스 힐이 달리며 나온 것이었다. 그 다음에 데릭헨리의 스크린 패스에서는 플레이가 시작되면 가드를 풀링하면서 러닝페이크를 주는데, 정석 러닝에서 러닝 방향에 대한 가장 큰 움직임이 바로 가드의 풀링이다. 여기다가 제이플라워스를 리시버 자리에서 풀링한 가드의 방향으로 움직이면서 마치 러닝을 받을 수 있다는듯 액션을 취한다. 경기의 시작에서 제이플라워스의 13야드 러닝으로 게임을 열었던 기억이 있는 수비진은 이에 반응해서 우측으로 움직이게 되고, 그에 따라 데릭헨리가 스크린 플레이에서 오픈이 된다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/uE1RbWmmhC8\" title=\"YouTube\"><\/iframe><\/div><p>수비쪽에서도 조금씩 폼이 올라오는 느낌이 난다. 지난 게임까지 벽도 뚫고 지나갈 듯한 포스를 보이던 팰컨스의 러닝을 시도당 4.2야드에 100야드 간신히 넘는 수준으로 제압을 했고, 압박도 꽤나 했다. 특히나, 1선에서 중심을 잡아줘야할 에이스인 남두비케가 프로볼에 뽑혔던 시절의 폼이 조금씩 나오기 시작했다는게 굉장히 고무적이다. 2선 수비 쪽에서는 여전히 숙제가 꽤나 있는 느낌이었지만, 그래도 게임을 마무리 지었던 것은 레이븐스의 에이스 카일 해밀턴의 인터셉션이었다. 특히나, 경기 끝나고 말론 험프리 인터뷰가 기억에 남는다. 투아가 교체해서 들어오는 걸 보고 카일 해밀턴이 잔뜩 신난 모습으로 투아가 들어온다 투아가 들어온다! 나에게 공을 줄거야! 하고 팀원들에게 이야기했는데 실제로 그리 해냈다고 대단하다고 했었는데, 카일 해밀턴이 단순 피지컬을 넘어 게임에 대한 공부도 딥하게 한다는걸 보여준 일화라고 생각한다.<\/p><p>팰컨스 입장에서는 아쉬움이 들 경기다. 비쟌 로빈슨이 오랜만에 100야드 언더, 86야드로 제한이 된 상황에서 패스게임으로 경기를 풀어냈어야 했는데, 패스가 괜찮았다. 특히나 쿼터백 마이클 페닉스 주니어는 자신의 가치를 보여줬다고 본다. 자신의 주특기인 빅패스를 계속해서 연결하면서 필드를 전진했다. 드레이크 런던과 강력한 커넥션을 계속 이어나가며, 특히나 17번의 써드다운 중에 9번을 갱신하면서 자신의 가치를 보여주었다. 전체적으로 주전 쿼터백이라고 불리기엔 충분한 퍼포먼스라고 생각한다. 하지만, 1라운드 쿼터백에게, 그리고 팰컨스 팬들이 원하는 건 그 이상일건데, 이 선수 역시 이번 주 이글스의 제일런 허츠와 마찬가지로 내곽 깊은 지역 패스를 좀만 더 강화하면 충분히 임팩트를 낼만한 선수라고 생각이 든다. 본인도 이를 아는 듯, 경기 첫 플레이에서 내곽 깊은쪽 패스를 한번 노리는데, 그게 수비에게 인터셉션 당할뻔한걸 본 뒤로 4쿼터 (4쿼터에 내곽 깊은지역 패스 1회)가 될 때까지 그쪽 지역은 아예 쳐다보지도 않았다. 만약에 이 부분을 개선하면 꽤나 그의 이름을 계속 부르게 될 일이 생길 것으로 보인다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/idJ6_SFkuDI\" title=\"YouTube\"><\/iframe><\/div>","401872994":"<p>현시점 NFL 에서 탑 5안에 들 두 팀, 거기다가, 각자 NFC AFC를 대표해서 슈퍼볼에서 만날 가능성도 높은 두 팀간의 프라임타임 게임이었는데, 그만큼 마지막의 마지막까지 알 수 없었던 접전 끝에 37-34로 빌스가 승리를 했다. 하지만 경기내용은 굉장히 신박했는데, 조쉬알렌이 패스를 단 12번 성공했음에도 불구하고, 37점을 득점하면서 승리한 경기였다.<\/p><p>그렇다면, 조쉬알렌이 단 12번을 패스하면서 도데체 빌스는 어떻게 승리한 것일까? 전술적으로 굉장히 정교한 설계가 있었다. 하지만 이 전술적 설계를 다루기 전에 우선 조쉬알렌은 미친놈이라는걸 먼저 말하고 싶다. 하얀 캠 뉴튼이라는 농담이 있을 정도인데, 이번 경기가 가장 그 별명에 어울리는 플레이였다. 아니, 캠뉴튼이 정말 좋은 선수였지만, 조쉬 알렌은 그를 아득히 초월하는 선수이기에 이제 그만의 영역에 들어갔다고 볼 수 있을 것이다. NFL 역사상 가장 위대한 듀얼 쓰렛은 조쉬 알렌 아니면 라마 잭슨인게 확실하다.  아니 최근에 라마잭슨이 좀 더 패스에 힘을 주고 있으므로 이 그야말로 무식한 망치와 같은 러닝으로 무장한 조쉬알렌이 최고일 수도 있을 것 같다, 심지어 부상도 안당한다... 물론 이번 게임을 보고 그에 취해서 나온 말일 수 있겠지만, 그만큼 이번 게임은 전술이고 뭐고... 알렌에게 감탄만 나오는 경기였다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/hohGYprcjSU\" title=\"YouTube\"><\/iframe><\/div><p>하지만 이렇게 까지 조쉬 알렌이 미쳐 날뛸 수 있었던 + 러싱야드로 230야드 가까이 할 수 있었던 데는 굉장히 치밀한 전략적 설계가 있었다. 조 브래디 감독은 램즈의 게임을 정말 면밀히 분석했고, 램즈의 경향성에 대해 굉장히 치밀하게 분석했다. 그 중에 가장 대표적인 것이 공격이 11퍼스널, 즉 1명의 러닝백, 1명의 타이트엔드, 그리고 3명의 리시버로 나온 경우 램즈는 다임 패키지라고 해서 2선 수비를 6명 넣는 수비로 대응하는 경향이 있다는 것이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">11퍼스널일 때 니켈 (2선수비 5명 비중)<\/th><th class=\"r\">11퍼스널일 때 다임 (2선수비 6명 비중)<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">리그 평균<\/td><td class=\"r\">82%<\/td><td class=\"r\">12%<\/td><\/tr><tr><td class=\"l\">25 시즌 램즈<\/td><td class=\"r\">54%<\/td><td class=\"r\">45%<\/td><\/tr><tr><td class=\"l\">26 시즌 램즈<\/td><td class=\"r\">39%<\/td><td class=\"r\">60%<\/td><\/tr><\/tbody><\/table><\/div><p>이번 게임 첫 드라이브에 빌스의 조 브래디 감독은 자신들의 가설이 맞는지 확인하기 위해 11퍼스널을 한번 넣는데, 상대가 다임 패키지로 나오는 것을 확인한다. 다임 패키지의 가장 큰 약점은 2선 수비수가 6명 (가장 정석적인 수는 4명이다) 이 있다보니, 자연스래 무게 싸움에서 밀리게 되고 그만큼 러닝 게임에 취약한 것이다. 그리고 이게 대성공을 거뒀다. 빌스는 이번 경기 내내 12번의 11퍼스널을 들고 나왔는데, 램스는 이 모든 스냅에 정확히 빌스가 예측한대로 다임으로 대응했다. 심지어 경기 시작하고, 빌스는 11퍼스널로 나온 12번의 스냅에서 단 한번의 쌕을 제외하고는 모두 러닝 혹은 준 러닝 플레이라고 봐도 되는 스크린 패스로 나간다. 그 뒤로도 패스 대부분이 스크린 패스였고, 러닝으로 갈아버리는데 그야말로 야 너네 러닝 못막는 선수진으로 나올거자나 라는걸 예측하고는 그 약점을 후벼파는 플레이를 펼쳤고, 램즈는 경기가 끝날때까지 이에 대한 적절한 대응을 내놓기보다는 우리가 틀리지 않았다로 일관했다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">총 스냅 수<\/th><th class=\"r\">상대가 다임 패키지<\/th><th class=\"r\">총야드<\/th><th class=\"r\">시도 당 야드<\/th><th class=\"r\">15야드+ 플레이<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">11 퍼스널  패스<\/td><td class=\"r\">12<\/td><td class=\"r\">12<\/td><td class=\"r\">101<\/td><td class=\"r\">8.4<\/td><td class=\"r\">3<\/td><\/tr><tr><td class=\"l\">11 퍼스널 러닝 (알렌 제외)<\/td><td class=\"r\">12<\/td><td class=\"r\">12<\/td><td class=\"r\">73<\/td><td class=\"r\">6.1<\/td><td class=\"r\">3<\/td><\/tr><tr><td class=\"l\">11 퍼스널 스크램블링 (조쉬알렌 러닝)<\/td><td class=\"r\">5<\/td><td class=\"r\">5<\/td><td class=\"r\">69<\/td><td class=\"r\">13.8<\/td><td class=\"r\">3<\/td><\/tr><\/tbody><\/table><\/div><p>이 외에 또 하나 빌스의 감독 코치진이 램즈 감독 코치진과 수싸움에서 크게 승리한 것은 바로 램즈의 수비 전술 경향성에 대한 파악이다. 지난 해 램즈는 리그에서 가장 지역 수비를 좋아하는 팀 중 하나였지만, 이번 시즌 트렌트 맥더피와 제일런 왓슨이라는 코너백 듀오를 영입하고는 이들의 장기를 살리기 위해 굉장히 맨마킹에 치중한 게임을 치루고 있었다. 맨투맨 수비를 하지 않는다고 해도 쿼터스라고 지역수비지만 맨마킹의 요소가 굉장히 짙게 밴 수비를 많이 썼는데, 이 전술들의 가장 큰 약점은 바로 쿼터백의 러싱에 취약한 것이다. 아래 영상을 보면 알 수 있겠지만, 쿼터스에서는 최후방 2인과 양쪽의 코너백들이 뒤로 물러나면서 지역 수비를 한다, 단 양쪽의 코너백들은 양 끝을 지역수비한다고 하지만, 사실은 그쪽 리시버가 좀 깊게 달리면 맨투맨의 형태가 된다. 이번 시즌에 영입한 트렌트 맥더피와 제일런 왓슨의 장기(1대1)를 활용할 수 있기 때문에 램즈는 쿼터스를 정말 자주 썼다. 그리고, 쿼터스에서는 4명의 2선수비 앞에 라인배커 3명 중 양쪽의 두 명은 양옆으로 갈라지면서 외곽의 짧은 지역수비를 한다. 그렇게 되면, 필드의 중앙을 지키는 선수는 중앙 라인배커 밖에 없게 되고 쿼터백의 스크램블링에 취약해진다. 역시나 쿼터스를 주력으로 쓰는 휴스턴 텍산스가 작년 절정의 포스를 뽐내던 시기에도 유일한 약점이 쿼터백의 러싱, 즉 스크램블링이었던것도 이런 전술적 한계에서 오는 것이다. 빌스의 감독 코치진은 이 경향성을 파악했고, 쿼터스 상황에서 조쉬 알렌에게 러닝을 주문했고, 이번 게임 알렌의 빅러싱은 대부분 쿼터스에서 나왔다. 거기다가 램즈는 맨투맨으로 나올 때도 있었는데, 맨투맨에서는 중앙 미들라인배커에게 스파이 역할, 한 가운데서 쿼터백을 지켜보면서 그가 패스를 안하고 달리려고 튀어나가면 그를 제압하는 역할을 맡기고 나머지는 모두 맨투맨으로 붙이는 전술을 사용했다. 어떻게 보면, 쿼터백의 러싱에 수비수 하나를 배정했으니까 좋아 스크램블링은 해결! 이라고 치부할 수 있는데, 문제는 상대가 조쉬 알렌이라는 점이다. 미들 라인배커인 네이트 랜드맨이 좋은 라인배커에 이번 게임에서도 펌블을 두번이나 만들어냈지만, 아무리 그래도 조쉬 알렌을 상대하기엔 역부족이었고, 이 부분을 지속적으로 공략하는 빌스의 공격에 대해 램즈는 별다른 조치를 취하지 않았다, 조쉬 알렌의 스크램블링은 4쿼터에 가장 많았다...<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/04EybtB5cI0\" title=\"YouTube\"><\/iframe><\/div><p>전체적으로 램즈의 코치진이 경기 중 상대의 전술에 대해 대응과 조치를 하기보다는 우리는 틀리지 않았다라는 마인드로 접근을 했는데, 이는 수비만이 아닌 공격쪽에서도 꽤 있었다. 램즈의 스페셜팀은 지난 몇 년간 램즈의 고질적인 약점으로 작용했는데, 이번 게임에서도 여전했다. 시작부터 킥오프에서 70야드 리턴을 내줬고, 필드골을 1쿼터에 실축했을 뿐만 아니라 연장전에서 필드골을 블록까지 당하면서 최악의 모습을 보여줬다. 문제는 자신들의 스페셜팀이 잘 안풀리는 와중에도 계속해서 킥을 찼다는 점이다. 빌스의 수비는 1선은 상당히 괜찮은데, 2선 수비는 현재 재앙에 가깝다. 이번 경기 내내 빌스는 어떻게서든 푸카나쿠아를 막으려고 노력했는데, 푸카 나쿠아는 24타겟 17번의 캐치에 138야드 1터치다운을 기록했다. 특히나, 매튜 스태포드가 샷건에 있을 때 나쿠아에게 가는 짧은 패스는 아예 막을 수 없을 정도였다고 봐도 된다. 하지만 연장전 써드다운 가장 중요한 상황, 마지막 공격권에서 이번 게임 귀신같이 먹히던 이 샷건 나쿠아 패스 플레이를 선택하지 않고 러닝을 선택한건 좀 두고두고 아쉽다.<\/p>","401872996":"<p>지난주 정도쯤부터, 텍산스의 공격이 폼이 오르고 있다고 이야기했었는데, 강적 재규어스를 만나면서 공수 양쪽에서 경쟁력있는 모습을 선보였고, 결국 텍산스의 승리로 마무리되었다. 아마 금주 최고의 게임이 아니었을까 싶다.<\/p><p>이 게임을 보고 가장 처음 든 생각은 CJ 스트라우드였다. 이번 시즌 오라인이 붕괴되는 와중에 폼이 좋다, 생각보다 잘한다 라는 말을 계속했었고, 특히 지난 주 자신의 단짝이자 에이스 리시버인 니코 콜린스가 돌아오면서 폼이 엄청 올라왔다 라고 했는데, 재규어스의 강한 수비 상대로 이런 모습이 또 나왔다. 2차스탯이 굉장히 극명하게 이 퍼포먼스를 드러낸다고 생각하는데, CPOE(기대 대비 완성률) 측면에서 그는 +12.8%를 기록했다. 이는 자신의 커리어 4번째이기도 하고 특히 10야드 이상의 패스에서는 무려 +26.7%의 어마어마하게 높은 성공률을 보였다. 신인시절 보여주던 장거리 패스에서의 압도적 정확도는 이번 게임에서도 여지없이 드러났고, 무엇보다 지난 2~3경기동안 가장 크게 드러나는 것은 블리츠에 대한 대응이다. 핫 루트라고 하는데, 블리츠가 들어오게되면 그 블리츠가 들어오는 선수쪽의 루트를 타는 선수는 자기 쿼터백이 위급한걸 깨닫고 곧바로 뒤를 돌아야하고, 쿼터백도 이 블리츠를 파악해서 바로 공을 던져야한다. 이걸 핫 리드 라고도 부르는데, 와.. 이 경지가 정말 엄청나게 높은 수준에 이르렀다고 생각한다. 텍산스의 오라인이 리그 최약체 수준이기 때문에, 이를 공략하기 위해 재규어스는 굉장히 공격적으로 블리츠를 보냈었는데, 그 블리츠를 보낼때마다 CJ 스트라우드가 정답을 내는 모습이 이번 게임에서나 역시 나왔다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/jA-gWGThtHo\" title=\"YouTube\"><\/iframe><\/div><p>왜 갑자기 이번시즌 들어 CJ 스트라우드는 잘해졌고, 텍산스의 공격이 좋아지기 시작한걸까? 작년에 비해 오라인은 여전히 리그 최약체 수준이고, 러닝도 리그 최하위권 수준인데, CJ 스트라우드의 계약 년도가 왔고, 니코 콜린스의 복귀의 영향일까? 이도 분명히 사실이겠지만 전술적으로도 텍산스측에서 의사결정이 있었던 것으로 보인다. 텍산스의 닉 케일리 공격코치는 멕베이 - 섀너핸 계열이다. 즉, 언더센터에서 러닝을 기반으로 운영하는데, 러닝이 먹히는 것과 안먹히는 것과 관계없이 러닝이 주공이라는 걸 수비에게 심어놓고 플레이를 설계하는 것이 컨셉인데, 문제는 텍산스의 러닝이 안먹혀도 너무 안먹힌것이다.... 그러다보니 닉 케일리는 팀의 공격 컨셉을 크게 바꿨다. 스프레드 샷건 오펜스 즉, 러닝을 어느정도 포기해도 리시버들을 넓게 펼쳐서 상대 수비가 필드 전면을 수비하게 하고, 쿼터백의 역량에 기댄 플레이 컨셉으로 바꾼것인데, 이게 무리하게 러닝(그럼에도 러닝은 분명히 필요한데 이번게임에서 오라인을 6명 넣는 전술로 이를 극복하려했고, 이게 나름 먹혔다)을 하는것보다 폼이 잔뜩 올라온 CJ 스트라우드와 굉장히 잘 맞아떨어졌다(물론, 닭과 달걀처럼 이 전술 전환이 스트라우드의 상승세의 요인이 되었을 수도 있다.) 세부적으로 보면 전년도에 언더센터 비중이 꽤나 높던 부분들, 섀너핸-멕베이 계열의 러닝이 우선이 되는 전술 컨셉이었다면 언더센터를 플레이할 상황들에서 샷건의 비중이 확연이 늘었다는 것을 확인할 수 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">1st 다운<\/th><th class=\"r\">2nd &amp; short (3야드 이내)<\/th><th class=\"r\">2nd &amp; medium (3~7)<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">25시즌 샷건 비중<\/td><td class=\"r\">21위<\/td><td class=\"r\">21위<\/td><td class=\"r\">22위<\/td><\/tr><tr><td class=\"l\">26시즌 샷건 비중<\/td><td class=\"r\">5위<\/td><td class=\"r\">8위<\/td><td class=\"r\">9위<\/td><\/tr><\/tbody><\/table><\/div><p>텍산스의 수비의 경우, 지난 경기부터 계속 언급되던 중앙(미들라인배커-세이프티)의 문제가 또 한번 드러났다. 우리는 수비로만 우승을 해야하는 팀이라면 걱정이 될 부분이긴하지만, 엄격히 말하면 워낙 강팀들과 상대하고 있어서 라고 볼 수 있다. 이번 경기 잭슨빌 재규어스의 공격력또한 그랬다.<\/p><p>포메이션적으로 보면, 다수의 타이트엔드를 출전하는 전술을 써서 상대에게 라인배커 3명인 전술을 강요했고, 그 중에서도 번치 포메이션(선수들을 여려명 뭉쳐서 도열)을 많이 쓰면서 모션을 통해서 3명의 라인배커를 굉장히 잘 공략했었다. 경기 전반적으로 자신들의 에이스인 파커 워싱턴에게 몇번의 패스들이 정말 간발의 차로 미스되거나, 못잡아서 떨어지거나 그랬는데, 이것들을 제외하고도 306야드에 4터치다운이었으니, 이것들이 만약 풀렸다면 훨씬 더 강력했을 것이다.<\/p><p>러닝 성적이 어떻게 보면 더욱 더 놀라운데, 텍산스의 막강한 1선을 상대로 러닝에서 굉장히 좋은 모습을 보였다.재규어스의 약점이 오라인이었기에 이번 게임 들어가면서 가장 주의깊게 볼 포인트라고 생각했는데, 텍사늣가 이번 시즌 상대했던 팀들 중에 러닝에서 가장 좋은 모습을 보여주었다. 특히나, 본인들의 약점이라고 할 수 있고, 지난 게임 이글스한테 정말 영혼까지 털린 내곽 러닝들이 아주 잘먹혔다는건, 이 팀이 공격쪽에 상당히 클래스가 있는걸 느낄 수 있었다.<\/p><p>수비쪽에서도 말하고 싶은 바가 있는데, 트래비스 헌터이다. 1라운드 2번픽에 뽑혔던 선수에, 많은 값을 지불하고 트레이드해서 데리고 온 픽이었던만큼 그에 대한 기대는 어마어마했는데, 첫 시즌에 공수 양쪽에서 모두 뛰려고 하다가 이도 저도 못하는 모습이 나오면서 아쉬움이 나왔었다. 하지만 올해는 달라보인다. 일단 이번 경기에서 공격 터치다운과 인터셉션을 성공했는데, 2002년 이후로 처음이다. 심지어 2002년 브라이언 도킨스가 했던 터치다운은 페이크 펀트에서 나온 변칙성 플레이라는 걸 생각했을 때 이 기록이 갖는 의미는 더욱 특별하다.<\/p><p>이번 게임에서 여러번 공격에 뛰었는데, 첫번째, 두번째 플레이가 특히나 기억이난다. 첫번째에서는 그의 스피드가 얼마나 따른지 알 수 있는데, 헌터의 움직임이 너무 빨라서, 오히려 템포가 꼬이는 스피드가 기억에 남고, 두번째 플레이를보면, 초이스 루트다. 슬롯이나 백필드에있는 선수, 이 경우는 3가지 옵션이 주어진다. 바깥으로 쭉 달리는 루트 그리고 두번째는 멈췄다가 안쪽으로 45도 각도로 꺾어 들어가는거다. 마지막은 잘 안쓰긴하는데 그자리에 그대로 멈추는 경우인데, 자신을 담당하는 수비가 안쪽에 있는지 바깥에 있는지에 따라 달릴 루트를 정한다라고 해서 초이스 루트라고 부른다. 이 전술에서 가장 빅플레이는 상대가 최후방에 2명인 전술로 나올 때 안쪽인 루트를 탈때 나온다. 왜냐하면 그대로 가속을 받은 상태로 최후방 2명을 가로지르면서 달리기 때문인데, 재규어스의 전술도 기가 막혔다. 재규어스는 13 퍼스널 즉 러닝백 하나에 타이트엔드 3명, 리시버 1명의 전술로 나오는데 그러다보니 상대 수비도 늘어난 중량에 대응하기 위해 2선수비를 5명 대신 4명으로, 라인배커 3명에서 하나 늘린 전술로 대응을 할 수밖에 없다. 그리고 재규어기스는 플레이 시작전에 러닝백을 밖으로 빼내게 된다. 그러면 자연히 트레비스 헌터와 라인배커의 매치업이 형성되게 되고 자연히 그에게 공간이 열리게 된다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/lkMPnMzzTUI\" title=\"YouTube\"><\/iframe><\/div><p>하지만 그보다 더 스페셜한건 수비에서의 모습이다. 트레비스 헌터가 드래프트 될 때 리시버냐 코너백이냐 에 대한 말이 많았는데, 코너백으로서는 이미 리그에서 탑10안에 들만한 선수이고 리시버로서는 아직이다라는 말까지도 있었을정도로 수비쪽이 더 자연스럽다는 평이 있었는데, 그걸 이번 경기에서 보여줬다. 상대의 에이스인 니코 콜린스를 따라다녔는데, 현대 NFL 에서 수비수가 리시버를 따라다니는 건 흔치 않은데, 재규어스 수비가 그를 얼마나 신뢰하는지 알 수 있었다. 그리고 터치다운을 내주기도 했지만, 거기서 페이크에 한번 속아서 몸의 중심과 가속력을 잃은 상태에서 다시 원위치로 돌아가는 스피드와 폭발력은 경이로운 수준이다. 스트라우드가 완벽한 패스를 던지지 않았다면, 높은확률로 완벽한 커버로 불릴만한 수비였다.그리고 이 압도적 스피드는 인터셉션 플레이에서도 크게 드러났다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/Jr01DrLANHs\" title=\"YouTube\"><\/iframe><\/div>","401872997":"<p>레이븐스와 브라운스의 디비전 라이벌 경기였는데, 후보 쿼터백이어도 상승세를 타던 레이븐스를 올해 가장 의문스러운 팀 브라운스가 꺾으면서 브라운스가 여전히 디비전 1위자리를 유지했다.<\/p><p>레이븐스의 입장에서는 어쩔 수 없는 후보 쿼터백의 한계가 느껴졌던 게임이다. 상대 입장에서 패스를 무시하고 러닝수비를 작정하고 나오면 그 어떤 러닝백과 오라인이 있어도 쉽게 풀어나가기에는 어려움이 있다. 하물며, 상대는 올해 생각보다 매우 괜찮은 브라운스의 수비였기에, 레이븐스의 러닝은 완전히 막혀벼렸다. 보고 있던 레이븐스의 팬들은 라마잭슨!! 하고 외쳤을만한 경기일건데, 데릭헨리가 물론 명전에 갈 인물이지만,지금 이 나이에 자기 혼자만의 힘으로 팀을 이끌어나가기엔 어려움이 있다는걸 보여준 게임이기도 하다. 특히나 레이븐스 팬들 입장에서 짜증날 것은 4쿼터에 또 역전을 당했기 때문일 것이다. 이제 이런 패배가 팀컬러가 돠버렸다는 생각이 들 정도로, 또 한번 이 이슈가 터진건데, 키커인 타일러 룹이 49야드 필드골을 놓치면서 우위를 점하던 게임이 급격하게 무너져버렸다. 타일러 룹은 믿음직한 키커라면 가장 성공률이 높아야할 40~49야드에서 벌써 3개를 놓치면서... 레이븐스팬들의 마음에 또 하나 불안의 씨앗을 남겼다.<\/p><p>브라운스의 입장에서 보면, 가장 먼저 말할 존재는 드숀 왓슨이다. 또 이번경기 못하는데 못하는데 못하는데... 하다가 음 ? 이겼네? 하는 경기가 나왔다. 전반 종료 까지 그가 완성한 패스는 단 3번에 불과했다. 딥패스는 아예 안보고있구나 싶을 정도로 전혀 노리지 않고 있고, 어떻게든 자기의 다리로 게임을 풀어내려다가 쌕만 당하기 일쑤였다. 마지막 공격권에서 갑자기 필드를 전진해서 역전에 성공하기는 했는데, 이런 류의 게임이 벌써 이번 시즌 몇번째인지 모르겠다. 이를 두고 중요할 때 해주는 선수로 읽어야할지, 운이 좋은 선수로 읽어야할지는 각자 판단할 부분인데 개인적으로는 후자에 더 가깝다고 본다. 그리고 이 팀이 이렇게까지 버틸 수 있는 이유는 수비덕이다. 수비수들 모두 다 상당히 괜찮은 것 이상으로 퍼포먼스를 보여주고 있다. 지난해 수비수 루키를 탄 슈웨징거가 그 중심인데, 1선부터 2선까지 상당히 탄탄해서, 어떻게든 마지막의 마지막까지 공격을 끌고가게 해주고있다. 어떻게보면 브라운스에 쿼터백 한명만 제대로 있으면 팀의 전력이 말도 안되게 상상할 각이라고 볼 수도 있는데, 이 말도 거의 한 10년은 한것 같다...<\/p>","401872998":"<p>돌풍의 캐롤라이나 팬서스와 모든게 무너지기 시작한 필라델피아 이글스가 맞붙었는데, 팬서스가 손쉬운 완승을 거두면서 자신들이 예사팀이 아니라는 것을 보여주었다. 반면, 이글스는 부상이 심각할정도로 쌓이면서, 이번경기를 넘어 이번 시즌을 포기할 지경에 이르렀다.<\/p><p>아마 이번 게임 들어서면서 가장 많이 언급되는 것은 이글스 쿼터백 제일런 허츠의 부상일 것이다. 폐에 혈전이 있는 상태로 비행기를 타고 넘어왔었다는 이슈에 대해서 구단의 잘못이다 아니다 말이 많은데, 개인적으로 의학 이슈와 구단의 운영에 대한 것에 잘 알지도 못하고 큰 관심도 없기에 내가 하는 말은 가치가 없다고 보지만, 그래도 굳이 내 생각을 말하자면, 팀이 만약에 제일런 허츠의 부상 이슈를 알고 그게 심각해질 수 있음에도 이를 팀의 성적을 위해 방치하고 이용했더라면 허츠의 에이전트가 고소한다고 들고 일어났을 것 같다. 에이전트와 구단이 같이 성명문을 발표하는 걸 보면, 그렇게까지 최악의 몰상식한 상황은 아닌 것으로 보인다. 오히려 집중해야할 것은 허츠가 이 이슈로 시즌아웃이 되었고, 이글스의 모든 희망은 꺾였다는 점이다. 후보 쿼터백이 최선을 다해서 게임을 끌고 가보았지만, 어쩌면 이글스의 붕괴가 시작되었던 가장 큰 이슈인 오라인의 붕괴는 이번 경기에도 여전했다. 시즌 초의 주전 중 단 2명만이 남아있는데 여전히 아무런 블리츠도 읽어내지 못하면서 최악의 모습을 보였고, 이글스가 자신들의 주요선수들을 파는 리셋버튼을 누를지말지가 이팀의 유일하게 남은 관전포인트 아닐까 싶다.<\/p><p>반면 팬서스에 대해서는 할말이 많다. 팬서스가 과연 플레이오프에서 두각을 드러낼만한 팀이냐 아니냐에 대해 끊임없이 생각을 하는데 그 때마다 우린 그럴만한 팀이야! 하고 포효하고 있다. 그렇다면 공수 양면에서 좋고 나빴던 것들을 봐봐자. 우선 팬서스의 수비는 이번 게임에서 부상으로 절뚝이던 이글스의 공격쪽 숨통을 그야말로 끊어버렸는데, 그 주력은 블리츠였다. 안 그래도 리그 8위의 블리츠 수치를 가졌을 정도로 블리츠를 좋아하는 팀이었는데, 그야말로 피냄새 맡고 습격하듯이 이번 게임에서는 40% 가까이 블리츠를 하면서 상대를 혼쭐냈다. 올시즌 블리츠를 많이하고 효과적으로 하는 팀들은 그 창 역할을 하는 2선수비수들이 있는데, 이 팀에서는 그 역할을 하는 선수가 7번 트레번 메릭이다. 블리츠를 보낼 때 다른 블리츠하는 선수들보다 반박자 늦게 쇄도를 시키는데, 그가 달리면서 블로킹이 되어있는 선수들을 체크하고 거기의 빈틈으로 빠르게 파고드는 움직임이 굉장히 좋다. 이글스의 오라인은 이 움직임에 아무런 대답도 내놓지 못했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/hmNjcBC5Fek\" title=\"YouTube\"><\/iframe><\/div><p>다만, 안심할 수만은 없는게, 2선수비가 패스를 차단하는 부분에서는 약점이 보인다. 팀의 주전 코너백 듀오인 제이씨혼과 마이크 잭슨이 있을 때는 수준급의 2선 수비진이지만 그들이 모두 다 부상으로 빠졌기 때문에 굉장히 취약한 수준이다. 실제로 이번 게임에서도 아무것도 하지못하는 이글스 공격에게 이런 부분들이 공략당하는 순간들이 있었을 정도로 분명한 약점이다. 이 부분을 막고 압박율을 올리기 위해서 블리츠율을 확 올렸는데, 이 수비 스타일 자체가 마치 베어스의 그것처럼 하이리스크를 안고 가는 것이기에 살얼음판 위에서 걷는 수비인 점은 있다.<\/p><p>반면 공격쪽에서는 훨씬 더 자신감있게 플옵급 팀이라고 할 수 있다. 이글스의 수비진은 여전히 빅팬지오가 지휘하고 있고, 스타 선수들도 많은데도, 이글스 수비를 상대로 상당히 경쟁력 있는 모습을 보여줬다. 러닝은 묵직하게 필요한 순간마다 제 몫을 해줬는데, 엄청난 빅플레이가 나온 러닝이 있지는 않았지만 시도당 4.3야드에 120야드를 넘게 기록하면서 이 팬서스 공격의 저점을 올리는 역할을 수행해줬다. 가장 인상적인 것은 쿼터백 브라이스 영이다. 팬서스의 감독 데이브 카날레스와 공격코치 이드직은 브라이스 영을 살리라는 제 1목표를 가지고 부임을 했는데, 그 기대감을 훌륭히 충족시키고 있다. 하나의 전술적 컨셉을 잡기보다는 RPO, 언더센터 플레이액션 등등 여러 컨셉의 플레이들을 섞으면서 그때 그때 상대 수비에 맞게 해답을 내놓고 있는데, 지난 게임에서는 RPO를 주공으로 삼았다면, 이번에는 가드를 움직여서 상대의 수비가 러닝이구나! 하고 속이는 장치를 하나 더 넣은 다음에 패스인데! 하고 플레이액션하는 전술을 주공으로 들고 나왔고 이게 중요한 순간마다 아주 잘 터졌다. 거기에 제일런 코커와 티맥이라는 쌍두마차에 토미 트렘블이라는 준수한 타이트엔드 무기진도 이런 브라이스영을 정말 훌륭히 보좌하고 있다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/eHGqEDZsZPE\" title=\"YouTube\"><\/iframe><\/div><p>그렇다면 브라이스 영은 지금 어느정도 수준의 플레이를 펼치고 있는가? 에 대한 궁금증이 생긴다. 그의 플레이들을 보다보면 그가 가장 잘하는 것은 좁은 공간에서의 순간적인 움직임과 그에 걸맞는 순간적인 판단력이다. 수비의 움직임을 능숙한 투우사처럼 순간적으로 피한다음에 거기서나오는 빈틈을 찌르는 플레이는 정말 굉장하다. 이번 시즌에만 몇 번을 본 것 같은데 큰 오라인과 디라인들 사이로 순간적으로 수비를 읽고 정확한 패스를 하는 모습은 이 선수가 대학에서 나올 때 풋볼필드의 포인트 가드라는 별명이 괜히 생긴게 아니구나라는 걸 느끼게 해준다. 거기에 패스정확도도 굉장히 좋다. 특히나 라인 드라이브형 패스보다는 적절한 포물선을 그리면서 앞의 수비를 넘어서 똑 떨어지는 패스의 정확도는 상당히 좋은 편이다. 기존에 그의 약점이라고 하는 외곽지역에 대해 이번 게임에서도 몇번 이런 정교한 패스들을 성공했다. 하지만 그렇다고 탑 10급 쿼터백이라고 바로 말하기 주저되는 이유는 피지컬 때문이다. 작은 체구의 한계인지 모르겠으나, 팔재능이 스패셜하지 않다. 가장 대표적인 장면은, 상대 수비의 액션을 살짝 피해서 정교한 플레이는 능숙하지만 강대강으로 맞붙는 부분에서는 어려움이 보인다. 아래 영상에서 나온 수비가 밀고 들어오면서 오라인이 같이 밀리는 상황에서도 쿼터백은 그 데미지를 온전히 받으면서도 혹은 자세가 흐트러지는 상황에서도 딥패스를 연결해줘야하는 순간들이 있는데 브라이스 영은 이 부분에서 지속해서 약점을 보이고 있고, 두번째 영상 세트에서처럼 빨래줄 같은 강속구 드라이브 패스로 밖으로 연결해줘야하는 패스들에서는 확실히 부족한 피지컬들이 보여지기도 한다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/bF2fgb4NZYc\" title=\"YouTube\"><\/iframe><\/div>","401872999":"<p>쿼터백 케일럽 윌리엄스가 돌아온 베어스가 최근 기세를 올리고 있는 팰컨스를 맞이했는데, 베어스가 압도적인 경기력으로 승기를 일찍 잡고, 4일 뒤에 열리는 경기를 두고 주전선수들을 4쿼터에 빼면서 물론 팰컨스의 막판 대추격을 허용했지만, 결과적으로는 무리없이 승리한 게임이었다.<\/p><p>가장 중요한 포인트는 역시 케일럽 윌리엄스이다. 특히 이번 게임은 그에게 바라는 모든 것을 보여준 게임이라고 봐도 될것 같다. 케일럽 윌리엄스의 번쩍이는 순간들에 대해서는 NFL을 보는 이들은 모두 알것이다. 포켓에서의 순간적인 움직임, 움직이다가 나가는 정교한 패스들, 클러치한 순간에 나오는 의사결정들 등등 전년도 하반기부터 보여준 랠리는 입이 쩍 벌어질 정도였지만, 그의 전반적인 시즌을 놓고보면 의문점들이 꽤나 있었다. 그 중 가장 큰 것은 단거리패스들의 정확도와 성공률이다. 몇몇 특별한 순간에 빅플레이가 고점을 높인다면 안정적인 쿼터백이자 공격의 지휘관으로서 필드를 차곡차곡 전진하는 저점은 이런 플레이들에서 나오는데, 케일럽은 흔히 말해 이런 노잼플레이들에서는 상당히 부진했다. 그래서 이번 시즌 케일럽이 부상당했을 때, 후보로 나섰던 베테랑 쿼터백 케이스키넘의 빠른 의사결정과 기계같은 짧은패스들을 언급하며 케일럽이 배워야할 포인트라고 했었는데, 이번 시즌에서 이 부분이 정말 크게 늘어난 모습들이 나왔고. 이번 경기에서 절정을 찍었다. 벤 존슨 감독의 휘하에서 2년차가 되면서, 그 시스템에 대해 적응도가 훨씬 올라간건지 이번 경기에서 아군의 리시버가 방향을 꺾는 타이밍에 싱크가 훨씬 좋아졌고, 의사결정 자체도 간결해졌다. 거의 기계처럼 필드를 저진했다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">10야드 이내 패스 성공률<\/th><th class=\"r\">모든 패스 성공률<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">6주차<\/td><td class=\"r\">86.2% (1위)<\/td><td class=\"r\">83.3% (1위)<\/td><\/tr><tr><td class=\"l\">26시즌<\/td><td class=\"r\">80.6% (2위)<\/td><td class=\"r\">72.5% (1위)<\/td><\/tr><tr><td class=\"l\">25시즌<\/td><td class=\"r\">68.4% (32위)<\/td><td class=\"r\">58.3% (34위)<\/td><\/tr><\/tbody><\/table><\/div><p>그리고 본인이 빅 플레이를 해줘야할 순간에는 또 왜 자신이 패트릭 마홈즈 - 조쉬알렌을 잇는 순수 피지컬 기반 쿼터백인지 보여줬다. 다리 부상에서 돌아왔음에도 순간적으로 포켓을 빠져나가는 스피드와 민첩함은 여전했고, 특히나 포켓 밖으로 튀어나가서 자신의 몸이 가던 방향과 반대의 방향으로 콜스턴 러브랜드에게 수비가 주위에 있는데도 정확하게 던진 터치다운 패스를 던지는 플레이는 그 말고 몇이나 할 수 있을까 싶다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/D9XYW8tWqr8\" title=\"YouTube\"><\/iframe><\/div><p>수비쪽에서도 베어스가 원하는대로 게임이 펼쳐졌다. 베어스는 수비는 기회주의적이다. 베어스의 수비에게 텍산스나 시애틀 처럼 상대를 힘으로 찍어누를 수 있는 소위말해 정공법을 택할 완력은 없다고 봐도 무방하다. 그렇다면, 최대한 할 수 있는 만큼 막다가 상대의 실수나 우리의 플레이로 기회가 온 상황 즉 써드다운 상황에 강력한 기책을 통해서 승부를 보게된다. 이게 먹히면서 이번 시즌에 그래도 팀을 무너뜨리지 않을 수비를 보여주고 있다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">베어스 방어율<\/th><th class=\"r\">리그 평균 방어율<\/th><th class=\"r\">EPA<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">3rd &amp; ~3<\/td><td class=\"r\">40.0% (4위)<\/td><td class=\"r\">61.9%<\/td><td class=\"r\">-1.00 (1위)<\/td><\/tr><tr><td class=\"l\">3rd &amp; 4~7<\/td><td class=\"r\">40.0% (12위)<\/td><td class=\"r\">43.3%<\/td><td class=\"r\">-0.19 (11위)<\/td><\/tr><tr><td class=\"l\">3rd &amp; 7~<\/td><td class=\"r\">12.5% (2위)<\/td><td class=\"r\">24.5%<\/td><td class=\"r\">-0.25 (7위)<\/td><\/tr><tr><td class=\"l\">3rd 다운 전체<\/td><td class=\"r\">25.8% (2위)<\/td><td class=\"r\">39.7%<\/td><td class=\"r\">-0.42 (3위)<\/td><\/tr><\/tbody><\/table><\/div><p>그리고 이 기책에서 가장 많이 쓰는 것이 바로 캣 블리츠이다. 코너백을 블리츠하는 전술을 말하는데, 코너백에서 C자를 따서 CAT 블리츠라고 부른다. 이 전술은 특히나 러닝을 우선시하는 좁은 진형의 전술을 사용하는 팀으로 주효하는데, 진형이 좁은 만큼 코너백들의 쿼터백까지의 주파거리가 훨씬 짧기 때문이다. 하지만 동시에 패스차단하는 선수가 쇄도를 해오기 때문에 그가 맡을수 있는 넓은 수비범위가 비어있는 양날의 검으로(패커스에게는 이 블리츠가 거의 통하지 않았다) 말그대로 기책인데, 팰컨스상대로는 주효했다. 특히나, 부상에서 돌아온 카일러 고든의 활약은 대단했다. 이번 게임 16번의 스냅에 참가했는데 거기서 4개의 태클 3개의 쌕, 펌블 2개라는 어마무시한 성적을 기록하였는데 이는 40년간 그가 유일한 기록이다. 처음 쌕에서는 역시나 캣블리츠로 러닝백을 향해 두 명의 블리츠를 보내는데, 러닝백 입장에서는 어느쪽을 선택해도 패배 뿐인 상황이고, 두번째도 똑같이 과감한 캣 블리츠로 보내는데 카일러 고든이 타이트엔드 상대로 이기면서 플레이가 만들어진다. 마지막은 팰컨스가 고든 쪽으로 슬라이드 즉 오라인을 그쪽 방향으로 블로킹을 하게 스윽 미끄러지는데도 오펜시브 태클을 제끼고 쌕을만드는 어마어마한 퍼포먼스를 보여주면서 이번 게임 승리의 주역이 되었다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/F-0Fy5CzqME\" title=\"YouTube\"><\/iframe><\/div><p>팰컨스 입장에서는 경기 4쿼터에 베어스의 주전수비들이 빠질 때 막판 대추격을 하면서 게임을 따라갈 뻔했는데, 결정을짓지는 못했다. 가장 아쉬운점은 비쟌 로빈슨의 러닝이 너무 적었다는 점이다. 이번 게임에서 그의 러닝 회수는 단 9회에 불과하다... 물론 그렇다고 그에게 의도적으로 공을 안주고 우리 어린 쿼터백인 마이클 페닉스의 힘으로도 이길 수 있는걸 보여줘야지! 와 같은 의사결정이었던 것 같지는 않다. 베어스의 러닝수비가 생각보다 더 노골적이고 강했고, 이에 따라서 패스게임에서라도 비쟌을 살려보려고 경기 초반에 노력을 했는데, 이것들 마저 무위로 돌아가면서 자연스래 플랜 B로 넘어간 형태로 넘어간 느낌이 강했다. 이해할 수 없는 의사결정은 아니지만 그럼에도 나는 팰컨스는 플랜 A부터 C까지 모두 비쟌 로빈슨이어야한다고 생각한다. 물론 굳이 패배의 책임을 누가 져야하는가 에 대해 물어본다면 부진한 공격보다는 펀트를 두번이나 놓친 스페셜팀을 꼽겠다.<\/p>","401873001":"<p>디비전 라이벌들간의 게임에서 뉴잉글랜드 페이트리어츠가 뉴욕 제츠를 꽤나 손쉽게 꺾으면서 승리를 거뒀다. 뉴욕 페이트리어츠가 빌스와의 게임에서 승리를 한 이후에 경기력이 올라가는 묘한 공식은 작년에 이어 이번해도 유지되는건가 하는 생각이 든다.<\/p><p>특히, 그 중심이 되었던 것은 드레이크 메이다. 탑 10이아닌 수비를 맞이했을 때 본인의 마음가짐이 다른걸까? 아니면 지난 주에 이어 정녕 공격전술을 그에 맞춰서 다시 짠걸까? 개인적으로는 전자이지 않을까 싶은데, 이번 경기에서 2번 리시버인 로미오 답스가 부상을 당해서 나가기도 했고, 경기중에 선발 출장한 오라인 5인 중에 3명이 부상을 당하는 불상사가 있었지만, 그럼에도 메이는 상당히 잘했다. 시즌 초에 보이던 오래 포켓안에 있을 때 언제 습격당할지 모른다는 초조함도 거의 사라졌고, 중간에 자기의 다리를 활용해 나가는 움직임과, 그의 주특기와 같은 먼거리 1대1 패스까지 아주 훌륭했다. 상대가 제츠라서 그런거 아니냐 라는 비판도 충분히 고려해볼만하지만, 냉정하게 제츠가 예전처럼 초약팀도 아니고, 쿼터백을 지원한다 라는 측면에서 지금 페이트리어츠의 상황(오라인에서는 부상이 계속 나고, 팀의 2번 리시버 부상, 1번리시버는 부상에서 갓 돌아와서 경기력이 높지 않음, 러닝백, 타이트엔드는 전부 탑10 밖 혹은 최소 언저리)보다 더 나은 상황을 갖고 있는 상황에 있는 수많은 쿼터백들이 헤메는 걸 보면 그에 대해 높은 평가를 할 수밖에 없다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/qOvIZT6htiA\" title=\"YouTube\"><\/iframe><\/div><p>더욱이나 그가 인상적인 이유는 1번 리시버인 AJ 브라운이 이번 경기 거의 그의 커리어 통산으로 가장 졸전을 펼쳤기 때문이다(그럼에도 수비의 이목을 끄는건 확실해서 위의 두플레이에서 빅플레이가 나왔던 것은 수비가 그에게 시선을 끌었기 때문이다). 물론 부상에서 갓 돌아온 게임이었고, AJ 브라운과 드레이크 메이는 실제 경기에서 호흡을 본격적으로 맞춘 거의 첫 경기라고 해도 무방하기 때문에 당장 평가하긴 어렵다. 허나 그럼에도 불구하고 AJ 브라운이라는 이름값, 환경만 제대로 갖춰지면 리그의 탑급 리시버라는 이야기도 나오는 그 이름값에 걸맞는 기대를 했던 페이트리어츠의 팬 입장에서는 아쉬움이 클 수밖에 없다. 계속해서 공을 떨어 뜨렸고, 그 중 가장 안타까운 순간은 경기 마지막 온사이드 킥에서 팀에서 가장 공을 잘 잡는('손이 좋은'이라 표현한다) 선수를 배치해서 그에게 불규칙하게 튀는 공을 잡게 하는데, 그 역할을 받았음에도 불구하고 공을 못잡는 모습이지 않았을까 싶다. 개인적으로 이런 부분은 경기감각이 안올라와서 일어나는 일이라고 생각하는데, 더 걱정이 되는 것은 그의 스피드가 죽은게 아닐까 하는 점이다. AJ 브라운은 '더 크고', '빠르다'라는 2가지 요소로 1대1을 이기는데 특화된 선수이다. 하지만 다리 부상은 스피드를 저해할 수 있는 요소이기도 하고, 이번 게임에서 실제로 스피드가 좀 줄은 느낌이 들어서 확인해보니, NGS 에서 직선 루트 속도가 시속 15.5마일이었던 지지난시즌 대비, 13.87 정도로 떨어졌다는 통계를 확인할 수 있었다. 물론, 아직 몇경기 더 봐야하겠지만, 2가지의 요소로 승리하는 선수다보니, 하나가 빠졌을 때는 걱정이 되기에 좀 더 주의깊게 볼 필요가 있어보인다.<\/p><p>제츠의 경우에는 좀 답답한 경기가 계속해서 이어지고 있다고 본다. 브리스 홀이라는 팀의 에이스 러닝백이 부상당한 상황에서 그를 대신한 2번 러닝백이 나쁘지 않은 러닝을 보여준것도 크고, 올해 드래프트한 루키, 오마 쿠퍼 주니어가 좋은 모습을 보인것도 고무적이다. 특히나, 개럿 윌슨과의 원투펀치로 성장을 하게 되면 제츠 입장에서 정말 기쁜 소식이다. 하지만, 그럼에도 불구하고 전체적인 플레이 설계에서 의문이 있다. 공격은 모름지기 쿼터백을 중심으로 컨셉과 스타일이 정해져야하는데, 지노 스미스는 장거리 패스에 장기를 가지고 좋아하는 쿼터백인데, 왜 자꾸 타이트엔드를 많이 쓰고 짧은 패스 플레이(패스 평균 비거리는 39명 중 리그 29위)를 고집하는지는 좀 이해하기 힘들다. 수비에 깃댄 안정적인 공격을 원하는걸까 싶을 수 있지만,  너무 그의 장기를 죽이는게 아닐까 생각이 든다.<\/p>","401873002":"<p>피츠버그 스틸러스에는 감독과 관계없이 수맥이 흐르는걸까? 스틸러스가 승리할 이유가 없는 게임에서도 상대가 알 수 없는 이유로 늪으로 끌려들어가면서 피츠버그가 승리하는 게임이 마이크 톰린감독의 용병술이라고 생각했고, 그가 떠나고는 이런 일이 없을 줄 알았는데 또 발생했다. 버커니어스의 후보 쿼터백이 정말 분전을 하고, 수비쪽에서 퍼포먼스가 올라가면서 승리를 굳히는 듯했는데, 스틸러스의 공격이 아무것도 하지 못하다가 중요한 순간에 플레이를 펼치면서 연장 승부 끝에 승리하였다.<\/p><p>스틸러스의 경기 초중반 공격은 정말 쉽지 않았다. 스틸러스 입장에서 제일런 워렌을 중심으로 한 러닝게임을 하지 않을때의 공격이 어떠한가를 가장 극명하게 보여주는 시간이었다. 이제 만 42살의 애런 로저스는 상대의 압박이 들어오고, 쌕을 당하기 시작하면, 그 뒤로 압박이 거세지고 포켓이 좁아지면 거의 본능적으로 체크다운(장거리보다는 타이트엔드나 러닝백이 아무것도 안 열릴 때를 대비해서 0야드 지점에 서 있는 루트) 패스를 찾는다. 버커니어스는 그만큼 상대를 거세게 압박해 들어갔고, 심지어 이 경향을 이해한 영리한 움직임으로 인터셉션이 손에 들어갔다가 떨어지기까지 했다. 이 플레이에서 우리 움직임을 읽고 자신의 수비위치를 벗어나서 러닝백과 패스 경로 상으로 움직인 선수가 올해 버커니어스에서 2라운드에 뽑은 루키인데, 개인적으로 올해 수비쪽 루키 중에 꽤나 두각을 드러내는 인물이라 생각한다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/mtiMfUlBcCI\" title=\"YouTube\"><\/iframe><\/div><p>피츠버그는 수비쪽에서도 상대가 언드래프티드 루키 쿼터백이라 안전하게 뒤에 수비를 두는 수비전술을 구사했었는데, 이에 제일런 다니엘스가 짧은 패스와 적절한 러닝으로 필드를 야금야금 전진해가면서 열세에 몰렸다. 결국 후반전에 스틸러스가 칼을 꺼내드는데, 수비가 그 시작이었다. 상대가 딥패스를 하지 않는다는 걸 확인하고, 공격적으로 수비를 운영하기 시작했다. 그리고 이번 시즌에 가장 대세가 되는 전술인 캣블리츠를 쓰기 시작하는데, 코너백의 C를 따서 CAT 블리츠, 즉 코너백을 블리츠하는 전술이다. 지난 몇 년간 공격들은 리시버들을 양 끝으로 퍼뜨리는게 아니라 좁게 배치한 뒤 여기서 나온 러닝과 러닝인척 패스하는 플레이 액션으로 게임을 풀어나갔다. 이에 지독하게 당하던 수비들이 양쪽 끝에 있는 코너백들을 그대로 쇄도를 시키는게 바로 캣블리츠인데, 코너백들은 워낙 스피드가 빨라서, 좁은 진형에서 순식간에 쿼터백과 러닝백의 교차지점에 달려들 수 있고, 러닝페이크를 할 때 쿼터백은 러닝백에게 내주는척 등을 돌리고 있기 때문에 코너백들의 빠른 쇄도에 대응을 못하고 러닝백도 기존 타이밍보다 더 빠른 타이밍에 쇄도를 당하면서 터지게 된다. 그리고 이번 게임에서 그 역할을 한 선수는 제일런 램지이다. 안 그래도 덩치가 커서 피지컬한 코너백이라 최근에는 세이프티 역할로도 뛰는데, 순간적으로 튀어나가면서 블리츠에서 빅플레이를 펼쳤고, 이번게임 11태클, 태클 포로스(시작선 뒤에서의 태클) 4개에 쌕 1개를 기록했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/dEIJCsLVqcc\" title=\"YouTube\"><\/iframe><\/div><p>그리고 이렇게 수비쪽에서 풀리기 시작하면서 공격도 풀려났다. 애런 로저스가 두번의 키패스를 통해 공격의 활로를 뚫었고, 그렇게 기세를 역전까지 이끌어갈 수 있었다. 하지만, 경기가 끝나고 스틸러스의 팬들이라면 음... 하고 생각이 더 들만한 게임이었다. 특히나 패스가 러닝보다 많은 게임에서는 승리가 정말 어렵겠구나 라고 느꼈을 거고 러닝이 안 풀릴때 '순간의 번뜩임'을 애런 로저스에게 기댈 수 있을까? 에 대한 의문이 남았을 것이다. 버커니어스는 여전히 쉽지 않은 길을 가고 있는데, 물론 기대치가 아주 낮긴했지만 언드래피티드 루키가 꽤나 침착하게 공을 전개했고, 그 플레이를 보는게 기분이 좋았다.<\/p>","401873003":"<p>무승의 테네시 타이탄스가 드디어 승리를 거뒀다. 그것도 자신들의 디비전 라이벌인 인디애나폴리스, 그들의 홈에서 13-0이라는 점수를 뒤집으며 승리를 거뒀다.<\/p><p>인디애나폴리스 콜츠의 입장에서는, 시즌의 모든게 무너져내렸다고 생각이 들만한 상황이다. 이번 게임에서 NFL 게임의 삼면인 공격, 수비, 스페셜팀 3개 방면에서 다 무너졌는데 턴오버가 또 나왔다. 쿼터백 다니엘 존스는 전년도 초반 잘할 때에 비하기도 뭐하고 자신의 커리어 전체를 두고 봐도 올해 최악의 모습을 보이고 있다. 지금 6경기 동안 터치다운이 4개인데 인터셉션은 6개에 그에게서 나온 턴오버는 무려 9개이다. 부상에서 회복을 못한건지 본인의 다리는 전혀 활용하지 못하고 있고 패스 비거리와 구속은 이상하게 1, 2주차보다 오히려 더 떨어진듯한 모습이 나오고 있다. 수비쪽에서도 마찬가지다. 디포레스트 버크너(49ERS가 슈퍼볼을 진출할 때 팀의 에이스 중 하나였는데, 콜츠로 트레이드 되어서 그야말로 혼자 고군부투하던 인물인데 경기가 끝나고 맨날 똑같은 방법으로 똑같이 지는데 화가 너무 난다는 인터뷰가 기억이난다...)만이 제몫을 하고 있다 라고 봐도 될 정도인데 팀의 미래를 걸고 데리고 온 소스 가드너는 부상과 폼저하로 이번 경기 중간에 나갔고, 괜찮은 역할을 하던 선수들을 보내버리고 그 자리를 채우기 위해 영입하고 드래프트한 선수들은 모두 제몫을 하지 못하고 있다. 여기에 이번 경기는 스페셜팀에서조차 펀트 블락이 나오고, 펀트 리턴, 킥리턴은 아예 못막는 최악의 졸전이었다. 전년도 전반기에 좋은 모습을 보였기에 큰 희망을 걸고 이번 시즌을 맞이했을텐데, 오히려 콜츠의 한 시대가 막을 내리는 시점이 되지 않을까 싶다. 콜츠에는 사실 굉장히 수준급의 베테랑들이 군데군데 있기 때문에 이들을 모두 팔기 시작하는 바겐 세일이 시작되는 것 아닐까 생각도 든다.<\/p><p>타이탄스 입장에서는 가뭄의 단비와 같은 승리였다. 물론, 본인들이 잘해서 이겼다기 보다는 상대 측에서 알아서 자멸한 듯한 영향도 있지만, 그래도 로버트 살라 신임감독이 첫 승을 거뒀고, 그 첫승이 본인이 강점이 있는 부분을 통해 승리를 거뒀다는 것은 의미가 크다. 감독의 성공에 대한 지표로 개인적으로 삼는 것 중 하나는 그 감독이 선임되고, 첫해에 재계약 및 영입한 선수들의 활약인데, 살라는 1선 수비에 굉장히 크게 투자를 했고, 그 1선 수비가 이번 경기 승리의 주역이었다. 다니엘 존스에게 지옥을 선사했는데 특히나 빨간 팔토시의 제프리 시몬스는 본인이 왜 리그의 탑 티어 내곽 수비라인맨인지 보여주며 어마어마한 활약을 했다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/TPkxUoAIhqs\" title=\"YouTube\"><\/iframe><\/div><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">제프리 시몬스<\/th><th class=\"r\">저메인 존슨<\/th><th class=\"r\">프랭클린 마이어스<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">압박<\/td><td class=\"r\">7<\/td><td class=\"r\">7<\/td><td class=\"r\">6<\/td><\/tr><tr><td class=\"l\">쌕<\/td><td class=\"r\">2<\/td><td class=\"r\">2<\/td><td class=\"r\">-<\/td><\/tr><\/tbody><\/table><\/div><p>반면 공격쪽에서는 여전히 호흡이 하나도 맞지 않고 있다. 브라이언 다볼에 대해 책망을 할 수 밖에 없게 되는데, 4주차 까지 뭐 적응기라고 쳐도 이제는 6주차이다... 6주차인 시점에 쿼터백과 리시버가 전혀 호흡이 안맞아서 리시버가 가는 방향과 쿼터백이 던진 방향이 엇갈리고, 그 플레이가 끝나고 둘 다 화를 내고 이런 장면들이 한경기에도 몇 번씩 나오는 것은 문제가 좀 있다.<\/p>","401873004":"<p>이번주 가장 충격적인 경기결과였을 것이다. 리빌딩 모드에 들어간 카디널스가 올해 어벤져스를 구성했다는 이야기를 들은 램즈를 잡아내버렸다. 시즌 전에 카디널스의 미들라인배커 맥 윌슨이 애런 로저스와 마일스 개릿이 합류한 램즈와 두번 맞붙게 되었는데 어떻게 보냐 라는 물음을 받았었는데, LA의 구장에 램즈의 홈팬이 안오는걸 비꼬면서 그들이 우리의 홈에 두번 와야할 것이다 라고 자신만만한 인터뷰를 했는데, 그 인터부에 걸맞는 승리가 나왔다.<\/p><p>역시 경기 끝나고 가장 생각이 드는 점은 어떻게 카디널스의 수비 상대로 램즈의 공격이 이렇게 아무것도 못했는가? 에 대한 점이다. 이번주 카디널스가 상대한 팀들 중(모든게 고장난 차저스를 빼고) 가장 적은 실점을 한게 램즈전이었다. 아마 이번 경기만 놓고 보면, 감독진의 이슈가 가장 클 것이다. 애리조나 카디널스의 감독 마이크 르푸어는 지난 3년간 션 멕베이의 감독 옆에서 그에게 공격자문을 하던 코치였다. 아마 멕베이의 생각을 속속들이 알고 있었을건데, 그게 여러 번의 플레이에서 드러났다. 특히 부다 베이커의 쌕 플레이를 보자. 오른쪽에서 수비들이 블리츠를 들어가자 매튜스태포드는 그 블리츠하는 쪽의 빈공간에 빠르게 패스를 하려고 한다. 카디널스의 수비들은 이를 안다는 듯이 그쪽으로 쫙 쪼여들어간다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/v7MquEQCO6E\" title=\"YouTube\"><\/iframe><\/div><p>그리고 션 멕베이 감독의 가장 큰 단점 중 하나라고 생각하는데, 워낙 작은 디테일에도 신경을 쓰는 인물이라 그런지 게임의 특정 부분이 자기 뜻대로 풀리지 않으면, 그 플레이를 아예 안해버리는 과잉대응이 이루어지는 경우가 종종있다. 이번 게임에서도 초중반부터 자기의 플레이가 읽히는 느낌이 들면서 어 이거 읽히네 이거 하지말자 저거 읽히네 저거 하지말자 식으로 과잉 대응을 하다가 멘붕이 오는 경우가 있다. 경기의 막판 4쿼터 가장 중요한 순간 4분 남은 시점에서 2ND 다운에서는 러닝을 하지만 부다베이커에게 터진다, 그리고 3RD &amp; 5에서 푸카나쿠아에게 스크린 패스를 한다. 소극적인 러닝 2번을 했다가 수비에 틀어막혔는데, 그 뒤에 반칙이 나오면서 4TH &amp; 8 상황이 되는데 거기서도 스크린 플레이를 부른다. 자신의 게임에서 가장 자신있는 플레이를 내보일 순간이었을 텐데 의문스러운 플레이콜링이 계속되었고, 나는 그 원인을 상대 감독이 우리 팀에 오래 있었어 어쩌지?! 아무것도 안먹히는데?! 라는 션 멕베이의 과잉 반응에 따른 멘붕에서 찾는다.<\/p><p>이번 경기는 그렇다 쳐도, 램즈의 공격은 이번시즌 우리가 생각하던 그것과는 완전 다르다. 슈퍼팀이라는 이야기를 들으며 전승으로 간다던 설레발까지 있던 팀이, 현재 2승 4패에 디비전 1위인 샌프란시스코 49ERS와는 무려 4승 차이가 난다. 수비쪽에서는 부상이라도 있지 공격에서는 왜 그럴까에 대해 굉장히 생각하게 하는데, 가장 많이 언급되는 이유는 매튜 스태포드의 부진이다. 지난 시즌 대비 나이가 확연히 느껴지는 모습인데, 개인적으로 봤을 때는 구조적으로도 여러 변화가 있다. 우선 가장 중요한 것은 언더센터 플레이 액션의 비중이 확연이 줄었고, 샷건의 비중이 늘어났다는 점이다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">25시즌<\/th><th class=\"r\">26시즌<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">샷건 비중<\/td><td class=\"r\">58%<\/td><td class=\"r\">71%<\/td><\/tr><tr><td class=\"l\">샷건 성공률<\/td><td class=\"r\">62.5%<\/td><td class=\"r\">68.8%<\/td><\/tr><tr><td class=\"l\">샷건 시도당 야드<\/td><td class=\"r\">7.9<\/td><td class=\"r\">7.4<\/td><\/tr><tr><td class=\"l\">샷건 쌕 비율<\/td><td class=\"r\">3.8%<\/td><td class=\"r\">3.6%<\/td><\/tr><tr><td class=\"l\">언더센터 플레이액션 비중<\/td><td class=\"r\">32%<\/td><td class=\"r\">23%<\/td><\/tr><tr><td class=\"l\">언더센터 플레이액션 성공률<\/td><td class=\"r\">68.9%<\/td><td class=\"r\">62.5%<\/td><\/tr><tr><td class=\"l\">언더센터 플레이액션 시도당야드<\/td><td class=\"r\">8.5<\/td><td class=\"r\">7.3<\/td><\/tr><tr><td class=\"l\">언더센터 플레이액션 쌕 비율<\/td><td class=\"r\">3.0%<\/td><td class=\"r\">4.9%<\/td><\/tr><\/tbody><\/table><\/div><p>위 표에서 볼 수 있지만 샷건의 비중은 58% 에서 이번 시즌 71%가까이 상승했고, 언더센터 플레이 액션 관련 각종 스탯들이 이전년도 대비해서 훨씬 안좋아진것도 확인할 수 있다. 문제는 언더센터 플레이 액션은 지난해 램즈의 가장 큰 무기였다는 점이다. 지난해 램즈는 리그에서 가장 많이 언더센터 플레이액션 패스를 펼치는 팀이었고, 이 효과 또한 굉장했다. 하지만 이번 시즌 들어 그 효과성이 굉장히 줄어들었다. 가장 표면적인 이유는 타이트엔드 테런스 퍼거슨의 부상이다. 여러 명의 타이트엔드를 기용해서 러닝인척 패스를 하는 것이 램즈의 주공인데, 타이트엔드가 여럿인 전술은 스피드가 부족할 수 밖에 없고, 그 타이트엔드 진형에서 스피드를 제공하는 테런스 퍼거슨의 부상이 이 팀의 패스 공격을 굉장히 굼뜨게 만들었다(에이스 리시버인 푸카나쿠아, 드반테 아담스 둘다 스피드에 장기가 있는 선수들은 아니다). 하지만 이만으로는 설명이 어렵다고 보는데, 개인적으로는 위의 표에서 마지막 쌕 비율이 굉장히 크다고 생각한다. 램즈의 플레이액션이 성사되기 위해서는 쿼터백 매튜 스태포드는 언터센터, 즉 센터의 바로 뒤에서 플레이를 시작해 자신의 한참 뒤에 있는 러닝백에게 공을 건네주러 가야한다. 이때 그의 등은 수비에게 돌아서 있는데, 러닝인 척 페이크를 주고는 뒤를 돌아서 패스를 펼쳐야한다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">언더센터 패스 완성률<\/th><th class=\"r\">언더센터 패스 쌕 비율<\/th><th class=\"r\">언더센터 패스 시도당야드<\/th><th class=\"r\">언더센터 패스 EPA<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">25시즌 베어스전<\/td><td class=\"r\">10.0%<\/td><td class=\"r\">16.7%<\/td><td class=\"r\">2.0<\/td><td class=\"r\">-0.62<\/td><\/tr><tr><td class=\"l\">25시즌 베어스전 제외<\/td><td class=\"r\">68.9%<\/td><td class=\"r\">3.7%<\/td><td class=\"r\">8.9<\/td><td class=\"r\">+0.28<\/td><\/tr><\/tbody><\/table><\/div><p>근데, 지난해 플레이오프에서 베어스는 이 플레이에 대한 본격적인 해법을 가지고 온다. 이번주 다른 경기들 리뷰에서 나온 캣블리츠, 즉 양쪽의 코너백들을 블리츠 시키는 것이다. 램즈는 여러 명의 타이트엔드를 주공으로 쓰는 만큼 선수들을 넓게 펼치는게 아니라 좁게 배치하고 그에 따라 양끝에 있는 코너백들이 자신의 스피드를 활용해 순식간에 쿼터백에게 닿을 수 있다. 매튜 스태포드가 나이가 들어서 필드를 등졌다가 돌아설 때 대응이 늦어졌을 수도 있고, 아니면 이제 더이상 태클을 당하기 싫어서일 수 있는데 (실제로 나이가 들수록 압박에 취약한 모습이 나온다) 결과적으로 베어스전에서 램즈의 언더센터 플레이 액션은 극악의 모습을 보였다. 베어스 외에는 스냅당 3.7%에 불과하던 쌕비율은 16.7%까지 올랐고, 패스 완성률도 10%에 불과했다. 램즈는 플레이액션 패스에서 -0.5 EPA에 준하는 성적을 기록한 것은 이 경기 외에 리그 절정의 수비를 가진 시애틀 시호크스 뿐이었다. 베어스수비진은 아무리 좋게 봐도 평균 이하인데 전술만으로 램즈의 주공에 대한 완벽한 파훼법을 제시해버렸다는 것은 션멕베이 입장에서 충격적일 수 밖에 없었을 것이다. 다른팀들도 이걸 캐치해 나가면서 램즈를 상대할 때 언더센터에서 블리츠비율을 늘려가고 있는데(언더센터에서 블리츠 당하는 비율 전년도 32위 -&gt; 이번시즌 3위), 여기에 션멕베이 특유의 과민 반응이 겹치고, 매튜 스태포드가 한살 더 먹었다는 요소까지 겹치면서 자신들의 주공이었던 언더센터가 아닌 샷건 플레이로 게임을 펼치려 하는 것으로 보인다. 문제는 램즈의 선수진은 샷건에 플레이에 맞게 구축되어있지 않다는 점이다. 드반테 아담스와 푸카나쿠아 모두 훌륭한 리시버들이지만 이들의 장기는 샷건에 어울리지 않는다. 드반테 아담스는 시작선에서 순간적인 움직임으로 선수를 따돌리고 오픈이 되는 유형의 인물이고, 푸카 나쿠아는 터프함으로 상대와 경합을 하는 와중에 공을 뜯어내서 이기는 스타일이다. 하지만 샷건에서 패스게임이 폭발적이려면, 빠질 수 없는 요소가 리시버들의 스피드다. 뱅갈스의 리시버들을 떠오르면 좋은데, 드반테와 푸카는 이 부분에서 부족함이 좀 있다. 결국 넓게 퍼뜨려놓은 리시버들 쪽에서 손쉽게 패스할 각이 나오지 않으면서, 매튜 스태포드는 고심하다가 러닝백에게 패스를 할 수 밖에 없게 된다. 실제로 그의 올해 패스시도 중에 21%가 러닝백한테 가는데 작년에는 10%에 불과했고, 이번시즌 전에 그의 커리어 최고는 12.5%였다.<\/p><p>결국 램즈의 공격은 언더센터에서 패스도 파훼법이 나오고, 샷건 패스도 구조적인 한계가 명확한 상황이라고 볼 수 있는데, 그렇다고 세상이 끝난 것은 아니다. 물론 워낙 어려운 디비전에서 뛰고 있지만, 이런 약점들에 자신들의 정체성이 흔들리는 중에도 불구하고 램즈는 현재 경기당 전진야드 부문에서 1위를 차지하고 있다... (도데체 어떻게?), 거기다가 아직 러닝은 여전히 잘 먹히고 있다. 션 멕베이 감독이 워낙 클래스가 있다보니, 이 러닝으로 자신들의 새로운 정체성을 구축할지, 아니면 자신들의 구조적 한계를 뛰어넘는 뉴 전술을 구축할지 굉장히 기대가 되는데, 디비전이 워낙 험해서... 빠르게 감을 잡아야할것이다.<\/p>","401873005":"<p>빌스와 레이더스가 맞붙었는데, 버팔로 빌스가 접전 끝에 3점차 승리를 거둔 게임이었다. 버팔로빌스의 장단점에 대해서는 뒤에 더 자세하게 이야기하겠지만, 이번시즌 리그에서 가장 약한 팀 중 하나일거라고 예상했던 레이더스가 계속해서 강팀들과 접전을 펼치는 것은 참 재밌는 일이다. 개인적으로는 큐비악감독이 조금은 어렵지 않을까 생각했었는데(수비의 위명으로 공격이 먹힌 타입이었기에) 시즌이 꽤나 지난 지금까지 아주 훌륭한 의사결정이었던 것으로 보이고 내년이 많이 기대된다.<\/p><p>빌스 입장에서는 좋은점과 안 좋은점이 같이 있었다. 좋은점은 역시 조쉬알렌이다. 이번에 레이더스는 4명의 선수만 패스러쉬 시키고, 이 쇄도를 과하게 하는게 아니라 딱 조쉬알렌이 압박을 느낄만큼 하면서 그를 포켓에 가두는 것에 초점을 맞췄고, 그 뒤에 2선수비는 7명을 세우는 수비 전술을 많이 썼다. 이런 전술은 수비가 내주는걸 따박따박 받아가면서 전진해야하기에, 쿼터백의 초조함을 유발할 수 있고, 조쉬알렌이 경기가 긴박해지고 마음이 급해지거나 그에게만 보이는 특정 각이 보이면 무리를 하는 것은 우리 모두 알고 있기에 그에 대한 나름의 레이더스가 내놓은 해법이었다. 하지만 그런 수비 상대로 빌스는 30점을 넘게 때려박았다. 그야말로 빌스의 강력한 공격력에 대해서 느낄 수 있었고, 특히나 조쉬알렌이 무슨 투포환 던지듯이 패스를 해서 터치다운 한 장면은 이야... 그래 저런건 조쉬알렌만 하지 싶은 플레이였다. 물론 레이더스가 아니라 수비 전력이 훨씬 좋은 팀을 상대로도 이런 플레이들(특히나 조쉬알렌의 마이너스가 없는 플레이)를 유지할 수 있는가는 좀 더 두고봐야할것이지만, 리시버 키온 콜먼의 폼이 계속해서 올라가고 있는것은 매우 긍정적이다. 지난해 구단주가 공개석상에서 그 리시버를 뽑은건 지금 GM이 아니라 전임 감독의 결정이었다 식으로, 아예 이 어린 선수를 묻어버렸었는데... 키온 콜먼 입장에서는 억울한게 없지 않았을 것이다. 왜냐하면 그가 뭐 팀을 구해줄 1라운드 상위픽도 아니었고 2라운드에서 뽑힌 선수라서 충분히 성장을 기다려줄 수 있을 만한 픽인데 구단주가 실패한 픽이라며 자기를 언론의 뭇매를 맞게 해버렸으니까.... 하지만 이런 구설수 속에서도 이번 시즌 자신의 커리어 최고 경기를 펼치고 있다. 물론 특급 리시버는 아니다(애초에 특급리시버를 기대하고 뽑은것도 아닐것이다). 하지만 팀의 2~3번째 옵션으로 상당히 알짜의 플레이를 유지하고 있는 것은 도움이 된다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/eGvFL5lHt-E\" title=\"YouTube\"><\/iframe><\/div><p>반면 역시나 빌스의 문제가 되는 것은 수비이다. 수비코치 출신 감독을 해고하고, 공격코치 출신 감독을 앉힌게 자신들의 공격흐름을 이어가는덴 분명 좋았지만, 몇 년간 지속적인 약점이었던 수비의 개선에는 큰 도움이 되지 않고 있다. 2선 수비에서 그나마 잘하고 있는 선수가 벤포드인데(그마저도 타 플레이오프팀의 1번 코너백에 비해서 우위에 있지는 않다) 이 벤포드가 빠지자마자 상대 브락 바워스가 빅플레이를 터뜨리기 시작했을 정도로 2선 수비에는 구멍이 많다. 그나마, 1선에서 워커, 그렉 루 쏘등 재능이 있는 선수들이 적지 않다. 그리고 새로운 공격코치도 이전 체제와는 다르게 공격적인 플레이콜링 즉 쇄도를 중시하는 플레이콜링을 한다고 했는데, 이 선수들의 퍼포먼스가 실제 성적으로 이뤄지지 않고 있다. 이번 경기에 쌕이 하나도 없었고 시즌 전체적으로 보았을 때도 소극적인 수비라 비판 받았던 작년 수비보다도 압박이 훨씬 부족하다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th class=\"l\">항목<\/th><th class=\"r\">스냅당 쌕 비율<\/th><th class=\"r\">블리츠 비율<\/th><\/tr><\/thead><tbody><tr><td class=\"l\">25시즌<\/td><td class=\"r\">3.81% (16위)<\/td><td class=\"r\">30.9% (10위)<\/td><\/tr><tr><td class=\"l\">26시즌<\/td><td class=\"r\">2.69% (26위)<\/td><td class=\"r\">35.5% (9위)<\/td><\/tr><\/tbody><\/table><\/div>","401873006":"<p>치프스가 파죽지세를 이어가고 있다. 디비전 라이벌이자 고장나버린 차저스를 상대로 압도적인 경기를 보여주면서 49ers, 바이킹스와 함께 무패 기록을 이어갔다. 경기내용적으로 특별히 언급할만한 포인트는 없다. 경기가 예측대로 진행이 되었기 때문이다. 차저스는 자멸했고, 치프스는 자신들의 강점들을 선보이면서 무난하게 승리했기 때문이다.<\/p><p>그럼에도 몇가지 포인트들을 집자면, 치프스의 러닝 옵션 케네쓰 워커의 압도적 포스는 여전하다. 이번 경기에서 100야드 넘게 러싱을 하면서 이 팀을 캐리하고 있다. 이번 시즌 지금 시점에 MVP를 정하라면 케네쓰워커가 언급되어야할 정도의 압도적인 활약이다. 거의 매경기 100야드 이상을 전진하고 있고, 위기의 팀을 거의 혼자 힘으로 하드캐리하고 있다고 봐도 무방할정도다. 아니 이제는 시즌 중반에 접어들고 있기에, 더이상 시즌 시작 전의 평가였던 위기의 팀이라고 하기도 어렵고 리그에서 가장 강한팀의 주공이라고 해도 된다. 또 하나 긍정적인 뉴스는 마홈즈가 다리부상에서 돌아오는 시즌임에도 그의 기동력이 아주 좋아보인다. 기동력이 그의 게임에서 꽤나 중요한 부분인데 이번 게임에서도 중요한 순간마다 자신의 기동력을 활용하는 플레이들을 보여주었다. 케네쓰 워커가 주공으로 자리를 잡아주고, 마홈즈의 플레이메이킹에 리시버쪽에서는 워디와 켈시가 돌아가면서 역할을 분담하는 형태의 공격 정체성이 성립되었고, 이 공격이 상당히 강력하다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ymQ553IiEdA\" title=\"YouTube\"><\/iframe><\/div><p>그리고 또하나 긍정적인 포인트는 수비쪽이다. 이번 시즌을 앞드고 자신들의 1번, 2번 코너백을 램즈에게 보내버린 치프스이다. 개인적으로 쿼터백 - 오펜시브 태클 다음으로 NFL 에서 가장 희귀하고 구하기 어려운 포지션이 코너백이라고 보는데, 단 한명만 필요한 쿼터백, 단 2명만 필요한 오펜시브 태클과 달리 코너백은 많을 수록 좋다. 즉 쿼터백과 오펜시브 태클은 S급과 아닌 선수의 격차가 꽤 큰데, 코너백은 A급 B급이라하더라도 모두 수요가 있는데, 자신들의 1번 2번 코너백을 다른팀에 보내는 걸 보고 개인적으로 도데체 왜... 하고 의문을 가졌다. 심지어 두 선수 다 전성기가 한참 남은 선수들이어서 더 의아했는데, 역시 나같은 것보단 치프스의 프론트와 감독 코치진이 훨씬 더 영민했다. 이번 해 정말 간만에 받은 자신들의 1라운드 상위픽인 6번픽으로 맨수어 딜레인이라는 코너백을 지명하는데, 전술이 좋아서 육성을 잘한건지, 재능을 보는 눈이 뛰어난건지 이 선수는 바로 팀의 주전급 선수로 성장하였다.<\/p>"};

function ytActivate(root){
  const rm=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
  (root||document).querySelectorAll(".yt-loop[data-yt-src]:not([data-yt-on])").forEach(el=>{
    el.setAttribute("data-yt-on","");
    const play=()=>{
      const f=document.createElement("iframe");
      f.src=el.getAttribute("data-yt-src");f.title="YouTube";
      f.setAttribute("allow","autoplay; encrypted-media; picture-in-picture");
      f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
      el.replaceChildren(f);
    };
    if(!rm){play();return;}
    const a=el.querySelector(".yt-poster");
    if(a) a.addEventListener("click",e=>{e.preventDefault();play();});
  });
}

  ["m","퍼스트다운","firstDowns",1],

  ["m","플레이당 야드","yardsPerPlay",1],
  ["m","패싱","netPassingYards",1],
  ["s","C/ATT","completionAttempts",0],
  ["s","패스 시도당 야드","yardsPerPass",1],
  ["s","인터셉션","interceptions",-1],
  ["s","색-손실야드","sacksYardsLost",-1],
  ["m","러싱","rushingYards",1],
  ["s","러싱 시도","rushingAttempts",0],
  ["s","러싱 시도당 야드","yardsPerRushAttempt",1],
  ["m","레드존 (성공-시도)","redZoneAttempts",1],
  ["m","반칙 (횟수-야드)","totalPenaltiesYards",-1],
  ["m","턴오버","turnovers",-1],
  ["s","펌블 로스트","fumblesLost",-1],
  ["s","인터셉션","interceptions",-1],
  ["m","수비·특별팀 TD","defensiveTouchdowns",1],
  ["m","볼 점유 시간","possessionTime",0],
];
// "4-11"·"1-3" 은 성공/시도 비율로, "2-17"·"9-84" 는 뒤 숫자(잃은 야드)로
// 견줍니다. 시도가 0 이면 견줄 게 없으니 양쪽 다 색을 안 넣습니다.
const GEFF=new Set(["thirdDownEff","fourthDownEff","redZoneAttempts"]);
const GPAIR=new Set(["sacksYardsLost","totalPenaltiesYards"]);
function gnum(n,v){
  if(v==null) return null;
  const s=String(v).trim(), m=s.match(/^(-?\d+)\s*-\s*(-?\d+)$/);
  if(GEFF.has(n)) return (m&&+m[2]>0)?+m[1]/+m[2]:null;
  if(GPAIR.has(n)) return m?+m[2]:null;
  const x=Number(s.replace(/,/g,""));
  return Number.isFinite(x)?x:null;
}
// ESPN 약어 두 개가 nflverse 와 다릅니다. 로고 파일도 nflverse 이름입니다.
const ESPN2NFL={LAR:"LA",WSH:"WAS"};
const boxLogo=ab=>`/photos/logo_${esc(ESPN2NFL[ab]||ab)}.png`;

// 팀 패싱(net)과 선수 패싱(gross)이 안 맞는 이유. 예전에는 팀 표 밑에만
// 있었는데, 이제 두 값이 한 화면에 같이 보이므로 선수 패싱 표 밑에도 답니다.
const BOX_NPN=`<div class="pnote"><b>패싱</b>은 ESPN 의 <b>net</b> 패싱야드입니다 — 색으로 잃은
  야드가 이미 빠져 있습니다. 같은 응답의 선수별 패싱야드는 gross 라
  (프로브에서 잰 예: BUF @ MIA 팀 289 · 선수 306) 선수 기록을 더해서
  이 줄과 맞춰 볼 수 없습니다.</div>`;

// 선수 소표 — [이름, 쓰는 그룹, [열 이름, ESPN key]…, 정렬 기준 key(앞의 것 우선)]
// 수비는 그룹 둘을 선수 이름으로 합칩니다: 태클·색은 defensive 에, INT 는
// interceptions 에 따로 옵니다. 킥/펀트도 같은 이유로 둘을 합칩니다.
// 어시스트 태클(TOT-SOLO)과 FF(forced fumble)는 ESPN 이 주지 않아 열이 없습니다.
const PSECS=[
  ["패싱",["passing"],
   [["C/ATT","completions/passingAttempts"],["야드","passingYards"],
    ["TD","passingTouchdowns"],["INT","interceptions"],["색","sacks-sackYardsLost"]],
   ["passingYards"]],
  ["러싱",["rushing"],
   [["시도","rushingAttempts"],["야드","rushingYards"],["평균","yardsPerRushAttempt"],
    ["TD","rushingTouchdowns"],["최장","longRushing"]],
   ["rushingYards"]],
  ["리시빙",["receiving"],
   [["타겟","receivingTargets"],["캐치","receptions"],["야드","receivingYards"],
    ["TD","receivingTouchdowns"],["최장","longReception"]],
   ["receivingYards"]],
  ["수비",["defensive","interceptions"],
   [["태클","totalTackles"],["솔로","soloTackles"],["색","sacks"],
    ["TFL","tacklesForLoss"],["PD","passesDefended"],["INT","interceptions"]],
   ["totalTackles"]],
  ["킥/펀트",["kicking","punting"],
   [["FG","fieldGoalsMade/fieldGoalAttempts"],["최장","longFieldGoalMade"],
    ["XP","extraPointsMade/extraPointAttempts"],["펀트","punts"],
    ["평균","grossAvgPuntYards"]],
   ["totalKickingPoints","punts"]],
];
// 구울 때 담는 그룹 = 위 표가 쓰는 그룹. 한곳에서 나오므로 갈라지지 않습니다.
const PWANT=new Set([].concat(...PSECS.map(s=>s[1])));

// ESPN 이 안 준 값은 "—" 입니다. 0 과 "없음" 은 다른 것이라 0 은 0 으로 둡니다.
function pval(v){
  const s=(v==null?"":String(v)).trim();
  return (s===""||s==="--"||s==="-")?"—":s;
}
function pnum(v){
  const x=Number(String(v==null?"":v).replace(/,/g,""));
  return Number.isFinite(x)?x:null;
}
// 한 팀의 선수 기록을 {이름: {key: 값}} 으로 모읍니다. 그룹마다 keys 가 같이
// 오므로 열 위치를 세지 않고 key 로 찾습니다. 한 선수가 여러 그룹에 나오면
// (러싱+리시빙, 수비+INT) 한 줄로 합쳐집니다.
function pIndex(pl){
  const by=new Map();
  for(const grp of pl||[]){
    const keys=grp.k||[];
    for(const a of grp.a||[]){
      const nm=(a.n||"").trim();
      if(!nm) continue;
      let row=by.get(nm);
      if(!row){ row={n:nm,v:{},g:new Set()}; by.set(nm,row); }
      row.g.add(grp.g);
      (a.s||[]).forEach((val,i)=>{
        const k=keys[i];
        if(k!=null&&!(k in row.v)) row.v[k]=val;
      });
    }
  }
  return by;
}
let BOXN=0;
const boxUid=()=>"bx"+(++BOXN);
// 접이식 칸 하나. 여는 상태는 여기서 정하고, 게임을 바꾸면 부르는 쪽이
// innerHTML 을 새로 그리므로 접힘은 저절로 처음 상태로 돌아갑니다 —
// 코치 경력 표와 같은 방식이라 따로 기억해 둘 것이 없습니다.
// lbl 을 주면 제목 대신 그 HTML 을 씁니다(팀 로고·약어처럼 이미 만든 조각).
// 부르는 쪽이 esc 를 끝낸 문자열만 넘깁니다.
function boxSec(title,body,open,cnt,lbl){
  const id=boxUid();
  return `<div class="bsec"><div class="bsh" role="button" tabindex="0"
      aria-expanded="${open?"true":"false"}" aria-controls="${id}">
      <span class="bchev" aria-hidden="true">▸</span><span class="blb">${lbl||esc(title)}</span>
      ${cnt?`<span class="bcnt">${esc(cnt)}</span>`:""}</div>
    <div class="bsb${open?"":" off"}" id="${id}">${body}</div></div>`;
}
function boxToggle(h){
  const open=h.getAttribute("aria-expanded")==="true";
  h.setAttribute("aria-expanded",String(!open));
  const b=document.getElementById(h.getAttribute("aria-controls"));
  if(b) b.classList.toggle("off",open);
}
// 리스너는 담는 칸에 한 번만 답니다 — 그릴 때마다 달면 쌓입니다.
function boxBind(root){
  if(!root||root.getAttribute("data-boxbound")) return;
  root.setAttribute("data-boxbound","1");
  const hit=e=>e.target.closest&&e.target.closest(".bsh");
  root.addEventListener("click",e=>{ const h=hit(e); if(h) boxToggle(h); });
  root.addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ") return;
    const h=hit(e);
    if(h){ e.preventDefault(); boxToggle(h); }
  });
}
function pTable(idx,sec){
  const cols=sec[2], gs=new Set(sec[1]);
  const rows=[...idx.values()].filter(r=>{
    for(const g of r.g) if(gs.has(g)) return true;
    return false;
  });
  if(!rows.length) return "";
  // 그 표의 주된 야드·횟수 열 내림차순. 그 값이 없는 선수는 뒤로 보내고,
  // 같으면 이름순 — 다시 그려도 순서가 흔들리지 않게 합니다.
  const sv=r=>{
    for(const k of sec[3]){ const n=pnum(r.v[k]); if(n!=null) return n; }
    return -Infinity;
  };
  rows.sort((a,b)=>sv(b)-sv(a)||a.n.localeCompare(b.n));
  const tpl=`minmax(0,1fr) repeat(${cols.length},2.7em)`;
  const head=`<div class="ptr pthr"><span class="pnm"></span>`
    + cols.map(c=>`<span class="ptd">${esc(c[0])}</span>`).join("")+`</div>`;
  const body=rows.map(r=>`<div class="ptr"><span class="pnm">${esc(r.n)}</span>`
    + cols.map(c=>`<span class="ptd">${esc(pval(r.v[c[1]]))}</span>`).join("")
    + `</div>`).join("");
  return `<div class="ptbl" style="--ptpl:${tpl}">${head}${body}</div>`
    + (gs.has("passing")?BOX_NPN:"");
}
// 선수 스탯 칸 — 원정 먼저, 그다음 홈. 접는 단위는 팀 하나입니다: 팀을 펴면
// 그 팀의 표(패싱·러싱·리시빙·수비·킥/펀트)가 제목과 함께 한꺼번에 나옵니다.
// 표마다 따로 접던 한 단계는 없앴습니다 — 한 팀을 보려고 다섯 번 누르게
// 되기 때문입니다. 기록이 아예 없으면 빈 문자열을 주고, 부르는 쪽은 그때 칸
// 자체를 만들지 않습니다(빈 표를 두지 않습니다).
function boxPlayers(teams){
  let out="";
  for(const t of teams){
    if(!t) continue;
    const idx=pIndex(t.pl);
    if(!idx.size) continue;
    let grps="";
    for(const sec of PSECS){
      const tbl=pTable(idx,sec);
      if(tbl) grps+=`<div class="pgrp"><div class="pgh">${esc(sec[0])}</div>${tbl}</div>`;
    }
    if(!grps) continue;
    const lbl=`<img src="${boxLogo(t.ab)}" alt="" onerror="this.style.visibility='hidden'">`
      + `<b>${esc(t.ab)}</b><small>${t.ha==="home"?"HOME":"AWAY"}</small>`;
    out+=`<div class="pteam">${boxSec(t.ab,grps,false,null,lbl)}</div>`;
  }
  return out;
}
// 팀 머리. gthr 를 주면 한 겹 더 감쌉니다 — 주차별 자료는 그 선으로 라벨과
// 머리를 맞추고, 편집 화면은 감싸지 않습니다.
function boxHead(g,abA,abH,gthr){
  const th=(sd,ab,who)=>`<span class="gth${sd&&sd.w?" w":""}">
    <img src="${boxLogo(ab)}" alt="" onerror="this.style.visibility='hidden'">
    <b>${esc(ab)}</b><i>${g&&g.done?esc((sd||{}).sc||"–"):"–"}</i>
    <small>${who}</small></span>`;
  const inner=th(g&&g.away,abA,"AWAY")+th(g&&g.home,abH,"HOME");
  return `<div class="ghead">${gthr?`<span class="gthr">${inner}</span>`:inner}</div>`;
}
// 팀 기록 표. 줄과 순서는 GROWS 가 정하고 숫자는 응답이 정합니다 — name 으로
// 항목을 찾아 그 항목의 displayValue 를 그대로 찍습니다. "4-11"·"26:31" 처럼
// 이미 서식이 잡혀 오는 값을 value 로 다시 만들면 서식이 깨지고, 애초에
// value 는 totalYards·turnovers 에서 "-" 로 오는 일이 잦아 못 믿습니다.
function boxTeamTab(A,H){
  const mk=t=>{const m=new Map();((t||{}).stats||[]).forEach(s=>{if(!m.has(s.n))m.set(s.n,s)});return m};
  const ma=mk(A), mh=mk(H), used=new Set();
  let rows="";
  for(const [lv,lb,n,dir] of GROWS){
    const a=ma.get(n), h=mh.get(n);
    if(!a&&!h) continue;                 // 응답에 아예 없는 줄은 접습니다
    used.add(n);
    const va=gnum(n,a&&a.v), vh=gnum(n,h&&h.v);
    let ca="",ch="";
    if(dir&&va!=null&&vh!=null&&va!==vh){ if((va>vh)===(dir>0)) ca="on"; else ch="on"; }
    rows+=`<div class="gr lv-${lv}"><span class="gl">${esc(lb)}</span>
      <span class="gv ${ca}">${esc(a?a.v:"—")}</span>
      <span class="gv ${ch}">${esc(h?h.v:"—")}</span></div>`;
  }
  // 표가 못 받아 준 항목은 label 그대로 아래에 붙입니다. 목록은 엔드포인트가
  // 문서화돼 있지 않아 언제든 늘어날 수 있다는 전제로 만듭니다.
  const ex=[];
  for(const s of [...((A||{}).stats||[]),...((H||{}).stats||[])])
    if(!used.has(s.n)&&!ex.some(e=>e.n===s.n)) ex.push(s);
  if(ex.length) rows+=`<div class="gr xhd"><span class="gl">
      표에 없는 항목 — ESPN 이 새로 넣었거나 이름이 바뀐 것</span><span></span><span></span></div>`
    + ex.map(s=>`<div class="gr lv-m"><span class="gl">${esc(s.lb||s.n)}</span>
        <span class="gv">${esc((ma.get(s.n)||{}).v??"—")}</span>
        <span class="gv">${esc((mh.get(s.n)||{}).v??"—")}</span></div>`).join("");
  return `<div class="gtab">${rows}</div>`;
}
// 박스스코어 한 장 = 팀 머리 + 접이식 두 칸(팀 스탯 펴짐 · 선수 스탯 접힘).
// box 가 비었는지는 부르는 쪽이 먼저 봅니다 — 빈 상태 문구가 화면마다 다릅니다.
function boxHTML(g,box,opt){
  opt=opt||{};
  const A=box.find(t=>t.ha==="away")||box[0], H=box.find(t=>t.ha==="home")||box[1];
  const abA=(A&&A.ab)||((g&&g.away&&g.away.ab)||""), abH=(H&&H.ab)||((g&&g.home&&g.home.ab)||"");
  const players=boxPlayers([A,H]);
  const secs=boxSec("팀 스탯",boxTeamTab(A,H)+BOX_NPN,true,null)
    + (players?boxSec("선수 스탯",players,false,"원정 · 홈"):"");
  return boxHead(g,abA,abH,!!opt.gthr)+`<div class="bsecs">${secs}</div>`;
}
// 실시간 응답 → 구운 자료와 같은 모양. boxscore.players[] 는 teams[] 와 따로
// 오고 homeAway 가 비어 있어서(확인: null) 팀 약어로 맞춥니다 — 순서를 믿고
// 자리로 짝지으면 ESPN 이 순서를 바꾸는 날 원정·홈이 뒤집힙니다.
function boxNorm(x){
  const bs=(x||{}).boxscore, ts=bs&&bs.teams;
  if(ts){
    const pm=new Map();
    for(const p of (bs.players||[])){
      const ab=((p.team||{}).abbreviation)||"";
      const gl=[];
      for(const grp of p.statistics||[]){
        if(!PWANT.has(grp.name)) continue;
        const ath=[];
        for(const a of grp.athletes||[]){
          const nm=((a.athlete||{}).displayName||"").trim();
          if(nm) ath.push({n:nm,s:a.stats});
        }
        if(ath.length) gl.push({g:grp.name,k:grp.keys,a:ath});
      }
      if(ab) pm.set(ab,gl);
    }
    return ts.map(t=>({ab:t.team.abbreviation,ha:t.homeAway,
      stats:(t.statistics||[]).map(s=>({n:s.name,v:s.displayValue,lb:s.label})),
      pl:pm.get(t.team.abbreviation)||[]}));
  }
  return Array.isArray(x)?x:null;
}

// 리뷰 칸 — 빌드 때 박아 둔 HTML 만 씁니다. 없으면 조용히 빈 상태를 둡니다.
// 여기서 글을 지어내거나 어디선가 받아 오는 일은 없습니다.
function paneReview(box,hd,label,html){
  if(!box) return;
  if(hd) hd.textContent=label||"";
  box.innerHTML=html||`<div class="rvnone">이 경기의 리뷰는 아직 없습니다.</div>`;
  if(html&&typeof ytActivate==="function") ytActivate(box);   // 반복 클립 켜기
}
// 박스스코어 칸. 표가 있으면 boxHTML, 없으면 그 이유를 적은 빈 상태입니다.
// 접기 배선(boxBind)은 표를 새로 그릴 때마다 한 번만 답니다.
function paneBox(box,g,bx,opt){
  if(!box) return;
  opt=opt||{};
  if(bx&&bx.length){ box.innerHTML=boxHTML(g,bx,opt); boxBind(box); return; }
  const head=(g&&opt.head!==false)?boxHead(g,(g.away||{}).ab||"",(g.home||{}).ab||"",true):"";
  box.innerHTML=head+`<div class="gnote">${esc(opt.note||"이 경기의 박스스코어가 없습니다.")}</div>`;
}

// ── 경기 결과 ─────────────────────────────────────────────────────────────
// 표를 그리는 일은 BOX_JS 가 맡습니다(boxHTML·boxHead·boxNorm·boxBind).
// 여기 남은 것은 이 페이지에만 있는 것들 — 주 고르기, 경기 목록, 리뷰입니다.
const GAPI="https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const G=(typeof window.NFL_GAMES!=="undefined")?window.NFL_GAMES:null;
const WEEKS=(G&&Array.isArray(G.weeks))?G.weeks:[];

// 실시간 응답과 구운 자료를 한 모양으로 맞추는 일(boxNorm)도 BOX_JS 에 있습니다.
function gRow(ev){
  const c=ev.competitions[0], st=ev.status.type, sd={};
  c.competitors.forEach(x=>sd[x.homeAway]=x);
  if(!sd.home||!sd.away) return null;
  const one=x=>({ab:x.team.abbreviation,sc:x.score,w:!!x.winner});
  const r={id:ev.id,date:ev.date,wk:(ev.week||{}).number,st:st.state,
    done:!!st.completed,lb:st.shortDetail||st.detail,
    away:one(sd.away),home:one(sd.home)};
  // 대진이 아직 안 정해진 포스트시즌 자리는 목록에서 뺍니다.
  return (r.away.ab==="TBD"||r.home.ab==="TBD")?null:r;
}

// 세션 캐시. 한 번 받은 주·경기는 다시 안 부릅니다.
// sessionStorage 는 file:// 에서 막히는 브라우저가 있어 되면 쓰고 아니면 맙니다.
const GMEM=new Map();
function gStore(k,v){ try{sessionStorage.setItem("nflg:"+k,JSON.stringify(v))}catch(e){} }
function gLoad(k){ try{return JSON.parse(sessionStorage.getItem("nflg:"+k)||"null")}catch(e){return null} }

// 실시간이 먼저, 구운 자료는 예비입니다 — 그 반대가 아닙니다.
// 다만 2026-08 현재 ESPN 앞단(Akamai)이 브라우저에서 온 요청을 403 으로
// 끊습니다. curl·python 은 200 인데 브라우저만 막혀서, 실제로는 구운 자료가
// 늘 쓰입니다. 그래서 한 번 막히면 그 세션에서는 더 두드리지 않습니다 —
// 주나 경기를 누를 때마다 실패할 요청을 보내 봐야 콘솔만 더럽히고 느려집니다.
let gLive=true;
async function gFetch(url,key){
  const hit=GMEM.get(key)||gLoad(key);
  if(hit){ GMEM.set(key,hit); return hit; }
  if(!gLive) return null;
  try{
    const r=await fetch(url,{cache:"no-store"});
    if(r.ok){ const j=await r.json(); GMEM.set(key,j); gStore(key,j); return j; }
  }catch(e){}
  gLive=false;                          // 차단은 경기별이 아니라 출처 전체입니다
  return null;
}

let widx=-1, GLIST=[], GSRC="", gSel=null;
// 킥오프는 UTC 로 오는데 그대로 잘라 쓰거나 보는 사람 시간대로 바꾸면 날짜가
// 하루 밀립니다 (11/09 18:00Z 경기가 한국에서는 11/10). NFL 경기 날짜는 미국
// 동부 기준이라 거기에 맞춥니다.
// 목록의 날짜는 M/D 로 줄입니다. 보드에서 쓰던 en-CA 는 같은 옵션으로
// "08-27" 을 내놓는데, 좁아진 목록 칸에서는 그 8px 이 줄바꿈을 만듭니다.
// 시간대와 값은 그대로고 표기만 짧아집니다.
function gWhen(iso){
  const d=new Date(iso);
  if(isNaN(d)) return "";
  try{ return d.toLocaleDateString("en-US",{timeZone:"America/New_York",
    month:"numeric",day:"numeric"}); }
  catch(e){ return String(iso).slice(5,10); }
}
// 아직 안 한 경기는 킥오프 시각을 답니다. ESPN 의 shortDetail("9/13 - 1:00 PM
// EDT")은 목록 칸에 안 들어가서, 같은 값을 같은 시간대로 줄여 적습니다.
// 원문은 title 로 남겨 마우스를 올리면 그대로 보입니다.
function gKick(iso){
  const d=new Date(iso);
  if(isNaN(d)) return "";
  try{ return d.toLocaleString("en-US",{timeZone:"America/New_York",
    month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit",hour12:false})
    .replace(",",""); }
  catch(e){ return gWhen(iso); }
}

function gListHTML(){
  if(!GLIST||!GLIST.length) return `<div class="gnote">이 주의 경기 목록이 없습니다.</div>`;
  return GLIST.map(g=>{
    const sd=t=>`<span class="gs${t.w?" w":""}"><img src="${boxLogo(t.ab)}" alt=""
        onerror="this.style.visibility='hidden'"><b>${esc(t.ab)}</b>
        <i>${g.done?esc(t.sc):"–"}</i></span>`;
    const meta=g.done?gWhen(g.date):gKick(g.date);
    return `<div class="grow" role="button" tabindex="0" data-g="${esc(g.id)}"
        aria-pressed="${g.id===gSel}">${sd(g.away)}<span class="gat">@</span>${sd(g.home)}
      <span class="gw" title="${esc(g.lb||"")}">${esc(meta)}</span></div>`;
  }).join("");
}

// 팀 머리(boxHead)와 표 두 칸(boxHTML)은 BOX_JS 에 있습니다.

// 리뷰는 빌드 때 박아 둔 HTML 입니다. 없으면 조용히 비웁니다 — 여기서 문장을
// 지어내거나 어디선가 받아 오는 일은 없습니다.
// 칸을 채우는 일은 PANE_JS(content_render.py)가 맡습니다 — 보드의 주차별
// 성적 탭도 같은 함수를 부릅니다. 여기 남은 것은 이 페이지의 요소 이름뿐입니다.
function gReview(g){
  paneReview(document.getElementById("rvw"),document.getElementById("rvhd"),
             g?`${g.away.ab} @ ${g.home.ab}`:"",g?REVIEWS[g.id]:null);
}

async function gShow(id){
  gSel=id;
  syncHash(id);
  const g=(GLIST||[]).find(x=>x.id===id);
  const main=document.getElementById("gbox");
  if(!main) return;
  document.querySelectorAll(".grow").forEach(b=>
    b.setAttribute("aria-pressed",String(b.dataset.g===id)));
  gReview(g);
  if(!g){ main.innerHTML=`<div class="gnote">경기를 고르세요.</div>`; return; }
  if(!g.done){
    main.innerHTML=boxHead(g,g.away.ab,g.home.ab,true)
      + `<div class="gnote">${esc(g.lb||"")} · 아직 하지 않은 경기라
        기록이 없습니다.</div>`;
    return;
  }
  main.innerHTML=`<div class="gnote">불러오는 중…</div>`;
  // 실시간이 먼저, 구워 둔 자료가 예비입니다 — 순서는 보드에 있던 그대로입니다.
  let box=boxNorm(await gFetch(`${GAPI}/summary?event=${encodeURIComponent(id)}`,"box:"+id));
  if(!box && G && G.box && G.box[id]) box=boxNorm(G.box[id]);
  if(gSel!==id) return;                  // 그 사이 다른 경기를 눌렀으면 버립니다
  main.innerHTML = box ? boxHTML(g,box,{gthr:true})
    : `<div class="gnote">기록을 받지 못했습니다 — ESPN 에 닿지 않고
        games.js 에도 이 경기가 없습니다.</div>`;
  // 접기 배선은 칸에 한 번만 답니다. 경기를 바꾸면 위에서 innerHTML 을 새로
  // 그리므로 접힘은 저절로 처음 상태(팀 스탯 펴짐·선수 스탯 접힘)로 돌아갑니다.
  boxBind(main);
}

// 한 주를 엽니다. 실시간 스코어보드가 그 주를 주면 그걸 쓰고, 아니면 구워 둔
// 목록을 씁니다 — 보드에 있던 순서 그대로입니다.
async function gWeek(i){
  widx=i;
  const w=WEEKS[i];
  if(!w) return;
  const ls=document.getElementById("glist"), hd=document.getElementById("ghd");
  GLIST=(w.games||[]).slice(); GSRC="baked";
  const live=await gFetch(
    `${GAPI}/scoreboard?dates=${encodeURIComponent(G.season)}`
    +`&seasontype=${w.st}&week=${w.wk}`,`sb:${w.st}:${w.wk}`);
  if(widx!==i) return;                   // 그 사이 다른 주를 골랐으면 버립니다
  const rows=((live||{}).events||[]).map(gRow).filter(Boolean);
  if(rows.length){ GLIST=rows; GSRC="live"; }
  GLIST.sort((a,b)=>String(a.date).localeCompare(String(b.date))||
                    String(a.id).localeCompare(String(b.id)));
  // 그 주에서 마지막으로 끝난 경기를 먼저 엽니다. 하나도 안 끝났으면 첫 경기.
  const done=GLIST.filter(g=>g.done);
  gSel=(done.length?done[done.length-1]:GLIST[0]||{}).id||null;
  if(hd) hd.innerHTML=`경기<em>${esc(w.lb)} · ${GLIST.length}경기</em>`;
  if(ls) ls.innerHTML=gListHTML();
  gShow(gSel);
}

// ── 딥링크 (/weekly/#g=<경기 id>) ────────────────────────────────────────
// 정적 사이트라 질의 문자열 대신 해시를 씁니다. 해시는 기본 선택을 이깁니다 —
// 기본 주를 먼저 열고 나중에 해시를 적용하면 그 사이에 기본 경기가 한 번
// 그려졌다가 바뀌어, 눌러서 들어온 사람이 엉뚱한 경기를 먼저 보게 됩니다.
// 그래서 어느 주를 열지 정하는 단계에서 해시를 먼저 봅니다.
function hashGid(){
  const m=/[#&]g=([A-Za-z0-9_-]+)/.exec(location.hash||"");
  return m?m[1]:null;
}
function weekOfGame(gid){
  for(let i=0;i<WEEKS.length;i++)
    if((WEEKS[i].games||[]).some(g=>String(g.id)===String(gid))) return i;
  return -1;
}
function hashNote(msg){
  const box=document.getElementById("wcols");
  if(!box||!msg) return;
  const d=document.createElement("div");
  d.className="hashnote";
  d.textContent=msg;
  box.parentNode.insertBefore(d,box);
}
// 화면에 보이는 경기를 주소에 적습니다. 누를 때마다 방문 기록을 남기면
// 뒤로 가기가 한 경기씩 되짚게 되므로 replaceState 를 씁니다.
function syncHash(gid){
  if(!gid) return;
  try{ history.replaceState(null,"",`${location.pathname}#g=${gid}`); }catch(e){}
}

const wsel=document.getElementById("week"), wsub=document.getElementById("wsub");
if(!WEEKS.length){
  document.getElementById("wcols").innerHTML=
    `<div class="pending">경기 자료가 아직 없습니다 —
      build_depthcharts.py --games 로 games.js 를 구우면 채워집니다.</div>`;
}else{
  wsel.innerHTML=WEEKS.map((w,i)=>`<option value="${i}">${esc(w.lb)}</option>`).join("");
  // 기본 = 결과가 있는 마지막 주. games.js 가 구울 때 정해 둔 값을 먼저 보고,
  // 없으면 여기서 다시 찾습니다.
  let def=-1;
  if(G.cur) def=WEEKS.findIndex(w=>w.st===G.cur.st&&w.wk===G.cur.wk);
  if(def<0) for(let i=0;i<WEEKS.length;i++)
    if((WEEKS[i].games||[]).some(g=>g.done)) def=i;
  if(def<0) def=0;
  // 해시가 있으면 그 경기가 든 주로 시작합니다(기본값을 덮어씁니다).
  const want=hashGid();
  let wantIdx=-1;
  if(want){
    wantIdx=weekOfGame(want);
    if(wantIdx>=0) def=wantIdx;
    else hashNote(`주소가 가리킨 경기(${want})를 찾지 못해 기본 화면을 엽니다.`);
  }
  wsel.value=String(def);
  if(wsub) wsub.textContent=`${G.season} 시즌`+(G.stamp?` · 자료 ${G.stamp}`:"");
  wsel.onchange=()=>gWeek(+wsel.value);
  // 주를 연 뒤 해시가 가리킨 경기를 고릅니다 — gWeek 이 정한 기본 경기를
  // 이깁니다. gWeek 은 비동기라 반드시 그 뒤에 걸어야 합니다.
  gWeek(def).then(()=>{ if(wantIdx>=0) gShow(want); });
  // 이미 열려 있는 페이지에서 해시만 바뀌는 경우(뒤로/앞으로, 같은 페이지를
  // 가리키는 링크)는 문서를 새로 읽지 않으므로 위 초기화가 다시 돌지 않습니다.
  // 그래서 해시 변화를 따로 듣습니다. 우리가 syncHash 로 바꾼 것은 이미 그
  // 경기를 보고 있는 상태라 아무 일도 하지 않습니다.
  addEventListener("hashchange",()=>{
    const gid=hashGid();
    if(!gid||String(gid)===String(gSel)) return;
    const i=weekOfGame(gid);
    if(i<0){ hashNote(`주소가 가리킨 경기(${gid})를 찾지 못했습니다.`); return; }
    if(+wsel.value===i){ gShow(gid); return; }
    wsel.value=String(i);
    gWeek(i).then(()=>gShow(gid));
  });
}

// 목록 클릭은 칸에 위임합니다 — 목록을 다시 그려도 배선이 안 끊깁니다.
const wcols=document.getElementById("wcols");
wcols.addEventListener("click",e=>{
  const r=e.target.closest&&e.target.closest(".grow");
  if(r) gShow(r.dataset.g);
});
wcols.addEventListener("keydown",e=>{
  const r=e.target.closest&&e.target.closest(".grow");
  if(r&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); gShow(r.dataset.g); }
});
</script>
