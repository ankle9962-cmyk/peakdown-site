const REVIEWS={"401872656":"<p>NFL 26시즌의 개막전이 드디어 시작되었고, 그 첫 매치업은 지난해 슈퍼볼에서 맞붙었던 시애틀 시호크스와 뉴잉글랜드 페이트리어츠의 게임이었다. 경기 중에 시애틀 시호크스의 쿼터백 샘 다놀드가 부상당하고, 페이트리어츠에서는 팀의 에이스역할을 해줄거라는 기대감으로 영입한 와이드리시버 AJ 브라운이 부상을 당해 경기를 떠나면서 어느정도 김이 빠진채로 시작한 게임은, 마지막 순간 드레이크 메이의 실수로 페이트리어츠의 패배로 끝이 났다(시애틀 13-10 뉴잉글랜드).<\/p><p>시애틀 시호크스의 수비는 여전히 압도적인 모습을 보여주며 승리의 1등 공신이 되었다. 마이크 맥도널드는 슈퍼볼을 우승하였음에도 자신이 최고라는 것을 증명하는 걸 멈출 생각이 없어보인다. 시애틀 시호크스 수비는 올해도 작년과 동일하게 1) 다수의 2선 수비 기용 2) 최후방을 두껍게 3) 강력한 1선 수비선수들의 로테이션으로 '러닝을 막는다'라는 원칙을 들고 나와서 상대의 공격에게 오로지 짧은 패스만을 하게 만들었다. 이런 플레이는 상대방 쿼터백에게 굉장히 큰 인내력을 요구한다. 비유가 적합할지 모르겠지만 절대 큰 스윙을 못 휘두르게 하고 경기 내내 번트만 대게끔 강요하는 모양새인데, 결국 상대 쿼터백이 참지못하고 모험을 시도할 때 마이크 맥도날드의 수비수들은 그 플레이를 낚아채 버렸다. 이런 수비 시스템에서 2선 수비의 다재다능함이 중요하다. 최후방도 지키면서, 러닝수비도 지원해야 하고, 태클도 잘해야 한다. 개막전이라는 어수선한 상황과 시애틀 시호크스 2선 수비 선수진이 꽤 바뀌었음에도 퍼포먼스가 유지되었다는 점이 인상적이다. 마이크 맥도날드의 클래스가 느껴진다.<\/p><p>반면 페이트리어츠의 입장에서는 드레이크 메이가 0커리어 최악의 경기를 펼쳤다는 것이 아쉽다. 지난해 플레이오프에서 강한 수비들과 맞설때 성적이 급감하는 모습을 보였는데, 이번 경기에서 또 한번 그런 모습을 보이면서, 작년의 호성적은 쉬웠던 스케줄의 영향이 컸다는 혹평을 부정하기 힘들어졌다. 지난해 플레이오프와 비교해 이번 경기의 패배가 더욱 아쉬운 점은, 페이트리어츠의 오라인이 패스 블로킹 측면에서 지난해처럼 끔찍하지는 않았다는 것이다. 경기가 끝날 때까지 참을성이 부족했고 체크다운(짧은 패스)만 하는 것에 질려버려서 욕심을 낸것이 두고두고 아쉬울 것이다(드레이크 메이도 인터부에서 언급했다). 모든 인터셉션이 4쿼터에 있었는데 승부가 아슬아슬해지자 '내가 해줘야 한다'라는 조급함에 일을 그르친 것 아닐까. 인터셉션이 된 플레이를 보면 체크다운 옵션(러닝백) 와이드오픈이었음에도 불구하고 모험수를 뒀고, 그게 처절한 실패가 된다.<\/p><div class=\"yt yt-loop\" data-yt-src=\"https://www.youtube-nocookie.com/embed/c7GJROAeY8Y?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=c7GJROAeY8Y&amp;controls=0&amp;modestbranding=1&amp;rel=0&amp;playsinline=1\"><a class=\"yt-poster\" href=\"https://www.youtube.com/watch?v=c7GJROAeY8Y\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"클립 재생\"><img src=\"https://i.ytimg.com/vi/c7GJROAeY8Y/hqdefault.jpg\" alt=\"\" loading=\"lazy\"><span class=\"yt-play\" aria-hidden=\"true\"><\/span><\/a><\/div><p>작년에 드레이크 메이가 엄청난 성장을 했을 때, 성장의 요인으로 침착한 체크다운 플레이, 조급함 없이 자기의 다리로 차근차근 게임을 풀어나갈 수 있다는 점, 상대가 기회를 주면 확실히 받아먹어버리는 노련함이 꼽혔다는 것을 생각하면, 개막전에서 보여준 모습은 상당히 아쉽다.<\/p><p>이번 게임 MOM은 시애틀 시호크스의 1선 수비 #7 느워수이다. 이 팀의 수비가 먹히기 위해서는 강력한 1선의 힘, 특히나 소수의 1선 수비만으로 러닝을 막는게 중요한데 느워수는 그 핵심적인 역할을 했다. 이번 게임에서 러닝이 시작하기도 전에 터뜨려버린 플레이만 3~4개가 된다. 특히나 2ND드라이브에서 신인 타이트엔드를 그냥 박살내버리고는 러닝백까지 태클해버리는 플레이나, 3쿼터에 스크린을 미리 읽고 러닝백을 낚아채버리는 어마어마한 퍼포먼스를 보면, 올해도 시호크스의 수비가 정말 강할 것이라는 확신을 갖게 해준다.<\/p><div class=\"yt yt-loop\" data-yt-src=\"https://www.youtube-nocookie.com/embed/xPzTwLZkDrA?autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=xPzTwLZkDrA&amp;controls=0&amp;modestbranding=1&amp;rel=0&amp;playsinline=1\"><a class=\"yt-poster\" href=\"https://www.youtube.com/watch?v=xPzTwLZkDrA\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"클립 재생\"><img src=\"https://i.ytimg.com/vi/xPzTwLZkDrA/hqdefault.jpg\" alt=\"\" loading=\"lazy\"><span class=\"yt-play\" aria-hidden=\"true\"><\/span><\/a><\/div>","401872657":"<p>이번 주 최고의 매치업이라고 할 수 있는 두 팀간의 매치업이었습니다. 마일스 개릿에 트렌트 맥더피라는 어마어마한 거물들을 데리고 오면서 올해 오프시즌 최고의 기대감을 갖게한 램즈와 지난해 부상에도 불구하고 엄청난 선전을 하고 오프시즌에서 마이크 에반스라는 명전이 유력한 베테랑 리시버를 데리고 오면서 기대감을 모아온 두 디비전 라이벌 간의 매치업이었는데, 49ERS가 램즈를 그야말로 두들겨 패버렸습니다.<\/p><p>27-7이라는 다소 충격적인 결과가 나왔고 49ERS가 부상만 없다면 얼마나 강한팀인지 증명을 해냈습니다.<\/p><p>우선 팀에 새로이 합류한 마이크 에반스의 존재감은 대단했습니다. 감독 카일 섀너핸의 가장 큰 특기는 타이밍에 맞게 공격수들을 필드에 넓게 고루 펼쳐서 (특히나 횡으로 필드를 넓게 쓰면서) 수비들에게 어려움을 선사하는건데, 마이크 에반스라는 선수가 마치 중력이 무거운 물건처럼 수비의 이목을 더 끌 수 있게 되면서 다른 쪽에 공간이 더 극대화될거라는 기대를 했는데 기대대로였던 것 같습니다. 뿐만 아니라 중요한 상황에서, 그의 압도적인 공중볼 싸움능력에도 기대가 컸는데,13년차 베테랑은 팀의 개막전에서 이 능력을 유감없이 보여주었습니다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th class=\"r\">시도<\/th><th class=\"r\">캐치<\/th><th class=\"r\">결과<\/th><\/tr><\/thead><tbody><tr><td>써드다운상황<\/td><td class=\"r\">6<\/td><td class=\"r\">5<\/td><td class=\"r\">퍼스트다운 갱신 4회, 터치다운 1회<\/td><\/tr><tr><td>그 외<\/td><td class=\"r\">1<\/td><td class=\"r\">1<\/td><td class=\"r\">퍼스다운 갱신<\/td><\/tr><tr><td>턴오버<\/td><td class=\"r\">3<\/td><td class=\"r\">0<\/td><td class=\"r\">156<\/td><\/tr><\/tbody><\/table><\/div><p>특히나, 터치다운은 순수 5대5(리시버와 코너백 간 1대1 매치업 누가 더 유리하지 않은 상황)의 공중볼 상황에서 나왔습니다. 마이크 에반스는 수비의 머리속에서 공을 끄집어내며 터치다운을 했고, 경기내내 49ERS는 중요순간에 퀸튼 레이크와의 매치업된 마이크에반스에게 공을 던지는 걸 주저하지 않았습니다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/VlB1JRCr7ic\" title=\"YouTube\"><\/iframe><\/div><p>그 외에 수비쪽에서도 닉 보사와 프레드 워너는 부상이 있었나? 하는 생각이 들 정도로 완벽하게 전성기 폼으로 돌아왔습니다. 프레드 워너는 부상이 있었음에도 중원의 지배자로서 자신이 리그의 모든 미들라인배커보다 적어도 2~3티어는 높은 위치에 있다는걸 증명해주는 업청난 존재감을 보여줬습니다. 그리고, 닉 보사 역시 어마어마했습니다. 현대 NFL 수비에서 엣지러셔의 가치에 대해 확연히 보여줬는데, 경기 시작부터 패스러쉬에서 상대 태클을 던져버리고는 매튜 스태포드를 압박했고, 그 뒤로 러닝게임에서 엄청난 존재감을 드러냈습니다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/ThHuKqM5J-0\" title=\"YouTube\"><\/iframe><\/div><p>개인적으로 닉 보사와 프레드 워너의 러닝게임에서의 존재감이 이 팀의 전체적인 성공에서 정말 중요한 부분이라고 생각합니다. 작년의 49ERS 수비를 떠올려보면 이 팀의 장기는 패스 수비였습니다. 그래서 초반 다운에서 상대의 러닝을 차단하고 패스를 해야만하는 상황 (3RD &amp; LONG)에 위치할 수 있게 한다면, 자신들의 장기를 살린채 수비에 임할 수 있기 때문에 굉장히 유리해지죠.<\/p><p>하지만 이 49ERS측에서 가장 인상적이었던 것은 역시나 카일 섀너핸이 새로이 도입한 카일 유스첵 혹은 조지키틀의 치트 모션 블로킹 이었습니다. 이에 대해서는 영상을 별도로 만들었으니 그를 참고하시는게 더 좋으실겁니다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/b_GXDniQaRg\" title=\"YouTube\"><\/iframe><\/div><p>램즈의 입장에서 생각을 해보자면, 매도 미리 맞는게 낫다 라는 생각을 들게 합니다. 시즌 시작전에 램즈의 기대감은 어마어마한 수준이었습니다. 트렌트 맥더피의 합류로 전년도 이 팀의 유일한 약점이라 생각한 2선수비를 보강하면서 기대감이 상당히 올랐는데, 마일스 개릿이라는 현시점 리그 최강의 선수 중 하나가 합류를 하고, 거기다가 역대 최고의 선수 중하나인 애런 도널드가 은퇴에서 돌아왔다는 것으로, 사람들이 램즈의 슈퍼볼 진출은 따놓은 당상이라는 취급을 하는 지경에까지 이르렀죠. 그런데 시즌 첫 경기에서 호되게 맞으면서 오히려 정신을 바짝 차리게 되는 계기가 될 것이라고 생각합니다. 마일스 개릿의 폼 저하나, 여러 다른 걱정거리들은 기우일 것 같습니다(시즌 첫경기이기도 합니다). 저는 램즈가 진짜 주의깊게 보아야 할 점이 '3RD &amp; LONG 즉 순수 패스만을 해야하는 상황에서의 대응'인 것 같습니다.<\/p><p>이는 사실 지난시즌부터 음? 하고 의문점이 생기게 하는 부분이었습니다. 워낙 1ST 다운과 2ND다운상황에서 효율적인 팀이라 3RD &amp; LONG 즉 패스를 해야하는 상황에 위치하는 경우가 굉장히 적은데, 이 상황에 위치할 때 여러 성적들이 뚝 떨어지는 경향이 있습니다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th class=\"r\">시도<\/th><th class=\"r\">갱신율<\/th><\/tr><\/thead><tbody><tr><td>써드&amp;LONG 상황<\/td><td class=\"r\">70 (1위-최소)<\/td><td class=\"r\">27.1% (16위)<\/td><\/tr><\/tbody><\/table><\/div><p>그리고 이번 게임에서도 이런 결과들이 유사하게 벌어졌습니다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th class=\"r\">시도<\/th><th class=\"r\">갱신회수<\/th><th class=\"r\">특이사항<\/th><\/tr><\/thead><tbody><tr><td>써드&amp;LONG 상황<\/td><td class=\"r\">4회<\/td><td class=\"r\">1회<\/td><td class=\"r\">인터셉션 1회, 패스실패 2회<\/td><\/tr><\/tbody><\/table><\/div><p>아무래도 팀의 컨셉 자체가 러닝과 거기서 나오는 플레이액션을 기반으로 설계가 되다보니까 나오는 결과물일 수 있습니다. 이런 경우에 팀의 에이스 쿼터백인 매튜 스태포드에게 강하게 기대야하는데, 과연 88년생의 매튜 스태포드가 그런 상황을 잘 해결하는 모습을 보여줄 수 있을지, 시즌동안 주의깊게 지켜보시죠.<\/p>","401872658":"<p>애틀랜타 팰컨스는 쿼터백들이 연거푸 부상을 당하면서 팀의 3번재 쿼터백인 쿠퍼 러쉬를 내보냈다. 스틸러스도 노장인 애런 로저스가 새로운 감독 아래에서 뛰기에, 양 팀다 1주차에 화끈한 공격력을 보여줄 거라 예상되지는 않았고, 그 기대에 맞게 공격쪽에서의 큰 임팩트는 없는 경기였다. 공격에서 임팩트가 없는 것뿐만이 아니었다. 양팀 합쳐서 16개의 반칙을 냈을 정도로 경기력 자체가 날이 서있지 않았다. 경기 초반 팰컨스의 러닝백 비잔 로빈슨이 짧은 패스를 터치다운으로 연결하면서 팰컨스가 순항하는 듯했지만, 피츠버그 스틸러스의 베테랑들이 어마어마한 경기력을 보여주면서 게임을 뒤집어 엎어버리고 끝내버렸다.<\/p><p>팰컨스 입장에서 가장 인상적이었던 것은 두말할 것 없이 러닝백 비잔 로빈슨이었다. 팰컨스의 팬들은 쿼터백을 아예 믿을 수 없는 상황에서 '그래 이번시즌 믿을건 비잔 로빈슨 밖에 없다' 라고 생각했을 것인데, 그 생각대로의 모습을 보여주었다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>러닝시도<\/th><th class=\"r\">러닝야드<\/th><th class=\"r\">시도당 러싱야드<\/th><th class=\"r\">캐치<\/th><th class=\"r\">리시빙야드<\/th><th class=\"r\">리시빙터치다운<\/th><\/tr><\/thead><tbody><tr><td>21<\/td><td class=\"r\">83<\/td><td class=\"r\">4.0<\/td><td class=\"r\">8<\/td><td class=\"r\">90<\/td><td class=\"r\">1<\/td><\/tr><\/tbody><\/table><\/div><p>특히나, 어린 크리스챤 맥캐프리 라는 비유가 있듯이 패스게임에서 강점이 워낙 있는 선수라는 분석에 맞게 이번 게임 패싱게임에서도 어마어마한 모습을 보여주었다. 순간적으로 열린 공간에서 공을 받은 다음, 비쟌 로빈슨이 보여주는 스피드와 가속능력은 경이로울 정도인데, 어쩌면 짧은 공간에서 이뤄지는 패스를 빅플레이로 연결하는 능력이 비쟌 로빈슨의 가장 강한 점일수도 있겠다는 생각도 든다.<\/p><p>--- 스크린플레이 ---<\/p><p>다만, 이런 열린 공간에서의 움직임이 그의 진정한 장기라는데서 걱정 아닌 걱정도 든다. 러닝백이 그팀의 가장 중요한 공격 옵션이라 한다면 내곽을 통한 러닝으로 상대 수비에게 알고도 못막는 무력함을 반드시 선사해야하는데, 비쟌 로빈슨은 이러한 점이 확실히 덜하다. 물론 아래 리그의 다른 특급 러닝백들과 비교표에서 볼 수 있듯 그런 플레이를 효과적으로 못하는 것은 아니나, 내곽을 노리는 경향성 자체는 훨씬 덜하다. 이는 앞서 걱정 아닌 걱정이라 말했듯, 비쟌 로빈슨이라는 특급 러닝백의 기준에 맞춰서 살펴보는 다소 엄격한 기준을 들이댄 것이고, 이미 걱정할 것 투성이인 팰컨스의 팬들이 비쟌 로빈슨을 걱정하지는 않을 것이다.<\/p><p>&lt;25시즌 러닝 성적 비교&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>선수이름<\/th><th class=\"r\">내곽 러닝 시도 비중<\/th><th class=\"r\">내곽 러닝 시도당 야드<\/th><th class=\"r\">실패한 시도 비중<\/th><\/tr><\/thead><tbody><tr><td>비쟌 로빈슨<\/td><td class=\"r\">32%<\/td><td class=\"r\">5.14<\/td><td class=\"r\">13%<\/td><\/tr><tr><td>조나단 테일러<\/td><td class=\"r\">64%<\/td><td class=\"r\">4.39<\/td><td class=\"r\">14%<\/td><\/tr><tr><td>데릭 헨리<\/td><td class=\"r\">46%<\/td><td class=\"r\">4.52<\/td><td class=\"r\">15%<\/td><\/tr><tr><td>크리스챤 맥캐프리<\/td><td class=\"r\">53%<\/td><td class=\"r\">4.31<\/td><td class=\"r\">13%<\/td><\/tr><tr><td>자미어 깁스<\/td><td class=\"r\">42%<\/td><td class=\"r\">5.03<\/td><td class=\"r\">15%<\/td><\/tr><\/tbody><\/table><\/div><p>반면 스틸러스의 경우에는 수비에서 베테랑 듀오가 회춘하였다. 내곽 수비 라인맨인 89년생 캠 헤이워드는 어떻게 된게 30대 후반이 될수록 더 잘해지나? 하는 생각이 들 정도의 모습을 보여주었다. 한 가운데에서 러닝을 막는 걸 넘어서서 베테랑의 영리한 판단력을 보여주었는데, 쇄도를 하는 와중에 쿼터백의 움직임을 살피다가 패스 타이밍에 맞춰 손을 뻗어서 공을 쳐내는 능력은 가히 발군이다(전년도 공동 3위). 이번 경기에서도 그러한 모습을 3번이나 보여주면서 자신의 클라스를 보여주었다.<\/p><p>그리고 스틸러스 팬들 입장에서 가장 기쁠만한 소식은 역시나 TJ 왓의 부활이었다. 부상과 노화로 인해 이제 0티어 엣지러셔에서는 다소 내려왔다는 평가를 듣기 시작한 TJ 왓이었는데, 이번 경기에서 쌕을 2번, 태클 포어 로스 (시작선 뒤에서 태클) 3회, QB 히트 2회를 기록하면서 전성기 폼을 회복하는 모습을 보였다. 상대가 스크린하려는 패스를 날아서 손으로 낚아채어 인터셉션을 만들고 그걸 터치다운으로 연결하는 플레이를 보니, 왓 가문의 혈통인자가 있구나 라는 생각이 든다.<\/p><p>수비에서 굉장히 특이하고 앞으로도 주목할만한 포인트는 바로 닉 헐빅을 미들라인배커로 기용했다는 것이다. 닉 헐빅은 알렉스 하이스미스 - TJ 왓의 백업역할을 해줬던 선수로 왓이 부상으로 결장했을 때 한번씩 나와서 꽤나 인상적인 모습을 많이 보였는데, 새로운 스틸러스의 감독과 코치진은 그를 전혀 다른 포지션으로 기용하였다. 물론 스틸러스의 미들라인배커진형이 굉장히 단단해지긴 했는데, 그의 강력한 쇄도 능력을 너무 희생하는건 아닐까 하는 걱정도 있다. 이 부분이 어떤식으로 풀어나가게 될지 굉장히 궁금하다.<\/p>","401872659":"<p>올해 AFC에서 가장 강한 팀 중 하나로 예상되는 볼티모어 레이븐스와 전년도 부상으로 꿈과 희망이 무너졌던 인디애나폴리스 콜츠의 1주차 경기는, 레이븐스가 왜 자신들이 리그의 가장 강한 팀 중 하나로 불리는지를 보여주며 압도적으로 승리한 게임이 되었다.<\/p><p>경기를 보고 느낀 것은 와... 레이븐스의 공격이 진짜 터지면 답이 없구나 하는 감상이었다. 첫 5번의 공격권에서 레이븐스는 4개의 터치다운을 만들었고, 터치다운을 하지 못한 공격권조차 59야드를 전진하면서 엄청난 공격력을 보여주었다. 전반이 종료하기 전까지 레이븐스는 모든 플레이의 시도당 전진야드가 9.3야드에 달할정도로 어마어마했는데... 즉 거의 모든 퍼스트다운마다 퍼스트다운을 또 갱신하고 있는 셈이다. 더욱이나 무서운 건, 이런 엄청난 공격력이 패스와 러닝 양쪽에서 모두 발휘되고 있다는 것이다.<\/p><p>&lt;전반 종료전까지 레이븐스의 공격 스탯&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>구분<\/th><th class=\"r\">플레이회수<\/th><th class=\"r\">야드<\/th><th class=\"r\">플레이당<\/th><th class=\"r\">EPA/플레이<\/th><\/tr><\/thead><tbody><tr><td>패스<\/td><td class=\"r\">18<\/td><td class=\"r\">214<\/td><td class=\"r\">11.89<\/td><td class=\"r\">+0.344<\/td><\/tr><tr><td>러닝<\/td><td class=\"r\">17<\/td><td class=\"r\">112<\/td><td class=\"r\">6.59<\/td><td class=\"r\">+0.420<\/td><\/tr><tr><td>총합<\/td><td class=\"r\">35<\/td><td class=\"r\">326<\/td><td class=\"r\">9.31<\/td><td class=\"r\">+0.381<\/td><\/tr><\/tbody><\/table><\/div><p>우리 모두 최근 몇년 NFL 판에서 가장 큰 성장을 보인 선수로 조쉬 알렌을 뽑는데, 라마 잭슨도 이에 못지 않다. 데뷔시즌에 러닝 능력을 필두로 MVP를 수상했고, 그가 러닝능력의 반만큼만 패스 능력을 키울 수 있다면 리그에 본적도 없는 어마어마한 선수가 될거라고 했었다. 쿼터백의 패스능력을 키우는 것 자체가 워낙 어려운일이라 다소 비관적으로 보는 사람이 많았는데 라마잭슨은 몇 해전에 MVP를 또 한번 타면서 그 성장을 해냈다.<\/p><p>그리고 이번 시즌 개막전부터 그 기세를 이어나가고 있다. 특히나 팀의 1번 리시버인 제이 플라워스가 있을 때, 레이븐스의 패싱게임 폭발력은 어마어마했다. 제이 플라워스는 사실 175cm의 작은 키를 가지고 있어 팀의 1번 리시버 역할을 수행하기에는 어려움이 있다. 외곽에서 1대1을 이겨준다기보다는 내곽에서 민첩함을 활용한 슬롯 리시버로서의 한계가 있는 선수인데, 최근 NFL의 대세는 이런 슬롯 리시버들이 팀의 1번 리시버역할을 수행하고 있다는 것이다. 대표적으로 라이언스의 아몬라 세인트 브라운이나, 시호크스의 JSN이 있다. 그리고 이번 게임에서 제이 플라워스는 올해는 나의 차례다 라고 외치듯이 5번의 캐치만으로 150야드를 만들어내면서 절정의 폼을 보여주었다. 특히나 경기 중간에 햄스트링 부상으로 경기에서 빠졌음에도 기록한 성적이라는 점에서 더욱 이번 시즌이 기대가 된다.<\/p><p>또 하나, 이번 게임 레이븐스 공격에서 재밌는 것은 바로 언더센터의 활용이다. 레이븐스의 신임 공격코치는 데클란 도일이다. 데클란 도일은 브롱코스의 숀 페이튼 밑에서 수학하고, 작년에는 시카고 베어스의 벤 존슨 공격코치로 있던 사람이다. 그리고 벤 존슨의 시카고 베어스는 러닝에 굉장히 큰 강세를 준, 특히나 언더센터에 굉장히 큰 강세를 준 팀이었고, 이런 데클란 도일의 경향성은 이번시즌 개막전에서 여실히 드러났다. 언더센터의 비중이 55% 이상으로 거의 20%가까이 올라갔고, 물론 한경기일 뿐이지만 언더센터에서의 생산성 또한 크게 상승을 한것이 굉장히 고무적이다. 어쩌면 라마 잭슨이 자신의 프로 커리어에서 3번째 변신을 시행하는 시즌이 올해가 될 수 있지 않을까 생각이 든다. (첫번재가 러닝 쿼터백으로서의 대두 -&gt; 두번째가 패서로서의 역량 장착 -&gt; 언더센터로 조연으로서의 역할도 수행가능). &lt;언더센터 성적&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>구분<\/th><th class=\"r\">플레이 비중<\/th><th class=\"r\">플레이당 야드<\/th><th class=\"r\">EPA/플레이<\/th><\/tr><\/thead><tbody><tr><td>26시즌<\/td><td class=\"r\">55%<\/td><td class=\"r\">7.27<\/td><td class=\"r\">+0.236<\/td><\/tr><tr><td>25시즌<\/td><td class=\"r\">35%<\/td><td class=\"r\">5.82<\/td><td class=\"r\">+0.126<\/td><\/tr><\/tbody><\/table><\/div><p>실제로 25시즌의 35% 언더센터 비중 조차도 커리어 초창기에 10% 미만이었던 것에 비하면 엄청난 상승인데, 이번시즌 50%언저리까지 올라가게되면 레이븐스의 공격력은 더더욱더 무서워질 것이다. 왜냐하면 데릭헨리가 언더센터에서 나오는 아웃사이드 존 러싱을 NFL 역사상 가장 잘하는 선수이기 때문이다.<\/p><p>콜츠의 측면에서 보자면 아쉬움이 좀 생길 수 있다. 첫 공격권을 터치다운으로 결정지으면서 기세를 타는 듯했는데 그 뒤로 인터셉션으로 흐름이 뚝 끊기고는 이후로 공격이 꽉막히고 결정적으로 팀의 믿을맨 역할을 하던 조나단 테일러까지 펌블을 기록하면서, 홈팬들에게 야유를 받는 지경에 이르렀다. 물론 후반전에 조금 폼을 회복하는 듯 했지만, 경기를 뒤집기에는 무리였다.<\/p><p>좋게 볼만한 포인트는 러닝백인 조나단 테일러이다. 리그의 특급 러닝백 중 하나인 조나단 테일러는 이번 게임에도 100야드 가까이 기록하고 시도당 5.2야드를 할 정도로 준수한 모습을 보여줬는데, 그 중에서도 그의 가장 큰 장기는 결정력이다. 이 선수가 터치다운을 만드는 능력은 어마어마한데, 전년도에 18개의 터치다운을 기록하면서, 리그의 모든 선수들 중에 가장 많은 득점을 얻어냈고, 이런 결정력은 이번 경기에서도 그대로 발현되어 2개의 터치다운을 기록하면서 콜츠의 공격을 책임져줬다.<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>러닝시도<\/th><th class=\"r\">러싱야드<\/th><th class=\"r\">시도당 러싱야드<\/th><th class=\"r\">러싱터치다운<\/th><th class=\"r\">캐치<\/th><th class=\"r\">리시빙야드<\/th><\/tr><\/thead><tbody><tr><td>19<\/td><td class=\"r\">98<\/td><td class=\"r\">5.2<\/td><td class=\"r\">2<\/td><td class=\"r\">3<\/td><td class=\"r\">23<\/td><\/tr><\/tbody><\/table><\/div><p>하지만 그의 가장 아쉬운 점은 묘하게 중요한 순간에 실수가 나온다는 점이다. 이번 경기에서도 게임의 기세가 왔다갔다하는 시점에 펌블이 나오면서 승리의 기세가 훅하고 넘어 가버렸는데, 이게 더 크게 아쉽게 다가오는 이유는 콜츠의 패싱게임이 전년도 고점과는 거리가 먼 퍼포먼스라 테일러에 대한 의존도가 더 크기 때문이다. 어쩌면, 이 패싱게임의 부진이 콜츠 팬들 입장에서 가장 큰 걱정거리일 수 있다. 다니엘 존스, 알렉 피어스 (4캐치, 61야드)라는 어쩌면 확실히 검증되었다고 하기에는 어려운 2명의 선수들에게 굉장히 큰 기대를 걸며 대형계약을 안겨주었는데, 이들이 오늘과 같은 활약을 보이게 된다면 굉장히 시즌이 어려울 수 있다.<\/p><p>&lt;다니엘 존스 성적&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>패스성공<\/th><th class=\"r\">패스시도<\/th><th class=\"r\">성공률<\/th><th class=\"r\">패싱야드<\/th><th class=\"r\">터치다운<\/th><th class=\"r\">인터셉션<\/th><\/tr><\/thead><tbody><tr><td>19<\/td><td class=\"r\">31<\/td><td class=\"r\">61.3%<\/td><td class=\"r\">166<\/td><td class=\"r\">1<\/td><td class=\"r\">1<\/td><\/tr><\/tbody><\/table><\/div>","401872660":"<p>전년도 플레이오프 진출을 한 강팀간의 대결인 만큼 마지막의 마지막까지 승부를 알수 없는 짜릿한 승부였다. 특히나 2쿼터 종료 직전, 양팀이 엄청나게 빠른 속도로 치고 받은 득점전도 멋졌고, 양 팀의 공수에서 많은 슈퍼플레이가 나오면서 매우 재밌는 경기가 되었다. 텍산스의 마지막 공격권, 터치다운을 하면 게임을 승리할 수 있는 상황에서 빌스 수비의 슈퍼플레이가 나오면서 빌스의 승리로 마무리 되었다.<\/p><p>이번 게임은 빌스의 팬들이 바라는 모든 것이 나온 경기였다. 러닝 게임이 중요한 순간에 충분히 강력한 모습을 보여주었고(압도적이 아니라 하더라도), 패스게임에서도 맨투맨으로는 리그에서 가장 강한 팀일 수 있는 휴스턴 텍산스를 상대로 패싱야드만 300야드 이상 때려박았다. 지난 몇 년간 빌스의 가장 큰 고민거리는 패스게임에서 상대 수비가 맨투맨으로 나오면 조쉬알렌의 다리에만 의존한다는 것이었고, 수비가 강한 팀을 만날수록 이런 경향이 더 심해졌다는 것이다. 이번 게임에서  보여준 모습대로라면 빌스는 그 약점을 극복한 한 것으로 보인다.<\/p><p>300야드 이상 패스게임의 주역은 새로이 영입한 DJ 무어와 부상에서 회복한 타이트엔드 달튼 킨케이드였다(조쉬 알렌의 압도적 경기력은 이제 상수와 같아서 따로 언급하지 않겠다).<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>선수<\/th><th class=\"r\">캐치수<\/th><th class=\"r\">리시빙야드<\/th><th class=\"r\">리시빙 터치다운<\/th><\/tr><\/thead><tbody><tr><td>DJ 무어<\/td><td class=\"r\">5<\/td><td class=\"r\">100<\/td><td class=\"r\">1<\/td><\/tr><tr><td>달튼 킨케이드<\/td><td class=\"r\">5<\/td><td class=\"r\">130<\/td><td class=\"r\">0<\/td><\/tr><\/tbody><\/table><\/div><p>DJ 무어는 이번 시즌에 그를 데리고 오면서 기대한 모든 것을 그대로 보여주었다. 전성기 때처럼 외곽에서 매번 1대1로 이겨주는 선수는 아니지만, 중요한 순간 그리고 기회가 생길 때 외곽에서 이겨줄 수 있을만한 선수에, 러닝게임에서도 블로킹역할을 정말 충실히 잘해주었다. 하지만 빌스팬들이 더욱 기대하는 선수는 타이트엔드 달튼 킨케이드일 것 같다. 부상 때문에 기대만큼 성장하지 못했던 지난 3년인데, 이번 게임에서 자신이 왜 1라운드 픽인지를 보여주었다. 193cm에 111kg라는 압도적인 체격과 함께 엄청난 운동능력과 기술적인 루트러닝 능력을 활용해 상대가 누가 오든간에 미스매치를 만들어버렸는데, 데릭 스팅리, 리드 블랭킨십, 카마리 래써털라는 수준급의 텍산스 2선수비수들을 1대1 상황에서 돌아가면서 털어버리면서, 이 3명과 1대1 상황에서만 113야드를 기록하는 기염을 토해냈다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/3JjxQXXHaY4\" title=\"YouTube\"><\/iframe><\/div><p>단순히 개인의 퍼포먼스를 넘어서 팀의 전술적으로도 달튼 킨케이드의 약진은 굉장히 의미하는 바가 크다. 바로 빌스가 13 퍼스널 전술을 부담없이 펼칠 수 있게 되었다는 것이다. 13퍼스널은 1명의 러닝백 3명의 타이트엔드 1명의 리시버가 필드에 올라가는 공격전술인데, 선수 구성에서 보면 바로 알 수 있듯이 러닝에 극단적으로 치우친 전술이고 이는 빌스의 '강력한 오라인', '조쉬 알렌', '제임스 쿡'과 궁합이 굉장히 좋은 전술구성이다. 다만 리시버가 1명일 뿐이기 때문에, 패스게임이 취약한 것이 약점이라, 리시버가 특급이거나 타이트엔드쪽에서 패스게임에서 리시버만큼이나 존재감을 낼 선수가 필요하다. 그리고 달튼 킨케이드가 이 역할을 수행할 수 있게 되면서 실제 이번 게임에서 버팔로 빌스가 13퍼스널을 선택하는 비중이 지난시즌 대비 훨씬 증가했고 시즌 내내 유지될 가능성이 높다. &lt;13퍼스널의 성적&gt;<\/p><div class=\"mdtw\"><table class=\"mdt\"><thead><tr><th>항목<\/th><th>전체 스냅대비 비중<\/th><\/tr><\/thead><tbody><tr><td>25시즌<\/td><td>5.1%<\/td><\/tr><tr><td>26시즌<\/td><td>40.4%<\/td><\/tr><\/tbody><\/table><\/div><p>그리고 경기 극후반 터치다운 플레이에서는 킨케이드의 존재감에 더욱 더 느낄 수 있다(아래 영상 참고). 경기내내 필드를 가로지르며 빅플레이를 만들던 달튼 킨케이드를 최후방 수비는 이를 의식할 수 밖에 없었고, 외곽의 리시버가 수비를 제껴버리는 순간을 조쉬알렌은 놓치지 않았다.<\/p><div class=\"yt\"><iframe loading=\"lazy\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"accelerometer; clipboard-write; encrypted-media; picture-in-picture\" src=\"https://www.youtube-nocookie.com/embed/NTcOydZK5vw\" title=\"YouTube\"><\/iframe><\/div><p>텍산스 측면에서는 아쉬울 경기였다. 자신들의 장기였던 수비에서 36점이나 내주면서 자존심을 상당히 구겼을 테지만, 이는 빌스라는 팀의 퍼포먼스를 생각할 때 시즌이 지날수록 재평가를 받을 가능성이 높다. 선수들의 클래스는 여전히 높았기에 일희일비할 것은 없어보인다. 공격쪽에서도 긍정적으로 볼만한 포인트들이 많았다. CJ 스트라우드가 마지막 순간에 해내지 못해서 속이 상할 팬들도 있겠지만, 그래도 경기 전반적으로 보았을 때 지난해 플레이오프에서 보여줬던 끔찍한 모습은 아니었다. 러닝게임도 데이비드 몽고메리가 합류해서 강해졌다라고 하기에는 어려움이 있지만, 그래도 '우겨넣으면 되긴 된다' 는 수준으로 올라섰다. 무엇보다 니코 콜린스가 그 기대감에 걸맞는 선수로 다시 돌아온듯한 퍼포먼스를 보였다는 점이 매우 긍정적이다.<\/p>"};

function ytActivate(root){
  const rm=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
  (root||document).querySelectorAll(".yt-loop[data-yt-src]:not([data-yt-on])").forEach(el=>{
    el.setAttribute("data-yt-on","");
    const play=()=>{
      const f=document.createElement("iframe");
      f.src=el.getAttribute("data-yt-src");f.title="YouTube";
      f.setAttribute("allow","autoplay; encrypted-media; picture-in-picture");
      f.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
      el.replaceChildren(f);
    };
    if(!rm){play();return;}
    const a=el.querySelector(".yt-poster");
    if(a) a.addEventListener("click",e=>{e.preventDefault();play();});
  });
}

const GEFF=new Set(["thirdDownEff","fourthDownEff","redZoneAttempts"]);
const GPAIR=new Set(["sacksYardsLost","totalPenaltiesYards"]);
function gnum(n,v){
  if(v==null) return null;
  const s=String(v).trim(), m=s.match(/^(-?\d+)\s*-\s*(-?\d+)$/);
  if(GEFF.has(n)) return (m&&+m[2]>0)?+m[1]/+m[2]:null;
  if(GPAIR.has(n)) return m?+m[2]:null;
  const x=Number(s.replace(/,/g,""));
  return Number.isFinite(x)?x:null;
}

const gLogo=ab=>`/photos/logo_${esc(ESPN2NFL[ab]||ab)}.png`;
const GAPI="https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const G=(typeof window.NFL_GAMES!=="undefined")?window.NFL_GAMES:null;
const WEEKS=(G&&Array.isArray(G.weeks))?G.weeks:[];

// 실시간 응답과 구운 자료는 열 이름이 다릅니다. 들어오는 즉시 한 모양으로
// 맞춰 두면 그리는 쪽은 어디서 온 자료인지 몰라도 됩니다.
function gNorm(x){
  const ts=((x||{}).boxscore||{}).teams;
  if(ts) return ts.map(t=>({ab:t.team.abbreviation,ha:t.homeAway,
    stats:(t.statistics||[]).map(s=>({n:s.name,v:s.displayValue,lb:s.label}))}));
  return Array.isArray(x)?x:null;
}
function gRow(ev){
  const c=ev.competitions[0], st=ev.status.type, sd={};
  c.competitors.forEach(x=>sd[x.homeAway]=x);
  if(!sd.home||!sd.away) return null;
  const one=x=>({ab:x.team.abbreviation,sc:x.score,w:!!x.winner});
  const r={id:ev.id,date:ev.date,wk:(ev.week||{}).number,st:st.state,
    done:!!st.completed,lb:st.shortDetail||st.detail,
    away:one(sd.away),home:one(sd.home)};
  // 대진이 아직 안 정해진 포스트시즌 자리는 목록에서 뺍니다.
  return (r.away.ab==="TBD"||r.home.ab==="TBD")?null:r;
}

// 세션 캐시. 한 번 받은 주·경기는 다시 안 부릅니다.
// sessionStorage 는 file:// 에서 막히는 브라우저가 있어 되면 쓰고 아니면 맙니다.
const GMEM=new Map();
function gStore(k,v){ try{sessionStorage.setItem("nflg:"+k,JSON.stringify(v))}catch(e){} }
function gLoad(k){ try{return JSON.parse(sessionStorage.getItem("nflg:"+k)||"null")}catch(e){return null} }

// 실시간이 먼저, 구운 자료는 예비입니다 — 그 반대가 아닙니다.
// 다만 2026-08 현재 ESPN 앞단(Akamai)이 브라우저에서 온 요청을 403 으로
// 끊습니다. curl·python 은 200 인데 브라우저만 막혀서, 실제로는 구운 자료가
// 늘 쓰입니다. 그래서 한 번 막히면 그 세션에서는 더 두드리지 않습니다 —
// 주나 경기를 누를 때마다 실패할 요청을 보내 봐야 콘솔만 더럽히고 느려집니다.
let gLive=true;
async function gFetch(url,key){
  const hit=GMEM.get(key)||gLoad(key);
  if(hit){ GMEM.set(key,hit); return hit; }
  if(!gLive) return null;
  try{
    const r=await fetch(url,{cache:"no-store"});
    if(r.ok){ const j=await r.json(); GMEM.set(key,j); gStore(key,j); return j; }
  }catch(e){}
  gLive=false;                          // 차단은 경기별이 아니라 출처 전체입니다
  return null;
}

let widx=-1, GLIST=[], GSRC="", gSel=null;
// 킥오프는 UTC 로 오는데 그대로 잘라 쓰거나 보는 사람 시간대로 바꾸면 날짜가
// 하루 밀립니다 (11/09 18:00Z 경기가 한국에서는 11/10). NFL 경기 날짜는 미국
// 동부 기준이라 거기에 맞춥니다.
// 목록의 날짜는 M/D 로 줄입니다. 보드에서 쓰던 en-CA 는 같은 옵션으로
// "08-27" 을 내놓는데, 좁아진 목록 칸에서는 그 8px 이 줄바꿈을 만듭니다.
// 시간대와 값은 그대로고 표기만 짧아집니다.
function gWhen(iso){
  const d=new Date(iso);
  if(isNaN(d)) return "";
  try{ return d.toLocaleDateString("en-US",{timeZone:"America/New_York",
    month:"numeric",day:"numeric"}); }
  catch(e){ return String(iso).slice(5,10); }
}
// 아직 안 한 경기는 킥오프 시각을 답니다. ESPN 의 shortDetail("9/13 - 1:00 PM
// EDT")은 목록 칸에 안 들어가서, 같은 값을 같은 시간대로 줄여 적습니다.
// 원문은 title 로 남겨 마우스를 올리면 그대로 보입니다.
function gKick(iso){
  const d=new Date(iso);
  if(isNaN(d)) return "";
  try{ return d.toLocaleString("en-US",{timeZone:"America/New_York",
    month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit",hour12:false})
    .replace(",",""); }
  catch(e){ return gWhen(iso); }
}

function gListHTML(){
  if(!GLIST||!GLIST.length) return `<div class="gnote">이 주의 경기 목록이 없습니다.</div>`;
  return GLIST.map(g=>{
    const sd=t=>`<span class="gs${t.w?" w":""}"><img src="${gLogo(t.ab)}" alt=""
        onerror="this.style.visibility='hidden'"><b>${esc(t.ab)}</b>
        <i>${g.done?esc(t.sc):"–"}</i></span>`;
    const meta=g.done?gWhen(g.date):gKick(g.date);
    return `<div class="grow" role="button" tabindex="0" data-g="${esc(g.id)}"
        aria-pressed="${g.id===gSel}">${sd(g.away)}<span class="gat">@</span>${sd(g.home)}
      <span class="gw" title="${esc(g.lb||"")}">${esc(meta)}</span></div>`;
  }).join("");
}

function gHeadHTML(g,box){
  const th=(sd,ab,who)=>`<span class="gth${sd.w?" w":""}">
    <img src="${gLogo(ab)}" alt="" onerror="this.style.visibility='hidden'">
    <b>${esc(ab)}</b><i>${g.done?esc(sd.sc):"–"}</i>
    <small>${who}</small></span>`;
  const ab=(t,f)=>(t&&t.ab)?t.ab:f;
  return `<div class="ghead"><span class="gthr">`
    + th(g.away,ab(box&&box[0],g.away.ab),"AWAY")
    + th(g.home,ab(box&&box[1],g.home.ab),"HOME") + `</span></div>`;
}

function gTableHTML(g,box){
  const A=box.find(t=>t.ha==="away")||box[0], H=box.find(t=>t.ha==="home")||box[1];
  const mk=t=>{const m=new Map();(t.stats||[]).forEach(s=>{if(!m.has(s.n))m.set(s.n,s)});return m};
  const ma=mk(A), mh=mk(H), used=new Set();
  let rows="";
  for(const [lv,lb,n,dir] of GROWS){
    const a=ma.get(n), h=mh.get(n);
    if(!a&&!h) continue;                 // 응답에 아예 없는 줄은 접습니다
    used.add(n);
    const va=gnum(n,a&&a.v), vh=gnum(n,h&&h.v);
    let ca="",ch="";
    if(dir&&va!=null&&vh!=null&&va!==vh){ if((va>vh)===(dir>0)) ca="on"; else ch="on"; }
    rows+=`<div class="gr lv-${lv}"><span class="gl">${esc(lb)}</span>
      <span class="gv ${ca}">${esc(a?a.v:"—")}</span>
      <span class="gv ${ch}">${esc(h?h.v:"—")}</span></div>`;
  }
  // 표가 못 받아 준 항목은 label 그대로 아래에 붙입니다. 목록은 엔드포인트가
  // 문서화돼 있지 않아 언제든 늘어날 수 있다는 전제로 만듭니다.
  const ex=[];
  for(const s of [...(A.stats||[]),...(H.stats||[])])
    if(!used.has(s.n)&&!ex.some(e=>e.n===s.n)) ex.push(s);
  if(ex.length) rows+=`<div class="gr xhd"><span class="gl">
      표에 없는 항목 — ESPN 이 새로 넣었거나 이름이 바뀐 것</span><span></span><span></span></div>`
    + ex.map(s=>`<div class="gr lv-m"><span class="gl">${esc(s.lb||s.n)}</span>
        <span class="gv">${esc((ma.get(s.n)||{}).v??"—")}</span>
        <span class="gv">${esc((mh.get(s.n)||{}).v??"—")}</span></div>`).join("");

  return gHeadHTML(g,[A,H])
    + `<div class="gtab">${rows}</div>
    <div class="gnpn"><b>패싱</b>은 ESPN 의 <b>net</b> 패싱야드입니다 — 색으로 잃은
      야드가 이미 빠져 있습니다. 같은 응답의 선수별 패싱야드는 gross 라
      (프로브에서 잰 예: BUF @ MIA 팀 289 · 선수 306) 선수 기록을 더해서
      이 줄과 맞춰 볼 수 없습니다.</div>`;
}

// 리뷰는 빌드 때 박아 둔 HTML 입니다. 없으면 조용히 비웁니다 — 여기서 문장을
// 지어내거나 어디선가 받아 오는 일은 없습니다.
function gReview(g){
  const box=document.getElementById("rvw"), hd=document.getElementById("rvhd");
  if(!box) return;
  if(hd) hd.textContent=g?`${g.away.ab} @ ${g.home.ab}`:"";
  const html=g?REVIEWS[g.id]:null;
  box.innerHTML=html||`<div class="rvnone">이 경기의 리뷰는 아직 없습니다.</div>`;
  if(html) ytActivate(box);             // 반복 클립(유튜브 loop) 켜기
}

async function gShow(id){
  gSel=id;
  const g=(GLIST||[]).find(x=>x.id===id);
  const main=document.getElementById("gbox");
  if(!main) return;
  document.querySelectorAll(".grow").forEach(b=>
    b.setAttribute("aria-pressed",String(b.dataset.g===id)));
  gReview(g);
  if(!g){ main.innerHTML=`<div class="gnote">경기를 고르세요.</div>`; return; }
  if(!g.done){
    main.innerHTML=gHeadHTML(g,null)
      + `<div class="gnote">${esc(g.lb||"")} · 아직 하지 않은 경기라
        기록이 없습니다.</div>`;
    return;
  }
  main.innerHTML=`<div class="gnote">불러오는 중…</div>`;
  // 실시간이 먼저, 구워 둔 자료가 예비입니다 — 순서는 보드에 있던 그대로입니다.
  let box=gNorm(await gFetch(`${GAPI}/summary?event=${encodeURIComponent(id)}`,"box:"+id));
  if(!box && G && G.box && G.box[id]) box=gNorm(G.box[id]);
  if(gSel!==id) return;                  // 그 사이 다른 경기를 눌렀으면 버립니다
  main.innerHTML = box ? gTableHTML(g,box)
    : `<div class="gnote">기록을 받지 못했습니다 — ESPN 에 닿지 않고
        games.js 에도 이 경기가 없습니다.</div>`;
}

// 한 주를 엽니다. 실시간 스코어보드가 그 주를 주면 그걸 쓰고, 아니면 구워 둔
// 목록을 씁니다 — 보드에 있던 순서 그대로입니다.
async function gWeek(i){
  widx=i;
  const w=WEEKS[i];
  if(!w) return;
  const ls=document.getElementById("glist"), hd=document.getElementById("ghd");
  GLIST=(w.games||[]).slice(); GSRC="baked";
  const live=await gFetch(
    `${GAPI}/scoreboard?dates=${encodeURIComponent(G.season)}`
    +`&seasontype=${w.st}&week=${w.wk}`,`sb:${w.st}:${w.wk}`);
  if(widx!==i) return;                   // 그 사이 다른 주를 골랐으면 버립니다
  const rows=((live||{}).events||[]).map(gRow).filter(Boolean);
  if(rows.length){ GLIST=rows; GSRC="live"; }
  GLIST.sort((a,b)=>String(a.date).localeCompare(String(b.date))||
                    String(a.id).localeCompare(String(b.id)));
  // 그 주에서 마지막으로 끝난 경기를 먼저 엽니다. 하나도 안 끝났으면 첫 경기.
  const done=GLIST.filter(g=>g.done);
  gSel=(done.length?done[done.length-1]:GLIST[0]||{}).id||null;
  if(hd) hd.innerHTML=`경기<em>${esc(w.lb)} · ${GLIST.length}경기</em>`;
  if(ls) ls.innerHTML=gListHTML();
  gShow(gSel);
}

const wsel=document.getElementById("week"), wsub=document.getElementById("wsub");
if(!WEEKS.length){
  document.getElementById("wcols").innerHTML=
    `<div class="pending">경기 자료가 아직 없습니다 —
      build_depthcharts.py --games 로 games.js 를 구우면 채워집니다.</div>`;
}else{
  wsel.innerHTML=WEEKS.map((w,i)=>`<option value="${i}">${esc(w.lb)}</option>`).join("");
  // 기본 = 결과가 있는 마지막 주. games.js 가 구울 때 정해 둔 값을 먼저 보고,
  // 없으면 여기서 다시 찾습니다.
  let def=-1;
  if(G.cur) def=WEEKS.findIndex(w=>w.st===G.cur.st&&w.wk===G.cur.wk);
  if(def<0) for(let i=0;i<WEEKS.length;i++)
    if((WEEKS[i].games||[]).some(g=>g.done)) def=i;
  if(def<0) def=0;
  wsel.value=String(def);
  if(wsub) wsub.textContent=`${G.season} 시즌`+(G.stamp?` · 자료 ${G.stamp}`:"");
  wsel.onchange=()=>gWeek(+wsel.value);
  gWeek(def);
}

// 목록 클릭은 칸에 위임합니다 — 목록을 다시 그려도 배선이 안 끊깁니다.
const wcols=document.getElementById("wcols");
wcols.addEventListener("click",e=>{
  const r=e.target.closest&&e.target.closest(".grow");
  if(r) gShow(r.dataset.g);
});
wcols.addEventListener("keydown",e=>{
  const r=e.target.closest&&e.target.closest(".grow");
  if(r&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); gShow(r.dataset.g); }
});
</script>
</body>
</html>
